<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 19 finished board</title>
  <desc>A whiteboard showing what the teacher should have written by the end of the concept segment: the split arithmetic for thirty cards, the check that twenty-four plus six is thirty, and the golden rule that a test example is never trained on.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">What the board should look like at minute 26</text>

    <rect x="30" y="54" width="740" height="300" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>

    <text x="56" y="94" font-size="18" fill="#14202B">30 photos&#160;&#160;-&gt;&#160;&#160;SHUFFLE&#160;&#160;-&gt;&#160;&#160;deal 24 / 6</text>

    <line x1="56" y1="112" x2="744" y2="112" stroke="#C7CDD4" stroke-width="1.5"/>

    <g font-size="18" fill="#14202B">
      <text x="56" y="146">test&#160;&#160;= 0.20 x 30 = 6</text>
      <text x="56" y="176">train = 30 - 6&#160;&#160;&#160;&#160;&#160;= 24</text>
      <text x="56" y="206">check: 24 + 6 = 30</text>
    </g>

    <rect x="420" y="126" width="324" height="90" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="582" y="154" font-size="18" fill="#14202B" text-anchor="middle">training set = studies these</text>
    <text x="582" y="184" font-size="18" fill="#14202B" text-anchor="middle">test set = hidden, opened once</text>

    <line x1="56" y1="228" x2="744" y2="228" stroke="#C7CDD4" stroke-width="1.5"/>

    <rect x="56" y="244" width="688" height="52" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="277" font-size="24" fill="#14202B" text-anchor="middle">RULE: a test example is NEVER trained on. Not once.</text>

    <text x="56" y="326" font-size="18" fill="#14202B">split ratio: 80 / 20&#160;&#160;&#160;&#160;hold out = put aside before training</text>

    <text x="400" y="380" font-size="14" fill="#55636F" text-anchor="middle">Leave this on the board. You will point at the RULE line four more times today.</text>
  </g>
</svg>
