x="500" y="216" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="512" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" dominant-baseline="central">C  this number is:</text><rect x="500" y="270" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="512" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" dominant-baseline="central">D  this number is:</text><text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Fifteen test photos, five of each fruit. Rows are the truth. Columns are what the model said.</text>
