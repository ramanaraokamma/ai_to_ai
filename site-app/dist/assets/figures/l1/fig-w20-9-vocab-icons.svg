<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The five new words of Week 20</title>
  <desc>Five picture tiles. Generalizing shows a tick on a new photo. Memorizing shows a photo being copied exactly. The gap shows two bars with an arrow between them. Per class accuracy shows three small separate bars. Percentage point shows two percentages with a labelled gap.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">The five new words of Week 20</text>

    <rect x="24" y="58" width="146" height="200" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <rect x="54" y="86" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="80" y="118" font-size="12" fill="#55636F" text-anchor="middle">NEW</text>
    <g transform="translate(104,96) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="97" y="176" font-size="18" fill="#14202B" text-anchor="middle">generalizing</text>
    <text x="97" y="204" font-size="12" fill="#55636F" text-anchor="middle">works on photos it</text>
    <text x="97" y="222" font-size="12" fill="#55636F" text-anchor="middle">has never seen</text>
    <text x="97" y="244" font-size="12" fill="#1B7A4B" text-anchor="middle">the one you want</text>

    <rect x="178" y="58" width="146" height="200" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <rect x="204" y="86" width="46" height="46" rx="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="256" y="86" width="46" height="46" rx="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="253" y="150" font-size="12" fill="#55636F" text-anchor="middle">these exact two, learnt by heart</text>
    <text x="251" y="176" font-size="18" fill="#14202B" text-anchor="middle">memorizing</text>
    <text x="251" y="204" font-size="12" fill="#55636F" text-anchor="middle">works on the exact</text>
    <text x="251" y="222" font-size="12" fill="#55636F" text-anchor="middle">photos it studied</text>
    <text x="251" y="244" font-size="12" fill="#CC2B1D" text-anchor="middle">falls apart on new ones</text>

    <rect x="332" y="58" width="146" height="200" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="360" y="82" width="34" height="62" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="422" y="110" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <line x1="400" y1="90" x2="400" y2="112" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
    <polyline points="394,106 400,114 406,106" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="405" y="176" font-size="18" fill="#14202B" text-anchor="middle">the gap</text>
    <text x="405" y="204" font-size="12" fill="#55636F" text-anchor="middle">training score minus</text>
    <text x="405" y="222" font-size="12" fill="#55636F" text-anchor="middle">test score</text>
    <text x="405" y="244" font-size="12" fill="#6D28D9" text-anchor="middle">a sign of memorising</text>

    <rect x="486" y="58" width="146" height="200" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="512" y="82" width="26" height="62" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="546" y="94" width="26" height="50" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="580" y="120" width="26" height="24" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <line x1="506" y1="144" x2="612" y2="144" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <text x="559" y="164" font-size="12" fill="#55636F" text-anchor="middle">one score per class</text>
    <text x="559" y="190" font-size="18" fill="#14202B" text-anchor="middle">per-class</text>
    <text x="559" y="212" font-size="18" fill="#14202B" text-anchor="middle">accuracy</text>
    <text x="559" y="238" font-size="12" fill="#55636F" text-anchor="middle">breaks the average open</text>

    <rect x="640" y="58" width="146" height="200" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="678" y="98" font-size="18" fill="#14202B" text-anchor="middle">33.3%</text>
    <text x="750" y="98" font-size="18" fill="#14202B" text-anchor="middle">73.3%</text>
    <line x1="678" y1="116" x2="750" y2="116" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
    <polyline points="742,110 750,116 742,122" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="713" y="142" font-size="14" fill="#C42B8C" text-anchor="middle">40 points</text>
    <text x="713" y="176" font-size="18" fill="#14202B" text-anchor="middle">percentage</text>
    <text x="713" y="198" font-size="18" fill="#14202B" text-anchor="middle">point</text>
    <text x="713" y="224" font-size="12" fill="#55636F" text-anchor="middle">the unit you get when</text>
    <text x="713" y="242" font-size="12" fill="#55636F" text-anchor="middle">you subtract two %</text>

    <text x="400" y="300" font-size="14" fill="#55636F" text-anchor="middle">Accuracy is correct divided by total. Everything else on this page is about not being fooled by it.</text>
    <text x="400" y="330" font-size="14" fill="#55636F" text-anchor="middle">Write the fraction first: 75% could be 3 out of 4 or 300 out of 400.</text>
  </g>
</svg>
