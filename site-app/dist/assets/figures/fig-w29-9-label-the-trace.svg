  <text x="72" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <line x1="96" y1="258" x2="436" y2="258" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="72" cy="285" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="72" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <line x1="96" y1="290" x2="436" y2="290" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="72" cy="317" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="72" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <line x1="96" y1="322" x2="436" y2="322" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="72" cy="349" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="72" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <line x1="96" y1="354" x2="436" y2="354" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="72" cy="381" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="72" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <line x1="96" y1="386" x2="436" y2="386" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="250" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One row of a trace tells you everything that happened at one step.</text>
</svg>
