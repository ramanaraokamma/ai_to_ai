<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One table, two cuts, three piles</title>
  <desc>A single wide bar cut to scale into train 1200 at 60 percent, validation 400 at 20 percent and test 400 at 20 percent, with 1200 plus 400 plus 400 equals 2000 printed beneath. A table beside it gives each pile its late count: train 345 of 1200, validation 115 of 400, test 115 of 400, every one of them 0.2875. Underneath: 345 plus 115 plus 115 equals 575, and 575 divided by 2000 is 0.2875.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One table, two cuts, three piles</text>
  <text x="400" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2000 rows after the 20 duplicates are gone</text>
  <rect x="70" y="96" width="396.0" height="56" fill="#D9EAF9" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="466.0" y="96" width="132.0" height="56" fill="#E8C671" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="598.0" y="96" width="132.0" height="56" fill="#F4D5E9" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="70" y="96" width="660" height="56" rx="8" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="268.0" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">train 1200</text>
  <text x="532.0" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">val 400</text>
  <text x="664.0" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">test 400</text>
  <text x="268.0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">60%</text>
  <text x="532.0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">20%</text>
  <text x="664.0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">20%</text>
  <path d="M70 164 V172 H730 V164" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1200 + 400 + 400 = 2000</text>
  <text x="60" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">cut one</text>
  <text x="60" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">peel off 20% and seal it</text>
  <text x="60" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">cut two</text>
  <text x="60" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">split the other 1600 as 75 / 25</text>
  <line x1="598.0" y1="160" x2="598.0" y2="210" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="466.0" y1="160" x2="466.0" y2="210" stroke="#845F00" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <rect x="400" y="214" width="380" height="118" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="420" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">pile</text>
  <text x="600" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end" font-weight="600">rows</text>
  <text x="680" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end" font-weight="600">late</text>
  <text x="762" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end" font-weight="600">late rate</text>
  <line x1="420" y1="244" x2="762" y2="244" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="420" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">train</text>
  <text x="600" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">1200</text>
  <text x="680" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">345</text>
  <text x="762" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0.2875</text>
  <text x="420" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">validation</text>
  <text x="600" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">400</text>
  <text x="680" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">115</text>
  <text x="762" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0.2875</text>
  <text x="420" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">test</text>
  <text x="600" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">400</text>
  <text x="680" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">115</text>
  <text x="762" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0.2875</text>
  <text x="420" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">345 &#247; 1200 = 0.2875 &#183; 115 &#247; 400 = 0.2875</text>
  <text x="400" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">345 + 115 + 115 = 575 late orders, and 575 &#247; 2000 = 0.2875.</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Every pile is 28.75% late. That is what stratify bought you.</text>
</svg>
