<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Twenty Questions, written down</title>
  <desc>A tree of grey question boxes and blue answer boxes. Can you eat it? Yes gives apple. No leads to Is it metal? which leads to Eat with it? giving spoon or key, and to Do you wear it? giving sock or pencil. Every branch is labelled yes or no.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Twenty Questions, written down</text>
  <path d="M340 111 V135.0 H120 V159" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M340 111 V134.0 H540 V157" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M540 195 V218.0 H400 V241" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M540 195 V218.0 H672 V241" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400 279 V303.0 H346 V327" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M400 279 V303.0 H462 V327" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M672 279 V303.0 H618 V327" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M672 279 V303.0 H734 V327" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="134" y="155.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">yes</text>
  <text x="526" y="154.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">no</text>
  <text x="414" y="238.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">yes</text>
  <text x="658" y="238.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">no</text>
  <text x="360" y="323.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">yes</text>
  <text x="448" y="323.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">no</text>
  <text x="632" y="323.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">yes</text>
  <text x="720" y="323.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">no</text>
  <rect x="240.0" y="73" width="200" height="38" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="340" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Can you eat it?</text>
  <rect x="445.0" y="157" width="190" height="38" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="540" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Is it metal?</text>
  <rect x="312.0" y="241" width="176" height="38" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Eat with it?</text>
  <rect x="584.0" y="241" width="176" height="38" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="672" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Do you wear it?</text>
