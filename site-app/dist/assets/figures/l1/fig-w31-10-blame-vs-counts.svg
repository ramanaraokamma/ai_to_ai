<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Looking for a villain, or looking at the counts</title>
  <desc>Two panels. The wrong one shows a child accusing a robot of being unfair on purpose. The right one shows a table of training photo counts, one hundred and eighty three daylight, seventeen lamplight, zero held in a hand, zero patterned background, with the note that nobody was unkind and these counts did it.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Looking for a villain, or looking at the counts</text>
  <rect x="40" y="76" width="330" height="252" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="430" y="76" width="330" height="252" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <g transform="translate(56,90) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="110" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Wrong idea</text>
  <g transform="translate(446,90) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="500" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Right idea</text>
  <g transform="translate(66,140) scale(0.78)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 66 Q50 58 61 66" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="146" y1="184" x2="212" y2="184" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="204,176 220,184 204,192" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(240,140) scale(0.78)">
    <line x1="50" y1="16" x2="50" y2="7" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="5" r="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <rect x="22" y="16" width="56" height="40" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="38" cy="34" r="5" fill="#14202B"/>
    <circle cx="62" cy="34" r="5" fill="#14202B"/>
    <path d="M40 45 Q50 52 60 45" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <rect x="28" y="60" width="44" height="30" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <line x1="28" y1="68" x2="13" y2="78" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="68" x2="87" y2="78" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="75" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  </g>
  <text x="205" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">&#8220;It is being unfair</text>
  <text x="205" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">on purpose.&#8221;</text>
  <rect x="460" y="138" width="270" height="110" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="474" y="163">Bright daylight</text>
    <text x="474" y="187">Lamplight</text>
    <text x="474" y="211">Held in a hand</text>
    <text x="474" y="235">Patterned cloth</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">
    <text x="716" y="163">183</text>
    <text x="716" y="187">17</text>
    <text x="716" y="211">0</text>
    <text x="716" y="235">0</text>
  </g>
  <text x="595" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Nobody was unkind.</text>
  <text x="595" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">These counts did it.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Which of those four numbers is being mean? None of them. That is what makes it hard to fix.</text>
</svg>
