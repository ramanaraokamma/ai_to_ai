<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A block with its parts unnamed: four boxes in a row, a plus circle, and an arc that skips round them</title>
  <desc>Blank block diagram. An input x on the left feeds four empty boxes in a row, ringed 1 to 4, then an arrow ringed 7 into a circle ringed 6, and the circle sends the result out. A long arc ringed 5 leaves x, passes over the four boxes and joins the circle from above. The boxes, the arrows and the circle carry only numbers, no names.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Name the parts of the block</text>
  <circle cx="44" cy="226" r="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="44" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">x</text>
  <rect x="104" y="196" width="100" height="60" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="154" cy="226" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="154" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="228" y="196" width="100" height="60" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="278" cy="226" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="278" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="352" y="196" width="100" height="60" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="402" cy="226" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="402" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="476" y="196" width="100" height="60" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="526" cy="226" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="526" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <line x1="68" y1="226" x2="102" y2="226" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(102 226) rotate(0)"/>
  <line x1="204" y1="226" x2="226" y2="226" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(226 226) rotate(0)"/>
  <line x1="328" y1="226" x2="350" y2="226" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(350 226) rotate(0)"/>
  <line x1="452" y1="226" x2="474" y2="226" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(474 226) rotate(0)"/>
  <line x1="576" y1="226" x2="634" y2="226" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(634 226) rotate(0)"/>
  <circle cx="618" cy="204" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="618" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
  <circle cx="660" cy="226" r="24" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <circle cx="660" cy="226" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="660" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <line x1="686" y1="226" x2="724" y2="226" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(724 226) rotate(0)"/>
  <text x="730" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="start">out</text>
  <path d="M44 202 V120 H660 V198" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(660 200) rotate(90)"/>
  <circle cx="352" cy="120" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="352" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Write the number's name on the page: each ring marks one part of the block.</text>
</svg>
