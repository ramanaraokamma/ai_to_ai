<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the blame</title>
  <desc>Six numbered rows, each showing one line of a backward sweep through a 2 to 2 to 1 network on four rows of data, with the shapes going into it and an empty dashed pink box where the result shape goes. Row 1 is dZ2 equals A2 minus y divided by n, from 4 by 1 minus 4 by 1, giving 4 by 1. Row 2 is dW2 equals A1 transpose at dZ2, from 2 by 4 at 4 by 1, giving 2 by 1. Row 3 is db2 equals dZ2 dot sum axis 0 keepdims True, adding down the rows, giving 1 by 1. Row 4 is dA1 equals dZ2 at W2 transpose, from 4 by 1 at 1 by 2, giving 4 by 2. Row 5 is mask equals Z1 greater than 0 as floats, one answer per cell, giving 4 by 2. Row 6 is dW1 equals X transpose at dZ1, from 2 by 4 at 4 by 2, giving 2 by 2. A panel at the bottom asks how many of the eight mask cells are zero and which two rows of the data they came from; the answer is three zeros, from row 2 unit 2 and both units of row 3.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the blame</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Four rows backwards through 2 &#8594; 2 &#8594; 1. Fill in each result shape.</text>

  <rect x="30" y="92" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="116" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">dZ2 = (A2 &#8722; y) / n</text>
  <text x="80" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">(4, 1) &#8722; (4, 1)</text>
  <rect x="348" y="126" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="178" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="202" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">dW2 = A1.T @ dZ2</text>
  <text x="80" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">(2, 4) @ (4, 1)</text>
  <rect x="348" y="212" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="264" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="288" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">db2 = dZ2.sum(axis=0, ...)</text>
  <text x="80" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">adds down the rows, keepdims=True</text>
  <rect x="348" y="298" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="350" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="374" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">dA1 = dZ2 @ W2.T</text>
  <text x="80" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">(4, 1) @ (1, 2)</text>
  <rect x="348" y="384" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="436" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="460" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="465" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">mask = (Z1 &gt; 0).astype(float)</text>
  <text x="80" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">one answer per cell of Z1</text>
  <rect x="348" y="470" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="522" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="546" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="546" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="80" y="551" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">dW1 = X.T @ dZ1</text>
  <text x="80" y="576" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">(2, 4) @ (4, 2)</text>
  <rect x="348" y="556" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="610" width="440" height="66" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="634" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">How many of the eight mask cells are zero, and whose?</text>
  <text x="250" y="656" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">______ zeros &#183; ____________________</text>
</svg>
