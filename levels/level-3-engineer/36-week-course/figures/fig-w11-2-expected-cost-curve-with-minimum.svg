<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The bowl the price list draws and the cheapest place to cut</title>
  <desc>Expected cost plotted against the nine thresholds 0.50, 0.15, 0.12, 0.10, 0.08, 0.06, 0.04, 0.02 and 0.01, with costs 7000, 6500, 6000, 5550, 5620, 5720, 5610, 6610 and 7210 pounds. The curve falls to a bottom and climbs again. The cheapest point, threshold 0.10, is ringed and a callout shows 500 times 11 plus 10 times 5, that is 5500 plus 50, equals 5550. The point at threshold 0.04 is outlined in red because at 5610 it is cheaper than 0.06 at 5720, which is noise from resting on only 14 frauds, not a real second bottom.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The bowl the price list draws</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">and the cheapest place to cut</text>
  <line x1="96" y1="124" x2="96" y2="356" stroke="#14202B" stroke-width="2"/>
  <line x1="96" y1="356" x2="410" y2="356" stroke="#14202B" stroke-width="2"/>
  <line x1="96" y1="345.1" x2="396" y2="345.1" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="88" y="349.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">5500</text>
  <line x1="96" y1="290.6" x2="396" y2="290.6" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="88" y="294.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">6000</text>
  <line x1="96" y1="236.1" x2="396" y2="236.1" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="88" y="240.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">6500</text>
  <line x1="96" y1="181.6" x2="396" y2="181.6" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="88" y="185.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">7000</text>
  <line x1="114" y1="356" x2="114" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="114" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.50</text>
  <line x1="147" y1="356" x2="147" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="147" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.15</text>
  <line x1="180" y1="356" x2="180" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.12</text>
  <line x1="213" y1="356" x2="213" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="213" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.10</text>
  <line x1="246" y1="356" x2="246" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="246" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.08</text>
  <line x1="279" y1="356" x2="279" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="279" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.06</text>
  <line x1="312" y1="356" x2="312" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="312" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.04</text>
  <line x1="345" y1="356" x2="345" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="345" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.02</text>
  <line x1="378" y1="356" x2="378" y2="362" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="378" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.01</text>
  <polyline points="114,181.6 147,236.1 180,290.6 213,339.6 246,332 279,321.1 312,333.1 345,224.1 378,158.7" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="114" cy="181.6" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="147" cy="236.1" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="180" cy="290.6" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="246" cy="332" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="279" cy="321.1" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="312" cy="333.1" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="345" cy="224.1" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="378" cy="158.7" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="213" cy="339.6" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="246" y="398" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">threshold</text>
  <text x="34" y="247" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 34 247)">expected cost</text>
  <rect x="212" y="96" width="264" height="76" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="344" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">cheapest: t = 0.10</text>
  <text x="344" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">500 &#215; 11 + 10 &#215; 5</text>
  <text x="344" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">= 5500 + 50 = 5550</text>
  <line x1="212" y1="150" x2="225" y2="333.6" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="312" cy="333.1" r="5" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3"/>
  <text x="250" y="434" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The bowl is bumpy because it rests on 14 frauds.</text>
  <text x="250" y="456" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">t = 0.04 costs 5610, less than t = 0.06. That is noise, not skill.</text>
</svg>
