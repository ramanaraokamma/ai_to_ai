<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Shape Dominoes, sorted</title>
  <desc>Twelve shape pairs sorted into two piles. Eight multiply: 3 by 2 times 2 by 4 gives 3 by 4; 4 by 2 times 2 by 3 gives 4 by 3; 4 by 3 times 3 by 1 gives 4 by 1; 1 by 3 times 3 by 1 gives 1 by 1; 3 by 1 times 1 by 3 gives 3 by 3; 2 by 2 times 2 by 2 gives 2 by 2; 16 by 750 times 750 by 1 gives 16 by 1; and 2 by 750 times 750 by 16 gives 2 by 16. Four do not, each crossed out with the failing pair named: 4 against 3, 3 against 1, 1 against 5, and 2 against 16. The rule is printed: inner two must match, outer two survive.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Shape Dominoes, sorted</text>
