<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Measure it, or work it out. Same answer.</title>
  <desc>On the left a right-angled triangle joins flower A at the bottom left to flower B at the top right. The flat leg is labelled three point nought across, the upright leg one point two up, and the slanted line is labelled three point two three, the length you get with a ruler. On the right the same answer is reached in four numbered steps: subtract, square each one, add them up, take the square root.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Measure it, or work it out. Same answer.</text>
  <line x1="110" y1="300" x2="320" y2="300" stroke="#55636F" stroke-width="2" stroke-linecap="butt"/>
  <line x1="320" y1="300" x2="320" y2="130" stroke="#55636F" stroke-width="2" stroke-linecap="butt"/>
  <line x1="110" y1="300" x2="320" y2="130" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="110" cy="300" r="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <path d="M320 120 L330 140 L310 140 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="302" y="282" width="18" height="18" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="215" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">3.0 across</text>
  <text x="332" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1.2 up</text>
  <text x="190" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">3.23</text>
  <text x="106" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">A</text>
  <text x="320" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">B</text>
  <text x="215" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">put a ruler on the slanted line</text>
  <text x="215" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and you measure 3.23</text>
  <line x1="400" y1="70" x2="400" y2="366" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="6 5"/>
  <circle cx="462" cy="112" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="462" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="492" y="96" width="268" height="44" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="504" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">subtract</text>
  <text x="504" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">3.0  and  1.2</text>
  <line x1="462" y1="132" x2="462" y2="156" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <circle cx="462" cy="174" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="462" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="492" y="158" width="268" height="44" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="504" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">square each one</text>
  <text x="504" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">9.00  and  1.44</text>
  <line x1="462" y1="194" x2="462" y2="218" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <circle cx="462" cy="236" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="462" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="492" y="220" width="268" height="44" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="504" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">add them up</text>
  <text x="504" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">10.44</text>
  <line x1="462" y1="256" x2="462" y2="280" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <circle cx="462" cy="298" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="462" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="492" y="282" width="268" height="44" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="504" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">square root</text>
  <text x="504" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">3.23</text>
  <text x="626" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no ruler needed, and it works for 13 columns</text>

</svg>
