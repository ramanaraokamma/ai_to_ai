<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The Term 2 ladder, rung by rung</title>
  <desc>A ladder standing on the Term 1 ground line. Nine rungs are labelled from the bottom up: week 10 functions with parameters, week 11 lists, week 12 your own module, week 13 dictionaries, week 14 a list of dicts is a table, week 15 filter and group, week 16 CSV in and out, week 17 arrays with a shape, and week 18 array maths instead of loops. The top rung is highlighted as this week. An arrow above the ladder points on to week 19.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The Term 2 ladder, rung by rung</text>
  <text x="250" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">nine weeks, each one standing on the one below</text>
  <line x1="48" y1="96" x2="48" y2="640" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
  <line x1="452" y1="96" x2="452" y2="640" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="640" x2="472" y2="640" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="250" y="660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Term 1: print, variables, if, loops, your first functions</text>
  <rect x="60" y="582" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="604" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="604" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <text x="116" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Functions that take and give back</text>
  <text x="116" y="617" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">parameters, return, defaults</text>
  <rect x="60" y="524" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="546" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="546" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">11</text>
  <text x="116" y="542" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Many values, one name</text>
  <text x="116" y="559" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">lists, index from 0, append</text>
  <rect x="60" y="466" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="488" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="488" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
  <text x="116" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Your own stats toolkit</text>
  <text x="116" y="501" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">slicing, sorted, import your file</text>
  <rect x="60" y="408" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="430" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">13</text>
  <text x="116" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Labels instead of numbers</text>
  <text x="116" y="443" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">dictionaries, .get with a fallback</text>
  <rect x="60" y="350" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="372" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">14</text>
  <text x="116" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">One dict per row</text>
  <text x="116" y="385" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a list of dicts IS a table</text>
  <rect x="60" y="292" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="314" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">15</text>
  <text x="116" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Filter it, group it, count it</text>
  <text x="116" y="327" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">and print the row count</text>
  <rect x="60" y="234" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="256" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">16</text>
  <text x="116" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The Record Store</text>
  <text x="116" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">CSV out, CSV back, convert on load</text>
  <rect x="60" y="176" width="380" height="44" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="198" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="90" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">17</text>
  <text x="116" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">One number for every score</text>
  <text x="116" y="211" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">arrays, shape, dtype</text>
  <rect x="60" y="118" width="380" height="44" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="140" r="17" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <text x="90" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">18</text>
  <text x="116" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Eight loops retired</text>
  <text x="116" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">arr * 2, arr1 + arr2, arange, zeros</text>
  <text x="250" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">you are here</text>
  <line x1="250" y1="128" x2="250" y2="100" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 100) rotate(-90.0)"/>
  <rect x="148" y="76" width="204" height="26" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="89" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Week 19: down or across?</text>
  <text x="250" y="686" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Anything on this ladder that wobbles is a rung to go back and stand on again.</text>
</svg>
