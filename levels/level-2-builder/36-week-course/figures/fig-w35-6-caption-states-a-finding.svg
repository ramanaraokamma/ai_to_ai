<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A caption states a finding, not a topic</title>
  <desc>Two mirrored chart panels showing the identical scatter of distance against journey time. The crossed one is captioned distance versus time. The ticked one is captioned longer journeys take longer but the dots fan out, with the amount explained given as a number.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A caption states a finding, not a topic</text>
