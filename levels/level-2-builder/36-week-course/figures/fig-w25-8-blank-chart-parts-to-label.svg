<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label this chart</title>
  <desc>An unlabelled line chart with five empty dashed boxes lettered A to E joined to it by leader lines. Box A sits above the frame, box B beside the left-hand axis, box C under the bottom axis, box D points at one hollow dot on the line, and box E points at the frame itself. Nothing is filled in.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label this chart</text>

  <!-- leader lines drawn first so boxes sit on top -->
  <line x1="380" y1="96" x2="380" y2="120" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="196" y1="220" x2="228" y2="220" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="380" y1="316" x2="380" y2="340" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="470" y1="176" x2="596" y2="146" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="540" y1="300" x2="596" y2="286" stroke="#C42B8C" stroke-width="1.5"/>

  <!-- the chart frame, deliberately naked -->
  <rect x="228" y="120" width="304" height="196" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="256" y1="140" x2="256" y2="292" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="256" y1="292" x2="512" y2="292" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="276,266 316,238 356,248 396,204 436,186 476,158" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="276" cy="266" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="316" cy="238" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="356" cy="248" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="396" cy="204" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="436" cy="186" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="476" cy="158" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>

  <!-- A: the title slot -->
  <rect x="252" y="66" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="240" y="81" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="end" dominant-baseline="central">A</text>

  <!-- B: the y label slot -->
  <rect x="40" y="204" width="156" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="118" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">B</text>

  <!-- C: the x label slot -->
  <rect x="252" y="340" width="256" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="240" y="355" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="end" dominant-baseline="central">C</text>

  <!-- D: the marker slot -->
  <rect x="600" y="130" width="164" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="682" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">D</text>

  <!-- E: the frame itself -->
  <rect x="600" y="270" width="164" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="682" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">E</text>

  <text x="400" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Four of these five are words you type. Write which call puts each one there.</text>
</svg>
