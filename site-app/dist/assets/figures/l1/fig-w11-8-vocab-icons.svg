<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 11 words as pictures</title>
  <desc>Four icon cards. A feature is a ruler measuring one column. A feature table is a grid of rows and columns with the last column shaded. A measuring instruction is a written card naming tool, unit and rounding. A class is three labelled bins the answer may go into.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's four words as pictures</text>
  <rect x="24" y="64" width="182" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="216" y="64" width="182" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="408" y="64" width="182" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="600" y="64" width="176" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- feature: a ruler on an apple -->
  <g transform="translate(60,100)">
    <circle cx="52" cy="52" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <path d="M52 18 Q54 6 64 6" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
    <rect x="-2" y="98" width="112" height="20" rx="4" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#845F00" stroke-width="2" stroke-linecap="round">
      <line x1="14" y1="98" x2="14" y2="108"/>
      <line x1="34" y1="98" x2="34" y2="108"/>
      <line x1="54" y1="98" x2="54" y2="108"/>
      <line x1="74" y1="98" x2="74" y2="108"/>
      <line x1="94" y1="98" x2="94" y2="108"/>
    </g>
  </g>
  <text x="115" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">feature</text>
  <text x="115" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one measured</text>
  <text x="115" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">description</text>

  <!-- feature table -->
  <g transform="translate(240,96)">
    <rect x="0" y="0" width="134" height="120" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="100" y="0" width="34" height="120" fill="#DBCEF3" stroke="none"/>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="0" y1="30" x2="134" y2="30"/>
      <line x1="0" y1="60" x2="134" y2="60"/>
      <line x1="0" y1="90" x2="134" y2="90"/>
      <line x1="34" y1="0" x2="34" y2="120"/>
      <line x1="67" y1="0" x2="67" y2="120"/>
    </g>
    <line x1="100" y1="0" x2="100" y2="120" stroke="#6D28D9" stroke-width="3"/>
    <rect x="0" y="0" width="134" height="120" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="117" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle">label</text>
  </g>
  <text x="307" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">feature table</text>
  <text x="307" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one row =</text>
  <text x="307" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one example</text>

  <!-- measuring instruction: a written card -->
  <g transform="translate(430,96)">
    <path d="M6 0 H132 V96 L112 116 H6 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M112 116 V96 H132 Z" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
      <text x="18" y="26">ruler</text>
      <text x="18" y="48">in cm</text>
      <text x="18" y="70">widest point</text>
      <text x="18" y="92">nearest 0.5</text>
    </g>
  </g>
  <text x="499" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">instruction</text>
  <text x="499" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">tool, unit,</text>
  <text x="499" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rounding</text>

  <!-- class: three bins -->
  <g transform="translate(618,110)">
    <path d="M4 22 H44 L40 90 H8 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M52 22 H92 L88 90 H56 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M100 22 H140 L136 90 H104 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
      <text x="24" y="60">dog</text>
      <text x="72" y="60">cat</text>
      <text x="120" y="60">bird</text>
    </g>
    <line x1="4" y1="14" x2="140" y2="14" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="688" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">class</text>
  <text x="688" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one allowed</text>
  <text x="688" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">answer</text>

  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Features go in the columns. The label is the column you cover up.</text>
</svg>
