<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Six icon cards. DataFrame is a small table with a bold header row reading name and runs and a grey index column. Series is a single column of runs values, tinted pink, with a footer reading Name runs, dtype int64. Index is four grey numbered pegs beside four boxes each holding a coat. Column name is the word runs in blue with a tick above the word Runs in red with a cross. NaN is a blue box holding 12 turning into a red box holding NaN, with a note that int64 becomes float64. The sixth card states the rule of the week: head then info, on every table, before anything else.</desc>
