  <rect x="432" y="170" width="320" height="22" rx="4" fill="#F6AEA6"/>
  <text x="436" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">Traceback (most recent call last):</text>
  <text x="436" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">  File "list_surgery.py", line 6</text>
  <text x="436" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    print(scores[4])</text>
  <text x="436" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">IndexError: list index</text>
  <text x="436" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">out of range</text>
  <rect x="424" y="96" width="342" height="158" rx="10" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="388" y1="167" x2="418" y2="181" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(418 181) rotate(25)"/>
  <text x="595" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Read the last line first:</text>
  <text x="595" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">out of range means past the end.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The fix is not a bigger number. It is scores[3], or scores[-1], or one more append.</text>
</svg>
