  <text x="696" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">31.2&#8211;59.4</text>
  <text x="180" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end" dominant-baseline="central">v2 rules</text>
  <line x1="190" y1="302" x2="690" y2="302" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="528" y="296" width="12" height="12" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="543.5" y="296" width="12" height="12" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="559" y="296" width="12" height="12" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="590" y="296" width="12" height="12" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="621.5" y="296" width="12" height="12" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="696" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">68.8&#8211;87.5</text>
  <text x="180" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end" dominant-baseline="central">v3 few-shot</text>
  <line x1="190" y1="328" x2="690" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="659,321 666,334 652,334" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="645" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end" dominant-baseline="central">all six seeds = 93.8</text>
  <text x="440" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">field score, % of 32 boxes (higher is better)</text>
