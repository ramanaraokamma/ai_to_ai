<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Each word asks, shares its attention in a row that adds to 1, and hears a blend of the values</title>
  <desc>Three grids left to right joined by arrows. Step 2, scores, shape (3, 3): rows the, cat, sat are 1, 0, 1 then 0, 1, 1 then 1, 1, 2. Step 3, weights, shape (3, 3), after a softmax of each row: the 0.422, 0.155, 0.422; cat 0.155, 0.422, 0.422; sat 0.212, 0.212, 0.576; every row sums to 1 and the largest in each row is ringed. Step 4, output, shape (3, 2): 0.578, 0.845 then 0.845, 0.578 then 0.788, 0.788. Rows are the query, columns are the key.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One pass of attention on three words</text>
