<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The ice-cream machine rulebook puzzle</title>
  <desc>An ice-cream machine's five rules checked in order, a flavour board showing mango sixty pence in stock, lemon fifty pence sold out and mint seventy pence in stock, and five customers A to E each with a flavour, an amount of money and an age, with an empty box beside each for the answer.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="40" font-size="24" fill="#14202B" text-anchor="middle">The ice-cream machine rulebook</text>

    <rect x="30" y="58" width="440" height="198" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
    <text x="250" y="82" font-size="12" fill="#55636F" text-anchor="middle">CHECK IN ORDER. STOP AT THE FIRST RULE THAT FIRES.</text>
    <g font-size="15" fill="#14202B">
      <text x="50" y="110">R1  IF the flavour is not on the board</text>
      <text x="50" y="130" font-size="14" fill="#55636F">        THEN say "WE DON'T HAVE THAT"</text>
      <text x="50" y="156">R2  IF the customer is under 5 years old</text>
      <text x="50" y="176" font-size="14" fill="#55636F">        THEN say "SMALL SIZE ONLY"</text>
      <text x="50" y="202">R3  IF that flavour's tub is empty</text>
      <text x="50" y="222" font-size="14" fill="#55636F">        THEN say "SOLD OUT"</text>
      <text x="50" y="244">R4  IF money is enough, serve the cone.</text>
      <text x="50" y="263">R5  otherwise: "ADD MORE".</text>
    </g>

    <rect x="30" y="272" width="440" height="106" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
    <path d="M30 282 A10 10 0 0 1 40 272 H460 A10 10 0 0 1 470 282 V300 H30 Z" fill="#D9EAF9" stroke="none"/>
    <line x1="30" y1="300" x2="470" y2="300" stroke="#1F6FB2" stroke-width="3"/>
    <g font-size="14" fill="#14202B">
      <text x="50" y="292">FLAVOUR</text>
      <text x="230" y="292">PRICE</text>
      <text x="340" y="292">TUB</text>
      <text x="50" y="323">mango</text>
      <text x="230" y="323">60p</text>
      <text x="340" y="323">full</text>
      <text x="50" y="348">lemon</text>
      <text x="230" y="348">50p</text>
      <text x="340" y="348" fill="#CC2B1D">EMPTY</text>
      <text x="50" y="371">mint</text>
      <text x="230" y="371">70p</text>
      <text x="340" y="371">full</text>
    </g>

    <g font-size="15" fill="#14202B">
      <rect x="30" y="400" width="440" height="40" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="46" y="425">A &#183; mango &#183; 60p &#183; age 9</text>
      <rect x="330" y="407" width="130" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <rect x="30" y="448" width="440" height="40" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="46" y="473">B &#183; lemon &#183; 80p &#183; age 9</text>
      <rect x="330" y="455" width="130" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <rect x="30" y="496" width="440" height="40" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="46" y="521">C &#183; mint &#183; 40p &#183; age 4</text>
      <rect x="330" y="503" width="130" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <rect x="30" y="544" width="440" height="40" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="46" y="569">D &#183; banana &#183; 100p &#183; age 12</text>
      <rect x="330" y="551" width="130" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <rect x="30" y="592" width="440" height="40" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="46" y="617">E &#183; lemon &#183; 50p &#183; age 3</text>
      <rect x="330" y="599" width="130" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
    </g>
    <text x="395" y="392" font-size="12" fill="#55636F" text-anchor="middle">rule that fires</text>
    <text x="250" y="656" font-size="14" fill="#55636F" text-anchor="middle">One of these five customers is treated unfairly by the ORDER of the rules,</text>
    <text x="250" y="674" font-size="14" fill="#55636F" text-anchor="middle">not by any single rule. Find them.</text>
  </g>
</svg>
