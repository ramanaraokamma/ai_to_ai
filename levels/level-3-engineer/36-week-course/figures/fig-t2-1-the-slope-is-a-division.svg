<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The slope at one point is a division</title>
  <desc>The curve loss equals w squared is drawn in blue from w equals 0 to w equals 6. At the point where w is 3 and the loss is 9 a pink straight line just touches the curve. Dashed guides show a run of 1.0 along and a rise of 6.0 up. A pink box prints the measurement: 3.001 squared minus 2.999 squared, divided by 0.002, equals 0.012 divided by 0.002, equals 6.000. A green box below prints the shortcut rule 2 times w equals 2 times 3 equals 6, the same answer. A caption says a positive slope means downhill is to the left.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The slope at one point is a division</text>
  <line x1="100" y1="340" x2="440" y2="340" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="340" x2="100" y2="90" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="270" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">w</text>
  <text x="88" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">loss</text>
  <text x="100" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="156.667" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="213.333" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="270" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <text x="326.667" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <text x="383.333" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <text x="440" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <polyline points="100,340 105.667,339.931 111.333,339.722 117,339.375 122.667,338.889 128.333,338.264 134,337.5 139.667,336.597 145.333,335.556 151,334.375 156.667,333.056 162.333,331.597 168,330 173.667,328.264 179.333,326.389 185,324.375 190.667,322.222 196.333,319.931 202,317.5 207.667,314.931 213.333,312.222 219,309.375 224.667,306.389 230.333,303.264 236,300 241.667,296.597 247.333,293.056 253,289.375 258.667,285.556 264.333,281.597 270,277.5 275.667,273.264 281.333,268.889 287,264.375 292.667,259.722 298.333,254.931 304,250 309.667,244.931 315.333,239.722 321,234.375 326.667,228.889 332.333,223.264 338,217.5 343.667,211.597 349.333,205.556 355,199.375 360.667,193.056 366.333,186.597 372,180 377.667,173.264 383.333,166.389 389,159.375 394.667,152.222 400.333,144.931 406,137.5 411.667,129.931 417.333,122.222 423,114.375 428.667,106.389 434.333,98.2639 440,90" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="213.333" y1="319.167" x2="326.667" y2="235.833" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="270" cy="277.5" r="7" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="282" y="267.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">w = 3, loss = 9</text>
  <line x1="269.943" y1="277.5" x2="326.667" y2="277.5" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="326.667" y1="277.5" x2="326.667" y2="235.833" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="298.333" y="293.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">run 1.0</text>
  <text x="334.667" y="256.667" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rise 6.0</text>
  <rect x="470" y="96" width="300" height="116" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="486" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">measured by nudging, h = 0.001</text>
  <text x="486" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(3.001&#178; &#8722; 2.999&#178;) &#247; 0.002</text>
  <text x="486" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= 0.012 &#247; 0.002</text>
  <text x="486" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= 6.000</text>
  <rect x="470" y="230" width="300" height="78" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="486" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">and the shortcut rule agrees</text>
  <text x="486" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">2 &#215; w = 2 &#215; 3 = 6</text>
  <text x="620" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Positive slope &#8594; downhill is LEFT.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A slope is a rise divided by a run, not a symbol and not a rule you were handed.</text>
</svg>
