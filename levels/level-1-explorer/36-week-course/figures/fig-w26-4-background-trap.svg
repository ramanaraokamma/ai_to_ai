<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The background trap, in edge language</title>
  <desc>Three panels. A photo of an object on a wooden table, then its edge map in which the table's grain lines are far stronger than the object outline, then a wrong badge showing the model learned the table.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The background trap, in edge language</text>
  <rect x="50" y="80" width="230" height="200" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="58" y1="92" x2="272" y2="92" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="116" x2="272" y2="116" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="140" x2="272" y2="140" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="164" x2="272" y2="164" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="188" x2="272" y2="188" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="212" x2="272" y2="212" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="236" x2="272" y2="236" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="260" x2="272" y2="260" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <rect x="120" y="150" width="90" height="70" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="165" y="189.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">object</text>
  <text x="165" y="306.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1. the photo</text>
  <text x="165" y="326.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">object on a wooden table</text>
  <line x1="296" y1="180" x2="336" y2="180" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(336 180) rotate(0.0)"/>
  <rect x="352" y="80" width="230" height="200" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <line x1="360" y1="92" x2="574" y2="92" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="116" x2="574" y2="116" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="140" x2="574" y2="140" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="164" x2="574" y2="164" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="188" x2="574" y2="188" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="212" x2="574" y2="212" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="236" x2="574" y2="236" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="260" x2="574" y2="260" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="422" y="150" width="90" height="70" rx="8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="467" y="306.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2. the edge map</text>
  <text x="467" y="326.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">grain lines everywhere</text>
  <line x1="598" y1="180" x2="638" y2="180" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(638 180) rotate(0.0)"/>
  <g transform="translate(654,130) scale(0.9)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
  <text x="699" y="306.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">3. the model</text>
  <text x="699" y="326.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">learned the table</text>
  <text x="400" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Eight long straight grain lines beat one small object outline. The filter reports every edge,</text>
  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">including the ones you did not want. Change the surface and the strongest evidence vanishes.</text>
</svg>
