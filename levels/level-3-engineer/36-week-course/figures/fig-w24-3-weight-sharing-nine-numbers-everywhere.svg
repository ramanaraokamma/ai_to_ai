<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same nine numbers, used everywhere</title>
  <desc>One three by three kernel holding 1, 0, minus 1 in each row is drawn once, and four outlined windows on a six by six picture all point back to it. A caption says nine numbers are used at sixteen positions, so the layer has 9 plus 1 which is 10 learnable numbers, while a dense layer producing the same four by four map would need 36 times 16 plus 16 which is 592.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Weight sharing: nine numbers, sixteen places</text>
