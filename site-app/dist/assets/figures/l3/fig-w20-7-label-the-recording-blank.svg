<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the recording</title>
  <desc>Five numbered blue boxes stacked with arrows down between them, one per line of the forward pass: x at W1 plus b1 equals 2.20, torch.relu of Z1 equals 2.20, A1 at W2 plus b2 equals 2.20, torch.sigmoid of Z2 equals blank, and minus the natural log of A2 equals blank. Each box has an empty grad_fn line. A dashed pink panel underneath asks for four of the nine gradients: dZ2 equals A2 minus y, dW2 index 0 equals 2.20 times dZ2, and dW1 row 1 column 1 equals 2.0 times something. A final panel asks what autograd prints for these.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the recording</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Fill in each grad_fn and each gradient.</text>
  <rect x="30" y="92" width="440" height="62" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="114" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">x @ W1 + b1</text>
  <text x="300" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= 2.20</text>
  <text x="80" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">grad_fn ______________</text>
  <line x1="250" y1="154" x2="250" y2="164" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 164) rotate(90)"/>
  <rect x="30" y="166" width="440" height="62" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="188" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">torch.relu(Z1)</text>
  <text x="300" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= 2.20</text>
  <text x="80" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">grad_fn ______________</text>
  <line x1="250" y1="228" x2="250" y2="238" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 238) rotate(90)"/>
  <rect x="30" y="240" width="440" height="62" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="262" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">A1 @ W2 + b2</text>
  <text x="300" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= 2.20</text>
  <text x="80" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">grad_fn ______________</text>
  <line x1="250" y1="302" x2="250" y2="312" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 312) rotate(90)"/>
  <rect x="30" y="314" width="440" height="62" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="336" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="341" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">torch.sigmoid(Z2)</text>
  <text x="300" y="341" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= __________</text>
  <text x="80" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">grad_fn ______________</text>
  <line x1="250" y1="376" x2="250" y2="386" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 386) rotate(90)"/>
  <rect x="30" y="388" width="440" height="62" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="410" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="410" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">&#8722;ln(A2)</text>
  <text x="300" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= __________</text>
  <text x="80" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">grad_fn ______________</text>
  <rect x="30" y="470" width="440" height="128" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/>
  <text x="250" y="494" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Now backwards. Fill in three of the nine.</text>
  <text x="48" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dZ2 = A2 &#8722; y      = ______________</text>
  <text x="48" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dW2[0] = 2.20 &#215; dZ2 = ______________</text>
  <text x="48" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dW1[1,1] = 2.0 &#215; ?  = ______________</text>
  <rect x="30" y="610" width="440" height="66" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="634" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">What does autograd print for these?</text>
  <text x="250" y="656" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">____________________________</text>
</svg>
