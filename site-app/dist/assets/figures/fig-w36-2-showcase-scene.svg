<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The showcase in progress</title>
  <desc>A booth scene. The presenter stands beside a table with a laptop and a poster; two adult visitors watch; the break-it log lies open with a pen on it. Three numbered callouts point to the demo, the visitors and the log.</desc>

  <text x="400" y="38" font-size="24" fill="#14202B" text-anchor="middle">Showcase Day, in progress</text>

  <rect x="30" y="60" width="740" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- poster -->
  <rect x="60" y="82" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="135" y="112" font-size="12" fill="#CC2B1D" text-anchor="middle" font-weight="700">DO NOT USE FOR</text>
  <text x="135" y="134" font-size="12" fill="#14202B" text-anchor="middle">30/40 = 75%</text>
  <text x="135" y="156" font-size="12" fill="#14202B" text-anchor="middle">gap: 50 points</text>

  <!-- table -->
  <rect x="60" y="196" width="330" height="90" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <rect x="80" y="212" width="96" height="60" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="128" y="248" font-size="12" fill="#14202B" text-anchor="middle">the app</text>

  <!-- break-it log open with pen -->
  <rect x="196" y="216" width="176" height="56" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <line x1="284" y1="216" x2="284" y2="272" stroke="#845F00" stroke-width="2"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="206" y1="234" x2="274" y2="234"/><line x1="206" y1="250" x2="274" y2="250"/>
    <line x1="294" y1="234" x2="362" y2="234"/><line x1="294" y1="250" x2="362" y2="250"/>
  </g>
  <line x1="300" y1="266" x2="352" y2="222" stroke="#14202B" stroke-width="4" stroke-linecap="round"/>
  <text x="284" y="206" font-size="12" fill="#845F00" text-anchor="middle">BREAK-IT LOG</text>

  <!-- presenter -->
  <g transform="translate(420,150) scale(1.1)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="404" y="100" width="150" height="46" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <path d="M470 146 L474 164 L488 148 Z" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="479" y="128" font-size="12" fill="#14202B" text-anchor="middle">"Nobody wrote a rule."</text>

  <!-- two adults -->
  <g transform="translate(600,158) scale(0.95)">
    <circle cx="50" cy="52" r="30" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 64 Q50 71 61 64" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(676,178) scale(0.95)">
    <circle cx="50" cy="52" r="30" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 64 Q50 71 61 64" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="586" y="98" width="176" height="46" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <path d="M628 144 L624 162 L646 146 Z" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="674" y="126" font-size="12" fill="#14202B" text-anchor="middle">"Can I try to break it?"</text>

  <!-- pins -->
  <g stroke="#C42B8C" stroke-width="2" fill="none">
    <path d="M479 246 V318"/>
    <path d="M284 288 V318"/>
    <path d="M660 250 V318"/>
  </g>
  <g>
    <circle cx="479" cy="332" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="284" cy="332" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="660" cy="332" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  </g>
  <g font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">
    <text x="479" y="333">1</text><text x="284" y="333">3</text><text x="660" y="333">2</text>
  </g>
  <g font-size="14" fill="#55636F" text-anchor="middle">
    <text x="284" y="374">3. the log is open, with a pen</text>
    <text x="560" y="374">1. five minutes, no notes</text>
    <text x="720" y="374">2. real adults</text>
  </g>
</svg>
