  <polygon points="194,238 201,245 194,252 187,245" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="252,186.2 259,193.2 252,200.2 245,193.2" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="310,134.8 317,141.8 310,148.8 303,141.8" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="368,83 375,90 368,97 361,90" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="426,83 433,90 426,97 419,90" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="78" cy="345.4" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="136" cy="303.3" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="194" cy="251.2" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="252" cy="202.2" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="310" cy="193.5" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="368" cy="143.3" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="426" cy="90.6" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="84" y="367.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.176</text>
  <text x="142" y="325.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.312</text>
  <text x="200" y="273.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.480</text>
  <text x="258" y="224.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.638</text>
  <text x="316" y="215.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.666</text>
  <text x="374" y="165.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.828</text>
  <text x="418" y="114.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0.998</text>
  <text x="368" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ceiling (dashed)</text>
  <text x="144" y="237.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2">model (solid)</text>
  <circle cx="316" cy="169.5" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="316" y="169.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="226" y="268" width="236" height="84" rx="10" fill="#F5F8FA" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="246" cy="288" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="246" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="264" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">n = 4: model 0.666,</text>
  <text x="264" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">ceiling 0.833. Key shown:</text>
  <text x="264" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">copied right only 0.788.</text>
  <text x="264" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Seed 0; ceiling is (n + 1) &#247; 6.</text>
  <text x="250" y="456" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nothing can beat the dashed line. At n = 0</text>
  <text x="250" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the model gets 0.176: a coin toss on a new code.</text>
</svg>
