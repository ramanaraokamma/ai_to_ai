<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Broadcasting stretched it, and nothing complained</title>
  <desc>A row of three cells and a column of three cells are added together. Faint dashed copies show the row being repeated downwards three times and the column being repeated sideways three times, and the answer is a three by three block of nine numbers. The three numbers that were actually wanted sit on the diagonal and are ringed. A note reads three plus three should give three, not nine, and a cross marks the result.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Broadcasting stretched it, and nothing complained</text>
  <text x="122" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">scores, shape (3,)</text>
  <rect x="44" y="106" width="52" height="42" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="70" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">48</text>
  <rect x="96" y="106" width="52" height="42" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="122" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
  <rect x="148" y="106" width="52" height="42" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="174" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">77</text>
  <rect x="44" y="106" width="156" height="42" fill="none" stroke="#1F6FB2" stroke-width="3"/>
  <text x="122" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">+</text>
  <text x="122" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">bonus, shape (3, 1)</text>
  <rect x="96" y="218" width="52" height="42" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="122" y="239" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="96" y="260" width="52" height="42" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="122" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="96" y="302" width="52" height="42" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="122" y="323" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="96" y="218" width="52" height="126" fill="none" stroke="#C42B8C" stroke-width="3"/>
  <line x1="256" y1="226" x2="316" y2="226" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(316 226) rotate(0.0)"/>
  <text x="286" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">numpy</text>
  <text x="286" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">stretches</text>
  <rect x="344" y="132" width="68" height="52" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="378" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">49</text>
