<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One split. Everything downstream drinks from it.</title>
  <desc>A deck of 126 rows is cut once by a dashed line into a train pile of 100 and a test pile of 26. Four arrows carry the train pile into four model boxes, whose outputs converge on one results table. A separate pink path carries the test pile round the outside and into the results table, labelled scored on the test rows only, once, at the very end.</desc>
<text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One split. Everything downstream drinks from it.</text>
