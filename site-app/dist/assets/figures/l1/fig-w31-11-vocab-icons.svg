<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's four words, drawn</title>
  <desc>Four icon panels. Bias is a tilted balance with one hundred and eighty three on the heavy side and seventeen on the light side. Accuracy gap is a tall bar beside a short bar with an arrow between their tops. Fairness audit is a magnifying glass over a data table. False reject is a person beside a scanner showing a cross and the word absent.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's four words</text>
  <rect x="40" y="72" width="150" height="200" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="230" y="72" width="150" height="200" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="420" y="72" width="150" height="200" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="610" y="72" width="150" height="200" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <g transform="translate(115,180)">
    <line x1="0" y1="30" x2="0" y2="-28" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <path d="M-18 34 L-12 26 H12 L18 34 Z" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-46" y1="-20" x2="46" y2="-36" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-28" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <line x1="-46" y1="-20" x2="-46" y2="-10" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="-36" x2="46" y2="-26" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
    <path d="M-64 -10 Q-46 10 -28 -10 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M28 -26 Q46 -12 64 -26 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="-46" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">183</text>
    <text x="46" y="6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">17</text>
  </g>
  <line x1="252" y1="212" x2="360" y2="212" stroke="#14202B" stroke-width="2"/>
  <rect x="258" y="112" width="34" height="100" fill="#1F6FB2"/>
  <rect x="306" y="172" width="34" height="40" fill="#1F6FB2"/>
  <g stroke="#C42B8C" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="352" y1="112" x2="352" y2="172"/>
    <polyline points="347,118 352,111 357,118"/>
    <polyline points="347,166 352,173 357,166"/>
  </g>
  <text x="346" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">gap</text>
  <g transform="translate(438,104) scale(0.92)">
    <rect x="8" y="16" width="84" height="68" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M8 24 A8 8 0 0 1 16 16 H84 A8 8 0 0 1 92 24 V38 H8 Z" fill="#D9EAF9" stroke="none"/>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="8" y1="61" x2="92" y2="61"/>
      <line x1="36" y1="38" x2="36" y2="84"/>
      <line x1="64" y1="38" x2="64" y2="84"/>
    </g>
    <line x1="8" y1="38" x2="92" y2="38" stroke="#1F6FB2" stroke-width="3"/>
    <rect x="8" y="16" width="84" height="68" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(482,150) scale(0.66)">
    <line x1="60" y1="60" x2="86" y2="86" stroke="#1F6FB2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="42" r="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <path d="M30 36 A14 14 0 0 1 42 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(626,110) scale(0.7)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 66 Q50 58 61 66" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="702" y="112" width="52" height="66" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(711,128) scale(0.34)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="685" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">marked absent</text>
  <text x="685" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">while standing there</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="115" y="304">bias</text>
    <text x="305" y="304">accuracy gap</text>
    <text x="495" y="304">fairness audit</text>
    <text x="685" y="304">false reject</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="115" y="330">Much worse for</text>
    <text x="115" y="348">one group</text>
    <text x="305" y="330">Best minus worst,</text>
    <text x="305" y="348">in points</text>
    <text x="495" y="330">Testing group by</text>
    <text x="495" y="348">group, on purpose</text>
    <text x="685" y="330">It missed someone</text>
    <text x="685" y="348">who was really there</text>
  </g>
</svg>
