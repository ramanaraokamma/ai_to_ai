<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Hand-check row 1 before you believe anything</title>
  <desc>Row one of the rainfall grid, Pune's six months, is pulled out and ringed in pink. Under it the addition is written out by hand: two plus four plus ten plus twenty plus thirty-six plus ninety equals one hundred and sixty-two, then divided by six equals twenty-seven. A terminal panel beside it shows the array of four city means with 27 ringed, and a green tick reads the pencil agrees.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Hand-check row 1 before you believe anything</text>
  <rect x="68" y="84" width="70" height="40" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="138" y="84" width="70" height="40" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="208" y="84" width="70" height="40" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="278" y="84" width="70" height="40" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="348" y="84" width="70" height="40" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="418" y="84" width="70" height="40" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="103.0" y="104.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="173.0" y="104.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="243.0" y="104.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <text x="313.0" y="104.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">20</text>
  <text x="383.0" y="104.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">36</text>
  <text x="453.0" y="104.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">90</text>
  <rect x="68" y="84" width="420" height="40" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">row 1</text>
  <text x="60" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">Pune</text>
  <text x="68" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">2 + 4 + 10 + 20 + 36 + 90 = 162</text>
  <text x="68" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">162 divided by 6 = 27.0</text>
  <rect x="50.0" y="228.0" width="300" height="24" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="200" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">six months, so divide by six</text>
  <rect x="500" y="84" width="280" height="116" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="502" y="86" width="276" height="26" fill="#F5F8FA"/>
  <text x="516" y="99" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">Terminal</text>
  <line x1="500" y1="112" x2="780" y2="112" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="516" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#55636F">&gt;</text>
  <text x="530" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">rain.mean(axis=1)</text>
  <text x="516" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">[ 25.  27.  66. 167.]</text>
  <rect x="573" y="158" width="28" height="20" rx="4" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="524" cy="240" r="17" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="516,241 522,247 532,233" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="552" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">27.0 - the pencil agrees</text>
  <text x="400" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four answers for four cities. The count is the first thing to check.</text>
  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">If the pencil and the code disagree, the pencil is not automatically the wrong one.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Row 1 is the SECOND row. Python starts counting rows at 0.</text>
</svg>
