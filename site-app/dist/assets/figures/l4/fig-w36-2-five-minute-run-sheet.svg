  <line x1="112" y1="168" x2="112" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="112" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0:30</text>
  <line x1="256" y1="168" x2="256" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
