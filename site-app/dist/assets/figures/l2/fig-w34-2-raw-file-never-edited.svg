<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The raw file is written once, then locked</title>
  <desc>A padlocked file card labelled raw.csv holding 26 rows sits on the left, marked no hand edits ever. An arrow labelled read points right to an unlocked card labelled clean.csv holding 21 rows, where changes live. A return arrow from clean back to raw is crossed out.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The raw file is written once, then locked</text>
<line x1="272" y1="190" x2="428" y2="190" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
<polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(428 190) rotate(0.0)"/>
<text x="350" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">read</text>
<rect x="60" y="120" width="200" height="150" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
<text x="160" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">raw.csv</text>
<rect x="146" y="184" width="28" height="22" rx="4" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
<path d="M152 184 V177 A8 8 0 0 1 168 177 V184" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="160" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">26 rows, locked</text>
<text x="160" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">exactly as I wrote it down</text>
<circle cx="86" cy="92" r="14" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
  <line x1="81.05882352941177" y1="87.05882352941177" x2="90.94117647058823" y2="96.94117647058823"/>
  <line x1="90.94117647058823" y1="87.05882352941177" x2="81.05882352941177" y2="96.94117647058823"/>
</g>
<text x="108" y="97" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" dominant-baseline="central">no hand edits, ever</text>
<rect x="440" y="120" width="200" height="150" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
<text x="540" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">clean.csv</text>
<rect x="526" y="184" width="28" height="22" rx="4" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
<path d="M532 184 V190" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="540" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">21 rows, rebuilt</text>
<text x="540" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">every change made in code</text>
<circle cx="466" cy="92" r="14" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="459.4117647058824,92.82352941176471 463.94117647058823,97.76470588235294 473.4117647058824,87.05882352941177" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="488" y="97" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" dominant-baseline="central">changes live here</text>
<line x1="430" y1="300" x2="276" y2="300" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
<circle cx="353" cy="300" r="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
  <line x1="347.3529411764706" y1="294.3529411764706" x2="358.6470588235294" y2="305.6470588235294"/>
  <line x1="358.6470588235294" y1="294.3529411764706" x2="347.3529411764706" y2="305.6470588235294"/>
</g>
<text x="400" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Writing back to raw.csv would destroy the only honest copy you have.</text>
<text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Read from raw. Write to clean. The arrow only ever points one way.</text>
</svg>
