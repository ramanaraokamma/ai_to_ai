<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three files, and the line that says which is live</title>
  <desc>A folder called model slash artifacts holds three things. LATEST is 13 bytes and contains the single line sentiment_v1. sentiment_v1.joblib is 10,228 bytes, which is 10.0 kilobytes, and holds the vocabulary, the idf weights and the coefficients all in one object. sentiment_v1.metadata.json is 421 bytes and holds the threshold 0.65, the test accuracy 0.8125 and the library versions. Beside them, the cold-start arithmetic measured on this machine: importing joblib takes 92.2 milliseconds, the first joblib.load takes 659.3 milliseconds, and the prediction itself takes 0.4 milliseconds, so 92.2 plus 659.3 plus 0.4 equals 751.9 milliseconds of which the prediction is one part in about 1,880. A rollback is one edit to LATEST.</desc>

  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three files, and the line that says which is live</text>

  <text x="40" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">model/artifacts/</text>

  <!-- LATEST -->
  <rect x="40" y="88" width="380" height="62" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">LATEST</text>
  <text x="380" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">13 bytes</text>
  <text x="58" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">sentiment_v1</text>
  <text x="380" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">one line of text</text>

  <!-- joblib -->
  <rect x="40" y="162" width="380" height="82" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">sentiment_v1.joblib</text>
  <text x="380" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">10,228 bytes = 10.0 KB</text>
  <text x="58" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the 287-word vocabulary, the idf weights,</text>
  <text x="58" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">and the coefficients &#8212; all inside one object</text>

  <!-- metadata -->
  <rect x="40" y="256" width="380" height="82" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">sentiment_v1.metadata.json</text>
  <text x="380" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">421 bytes</text>
  <text x="58" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">threshold 0.65 &#183; test_accuracy 0.8125</text>
  <text x="58" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">sklearn 1.7.1 &#183; python 3.10.10</text>

  <!-- the cold start sum -->
  <rect x="450" y="88" width="310" height="180" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="605" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">cold start, measured on this laptop</text>
  <text x="470" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">import joblib</text>
  <text x="740" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="end">92.2 ms</text>
  <text x="470" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">first joblib.load</text>
  <text x="740" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="end">659.3 ms</text>
  <text x="470" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">the prediction</text>
  <text x="740" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="end">0.4 ms</text>
  <line x1="470" y1="208" x2="740" y2="208" stroke="#14202B" stroke-width="1.5"/>
  <text x="470" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">92.2 + 659.3 + 0.4 =</text>
  <text x="740" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="end">751.9 ms</text>
  <text x="470" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the answer is 1 part in 1,880 of the wait</text>

  <rect x="450" y="280" width="310" height="58" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="605" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">a rollback is one edit to LATEST</text>
  <text x="605" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">13 bytes is why going back is cheap</text>

  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Version in the filename. Metadata beside it. One line says what is live.</text>
</svg>
