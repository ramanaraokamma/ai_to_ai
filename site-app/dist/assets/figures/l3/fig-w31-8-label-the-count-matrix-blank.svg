<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the count matrix</title>
  <desc>Four short reviews on the left and a four by eight grid of word counts on the right, with four cells left empty as dashed boxes: d1's great cell, d2's cold cell, d3's great cell and d4's cold cell. The four row totals are empty too. The filled cells show d1 as 0 0 0 blank 1 0 1 1, d2 as 0 blank 0 0 1 0 1 1, d3 as 0 0 0 blank 1 1 0 0 and d4 as 1 blank 1 0 0 1 0 0, so the missing values are 1, 1, 2 and 2 and the row totals are 4, 4, 4 and 5. A panel underneath has empty boxes for the shape, which is 4 by 8, the number of cells, which is 32, the stored non-zero cells, which is 15, and the percentage empty, which is 53, and asks which two cells hold a 2.</desc>
