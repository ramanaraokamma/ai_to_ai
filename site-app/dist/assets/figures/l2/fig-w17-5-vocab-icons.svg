  <rect x="694" y="78" width="34" height="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <rect x="592" y="102" width="34" height="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <rect x="626" y="102" width="34" height="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <rect x="660" y="102" width="34" height="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <rect x="694" y="102" width="34" height="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
