<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Seven rungs from Level 3 to Level 4</title>
  <desc>Seven rungs of a ladder, each naming a Level 3 thing you can already do and the Level 4 thing built directly on top of it. Rung 1: the five-line PyTorch loop, typed from a blank file in under three minutes, becomes training a small transformer. Rung 2: backpropagation on a 2-layer network, where nudging w moved the loss 42 times as much, becomes gradients through attention. Rung 3: matrix shapes, n by d times d by h gives n by h, becomes attention, which is nothing but a shape argument. Rung 4: the three questions &#8212; what is the baseline, what is the class balance, was anything fitted before the split &#8212; become evaluating a language model. Rung 5: cosine similarity between two documents becomes retrieval over embeddings. Rung 6: a versioned artifact with a metadata file becomes serving a fine-tuned model. Rung 7: the monitoring number computable without labels, currently 27.0 percent with an alarm at 40, becomes watching an agent in the wild.</desc>

  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Seven rungs from Level 3 to Level 4</text>

  <text x="215" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">WHAT YOU CAN DO NOW</text>
  <text x="590" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">WHAT LEVEL 4 BUILDS ON IT</text>

  <!-- arrows first -->
  <g stroke="#14202B" stroke-width="2" stroke-linecap="round">
    <line x1="392" y1="100" x2="420" y2="100"/>
    <line x1="392" y1="138" x2="420" y2="138"/>
    <line x1="392" y1="176" x2="420" y2="176"/>
    <line x1="392" y1="214" x2="420" y2="214"/>
    <line x1="392" y1="252" x2="420" y2="252"/>
    <line x1="392" y1="290" x2="420" y2="290"/>
    <line x1="392" y1="328" x2="420" y2="328"/>
  </g>
  <g fill="#14202B">
    <polygon points="424,100 414,96 414,104"/>
    <polygon points="424,138 414,134 414,142"/>
    <polygon points="424,176 414,172 414,180"/>
    <polygon points="424,214 414,210 414,218"/>
    <polygon points="424,252 414,248 414,256"/>
    <polygon points="424,290 414,286 414,294"/>
    <polygon points="424,328 414,324 414,332"/>
  </g>

  <!-- left rungs -->
  <rect x="40" y="86" width="348" height="28" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">1 the five-line loop, blank file, under 3 minutes</text>
  <rect x="40" y="124" width="348" height="28" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="143" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2 backprop by hand: nudge w, loss moves 42&#215;</text>
  <rect x="40" y="162" width="348" height="28" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">3 shapes out loud: (n,d) @ (d,h) &#8594; (n,h)</text>
  <rect x="40" y="200" width="348" height="28" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">4 baseline? balance? fitted before the split?</text>
  <rect x="40" y="238" width="348" height="28" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">5 cosine similarity between two documents</text>
  <rect x="40" y="276" width="348" height="28" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">6 a versioned artifact with metadata beside it</text>
  <rect x="40" y="314" width="348" height="28" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">7 a staleness number: 14.4% now, alarm at 40%</text>

  <!-- right rungs -->
  <rect x="428" y="86" width="332" height="28" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">training a small transformer yourself</text>
  <rect x="428" y="124" width="332" height="28" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="143" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">gradients flowing back through attention</text>
  <rect x="428" y="162" width="332" height="28" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">attention &#8212; which is a shape argument</text>
  <rect x="428" y="200" width="332" height="28" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">evaluating a language model honestly</text>
  <rect x="428" y="238" width="332" height="28" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">retrieval over embeddings</text>
  <rect x="428" y="276" width="332" height="28" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">serving a fine-tuned model</text>
  <rect x="428" y="314" width="332" height="28" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="440" y="333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">watching an agent in the wild</text>

  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Every arrow points from something you can already do. Nothing in Level 4 is magic.</text>
</svg>
