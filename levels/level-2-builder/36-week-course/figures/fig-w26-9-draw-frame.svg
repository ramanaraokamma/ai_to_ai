<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 26</title>
  <desc>An empty framed drawing area headed one question, one chart shape, one thing it hides. A wide dashed box at the top waits for the question. Underneath, five empty labelled slots read LINE, BAR, HISTOGRAM, SCATTER and NEITHER, for the student to tick one. A large blank chart area sits below for the sketch, and three reminder boxes at the bottom ask for the reason, what the chart shows, and what it hides.</desc>
  <rect x="24" y="24" width="752" height="286" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: one question, one chart shape, one thing it hides</text>

  <text x="52" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">my question, in words</text>
  <rect x="52" y="96" width="696" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <text x="52" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">tick exactly one</text>
  <rect x="52" y="156" width="128" height="34" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="60" y="166" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="128" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">LINE</text>
  <rect x="192" y="156" width="128" height="34" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="200" y="166" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="268" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">BAR</text>
  <rect x="332" y="156" width="136" height="34" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="340" y="166" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="412" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">HISTOGRAM</text>
  <rect x="480" y="156" width="128" height="34" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="488" y="166" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="556" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">SCATTER</text>
  <rect x="620" y="156" width="128" height="34" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="628" y="166" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="696" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">NEITHER</text>

  <!-- sketch area -->
  <rect x="52" y="204" width="380" height="92" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="52" y1="234" x2="432" y2="234"/>
    <line x1="52" y1="264" x2="432" y2="264"/>
    <line x1="148" y1="204" x2="148" y2="296"/>
    <line x1="244" y1="204" x2="244" y2="296"/>
    <line x1="340" y1="204" x2="340" y2="296"/>
  </g>
  <line x1="70" y1="212" x2="70" y2="286" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="286" x2="418" y2="286" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="244" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C7CDD4" text-anchor="middle">sketch your chart here</text>

  <text x="452" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">why that shape, in one sentence</text>
  <rect x="452" y="222" width="296" height="74" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <text x="60" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what it SHOWS</text>
  <rect x="60" y="344" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="420" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what it HIDES - something you can point at</text>
  <rect x="420" y="344" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
</svg>
