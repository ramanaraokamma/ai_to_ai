<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>With no squash, two layers are one straight line</title>
  <desc>Two panels. The left shows three lines of algebra: h1 equals 0.5x1 plus 0.8x2 plus 0.1, h2 equals minus 0.3x1 plus 0.2x2 plus 0.05, and out equals 1.0h1 minus 2.0h2 plus 0.3. Substituting gives out equals 1.1x1 plus 0.4x2 plus 0.3, a single straight line. The right panel takes the row 2.0 and minus 1.0, where h1 is 0.3 and h2 is minus 0.75. With no squash the answer is 2.1; with ReLU the minus 0.75 becomes 0 and the answer is 0.6, a gap of 1.5.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">With no squash, two layers are one straight line</text>
  <rect x="20" y="66" width="372" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="206" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">no squash</text>
  <text x="36" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">h1 = 0.5x&#8321; + 0.8x&#8322; + 0.1</text>
  <text x="36" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">h2 = &#8722;0.3x&#8321; + 0.2x&#8322; + 0.05</text>
  <text x="36" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">out = 1.0h1 &#8722; 2.0h2 + 0.3</text>
  <line x1="34" y1="184" x2="378" y2="184" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="36" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">substitute h1 and h2 in:</text>
  <text x="36" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">out = (0.5 + 0.6)x&#8321; + (0.8 &#8722; 0.4)x&#8322; + 0.3</text>
  <rect x="32" y="244" width="348" height="32" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="206" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">out = 1.1x&#8321; + 0.4x&#8322; + 0.3</text>
  <text x="206" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one weight per input, one bias. A straight line.</text>
  <rect x="408" y="66" width="372" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="594" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">with ReLU between them</text>
  <text x="424" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">row x = [2.0, &#8722;1.0]</text>
  <text x="424" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">h1 = 0.3, &#160;h2 = &#8722;0.75</text>
  <line x1="422" y1="160" x2="766" y2="160" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="424" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">no squash: 0.3 &#8722; 2.0&#215;(&#8722;0.75) + 0.3 = 2.1</text>
  <text x="424" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">ReLU: max(0, &#8722;0.75) = 0, so</text>
  <text x="424" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.3 &#8722; 2.0&#215;0 + 0.3 = 0.6</text>
  <rect x="420" y="250" width="348" height="32" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="594" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.1 versus 0.6 &#8212; a gap of 1.5</text>
  <text x="594" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the squash threw away &#8722;0.75 for ever</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The three lines on the left are the whole proof: substitute, collect, and depth has vanished.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">So a hidden layer is only worth having if something bends between the layers.</text>
</svg>
