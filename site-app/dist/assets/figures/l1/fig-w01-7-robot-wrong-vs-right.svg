<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>AI is a kind of decision, not a body</title>
  <desc>Two panels. The wrong panel shows a robot and the claim that AI means robots. The right panel shows a phone with a spam folder and the correct claim that AI means a machine doing a job that used to need judgement, and that most AI has no body.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">AI is a kind of decision, not a body</text>
    <rect x="30" y="70" width="350" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <rect x="420" y="70" width="350" height="250" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <g transform="translate(48,84) scale(0.44)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <g transform="translate(438,84) scale(0.44)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="100" y="107" font-size="18" fill="#14202B">What most people think</text>
    <text x="490" y="107" font-size="18" fill="#14202B">What is actually true</text>

    <g transform="translate(50,150) scale(0.85)">
      <line x1="50" y1="16" x2="50" y2="7" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="5" r="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <rect x="22" y="16" width="56" height="40" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="38" cy="34" r="5" fill="#14202B"/>
      <circle cx="62" cy="34" r="5" fill="#14202B"/>
      <path d="M40 45 Q50 52 60 45" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <rect x="28" y="60" width="44" height="30" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <line x1="28" y1="68" x2="13" y2="78" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="68" x2="87" y2="78" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="75" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    </g>
    <g font-size="16" fill="#14202B">
      <text x="155" y="172">"AI means robots."</text>
      <text x="155" y="204">So a spam filter with</text>
      <text x="155" y="226">no body cannot be AI.</text>
      <text x="155" y="262">That rules out almost</text>
      <text x="155" y="284">all of the real AI.</text>
    </g>

    <rect x="445" y="148" width="72" height="112" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="455" y="166" width="52" height="22" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
    <text x="481" y="177" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">SPAM</text>
    <rect x="455" y="196" width="52" height="18" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
    <rect x="455" y="220" width="52" height="18" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
    <circle cx="481" cy="252" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <g font-size="16" fill="#14202B">
      <text x="535" y="172">"AI means a machine</text>
      <text x="535" y="194">doing a job that used</text>
      <text x="535" y="216">to need judgement."</text>
      <text x="535" y="252">Most AI has no body.</text>
      <text x="535" y="274">This spam folder is AI.</text>
    </g>
    <text x="400" y="358" font-size="14" fill="#55636F" text-anchor="middle">Robot is a question about bodies. AI is a question about decisions. Two different questions.</text>
  </g>
</svg>
