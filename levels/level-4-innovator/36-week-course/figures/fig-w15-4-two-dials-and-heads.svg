<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Scores are divided, the future is hidden, then softmax and blend; separately a word's width is cut into heads</title>
  <desc>Top, five boxes joined by arrows: scores, divide by the root of the width labelled dial 1, hide future with later words set to minus infinity labelled dial 2, softmax, blend. Middle, snippet (b) row 2: scores 4 5 6, then 4 5 -inf with the future hidden, then weights 0.2689 0.7311 0.0000; the snippet leaves the divide out. Bottom left, a strip of 12 numbered cells cut into three heads of four. Bottom right, shapes (2, 5, 12), then view gives (2, 5, 3, 4), then transpose(1, 2) gives (2, 3, 5, 4).</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Scores through two dials, then cut into heads</text>
