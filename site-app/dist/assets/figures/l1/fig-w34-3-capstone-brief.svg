<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A filled-in capstone brief with the success bar circled</title>
  <desc>A single sheet of paper headed Milestone 1, the brief. It names the annoyance, the four classes including other, the twenty-five percent baseline, and a success bar of fifty percent which is circled and labelled written before any training.</desc>

  <text x="250" y="42" font-size="24" fill="#14202B" text-anchor="middle">Milestone 1: the brief, filled in</text>

  <rect x="40" y="66" width="420" height="562" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>

  <text x="64" y="100" font-size="18" fill="#845F00">PROBLEM</text>
  <text x="64" y="126" font-size="14" fill="#14202B">In my house, the wrong bin gets used about 4 times</text>
  <text x="64" y="146" font-size="14" fill="#14202B">a week. The person it annoys most is Mum.</text>
  <line x1="64" y1="160" x2="436" y2="160" stroke="#C7CDD4" stroke-width="1.5"/>

  <text x="64" y="190" font-size="18" fill="#845F00">WHAT THE MODEL DOES</text>
  <text x="64" y="216" font-size="14" fill="#14202B">Input: a webcam photo of one piece of rubbish</text>
  <text x="64" y="240" font-size="14" fill="#14202B">Output: one of these four labels</text>
  <g font-size="14" fill="#14202B">
    <text x="90" y="264">1. recycling</text>
    <text x="260" y="264">3. landfill</text>
    <text x="90" y="288">2. compost</text>
    <text x="260" y="288">4. other</text>
  </g>
  <line x1="64" y1="302" x2="436" y2="302" stroke="#C7CDD4" stroke-width="1.5"/>

  <text x="64" y="332" font-size="18" fill="#845F00">THE NUMBERS I AM BETTING AGAINST</text>
  <text x="64" y="358" font-size="14" fill="#14202B">Baseline (blind guessing, 4 equal classes) = 1/4 = 25%</text>

  <rect x="60" y="374" width="380" height="52" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="78" y="406" font-size="18" fill="#14202B">I will call it useful if it beats 50%</text>
  <text x="64" y="450" font-size="14" fill="#C42B8C">written BEFORE anything was trained - no moving it later</text>
  <line x1="64" y1="466" x2="436" y2="466" stroke="#C7CDD4" stroke-width="1.5"/>

  <text x="64" y="496" font-size="18" fill="#845F00">WHEN IT IS RIGHT</text>
  <text x="64" y="522" font-size="14" fill="#14202B">The right bin lid opens on screen and it says which one.</text>

  <text x="64" y="556" font-size="18" fill="#845F00">WHEN IT IS WRONG</text>
  <text x="64" y="582" font-size="14" fill="#14202B">Worst case: a yoghurt pot goes in the food bin.</text>
  <text x="64" y="604" font-size="14" fill="#14202B">Who gets hurt: nobody. That is why I picked it.</text>

  <g transform="translate(392,486) scale(0.7)">
    <g stroke="#845F00" stroke-width="3" stroke-linecap="round">
      <line x1="50" y1="8" x2="50" y2="2"/><line x1="22" y1="18" x2="17" y2="13"/>
      <line x1="78" y1="18" x2="83" y2="13"/><line x1="14" y1="44" x2="7" y2="44"/>
      <line x1="86" y1="44" x2="93" y2="44"/>
    </g>
    <circle cx="50" cy="44" r="26" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M42 56 L45 66 L55 66 L58 56" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="41" y="66" width="18" height="10" rx="3" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <rect x="44" y="78" width="12" height="8" rx="3" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="250" y="662" font-size="14" fill="#55636F" text-anchor="middle">The circled line is the whole point of Milestone 1.</text>
  <text x="250" y="682" font-size="14" fill="#55636F" text-anchor="middle">A bar you set after you see the score is not a bar.</text>
</svg>
