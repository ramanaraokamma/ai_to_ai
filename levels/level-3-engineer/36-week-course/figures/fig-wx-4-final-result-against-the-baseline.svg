<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The final result against its baseline</title>
  <desc>Four bars of test accuracy on the same 540 held-out digits. The dummy most-frequent baseline reaches 0.1019. A scaled logistic regression reaches 0.9722. The plain CNN reaches 0.9689, slightly below the logistic regression. The smudged CNN reaches 0.9848, the tallest bar. The two CNN bars are the mean of five seeds. A side panel says what she claims: plus 1.6 points over the plain CNN, and it survived five seeds &#8212; and what she does not claim: that a CNN beats a logistic regression on this data.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The final result against its baseline</text>
  <line x1="110" y1="320" x2="620" y2="320" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="320" x2="110" y2="100" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="320" x2="620" y2="320" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.00</text>
  <line x1="110" y1="267.5" x2="620" y2="267.5" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="267.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.25</text>
  <line x1="110" y1="215" x2="620" y2="215" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.50</text>
  <line x1="110" y1="162.5" x2="620" y2="162.5" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="162.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.75</text>
  <line x1="110" y1="110" x2="620" y2="110" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">1.00</text>
  <rect x="120" y="298.601" width="84" height="21.399" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="162" y="284.601" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.1019</text>
  <text x="162" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">dummy</text>
  <rect x="242" y="115.838" width="84" height="204.162" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="284" y="101.838" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.9722</text>
  <text x="284" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">logistic reg.</text>
  <rect x="364" y="116.531" width="84" height="203.469" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="406" y="102.531" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.9689</text>
  <text x="406" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">CNN plain</text>
  <rect x="486" y="113.192" width="84" height="206.808" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="528" y="99.192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.9848</text>
  <text x="528" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">CNN smudged</text>
  <text x="370" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the same 540 held-out digits &#183; the CNNs are a 5-seed mean</text>
  <rect x="640" y="80" width="140" height="250" rx="10" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="710" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">what she claims</text>
  <line x1="652" y1="116" x2="768" y2="116" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="652" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">+1.6 points over</text>
  <text x="652" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the plain CNN,</text>
  <text x="652" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">and it survived</text>
  <text x="652" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">five seeds.</text>
  <line x1="652" y1="216" x2="768" y2="216" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="652" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what she does</text>
  <text x="652" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">NOT claim: that</text>
  <text x="652" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a CNN beats a</text>
  <text x="652" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">logistic reg.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A bar chart with no dummy bar in it has the answer cut off.</text>
</svg>
