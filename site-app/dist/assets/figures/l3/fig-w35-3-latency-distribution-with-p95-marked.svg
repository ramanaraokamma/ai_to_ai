<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Where the p95 sits, and how to work one out</title>
  <desc>A histogram of 111 real logged latencies in milliseconds, in bins 0.05 wide. The bars are 2 requests between 0.15 and 0.20, 73 between 0.20 and 0.25, 33 between 0.25 and 0.30, 1 between 0.30 and 0.35, and 1 between 0.35 and 0.40. Then the axis is broken, because one single request landed at 3.27 milliseconds, and that one was the very first request, before anything was warm. Marker 1 is the p50 at 0.23, marker 2 the p95 at 0.27, marker 3 the maximum at 3.27. The mean is 0.2623, and the other 110 requests average 0.2349, which makes the first request about 14 times slower than the rest. On the right, a p95 worked by hand on the first five logged requests: sorted they are 0.27, 0.27, 0.31, 0.38 and 3.27; the position is 0.95 times 4 which is 3.8, so it lies between 0.38 and 3.27, 80 percent of the way along; 0.38 plus 0.80 times the gap of 2.89 gives 2.6920, and numpy prints 2.6919999999999993 for the same thing.</desc>

  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Where the p95 sits, and how to work one out</text>

  <!-- axis, with a break -->
  <line x1="60" y1="300" x2="300" y2="300" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="336" y1="300" x2="400" y2="300" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round">
    <line x1="308" y1="308" x2="318" y2="292"/>
    <line x1="320" y1="308" x2="330" y2="292"/>
  </g>
  <text x="319" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">break</text>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="60" y1="300" x2="60" y2="306"/>
    <line x1="100" y1="300" x2="100" y2="306"/>
    <line x1="140" y1="300" x2="140" y2="306"/>
    <line x1="180" y1="300" x2="180" y2="306"/>
    <line x1="220" y1="300" x2="220" y2="306"/>
    <line x1="260" y1="300" x2="260" y2="306"/>
    <line x1="300" y1="300" x2="300" y2="306"/>
    <line x1="369" y1="300" x2="369" y2="306"/>
  </g>
  <text x="60" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.15</text>
  <text x="140" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.25</text>
  <text x="220" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.35</text>
  <text x="300" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.45</text>
  <text x="369" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3.27</text>
  <text x="230" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">latency of one prediction, in ms &#183; 111 logged requests</text>

  <!-- bars -->
  <rect x="61" y="292" width="38" height="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="101" y="130" width="38" height="170" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="141" y="223" width="38" height="77" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="181" y="292" width="38" height="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="221" y="292" width="38" height="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="350" y="292" width="38" height="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="80" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2</text>
  <text x="120" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">73</text>
  <text x="160" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">33</text>
  <text x="200" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1</text>
  <text x="240" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1</text>
  <text x="369" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">1</text>
  <text x="196" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">one request, 12&#215; the p95,</text>
  <text x="196" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">and it was request number 1</text>

  <!-- markers under the axis -->
  <circle cx="124" cy="340" r="9" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="124" y="345" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1</text>
  <circle cx="158" cy="340" r="9" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="158" y="345" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2</text>
  <circle cx="369" cy="340" r="9" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="369" y="345" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3</text>

  <!-- right panel: the four numbers -->
  <rect x="440" y="62" width="320" height="130" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="456" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">the four numbers, from the log</text>
  <text x="456" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">mean</text>
  <text x="744" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="end">0.2623 ms</text>
  <circle cx="464" cy="126" r="9" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="464" y="131" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1</text>
  <text x="482" y="131" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">p50</text>
  <text x="744" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="end">0.2300 ms</text>
  <circle cx="464" cy="150" r="9" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="464" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2</text>
  <text x="482" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">p95</text>
  <text x="744" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="end">0.2700 ms</text>
  <circle cx="464" cy="174" r="9" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="464" y="179" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3</text>
  <text x="482" y="179" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">max</text>
  <text x="744" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="end">3.2700 ms</text>

  <!-- right panel: by hand -->
  <rect x="440" y="204" width="320" height="140" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="456" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">a p95 by hand, on the first five</text>
  <text x="456" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">sorted: 0.27 0.27 0.31 0.38 3.27</text>
  <text x="456" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">position: 0.95 &#215; (5 &#8722; 1) = 3.8</text>
  <text x="456" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">so between 0.38 and 3.27, 80% along</text>
  <text x="456" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.38 + 0.80 &#215; 2.89 = 2.6920</text>
  <text x="456" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">numpy says 2.6919999999999993</text>
  <text x="456" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#8212; same number, floating point</text>
</svg>
