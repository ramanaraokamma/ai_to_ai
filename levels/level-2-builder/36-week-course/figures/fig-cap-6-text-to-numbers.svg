  <text x="400" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">df["is_walk"] = (df["mode"] == "walk").astype(int)</text>
  <text x="400" y="388" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One line per category. No get_dummies, no pipeline, nothing you have not met.</text>
