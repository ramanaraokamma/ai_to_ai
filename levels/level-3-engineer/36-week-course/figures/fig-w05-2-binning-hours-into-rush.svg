<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The hump a straight line cannot see</title>
  <desc>A bar chart of how often deliveries are late against the hour the order was placed, from 10 to 23. Most hours sit between 0.196 and 0.28, but hours 18, 19 and 20 are highlighted and stand at 0.3738, 0.3745 and 0.3553. Two panels on the right collapse the chart into one yes-or-no column: is_rush equal to 1 covers 717 orders late 0.3682 of the time, and is_rush equal to 0 covers 1283 orders late 0.2424 of the time. 717 plus 1283 is 2000, and 0.3682 minus 0.2424 is 0.1258, a gap of 12.58 points.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The hump a straight line cannot see</text>
  <line x1="80" y1="280" x2="560" y2="280" stroke="#14202B" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="280" stroke="#14202B" stroke-width="2"/>
  <line x1="74" y1="280.0" x2="80" y2="280.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="70" y="280.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.0</text>
  <line x1="74" y1="230.0" x2="80" y2="230.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="70" y="230.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.1</text>
  <line x1="74" y1="180.0" x2="80" y2="180.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="70" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.2</text>
  <line x1="74" y1="130.0" x2="80" y2="130.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="70" y="130.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.3</text>
  <line x1="74" y1="80.0" x2="80" y2="80.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="70" y="80.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.4</text>
  <text x="46" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 46 180)">late rate</text>
  <rect x="92" y="173.6" width="24" height="106.4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="104" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <rect x="125" y="164.6" width="24" height="115.4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="137" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">11</text>
  <rect x="158" y="149.4" width="24" height="130.6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="170" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">12</text>
  <rect x="191" y="155.6" width="24" height="124.5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="203" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">13</text>
  <rect x="224" y="179.2" width="24" height="100.8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="236" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">14</text>
  <rect x="257" y="171.1" width="24" height="109.0" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="269" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">15</text>
  <rect x="290" y="152.2" width="24" height="127.8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="302" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">16</text>
  <rect x="323" y="140.2" width="24" height="139.8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="335" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">17</text>
  <rect x="356" y="93.1" width="24" height="186.9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="368" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">18</text>
  <rect x="389" y="92.8" width="24" height="187.2" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="401" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">19</text>
  <rect x="422" y="102.3" width="24" height="177.7" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="434" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">20</text>
  <rect x="455" y="161.8" width="24" height="118.2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="467" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">21</text>
  <rect x="488" y="182.1" width="24" height="97.9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="500" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">22</text>
  <rect x="521" y="125.6" width="24" height="154.4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="533" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">23</text>
  <text x="320" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">hour the order was placed</text>
  <line x1="352" y1="74" x2="352" y2="280" stroke="#C42B8C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="451" y1="74" x2="451" y2="280" stroke="#C42B8C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="405.5" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">18, 19, 20</text>
  <rect x="590" y="74" width="190" height="118" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="600" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">is_rush = 1</text>
  <text x="600" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">717 orders</text>
  <text x="600" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">late 36.82% of the time</text>
  <text x="600" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B">0.3682</text>
  <rect x="590" y="204" width="190" height="118" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="600" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">is_rush = 0</text>
  <text x="600" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">1283 orders</text>
  <text x="600" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">late 24.24% of the time</text>
  <text x="600" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B">0.2424</text>
  <text x="80" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">717 + 1283 = 2000 orders  &#183;  0.3682 &#8722; 0.2424 = 0.1258, a 12.58-point gap one column can hold</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Raw order_hour asks for one straight line through that shape. One bin hands it the answer.</text>
</svg>
