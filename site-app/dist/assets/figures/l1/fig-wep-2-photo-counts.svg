<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The tally that hid the mistake</title>
  <desc>A photo-count table by class and surface. Not yet: thirty-eight fruit bowl, zero chopping board, twelve white plate. Ready: forty-one, zero, nine. Too far: zero fruit bowl, fifty chopping board, zero white plate. Other: twenty, fifteen, fifteen. The chopping board column is boxed: all fifty too-far photos and only fifteen others were taken there.</desc>
