  <circle cx="310" cy="140" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="227.5" cy="245" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="392.5" cy="175" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="145" cy="320" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="117.5" cy="355" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="172.5" cy="190" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
