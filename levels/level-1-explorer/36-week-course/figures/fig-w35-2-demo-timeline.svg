<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The five-minute demo, minute by minute</title>
  <desc>Six stacked segments from zero to five minutes: the annoyance, it works, how it learned, how good it is, where it fails, and the invitation. How it learned and where it fails are starred as the two segments that matter most.</desc>

  <text x="250" y="42" font-size="24" fill="#14202B" text-anchor="middle">The five-minute demo</text>

  <line x1="96" y1="70" x2="96" y2="640" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- 0:00 -->
  <text x="80" y="96" font-size="14" fill="#55636F" text-anchor="end">0:00</text>
  <rect x="112" y="70" width="368" height="66" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <text x="130" y="98" font-size="18" fill="#14202B">THE ANNOYANCE - 30 s</text>
  <text x="130" y="122" font-size="14" fill="#55636F">Start with the person, never the technology.</text>

  <!-- 0:30 -->
  <text x="80" y="172" font-size="14" fill="#55636F" text-anchor="end">0:30</text>
  <rect x="112" y="146" width="368" height="82" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="130" y="174" font-size="18" fill="#14202B">IT WORKS - 60 s</text>
  <text x="130" y="198" font-size="14" fill="#55636F">One item per class. Say the confidence out loud</text>
  <text x="130" y="218" font-size="14" fill="#55636F">every single time.</text>

  <!-- 1:30 -->
  <text x="80" y="264" font-size="14" fill="#55636F" text-anchor="end">1:30</text>
  <rect x="112" y="238" width="368" height="108" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="452" cy="264" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <path d="M452 254 L455 262 L463 262 L457 267 L459 275 L452 270 L445 275 L447 267 L441 262 L449 262 Z" fill="#C42B8C" stroke="none"/>
  <text x="130" y="266" font-size="18" fill="#14202B">HOW IT LEARNED - 90 s</text>
  <text x="130" y="290" font-size="14" fill="#55636F">"200 photos. I typed the answer next to each one.</text>
  <text x="130" y="310" font-size="14" fill="#55636F">Nobody wrote a rule." Name training, model,</text>
  <text x="130" y="330" font-size="14" fill="#55636F">prediction. Point at the data card as you talk.</text>

  <!-- 3:00 -->
  <text x="80" y="382" font-size="14" fill="#55636F" text-anchor="end">3:00</text>
  <rect x="112" y="356" width="368" height="82" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="130" y="384" font-size="18" fill="#14202B">HOW GOOD IT IS - 60 s</text>
  <text x="130" y="408" font-size="14" fill="#55636F">"30 out of 40 hidden photos. 75%. Guessing is</text>
  <text x="130" y="428" font-size="14" fill="#55636F">25%." Hand them the sheet.</text>

  <!-- 4:00 -->
  <text x="80" y="474" font-size="14" fill="#55636F" text-anchor="end">4:00</text>
  <rect x="112" y="448" width="368" height="108" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <circle cx="452" cy="474" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <path d="M452 464 L455 472 L463 472 L457 477 L459 485 L452 480 L445 485 L447 477 L441 472 L449 472 Z" fill="#C42B8C" stroke="none"/>
  <text x="130" y="476" font-size="18" fill="#14202B">WHERE IT FAILS - 45 s</text>
  <text x="130" y="500" font-size="14" fill="#55636F">"90% in daylight, 40% under a lamp. That is a</text>
  <text x="130" y="520" font-size="14" fill="#55636F">50-point gap, because 138 of my 160 training</text>
  <text x="130" y="540" font-size="14" fill="#55636F">photos were daylight." Then MAKE IT FAIL.</text>

  <!-- 4:45 -->
  <text x="80" y="592" font-size="14" fill="#55636F" text-anchor="end">4:45</text>
  <rect x="112" y="566" width="368" height="66" rx="10" fill="#F5F8FA" stroke="#55636F" stroke-width="3"/>
  <text x="130" y="594" font-size="18" fill="#14202B">THE INVITATION - 15 s</text>
  <text x="130" y="618" font-size="14" fill="#55636F">"Try to break it." Hand over the log and a pen.</text>

  <circle cx="140" cy="664" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <path d="M140 656 L142.5 663 L150 663 L144 667.5 L146 675 L140 670.5 L134 675 L136 667.5 L130 663 L137.5 663 Z" fill="#C42B8C" stroke="none"/>
  <text x="162" y="664" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">The two starred segments are the ones</text>
  <text x="162" y="682" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">nobody else at the fair has.</text>
</svg>
