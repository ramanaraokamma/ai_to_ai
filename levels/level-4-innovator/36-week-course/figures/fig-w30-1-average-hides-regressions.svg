<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Read every category, not just the average</title>
  <desc>Paired horizontal bars of accuracy on 30 frozen tickets, keyword rules versus a trained TF-IDF classifier. Greeting 1.000 to 0.833, refund 0.714 to 0.857, technical 0.571 to 0.714, billing 1.000 to 0.800, out_of_scope 1.000 to 0.200, overall 0.833 to 0.700. Greeting, billing, out_of_scope and overall are marked REGRESSION with a cross. Numbers from p10_compare.py, Week 30.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The average hides where it got worse</text>
