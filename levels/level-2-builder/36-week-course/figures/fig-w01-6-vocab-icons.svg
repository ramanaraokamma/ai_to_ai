  <line x1="698" y1="121" x2="718" y2="121" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round"/>
  <rect x="662" y="148" width="36" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="680" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#34;</text>
