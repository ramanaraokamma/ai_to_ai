<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four parts of a table</title>
  <desc>A four column table of backpack objects. Leader lines label the header row along the top, one highlighted row across, one highlighted column down, and the single outlined cell where that row and column cross.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Header, row, column, cell</text>

  <g stroke="#C42B8C" stroke-width="1.5" fill="none">
    <path d="M355 92 V116"/>
    <path d="M150 138 H216"/>
    <path d="M150 210 H216"/>
    <path d="M355 210 L440 210 L440 300 L520 300"/>
  </g>

  <rect x="310" y="156" width="90" height="108" fill="#F4D5E9" stroke="none"/>
  <rect x="220" y="192" width="360" height="36" fill="#E2F7ED" stroke="none"/>
  <path d="M220 128 A8 8 0 0 1 228 120 H572 A8 8 0 0 1 580 128 V156 H220 Z" fill="#D9EAF9" stroke="none"/>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="220" y1="192" x2="580" y2="192"/>
    <line x1="220" y1="228" x2="580" y2="228"/>
    <line x1="310" y1="156" x2="310" y2="264"/>
    <line x1="400" y1="156" x2="400" y2="264"/>
    <line x1="490" y1="156" x2="490" y2="264"/>
  </g>
  <line x1="220" y1="156" x2="580" y2="156" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="220" y="120" width="360" height="144" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="310" y="192" width="90" height="36" fill="none" stroke="#14202B" stroke-width="3"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="265" y="138" dominant-baseline="central">object</text>
    <text x="355" y="138" dominant-baseline="central">weight_g</text>
    <text x="445" y="138" dominant-baseline="central">length_cm</text>
    <text x="535" y="138" dominant-baseline="central">colour</text>
    <text x="265" y="174" dominant-baseline="central">pencil</text>
    <text x="355" y="174" dominant-baseline="central">6</text>
    <text x="445" y="174" dominant-baseline="central">18</text>
    <text x="535" y="174" dominant-baseline="central">yellow</text>
    <text x="265" y="210" dominant-baseline="central">book</text>
    <text x="355" y="210" dominant-baseline="central">340</text>
    <text x="445" y="210" dominant-baseline="central">26</text>
    <text x="535" y="210" dominant-baseline="central">blue</text>
    <text x="265" y="246" dominant-baseline="central">bottle</text>
    <text x="355" y="246" dominant-baseline="central">500</text>
    <text x="445" y="246" dominant-baseline="central">22</text>
    <text x="535" y="246" dominant-baseline="central">green</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="355" y="84" text-anchor="middle">COLUMN &#8212; one measurement, every object</text>
    <text x="146" y="134" text-anchor="end">HEADER</text>
    <text x="146" y="150" text-anchor="end" fill="#55636F">the names</text>
    <text x="146" y="206" text-anchor="end">ROW</text>
    <text x="146" y="222" text-anchor="end" fill="#55636F">one object</text>
    <text x="528" y="296">CELL &#8212; one measurement</text>
    <text x="528" y="314" fill="#55636F">of one object: the book weighs 340 g</text>
  </g>

  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A row is a thing. A column is a question you asked about every thing.</text>
</svg>
