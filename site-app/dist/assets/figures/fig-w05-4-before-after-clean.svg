<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The wrecked table before and after cleaning</title>
  <desc>Two panels. Before cleaning: twelve rows, six different day names, average sleep fifteen hours, average bag three point four two kilograms. After cleaning: eleven rows, three day names, average sleep seven point six seven hours, average bag four point zero five kilograms. A note underneath says the four hundred and eighty minute screen row was deliberately left alone.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same table, cleaned. Look what moved.</text>
  <line x1="400" y1="66" x2="400" y2="282" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

  <rect x="40" y="66" width="330" height="216" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="430" y="66" width="330" height="216" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>

  <g transform="translate(56,80) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(446,80) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="102" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">BEFORE &#8212; as handed in</text>
  <text x="492" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">AFTER &#8212; cleaned honestly</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="66" y="140">rows</text><text x="352" y="140" text-anchor="end">12</text>
    <text x="66" y="170">different spellings of Monday</text><text x="352" y="170" text-anchor="end">4</text>
    <text x="66" y="200">average sleep_h</text><text x="352" y="200" text-anchor="end">15.00 h</text>
    <text x="66" y="230">average bag_kg</text><text x="352" y="230" text-anchor="end">3.42 kg</text>
    <text x="66" y="260">average screen_min</text><text x="352" y="260" text-anchor="end">154 min</text>

    <text x="456" y="140">rows</text><text x="742" y="140" text-anchor="end">11</text>
    <text x="456" y="170">different spellings of Monday</text><text x="742" y="170" text-anchor="end">1</text>
    <text x="456" y="200">average sleep_h</text><text x="742" y="200" text-anchor="end">7.67 h</text>
    <text x="456" y="230">average bag_kg</text><text x="742" y="230" text-anchor="end">4.05 kg</text>
    <text x="456" y="260">average screen_min</text><text x="742" y="260" text-anchor="end">157 min</text>
  </g>

  <rect x="40" y="296" width="720" height="60" rx="10" fill="#F5F8FA" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(56,306) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="102" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Left alone on purpose: Friday 7 August, 480 screen-minutes.</text>
  <text x="102" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Legal, real, and probably the most interesting row in the whole table.</text>

  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One bad cell moved average sleep by more than seven hours. Cleaning is not tidying; it is repair.</text>
</svg>
