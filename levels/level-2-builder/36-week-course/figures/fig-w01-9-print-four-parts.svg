<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One instruction, four rules</title>
  <desc>A single line of code is split into four highlighted pieces: the name print, the pair of round brackets, the pair of quote marks, and the text inside. Four numbered callouts explain each piece, and a green panel below shows the one line that appears in the terminal.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One instruction, four rules</text>
  <rect x="150" y="96" width="500" height="58" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="168" y="106" width="74" height="38" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="250" y="106" width="26" height="38" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="280" y="106" width="22" height="38" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="306" y="106" width="150" height="38" rx="4" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="460" y="106" width="22" height="38" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="486" y="106" width="26" height="38" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="205" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">print</text>
  <text x="263" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">(</text>
  <text x="291" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#34;</text>
  <text x="381" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">Hello, world.</text>
  <text x="471" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#34;</text>
  <text x="499" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">)</text>
  <line x1="205" y1="96" x2="205" y2="74" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="112" y="44" width="186" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="205" y="59" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1. the name of the action</text>
  <line x1="263" y1="154" x2="263" y2="190" stroke="#1B7A4B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="499" y1="154" x2="499" y2="190" stroke="#1B7A4B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="190" y="190" width="382" height="30" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="381" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2. brackets: do it, using this. Every ( needs its )</text>
  <line x1="291" y1="154" x2="291" y2="246" stroke="#6D28D9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="471" y1="154" x2="471" y2="246" stroke="#6D28D9" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="190" y="246" width="382" height="30" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="381" y="261" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3. quotes: everything between us is TEXT</text>
  <line x1="381" y1="154" x2="650" y2="154" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="600" y="290" width="180" height="30" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="690" y="305" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4. the text itself</text>
  <line x1="690" y1="290" x2="650" y2="155" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="190" y="302" width="382" height="34" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="381" y="319" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">Hello, world.</text>
  <text x="381" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what appears in the terminal</text>
  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Get any one of the four wrong and Python stops. There is no partial credit.</text>
</svg>
