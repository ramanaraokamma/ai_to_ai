<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One attempt, in pen</title>
  <desc>On the left a scoring sheet drawn as a table with columns for the true label, what the model said, the confidence and a tick or cross, filled in with a pen. On the right the three scoring rules: one attempt per photo, write the row before the next photo, and record the confidence even when the answer is right.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One attempt, in pen</text>
  <rect x="40" y="78" width="360" height="248" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M40 88 A10 10 0 0 1 50 78 H390 A10 10 0 0 1 400 88 V116 H40 Z" fill="#D9EAF9" stroke="none"/>
  <line x1="40" y1="116" x2="400" y2="116" stroke="#14202B" stroke-width="3"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="40" y1="158" x2="400" y2="158"/>
    <line x1="40" y1="200" x2="400" y2="200"/>
    <line x1="40" y1="242" x2="400" y2="242"/>
    <line x1="40" y1="284" x2="400" y2="284"/>
    <line x1="150" y1="116" x2="150" y2="326"/>
    <line x1="252" y1="116" x2="252" y2="326"/>
    <line x1="322" y1="116" x2="322" y2="326"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
    <text x="95" y="102">TRUE label</text>
    <text x="201" y="102">model said</text>
    <text x="287" y="102">conf %</text>
    <text x="361" y="102">right?</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="95" y="142">spoon</text><text x="201" y="142">spoon</text><text x="287" y="142">96</text>
    <text x="95" y="184">spoon</text><text x="201" y="184">spoon</text><text x="287" y="184">91</text>
    <text x="95" y="226">toothbrush</text><text x="201" y="226">toothbrush</text><text x="287" y="226">88</text>
    <text x="95" y="268">comb</text><text x="201" y="268">comb</text><text x="287" y="268">77</text>
    <text x="95" y="310">comb</text><text x="201" y="310">toothbrush</text><text x="287" y="310">71</text>
  </g>
  <g stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="352,140 358,148 372,130"/>
    <polyline points="352,182 358,190 372,172"/>
    <polyline points="352,224 358,232 372,214"/>
    <polyline points="352,266 358,274 372,256"/>
  </g>
  <g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round">
    <line x1="353" y1="302" x2="371" y2="318"/>
    <line x1="371" y1="302" x2="353" y2="318"/>
  </g>
  <g>
    <circle cx="452" cy="122" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="452" cy="190" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="452" cy="258" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="452" y="127">1</text>
    <text x="452" y="195">2</text>
    <text x="452" y="263">3</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="478" y="118">One attempt per photo.</text>
    <text x="478" y="186">Write the row BEFORE</text>
    <text x="478" y="208">the next photo goes in.</text>
    <text x="478" y="254">Write the confidence</text>
    <text x="478" y="276">even when it was right.</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="478" y="140">No re-drops. No &#8220;that one was blurry&#8221;.</text>
    <text x="478" y="230">Not in batches, from memory.</text>
    <text x="478" y="298">You need both columns later.</text>
  </g>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">In pen, so nothing can be quietly improved once the totals are known.</text>
</svg>
