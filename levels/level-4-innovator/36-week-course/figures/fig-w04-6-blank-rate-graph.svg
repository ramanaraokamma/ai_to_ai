<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank axes for plotting the two hand-built learning-rate schedules</title>
  <desc>Empty graph paper. The bottom axis is the step from 0 to 50 with a faint line every 5 steps. The side axis is the rate from 0 to 0.02 with a faint line every 0.002. A small key at the top right has a dashed sample line for cosine only and a solid sample line for warm plus cosine, to be coloured in. Nothing is plotted.</desc>
