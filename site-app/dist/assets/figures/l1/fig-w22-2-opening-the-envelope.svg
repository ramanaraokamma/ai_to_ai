<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Opening the envelope</title>
  <desc>An envelope whose flap has been signed across and then torn open, with a stack of photo cards sliding out. Three numbered callouts read: signed shut in Week 19, never opened since, and fifteen photos scored once each.</desc>
