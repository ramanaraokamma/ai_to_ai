  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Word bank: table of examples · features and label · hide 20% before training · confusion matrix · the model</text>
