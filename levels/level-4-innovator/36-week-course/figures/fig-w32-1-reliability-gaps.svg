<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>In every confidence bucket the system said more than it delivered</title>
  <desc>Five confidence buckets of 40 invented results, stated against actual. 0.00 to 0.59: n 9, stated 0.551, actual 0.333. 0.60 to 0.69: n 7, 0.647, 0.571. 0.70 to 0.79: n 6, 0.753, 0.500. 0.80 to 0.89: n 8, 0.854, 0.750. 0.90 to 1.00: n 10, 0.931, 0.700. Every gap is negative; ECE is 0.1788. The sheet was invented by the teacher.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">When it said 0.93, it was right 70% of the time</text>
