<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The year in one picture, with its numbers</title>
  <desc>Four term bands, each carrying the arithmetic that term turned on. Term 1, the pipeline and what kind of wrong: the baseline a model has to beat is 0.712, recall on the fraud table is 4 divided by 57 equals 0.070, and F1 is 2 times 0.667 times 0.070 divided by 0.737 which is 0.127. Term 2, the maths of learning: a slope is a division, 3.0 divided by 0.5 equals 6; one descent step is 0 minus 1.0 times negative 0.5 which is plus 0.5; and slopes multiply along a chain, 3 times 14 equals 42. Term 3, the network: a 3 by 2 grid times a 2 by 4 grid gives 3 by 4 with row 0 column 0 equal to 1 times 10 plus 2 times 50 which is 110; the digit network holds 1,898 learnable numbers; 16 channels times 2 times 2 equals 64; and it read 528 of 540 unseen digits. Term 4, no labels, then words, then shipping: 178 wines with 13 columns and no answer key; the idf of a word in 1 of 4 documents is the natural log of 5 over 2 plus 1 which is 1.916; and the shipped artifact scores 0.8125 on 16 held-out rows with a p95 of 0.27 milliseconds over 111 logged requests.</desc>

  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The year in one picture, with its numbers</text>

  <!-- term 1 -->
  <rect x="40" y="64" width="720" height="68" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="56" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">TERM 1 &#183; weeks 1&#8211;9</text>
  <text x="56" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the pipeline, and</text>
  <text x="56" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what kind of wrong</text>
  <text x="240" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">baseline to beat  = 0.712</text>
  <text x="240" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">recall  4 &#247; 57   = 0.070</text>
  <text x="530" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">precision 4 &#247; 6 = 0.667</text>
  <text x="530" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">F1              = 0.127</text>

  <!-- term 2 -->
  <rect x="40" y="140" width="720" height="68" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="56" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">TERM 2 &#183; weeks 10&#8211;18</text>
  <text x="56" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the maths that</text>
  <text x="56" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">makes it learn</text>
  <text x="240" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">slope  3.0 &#247; 0.5 = 6</text>
  <text x="240" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">&#8722;ln(0.1)       = 2.30</text>
  <text x="530" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0 &#8722; 1.0&#215;(&#8722;0.5) = +0.5</text>
  <text x="530" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">chain  3 &#215; 14   = 42</text>

  <!-- term 3 -->
  <rect x="40" y="216" width="720" height="68" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="56" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">TERM 3 &#183; weeks 19&#8211;27</text>
  <text x="56" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the network, and</text>
  <text x="56" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the shapes in it</text>
  <text x="240" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(3,2)@(2,4) &#8594; (3,4)</text>
  <text x="240" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1&#215;10 + 2&#215;50   = 110</text>
  <text x="530" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">16&#215;2&#215;2        = 64</text>
  <text x="530" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1,898 weights read</text>
  <text x="530" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">528 of 540 unseen digits</text>

  <!-- term 4 -->
  <rect x="40" y="288" width="720" height="66" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="56" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">TERM 4 &#183; weeks 28&#8211;36</text>
  <text x="56" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">no labels, then</text>
  <text x="56" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">words, then ship it</text>
  <text x="240" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">178 wines, 13 columns</text>
  <text x="240" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">ln(5&#247;2) + 1  = 1.916</text>
  <text x="530" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">shipped: 0.8125 of 16</text>
  <text x="530" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">p95 0.27 ms, 111 lines</text>

  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every one of these you did on paper before a machine agreed with you.</text>
</svg>
