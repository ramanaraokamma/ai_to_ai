<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the confusion matrix</title>
  <desc>A three by three confusion matrix for an apple, banana and orange model, with row and column totals. Marker A sits on the banana diagonal cell holding five. Marker B sits on the true orange, said apple cell holding two. Marker C sits on the apple row total. Marker D sits on the orange column total. Four empty boxes are provided for the student to write what each one means.</desc>
