  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same chart. Same data. One of these two captions is worth marks.</text>
</svg>
