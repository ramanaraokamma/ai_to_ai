<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"
     aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The Level 2 pipeline in Week 21: still stage three's numpy and DataFrames tile, now the table has names on its columns</title>
  <desc id="d">A left-to-right pipeline turns a question into an answer you can defend, through five stages: speak Python, hold the data, clean it, see it, predict and check. Stage one, speak Python, is solid and both of its tiles are finished in plain white: print, variables and maths, weeks 1 to 4, and choices and loops, weeks 5 to 9. Stage two, hold the data, is solid and finished: both of its tiles — functions and lists, weeks 10 to 12, and dicts, rows and files, weeks 13 to 18 — are plain white. Stage three, clean it, is solid because we are standing inside it. Its first tile — numpy and DataFrames, weeks 19 to 22 — is tinted gold and badged "you are here" for the third week running: this is the week the DataFrame arrives, a table whose columns have names and whose rows have an index, read with df.head() and df.info(). Stage three's second tile, holes and duplicates, weeks 23 to 24, is still dashed. The last two stages — see it, and predict and check — are dashed too, meaning not yet, along with all four of their tiles: your first chart, week 25; honest axes, weeks 26 to 27; X, y, kNN and trees, weeks 28 to 31; and bake-off and capstone, weeks 32 to 36. Between the stage boxes, small arrows and the line: each stage feeds the next — you cannot clean data you cannot hold. Along the bottom, seven threads: only representation is lit; toolcraft, data, model, learning signal, evaluation and impact stay white. The footer line reads: Week 21: the container the rest of the year runs on. Read df.info() first, always.</desc>

  <!-- ── banner ───────────────────────────────────────────────────── -->
  <text x="400" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#14202B">
    A QUESTION  →  AN ANSWER YOU CAN DEFEND</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#55636F">
    thirty-six weeks, five stages, one pipeline</text>

  <!-- ── stage 1: SPEAK PYTHON ───────────────────────────────────────── -->
  <g>
    <rect x="26" y="82" width="140" height="52" rx="11" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <text x="96" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#14202B">SPEAK</text>
    <text x="96" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#14202B">PYTHON</text>
    <rect x="26" y="146" width="140" height="58" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <text x="96" y="167" text-anchor="middle" font-size="12" fill="#14202B">print · variables</text>
    <text x="96" y="184" text-anchor="middle" font-size="12" fill="#14202B">· maths</text>
    <text x="96" y="199" text-anchor="middle" font-size="12" fill="#55636F">wk 1–4</text>
    <rect x="26" y="244" width="140" height="48" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <text x="96" y="266" text-anchor="middle" font-size="12" fill="#14202B">choices · loops</text>
    <text x="96" y="283" text-anchor="middle" font-size="12" fill="#55636F">wk 5–9</text>
  </g>

  <!-- ── stage 2: HOLD THE DATA ──────────────────────────────────────── -->
  <g>
    <rect x="178" y="82" width="140" height="52" rx="11" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <text x="248" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#14202B">HOLD</text>
    <text x="248" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#14202B">THE DATA</text>
    <rect x="178" y="146" width="140" height="58" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <text x="248" y="172" text-anchor="middle" font-size="12" fill="#14202B">functions · lists</text>
    <text x="248" y="194" text-anchor="middle" font-size="12" fill="#55636F">wk 10–12</text>
    <rect x="178" y="244" width="140" height="48" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <text x="248" y="266" text-anchor="middle" font-size="12" fill="#14202B">dicts · rows · files</text>
    <text x="248" y="283" text-anchor="middle" font-size="12" fill="#55636F">wk 13–18</text>
  </g>

  <!-- ── stage 3: CLEAN IT — we are inside it ────────────────────────── -->
  <g>
    <rect x="330" y="82" width="140" height="52" rx="11" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <text x="400" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#14202B">CLEAN IT</text>
    <rect x="330" y="146" width="140" height="58" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <text x="400" y="172" text-anchor="middle" font-size="12" fill="#14202B">numpy · DataFrames</text>
    <text x="400" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#845F00">wk 19–22</text>
