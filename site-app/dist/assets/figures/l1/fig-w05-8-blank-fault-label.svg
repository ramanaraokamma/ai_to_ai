<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Name the fault at each pin</title>
  <desc>A six row library table where one row is one borrowed book, with the legal ranges printed beside it. Five numbered pink pins point at a repeated row, a negative number of days, an empty pages box, a shelf column spelled two ways, and one very large but legal value of ninety days.</desc>
  <text x="400" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five pins. Name each one — and one of them is not a fault.</text>

  <!-- legal ranges panel -->
  <rect x="24" y="104" width="152" height="120" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="100" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#845F00" text-anchor="middle">LEGAL RANGES</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
    <text x="40" y="156">days_out  1 to 120</text>
    <text x="40" y="180">pages  1 to 2000</text>
    <text x="40" y="204">shelf  a category</text>
  </g>

  <!-- bracket for the shelf column, drawn before the table -->
  <g stroke="#C42B8C" stroke-width="1.5" fill="none">
    <path d="M700 164 H710 V294 H700"/>
    <path d="M710 229 H726"/>
    <path d="M186 203 H200"/>
  </g>

  <!-- the table -->
  <rect x="200" y="110" width="500" height="184" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M200 118 A8 8 0 0 1 208 110 H692 A8 8 0 0 1 700 118 V138 H200 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="200" y1="164" x2="700" y2="164"/>
    <line x1="200" y1="190" x2="700" y2="190"/>
    <line x1="200" y1="216" x2="700" y2="216"/>
    <line x1="200" y1="242" x2="700" y2="242"/>
    <line x1="200" y1="268" x2="700" y2="268"/>
    <line x1="260" y1="110" x2="260" y2="294"/>
    <line x1="360" y1="110" x2="360" y2="294"/>
    <line x1="460" y1="110" x2="460" y2="294"/>
    <line x1="560" y1="110" x2="560" y2="294"/>
  </g>
  <line x1="200" y1="138" x2="700" y2="138" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="200" y="110" width="500" height="184" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
    <text x="230" y="130">id</text><text x="310" y="130">title</text><text x="410" y="130">days_out</text><text x="510" y="130">pages</text><text x="630" y="130">shelf</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="230" y="157">1</text><text x="310" y="157">hobbit</text><text x="405" y="157">14</text><text x="510" y="157">310</text><text x="630" y="157">fiction</text>
    <text x="230" y="183">2</text><text x="310" y="183">atlas</text><text x="405" y="183">7</text><text x="510" y="183">96</text><text x="630" y="183">Reference</text>
    <text x="230" y="209">2</text><text x="310" y="209">atlas</text><text x="405" y="209">7</text><text x="510" y="209">96</text><text x="630" y="209">Reference</text>
    <text x="230" y="235">3</text><text x="310" y="235">poems</text><text x="405" y="235">-3</text><text x="510" y="235">120</text><text x="630" y="235">poetry</text>
    <text x="230" y="261">4</text><text x="310" y="261">space</text><text x="405" y="261">21</text><text x="630" y="261">reference</text>
    <text x="230" y="287">5</text><text x="310" y="287">maths</text><text x="405" y="287">90</text><text x="510" y="287">240</text><text x="630" y="287">reference</text>
  </g>

  <!-- pins -->
  <g>
    <circle cx="175" cy="203" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="175" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1</text>
    <circle cx="443" cy="230" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="443" y="235" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2</text>
    <circle cx="510" cy="256" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="510" y="261" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">3</text>
    <circle cx="739" cy="229" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="739" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4</text>
    <circle cx="443" cy="282" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="443" y="287" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">5</text>
  </g>

  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">One row = one borrowed book.</text>
  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">For each pin write the kind of fault and the fix — or write "not a fault" and say why.</text>
</svg>
