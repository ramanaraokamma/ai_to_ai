<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A blank worksheet: cut 20 numbers into 5 heads and write each shape on the way to the score table</title>
  <desc>A strip of 20 numbered cells under the line B equal 3, T equal 4, d equal 20, H equal 5. Below, empty boxes for the head width dh and for the knobs in the three tables, then three empty boxes joined by arrows for the shape after view, the shape after transpose, and the shape of the score table. No answer is written.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Blank: cut a width into heads</text>
  <text x="400" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">B = 3 sentences, T = 4 words, d = 20 numbers per word, H = 5 heads</text>
