<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the confusion matrix</title>
  <desc>A filled three by three grid of numbers with four empty label boxes: one above the columns, one beside the rows, one pointing at the shaded corner to corner cells, and one pointing at a single cell containing the number two.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">Label the confusion matrix</text>

    <rect x="330" y="52" width="210" height="32" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <line x1="344" y1="74" x2="526" y2="74" stroke="#C7CDD4" stroke-width="1.5"/>
    <line x1="420" y1="84" x2="420" y2="98" stroke="#C42B8C" stroke-width="2"/>

    <rect x="36" y="176" width="196" height="32" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <line x1="50" y1="198" x2="218" y2="198" stroke="#C7CDD4" stroke-width="1.5"/>
    <line x1="232" y1="192" x2="252" y2="192" stroke="#C42B8C" stroke-width="2"/>

    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="340" y="112">spoon</text>
      <text x="420" y="112">brush</text>
      <text x="500" y="112">comb</text>
    </g>
    <g font-size="14" fill="#55636F" text-anchor="end">
      <text x="294" y="155">spoon</text>
      <text x="294" y="215">brush</text>
      <text x="294" y="275">comb</text>
    </g>

    <g fill="#E2F7ED" stroke="none">
      <rect x="300" y="120" width="80" height="60"/>
      <rect x="380" y="180" width="80" height="60"/>
      <rect x="460" y="240" width="80" height="60"/>
    </g>
    <g stroke="#14202B" stroke-width="2" fill="none">
      <rect x="300" y="120" width="240" height="180" rx="4"/>
      <line x1="380" y1="120" x2="380" y2="300"/>
      <line x1="460" y1="120" x2="460" y2="300"/>
      <line x1="300" y1="180" x2="540" y2="180"/>
      <line x1="300" y1="240" x2="540" y2="240"/>
    </g>
    <g font-size="24" fill="#14202B" text-anchor="middle">
      <text x="340" y="158">5</text><text x="420" y="158">0</text><text x="500" y="158">0</text>
      <text x="340" y="218">0</text><text x="420" y="218">4</text><text x="500" y="218">1</text>
      <text x="340" y="278">1</text><text x="420" y="278">2</text><text x="500" y="278">2</text>
    </g>
    <rect x="380" y="240" width="80" height="60" fill="none" stroke="#C42B8C" stroke-width="3"/>

    <line x1="540" y1="150" x2="588" y2="140" stroke="#C42B8C" stroke-width="2"/>
    <rect x="588" y="124" width="184" height="32" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <line x1="602" y1="146" x2="758" y2="146" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="588" y="118" font-size="12" fill="#55636F">the three shaded cells are the...</text>

    <line x1="460" y1="270" x2="588" y2="262" stroke="#C42B8C" stroke-width="2"/>
    <rect x="588" y="246" width="184" height="32" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <line x1="602" y1="268" x2="758" y2="268" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="588" y="240" font-size="12" fill="#55636F">the pink cell is an...</text>

    <rect x="588" y="292" width="184" height="60" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <line x1="602" y1="316" x2="758" y2="316" stroke="#C7CDD4" stroke-width="1.5"/>
    <line x1="602" y1="342" x2="758" y2="342" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="588" y="288" font-size="12" fill="#55636F">say the pink cell as a sentence:</text>

    <text x="300" y="336" font-size="14" fill="#55636F">Then write both checks underneath the grid:</text>
    <line x1="300" y1="366" x2="540" y2="366" stroke="#C7CDD4" stroke-width="1.5"/>
    <line x1="36" y1="366" x2="276" y2="366" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="36" y="336" font-size="14" fill="#55636F">diagonal =</text>
  </g>
</svg>
