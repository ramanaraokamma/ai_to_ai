<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the four parts of a filled-in sentence</title>
  <desc>A sentence panel reading Per slice with an empty pink gap and a dial set to two. Leader lines marked A, B, C and D point at the letter in front of the quote, the gap, the dial and the box holding one point zero six two five. An arrow leads to the finished line Per slice one point zero six. Blank write-in lines wait for each label.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the four parts of a filled-in sentence</text>
  <rect x="180" y="86" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="200" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B">Per slice:</text>
  <rect x="300" y="92" width="66" height="32" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="372" y="92" width="90" height="32" rx="4" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="417" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">dial: 2</text>
  <line x1="160" y1="108" x2="120" y2="108" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="112" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="end">A</text>
  <line x1="333" y1="86" x2="333" y2="64" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="333" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">B</text>
  <line x1="417" y1="86" x2="417" y2="64" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="417" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">C</text>
  <line x1="333" y1="196" x2="333" y2="132" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(333 132) rotate(-90.0)"/>
  <rect x="272" y="196" width="122" height="44" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="333" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.0625</text>
  <line x1="394" y1="218" x2="470" y2="218" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="478" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C">D</text>
  <line x1="500" y1="150" x2="560" y2="150" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(560 150) rotate(0.0)"/>
  <rect x="566" y="126" width="200" height="48" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="666" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">Per slice: 1.06</text>
  <text x="666" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what a reader ends up seeing</text>
  <text x="60" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">A ______________________________</text>
  <text x="60" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">B ______________________________</text>
  <text x="440" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">C ______________________________</text>
  <text x="440" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">D ______________________________</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Then answer: after the sentence is printed, what is still inside D?</text>
  <rect x="200" y="352" width="400" height="24" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="212" y1="367" x2="588" y2="367" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
