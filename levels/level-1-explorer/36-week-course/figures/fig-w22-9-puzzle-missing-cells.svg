<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Puzzle: the missing cells</title>
  <desc>A three by three confusion matrix for a pizza, pasta and salad model with four cells replaced by question marks. Row totals are all five, column totals are five, six and four, and a clue panel says the model got ten of the fifteen right.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Puzzle: the missing cells</text><text x="267.0" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">what the model SAID</text><text x="50" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">TRUTH</text><text x="189.0" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">pizza</text><text x="267.0" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">pasta</text><text x="345.0" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">salad</text><text x="423" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">total</text><text x="50" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">pizza</text><rect x="150" y="136" width="78" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="189.0" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">4</text><rect x="231" y="139" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="267.0" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">?</text><rect x="306" y="136" width="78" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="345.0" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="384" y="136" width="78" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="423" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">5</text><text x="50" y="201" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">pasta</text><rect x="153" y="179" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="189.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">?</text><rect x="231" y="179" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="267.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">?</text><rect x="306" y="176" width="78" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="345.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="384" y="176" width="78" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="423" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">5</text><text x="50" y="241" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">salad</text><rect x="150" y="216" width="78" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="189.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="231" y="219" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="267.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">?</text><rect x="306" y="216" width="78" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="345.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2</text><rect x="384" y="216" width="78" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="423" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">5</text><text x="50" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">total</text><rect x="150" y="256" width="78" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="189.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">5</text><rect x="228" y="256" width="78" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="267.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">8</text><rect x="306" y="256" width="78" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="345.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">2</text><rect x="384" y="256" width="78" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="423" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">15</text><rect x="150" y="136" width="234" height="120" fill="none" stroke="#14202B" stroke-width="3"/><rect x="510" y="104" width="250" height="212" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/><text x="635" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the clues</text><text x="524" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Every row adds to 5.</text><text x="524" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Every column total is given.</text><text x="524" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Fifteen photos in all.</text><text x="524" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The model got 10 right.</text><text x="524" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Fill the four “?” cells,</text><text x="524" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">then check the diagonal.</text><text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Only one set of four whole numbers fits. Find them, then name the worst class.</text>
  </g>
</svg>
