<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank frame: draw your own door</title>
  <desc>An empty drawing frame split by a vertical dashed line, with the left side headed what I can do now and the right side headed what I want to build next.</desc>
  <rect x="24" y="24" width="752" height="352" rx="12" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 36 A12 12 0 0 1 36 24 H764 A12 12 0 0 1 776 36 V78 H24 Z" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="78" x2="776" y2="78" stroke="#14202B" stroke-width="3"/>
  <text x="46" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B">DRAW YOUR OWN DOOR</text>
  <text x="756" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end">Name: ________________</text>
  <line x1="400" y1="94" x2="400" y2="322" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="44" y="118" width="312" height="204" rx="8" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="444" y="118" width="312" height="204" rx="8" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="200" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What I can do now</text>
  <text x="600" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What I want to build next</text>
  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Put at least one real number from your own booth on the left-hand side.</text>
</svg>
