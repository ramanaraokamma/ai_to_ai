<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>A thermostat is four if-then steps in a loop</title>
  <desc>A flowchart. Step one reads the room temperature. Step two asks whether it is below twenty degrees. If yes the heater turns on, if no the heater turns off. Both paths lead to waiting one minute, and an arrow loops back to step one.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="40" font-size="24" fill="#14202B" text-anchor="middle">A thermostat is four steps in a loop</text>

    <g stroke="#55636F" stroke-width="2" fill="none">
      <path d="M250 122 V158"/>
      <path d="M250 232 V262 H130 V296"/>
      <path d="M250 232 V262 H370 V296"/>
      <path d="M130 356 V400 H250 V438"/>
      <path d="M370 356 V400 H250 V438"/>
      <path d="M250 502 V540 H430 V90 H358"/>
    </g>
    <polyline points="352,84 364,90 352,96" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="244,152 250,160 256,152" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="244,432 250,440 256,432" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-size="14" fill="#55636F">
      <text x="176" y="256" text-anchor="middle">YES, it is cold</text>
      <text x="326" y="256" text-anchor="middle">NO, it is warm</text>
      <text x="424" y="562" text-anchor="end">do it all again, forever</text>
    </g>

    <rect x="130" y="62" width="240" height="60" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="250" y="86" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1. Read the</text>
    <text x="250" y="108" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">room temperature</text>

    <rect x="110" y="160" width="280" height="72" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="250" y="186" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2. Is it below 20 degrees?</text>
    <text x="250" y="212" font-size="14" fill="#55636F" text-anchor="middle" dominant-baseline="central">the one question it can ask</text>

    <rect x="30" y="296" width="200" height="60" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="130" y="326" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">3a. Heater ON</text>

    <rect x="270" y="296" width="200" height="60" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="370" y="326" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">3b. Heater OFF</text>

    <rect x="130" y="440" width="240" height="62" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="250" y="471" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">4. Wait one minute</text>

    <rect x="40" y="576" width="420" height="86" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="60" y="604" font-size="14" fill="#845F00">A human wrote every box on this page.</text>
    <text x="60" y="626" font-size="14" fill="#14202B">IF temperature &lt; 20 THEN heater ON</text>
    <text x="60" y="648" font-size="14" fill="#14202B">OTHERWISE heater OFF</text>

    <text x="250" y="686" font-size="14" fill="#55636F" text-anchor="middle">No judgement anywhere. Nothing here can surprise the person who wrote it.</text>
  </g>
</svg>
