<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>DPO measures how far each answer moved from a frozen copy, and beta scales the gap before the loss</title>
  <desc>Two number lines of log-chance from minus 21 to minus 17. Chosen answer: reference minus 20.0, now minus 19.0, an arrow to the right marked moved plus 1.0. Rejected answer: reference minus 18.0, now minus 19.5, an arrow to the left marked moved minus 1.5. The gap is 1.0 minus minus 1.5, which is 2.5. On the right, the same gap at beta 0.1 gives margin 0.25, sigmoid 0.5622 and loss 0.5759; at beta 5 it gives margin 12.5, sigmoid 1.0000 and loss 0.000004.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Moved = now minus the frozen copy</text>
  <line x1="110" y1="262" x2="490" y2="262" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="262" x2="110" y2="268" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="110" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;21</text>
  <line x1="205" y1="262" x2="205" y2="268" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="205" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;20</text>
  <line x1="300" y1="262" x2="300" y2="268" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="300" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;19</text>
  <line x1="395" y1="262" x2="395" y2="268" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="395" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;18</text>
  <line x1="490" y1="262" x2="490" y2="268" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="490" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;17</text>
  <text x="300" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">log-chance of the answer (higher = more likely)</text>
  <line x1="110" y1="120" x2="490" y2="120" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="20" y="125" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">chosen</text>
  <line x1="215" y1="120" x2="290" y2="120" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(290 120) rotate(0)"/>
  <circle cx="205" cy="120" r="7" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <rect x="293" y="113" width="14" height="14" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="205" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ref &#8722;20.0</text>
  <text x="300" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">now &#8722;19.0</text>
  <text x="252.5" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">moved +1.0</text>
  <line x1="110" y1="200" x2="490" y2="200" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="20" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">rejected</text>
  <line x1="385" y1="200" x2="262.5" y2="200" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(262.5 200) rotate(180)"/>
  <circle cx="395" cy="200" r="7" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <rect x="245.5" y="193" width="14" height="14" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="395" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ref &#8722;18.0</text>
  <text x="252.5" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">now &#8722;19.5</text>
  <text x="323.8" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">moved &#8722;1.5</text>
  <rect x="130" y="314" width="340" height="40" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="300" y="334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">gap = 1.0 &#8722; (&#8722;1.5) = 2.5</text>
  <rect x="530" y="90" width="250" height="110" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="655" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">beta = 0.1</text>
  <text x="655" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">margin = 0.1 &#215; 2.5 = 0.25</text>
  <text x="655" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">sigmoid = 0.5622</text>
  <text x="655" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">loss 0.5759</text>
  <rect x="530" y="215" width="250" height="110" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="655" y="239" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">beta = 5</text>
  <text x="655" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">margin = 5 &#215; 2.5 = 12.5</text>
  <text x="655" y="287" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">sigmoid = 1.0000</text>
  <text x="655" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">loss 0.000004</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The frozen copy never moves; the same gap gives two very different losses.</text>
</svg>
