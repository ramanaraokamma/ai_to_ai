  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Invented scores 0.0, 2.0, &#8722;1.0, 1.0, 0.5. b gets 0.958, 0.563, 0.375. Each panel adds to 1.000.</text>
</svg>
