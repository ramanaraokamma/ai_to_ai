<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the projection</title>
  <desc>A grid holds the five centred points minus four minus four, minus two minus one, zero zero, two one and four four, with one candidate axis drawn through the origin at sixty degrees and a dashed right-angle drop from each point onto it. Empty dashed boxes ask for the direction pair as a cosine and a sine, the five signed scores along the axis, the four variance steps, and the spread. A final panel asks which of two named angles was wider and by how much.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the projection</text>
  <text x="250" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">centred points: (-4,-4) (-2,-1) (0,0) (2,1) (4,4)</text>
  <rect x="30" y="84" width="440" height="250" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <line x1="140" y1="209" x2="360" y2="209" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="99" x2="250" y2="319" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="366" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">across</text>
  <text x="256" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">up</text>
  <line x1="190" y1="312.923" x2="310" y2="105.077" stroke="#6D28D9" stroke-width="4" stroke-linecap="round"/>
  <text x="290" y="147.038" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6D28D9" text-anchor="start">your axis</text>
  <line x1="162" y1="297" x2="189.895" y2="313.105" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="206" y1="231" x2="229.474" y2="244.553" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="250" y1="209" x2="250" y2="209" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="294" y1="187" x2="270.526" y2="173.447" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="338" y1="121" x2="310.105" y2="104.895" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="162" cy="297" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="206" cy="231" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="250" cy="209" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="294" cy="187" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="338" cy="121" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="44" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1F6FB2" text-anchor="start">the cloud, already centred on (0,0)</text>
  <text x="44" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">each dashed line drops onto the axis at a right angle</text>
  <rect x="30" y="346" width="440" height="178" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#C42B8C" text-anchor="start">fill these in for YOUR angle</text>
  <text x="44" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">angle =</text>
  <rect x="104" y="384" width="74" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="190" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">direction = ( cos, sin ) = (</text>
  <rect x="392" y="384" width="62" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="44" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">, </text>
  <rect x="66" y="416" width="62" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="134" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">)   the five scores:</text>
  <rect x="290" y="416" width="164" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="44" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">squares added up =</text>
  <rect x="182" y="448" width="100" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="296" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">&#247; 4 = spread</text>
  <rect x="404" y="448" width="50" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="44" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">two of my five scores must be NEGATIVE. Are they?</text>
  <rect x="404" y="488" width="50" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="536" width="440" height="140" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle">Then compare with the class</text>
  <text x="44" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">widest of the six angles:</text>
  <rect x="228" y="576" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="306" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">spread</text>
  <rect x="366" y="576" width="88" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="44" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">what PCA says:</text>
  <rect x="168" y="610" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="246" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">spread</text>
  <rect x="306" y="610" width="88" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="44" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">so my grid was short by</text>
  <rect x="226" y="646" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="304" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">degrees</text>
</svg>
