<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the two-by-two grid</title>
  <desc>An empty two by two grid with blank boxes for the two column headings, the two row headings, and the four cells. Two of the cells are the error cells and must be named.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fill in every empty box</text>
  <text x="400" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The flag is "spam". Two cells are right, two are wrong — and the two wrong ones have names.</text>

  <!-- column headings -->
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="290" y="86" width="220" height="36" rx="8"/>
    <rect x="530" y="86" width="220" height="36" rx="8"/>
  </g>
  <!-- row headings -->
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="50" y="146" width="220" height="36" rx="8"/>
    <rect x="50" y="252" width="220" height="36" rx="8"/>
  </g>

  <!-- the four cells -->
  <g fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round">
    <rect x="290" y="134" width="220" height="106" rx="10"/>
    <rect x="530" y="134" width="220" height="106" rx="10"/>
    <rect x="290" y="246" width="220" height="106" rx="10"/>
    <rect x="530" y="246" width="220" height="106" rx="10"/>
  </g>
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="306" y="168" width="188" height="38" rx="8"/>
    <rect x="546" y="168" width="188" height="38" rx="8"/>
    <rect x="306" y="280" width="188" height="38" rx="8"/>
    <rect x="546" y="280" width="188" height="38" rx="8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="400" y="162">name this cell</text>
    <text x="640" y="162">name this cell</text>
    <text x="400" y="274">name this cell</text>
    <text x="640" y="274">name this cell</text>
    <text x="400" y="80">what the rulebook said</text>
    <text x="640" y="80">what the rulebook said</text>
  </g>
  <text x="30" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what was actually true</text>
  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Read every cell as a whole sentence before you write in it: "truly ham, and the rulebook said spam — that is a..."</text>
</svg>
