<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 36 words, drawn</title>
  <desc>Five tiles: a marked paper for the assessment, a checklist with a not yet box for self-assessment, an open log with a pen for the break-it log, a doorway for the Level 2 gate, and a rosette for the certificate.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five words for the last week</text>
  <rect x="24" y="60" width="240" height="150" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="280" y="60" width="240" height="150" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="536" y="60" width="240" height="150" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="152" y="228" width="240" height="150" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="408" y="228" width="240" height="150" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="108" y="76" width="72" height="90" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#55636F" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="94" x2="168" y2="94"/><line x1="120" y1="110" x2="168" y2="110"/><line x1="120" y1="126" x2="152" y2="126"/>
  </g>
  <text x="158" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">/60</text>
  <text x="144" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the assessment</text>
  <text x="144" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a mirror, not a verdict</text>
  <g fill="none" stroke="#14202B" stroke-width="2.5" stroke-linejoin="round">
    <rect x="336" y="80" width="20" height="20" rx="4"/>
    <rect x="336" y="110" width="20" height="20" rx="4"/>
    <rect x="336" y="140" width="20" height="20" rx="4"/>
  </g>
  <polyline points="339,91 344,97 353,84" fill="none" stroke="#1B7A4B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="339,121 344,127 353,114" fill="none" stroke="#1B7A4B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="366" y="96">yes</text>
    <text x="366" y="126">yes</text>
  </g>
  <text x="366" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C">not yet - W20</text>
  <text x="400" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">self-assessment</text>
  <text x="400" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">"not yet" needs a week number</text>
  <rect x="596" y="80" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="596" y1="104" x2="716" y2="104"/><line x1="596" y1="126" x2="716" y2="126"/>
    <line x1="640" y1="80" x2="640" y2="160"/>
  </g>
  <line x1="672" y1="152" x2="726" y2="118" stroke="#C42B8C" stroke-width="4" stroke-linecap="round"/>
  <text x="656" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the break-it log</text>
  <text x="656" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">open, pen resting on it</text>
  <rect x="234" y="246" width="78" height="98" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="300" cy="298" r="5" fill="#845F00"/>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="320" y1="298" x2="356" y2="298"/>
    <polyline points="348,290 358,298 348,306" stroke-linejoin="round"/>
  </g>
  <text x="272" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the Level 2 gate</text>
  <text x="272" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">six honest questions</text>
  <circle cx="480" cy="288" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <polyline points="464,290 475,302 498,276" fill="none" stroke="#845F00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M468 314 L462 348 L480 338 L498 348 L492 314" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="522" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">the certificate</text>
  <text x="522" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">two numbers you</text>
  <text x="522" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">measured yourself</text>
</svg>
