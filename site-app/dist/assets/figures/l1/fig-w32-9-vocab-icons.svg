<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words, drawn</title>
  <desc>Five icon panels. Personal data is an identity card with a face and lines. Metadata is a photo with a hidden tag showing a time and GPS. Deepfake is two identical faces, one ticked as real and one crossed as made up. Over-trust is a speech bubble saying ninety eight percent with a cross beside it. Automation bias is a car following a road straight into water.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words</text>
  <g fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5">
    <rect x="30" y="70" width="140" height="186" rx="10"/>
    <rect x="182" y="70" width="140" height="186" rx="10"/>
    <rect x="334" y="70" width="140" height="186" rx="10"/>
    <rect x="486" y="70" width="140" height="186" rx="10"/>
    <rect x="638" y="70" width="140" height="186" rx="10"/>
  </g>
  <rect x="54" y="100" width="92" height="120" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="100" cy="138" r="18" fill="#E8C671" stroke="#845F00" stroke-width="2.5"/>
  <g stroke="#55636F" stroke-width="3" stroke-linecap="round">
    <line x1="68" y1="176" x2="132" y2="176"/>
    <line x1="68" y1="192" x2="132" y2="192"/>
    <line x1="68" y1="208" x2="112" y2="208"/>
  </g>
  <rect x="206" y="100" width="92" height="76" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="212" y="106" width="80" height="60" rx="4" fill="#D9EAF9" stroke="none"/>
  <circle cx="230" cy="122" r="7" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M212 166 L238 144 L254 158 L268 146 L292 166 Z" fill="#1F6FB2" stroke="none"/>
  <rect x="212" y="106" width="80" height="60" rx="4" fill="none" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="214" y="186" width="76" height="46" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="252" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">12:04</text>
  <text x="252" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">GPS</text>
  <circle cx="378" cy="140" r="26" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <circle cx="370" cy="136" r="3.5" fill="#14202B"/>
  <circle cx="386" cy="136" r="3.5" fill="#14202B"/>
  <path d="M370 150 Q378 157 386 150" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="430" cy="140" r="26" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <circle cx="422" cy="136" r="3.5" fill="#14202B"/>
  <circle cx="438" cy="136" r="3.5" fill="#14202B"/>
  <path d="M422 150 Q430 157 438 150" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(364,178) scale(0.28)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(416,178) scale(0.28)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="404" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">which is which?</text>
  <path d="M510 108 H602 A12 12 0 0 1 614 120 V158 A12 12 0 0 1 602 170 H568 L546 190 L550 170 H510 A12 12 0 0 1 498 158 V120 A12 12 0 0 1 510 108 Z" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="556" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">98% sure</text>
  <g transform="translate(540,196) scale(0.32)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="556" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sure, and wrong</text>
  <line x1="652" y1="176" x2="766" y2="176" stroke="#55636F" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <rect x="664" y="132" width="56" height="26" rx="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="678" cy="164" r="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <circle cx="708" cy="164" r="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <path d="M648 200 Q666 190 684 200 Q702 210 720 200 Q738 190 756 200 V228 H648 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="702" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the screen said so</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="100" y="286">personal data</text>
    <text x="252" y="286">metadata</text>
    <text x="404" y="286">deepfake</text>
    <text x="556" y="286">over-trust</text>
    <text x="708" y="286">automation</text>
    <text x="708" y="306">bias</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="100" y="312">Facts that point</text>
    <text x="100" y="330">at one person</text>
    <text x="252" y="312">Hidden notes a</text>
    <text x="252" y="330">file keeps on itself</text>
    <text x="404" y="312">A real person made</text>
    <text x="404" y="330">to do what they didn't</text>
    <text x="556" y="312">Believing it because</text>
    <text x="556" y="330">it sounded sure</text>
    <text x="708" y="330">Machine beats</text>
    <text x="708" y="348">your own eyes</text>
  </g>
</svg>
