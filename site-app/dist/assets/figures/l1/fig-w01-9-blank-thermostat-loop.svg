<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the thermostat loop</title>
  <desc>Four empty numbered boxes joined by downward arrows, with a loop arrow leading from the last box back to the first. The student writes one step of a thermostat's if-then loop in each box.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="44" font-size="24" fill="#14202B" text-anchor="middle">Label the thermostat loop</text>

    <g stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="250" y1="150" x2="250" y2="205"/>
      <polyline points="242,196 250,208 258,196" stroke-linejoin="round"/>
      <line x1="250" y1="280" x2="250" y2="335"/>
      <polyline points="242,326 250,338 258,326" stroke-linejoin="round"/>
      <line x1="250" y1="410" x2="250" y2="465"/>
      <polyline points="242,456 250,468 258,456" stroke-linejoin="round"/>
    </g>
    <g stroke="#C42B8C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 545 H450 V110 H400"/>
      <polyline points="410,102 398,110 410,118"/>
    </g>
    <text x="462" y="330" font-size="14" fill="#C42B8C" text-anchor="middle" transform="rotate(-90 462 330)">and start again, for ever</text>

    <rect x="100" y="80" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <line x1="120" y1="125" x2="380" y2="125" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="100" y="210" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <line x1="120" y1="255" x2="380" y2="255" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="100" y="340" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <line x1="120" y1="385" x2="380" y2="385" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="100" y="470" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <line x1="120" y1="515" x2="380" y2="515" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>

    <g>
      <circle cx="70" cy="115" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="70" y="116" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
      <circle cx="70" cy="245" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="70" y="246" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
      <circle cx="70" cy="375" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="70" y="376" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
      <circle cx="70" cy="505" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="70" y="506" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    </g>

    <text x="250" y="600" font-size="18" fill="#14202B" text-anchor="middle">Write one step in each box.</text>
    <text x="250" y="632" font-size="14" fill="#55636F" text-anchor="middle">Word bank: wait one minute &#183; read the temperature &#183;</text>
    <text x="250" y="652" font-size="14" fill="#55636F" text-anchor="middle">is it below 20 degrees? &#183; heater on, or heater off</text>
    <text x="250" y="672" font-size="14" fill="#55636F" text-anchor="middle">A person wrote every one of these boxes.</text>
  </g>
</svg>
