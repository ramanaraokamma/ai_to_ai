<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Four cells, four names</title>
  <desc>A two by two table of 1000 validation orders. Rows are what actually happened, columns are what the model said. Top left, True Negative, 979, ticked. Top right, False Positive, 7, crossed. Bottom left, False Negative, 11, crossed. Bottom right, True Positive, 3, ticked. Underneath, the check 979 plus 7 plus 11 plus 3 equals 1000, and each cell written out in words: 979 legit orders correctly left alone, 7 legit orders wrongly flagged, 11 real frauds missed, 3 real frauds caught.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four cells, four names</text>
  <text x="250" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1000 validation orders &#183; 986 legit, 14 fraud</text>
  <text x="200" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">predicted legit</text>
  <text x="340" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">predicted fraud</text>
  <text x="122" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">actual legit</text>
  <text x="122" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">actual fraud</text>
  <rect x="130" y="120" width="140" height="80" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/>
  <rect x="270" y="120" width="140" height="80" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/>
  <rect x="130" y="200" width="140" height="80" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/>
  <rect x="270" y="200" width="140" height="80" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/>
  <rect x="130" y="120" width="280" height="160" fill="none" stroke="#14202B" stroke-width="3"/>
  <polyline points="138,132 144,138 156,126" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200.0" y="153.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">True Negative</text>
  <text x="200.0" y="187.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">979</text>
  <line x1="278" y1="128" x2="292" y2="140" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <line x1="292" y1="128" x2="278" y2="140" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="340.0" y="153.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">False Positive</text>
  <text x="340.0" y="187.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">7</text>
  <line x1="138" y1="208" x2="152" y2="220" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="208" x2="138" y2="220" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="200.0" y="233.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">False Negative</text>
  <text x="200.0" y="267.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">11</text>
  <polyline points="278,212 284,218 296,206" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340.0" y="233.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">True Positive</text>
  <text x="340.0" y="267.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">3</text>
  <text x="250" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">979 + 7 + 11 + 3 = 1000</text>
  <text x="60" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">979 legit orders I correctly left alone</text>
  <text x="60" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">7 legit orders I wrongly flagged &#8212; a false alarm</text>
  <text x="60" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">11 real frauds I missed &#8212; they went through</text>
  <text x="60" y="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">3 real frauds I caught</text>
  <text x="250" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Rows are what happened. Columns are what the model said.</text>
</svg>
