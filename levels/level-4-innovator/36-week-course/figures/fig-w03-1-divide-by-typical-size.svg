<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Dividing each gradient by its own typical size cancels the scale, so a thousand-times-bigger knob looks the same</title>
  <desc>Three rows, each a list of two knob gradients, its root-mean-square, and the list divided by that size. The list 3 and minus 4 has typical size 3.5355; 300 and minus 400 has 353.5534; 3000 and minus 4000 has 3535.5339. In every row the list divided by its typical size is the same: 0.8485 and minus 1.1314. Each list is a tensor of shape (2,).</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Divide by the typical size and the scale disappears</text>
  <text x="155" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">knob gradients</text>
  <text x="400" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">typical size (RMS)</text>
  <text x="650" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">gradient &#247; typical size</text>
  <line x1="270" y1="138" x2="308" y2="138" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(308 138) rotate(0)"/>
  <line x1="492" y1="138" x2="528" y2="138" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(528 138) rotate(0)"/>
  <rect x="40" y="110" width="230" height="56" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="54" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">3 and &#8722;4</text>
  <rect x="218" y="125" width="42" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="239" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(2,)</text>
  <rect x="310" y="110" width="180" height="56" rx="10" fill="#F5F8FA" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">3.5355</text>
  <rect x="530" y="110" width="240" height="56" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="544" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">0.8485 and &#8722;1.1314</text>
  <rect x="718" y="125" width="42" height="26" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="739" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(2,)</text>
