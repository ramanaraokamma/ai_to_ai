<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Nila's brief, written before she took a single photo</title>
  <desc>A filled-in brief card with six lines. Problem: about three bananas a week get thrown out at home. Input: one webcam photo of one banana. Output: not yet, ready, too far, or other. Baseline: four roughly equal classes so one quarter, twenty-five per cent. Success bar, highlighted: I will call it useful if it beats sixty per cent. Worst case: someone eats a bad banana, nobody is hurt.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Nila's brief, written before she took a single photo</text>
  <rect x="40" y="68" width="720" height="262" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="240" y="104.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" font-weight="700">PROBLEM</text>
  <text x="266" y="106.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">About 3 bananas a week get thrown out at home.</text>
  <text x="240" y="146.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" font-weight="700">INPUT</text>
  <text x="266" y="148.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">one webcam photo of one banana</text>
  <text x="240" y="188.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" font-weight="700">OUTPUT</text>
  <text x="266" y="190.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">not_yet  .  ready  .  too_far  .  other</text>
  <text x="240" y="230.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" font-weight="700">BASELINE</text>
  <text x="266" y="232.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">4 roughly equal classes, so 1/4 = 25%</text>
  <text x="200" y="272.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" font-weight="700">SUCCESS BAR</text>
  <text x="266" y="274.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">I will call it useful if it beats 60%</text>
  <circle cx="220" cy="268" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="220" y="272.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">!</text>
  <rect x="258" y="250" width="372" height="36" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="266" y="274.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">I will call it useful if it beats 60%</text>
  <text x="240" y="314.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" font-weight="700">WORST CASE</text>
  <text x="266" y="316.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">someone eats a bad banana. Nobody is hurt.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The success bar is written first, in ink, so the goalposts cannot move later.</text>
</svg>
