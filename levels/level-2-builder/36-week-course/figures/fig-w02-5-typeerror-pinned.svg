<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Python refuses to guess, and tells you so</title>
  <desc>On the left, a red-outlined traceback panel whose highlighted line adds a text five to a number five, with a final red line reading TypeError, can only concatenate str, not int, to str. On the right, a green-outlined terminal shows the two deliberate fixes printing 10 and 55.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Python refuses to guess, and tells you so</text>
  <rect x="38" y="168" width="334" height="22" rx="4" fill="#F6AEA6"/>
  <path d="M30 90 A10 10 0 0 1 40 80 H370 A10 10 0 0 1 380 90 V116 H30 Z" fill="#F6AEA6"/>
  <g stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"><line x1="42" y1="90" x2="52" y2="100"/><line x1="52" y1="90" x2="42" y2="100"/></g>
  <text x="64" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Traceback</text>
  <line x1="30" y1="116" x2="380" y2="116" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="42" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">Traceback (most recent call last):</text>
  <text x="42" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">  File "collision.py", line 2, in &lt;module&gt;</text>
  <text x="42" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    print("5" + 5)</text>
  <text x="42" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">TypeError: can only concatenate</text>
  <text x="42" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">str (not "int") to str</text>
  <rect x="30" y="80" width="350" height="176" rx="10" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="205" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Read the last line first.</text>
  <line x1="480" y1="182" x2="388" y2="182" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(388 182) rotate(180)"/>
  <text x="394" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">this line</text>
  <path d="M490 90 A10 10 0 0 1 500 80 H760 A10 10 0 0 1 770 90 V116 H490 Z" fill="#E2F7ED"/>
  <polyline points="503.2,91.1 509.25,97.7 521.9,83.4" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="524" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Terminal</text>
  <line x1="490" y1="116" x2="770" y2="116" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="504" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#55636F">&gt;</text>
  <text x="518" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">python3 two_fixes.py</text>
  <text x="504" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">10</text>
  <text x="504" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">55</text>
  <rect x="490" y="80" width="280" height="176" rx="10" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="205" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Before: it stopped</text>
  <text x="630" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">After: it ran</text>
  <text x="205" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it cannot tell 10 from 55</text>
  <text x="630" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you said which one, two ways</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">It is not being awkward. Both answers were possible, so it asked you to choose.</text>
</svg>
