<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A low temperature makes the best letter win by a lot; a high one makes the chances nearly flat</title>
  <desc>Three bar charts of the chances of five letters a to e, built from the same five scores. At T = 0.3 the chances are 0.001, 0.958, 0.000, 0.034, 0.006. At T = 1 they are 0.076, 0.563, 0.028, 0.207, 0.126. At T = 2 they are 0.138, 0.375, 0.084, 0.227, 0.177. The bar for b is pink with a thick border in every panel and shrinks from 0.958 to 0.375. Each panel is a vector of shape (5,) and adds to 1.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Temperature changes how much the best letter wins by</text>
  <rect x="20" y="62" width="240" height="268" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="130" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">T = 0.3</text>
  <rect x="203" y="72" width="42" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="224" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(5,)</text>
