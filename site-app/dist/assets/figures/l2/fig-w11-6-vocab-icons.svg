<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Five icon cards. A list is a row of three slots under one name plate reading scores. An index is the pink number 0, 1 or 2 written under each slot. An element is one slot lifted out of the row, leaving a dashed gap. Append adds a green slot on the end with nothing else moving. IndexError is a dashed empty slot numbered 3 with a red cross beside it.</desc>
