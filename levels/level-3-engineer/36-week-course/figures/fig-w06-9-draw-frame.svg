<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw the moment the value appears</title>
  <desc>Two empty framed panels. The upper one is for drawing a timeline for one pizza order, marking the moment the prediction is needed, which is when the customer clicks order, and the moment customer_called_support gets a value, which is after the delivery has arrived late and the customer has rung up, about an hour later. The lower one is for drawing the same model twice, once in the lab where the column is filled in and once on the day it is switched on where the column is 0 for every row. A panel at the bottom says what a good answer contains: two clearly separate moments with the gap labelled, the prediction moment drawn before the value exists, recall 0.9217 in the lab against 0.0174 in production, 2 late orders flagged out of 115, and the sentence that leakage is a design accident rather than dishonesty.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the moment the value appears</text>
  <text x="250" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Not is this column allowed. When does this value appear.</text>
  <rect x="30" y="80" width="440" height="176" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Side 1 &#8212; one order, on a timeline</text>
  <text x="46" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">mark both moments, and label the gap between them</text>
  <line x1="46" y1="200" x2="454" y2="200" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="194" x2="46" y2="206" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="148" y1="194" x2="148" y2="206" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="250" y1="194" x2="250" y2="206" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="352" y1="194" x2="352" y2="206" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="454" y1="194" x2="454" y2="206" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="46" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the prediction moment</text>
  <text x="300" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the value's moment</text>
  <rect x="30" y="272" width="440" height="176" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Side 2 &#8212; the same model, twice</text>
  <text x="46" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">in the lab, and on the day it is switched on</text>
  <line x1="46" y1="392" x2="454" y2="392" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="46" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">put a recall on each side, and a count of what it caught</text>
  <rect x="30" y="464" width="440" height="212" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="490" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="516" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; two moments, clearly apart, with the gap labelled</text>
  <text x="48" y="538" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the prediction moment comes BEFORE the value exists</text>
  <text x="48" y="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; recall 0.9217 in the lab, 0.0174 in production</text>
  <text x="48" y="582" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; 115 late orders in the pile, and 2 of them flagged</text>
  <text x="48" y="604" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the fake 0.9762 and the honest 0.7752 both written down</text>
  <text x="48" y="626" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#183; one line: nobody cheated. it was a design accident.</text>
  <text x="48" y="648" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#183; and the question, in your own handwriting, in full</text>
</svg>
