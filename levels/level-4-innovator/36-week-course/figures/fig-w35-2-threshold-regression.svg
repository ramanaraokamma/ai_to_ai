<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One change to the threshold flipped four named cases: that is a regression, caught</title>
  <desc>A number line of best-note scores from 0 to 0.40 with a dashed cut at tau 0.10 (v1) and a solid cut at tau 0.36 (v2). Four cases sit between: c09 at 0.133, c01 at 0.151, c03 at 0.236 and c19 at 0.357. Under v2 all four are refused: c01, c03 and c09 go from pass to FAIL and c19 goes from fail to pass. Overall 17 to 15 of 25, factual 8 to 5 of 9, out_of_scope 2 to 3 of 3.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One threshold change, four flipped cases</text>
  <line x1="60" y1="200" x2="760" y2="200" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="196" x2="60" y2="204" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="60" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="235" y1="196" x2="235" y2="204" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="235" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.1</text>
  <line x1="410" y1="196" x2="410" y2="204" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="410" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.2</text>
  <line x1="585" y1="196" x2="585" y2="204" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="585" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.3</text>
  <line x1="760" y1="196" x2="760" y2="204" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="760" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.4</text>
  <line x1="235" y1="112" x2="235" y2="290" stroke="#845F00" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
