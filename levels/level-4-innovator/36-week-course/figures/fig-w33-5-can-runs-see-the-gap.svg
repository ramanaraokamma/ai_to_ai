<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A gap is visible only when its bar passes the noise line, and a small gap needs about a thousand runs</title>
  <desc>Two panels, counts from the stand-in on a log scale. Each row shows the gap in counts as a bar and twice the combined wobble as a black line. Big gap, 0.6 against 0.3: n 20 gap 7 against 5.9, n 50 gap 19 against 9.2, n 200 gap 65 against 18.9, n 1000 gap 327 against 42.1, all ticked as more than noise. Small gap, 0.30 against 0.24: n 20 gap 2 against 5.8, n 50 gap 5 against 8.6, n 200 gap 8 against 18.1, each crossed as not distinguishable, and n 1000 gap 85 against 39.4, ticked.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Can n runs see the gap?</text>
