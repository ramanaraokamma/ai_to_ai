<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Practice on, or practice off?</title>
  <desc>Eight labelled cards about cricket practice. Each card lists the sky, the ground and whether kit was brought, and carries a label reading ON or OFF. One of the three clues decides every card.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="42" font-size="24" fill="#14202B" text-anchor="middle">Practice on, or practice off?</text>

    <rect x="35" y="80" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="222" cy="100" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="222" y="101" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
    <g font-size="14" fill="#14202B">
      <text x="50" y="112">sky: sunny</text>
      <text x="50" y="134">ground: dry</text>
      <text x="50" y="156">kit: yes</text>
    </g>
    <rect x="145" y="170" width="82" height="30" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
    <polyline points="151,185 157,192 169,176" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="185" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ON</text>

    <rect x="265" y="80" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="452" cy="100" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="452" y="101" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    <g font-size="14" fill="#14202B">
      <text x="280" y="112">sky: rainy</text>
      <text x="280" y="134">ground: wet</text>
      <text x="280" y="156">kit: yes</text>
    </g>
    <rect x="375" y="170" width="82" height="30" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
    <g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round">
      <line x1="381" y1="178" x2="393" y2="190"/>
      <line x1="393" y1="178" x2="381" y2="190"/>
    </g>
    <text x="430" y="185" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">OFF</text>

    <rect x="35" y="225" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="222" cy="245" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="222" y="246" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <g font-size="14" fill="#14202B">
      <text x="50" y="257">sky: cloudy</text>
      <text x="50" y="279">ground: dry</text>
      <text x="50" y="301">kit: no</text>
    </g>
    <rect x="145" y="315" width="82" height="30" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
    <polyline points="151,330 157,337 169,321" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="330" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ON</text>

    <rect x="265" y="225" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="452" cy="245" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="452" y="246" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    <g font-size="14" fill="#14202B">
      <text x="280" y="257">sky: rainy</text>
      <text x="280" y="279">ground: dry</text>
      <text x="280" y="301">kit: yes</text>
    </g>
    <rect x="375" y="315" width="82" height="30" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
    <polyline points="381,330 387,337 399,321" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="430" y="330" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ON</text>

    <rect x="35" y="370" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="222" cy="390" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="222" y="391" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
    <g font-size="14" fill="#14202B">
      <text x="50" y="402">sky: sunny</text>
      <text x="50" y="424">ground: wet</text>
      <text x="50" y="446">kit: yes</text>
    </g>
    <rect x="145" y="460" width="82" height="30" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
    <g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round">
      <line x1="151" y1="468" x2="163" y2="480"/>
      <line x1="163" y1="468" x2="151" y2="480"/>
    </g>
    <text x="200" y="475" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">OFF</text>

    <rect x="265" y="370" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="452" cy="390" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="452" y="391" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
    <g font-size="14" fill="#14202B">
      <text x="280" y="402">sky: cloudy</text>
      <text x="280" y="424">ground: wet</text>
      <text x="280" y="446">kit: no</text>
    </g>
    <rect x="375" y="460" width="82" height="30" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
    <g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round">
      <line x1="381" y1="468" x2="393" y2="480"/>
      <line x1="393" y1="468" x2="381" y2="480"/>
    </g>
    <text x="430" y="475" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">OFF</text>

    <rect x="35" y="515" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="222" cy="535" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="222" y="536" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
    <g font-size="14" fill="#14202B">
      <text x="50" y="547">sky: sunny</text>
      <text x="50" y="569">ground: dry</text>
      <text x="50" y="591">kit: no</text>
    </g>
    <rect x="145" y="605" width="82" height="30" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
    <polyline points="151,620 157,627 169,611" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="620" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ON</text>

    <rect x="265" y="515" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="452" cy="535" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    <text x="452" y="536" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">8</text>
    <g font-size="14" fill="#14202B">
      <text x="280" y="547">sky: cloudy</text>
      <text x="280" y="569">ground: dry</text>
      <text x="280" y="591">kit: yes</text>
    </g>
    <rect x="375" y="605" width="82" height="30" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
    <polyline points="381,620 387,627 399,611" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="430" y="620" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ON</text>

    <text x="250" y="656" font-size="14" fill="#55636F" text-anchor="middle">Two of the three clues tell you nothing at all.</text>
    <text x="250" y="676" font-size="14" fill="#55636F" text-anchor="middle">Find the one clue that gets all eight cards right.</text>
  </g>
</svg>
