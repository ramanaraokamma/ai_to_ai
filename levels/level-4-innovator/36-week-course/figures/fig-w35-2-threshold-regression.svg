  <text x="690" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">v2 cut: tau 0.36</text>
  <line x1="292.8" y1="210" x2="292.8" y2="250" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
