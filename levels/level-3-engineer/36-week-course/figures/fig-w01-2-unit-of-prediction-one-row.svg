<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One request. Three different tables. Pick one.</title>
  <desc>Three panels, each a small stack of table rows. The first says one row equals one order and holds 2020 rows, asking will this order be late; it is ringed and ticked as the choice. The second says one row equals one restaurant-day and holds 35 rows. The third says one row equals one restaurant and holds 5 rows. Same file, three completely different tables.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One request. Three different tables. Pick one.</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">&#8220;Our deliveries are bad. Can AI fix it?&#8221;</text>
  <rect x="30" y="92" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="140" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">one row = one order</text>
  <rect x="76" y="134" width="128" height="16" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="76" y="150" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="76" y="166" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="76" y="182" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="76" y="198" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="140" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2020 rows</text>
  <text x="140" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">will THIS order</text>
  <text x="140" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">be late?</text>
  <g transform="translate(198,96) scale(0.36)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="140" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">we choose this one</text>
  <rect x="290" y="92" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">one row = one restaurant-day</text>
  <rect x="336" y="134" width="128" height="16" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="336" y="150" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="336" y="166" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="336" y="182" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="336" y="198" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">35 rows</text>
  <text x="400" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">how many late</text>
  <text x="400" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">orders on Tuesday?</text>
  <rect x="550" y="92" width="220" height="240" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">one row = one restaurant</text>
  <rect x="596" y="134" width="128" height="16" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="596" y="150" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="596" y="166" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="596" y="182" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="596" y="198" width="128" height="16" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="660" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">5 rows</text>
  <text x="660" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">which branch is</text>
  <text x="660" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the worst?</text>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Same file. 2020 rows, or 35, or 5 &#8212; and three different models. The sentence comes first.</text>
</svg>
