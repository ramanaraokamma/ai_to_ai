<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>nn.Linear is the grid multiply plus the bias</title>
  <desc>A row of input holding 1.0 and 2.0 meets a three by two grid of weights holding 0.5, minus 0.3, 0.8, 0.2, minus 1.0 and 1.5, then a bias column of 0.2, 0.05 and minus 0.2, giving an answer row of 0.10, 1.25 and 1.80. Underneath, the first answer is worked out in full: 1.0 times 0.5 plus 2.0 times minus 0.3 plus 0.2 equals 0.10.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">nn.Linear(2, 3) holds a grid and a bias</text>
  <text x="40" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one row in</text>
  <rect x="40" y="102" width="44" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="62" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.0</text>
  <rect x="84" y="102" width="44" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="106" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.0</text>
  <rect x="46.2" y="145" width="75.6" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="84" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">x (1, 2)</text>
  <text x="150" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">&#215;</text>
  <text x="180" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the grid</text>
  <rect x="180" y="102" width="48" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="204" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.5</text>
  <rect x="228" y="102" width="48" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="252" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8722;0.3</text>
  <rect x="180" y="136" width="48" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="204" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.8</text>
  <rect x="228" y="136" width="48" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="252" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.2</text>
  <rect x="180" y="170" width="48" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="204" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8722;1.0</text>
  <rect x="228" y="170" width="48" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="252" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.5</text>
  <rect x="172.2" y="213" width="111.6" height="26" rx="6" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="228" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">weight (3, 2)</text>
  <text x="300" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
  <text x="330" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the bias</text>
  <rect x="330" y="102" width="56" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="358" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.2</text>
  <rect x="330" y="136" width="56" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="358" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.05</text>
  <rect x="330" y="170" width="56" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <text x="358" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8722;0.2</text>
  <rect x="316.6" y="213" width="82.8" height="26" rx="6" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="358" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">bias (3,)</text>
  <text x="412" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
  <text x="440" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one row out</text>
  <rect x="440" y="102" width="62" height="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="471" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.10</text>
  <rect x="502" y="102" width="62" height="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="533" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.25</text>
  <rect x="564" y="102" width="62" height="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="595" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.80</text>
  <rect x="488" y="145" width="90" height="26" rx="6" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="533" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">out (1, 3)</text>
  <line x1="204" y1="136" x2="204" y2="96" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <rect x="600" y="190" width="180" height="66" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="690" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3 rows &#215; 2 columns</text>
  <text x="690" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">= 6 weights, plus</text>
  <text x="690" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3 biases = 9 numbers</text>
  <rect x="40" y="280" width="740" height="96" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="60" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">row 0 of the answer:  1.0 &#215; 0.5  +  2.0 &#215; (&#8722;0.3)  +  0.2  =  0.5 &#8722; 0.6 + 0.2  =  0.10</text>
  <text x="60" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">row 1:  1.0 &#215; 0.8 + 2.0 &#215; 0.2 + 0.05  =  1.25</text>
  <text x="430" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">row 2:  1.0 &#215; (&#8722;1.0) + 2.0 &#215; 1.5 &#8722; 0.2  =  1.80</text>
  <text x="60" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">PyTorch stores the grid outputs-first: (3, 2), not (2, 3). Same nine numbers, written the other way up.</text>
</svg>
