<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>How to read a margin</title>
  <desc>Four bands from top to bottom. A margin of sixty or more means not even close, so act on it. Thirty to fifty-nine is reasonably clear, act but log it. Fifteen to twenty-nine is shaky, check it twice. Under fifteen is a coin toss, do not act. Each band shows a pair of bars for the top and second scores.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">How to read a margin</text>

    <g font-size="12" fill="#55636F">
      <text x="60" y="78">margin</text>
      <text x="200" y="78">top bar vs second bar</text>
      <text x="430" y="78">what it means</text>
      <text x="640" y="78">what to do</text>
    </g>

    <rect x="40" y="88" width="720" height="58" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="117" font-size="18" fill="#14202B" dominant-baseline="central">60 or more</text>
    <rect x="200" y="100" width="130" height="13" rx="4" fill="#1B7A4B"/>
    <text x="342" y="107" font-size="12" fill="#55636F" dominant-baseline="central">91</text>
    <rect x="200" y="121" width="8" height="13" rx="4" fill="#55636F"/>
    <text x="220" y="128" font-size="12" fill="#55636F" dominant-baseline="central">5</text>
    <text x="430" y="117" font-size="18" fill="#14202B" dominant-baseline="central">Not even close</text>
    <text x="640" y="117" font-size="18" fill="#14202B" dominant-baseline="central">Act on it</text>

    <rect x="40" y="152" width="720" height="58" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="181" font-size="18" fill="#14202B" dominant-baseline="central">30 to 59</text>
    <rect x="200" y="164" width="90" height="13" rx="4" fill="#1F6FB2"/>
    <text x="302" y="171" font-size="12" fill="#55636F" dominant-baseline="central">62</text>
    <rect x="200" y="185" width="30" height="13" rx="4" fill="#55636F"/>
    <text x="242" y="192" font-size="12" fill="#55636F" dominant-baseline="central">21</text>
    <text x="430" y="181" font-size="18" fill="#14202B" dominant-baseline="central">Reasonably clear</text>
    <text x="640" y="181" font-size="18" fill="#14202B" dominant-baseline="central">Act, but log it</text>

    <rect x="40" y="216" width="720" height="58" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="245" font-size="18" fill="#14202B" dominant-baseline="central">15 to 29</text>
    <rect x="200" y="228" width="64" height="13" rx="4" fill="#845F00"/>
    <text x="276" y="235" font-size="12" fill="#55636F" dominant-baseline="central">44</text>
    <rect x="200" y="249" width="44" height="13" rx="4" fill="#55636F"/>
    <text x="256" y="256" font-size="12" fill="#55636F" dominant-baseline="central">30</text>
    <text x="430" y="245" font-size="18" fill="#14202B" dominant-baseline="central">Shaky — it could flip</text>
    <text x="640" y="245" font-size="18" fill="#14202B" dominant-baseline="central">Check it twice</text>

    <rect x="40" y="280" width="720" height="58" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="309" font-size="18" fill="#14202B" dominant-baseline="central">under 15</text>
    <rect x="200" y="292" width="57" height="13" rx="4" fill="#CC2B1D"/>
    <text x="269" y="299" font-size="12" fill="#55636F" dominant-baseline="central">39</text>
    <rect x="200" y="313" width="50" height="13" rx="4" fill="#55636F"/>
    <text x="262" y="320" font-size="12" fill="#55636F" dominant-baseline="central">34</text>
    <text x="430" y="309" font-size="18" fill="#14202B" dominant-baseline="central">A coin toss</text>
    <text x="640" y="309" font-size="18" fill="#14202B" dominant-baseline="central">Do not act</text>

    <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">The margin is the gap between the two bars — not the length of the top one.</text>
  </g>
</svg>
