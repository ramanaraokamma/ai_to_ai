<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A curve, or sixteen straight pieces joined</title>
  <desc>Two panels. On the left, crossed out, a genuinely smooth arc labelled no corners anywhere at any zoom. On the right, ticked, the same shape drawn as eight straight segments with pink hinge dots between them, labelled one ReLU unit equals one hinge, sixteen units equals sixteen hinges. A strip underneath prints 1 hidden unit train accuracy 0.8350, 16 hidden units train accuracy 0.9350, and the subtraction 0.9350 minus 0.8350 equals 0.1000.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Wrong and right: is the boundary a curve?</text>
  <rect x="30" y="62" width="350" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="48" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">&#10007; &#8220;the network drew a curve&#8221;</text>
  <rect x="48" y="104" width="314" height="202" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="60,180.9 67.4,185.3 74.8,190 82.2,194.7 89.6,199.4 97,204.2 104.4,209 111.8,213.8 119.2,218.5 126.6,223.2 134,227.7 141.4,232.1 148.8,236.3 156.2,240.4 163.6,244.2 171,247.8 178.4,251.2 185.8,254.2 193.2,257 200.6,259.5 208,261.6 215.4,263.4 222.8,264.8 230.2,265.9 237.6,266.6 245,267 252.4,266.9 259.8,266.5 267.2,265.8 274.6,264.6 282,263.2 289.4,261.3 296.8,259.1 304.2,256.6 311.6,253.8 319,250.7 326.4,247.3 333.8,243.7 341.2,239.8 348.6,235.8 356,231.5" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">no corners anywhere, at any zoom</text>
  <line x1="332" y1="120" x2="348" y2="136" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="348" y1="120" x2="332" y2="136" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <rect x="420" y="62" width="350" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="438" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">&#10003; straight pieces, joined</text>
  <rect x="438" y="104" width="314" height="202" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="450,258 490,232 532,246 574,196 616,178 658,200 700,158 740,148" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="490" cy="232" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="532" cy="246" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="574" cy="196" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="616" cy="178" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="658" cy="200" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="700" cy="158" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="454" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one ReLU unit = one hinge</text>
  <polyline points="722,128 727.6,134.4 738.8,120" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="300" width="740" height="62" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1 hidden unit: train accuracy 0.8350 &#183; 16 hidden units: train accuracy 0.9350</text>
  <text x="400" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.9350 &#8722; 0.8350 = 0.1000 &#8212; that tenth is what the extra fifteen hinges bought.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Zoom in and the corners are visible. Sixteen hinges only look like a curve.</text>
</svg>
