<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 4 words as pictures</title>
  <desc>Five icon cards in a row. Data is a notebook with writing in it. Table is a grid with a shaded top line. Row is a single horizontal strip pulled out of a grid. Column is a single upright strip pulled out of a grid. Header is the shaded top line of a grid, lifted clear.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
  <rect x="20" y="60" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="176" y="60" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="332" y="60" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="488" y="60" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="644" y="60" width="136" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- 1 data : notebook with writing -->
  <g transform="translate(50,90)">
    <rect x="0" y="0" width="88" height="106" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <line x1="20" y1="0" x2="20" y2="106" stroke="#845F00" stroke-width="2"/>
    <g stroke="#55636F" stroke-width="3" stroke-linecap="round">
      <line x1="32" y1="22" x2="74" y2="22"/>
      <line x1="32" y1="42" x2="74" y2="42"/>
      <line x1="32" y1="62" x2="66" y2="62"/>
      <line x1="32" y1="82" x2="74" y2="82"/>
    </g>
    <circle cx="10" cy="20" r="4" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
    <circle cx="10" cy="53" r="4" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
    <circle cx="10" cy="86" r="4" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  </g>
  <text x="93" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">data</text>
  <text x="93" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what you noticed,</text>
  <text x="93" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">written down</text>

  <!-- 2 table : full grid -->
  <g transform="translate(206,92)">
    <rect x="0" y="0" width="86" height="102" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 8 A8 8 0 0 1 8 0 H78 A8 8 0 0 1 86 8 V26 H0 Z" fill="#D9EAF9" stroke="none"/>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="0" y1="51" x2="86" y2="51"/>
      <line x1="0" y1="77" x2="86" y2="77"/>
      <line x1="29" y1="0" x2="29" y2="102"/>
      <line x1="57" y1="0" x2="57" y2="102"/>
    </g>
    <line x1="0" y1="26" x2="86" y2="26" stroke="#1F6FB2" stroke-width="3"/>
    <rect x="0" y="0" width="86" height="102" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="249" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">table</text>
  <text x="249" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rows and</text>
  <text x="249" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">columns</text>

  <!-- 3 row : one strip pulled out sideways -->
  <g transform="translate(356,92)">
    <rect x="0" y="0" width="86" height="102" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="0" y1="26" x2="86" y2="26"/>
      <line x1="0" y1="77" x2="86" y2="77"/>
      <line x1="29" y1="0" x2="29" y2="102"/>
      <line x1="57" y1="0" x2="57" y2="102"/>
    </g>
    <rect x="-8" y="42" width="102" height="27" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="1.5">
      <line x1="21" y1="42" x2="21" y2="69"/>
      <line x1="49" y1="42" x2="49" y2="69"/>
      <line x1="70" y1="42" x2="70" y2="69"/>
    </g>
  </g>
  <text x="405" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">row</text>
  <text x="405" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one example —</text>
  <text x="405" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one single thing</text>

  <!-- 4 column : one upright strip pulled out -->
  <g transform="translate(518,92)">
    <rect x="0" y="0" width="86" height="102" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="0" y1="26" x2="86" y2="26"/>
      <line x1="0" y1="51" x2="86" y2="51"/>
      <line x1="0" y1="77" x2="86" y2="77"/>
      <line x1="29" y1="0" x2="29" y2="102"/>
    </g>
    <rect x="34" y="-8" width="28" height="118" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="1.5">
      <line x1="34" y1="20" x2="62" y2="20"/>
      <line x1="34" y1="47" x2="62" y2="47"/>
      <line x1="34" y1="74" x2="62" y2="74"/>
    </g>
  </g>
  <text x="561" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">column</text>
  <text x="561" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one measurement,</text>
  <text x="561" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">every row</text>

  <!-- 5 header : top line lifted clear -->
  <g transform="translate(668,92)">
    <rect x="0" y="-6" width="88" height="26" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#845F00" stroke-width="1.5">
      <line x1="29" y1="-6" x2="29" y2="20"/>
      <line x1="59" y1="-6" x2="59" y2="20"/>
    </g>
    <rect x="0" y="34" width="88" height="76" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="0" y1="60" x2="88" y2="60"/>
      <line x1="0" y1="86" x2="88" y2="86"/>
      <line x1="29" y1="34" x2="29" y2="110"/>
      <line x1="59" y1="34" x2="59" y2="110"/>
    </g>
    <g stroke="#845F00" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5">
      <line x1="14" y1="22" x2="14" y2="32"/>
      <line x1="74" y1="22" x2="74" y2="32"/>
    </g>
  </g>
  <text x="712" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">header</text>
  <text x="712" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">names the columns.</text>
  <text x="712" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Not data</text>

  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Rows go across. Columns stand up. The header sits on top and is not one of the rows.</text>
</svg>
