  <text x="45" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">average dial f at step 1</text>
  <rect x="50" y="138" width="130" height="22" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
