<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A list of four dictionaries drawn as a table: four cards stacked, each with the same three keys, and the keys lined up so they form columns with a header row</title>
  <desc>On the left, four stacked cards numbered 0 to 3. Each card holds three key-and-value pairs: name, age and score, with the keys in pink boxes and the values in blue boxes. An arrow labelled same thing points right to a grid with a pink header row reading name, age, score and four data rows holding Asha 13 80, Ben 11 55, Cara 14 92 and Dev 12 67, numbered 0 to 3 down the left.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A list of dictionaries IS a table</text>
  <text x="400" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One dictionary is one row. The keys are the column names.</text>
