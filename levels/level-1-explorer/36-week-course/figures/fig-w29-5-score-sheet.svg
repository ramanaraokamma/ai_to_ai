<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Score every sentence twice</title>
  <desc>A scoring table with four generated sentences and two tick-or-cross columns: does it read well, and is it true to the corpus. The second sentence gets a tick for reading well and a cross for truth.</desc>
<text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Score every sentence twice</text>
<rect x="30" y="70" width="440" height="44" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
<text x="44" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" font-weight="600" dominant-baseline="central">SENTENCE</text>
<text x="330" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">READS</text>
<text x="330" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">WELL?</text>
<text x="420" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">TRUE TO</text>
<text x="420" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">CORPUS?</text>
<rect x="30" y="114" width="440" height="60" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="44" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">1 sampled</text>
<text x="44" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">the bus goes to town .</text>
<circle cx="330" cy="144.0" r="18" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="322,145.0 328,151.0 339,137.0" fill="none" stroke="#1B7A4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="420" cy="144.0" r="18" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="412,145.0 418,151.0 429,137.0" fill="none" stroke="#1B7A4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="174" width="440" height="60" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="44" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">2 sampled</text>
<text x="44" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">amma takes the bus to the market .</text>
<circle cx="330" cy="204.0" r="18" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="322,205.0 328,211.0 339,197.0" fill="none" stroke="#1B7A4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="420" cy="204.0" r="18" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"><line x1="413" y1="197.0" x2="427" y2="211.0"/><line x1="427" y1="197.0" x2="413" y2="211.0"/></g>
<rect x="30" y="234" width="440" height="60" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="44" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">3 sampled</text>
<text x="44" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">the bus to the bus .</text>
<circle cx="330" cy="264.0" r="18" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"><line x1="323" y1="257.0" x2="337" y2="271.0"/><line x1="337" y1="257.0" x2="323" y2="271.0"/></g>
<circle cx="420" cy="264.0" r="18" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"><line x1="413" y1="257.0" x2="427" y2="271.0"/><line x1="427" y1="257.0" x2="413" y2="271.0"/></g>
<rect x="30" y="294" width="440" height="60" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="44" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">G greedy</text>
<text x="44" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">the bus to the bus to the ...</text>
<circle cx="330" cy="324.0" r="18" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"><line x1="323" y1="317.0" x2="337" y2="331.0"/><line x1="337" y1="317.0" x2="323" y2="331.0"/></g>
<circle cx="420" cy="324.0" r="18" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"><line x1="413" y1="317.0" x2="427" y2="331.0"/><line x1="427" y1="317.0" x2="413" y2="331.0"/></g>
<rect x="30" y="70" width="440" height="284" rx="10" fill="none" stroke="#1F6FB2" stroke-width="3"/>
<line x1="286" y1="70" x2="286" y2="354" stroke="#C7CDD4" stroke-width="1.5"/>
<line x1="376" y1="70" x2="376" y2="354" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="30" y="380" width="440" height="58" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="250" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">Row 2 is the one that matters.</text>
<text x="250" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">Reads beautifully. Says something untrue.</text>
<text x="250" y="476" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">Two separate questions. Never let the first one answer the second.</text>
</svg>
