<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw one neuron</title>
  <desc>A large empty frame split by a dashed vertical line, with multiply and add on the left and squash on the right, for the learner to draw one neuron into. A panel underneath lists what a good answer looks like: three labelled inputs, one weight written on each wire, the bias arriving on its own wire with no input attached, the three products written out as 0.8, minus 0.7 and 0.6, the running total ending at z equals 0.20, a box for the squash with the rule written inside it, the activation 0.200 leaving on the right, and a note that the shapes are w is 3 comma and rows is 4 by 3.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw one neuron</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Three inputs in, one number out. Put real numbers on it.</text>
  <rect x="30" y="86" width="440" height="360" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="340" y1="86" x2="340" y2="446" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="46" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">multiply, then add</text>
  <text x="356" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">squash</text>
  <rect x="30" y="460" width="440" height="216" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; three inputs: singing 2.0, dancing 1.0, presence 0.5</text>
  <text x="48" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; one weight written on each wire: 0.4, &#8722;0.7, 1.2</text>
  <text x="48" y="554" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the bias &#8722;0.5 on its own wire, with no input attached</text>
  <text x="48" y="576" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the three products written out: 0.8, &#8722;0.7, 0.6</text>
  <text x="48" y="598" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the running total, ending at z = 0.20</text>
  <text x="48" y="620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; a box for the squash with its rule written inside it</text>
  <text x="48" y="642" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the activation a = 0.200 leaving on the right</text>
  <text x="48" y="664" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; and the two shapes in a corner: w (3,) and rows (4, 3)</text>
</svg>
