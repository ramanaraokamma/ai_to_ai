<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five new words for Week 29</title>
  <desc>Five small icons in a row. A dashed ring holding three dots around a triangle with a fourth dot outside it, labelled k-nearest neighbours, ask the k closest rows you know. A tally of three strokes reading two to one, labelled majority vote. A box with an arrow going in carrying a y badge, labelled fit, learn from X and y, it sees the answers. A box with an arrow in and an arrow out and a cross where the answers would be, labelled predict, no answers go in. And a wide pile and a narrow pile separated by a dashed cut, marked eighty percent and twenty percent, labelled train slash test split.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five new words for Week 29</text>
  <circle cx="110" cy="136" r="42" fill="none" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="88" cy="114" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="136" cy="122" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="102" cy="166" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="170" cy="102" r="7" fill="none" stroke="#C7CDD4" stroke-width="2"/>
  <polygon points="110,128 119,144 101,144" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="110" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">k-nearest</text>
  <text x="110" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">neighbours</text>
  <text x="110" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">ask the k closest</text>
  <text x="110" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">rows you know</text>
  <rect x="230" y="108" width="76" height="60" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="246" y1="120" x2="246" y2="156" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <line x1="258" y1="120" x2="258" y2="156" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="120" x2="290" y2="156" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="268" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2 - 1</text>
  <text x="268" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2" text-anchor="middle">majority vote</text>
  <text x="268" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">whichever label</text>
  <text x="268" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">turns up most</text>
  <text x="268" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">in those k wins</text>
  <rect x="384" y="114" width="64" height="54" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <line x1="354" y1="141" x2="380" y2="141" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/><polyline points="369.5,146.8 380,141 369.5,135.2" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="350" cy="116" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="350" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">y</text>
  <text x="416" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#6D28D9" text-anchor="middle">fit</text>
  <text x="416" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">learn from X and y.</text>
  <text x="416" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">It sees the answers.</text>
  <rect x="524" y="114" width="64" height="54" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <line x1="496" y1="141" x2="520" y2="141" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/><polyline points="509.5,146.8 520,141 509.5,135.2" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="592" y1="141" x2="618" y2="141" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/><polyline points="607.5,146.8 618,141 607.5,135.2" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="496" cy="108" r="11" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><line x1="489" y1="101" x2="503" y2="115" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/><line x1="503" y1="101" x2="489" y2="115" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="556" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#6D28D9" text-anchor="middle">predict</text>
  <text x="556" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">guess for a new X.</text>
  <text x="556" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">No answers go in.</text>
  <rect x="650" y="108" width="74" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="732" y="126" width="34" height="42" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <line x1="728" y1="100" x2="728" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="687" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">80%</text>
  <text x="749" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">20%</text>
  <text x="700" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2" text-anchor="middle">train/test split</text>
  <text x="700" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">one cut. Seal the</text>
  <text x="700" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">small pile away.</text>
  <text x="400" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Only fit and score ever see the answers. predict never does, or there would be nothing to predict.</text>
</svg>
