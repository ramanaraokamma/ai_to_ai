<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The computer is not being stupid. It is being exact.</title>
  <desc>Two panels. On the left, marked wrong, a count printout lists Blue three separate times with different counts, and the reader concludes that pandas is broken. On the right, marked correct, the same values are printed with their quote marks shown, revealing that one is Blue with a trailing space and one is a leading space followed by Blue, so they really are three different pieces of writing. A note says a space is a character and it prints as nothing.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The computer is not being stupid. It is being exact.</text>
  <line x1="400" y1="66" x2="400" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>

  <rect x="24" y="66" width="352" height="278" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="424" y="66" width="352" height="278" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>

  <circle cx="56" cy="98" r="15" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"><line x1="51" y1="93" x2="61" y2="103"/><line x1="61" y1="93" x2="51" y2="103"/></g>
  <text x="80" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">"pandas is broken"</text>

  <circle cx="456" cy="98" r="15" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="450,99 454,103 462,93" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Three different words</text>

  <!-- left: the confusing printout -->
  <text x="48" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">after .str.title() on its own</text>
  <rect x="48" y="140" width="304" height="112" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="64" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">value_counts()</text>
  <line x1="64" y1="170" x2="336" y2="170" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="64" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">Blue      12</text>
  <text x="64" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">Blue       1</text>
  <text x="64" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">Blue       1</text>
  <text x="64" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">nunique: 8</text>
  <rect x="58" y="176" width="132" height="56" rx="6" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="196" y1="204" x2="224" y2="204" stroke="#CC2B1D" stroke-width="1.5"/>
  <text x="228" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">the same word,</text>
  <text x="228" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">three times?</text>
  <text x="200" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A space prints as NOTHING, so the</text>
  <text x="200" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">printout looks impossible.</text>
  <text x="200" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">No error. Just an insane-looking table.</text>

  <!-- right: unique() with quotes -->
  <text x="448" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the same three values, with their quote marks</text>
  <rect x="448" y="140" width="304" height="112" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="464" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">unique()</text>
  <line x1="464" y1="170" x2="736" y2="170" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="464" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">'Blue'</text>
  <text x="464" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">'Blue '</text>
  <text x="464" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">' Blue'</text>
  <rect x="524" y="202" width="12" height="16" rx="3" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="470" y="224" width="12" height="16" rx="3" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="544" y1="210" x2="580" y2="210" stroke="#C42B8C" stroke-width="1.5"/>
  <text x="586" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">there it is &#8212;</text>
  <text x="586" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">a space, on the end</text>
  <text x="586" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">and on the front</text>

  <rect x="448" y="264" width="304" height="36" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="600" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">.str.strip().str.title()</text>
  <text x="600" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">strip first. Then 8 becomes 4.</text>

  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">To a computer, "Blue" and "Blue " are as different as "Blue" and "Banana".</text>
</svg>
