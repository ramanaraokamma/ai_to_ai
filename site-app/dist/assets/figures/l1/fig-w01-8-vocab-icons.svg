<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 1's four new words</title>
  <desc>Four labelled tiles. Artificial intelligence, drawn as a machine. Judgement, drawn as a balance scale. Rule-based system, drawn as a written note. If-then rule, drawn as a single instruction box.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="44" font-size="24" fill="#14202B" text-anchor="middle">Week 1's four new words</text>

    <rect x="30" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <rect x="220" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <rect x="410" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <rect x="600" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

    <g transform="translate(76,122) scale(0.55)">
      <line x1="2" y1="48" x2="14" y2="48" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <polyline points="10,42 18,48 10,54" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="122" y1="48" x2="132" y2="48" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="128,42 136,48 128,54" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="28" y="14" width="84" height="72" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
      <rect x="18" y="38" width="14" height="20" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <rect x="108" y="38" width="14" height="20" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="70" cy="50" r="14" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
      <circle cx="70" cy="50" r="5" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
    </g>
    <text x="115" y="200" font-size="18" fill="#14202B" text-anchor="middle">artificial</text>
    <text x="115" y="218" font-size="18" fill="#14202B" text-anchor="middle">intelligence</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="115" y="246">a machine doing a</text>
      <text x="115" y="264">job that used to need</text>
      <text x="115" y="282">a person's judgement</text>
    </g>

    <g transform="translate(275,120) scale(0.6)">
      <line x1="50" y1="26" x2="50" y2="80" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 88 L38 80 H62 L68 88 Z" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
      <line x1="16" y1="26" x2="84" y2="26" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="26" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <line x1="16" y1="26" x2="16" y2="44" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
      <line x1="84" y1="26" x2="84" y2="44" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
      <path d="M2 44 Q16 62 30 44 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <path d="M70 44 Q84 62 98 44 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="305" y="209" font-size="18" fill="#14202B" text-anchor="middle">judgement</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="305" y="246">a choice two people</text>
      <text x="305" y="264">could answer</text>
      <text x="305" y="282">differently</text>
    </g>

    <g transform="translate(465,120) scale(0.6)">
      <path d="M12 12 H88 V68 L68 88 H12 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <path d="M68 88 V68 H88 Z" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="#55636F" stroke-width="3" stroke-linecap="round">
        <line x1="24" y1="30" x2="76" y2="30"/>
        <line x1="24" y1="43" x2="76" y2="43"/>
        <line x1="24" y1="56" x2="60" y2="56"/>
      </g>
    </g>
    <text x="495" y="200" font-size="18" fill="#14202B" text-anchor="middle">rule-based</text>
    <text x="495" y="218" font-size="18" fill="#14202B" text-anchor="middle">system</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="495" y="246">a person wrote the</text>
      <text x="495" y="264">if-then steps by hand,</text>
      <text x="495" y="282">before it ever ran</text>
    </g>

    <rect x="620" y="132" width="130" height="46" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="685" y="155" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">IF ... THEN ...</text>
    <text x="685" y="209" font-size="18" fill="#14202B" text-anchor="middle">if-then rule</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="685" y="246">one instruction:</text>
      <text x="685" y="264">if this is true,</text>
      <text x="685" y="282">do that</text>
    </g>
    <text x="400" y="340" font-size="14" fill="#55636F" text-anchor="middle">Say each word out loud, then say its meaning without looking.</text>
  </g>
</svg>
