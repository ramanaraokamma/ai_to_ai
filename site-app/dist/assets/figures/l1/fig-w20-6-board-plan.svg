<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 20 finished board</title>
  <desc>A whiteboard showing what the teacher should have written by the end of the concept segment: the accuracy formula, eleven over fifteen converted to zero point seven three three three and seventy-three point three percent, the baseline, the forty percentage point improvement, the gap, and a boxed per-class table where comb reads forty percent.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">What the board should look like at minute 26</text>

    <rect x="30" y="54" width="740" height="300" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>

    <g font-size="18" fill="#14202B">
      <text x="56" y="96">accuracy&#160;&#160;=&#160;&#160;correct&#160;/&#160;total</text>
      <text x="56" y="132">11 / 15&#160;&#160;-&gt;&#160;&#160;0.7333&#160;&#160;-&gt;&#160;&#160;73.3%</text>
      <text x="56" y="168">baseline (3 classes) = 33.3%</text>
      <text x="56" y="204">73.3 - 33.3 = 40 percentage POINTS</text>
      <text x="56" y="240">the gap: 100 - 73.3 = 26.7 points</text>
    </g>

    <rect x="440" y="76" width="304" height="196" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="592" y="106" font-size="18" fill="#14202B" text-anchor="middle">PER-CLASS ACCURACY</text>
    <line x1="460" y1="118" x2="724" y2="118" stroke="#1F6FB2" stroke-width="1.5"/>
    <g font-size="18" fill="#14202B">
      <text x="460" y="146">spoon</text>
      <text x="460" y="176">toothbrush</text>
    </g>
    <text x="460" y="206" font-size="18" fill="#CC2B1D">comb</text>
    <g font-size="18" fill="#14202B" text-anchor="end">
      <text x="724" y="146">5/5 = 100%</text>
      <text x="724" y="176">4/5 = 80%</text>
    </g>
    <text x="724" y="206" font-size="18" fill="#CC2B1D" text-anchor="end">2/5 = 40%</text>
    <text x="592" y="248" font-size="14" fill="#55636F" text-anchor="middle">check: 5 + 4 + 2 = 11 correct</text>

    <rect x="56" y="280" width="688" height="52" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="313" font-size="20" fill="#14202B" text-anchor="middle">RULE: never report one accuracy number on its own.</text>

    <text x="400" y="380" font-size="14" fill="#55636F" text-anchor="middle">Leave the per-class box up. The 40% in it is the whole point of the week.</text>
  </g>
</svg>
