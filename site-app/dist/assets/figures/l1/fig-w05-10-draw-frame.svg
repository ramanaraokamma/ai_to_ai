<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 5</title>
  <desc>An empty framed drawing area titled draw the four kinds of mess, divided into four numbered blank panels with a caption line under each, plus a fifth narrow strip at the bottom for the one thing that is not a fault.</desc>
  <rect x="24" y="24" width="752" height="286" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: one cartoon for each kind of mess</text>

  <g fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8" stroke-linejoin="round">
    <rect x="48" y="88" width="164" height="160" rx="10"/>
    <rect x="230" y="88" width="164" height="160" rx="10"/>
    <rect x="412" y="88" width="164" height="160" rx="10"/>
    <rect x="594" y="88" width="164" height="160" rx="10"/>
  </g>
  <g>
    <circle cx="66" cy="106" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="66" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1</text>
    <circle cx="248" cy="106" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="248" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2</text>
    <circle cx="430" cy="106" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="430" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">3</text>
    <circle cx="612" cy="106" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="612" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="130" y="272">missing</text>
    <text x="312" y="272">duplicate</text>
    <text x="494" y="272">impossible</text>
    <text x="676" y="272">inconsistent</text>
  </g>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="60" y1="292" x2="200" y2="292"/>
    <line x1="242" y1="292" x2="382" y2="292"/>
    <line x1="424" y1="292" x2="564" y2="292"/>
    <line x1="606" y1="292" x2="746" y2="292"/>
  </g>
  <text x="400" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">write the FIX for each one on the dotted line under its panel</text>

  <rect x="24" y="326" width="752" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="44" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">5. Now draw the one that is NOT a fault, and label it:</text>
  <line x1="380" y1="352" x2="756" y2="352" stroke="#1B7A4B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="44" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Show clearly that it sits INSIDE the legal range and still far from the crowd.</text>
</svg>
