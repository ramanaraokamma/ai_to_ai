<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The ten-minute demo, from a cold terminal</title>
  <desc>A timeline of seven stops across ten minutes. At 0:00, one minute on the contract: one prediction is about one review, a nasty one slipping through costs ten times a nice one read anyway, so the threshold is 0.55 and not 0.5. At 1:00, one minute on the cold start in a brand-new terminal, showing 751.9 milliseconds total and the Rule 1 grep returning 0 lines. At 2:00, two minutes on the service: start it, GET health, one good prediction, and say 772.2 milliseconds to load once against 0.23 milliseconds per request as two separate numbers. At 4:00, two minutes breaking it live with four malformed requests, then health again to prove it is alive. At 6:00, ninety seconds on the log: 111 lines, p50 0.23, p95 0.27, max 3.27, and the max was the first request. At 7:30, ninety seconds on where it breaks: 0.867 on 15 rows without a negation, 0.385 on 13 with one, recall 0 of 6, then one failure live. At 9:00, one minute on the monitoring number: the uncertainty-band rate, currently 27.0 percent, alarm at 40, computable with no labels at all.</desc>

  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The ten-minute demo, from a cold terminal</text>

  <line x1="60" y1="118" x2="740" y2="118" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="744,118 732,112 732,124" fill="#14202B"/>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="60" y1="112" x2="60" y2="124"/>
    <line x1="128" y1="112" x2="128" y2="124"/>
    <line x1="196" y1="112" x2="196" y2="124"/>
    <line x1="332" y1="112" x2="332" y2="124"/>
    <line x1="468" y1="112" x2="468" y2="124"/>
    <line x1="570" y1="112" x2="570" y2="124"/>
    <line x1="672" y1="112" x2="672" y2="124"/>
  </g>

  <text x="60" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">0:00</text>
  <text x="128" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">1:00</text>
  <text x="196" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2:00</text>
  <text x="332" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">4:00</text>
  <text x="468" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">6:00</text>
  <text x="570" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">7:30</text>
  <text x="672" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">9:00</text>

  <!-- stop 1 -->
  <rect x="40" y="136" width="230" height="86" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="56" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1 &#183; THE CONTRACT</text>
  <text x="56" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">one review, 10 against 1,</text>
  <text x="56" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">so threshold 0.55, not 0.5</text>
  <text x="56" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">say it before you type anything</text>

  <!-- stop 2 -->
  <rect x="285" y="136" width="230" height="86" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="301" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">2 &#183; COLD START, LIVE</text>
  <text x="301" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">751.9 ms, whole command</text>
  <text x="301" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">grep serve/ &#8594; 0 lines</text>
  <text x="301" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a brand-new terminal, opened here</text>

  <!-- stop 3 -->
  <rect x="530" y="136" width="230" height="86" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="546" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">3 &#183; THE SERVICE</text>
  <text x="546" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">772.2 ms to load, once</text>
  <text x="546" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.23 ms per request</text>
  <text x="546" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">two numbers, never one</text>

  <!-- stop 4 -->
  <rect x="40" y="236" width="230" height="86" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="56" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">4 &#183; BREAK IT ON PURPOSE</text>
  <text x="56" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">4 malformed requests, then</text>
  <text x="56" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">/health &#8594; 200</text>
  <text x="56" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">this is the part that wins the room</text>

  <!-- stop 5 -->
  <rect x="285" y="236" width="230" height="86" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="301" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">5 &#183; THE LOG</text>
  <text x="301" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">111 lines &#183; p50 0.23</text>
  <text x="301" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">p95 0.27 &#183; max 3.27</text>
  <text x="301" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">and the max was request number 1</text>

  <!-- stop 6 -->
  <rect x="530" y="236" width="230" height="86" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="546" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">6 &#183; WHERE IT BREAKS</text>
  <text x="546" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.867 on 15 &#183; 0.385 on 13</text>
  <text x="546" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">recall 0 &#247; 6 = 0.000</text>
  <text x="546" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">then run one failure, live</text>

  <!-- stop 7 -->
  <rect x="180" y="336" width="440" height="42" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="196" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">7 &#183; THE NUMBER: band rate 27.0%, alarm at 40%, no labels needed</text>
</svg>
