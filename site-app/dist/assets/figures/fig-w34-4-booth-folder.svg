<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Inside the booth folder: six documents</title>
  <desc>An open cardboard folder with six labelled sheets tucked inside: the brief, the photo counts, the test sheet, the confusion matrix, the data card and the saved model file. Each sheet carries a number.</desc>

  <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Inside the booth folder: six documents</text>

  <rect x="30" y="66" width="740" height="270" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <line x1="400" y1="66" x2="400" y2="336" stroke="#845F00" stroke-width="3"/>

  <g fill="#FFFFFF" stroke="#55636F" stroke-width="2">
    <rect x="56" y="110" width="100" height="140" rx="8"/>
    <rect x="176" y="110" width="100" height="140" rx="8"/>
    <rect x="296" y="110" width="100" height="140" rx="8" stroke="#55636F"/>
    <rect x="424" y="110" width="100" height="140" rx="8"/>
    <rect x="544" y="110" width="100" height="140" rx="8"/>
  </g>
  <rect x="664" y="110" width="100" height="140" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>

  <!-- sketch content -->
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="70" y1="140" x2="142" y2="140"/><line x1="70" y1="162" x2="142" y2="162"/><line x1="70" y1="184" x2="142" y2="184"/><line x1="70" y1="206" x2="118" y2="206"/>
    <line x1="190" y1="140" x2="262" y2="140"/><line x1="190" y1="168" x2="262" y2="168"/><line x1="190" y1="196" x2="262" y2="196"/>
    <line x1="226" y1="128" x2="226" y2="230"/>
    <line x1="310" y1="140" x2="382" y2="140"/><line x1="310" y1="162" x2="382" y2="162"/><line x1="310" y1="184" x2="382" y2="184"/><line x1="310" y1="206" x2="382" y2="206"/>
    <line x1="438" y1="150" x2="510" y2="150"/><line x1="438" y1="180" x2="510" y2="180"/><line x1="438" y1="210" x2="510" y2="210"/>
    <line x1="462" y1="128" x2="462" y2="232"/><line x1="486" y1="128" x2="486" y2="232"/>
    <line x1="558" y1="140" x2="630" y2="140"/><line x1="558" y1="162" x2="630" y2="162"/><line x1="558" y1="184" x2="630" y2="184"/><line x1="558" y1="206" x2="606" y2="206"/>
  </g>
  <rect x="438" y="128" width="72" height="104" fill="none" stroke="#1F6FB2" stroke-width="2"/>
  <g transform="translate(684,140) scale(0.62)">
    <line x1="2" y1="48" x2="14" y2="48" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <polyline points="10,42 18,48 10,54" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="14" width="84" height="72" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="70" cy="50" r="14" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="70" cy="50" r="5" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
  </g>

  <!-- numbers -->
  <g stroke="#C42B8C" stroke-width="2.5" fill="#F4D5E9">
    <circle cx="58" cy="112" r="13"/><circle cx="178" cy="112" r="13"/><circle cx="298" cy="112" r="13"/>
    <circle cx="426" cy="112" r="13"/><circle cx="546" cy="112" r="13"/><circle cx="666" cy="112" r="13"/>
  </g>
  <g font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">
    <text x="58" y="113">1</text><text x="178" y="113">2</text><text x="298" y="113">3</text>
    <text x="426" y="113">4</text><text x="546" y="113">5</text><text x="666" y="113">6</text>
  </g>

  <g font-size="14" fill="#14202B" text-anchor="middle">
    <text x="106" y="274">00-brief</text>
    <text x="226" y="274">01-counts</text>
    <text x="346" y="274">02-testsheet</text>
    <text x="474" y="274">03-matrix</text>
    <text x="594" y="274">05-data-card</text>
    <text x="714" y="274">booth-v1.tm</text>
  </g>
  <g font-size="12" fill="#55636F" text-anchor="middle">
    <text x="106" y="296">the bet</text>
    <text x="226" y="296">the tally</text>
    <text x="346" y="296">40 scored rows</text>
    <text x="474" y="296">4 x 4 by hand</text>
    <text x="594" y="296">8 boxes</text>
    <text x="714" y="296">the model</text>
  </g>

  <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">If a stranger opened this folder, could they rebuild your project? That is the test.</text>
</svg>
