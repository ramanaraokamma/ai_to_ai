<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A 138 cm child at a 140 cm ride</title>
  <desc>A height post marked 130 to 145 centimetres. A red line at 140 centimetres is the rule. A child's head reaches 138 centimetres, two centimetres short. Two speech boxes give the ride operator's argument and the child's argument.</desc>
  <text x="400" y="38" font-size="24" fill="#14202B" text-anchor="middle">One rule, two fair arguments</text>

  <rect x="240" y="106" width="30" height="244" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#14202B" stroke-width="2" stroke-linecap="round">
    <line x1="270" y1="340" x2="292" y2="340"/>
    <line x1="270" y1="266.7" x2="292" y2="266.7"/>
    <line x1="270" y1="193.3" x2="292" y2="193.3"/>
    <line x1="270" y1="120" x2="292" y2="120"/>
  </g>
  <g font-size="12" fill="#55636F">
    <text x="200" y="344">130 cm</text>
    <text x="200" y="271">135 cm</text>
    <text x="200" y="198">140 cm</text>
    <text x="200" y="124">145 cm</text>
  </g>
  <line x1="150" y1="350" x2="470" y2="350" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>

  <line x1="230" y1="193.3" x2="470" y2="193.3" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="300" y="150" width="164" height="36" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="382" y="174" font-size="16" fill="#14202B" text-anchor="middle">THE RULE: 140 cm</text>

  <line x1="300" y1="222.7" x2="470" y2="222.7" stroke="#845F00" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="466" y="240" font-size="14" fill="#845F00" text-anchor="end">this child: 138 cm</text>

  <g transform="translate(320,210) scale(0.92)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="490" y="86" width="280" height="112" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M490 140 L470 152 L490 160 Z" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="506" y="110" font-size="12" fill="#55636F">THE RIDE OPERATOR</text>
  <text x="506" y="134" font-size="14" fill="#14202B">"The harness was tested at 140 cm.</text>
  <text x="506" y="154" font-size="14" fill="#14202B">If I bend it for you I bend it for</text>
  <text x="506" y="174" font-size="14" fill="#14202B">everyone. Two centimetres is</text>
  <text x="506" y="190" font-size="14" fill="#14202B">exactly where I have to stop."</text>

  <rect x="490" y="228" width="280" height="112" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M490 262 L470 250 L490 244 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="506" y="252" font-size="12" fill="#55636F">THE 14-YEAR-OLD</text>
  <text x="506" y="276" font-size="14" fill="#14202B">"I am fourteen. I am taller than</text>
  <text x="506" y="296" font-size="14" fill="#14202B">nobody and stronger than most.</text>
  <text x="506" y="316" font-size="14" fill="#14202B">Height is standing in for strength</text>
  <text x="506" y="332" font-size="14" fill="#14202B">and it is measuring me wrong."</text>

  <text x="400" y="380" font-size="14" fill="#55636F" text-anchor="middle">Both are right. That is what an edge case feels like from the inside.</text>
</svg>
