<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A cosine compares direction and ignores length: B is twice A, so cos(A, B) is 1.000</title>
  <desc>Three three-number vectors: A is 1, 0, 3; B is 2, 0, 6, which is 2 times A; C is 4, 2, 0, each with shape (3,). Worked sum: A dot C is 1 times 4 plus 0 times 2 plus 3 times 0, which is 4; the lengths are 3.162 and 4.472, so cos(A, C) is 0.283. A bar chart gives cos(A, B) 1.000, cos(A, C) 0.283 and cos(B, C) 0.283.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A cosine ignores length</text>
  <text x="52" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">A</text>
  <rect x="74" y="96" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="97" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="120" y="96" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="143" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="166" y="96" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="189" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="222" y="102" width="42" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="243" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(3,)</text>
  <text x="52" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">B</text>
  <rect x="74" y="148" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="97" y="167" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="120" y="148" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="143" y="167" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="166" y="148" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="189" y="167" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="222" y="154" width="42" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="243" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(3,)</text>
  <text x="52" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">C</text>
  <rect x="74" y="200" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="97" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="120" y="200" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="143" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="166" y="200" width="46" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="189" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="222" y="206" width="42" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="243" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(3,)</text>
  <text x="284" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="start">B = 2 &#215; A</text>
  <rect x="30" y="252" width="380" height="92" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="46" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">A &#183; C = 1&#215;4 + 0&#215;2 + 3&#215;0 = 4</text>
  <text x="46" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">|A| = 3.162    |C| = 4.472</text>
  <text x="46" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">cos(A, C) = 4 &#247; (3.162 &#215; 4.472) = 0.283</text>
  <text x="600" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">cosine of each pair</text>
  <line x1="480" y1="112" x2="480" y2="252" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="480" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="720" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="470" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">A, B</text>
  <rect x="480" y="124" width="240" height="30" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="712" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">1.000</text>
  <text x="470" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">A, C</text>
  <rect x="480" y="172" width="67.9" height="30" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="555.9" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">0.283</text>
  <text x="470" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">B, C</text>
  <rect x="480" y="220" width="67.9" height="30" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="555.9" y="241" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">0.283</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same direction, twice the length: the cosine is 1.000. Length is divided out.</text>
</svg>
