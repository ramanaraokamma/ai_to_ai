  <polyline points="635.4,318 639.4,322.4 647.4,313.2" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="338" x2="780" y2="338" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">5 words, width 4, output (5, 4), seed 0. Random tables: 0.1529 only means &#8220;not zero&#8221;.</text>
</svg>
