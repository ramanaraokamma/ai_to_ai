<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Both losses start at ln 28, then training loss keeps falling while validation flattens, so the gap grows to 0.543</title>
  <desc>Seven pairs of bars for steps 0, 300, 500, 750, 1000, 1250 and 1499. Solid blue bars are the training loss: 3.349, 1.873, 1.558, 1.181, 0.999, 0.905, 0.894. Dashed outline bars are the validation loss: 3.351, 1.892, 1.647, 1.470, 1.417, 1.427, 1.437. A dashed pink line marks ln 28 = 3.332. Under each pair is the gap, validation minus train: 0.002, 0.019, 0.089, 0.289, 0.418, 0.522, 0.543. The bars start level and the validation bars stay tall while the train bars fall.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Train and validation loss, and the gap</text>
