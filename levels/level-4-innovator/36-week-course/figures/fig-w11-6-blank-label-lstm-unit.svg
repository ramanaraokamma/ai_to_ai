<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank diagram for Week 11 page 11.2: write the name of each numbered part</title>
  <desc>A blank diagram of one LSTM unit with six numbered rings and no names. A thick horizontal line with an arrowhead is ring 1. On it a times node, fed from below by an empty dashed box ringed 2, then a plus node with ring 5 above it. A second times node below the plus node feeds up into it; it is fed by two empty dashed boxes ringed 3 and 4. Further right a branch leaves the line, passes a times node fed by an empty dashed box ringed 6, and ends in a box labelled note h. On the right are six dashed answer lines numbered 1 to 6, and a word bank of six terms under the diagram.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Name the six parts of one LSTM unit</text>
