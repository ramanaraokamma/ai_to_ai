<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 3's four new words</title>
  <desc>Four labelled tiles. Generative AI, drawn as a blank page being written on. Narrow AI, drawn as a knife with a single blade. General AI, drawn as an empty dashed box with a question mark. Confidence score, drawn as three bars where the first is ninety-four percent.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="44" font-size="24" fill="#14202B" text-anchor="middle">Week 3's four new words</text>

    <rect x="30" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <rect x="220" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <rect x="410" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <rect x="600" y="80" width="170" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

    <rect x="85" y="112" width="60" height="72" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
    <g stroke="#C42B8C" stroke-width="3" stroke-linecap="round">
      <line x1="95" y1="130" x2="135" y2="130"/>
      <line x1="95" y1="146" x2="128" y2="146"/>
      <line x1="95" y1="162" x2="138" y2="162"/>
    </g>
    <text x="115" y="209" font-size="18" fill="#14202B" text-anchor="middle">generative AI</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="115" y="246">makes new content</text>
      <text x="115" y="264">instead of picking</text>
      <text x="115" y="282">off a fixed list</text>
    </g>

    <path d="M275 146 L332 118 L344 146 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="265" y="148" width="82" height="24" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <text x="305" y="200" font-size="18" fill="#14202B" text-anchor="middle">narrow AI</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="305" y="228">does exactly one job</text>
      <text x="305" y="246">and is blank outside</text>
      <text x="305" y="264">it. Every real system</text>
      <text x="305" y="282">is like this.</text>
    </g>

    <rect x="455" y="115" width="80" height="66" rx="8" fill="none" stroke="#C7CDD4" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="495" y="150" font-size="30" fill="#55636F" text-anchor="middle" dominant-baseline="central">?</text>
    <text x="495" y="200" font-size="18" fill="#14202B" text-anchor="middle">general AI</text>
    <text x="495" y="218" font-size="18" fill="#14202B" text-anchor="middle">(AGI)</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="495" y="246">could do any job a</text>
      <text x="495" y="264">person can. It does</text>
      <text x="495" y="282">not exist.</text>
    </g>

    <line x1="628" y1="184" x2="742" y2="184" stroke="#14202B" stroke-width="2"/>
    <rect x="635" y="120" width="24" height="64" fill="#6D28D9"/>
    <rect x="670" y="176" width="24" height="8" fill="#C7CDD4"/>
    <rect x="705" y="179" width="24" height="5" fill="#C7CDD4"/>
    <text x="647" y="112" font-size="12" fill="#14202B" text-anchor="middle">94%</text>
    <text x="682" y="168" font-size="12" fill="#55636F" text-anchor="middle">4</text>
    <text x="717" y="171" font-size="12" fill="#55636F" text-anchor="middle">2</text>
    <text x="685" y="200" font-size="18" fill="#14202B" text-anchor="middle">confidence</text>
    <text x="685" y="218" font-size="18" fill="#14202B" text-anchor="middle">score</text>
    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="685" y="246">how strongly it</text>
      <text x="685" y="264">prefers its answer.</text>
      <text x="685" y="282">Not a promise.</text>
    </g>
    <text x="400" y="340" font-size="14" fill="#55636F" text-anchor="middle">Three of these describe real machines. One of them describes nothing that exists.</text>
  </g>
</svg>
