<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the loop and the accumulator</title>
  <desc>An unlabelled diagram to fill in. On the left a ring with a blank hub circle, a blank pass counter underneath, and five blank value slots along the top. On the right three stacked blank boxes for the running total on passes one, two and three, an arrow leaving the last one into a blank answer box, and three empty pink caption boxes along the bottom for the three accumulator rules.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the loop and the accumulator</text>

  <rect x="20" y="60" width="372" height="240" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="206" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1. the counter</text>

  <g stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round">
    <rect x="40" y="102" width="60" height="34" rx="6" fill="#FFFFFF"/>
    <rect x="106" y="102" width="60" height="34" rx="6" fill="#FFFFFF"/>
    <rect x="172" y="102" width="60" height="34" rx="6" fill="#FFFFFF"/>
    <rect x="238" y="102" width="60" height="34" rx="6" fill="#FFFFFF"/>
    <rect x="304" y="102" width="60" height="34" rx="6" fill="#FFFFFF"/>
  </g>
  <text x="202" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">write the five values range(1, 6) hands out</text>

  <path d="M232 190 A38 38 0 1 1 194 190" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(194 190) rotate(-30)"/>
  <circle cx="213" cy="222" r="30" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="213" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what is in the hub?</text>
  <rect x="52" y="204" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="112" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">which pass is this?</text>

  <rect x="408" y="60" width="372" height="240" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="594" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2. the running total</text>

  <g stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round">
    <rect x="428" y="102" width="150" height="34" rx="8" fill="#FFFFFF"/>
    <rect x="428" y="144" width="150" height="34" rx="8" fill="#FFFFFF"/>
    <rect x="428" y="186" width="150" height="34" rx="8" fill="#FFFFFF"/>
  </g>
  <text x="600" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">after pass 1</text>
  <text x="600" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">after pass 2</text>
  <text x="600" y="203" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">after pass 3</text>
  <line x1="503" y1="222" x2="503" y2="244" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-8,-11 0,0 8,-11" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(503 246)"/>
  <rect x="428" y="248" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="600" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">the average</text>

  <rect x="40" y="322" width="229" height="46" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="154" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rule 1: where does total = 0 go?</text>
  <rect x="285" y="322" width="229" height="46" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rule 2: where does the adding go?</text>
  <rect x="531" y="322" width="229" height="46" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="645" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rule 3: where does the dividing go?</text>
</svg>
