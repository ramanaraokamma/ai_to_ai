<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Sixteen slices, five friends, one left over</title>
  <desc>Five plates each hold three slices, and a sixth plate beyond a dashed divider holds the single leftover slice. Three chips underneath give the three answers: sixteen divided by five is 3.2, sixteen floor-divided by five is 3 whole slices each, and sixteen modulo five is 1 left over.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Sixteen slices, five friends, one left over</text>
  <text x="320" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">16 slices dealt out one at a time, to 5 friends</text>
  <circle cx="75" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="105" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="90" cy="164" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <ellipse cx="90" cy="200" rx="44" ry="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="90" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <circle cx="190" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="220" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="205" cy="164" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <ellipse cx="205" cy="200" rx="44" ry="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="205" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <circle cx="305" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="335" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="320" cy="164" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <ellipse cx="320" cy="200" rx="44" ry="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="320" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <circle cx="420" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="450" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="435" cy="164" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <ellipse cx="435" cy="200" rx="44" ry="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="435" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <circle cx="535" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="565" cy="186" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="550" cy="164" r="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <ellipse cx="550" cy="200" rx="44" ry="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="550" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <line x1="620" y1="140" x2="620" y2="240" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <circle cx="690" cy="186" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <ellipse cx="690" cy="200" rx="44" ry="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="690" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">left over</text>
  <rect x="40" y="268" width="230" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="155" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">16 / 5   =   3.2</text>
  <text x="155" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3.2 slices each - not a real slice</text>
  <rect x="285" y="268" width="230" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">16 // 5   =   3</text>
  <text x="400" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 whole slices each</text>
  <rect x="530" y="268" width="230" height="52" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="645" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">16 % 5   =   1</text>
  <text x="645" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1 slice left on the plate</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Slash gives a decimal. Double slash gives whole ones. Percent gives the leftovers.</text>
</svg>
