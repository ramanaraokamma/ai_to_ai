<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A new column, worked out once per row</title>
  <desc>A five-row table of names with a score column and an hours column feeds into a purple machine labelled score divided by hours, and out of it comes a single new column called points_per_hour holding 15.83, 16.91, 96.00, 90.00 and 84.00. Sami Aden's row is highlighted in both tables. Leader lines point out that the row with the top score has the worst rate and the row with a low score (48) has the best rate, so the new column reverses the ranking.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A new column, worked out once per row</text>
