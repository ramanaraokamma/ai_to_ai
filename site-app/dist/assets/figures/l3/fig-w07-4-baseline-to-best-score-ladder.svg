<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Baseline, best, and the lie</title>
  <desc>A vertical validation-AUC axis from 0.76 to 0.92 with four rungs. Near the bottom, three close together: baseline 0.7541, plus is_rush 0.7586, and minus order_hour 0.7599. Far above them, struck through and crossed out, the leak at 0.9240, labelled not a result. Underneath, the honest gain 0.7599 minus 0.7541 equals plus 0.0058, and the lie 0.9240 minus 0.7599 equals plus 0.1641.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Baseline, best, and the lie</text>
  <line x1="120" y1="100" x2="120" y2="410" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="114" y1="371.0" x2="120" y2="371.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="371.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.76</text>
  <line x1="114" y1="312.99999999999994" x2="120" y2="312.99999999999994" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="312.99999999999994" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.80</text>
  <line x1="114" y1="255.00000000000003" x2="120" y2="255.00000000000003" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="255.00000000000003" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.84</text>
  <line x1="114" y1="196.99999999999997" x2="120" y2="196.99999999999997" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="196.99999999999997" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.88</text>
  <line x1="114" y1="138.99999999999994" x2="120" y2="138.99999999999994" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="138.99999999999994" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.92</text>
  <text x="64" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">validation</text>
  <text x="64" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">AUC</text>
  <rect x="140" y="368.555" width="150" height="22" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="215" y="379.555" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.7541</text>
  <text x="300" y="379.555" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">baseline</text>
  <rect x="140" y="362.0299999999999" width="150" height="22" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="215" y="373.0299999999999" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.7586</text>
  <text x="300" y="373.0299999999999" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">+ is_rush</text>
  <rect x="140" y="360.145" width="150" height="22" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="215" y="371.145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.7599</text>
  <text x="300" y="371.145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">&#8722; order_hour</text>
  <rect x="140" y="122.19999999999993" width="150" height="22" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="215" y="133.19999999999993" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.9240</text>
  <line x1="146" y1="133.19999999999993" x2="284" y2="133.19999999999993" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="133.19999999999993" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" dominant-baseline="central">the leak</text>
  <line x1="300" y1="145.19999999999993" x2="314" y2="157.19999999999993" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <line x1="314" y1="145.19999999999993" x2="300" y2="157.19999999999993" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="179.19999999999993" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">not a result</text>
  <text x="140" y="434" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">honest gain:  0.7599 &#8722; 0.7541 = +0.0058</text>
  <text x="140" y="456" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">the lie:      0.9240 &#8722; 0.7599 = +0.1641</text>
  <text x="250" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A jump that big is never a better model. It is a leak.</text>
</svg>
