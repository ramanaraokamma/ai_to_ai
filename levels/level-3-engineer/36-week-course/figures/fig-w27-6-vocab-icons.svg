<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week&#8217;s six words, drawn</title>
  <desc>Six small pictures. Data augmentation is one picture becoming five, labelled 1,257 times 5 equals 6,285 rows, and the label must stay true. Transfer learning is a box for digits 0 to 4 lending to a box for digits 5 to 9, 630 rows lending to 627, with 0.9257 frozen against 0.9814 from nothing. Freezing is a grey dashed box holding 1,248 weights that cannot move beside a purple box holding 650 that can, set with requires_grad equals False. Backbone and head is two conv blocks holding 1,248 weights feeding a small head holding 650. Fine-tuning is one wide box saying all 1,898 may move, with frozen 0.9257, 249 of 269, against unfrozen 0.9665, 260 of 269, a gain of four points and eleven digits. Confusion pair is a two by two corner of the matrix for digits 1 and 8, with 53 and 48 on the green diagonal and 1 and 3 in the red off-diagonal cells, 3 plus 1 equals 4 of the 11 mistakes.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week&#8217;s six words, drawn</text>
  <rect x="26" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="282" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="538" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="26" y="220" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="282" y="220" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="538" y="220" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="46" y="76" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="86" y1="93" x2="100" y2="93" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polygon points="108,93 97,87 97,99" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="112" y="76" width="26" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <rect x="142" y="76" width="26" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <rect x="172" y="76" width="26" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <rect x="202" y="76" width="26" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="144" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1,257 &#215; 5 = 6,285 rows</text>
  <text x="144" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">data augmentation</text>
  <text x="144" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the label must stay true</text>
  <rect x="300" y="74" width="90" height="38" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="345" y="93" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">digits 0&#8211;4</text>
  <line x1="394" y1="93" x2="412" y2="93" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polygon points="420,93 409,87 409,99" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="422" y="74" width="90" height="38" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="467" y="93" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">digits 5&#8211;9</text>
  <text x="400" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">630 rows lend to 627 rows</text>
  <text x="400" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">transfer learning</text>
  <text x="400" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">keep what already learned to see</text>
  <text x="400" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.9257 frozen &#183; 0.9814 from nothing</text>
  <rect x="556" y="74" width="88" height="40" rx="8" fill="#C7CDD4" stroke="#55636F" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="600" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">frozen</text>
  <rect x="654" y="74" width="96" height="40" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="702" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">trainable</text>
  <text x="656" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">requires_grad</text>
  <text x="656" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">  = False</text>
  <text x="600" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">1,248</text>
  <text x="600" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">cannot</text>
  <text x="600" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">move</text>
  <text x="656" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">650 can</text>
  <text x="656" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">freezing</text>
  <rect x="50" y="250" width="118" height="44" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="109" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">conv, conv</text>
  <line x1="172" y1="272" x2="188" y2="272" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polygon points="196,272 185,266 185,278" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="198" y="250" width="62" height="44" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="229" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">head</text>
  <text x="109" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">backbone: 1,248</text>
  <text x="229" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">650</text>
  <text x="144" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">backbone / head</text>
  <text x="144" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">eyes, then answer sheet</text>
  <rect x="300" y="248" width="200" height="32" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">all 1,898 may move</text>
  <text x="300" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">frozen   0.9257  (249 of 269)</text>
  <text x="300" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B">unfrozen 0.9665  (260 of 269)</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">fine-tuning</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">+4 points, 11 more digits</text>
  <rect x="596" y="250" width="44" height="44" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="618" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">53</text>
  <rect x="640" y="250" width="44" height="44" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="662" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="596" y="294" width="44" height="44" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="618" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="640" y="294" width="44" height="44" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="662" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">48</text>
  <text x="588" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <text x="588" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">8</text>
  <text x="618" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="662" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <text x="700" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">3 + 1 = 4</text>
  <text x="700" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">of 11</text>
  <text x="656" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">confusion pair</text>
  <text x="656" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">add the two facing cells</text>
</svg>
