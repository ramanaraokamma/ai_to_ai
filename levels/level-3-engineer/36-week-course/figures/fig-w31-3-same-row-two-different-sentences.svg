<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two different sentences, one identical row</title>
  <desc>Two sentences, the dog bit the man and the man bit the dog, each counted into a row over the four-word vocabulary bit, dog, man, the. Both rows read 1, 1, 1, 2. A green tick marks that the two rows are equal cell for cell: subtracting them gives 0 in every column, so no number anywhere in the row records which animal did the biting. A red panel says the bag of words cannot tell you who bit whom, and that this is the price of the method rather than a bug.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two different sentences, one identical row</text>
  <rect x="28" y="82" width="268" height="38" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="162" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">the dog bit the man</text>
  <line x1="306" y1="101" x2="344" y2="101" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(344 101) rotate(0)"/>
  <text x="325" y="87" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">count</text>
  <text x="412" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">bit</text>
  <rect x="380" y="82" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="412" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="476" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">dog</text>
  <rect x="444" y="82" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="476" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="540" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">man</text>
  <rect x="508" y="82" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="540" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="604" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the</text>
  <rect x="572" y="82" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="604" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="656" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" dominant-baseline="central">( 1 1 1 2 )</text>
  <rect x="28" y="216" width="268" height="38" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="162" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">the man bit the dog</text>
  <line x1="306" y1="235" x2="344" y2="235" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(344 235) rotate(0)"/>
  <text x="325" y="221" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">count</text>
  <text x="412" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">bit</text>
  <rect x="380" y="216" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="412" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="476" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">dog</text>
  <rect x="444" y="216" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="476" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="540" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">man</text>
  <rect x="508" y="216" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="540" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="604" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the</text>
  <rect x="572" y="216" width="64" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="604" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="656" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" dominant-baseline="central">( 1 1 1 2 )</text>
  <rect x="372" y="74" width="268" height="180" rx="10" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" fill="none"><polyline points="688.8,150 697.2,159.8 712.6,137.4"/></g>
  <text x="700" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">the rows are</text>
  <text x="700" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">equal, cell</text>
  <text x="700" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">for cell</text>
  <rect x="28" y="282" width="744" height="54" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">So the bag of words cannot tell you who bit whom.</text>
  <text x="400" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1 &#8722; 1 = 0 in every column, so nothing in the row records the order.</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Losing word order is not a bug. It is the price of the method, paid every time.</text>
</svg>
