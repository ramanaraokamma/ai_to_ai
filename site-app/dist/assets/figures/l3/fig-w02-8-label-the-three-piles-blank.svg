<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the three piles</title>
  <desc>Three bars stand for the three piles cut from a 2000-row table, drawn in proportion, with every number removed. The train bar is the widest, the validation and test bars are equal and each a fifth as wide. Beside each bar are three blank boxes for the row count, the number of late orders and the late rate. The answers are train 1200 rows with 345 late giving 0.2875, validation 400 rows with 115 late giving 0.2875, and test 400 rows with 115 late giving 0.2875, and the three counts add to 2000 while the three late counts add to 575. Underneath, two blank boxes ask for the test_size of each cut, which are 0.2 on the whole 2000 rows and 0.25 on the remaining 1600, and three blank lines ask what each pile may be used for.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the three piles</text>
  <text x="250" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2000 rows in. The bars are drawn to scale; the numbers are gone.</text>

  <text x="34" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">train</text>
  <rect x="34" y="106" width="252" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="298" y="108" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rows</text>
  <rect x="298" y="136" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">late</text>
  <rect x="298" y="164" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rate</text>

  <text x="34" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">validation</text>
  <rect x="34" y="238" width="84" height="40" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="298" y="240" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rows</text>
  <rect x="298" y="268" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">late</text>
  <rect x="298" y="296" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rate</text>

  <text x="34" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">test</text>
  <rect x="34" y="370" width="84" height="40" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <rect x="298" y="372" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="388" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rows</text>
  <rect x="298" y="400" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="416" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">late</text>
  <rect x="298" y="428" width="70" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="374" y="444" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rate</text>

  <rect x="30" y="472" width="440" height="80" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="498" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">cut one, on all 2000 rows: test_size =</text>
  <rect x="292" y="482" width="80" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="46" y="536" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">cut two, on what is left: test_size =</text>
  <rect x="292" y="520" width="80" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <text x="34" y="576" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Now one line each: what may this pile be used for?</text>
  <text x="34" y="602" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">train</text>
  <line x1="96" y1="606" x2="466" y2="606" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="34" y="634" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">validation</text>
  <line x1="112" y1="638" x2="466" y2="638" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="34" y="666" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">test</text>
  <line x1="96" y1="670" x2="466" y2="670" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
