<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A bag where common words get more slips</title>
  <desc>A paper bag holding six numbered slips: four say bus, one says market, one says shop. A die showing five points to the slip drawn, which is market. A small table gives the chances: bus sixty-seven percent, market seventeen, shop seventeen.</desc>
