<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the brightness ramp</title>
  <desc>Six unlabelled swatches running from black to white, each with an empty box beneath it for the student to write its number, and an arrow underneath with two empty boxes at its ends.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the brightness ramp</text><rect x="32" y="72" width="116" height="112" fill="#14202B" stroke="#14202B" stroke-width="2"/><rect x="32" y="194" width="116" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><rect x="158" y="72" width="116" height="112" fill="#313C46" stroke="#14202B" stroke-width="2"/><rect x="158" y="194" width="116" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><rect x="284" y="72" width="116" height="112" fill="#4F5860" stroke="#14202B" stroke-width="2"/><rect x="284" y="194" width="116" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><rect x="410" y="72" width="116" height="112" fill="#8A9095" stroke="#14202B" stroke-width="2"/><rect x="410" y="194" width="116" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><rect x="536" y="72" width="116" height="112" fill="#C5C8CB" stroke="#14202B" stroke-width="2"/><rect x="536" y="194" width="116" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><rect x="662" y="72" width="116" height="112" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/><rect x="662" y="194" width="116" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><line x1="32" y1="256" x2="768" y2="256" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="758,248 768,256 758,264" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="42,248 32,256 42,264" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="268" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="38" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">this end is</text><rect x="480" y="268" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="672" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">and this end is</text><text x="400" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Write the six numbers in the boxes, in order. Then fill the two boxes on the arrow.</text><text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One of the six is “paper you never touched”. One is “a cinema before the film starts”.</text>
  </g>
</svg>
