  <text x="174" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">dashed bar: before    solid bar: right share of the answered    cross and red: fell</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Overall 0.575 to 0.722, yet billing fell from 4 of 8 to 2 of 6; small rows are not readable.</text>
