<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the parts of this dictionary</title>
  <desc>An index card holding four pairs: name to Asha, runs to 48, team to Falcons, out to True. Four empty dashed boxes lettered A to D sit around it with leader lines pointing at the whole card, one label box, one value box and one whole row. A fifth blank asks how many key-value pairs there are.</desc>
