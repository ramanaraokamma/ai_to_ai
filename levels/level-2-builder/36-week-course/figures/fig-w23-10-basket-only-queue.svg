<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One word makes the whole column writing</title>
  <desc>Two rows showing the same idea twice. On top, a till marked basket only has a queue of four baskets and one trolley, and the whole queue has to be labelled a trolley queue. Underneath, a column of five cells holds four ages and one cell reading unknown, and the whole column has to be badged object, which is pandas's word for writing. A note says a column must be one kind of thing all the way down.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One word makes the whole column writing</text>

  <!-- top: the shop queue -->
  <rect x="20" y="60" width="760" height="140" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="40" y="78" width="128" height="30" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="104" y="93" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">BASKET ONLY</text>
  <line x1="104" y1="112" x2="104" y2="152" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"/>
  <rect x="64" y="152" width="80" height="30" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="104" y="167" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">the till</text>

  <!-- four baskets -->
  <g stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round" fill="#D9EAF9">
    <rect x="196" y="112" width="52" height="34" rx="8"/>
    <rect x="262" y="112" width="52" height="34" rx="8"/>
    <rect x="328" y="112" width="52" height="34" rx="8"/>
    <rect x="460" y="112" width="52" height="34" rx="8"/>
  </g>
  <g stroke="#1F6FB2" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M210 112 A12 12 0 0 1 234 112"/>
    <path d="M276 112 A12 12 0 0 1 300 112"/>
    <path d="M342 112 A12 12 0 0 1 366 112"/>
    <path d="M474 112 A12 12 0 0 1 498 112"/>
  </g>
  <text x="222" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">basket</text>
  <text x="288" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">basket</text>
  <text x="354" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">basket</text>
  <text x="486" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">basket</text>

  <!-- one trolley -->
  <rect x="392" y="102" width="56" height="44" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="404" cy="154" r="6" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="436" cy="154" r="6" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <text x="420" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#845F00" text-anchor="middle">ONE trolley</text>

  <rect x="552" y="106" width="200" height="36" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="652" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">now it's a TROLLEY queue</text>
  <line x1="528" y1="124" x2="546" y2="124" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(546 124)"/>
  <text x="652" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">all five get treated the same way</text>

  <text x="400" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the same thing, in a table</text>

  <!-- bottom: the column -->
  <rect x="20" y="234" width="760" height="126" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="104" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">age</text>
  <text x="104" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one column</text>
  <text x="104" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">of a table</text>

  <rect x="196" y="266" width="52" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="222" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">13</text>
  <rect x="262" y="266" width="52" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="288" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">14</text>
  <rect x="328" y="266" width="52" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="354" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
  <rect x="392" y="266" width="56" height="34" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="420" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">unknown</text>
  <rect x="460" y="266" width="52" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="486" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">13</text>
  <text x="420" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#845F00" text-anchor="middle">ONE word</text>

  <line x1="528" y1="283" x2="546" y2="283" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(546 283)"/>
  <rect x="552" y="265" width="200" height="36" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="652" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">dtype: object</text>
  <text x="652" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">all twelve are treated as writing</text>

  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A column has to be one kind of thing all the way down.</text>
</svg>
