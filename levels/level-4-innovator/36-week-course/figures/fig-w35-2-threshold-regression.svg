  <text x="410" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">best-note score of the question (0 to 0.40)</text>
  <text x="400" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">overall 17 &#8594; 15 of 25 (wobble 2.3)  &#183;  factual 8 &#8594; 5 of 9  &#183;  out of scope 2 &#8594; 3 of 3</text>
  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Cut at 0.36: wins c19, loses c01, c03 and c09. A named mechanism, not noise.</text>
</svg>
