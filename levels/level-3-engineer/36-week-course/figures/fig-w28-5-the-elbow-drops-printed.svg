<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The elbow is where the drop stops paying</title>
  <desc>Inertia plotted against k for the 178 scaled wines: 2314.0 at k equals 1, then 1659.0, 1277.9, 1180.7, 1110.4, 1044.5, 996.0 and 944.6. The drop from each k to the next is printed beside the line: 655.0, then 381.1, then a collapse to 97.2, then 70.4, 65.9, 48.5 and 51.4. The point at k equals 3 is ringed, because 381.1 divided by 97.2 is 3.9, the last time an extra cluster bought nearly four times what the next one did.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Watch the drops, not the value.</text>
  <line x1="70.00" y1="400.00" x2="420.00" y2="400.00" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="70.00" y1="90.00" x2="70.00" y2="400.00" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90.00" y1="400.00" x2="90.00" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="90.0" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="134.29" y1="400.00" x2="134.29" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="134.28571428571428" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <line x1="178.57" y1="400.00" x2="178.57" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178.57142857142856" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <line x1="222.86" y1="400.00" x2="222.86" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="222.85714285714286" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <line x1="267.14" y1="400.00" x2="267.14" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="267.1428571428571" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <line x1="311.43" y1="400.00" x2="311.43" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="311.42857142857144" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <line x1="355.71" y1="400.00" x2="355.71" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="355.7142857142857" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7</text>
  <line x1="400.00" y1="400.00" x2="400.00" y2="406.00" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400.0" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <text x="250" y="448" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">k, the number of clusters you ask for</text>
  <text x="46" y="255" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 46 255)">inertia</text>
  <polyline points="90.00,125.59 134.29,244.31 178.57,313.38 222.86,331.00 267.14,343.74 311.43,355.68 355.71,364.48 400.00,373.79" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90.00" cy="125.59" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="134.29" cy="244.31" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="178.57" cy="313.38" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="222.86" cy="331.00" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="267.14" cy="343.74" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="311.43" cy="355.68" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="355.71" cy="364.48" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="400.00" cy="373.79" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="178.57" cy="313.38" r="11" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3"/>
  <line x1="168.57" y1="313.38" x2="188.57" y2="313.38" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <line x1="178.57" y1="303.38" x2="178.57" y2="323.38" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <text x="180.57142857142856" y="287.380625" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">the bend: k = 3</text>
  <text x="414" y="129.58749999999998" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">2314.0</text>
  <text x="414" y="377.79125" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">944.6</text>
  <rect x="64" y="322" width="392" height="62" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="76" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">drop:  655.0  381.1   97.2  70.4  65.9  48.5  51.4</text>
  <text x="76" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C42B8C">381.1 &#247; 97.2 = 3.9  &#8212;  then it is a trickle</text>
  <text x="250" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Never pick the smallest inertia: at k = 178 it is exactly 0.</text>
</svg>
