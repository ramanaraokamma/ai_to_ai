  <line x1="415" y1="92" x2="415" y2="296" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <line x1="252.5" y1="92" x2="252.5" y2="296" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <line x1="144.2" y1="92" x2="144.2" y2="296" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <line x1="90" y1="92" x2="90" y2="296" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <line x1="90" y1="296" x2="740" y2="296" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="92" x2="90" y2="296" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="92" x2="740" y2="92" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="740" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">lr = 0.1</text>
  <text x="415" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">gradient size (each tick is ten times bigger)</text>
  <text x="40" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 40 194)">first step</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Dotted guides mark the six gradients: plot one point on each, then join them.</text>
</svg>
