  <line x1="70" y1="400" x2="470" y2="400" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="400" x2="70" y2="400" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.0</text>
  <line x1="65" y1="296.667" x2="70" y2="296.667" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="300.667" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.2</text>
  <line x1="65" y1="193.333" x2="70" y2="193.333" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="197.333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.4</text>
  <line x1="65" y1="90" x2="70" y2="90" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.6</text>
  <line x1="70" y1="400" x2="70" y2="405" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="70" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="200" y1="400" x2="200" y2="405" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">500</text>
  <line x1="330" y1="400" x2="330" y2="405" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="330" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1000</text>
  <line x1="460" y1="400" x2="460" y2="405" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1500</text>
