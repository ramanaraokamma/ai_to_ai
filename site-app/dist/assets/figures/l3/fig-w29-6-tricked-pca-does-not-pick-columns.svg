<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: does PCA pick your best columns?</title>
  <desc>Two panels. On the left, marked wrong, thirteen small column chips sit in a row with the first two blue and kept and the other eleven red and struck through with crosses; the kept pair is flavanoids and total_phenols and the other eleven are binned, so you never find out what was in them and the thing that mattered may have been spread thinly across all thirteen. That is column selection, not PCA. On the right, marked right, all thirteen chips stay blue and an arrow takes every one of them into a single purple bar labelled PC1 with thirteen loadings, none of them zero. The four biggest loadings are listed as flavanoids 0.423, total_phenols 0.395, od280 over od315 0.376 and nonflavanoid_phenols minus 0.299 &#8212; every column still has a say, and the last one pulls the other way, which is real chemistry.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Wrong and right: does PCA pick your best columns?</text>
