<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>What info() tells you, line by line</title>
  <desc>Five stacked bands, numbered one to five in pink circles. Each band holds one line of the info printout in a typewriter face with two lines of plain explanation under it: what kind of object it is, how many rows and how they are named, how many columns follow, one line per column with its filled-cell count and kind, and the closing tally of kinds.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What info() tells you, line by line</text>
  <rect x="64" y="84" width="396" height="100" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="42" cy="134" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="42" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">1</text>
  <text x="80" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">&lt;class 'pandas.core.frame.DataFrame'&gt;</text>
  <text x="80" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">This really is a DataFrame. Line one says so,</text>
  <text x="80" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">in case you handed pandas the wrong thing.</text>
  <rect x="64" y="200" width="396" height="100" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="42" cy="250" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="42" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">2</text>
  <text x="80" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">RangeIndex: 12 entries, 0 to 11</text>
  <text x="80" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Twelve rows, named 0 to 11. That naming is</text>
  <text x="80" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the index: the counting numbers, no gaps.</text>
  <rect x="64" y="316" width="396" height="100" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="42" cy="366" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="42" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">3</text>
  <text x="80" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">Data columns (total 5 columns):</text>
  <text x="80" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Five columns follow. Count them against the</text>
  <text x="80" y="398" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">number of names you typed. One short is a bug.</text>
  <rect x="64" y="432" width="396" height="100" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="42" cy="482" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="42" y="482" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">4</text>
  <text x="80" y="466" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">2   runs    12 non-null    int64</text>
  <text x="80" y="494" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Column 2 is called runs. Twelve of its twelve</text>
  <text x="80" y="514" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">cells hold something, and they are whole numbers.</text>
  <rect x="64" y="548" width="396" height="100" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="42" cy="598" r="16" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="42" y="598" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">5</text>
  <text x="80" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dtypes: bool(1), int64(2), object(2)</text>
  <text x="80" y="610" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">The tally of kinds. object means text - and on a</text>
  <text x="80" y="630" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">column you meant to be numbers, that is an alarm.</text>
  <text x="250" y="676" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Read all five out loud. Every line is a check you can fail.</text>
</svg>
