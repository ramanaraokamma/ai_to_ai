  <circle cx="478" cy="190" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="478" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
