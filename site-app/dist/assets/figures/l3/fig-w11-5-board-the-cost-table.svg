<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The cost board, with the winner circled</title>
  <desc>A nine-row cost table as it should look on the board. For each threshold the number of misses, the number of false alarms, 500 times the misses, 10 times the false alarms, and the total. 0.50: 14 misses, 0 alarms, 7000 plus 0 is 7000. 0.15: 13, 0, 6500 plus 0 is 6500. 0.12: 12, 0, 6000 plus 0 is 6000. 0.10: 11, 5, 5500 plus 50 is 5550, and this row is circled as the winner. 0.08: 11, 12, 5500 plus 120 is 5620. 0.06: 11, 22, 5500 plus 220 is 5720. 0.04: 10, 61, 5000 plus 610 is 5610. 0.02: 9, 211, 4500 plus 2110 is 6610. 0.01: 6, 421, 3000 plus 4210 is 7210.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The cost board, with the winner circled</text>
