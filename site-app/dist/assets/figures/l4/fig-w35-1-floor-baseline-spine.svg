<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Floor, baseline and spine measured on the same 25 frozen cases</title>
  <desc>For each of six categories two bars show passes out of n: baseline (circle end) and v1 spine (square end). factual 8/9 and 8/9; multi_hop 0/4 and 0/4; arithmetic 0/4 and 3/4; out_of_scope 2/3 and 2/3; adversarial 0/3 and 3/3; ambiguous 1/2 and 1/2. Totals: floor 6 of 25, baseline 11 of 25, v1 17 of 25, wobble 2.3. Everything is measured on scripted stand-ins.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Floor, baseline, spine: the same 25 cases</text>
  <rect x="580" y="96" width="196" height="236" rx="12" fill="#F5F8FA" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <rect x="592" y="83" width="172" height="26" rx="6" fill="#F5F8FA" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="678" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">stand-in, not a model</text>
  <line x1="250" y1="98" x2="250" y2="338" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="550" y1="98" x2="550" y2="338" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="250" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="550" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">all cases</text>
  <text x="236" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">factual  n=9</text>
  <rect x="250" y="104" width="266.7" height="14" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="516.7" cy="111" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="528.7" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">baseline 8/9</text>
  <rect x="250" y="121" width="266.7" height="14" rx="3" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="511.7" y="123" width="10" height="10" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="528.7" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">v1 8/9</text>
  <text x="236" y="157" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">multi hop  n=4</text>
  <circle cx="250" cy="149" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="262" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">baseline 0/4</text>
  <rect x="245" y="161" width="10" height="10" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="262" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">v1 0/4</text>
  <text x="236" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">arithmetic  n=4</text>
  <circle cx="250" cy="187" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
