<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blame arriving at each of the nine knobs</title>
  <desc>Four weight blocks with their shapes, each with a dashed pink arrow pointing down to its gradient block of the same shape. W1 is 2 by 2 holding 0.5, minus 0.3, 0.8, 0.2 and dW1 is 2 by 2 holding 0.297891, 0.299875, minus 0.258482 and 0.444136. b1 is 1 by 2 and db1 holds 0.042091 and minus 0.011354. W2 is 2 by 1 and dW2 holds minus 0.053631 and 0.000852. b2 is 1 by 1 and db2 holds 0.167091. Nine knobs, nine slopes. A callout works dW2 entry 0 out in full: 2.2 times minus 0.0249 is minus 0.054863, 0.3 times 0.1614 is 0.048424, 0.5 times minus 0.0944 is minus 0.047193, and the total is minus 0.053631.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Blame arriving at each of the nine knobs</text>
