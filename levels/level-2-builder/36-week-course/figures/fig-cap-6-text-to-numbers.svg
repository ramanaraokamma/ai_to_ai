<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Turning a text column into numbers, with no new syntax</title>
  <desc>On the left a single text column holding walk, bus, cycle, car and walk. An arrow points right to three columns headed is_walk, is_bus and is_cycle holding ones and zeros, so walk becomes 1 0 0, bus becomes 0 1 0, cycle becomes 0 0 1 and car becomes 0 0 0. A green note explains there is no is_car column because three zeros already means car. The line of code underneath reads: df bracket is_walk equals open paren df bracket mode equals equals walk close paren dot astype int.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Turning a text column into numbers, with no new syntax</text>
  <text x="400" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A comparison gives True/False (week 22). astype(int) turns that into 1/0 (week 23).</text>
  <text x="112" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">what you collected</text>
