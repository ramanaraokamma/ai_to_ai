<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the forward shapes</title>
  <desc>Six numbered rows, each showing one line of a forward pass and the shapes going into it, with an empty dashed pink box where the result shape goes. Row 1 is X at W1, from 4 by 2 at 2 by 3, giving 4 by 3. Row 2 is Z1 equals X at W1 plus b1, adding a 1 by 3 bias row, still 4 by 3. Row 3 is A1 equals ReLU of Z1, and a squash never changes a shape, so 4 by 3. Row 4 is Z2 equals A1 at W2 plus b2, from 4 by 3 at 3 by 1, giving 4 by 1. Row 5 is A2 equals sigmoid of Z2, still 4 by 1. Row 6 is E divided by E dot sum with axis 1 and keepdims True, from 4 by 3 divided by 4 by 1, giving 4 by 3. A panel at the bottom asks which number is the batch size and how many of the six shapes it appears in.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the forward shapes</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Four rows through 2 &#8594; 3 &#8594; 1. Fill in each result shape.</text>

  <rect x="30" y="92" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="116" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">X @ W1</text>
  <text x="80" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">(4, 2) @ (2, 3)</text>
  <rect x="348" y="126" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="178" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="202" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Z1 = X @ W1 + b1</text>
  <text x="80" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">+ (1, 3), broadcast down</text>
  <rect x="348" y="212" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="264" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="288" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">A1 = ReLU(Z1)</text>
  <text x="80" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">a squash never changes a shape</text>
  <rect x="348" y="298" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="350" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="374" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Z2 = A1 @ W2 + b2</text>
  <text x="80" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">(4, 3) @ (3, 1)</text>
  <rect x="348" y="384" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="436" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="460" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="465" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">A2 = sigmoid(Z2)</text>
  <text x="80" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">one probability per row</text>
  <rect x="348" y="470" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="522" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="546" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="546" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="80" y="551" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">E / E.sum(1, keepdims=True)</text>
  <text x="80" y="576" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">(4, 3) &#247; (4, 1)</text>
  <rect x="348" y="556" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="610" width="440" height="66" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="634" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Which number is the batch size, and how many boxes?</text>
  <text x="250" y="656" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">____________  in ______ of the 6</text>
</svg>
