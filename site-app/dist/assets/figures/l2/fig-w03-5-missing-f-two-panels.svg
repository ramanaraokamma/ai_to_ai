<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The bug that does not shout</title>
  <desc>Two mirrored terminal panels. The left, marked wrong, prints Per slice followed by curly braces instead of a number, and a note says there is no error message. The right, marked correct, prints Per slice one point zero six after one letter was added.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The bug that does not shout</text>
  <line x1="400" y1="74" x2="400" y2="332" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <rect x="30" y="74" width="360" height="244" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="410" y="74" width="360" height="244" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="72" cy="110" r="17" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="66.0" y1="104.0" x2="78.0" y2="116.0"/>
    <line x1="78.0" y1="104.0" x2="66.0" y2="116.0"/>
  </g>
  <circle cx="452" cy="110" r="17" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="444.0,111.0 449.5,117.0 461.0,104.0" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Before: the f is missing</text>
  <text x="478" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">After: the f is back</text>
  <rect x="56" y="140" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="56" y="140" width="300" height="26" rx="10" fill="#F5F8FA"/>
  <line x1="56" y1="166" x2="356" y2="166" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Terminal</text>
  <text x="70" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#55636F">&gt;</text>
  <text x="84" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">python3 receipt.py</text>
  <rect x="66" y="206" width="282" height="24" rx="4" fill="#F6AEA6"/>
  <text x="70" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Per slice: {cost_per_slice}</text>
  <line x1="376" y1="218" x2="352" y2="218" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(352 218) rotate(180.0)"/>
  <text x="210" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the braces printed as ordinary characters</text>
  <rect x="96" y="280" width="228" height="30" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="210" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">and NO error message</text>
  <rect x="436" y="140" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="436" y="140" width="300" height="26" rx="10" fill="#E2F7ED"/>
  <line x1="436" y1="166" x2="736" y2="166" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="450" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Terminal</text>
  <text x="450" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#55636F">&gt;</text>
  <text x="464" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">python3 receipt.py</text>
  <rect x="446" y="206" width="282" height="24" rx="4" fill="#E2F7ED"/>
  <text x="450" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Per slice: 1.06</text>
  <text x="590" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one letter added, in front of the quote</text>
  <rect x="476" y="280" width="228" height="30" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="590" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle" dominant-baseline="central">you found it by LOOKING</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">No traceback, no line number. The only alarm is your own eyes on the output.</text>
</svg>
