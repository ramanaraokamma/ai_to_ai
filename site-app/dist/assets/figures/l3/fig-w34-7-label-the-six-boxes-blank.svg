  <text x="40" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">the six labels, in some order:  one prediction is about · what goes in, with types · what comes out</text>
  <text x="40" y="403" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">· the two errors, priced · the threshold, as a sum · never used for</text>
