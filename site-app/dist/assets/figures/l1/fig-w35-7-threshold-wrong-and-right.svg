<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Hiding the gap and showing the gap</title>
  <desc>Two panels. On the left, marked wrong, a booth hides its weakness and says it works great. On the right, marked correct, the same booth prints its measured failure in the biggest letters on the table.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Both booths have the same 50 point gap</text>
  <line x1="400" y1="70" x2="400" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="30" y="70" width="340" height="252" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="430" y="70" width="340" height="252" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(46,82) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(446,82) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="94" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Hides it</text>
  <text x="494" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Prints it in marker</text>
  <rect x="50" y="126" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="200" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">"It works really well!"</text>
  <rect x="450" y="126" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="600" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DO NOT USE AFTER DARK</text>
  <text x="600" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">40% under a lamp. I measured it.</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="52" y="206">Visitor asks: "when does it fail?"</text>
    <text x="52" y="230">Student: "um, it's pretty good..."</text>
    <text x="52" y="262">Visitor learns: nothing.</text>
    <text x="52" y="290">Visitor believes: nothing else either.</text>
    <text x="452" y="206">Visitor asks: "when does it fail?"</text>
    <text x="452" y="230">Student: "40% under a lamp. Watch."</text>
    <text x="452" y="262">Visitor learns: a number they can check.</text>
    <text x="452" y="290">Visitor believes: everything else too.</text>
  </g>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The gap is not the mistake. Not measuring it is the mistake. Hiding it is the only real failure here.</text>
</svg>
