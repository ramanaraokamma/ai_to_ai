<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Test the edge, not the middle</title>
  <desc>A number line of ages from zero to forty, split at thirteen into a child band priced 120 and an adult band priced 250. A dashed line marks the edge between twelve and thirteen. Five test ages are pinned below: 8, 12, 13, 14 and 40, with 12 and 13 sitting either side of the edge.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Test the edge, not the middle</text>
  <rect x="60.0" y="150" width="123.5" height="40" fill="#D9EAF9"/>
  <rect x="183.5" y="150" width="256.5" height="40" fill="#F4D5E9"/>
  <rect x="60.0" y="150" width="123.5" height="40" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="183.5" y="150" width="256.5" height="40" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="121.75" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">child, 120</text>
  <text x="311.75" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">adult, 250</text>
  <line x1="60" y1="220" x2="440" y2="220" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="60.0" y1="220" x2="60.0" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="107.5" y1="220" x2="107.5" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="107.5" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <line x1="155.0" y1="220" x2="155.0" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="155.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <line x1="202.5" y1="220" x2="202.5" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="202.5" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">15</text>
  <line x1="250.0" y1="220" x2="250.0" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="250.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">20</text>
  <line x1="297.5" y1="220" x2="297.5" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="297.5" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">25</text>
  <line x1="345.0" y1="220" x2="345.0" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="345.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">30</text>
  <line x1="392.5" y1="220" x2="392.5" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="392.5" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">35</text>
  <line x1="440.0" y1="220" x2="440.0" y2="226" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="440.0" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">40</text>
  <text x="250" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">age in years</text>
  <line x1="183.5" y1="128" x2="183.5" y2="220" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="183.5" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the edge is here: 12 | 13</text>
  <text x="178" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">age</text>
  <text x="300" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">price you should get</text>
  <rect x="110" y="268" width="280" height="28" fill="#D9EAF9"/>
  <line x1="110" y1="296" x2="390" y2="296" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="300" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">120</text>
  <rect x="110" y="324" width="280" height="28" fill="#F4D5E9"/>
  <line x1="110" y1="324" x2="390" y2="324" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
  <text x="300" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">120</text>
  <rect x="110" y="352" width="280" height="28" fill="#F4D5E9"/>
  <line x1="110" y1="352" x2="390" y2="352" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">13</text>
  <text x="300" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">250</text>
  <line x1="110" y1="380" x2="390" y2="380" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178" y="394" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">14</text>
  <text x="300" y="394" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">250</text>
  <line x1="110" y1="408" x2="390" y2="408" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">40</text>
  <text x="300" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">250</text>
  <line x1="110" y1="296" x2="390" y2="296" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="240" y1="268" x2="240" y2="436" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="110" y="324" width="280" height="56" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <rect x="110" y="268" width="280" height="168" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">these two sit either side of the edge</text>
</svg>
