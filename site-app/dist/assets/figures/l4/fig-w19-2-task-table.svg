<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A perfect score on a task can be a leak; only the lookup column shows what deleting a part does</title>
  <desc>A grid of share of answers right, three made-up tasks by five models, plus a chance column. Copy: full 1.00, no mask 1.00, no pos 0.95, no res 1.00, no norm 1.00. Reverse: 1.00, 1.00, 0.92, 1.00, 1.00. Lookup: 1.00, 0.37, 1.00, 1.00, 0.33. Chance is 0.125 on copy and reverse (1 in 8) and 0.1 on lookup (1 in 10). Cells at 1.00 carry a tick, cells below 0.5 carry a cross. The two no-mask cells on copy and reverse are ringed number 1, a leak; the lookup cells 0.37 and 0.33 are ringed number 2, causes not tested.</desc>
