  <circle cx="194" cy="229.2" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="194" y="229.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
