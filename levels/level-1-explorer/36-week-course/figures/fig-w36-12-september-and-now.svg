<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>September and now</title>
  <desc>Two panels. The September panel lists six things the student could not do, all crossed. The today panel lists the same six things, all ticked, with the numbers they measured.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same list. Thirty-six weeks apart.</text>
  <line x1="400" y1="66" x2="400" y2="356" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="24" y="66" width="352" height="290" rx="12" fill="#F5F8FA" stroke="#55636F" stroke-width="3" stroke-linejoin="round"/>
  <rect x="424" y="66" width="352" height="290" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="200" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">SEPTEMBER</text>
  <text x="600" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">TODAY</text>
  <g stroke="#55636F" stroke-width="4" stroke-linecap="round">
    <line x1="44" y1="126" x2="60" y2="142"/><line x1="60" y1="126" x2="44" y2="142"/>
    <line x1="44" y1="164" x2="60" y2="180"/><line x1="60" y1="164" x2="44" y2="180"/>
    <line x1="44" y1="202" x2="60" y2="218"/><line x1="60" y1="202" x2="44" y2="218"/>
    <line x1="44" y1="240" x2="60" y2="256"/><line x1="60" y1="240" x2="44" y2="256"/>
    <line x1="44" y1="278" x2="60" y2="294"/><line x1="60" y1="278" x2="44" y2="294"/>
    <line x1="44" y1="316" x2="60" y2="332"/><line x1="60" y1="316" x2="44" y2="332"/>
  </g>
  <g stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="444,135 451,143 462,127"/>
    <polyline points="444,173 451,181 462,165"/>
    <polyline points="444,211 451,219 462,203"/>
    <polyline points="444,249 451,257 462,241"/>
    <polyline points="444,287 451,295 462,279"/>
    <polyline points="444,325 451,333 462,317"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="74" y="139">Tell rules from learned-from-examples</text>
    <text x="74" y="177">Turn real things into a table</text>
    <text x="74" y="215">Train a model</text>
    <text x="74" y="253">TEST a model honestly</text>
    <text x="74" y="291">Know a photo is a grid of numbers</text>
    <text x="74" y="329">Measure who your machine fails</text>
    <text x="474" y="139">W1: judgement, not "smart"</text>
    <text x="474" y="177">W4: 200 photos, 4 classes</text>
    <text x="474" y="215">W34: booth-v1.tm</text>
    <text x="474" y="253">W34: 30 / 40 = 75%</text>
    <text x="474" y="291">W23: 0 to 255, three grids</text>
    <text x="474" y="329">W35: 50 percentage points</text>
  </g>
  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Most adults who talk about AI for a living cannot do rows four and six. Today is not about finding out. It is about proving it.</text>
</svg>
