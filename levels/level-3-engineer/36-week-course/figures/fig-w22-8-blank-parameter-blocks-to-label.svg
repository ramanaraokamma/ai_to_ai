<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the four blocks</title>
  <desc>Four blank rows, one per block of learnable numbers in a 2 to 16 to 1 network. Each row shows a glyph on the left: a two by four grid of cells, then a single column of four cells, then a row of four cells, then one cell on its own. Beside each glyph are three empty boxes to write in the block&#8217;s name, its shape and how many numbers it holds, and a fifth empty box at the bottom for the total, which should come to 32 plus 16 plus 16 plus 1 equals 65.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the four blocks</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one 2 to 16 to 1 network. Every learnable number is in one row.</text>
  <text x="36" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">block</text>
  <text x="112" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">its name</text>
  <text x="266" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">shape</text>
  <text x="376" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">count</text>
  <rect x="34" y="116" width="432" height="64" rx="10" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="56" y="130" width="9" height="9" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="65" y="130" width="9" height="9" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/>
