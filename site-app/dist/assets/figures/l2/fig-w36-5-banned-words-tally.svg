<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Eight words with a number hiding behind them</title>
  <desc>On the left, eight banned phrases on a tally sheet with marks beside three of them. On the right, the same claim rewritten as a sentence containing the error, its units, the baseline and the number of unseen rows. An arrow runs from the vague version to the precise one.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Eight words with a number hiding behind them</text>
  <rect x="20" y="62" width="340" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="190" y="88" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle">banned all day</text>
  <rect x="44" y="100" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="113" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">magic</text>
  <rect x="44" y="132" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="145" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">the AI figured it out</text>
  <rect x="44" y="164" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="177" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">pretty accurate</text>
  <text x="300" y="177" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#CC2B1D" dominant-baseline="central">|| </text>
  <rect x="44" y="196" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="209" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">it's smart</text>
  <rect x="44" y="228" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="241" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">basically perfect</text>
  <rect x="44" y="260" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="273" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">the data speaks for itself</text>
  <rect x="44" y="292" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="305" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">obviously</text>
  <text x="300" y="305" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#CC2B1D" dominant-baseline="central">| </text>
  <rect x="44" y="324" width="232" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="337" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">just</text>
  <text x="300" y="337" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#CC2B1D" dominant-baseline="central">||| </text>
  <text x="190" y="374" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a tally, not an interruption</text>
  <line x1="370" y1="208" x2="410" y2="208" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(410 208) rotate(0.0)"/>
  <rect x="420" y="62" width="360" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="600" y="88" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle">what to say instead</text>
  <path d="M444 108 q0 -8 8 -8 H738 L756 118 V224 q0 8 -8 8 H452 q-8 0 -8 -8 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M738 100 V118 H756 Z" fill="#F5F8FA" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="460" y="130" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B">“Off by 2.35 minutes,</text>
  <text x="460" y="152" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B"> against a baseline of 7.98 minutes,</text>
  <text x="460" y="174" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B"> on 26 rows it had never seen.”</text>
  <line x1="460" y1="190" x2="740" y2="190" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="212" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F">six seconds. three numbers. believed.</text>
  <rect x="444" y="248" width="312" height="96" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="600" y="272" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the frame, if you freeze:</text>
  <text x="600" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">off by ____ ____</text>
  <text x="600" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">against a baseline of ____</text>
  <text x="600" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">on ____ unseen rows</text>
  <text x="600" y="374" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Every “just” is a decision you skipped explaining.</text>
</svg>
