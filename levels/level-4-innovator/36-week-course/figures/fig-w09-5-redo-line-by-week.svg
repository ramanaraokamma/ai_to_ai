<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A week needs a redo when you score under 60% of its marks, which is the dashed line</title>
  <desc>Eight bars of marks available per week: Week 1 is 11, Week 2 is 10, Week 3 is 10, Week 4 is 9, Week 5 is 8, Week 6 is 8, Week 7 is 7 and Week 8 is 12, adding to 75. A dashed line across each bar marks 60% of its marks: 6.6, 6.0, 6.0, 5.4, 4.8, 4.8, 4.2 and 7.2. Under each bar, redo if marks are at most 6, 5, 5, 5, 4, 4, 4 and 7.</desc>
