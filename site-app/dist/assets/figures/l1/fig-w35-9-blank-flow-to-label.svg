<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank threshold flowchart to label</title>
  <desc>An unlabelled flowchart: one input box at the left, a diamond in the middle, one branch going down to a single empty box and one branch going right to four stacked empty boxes. All label areas are blank dashed rectangles.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label every empty box</text>
  <rect x="30" y="120" width="120" height="60" rx="8" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M270 90 L360 150 L270 210 L180 150 Z" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="150" y1="150" x2="176" y2="150"/>
    <line x1="270" y1="212" x2="270" y2="272"/>
    <polyline points="262,264 270,274 278,264" stroke-linejoin="round"/>
    <line x1="362" y1="150" x2="428" y2="150"/>
    <polyline points="420,142 430,150 420,158" stroke-linejoin="round"/>
  </g>
  <rect x="180" y="278" width="180" height="56" rx="8" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round">
    <rect x="436" y="70" width="200" height="46" rx="8"/>
    <rect x="436" y="126" width="200" height="46" rx="8"/>
    <rect x="436" y="182" width="200" height="46" rx="8"/>
    <rect x="436" y="238" width="200" height="46" rx="8"/>
  </g>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="660" y1="93" x2="776" y2="93"/>
    <line x1="660" y1="149" x2="776" y2="149"/>
    <line x1="660" y1="205" x2="776" y2="205"/>
    <line x1="660" y1="261" x2="776" y2="261"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="30" y="204">what goes in?</text>
    <text x="182" y="248">this branch is: ______</text>
    <text x="436" y="308">this branch is: ______</text>
    <text x="660" y="88">counter?</text>
    <text x="660" y="144">counter?</text>
    <text x="660" y="200">counter?</text>
    <text x="660" y="256">counter?</text>
  </g>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="30" y1="352" x2="770" y2="352"/>
    <line x1="30" y1="384" x2="770" y2="384"/>
  </g>
  <text x="30" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">The question inside the diamond is: ________________________________________</text>
  <text x="30" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Why is there only ONE box on the lower branch but FOUR on the right? ______________</text>
</svg>
