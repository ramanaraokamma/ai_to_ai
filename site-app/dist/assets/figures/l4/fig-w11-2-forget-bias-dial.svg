  <text x="115" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1.93e&#8722;09</text>
  <rect x="50" y="252" width="130" height="18" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
