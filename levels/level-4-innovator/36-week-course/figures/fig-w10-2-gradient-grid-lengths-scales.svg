<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The size of the gradient at position 1 is never close to the 4.0 at the last position: it falls or climbs by orders of magnitude</title>
  <desc>A grid of 16 cells, rows for recurrent-weight scale 1, 2, 4 and 8, columns for sequence length T = 10, 20, 40 and 80, each cell printing the measured gradient at position 1 and a class word. Scale 1: 9.15e-03, 1.01e-05, 2.06e-10, 4.69e-21. Scale 2: 5.63e-01, 1.66e-02, 2.25e-03, 2.93e-06. Scale 4: 1.08e+01, 1.14e+01, 2.09e+01, 3.36e+03. Scale 8: 3.49e+01, 2.55e+02, 4.38e+03, 6.92e+07. Cells below 0.001 are labelled V vanishing, above 10 E exploding, otherwise L level. That gives 4 V, 4 L, 8 E. Cut-offs are the course's own. Seed 0.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">No row of the grid stays near 4.0</text>
  <text x="358" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sequence length T (steps the error travels back)</text>
  <text x="202" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">T = 10</text>
