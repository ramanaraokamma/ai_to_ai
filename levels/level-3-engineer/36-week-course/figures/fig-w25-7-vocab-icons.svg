<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img">
  <title>This week&#8217;s five words, drawn</title>
  <desc>Five small pictures. Stride is a row of six cells with two highlighted window bars, one starting at column 0 and one at column 2, so six starts become three. Padding is a four by four block of pixels sitting inside an amber ring of zeros, labelled 8 in, 8 out. Max pooling is a two by two block holding 4, 1, 2 and 9, an arrow, and one green cell holding 9, so four numbers become one. Receptive field is a five by four grid whose top-left four by four region is highlighted, with an arrow to a single output cell, labelled one cell sees 49 of 64. Flatten is two stacked two by two blocks becoming one row of eight cells, labelled 16 times 2 times 2 equals 64. The caption says one rule covers all of them: n plus 2p minus k, divided by s, plus 1, rounded down.</desc>
