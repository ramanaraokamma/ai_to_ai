<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The twenty-minute build sprint</title>
  <desc>A twenty minute bar split into four blocks: three minutes to split and seal, seven minutes to train and save, nine minutes to score the envelope, one minute to tally. A note says the envelope closes before the browser opens.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Twenty minutes, four blocks, one clock</text>
  <rect x="40" y="120" width="111" height="90" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="159" y="120" width="259" height="90" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <rect x="426" y="120" width="296" height="90" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="730" y="120" width="30" height="90" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="95" y="158">M2</text>
    <text x="288" y="158">M3</text>
    <text x="574" y="158">M4</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="95" y="182">split + seal</text>
    <text x="288" y="182">train + save + FIND the file</text>
    <text x="574" y="182">score all 40, one attempt each</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="95" y="234">3 min</text>
    <text x="288" y="234">7 min</text>
    <text x="574" y="234">9 min</text>
    <text x="745" y="234">1 min</text>
  </g>
  <text x="745" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">tally</text>
  <line x1="40" y1="252" x2="760" y2="252" stroke="#14202B" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="40" y="272">0</text><text x="145" y="272">3</text><text x="410" y="272">10</text><text x="716" y="272">19</text><text x="752" y="272">20</text>
  </g>
  <line x1="155" y1="96" x2="155" y2="118" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="155" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">the envelope closes HERE, before the browser opens</text>
  <text x="400" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Scoring takes the longest. That is not a mistake in the plan.</text>
  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Training is 7 minutes of clicking. Measuring is 10 minutes of writing, and it is the part that proves anything.</text>
</svg>
