<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 22</title>
  <desc>An empty framed drawing area headed draw your own five-row table and show what each of the three tools points at. A large blank grid sits in the middle with an empty dashed strip along its top edge for the column labels and an empty dashed strip down its left edge for the row labels. Three reminder boxes underneath ask for one loc question and its answer, one iloc question and its answer, and one filter question written in English.</desc>
  <rect x="24" y="24" width="752" height="272" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your own table, and what each of the three tools points at</text>

  <!-- column-label strip along the top edge -->
  <rect x="200" y="80" width="440" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="190" y="93" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">column labels</text>

  <!-- row-label strip down the left edge -->
  <rect x="164" y="118" width="30" height="140" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="150" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 150 188)">row labels</text>

  <!-- the blank grid -->
  <rect x="200" y="112" width="440" height="152" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="200" y1="142" x2="640" y2="142"/>
    <line x1="200" y1="172" x2="640" y2="172"/>
    <line x1="200" y1="202" x2="640" y2="202"/>
    <line x1="200" y1="232" x2="640" y2="232"/>
    <line x1="310" y1="112" x2="310" y2="264"/>
    <line x1="420" y1="112" x2="420" y2="264"/>
    <line x1="530" y1="112" x2="530" y2="264"/>
  </g>
  <text x="420" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C7CDD4" text-anchor="middle">five rows of your own data go here</text>

  <!-- the two arrows to annotate -->
  <line x1="660" y1="128" x2="686" y2="128" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="694" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" dominant-baseline="central">mark loc here</text>
  <line x1="660" y1="248" x2="686" y2="248" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="694" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" dominant-baseline="central">mark iloc here</text>

  <!-- reminder boxes -->
  <text x="60" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one loc question, and its answer</text>
  <rect x="60" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one iloc question, and its answer</text>
  <rect x="300" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one filter question, in English</text>
  <rect x="540" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">loc reads the edge. iloc counts from 0. A filter asks every row the same question.</text>
</svg>
