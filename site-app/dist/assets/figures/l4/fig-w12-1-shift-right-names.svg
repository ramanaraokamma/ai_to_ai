<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Training shifts the names one place right so that every step is asked for the letter that comes next</title>
  <desc>Two rows of eight cells for the name anika, each with its id. Input row: START 0, a 2, n 15, i 10, k 12, a 2, EOS 1, PAD 0. Target row: a 2, n 15, i 10, k 12, a 2, EOS 1, PAD 0, PAD 0. Seven pink arrows lead from each target cell up and to the right to the next input cell. Both rows are tensors of shape (231, 8) over all 231 names. Values from Week 12 block 1.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Shift right: the answer becomes the next question</text>
