    <text x="311" y="191" dominant-baseline="central">front</text>
    <text x="311" y="220" dominant-baseline="central">side</text>
  </g>
  <g fill="#55636F">
    <rect x="413" y="159" width="24" height="5" rx="2.5"/><rect x="459" y="159" width="24" height="5" rx="2.5"/>
    <rect x="413" y="188" width="24" height="5" rx="2.5"/><rect x="459" y="188" width="24" height="5" rx="2.5"/>
    <rect x="413" y="217" width="24" height="5" rx="2.5"/><rect x="459" y="217" width="24" height="5" rx="2.5"/>
