<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the five parts of this grid</title>
  <desc>A four by six grid of rainfall numbers. A downward arrow beside it is badged A and an arrow across the top is badged B. One cell, in the second row and third column, is ringed in pink and badged C. An empty dashed margin column of four boxes on the right is badged D and an empty dashed margin row of six boxes underneath is badged E. Five empty dashed write-in lines, lettered A to E, wait on the right.</desc>
