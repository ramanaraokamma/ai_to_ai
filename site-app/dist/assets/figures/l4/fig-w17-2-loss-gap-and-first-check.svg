<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Training loss keeps falling while validation flattens, and a calm output layer passes the first-loss check</title>
  <desc>Left chart: loss against training step, 0 to 1,499, with a dashed line at ln 28 = 3.332. Training loss (solid, circles) goes 3.349, 1.873, 1.558, 1.181, 0.999, 0.905, 0.894 at steps 0, 300, 500, 750, 1000, 1250, 1499. Validation loss (dashed, squares) goes 3.351, 1.892, 1.647, 1.470, 1.417, 1.427, 1.437. The final gap is 0.543. Right panel: with calm_head=False the first loss is 3.5025, 0.1702 from ln 28, FAIL; with calm_head=True it is 3.3481, 0.0159 away, PASS; the bar is 0.05.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Loss falls, then the gap opens (seed 0)</text>
