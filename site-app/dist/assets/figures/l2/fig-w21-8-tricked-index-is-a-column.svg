  <title>The numbers down the left are not a column</title>
  <desc>Two panels showing the same small cricket table. In the left panel, outlined red with a cross, four counting numbers are written above the table including one over the grey index strip, and the caption reads KeyError zero. In the right panel, outlined green with a tick, a heavy frame encloses only the three named columns, the grey index sits outside it labelled index, three counting numbers are written above the named columns, and the caption says info reports total three columns.</desc>
