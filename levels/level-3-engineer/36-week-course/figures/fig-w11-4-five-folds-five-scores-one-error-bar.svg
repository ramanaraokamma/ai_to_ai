  <text x="88" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">fold 2</text>
  <rect x="96" y="170" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="152" y="170" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="208" y="170" width="56" height="28" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <rect x="264" y="170" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="320" y="170" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="388" y="189" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">14 frauds</text>
  <text x="88" y="189" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">fold 3</text>
  <rect x="96" y="210" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="152" y="210" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="208" y="210" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="264" y="210" width="56" height="28" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <rect x="320" y="210" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="388" y="229" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">15 frauds</text>
