<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the readout</title>
  <desc>An unlabelled confidence readout. Spoon seventy-two per cent, toothbrush twenty per cent, comb eight per cent. Marker A sits on the winning bar, marker B on the gap between the first and second bar, marker C under the whole stack. Four empty boxes are provided for the student to write the winner, the margin, the sum and the decision.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Label the readout</text>

    <g font-size="14" fill="#55636F" text-anchor="end">
      <text x="170" y="110">spoon</text>
      <text x="170" y="154">toothbrush</text>
      <text x="170" y="198">comb</text>
    </g>
    <rect x="180" y="90" width="216" height="30" rx="6" fill="#1F6FB2"/>
    <rect x="180" y="134" width="60" height="30" rx="6" fill="#55636F"/>
    <rect x="180" y="178" width="24" height="30" rx="6" fill="#55636F"/>
    <g font-size="14" fill="#14202B">
      <text x="404" y="110">72%</text>
      <text x="248" y="154">20%</text>
      <text x="212" y="198">8%</text>
    </g>

    <circle cx="360" cy="105" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="360" y="106" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text>

    <line x1="240" y1="127" x2="396" y2="127" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
    <line x1="240" y1="123" x2="240" y2="131" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
    <line x1="396" y1="123" x2="396" y2="131" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
    <circle cx="318" cy="127" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="318" y="128" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text>

    <line x1="180" y1="224" x2="396" y2="224" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="220" x2="180" y2="228" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
    <line x1="396" y1="220" x2="396" y2="228" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
    <circle cx="288" cy="242" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="288" y="243" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">C</text>

    <rect x="470" y="88" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="484" y="110" font-size="14" fill="#55636F" dominant-baseline="central">A  winner:</text>
    <rect x="470" y="142" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="484" y="164" font-size="14" fill="#55636F" dominant-baseline="central">B  margin:</text>
    <rect x="470" y="196" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="484" y="218" font-size="14" fill="#55636F" dominant-baseline="central">C  the three scores add to:</text>

    <text x="180" y="278" font-size="14" fill="#55636F">D  Trust it or not — and one reason why:</text>
    <rect x="180" y="288" width="580" height="56" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Every number you write must come from the bars on the left.</text>
  </g>
</svg>
