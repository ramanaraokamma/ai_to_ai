<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The five-minute demo is six timed segments, one of them a failure shown on purpose</title>
  <desc>A timeline bar from 0:00 to 5:00 in six numbered segments: 1 SAY IT 30 s, 2 IT WORKS 60 s, 3 THE NUMBER 60 s (17 of 25, worst row multi_hop 0 of 4), 4 IT FAILS 60 s (case c19, best note scores 0.357), 5 I ATTACKED IT 60 s (A1 landed 15/50 then 0/50), 6 WHO SHOULD NOT RELY ON IT 30 s.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The five-minute run-sheet</text>
