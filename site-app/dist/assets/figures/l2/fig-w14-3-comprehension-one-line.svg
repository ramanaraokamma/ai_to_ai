  <title>One column out, as a list</title>
  <desc>A four row table with the runs column outlined in pink. An arrow points right to four numbered slots holding 48, 12, 77 and 5, bracketed as length four, with the note that a list of numbers can be summed, sorted and maxed.</desc>
