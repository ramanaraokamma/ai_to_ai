<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The question that moved</title>
  <desc>Left panel: a signed card asks whether practising more improves free throws, and the practice column below it is flat. Right panel: after the data was seen, the card has been quietly replaced by one saying sleep is the strongest driver, with the original struck through and no signature or date on the new one.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The question that moved</text>
  <rect x="20" y="62" width="360" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="200" y="88" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">BEFORE the data arrived</text>
  <path d="M44 108 q0 -8 8 -8 H338 L356 118 V210 q0 8 -8 8 H52 q-8 0 -8 -8 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M338 100 V118 H356 Z" fill="#F5F8FA" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="60" y="130" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B">Does practising more make me</text>
  <text x="60" y="152" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B">better at free throws?</text>
  <line x1="60" y1="168" x2="340" y2="168" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">signed  R.K.      dated  1 March</text>
  <g transform="translate(325,101) scale(0.4412)">
    <circle cx="34" cy="34" r="31" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="6"/>
    <polyline points="18,36 30,49 52,20" fill="none" stroke="#1B7A4B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="200" y="244" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">60 days collected. Practice came out flat.</text>
  <rect x="80" y="258" width="240" height="78" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="96" cy="294" r="4" fill="#1F6FB2"/>
  <circle cx="120" cy="300" r="4" fill="#1F6FB2"/>
  <circle cx="144" cy="306" r="4" fill="#1F6FB2"/>
  <circle cx="168" cy="294" r="4" fill="#1F6FB2"/>
  <circle cx="192" cy="300" r="4" fill="#1F6FB2"/>
  <circle cx="216" cy="306" r="4" fill="#1F6FB2"/>
  <circle cx="240" cy="294" r="4" fill="#1F6FB2"/>
  <circle cx="264" cy="300" r="4" fill="#1F6FB2"/>
  <circle cx="288" cy="306" r="4" fill="#1F6FB2"/>
  <text x="200" y="352" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">practice minutes  →  no pattern</text>
  <line x1="388" y1="212" x2="412" y2="212" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(412 212) rotate(0.0)"/>
  <rect x="420" y="62" width="360" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="600" y="88" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">AFTER the data was seen</text>
  <path d="M444 108 q0 -8 8 -8 H738 L756 118 V210 q0 8 -8 8 H452 q-8 0 -8 -8 Z" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M738 100 V118 H756 Z" fill="#F5F8FA" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="460" y="130" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B">I investigated free throws and</text>
  <text x="460" y="152" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B">found sleep is the biggest driver.</text>
  <line x1="460" y1="168" x2="740" y2="168" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">signed  ______      dated  ______</text>
  <g transform="translate(725,101) scale(0.4412)">
    <circle cx="34" cy="34" r="31" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="6"/>
    <line x1="20" y1="20" x2="48" y2="48" stroke="#CC2B1D" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="20" x2="20" y2="48" stroke="#CC2B1D" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="600" y="244" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Every number honest. The order was not.</text>
  <rect x="480" y="258" width="240" height="78" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="496" cy="326" r="4" fill="#C42B8C"/>
  <circle cx="520" cy="319" r="4" fill="#C42B8C"/>
  <circle cx="544" cy="312" r="4" fill="#C42B8C"/>
  <circle cx="568" cy="305" r="4" fill="#C42B8C"/>
  <circle cx="592" cy="298" r="4" fill="#C42B8C"/>
  <circle cx="616" cy="291" r="4" fill="#C42B8C"/>
  <circle cx="640" cy="284" r="4" fill="#C42B8C"/>
  <circle cx="664" cy="277" r="4" fill="#C42B8C"/>
  <circle cx="688" cy="270" r="4" fill="#C42B8C"/>
  <text x="600" y="352" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sleep hours  →  a lovely pattern</text>
  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A prediction written after you looked is not a prediction.</text>
</svg>
