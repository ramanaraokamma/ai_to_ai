<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One split. Three models. One table.</title>
  <desc>A deck of 442 rows is cut once into 353 train and 89 test. Three arrows lead to three model boxes: kNN with test R squared 0.430, a depth-5 tree with 0.260 and linear regression with 0.453. All three feed one results table on the right.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One split. Three models. One table.</text>
  <rect x="34" y="108" width="96" height="150" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="34" y1="130" x2="130" y2="130" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="34" y1="152" x2="130" y2="152" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="34" y1="174" x2="130" y2="174" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="34" y1="196" x2="130" y2="196" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="34" y1="218" x2="130" y2="218" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="82" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">353</text>
  <text x="82" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">89</text>
  <line x1="24" y1="226" x2="140" y2="226" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="82" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">442 rows</text>
  <text x="82" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">353 + 89</text>
  <line x1="148" y1="122" x2="236" y2="122" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(236 122) rotate(0)"/>
  <rect x="246" y="92" width="248" height="60" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="370" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">kNN, k = 5</text>
  <text x="370" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">test R² 0.430</text>
  <line x1="504" y1="122" x2="556" y2="122" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(556 122) rotate(0)"/>
  <line x1="148" y1="206" x2="236" y2="206" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(236 206) rotate(0)"/>
  <rect x="246" y="176" width="248" height="60" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="370" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">tree, depth 5</text>
  <text x="370" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">test R² 0.260</text>
  <line x1="504" y1="206" x2="556" y2="206" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(556 206) rotate(0)"/>
  <line x1="148" y1="290" x2="236" y2="290" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(236 290) rotate(0)"/>
  <rect x="246" y="260" width="248" height="60" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="370" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">linear regression</text>
  <text x="370" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">test R² 0.453</text>
  <line x1="504" y1="290" x2="556" y2="290" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(556 290) rotate(0)"/>
  <rect x="566" y="92" width="204" height="228" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="566" y="92" width="204" height="34" fill="#D9EAF9"/>
  <line x1="566" y1="126" x2="770" y2="126" stroke="#14202B" stroke-width="2"/>
  <text x="668" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">one results table</text>
  <line x1="566" y1="166" x2="770" y2="166" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="590" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">kNN</text>
  <text x="750" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0.430</text>
  <line x1="566" y1="206" x2="770" y2="206" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="590" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">tree</text>
  <text x="750" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0.260</text>
  <line x1="566" y1="246" x2="770" y2="246" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="590" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">line</text>
  <text x="750" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0.453</text>
  <text x="668" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the winner is the</text>
  <text x="668" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">highest TEST score</text>
  <text x="400" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Fairness is one sentence: every model saw exactly the same 353 rows.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Split once, at the top of the file, and never again.</text>
</svg>
