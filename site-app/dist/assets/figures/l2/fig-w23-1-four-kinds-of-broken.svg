<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img">
  <title>Real data arrives broken in four ways</title>
  <desc>Four numbered panels. Panel one shows a grid with one empty dashed cell, a hole. Panel two shows a column of ages in quote marks with a badge reading object, text pretending to be numbers. Panel three shows the same row for Bela appearing twice. Panel four shows Blue, blue, BLUE and Blue with a leading space counted as four different houses. Each panel names how you spot the problem and how you fix it.</desc>
