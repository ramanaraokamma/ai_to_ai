  <rect x="300" y="248" width="120" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="420" y="248" width="360" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="20" y="272" width="60" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <text x="50" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="80" y="272" width="130" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="210" y="272" width="90" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="300" y="272" width="120" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="420" y="272" width="360" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="20" y="296" width="60" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <text x="50" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="80" y="296" width="130" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="210" y="296" width="90" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="300" y="296" width="120" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="420" y="296" width="360" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="20" y="320" width="60" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <text x="50" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="80" y="320" width="130" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="210" y="320" width="90" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="300" y="320" width="120" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="420" y="320" width="360" height="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Pairs inside words only, weighted by how often the word occurs; recount after every glue.</text>
