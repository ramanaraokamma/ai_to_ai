<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Adam divides each knob's step by that knob's own gradient size, so both move the same distance</title>
  <desc>Horizontal bars on a log axis of how far each of two knobs moved on the first step, with learning rate 0.1 and gradients 1.0 and 1000.0. Plain SGD moved knob 1 by 0.1 and knob 2 by 100.0, a thousand times further, marked with a cross. Adam moved both knobs by 0.1, marked with ticks.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Adam: a thousand-times-bigger gradient, the same step</text>
  <line x1="260" y1="100" x2="260" y2="306" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="260" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.01</text>
  <line x1="360" y1="100" x2="360" y2="306" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="360" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.1</text>
  <line x1="460" y1="100" x2="460" y2="306" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="560" y1="100" x2="560" y2="306" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="560" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <line x1="660" y1="100" x2="660" y2="306" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="660" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <text x="460" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">distance moved on the first step (log scale)</text>
  <text x="20" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">SGD: the 1000 gradient moves 1000 times further</text>
  <text x="20" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">knob 1  (gradient 1)</text>
  <rect x="260" y="111" width="100" height="22" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="368" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">0.1</text>
  <polyline points="753.7,122 758.2,127 767.2,116.6" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">knob 2  (gradient 1000)</text>
  <rect x="260" y="149" width="400" height="22" rx="4" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="668" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">100.0</text>
  <polyline points="752,152 768,168" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="752,168 768,152" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">Adam: both knobs move the same distance</text>
  <text x="20" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">knob 1  (gradient 1)</text>
  <rect x="260" y="241" width="100" height="22" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="368" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">0.1</text>
  <polyline points="753.7,252 758.2,256.9 767.2,246.6" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">knob 2  (gradient 1000)</text>
  <rect x="260" y="279" width="100" height="22" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="368" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">0.1</text>
  <polyline points="753.7,290 758.2,294.9 767.2,284.6" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Learning rate 0.1; gradients 1.0 and 1000.0 as a (2,) tensor; first step only.</text>
</svg>
