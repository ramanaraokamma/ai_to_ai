<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two routes through the same table</title>
  <desc>Two panels side by side. On the left, greedy generation walks the same three words the bus to over and over in a loop. On the right, sampling produces the bus goes to town and stops at a full stop.</desc>
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two routes through the same table</text>
