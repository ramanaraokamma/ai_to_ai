<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank page: draw each row's gap and twice-the-spread bars to one scale and write the verdict</title>
  <desc>A blank fill-in figure with three rows: dropout 0.3 (0.043 plus or minus 0.013), norm batch (0.024 plus or minus 0.005) and schedule step (0.033 plus or minus 0.001), against the baseline 0.039 plus or minus 0.008. Each row has two empty tracks on a shared scale from 0 to 0.03, one labelled gap and one labelled twice spread, and an empty dashed box for the verdict. No answers are drawn.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the gap and the threshold</text>
  <text x="24" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="start">baseline 0.039 &#177; 0.008. Bars start at the left edge and share one scale.</text>
  <text x="612" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">verdict</text>
  <line x1="236" y1="108" x2="236" y2="304" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="236" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="356" y1="108" x2="356" y2="304" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="356" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.01</text>
  <line x1="476" y1="108" x2="476" y2="304" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="476" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.02</text>
  <line x1="596" y1="108" x2="596" y2="304" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="596" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.03</text>
  <text x="416" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">loss difference (scale 0 to 0.03)</text>
  <text x="24" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">dropout 0.3</text>
  <text x="24" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">0.043 &#177; 0.013</text>
  <text x="226" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">gap</text>
  <rect x="236" y="114" width="360" height="20" rx="4" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="226" y="159" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">2 &#215; spread</text>
  <rect x="236" y="146" width="360" height="20" rx="4" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <rect x="612" y="120" width="168" height="38" rx="8" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="24" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">norm batch</text>
  <text x="24" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">0.024 &#177; 0.005</text>
  <text x="226" y="191" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">gap</text>
  <rect x="236" y="178" width="360" height="20" rx="4" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="226" y="223" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">2 &#215; spread</text>
  <rect x="236" y="210" width="360" height="20" rx="4" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <rect x="612" y="184" width="168" height="38" rx="8" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="24" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">schedule step</text>
  <text x="24" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">0.033 &#177; 0.001</text>
  <text x="226" y="255" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">gap</text>
  <rect x="236" y="242" width="360" height="20" rx="4" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="226" y="287" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">2 &#215; spread</text>
  <rect x="236" y="274" width="360" height="20" rx="4" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <rect x="612" y="248" width="168" height="38" rx="8" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Draw |gap| and twice the larger spread, then write the verdict in the dashed box.</text>
</svg>
