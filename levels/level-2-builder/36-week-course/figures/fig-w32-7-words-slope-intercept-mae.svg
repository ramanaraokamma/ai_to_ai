<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five new words for Week 32</title>
  <desc>Five small icons in a row. A sliding scale with a pointer anywhere along it rather than three fixed boxes, labelled regression, the answer is a number on a sliding scale. A step triangle under a rising line, one across and three point six up, labelled slope, change in y for one step in x. A line crossing the vertical axis at a marked height above zero, labelled intercept, what the line says at x equals zero. Six upright bars of different heights all standing on a baseline, averaged into one bar, labelled mean absolute error, the average size of the misses in real units. And two piles of squared error, a tall one for guessing the average and a short one for the line, labelled R-squared, how much better than guessing the average.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five new words for Week 32</text>
  <line x1="40" y1="150" x2="160" y2="150" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="142" x2="40" y2="158" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="142" x2="160" y2="158" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="118" cy="150" r="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="40" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="160" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <text x="118" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2" text-anchor="middle">63.8</text>
  <text x="100" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2" text-anchor="middle">regression</text>
  <text x="100" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the answer is a number</text>
  <text x="100" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">on a sliding scale</text>
  <line x1="196" y1="104" x2="196" y2="182" stroke="#14202B" stroke-width="2"/>
  <line x1="196" y1="182" x2="292" y2="182" stroke="#14202B" stroke-width="2"/>
  <path d="M204 172 L286 110" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="234,150 262,150 262,129" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">1 hour</text>
  <text x="270" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="start" dominant-baseline="central">3.6</text>
  <text x="244" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#6D28D9" text-anchor="middle">slope</text>
  <text x="244" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">marks gained for</text>
  <text x="244" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">ONE extra hour</text>
  <line x1="336" y1="104" x2="336" y2="182" stroke="#14202B" stroke-width="2"/>
  <line x1="336" y1="182" x2="432" y2="182" stroke="#14202B" stroke-width="2"/>
  <path d="M336 156 L426 110" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="336" cy="156" r="7" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="330" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="end" dominant-baseline="central">49.4</text>
  <text x="336" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">x = 0</text>
  <text x="392" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#6D28D9" text-anchor="middle">intercept</text>
  <text x="392" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">what the line says</text>
  <text x="392" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">at zero. Machinery,</text>
  <text x="392" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">not a measured fact.</text>
  <line x1="470" y1="182" x2="588" y2="182" stroke="#14202B" stroke-width="2"/>
  <rect x="478" y="132" width="12" height="50" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <rect x="496" y="148" width="12" height="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <rect x="514" y="154" width="12" height="28" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <rect x="532" y="170" width="12" height="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <rect x="550" y="176" width="12" height="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <rect x="568" y="152" width="12" height="30" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <line x1="470" y1="155" x2="588" y2="155" stroke="#1B7A4B" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="529" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">average height = 2.67</text>
  <text x="529" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="middle">mean absolute error</text>
  <text x="529" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the average size of</text>
  <text x="529" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the misses. In marks.</text>
  <line x1="628" y1="182" x2="760" y2="182" stroke="#14202B" stroke-width="2"/>
  <rect x="644" y="104" width="42" height="78" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="706" y="167" width="42" height="15" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="665" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#845F00" text-anchor="middle">guess the</text>
  <text x="665" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#845F00" text-anchor="middle">average: 282</text>
  <text x="727" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle">the line:</text>
  <text x="727" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle">55.2</text>
  <text x="694" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#845F00" text-anchor="middle">R-squared</text>
  <text x="694" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">how much better than</text>
  <text x="694" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">guessing the average.</text>
  <text x="400" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A slope is a sentence with two units in it. An MAE is a number you can say out loud to anybody.</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">R&#178; has no units at all, which is why it is for comparing and not for reporting.</text>
</svg>
