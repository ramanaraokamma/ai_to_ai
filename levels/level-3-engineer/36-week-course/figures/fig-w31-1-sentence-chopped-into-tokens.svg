  <text x="400" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">The pizza was GREAT!!  But the service wasn&#39;t.</text>
