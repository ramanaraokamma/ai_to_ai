<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A three-by-three grid of numbers with a downward arrow labelled axis equals 0 walking down each column producing three answers, and a rightward arrow labelled axis equals 1 walking across each row also producing three answers, with the two answer strips shown separately</title>
  <desc>A three-by-three grid of rainfall numbers, rows labelled City A, B and C and columns labelled Jan, Feb, Mar. Pink arrows point right out of each row into three answer boxes reading 57, 43 and 80, labelled axis equals 1, three answers one per row. Purple arrows point down out of each column into three answer boxes reading 13.3, 41.3 and 5.3, labelled axis equals 0, three answers one per column.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">axis=0 walks DOWN. axis=1 walks ACROSS.</text>
  <text x="256.0" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Jan</text>
  <text x="340.0" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Feb</text>
  <text x="424.0" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Mar</text>
