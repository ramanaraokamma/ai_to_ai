<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 14 words as pictures</title>
  <desc>Three icon cards. Bucketing is a number line cut into three named chunks. Baseline is a low bar next to a tall bar with the gap arrowed. A leaky feature is a card whose one line says the answer out loud.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The three words this lab runs on</text>
  <rect x="30" y="70" width="235" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="282" y="70" width="235" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="534" y="70" width="236" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <line x1="56" y1="150" x2="240" y2="150" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#C42B8C" stroke-width="3" stroke-linecap="round">
    <line x1="117" y1="132" x2="117" y2="168"/>
    <line x1="178" y1="132" x2="178" y2="168"/>
  </g>
  <g fill="#55636F">
    <circle cx="74" cy="150" r="4"/>
    <circle cx="92" cy="150" r="4"/>
    <circle cx="140" cy="150" r="4"/>
    <circle cx="160" cy="150" r="4"/>
    <circle cx="200" cy="150" r="4"/>
    <circle cx="222" cy="150" r="4"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="86" y="192">light</text>
    <text x="148" y="192">medium</text>
    <text x="212" y="192">heavy</text>
  </g>
  <text x="147" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">38 g becomes "medium"</text>
  <text x="147" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">bucketing</text>
  <text x="147" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">easier to read, less precise</text>

  <line x1="310" y1="212" x2="492" y2="212" stroke="#14202B" stroke-width="2"/>
  <rect x="336" y="122" width="42" height="90" fill="#1F6FB2"/>
  <rect x="424" y="196" width="42" height="16" fill="#845F00"/>
  <text x="357" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">your score</text>
  <text x="445" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">random</text>
  <g stroke="#C42B8C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="400" y1="122" x2="400" y2="196"/>
    <polyline points="394,129 400,122 406,129"/>
    <polyline points="394,189 400,196 406,189"/>
  </g>
  <text x="399" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the gap is the finding</text>
  <text x="399" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">baseline</text>
  <text x="399" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">what nothing-at-all scores</text>

  <rect x="580" y="106" width="144" height="104" rx="10" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="592" y="130">weight_g: 6</text>
    <text x="592" y="150">colour: blue</text>
    <text x="592" y="192">hollow: yes</text>
  </g>
  <rect x="586" y="158" width="132" height="22" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="592" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">used_for_writing: yes</text>
  <text x="652" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">one line names the object</text>
  <text x="652" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">leaky feature</text>
  <text x="652" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">banned from the card front</text>

  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Bucketing is a choice with a cost. A baseline is what makes a score mean anything.</text>
</svg>
