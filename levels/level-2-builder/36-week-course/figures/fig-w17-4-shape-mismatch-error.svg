<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A ragged block is not a shape, so numpy refuses</title>
  <desc>On the left a red-outlined panel showing a block with three cells in its top row and only two in its bottom row, with the missing third cell drawn as a dashed empty square and an arrow pointing at it. On the right a green-outlined panel showing the same block with the missing cell filled in, both rows now three cells long, labelled shape two comma three with a tick.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A ragged block is not a shape</text>
  <rect x="30" y="78" width="348" height="226" rx="12" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="422" y="78" width="348" height="226" rx="12" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(48,92) scale(0.42)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(440,92) scale(0.42)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="104" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">two rows of different lengths</text>
  <text x="496" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">two rows of the same length</text>
  <rect x="96" y="156" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="129.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="162" y="156" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="195.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="228" y="156" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="261.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="96" y="204" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="129.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="162" y="204" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="195.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="228" y="204" width="66" height="48" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="261.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">?</text>
  <line x1="340" y1="228" x2="300" y2="228" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(300 228) rotate(180.0)"/>
  <text x="352" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">nothing</text>
  <text x="352" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">here</text>
  <text x="196" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 across, then 2 across. There is no</text>
  <text x="196" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pair of numbers that describes that.</text>
  <rect x="488" y="156" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="521.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="554" y="156" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="587.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="620" y="156" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="653.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="488" y="204" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="521.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="554" y="204" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="587.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="620" y="204" width="66" height="48" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="653.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="488" y="156" width="198" height="96" fill="none" stroke="#1B7A4B" stroke-width="3"/>
  <text x="587" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">shape (2, 3)</text>
  <text x="587" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 rows, 3 columns, 6 numbers</text>
  <text x="400" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">numpy asks: how many rows, how many columns? A ragged block has no answer, so it stops.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">This error is good news. Count the numbers in every row before you blame numpy.</text>
</svg>
