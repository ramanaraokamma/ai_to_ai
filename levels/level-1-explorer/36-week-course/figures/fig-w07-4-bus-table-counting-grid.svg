<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The bus table with its counting grid filled in</title>
  <desc>On the left, a fourteen row table of day, weather, rain in millimetres and whether the bus was late. The three Monday rows are highlighted. On the right, a counting grid shows Monday late three out of three, not Monday three out of eleven, rain three millimetres or more three out of four, rain under three millimetres three out of ten. A box names the strongest pattern.</desc>
  <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Count the rows. Do not eyeball them.</text>
