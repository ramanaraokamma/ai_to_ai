<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Eight students, four harmless columns</title>
  <desc>A table of eight students with four ordinary columns: year, bus route, lunch choice and which hand they write with. Student five's row is highlighted. Two questions below ask for the smallest number of columns that identifies student five, and one pair of columns that works.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Eight students, four harmless columns</text>
  <text x="250" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">No names. No addresses. Nothing anyone would call private.</text>
  <rect x="60" y="280" width="380" height="40" fill="#F4D5E9" stroke="none"/>
  <path d="M60 92 A12 12 0 0 1 72 80 H428 A12 12 0 0 1 440 92 V120 H60 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="60" y1="160" x2="440" y2="160"/>
    <line x1="60" y1="200" x2="440" y2="200"/>
    <line x1="60" y1="240" x2="440" y2="240"/>
    <line x1="60" y1="280" x2="440" y2="280"/>
    <line x1="60" y1="320" x2="440" y2="320"/>
    <line x1="60" y1="360" x2="440" y2="360"/>
    <line x1="60" y1="400" x2="440" y2="400"/>
    <line x1="136" y1="120" x2="136" y2="440"/>
    <line x1="212" y1="120" x2="212" y2="440"/>
    <line x1="288" y1="120" x2="288" y2="440"/>
    <line x1="364" y1="120" x2="364" y2="440"/>
  </g>
  <line x1="60" y1="120" x2="440" y2="120" stroke="#14202B" stroke-width="3"/>
  <rect x="60" y="80" width="380" height="360" rx="12" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="98" y="106">Who</text>
    <text x="174" y="106">Year</text>
    <text x="250" y="106">Bus</text>
    <text x="326" y="106">Lunch</text>
    <text x="402" y="106">Hand</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="98" y="145">S1</text><text x="174" y="145">7</text><text x="250" y="145">A</text><text x="326" y="145">veg</text><text x="402" y="145">R</text>
    <text x="98" y="185">S2</text><text x="174" y="185">7</text><text x="250" y="185">A</text><text x="326" y="185">non-veg</text><text x="402" y="185">R</text>
    <text x="98" y="225">S3</text><text x="174" y="225">7</text><text x="250" y="225">B</text><text x="326" y="225">veg</text><text x="402" y="225">R</text>
    <text x="98" y="265">S4</text><text x="174" y="265">8</text><text x="250" y="265">A</text><text x="326" y="265">veg</text><text x="402" y="265">L</text>
    <text x="98" y="305">S5</text><text x="174" y="305">8</text><text x="250" y="305">B</text><text x="326" y="305">non-veg</text><text x="402" y="305">L</text>
    <text x="98" y="345">S6</text><text x="174" y="345">8</text><text x="250" y="345">B</text><text x="326" y="345">veg</text><text x="402" y="345">R</text>
    <text x="98" y="385">S7</text><text x="174" y="385">7</text><text x="250" y="385">C</text><text x="326" y="385">non-veg</text><text x="402" y="385">L</text>
    <text x="98" y="425">S8</text><text x="174" y="425">8</text><text x="250" y="425">C</text><text x="326" y="425">veg</text><text x="402" y="425">R</text>
  </g>
  <text x="250" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">The pink row is the person we are trying to find.</text>
  <text x="60" y="522" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Fewest columns that find S5:</text>
  <rect x="330" y="498" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <text x="60" y="576" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">One pair that works:</text>
  <line x1="60" y1="606" x2="440" y2="606" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">A pair that does NOT work:</text>
  <line x1="60" y1="670" x2="440" y2="670" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
