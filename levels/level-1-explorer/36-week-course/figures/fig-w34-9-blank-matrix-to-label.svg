<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Blank confusion matrix to label</title>
  <desc>An empty four by four grid with blank label boxes down the left side and across the top, and two blank lines below for the student to write which direction means what.</desc>
  <text x="250" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label this matrix yourself</text>
  <g stroke="#C7CDD4" stroke-width="1.5" fill="none">
    <rect x="140" y="130" width="80" height="60"/><rect x="220" y="130" width="80" height="60"/><rect x="300" y="130" width="80" height="60"/><rect x="380" y="130" width="80" height="60"/>
    <rect x="140" y="190" width="80" height="60"/><rect x="220" y="190" width="80" height="60"/><rect x="300" y="190" width="80" height="60"/><rect x="380" y="190" width="80" height="60"/>
    <rect x="140" y="250" width="80" height="60"/><rect x="220" y="250" width="80" height="60"/><rect x="300" y="250" width="80" height="60"/><rect x="380" y="250" width="80" height="60"/>
    <rect x="140" y="310" width="80" height="60"/><rect x="220" y="310" width="80" height="60"/><rect x="300" y="310" width="80" height="60"/><rect x="380" y="310" width="80" height="60"/>
  </g>
  <g stroke="#14202B" stroke-width="3" fill="none">
    <rect x="140" y="130" width="320" height="240" rx="8" stroke-linejoin="round"/>
  </g>
  <g stroke="#C42B8C" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <rect x="140" y="88" width="80" height="34" rx="6"/><rect x="220" y="88" width="80" height="34" rx="6"/><rect x="300" y="88" width="80" height="34" rx="6"/><rect x="380" y="88" width="80" height="34" rx="6"/>
    <rect x="42" y="146" width="88" height="28" rx="6"/><rect x="42" y="206" width="88" height="28" rx="6"/><rect x="42" y="266" width="88" height="28" rx="6"/><rect x="42" y="326" width="88" height="28" rx="6"/>
  </g>
  <text x="300" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">write the four class names here</text>
  <text x="86" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and here</text>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="40" y1="416" x2="460" y2="416"/>
    <line x1="40" y1="452" x2="460" y2="452"/>
  </g>
  <text x="40" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Down the side means: ______________________________</text>
  <text x="40" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Across the top means: _____________________________</text>
  <text x="250" y="482" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Then shade the four boxes where the two labels agree.</text>
</svg>
