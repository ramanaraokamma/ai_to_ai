<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img">
  <title>This week&#8217;s five words, drawn</title>
  <desc>Five small pictures. A convolution is a four by four picture with a two by two window outlined on it, an arrow, and one output cell. A kernel or filter is a three by three grid holding 1, 0 and minus 1 in every row. A feature map is a four by four grid whose middle two columns hold 24 and whose outer columns hold 0. Weight sharing is one kernel with lines running out to four window outlines: nine numbers used at all sixteen positions. A channel is three stacked squares seen edge on, and four filters out means four feature maps.</desc>
