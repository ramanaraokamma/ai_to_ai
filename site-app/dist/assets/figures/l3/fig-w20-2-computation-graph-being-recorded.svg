<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The recording, being written as the numbers go forward</title>
  <desc>Five numbered boxes left to right: x times W1 giving 2.20 and 0.15; plus b1 then ReLU, still 2.20 and 0.15; A1 times W2 plus b2 giving 2.20; sigmoid giving 0.90024951; and loss giving 0.10508332. Solid arrows run left to right labelled forward. A dashed pink arrow runs right to left labelled backward, and a callout gives the first line it reads: 0.90024951 minus 1 equals minus 0.09975049, which is then handed back through boxes four, three, two and one.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The recording, being written as the numbers go forward</text>
  <text x="400" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2" text-anchor="middle">FORWARD &#8212; every step writes one line on the receipt</text>
  <rect x="70" y="96" width="122" height="74" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="131" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">x @ W1</text>
  <text x="131" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2.20, 0.15</text>
  <circle cx="82" cy="108" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="82" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <line x1="192" y1="133" x2="214" y2="133" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(214 133) rotate(0.0)"/>
  <rect x="216" y="96" width="122" height="74" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="277" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">+ b1, ReLU</text>
  <text x="277" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2.20, 0.15</text>
  <circle cx="228" cy="108" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="228" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <line x1="338" y1="133" x2="360" y2="133" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(360 133) rotate(0.0)"/>
  <rect x="362" y="96" width="122" height="74" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="423" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">A1 @ W2 + b2</text>
  <text x="423" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2.20</text>
  <circle cx="374" cy="108" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="374" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <line x1="484" y1="133" x2="506" y2="133" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(506 133) rotate(0.0)"/>
  <rect x="508" y="96" width="122" height="74" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="569" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">sigmoid</text>
  <text x="569" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.90024951</text>
  <circle cx="520" cy="108" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="520" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <line x1="630" y1="133" x2="652" y2="133" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(652 133) rotate(0.0)"/>
  <rect x="654" y="96" width="122" height="74" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="715" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">loss</text>
  <text x="715" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.10508332</text>
  <circle cx="666" cy="108" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="666" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="400" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">each box also remembers how to hand its own slope back</text>
  <line x1="716" y1="226" x2="82" y2="226" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(82 226) rotate(180.0)"/>
  <text x="400" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">BACKWARD &#8212; loss.backward() reads the same receipt, last line first</text>
  <rect x="140" y="272" width="520" height="76" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the first line it reads:  0.90024951 &#8722; 1 = &#8722;0.09975049</text>
  <text x="400" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">then it walks left, handing that blame back through boxes 4, 3, 2 and 1</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">You never wrote the accounting rules. You did the shopping and it kept the receipt.</text>
</svg>
