<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Every rung of the ladder, ticked</title>
  <desc>A ladder of twelve rungs between two rails, one rung per three weeks of the year, each ticked. The bottom rung reads print, variables, f-strings and real maths; the top rung reads the capstone, the showcase and this gate.</desc>
<text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Every rung of the ladder, ticked</text>
<line x1="50" y1="92" x2="50" y2="648" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
<line x1="450" y1="92" x2="450" y2="648" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
<rect x="62" y="100" width="376" height="36" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
