<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw the staircase</title>
  <desc>One large empty framed panel for the student's own ROC curve, with a dashed diagonal hint line from the bottom left corner to the top right corner labelled what a coin gets. A panel below lists what a good answer contains: false positive rate along the bottom from 0 to 1 and true positive rate up the side from 0 to 1, ten dots joined left to right, the dot for threshold 0.90 at 0.00 and 0.20, the dot for 0.80 at 0.10 and 0.40, the dot for 0.60 at 0.20 and 0.80, the dot for 0.30 at 0.50 and 1.00, the steep pair at the top left with rise 0.20 over run 0.10 giving 2.0 written beside it, the flat pair from 0.30 down to 0.05 with rise 0.00 over run 0.50 giving 0.0, the dashed diagonal drawn in, and three thresholds ringed with a person's name beside each.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the staircase</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Ten dots off the twenty cards, joined left to right.</text>
  <rect x="30" y="86" width="440" height="300" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">your ROC curve goes here</text>
  <line x1="60" y1="366" x2="440" y2="106" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="60" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">false positive rate &#8594;</text>
  <text x="440" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">the dashed line is a coin</text>
  <rect x="30" y="396" width="440" height="280" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="448" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; fpr across 0 to 1, tpr up 0 to 1, both labelled</text>
  <text x="48" y="471" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; ten dots, threshold written beside each, joined with a ruler</text>
  <text x="48" y="494" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; t 0.90 at (0.00, 0.20)  and  t 0.80 at (0.10, 0.40)</text>
  <text x="48" y="517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; t 0.60 at (0.20, 0.80)  and  t 0.30 at (0.50, 1.00)</text>
  <text x="48" y="540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the steep pair marked: rise 0.20 &#247; run 0.10 = 2.0</text>
  <text x="48" y="563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the flat pair marked: rise 0.00 &#247; run 0.50 = 0.0</text>
  <text x="48" y="586" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the dashed diagonal, corner to corner</text>
  <text x="48" y="609" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; three dots ringed, with a PERSON beside each &#8212; not</text>
  <text x="48" y="632" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">   a reason, a person who has to live with it</text>
  <text x="48" y="655" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the top&#8722;left corner marked &#8216;the impossible dream&#8217;</text>
</svg>
