<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four papers. Each one tests only its own nine weeks.</title>
  <desc>Four coloured blocks across the page, one per term: Term 1 weeks 1 to 9, Term 2 weeks 10 to 18, Term 3 weeks 19 to 27 and Term 4 weeks 28 to 36. An arrow drops from each into a paper card reading 60 minutes, 60 marks, no computer, and when to give it: after week 9, after week 18, after week 27, and in week 36 before the showcase.</desc>
