<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 8</title>
  <desc>An empty framed drawing area split down the middle with a title strip reading Draw one false alarm and one miss, and three small reminder boxes along the bottom for the flag word, the person harmed, and what fixing it would cost.</desc>
  <rect x="24" y="24" width="752" height="300" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: one false alarm, and one miss, with a person in each</text>
  <line x1="400" y1="88" x2="400" y2="304" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">
    <text x="212" y="86">FALSE ALARM</text>
    <text x="588" y="86">MISS</text>
  </g>
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="60" y="342" width="200" height="36" rx="8"/>
    <rect x="300" y="342" width="200" height="36" rx="8"/>
    <rect x="540" y="342" width="200" height="36" rx="8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="60" y="338">what the flag word is</text>
    <text x="300" y="338">who is harmed, by name</text>
    <text x="540" y="338">what fixing it would cost</text>
  </g>
</svg>
