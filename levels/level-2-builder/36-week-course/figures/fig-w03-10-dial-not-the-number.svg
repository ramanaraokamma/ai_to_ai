<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The dial is on the window, not on the number</title>
  <desc>Two mirrored panels. On the wrong side the box named cost_per_slice is believed to hold only one point zero six, which would make sixteen slices come to sixteen pounds ninety-six. On the right the box still holds one point zero six two five and a small pink window beside it shows one point zero six, so sixteen slices still come to exactly seventeen pounds.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The dial is on the window, not on the number</text>
  <line x1="400" y1="74" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <rect x="30" y="74" width="360" height="246" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="410" y="74" width="360" height="246" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="72" cy="110" r="17" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="66.0" y1="104.0" x2="78.0" y2="116.0"/>
    <line x1="78.0" y1="104.0" x2="66.0" y2="116.0"/>
  </g>
  <circle cx="452" cy="110" r="17" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="444.0,111.0 449.5,117.0 461.0,104.0" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Wrong idea</text>
  <text x="478" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Right idea</text>
  <text x="210" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">showing it rounded the number</text>
  <text x="590" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">showing it changed nothing</text>
  <rect x="76" y="162" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="146" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">cost_per_slice</text>
  <rect x="76" y="192" width="268" height="48" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="210" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#55636F" text-anchor="middle" dominant-baseline="central">1.06</text>
  <text x="210" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the wrong idea says the box now</text>
  <text x="210" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">holds 1.06, so 1.06 x 16 = 16.96</text>
  <rect x="96" y="286" width="228" height="26" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="210" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">four pence quietly missing</text>
  <rect x="456" y="162" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="526" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">cost_per_slice</text>
  <rect x="456" y="192" width="268" height="48" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="590" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.0625</text>
  <rect x="620" y="246" width="104" height="26" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="672" y="259" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">window: 1.06</text>
  <line x1="672" y1="240" x2="672" y2="246" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="590" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the box still holds every digit,</text>
  <text x="590" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">so 1.0625 x 16 is exactly 17.0</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Ten-second proof: print it with :.2f, then multiply the variable by 16. You get 17.0, not 16.96.</text>
</svg>
