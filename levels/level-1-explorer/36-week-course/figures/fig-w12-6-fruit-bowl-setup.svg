<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The fruit bowl activity setup</title>
  <desc>A fruit bowl drawn as an oval divided into four quadrants, each holding one apple, one orange and one banana, twelve pieces in all. To the right is a list of five candidate feature cards: colour, mass in grams, length in centimetres, bowl quadrant and sticker says, each with a blank score to be filled in.</desc>
  <text x="400" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The Fruit Bowl Scoreboard: the setup</text>

  <ellipse cx="210" cy="212" rx="152" ry="118" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
  <line x1="210" y1="96" x2="210" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="60" y1="212" x2="360" y2="212" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g>
    <circle cx="115" cy="152" r="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5"/>
    <line x1="115" y1="136" x2="115" y2="128" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="170" cy="148" r="16" fill="#E8C671" stroke="#845F00" stroke-width="2.5"/>
    <circle cx="164" cy="144" r="2" fill="#845F00"/><circle cx="176" cy="150" r="2" fill="#845F00"/><circle cx="168" cy="155" r="2" fill="#845F00"/>
    <path d="M124 182 Q140 200 158 186" fill="none" stroke="#845F00" stroke-width="7" stroke-linecap="round"/>

    <circle cx="252" cy="152" r="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5"/>
    <line x1="252" y1="136" x2="252" y2="128" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="307" cy="148" r="16" fill="#E8C671" stroke="#845F00" stroke-width="2.5"/>
    <circle cx="301" cy="144" r="2" fill="#845F00"/><circle cx="313" cy="150" r="2" fill="#845F00"/><circle cx="305" cy="155" r="2" fill="#845F00"/>
    <path d="M261 182 Q277 200 295 186" fill="none" stroke="#845F00" stroke-width="7" stroke-linecap="round"/>

    <circle cx="115" cy="252" r="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5"/>
    <line x1="115" y1="236" x2="115" y2="228" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="170" cy="250" r="16" fill="#E8C671" stroke="#845F00" stroke-width="2.5"/>
    <circle cx="164" cy="246" r="2" fill="#845F00"/><circle cx="176" cy="252" r="2" fill="#845F00"/><circle cx="168" cy="257" r="2" fill="#845F00"/>
    <path d="M124 286 Q140 304 158 290" fill="none" stroke="#845F00" stroke-width="7" stroke-linecap="round"/>

    <circle cx="252" cy="252" r="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5"/>
    <line x1="252" y1="236" x2="252" y2="228" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="307" cy="250" r="16" fill="#E8C671" stroke="#845F00" stroke-width="2.5"/>
    <circle cx="301" cy="246" r="2" fill="#845F00"/><circle cx="313" cy="252" r="2" fill="#845F00"/><circle cx="305" cy="257" r="2" fill="#845F00"/>
    <path d="M261 286 Q277 304 295 290" fill="none" stroke="#845F00" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="210" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4 quadrants, each with 1 apple, 1 orange, 1 banana</text>

  <text x="400" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Five candidate features</text>
  <g>
    <rect x="400" y="96" width="370" height="38" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <text x="418" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">colour</text>
    <text x="752" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" dominant-baseline="central">score: ___ / 12</text>
    <rect x="400" y="142" width="370" height="38" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <text x="418" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">mass_g</text>
    <text x="752" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" dominant-baseline="central">score: ___ / 12</text>
    <rect x="400" y="188" width="370" height="38" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <text x="418" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">length_cm</text>
    <text x="752" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" dominant-baseline="central">score: ___ / 12</text>
    <rect x="400" y="234" width="370" height="38" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <text x="418" y="253" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">bowl_quadrant</text>
    <text x="752" y="253" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" dominant-baseline="central">score: ___ / 12</text>
    <rect x="400" y="280" width="370" height="38" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <text x="418" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">sticker_says</text>
    <text x="752" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end" dominant-baseline="central">score: ___ / 12</text>
  </g>
  <text x="585" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One of these five is useless. One of them is leaky.</text>

  <text x="400" y="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Write the baseline in a box at the top of the board before scoring anything: 4 of 12 = 33.3%.</text>
</svg>
