<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Six icon cards. Figure is a whole sheet of paper. Axes is one drawing frame ruled onto that sheet. Marker is a hollow dot sitting on every real measurement along a line. Axis label is the words and the units written beside an axis. Savefig is an arrow from the sheet to a file named visits dot png. A sixth card states the rule of the week: a chart with no labels is a decoration.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>

  <rect x="20" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="280" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="540" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="20" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="280" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="540" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 1. figure: the whole sheet -->
  <text x="140" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">figure</text>
  <rect x="70" y="98" width="140" height="88" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="86" y1="118" x2="194" y2="118" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="86" y1="140" x2="194" y2="140" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="86" y1="162" x2="194" y2="162" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="140" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the whole sheet of paper</text>

  <!-- 2. axes: one frame ON the sheet -->
  <text x="400" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">axes</text>
  <rect x="316" y="98" width="168" height="88" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="336" y="110" width="128" height="64" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <line x1="352" y1="120" x2="352" y2="162" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="352" y1="162" x2="450" y2="162" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ONE drawing frame on it</text>

  <!-- 3. marker: a dot on every real point -->
  <text x="660" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">marker</text>
  <line x1="578" y1="106" x2="578" y2="170" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="578" y1="170" x2="746" y2="170" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="596,158 632,140 668,146 704,120 734,110" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="596" cy="158" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="632" cy="140" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="668" cy="146" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="704" cy="120" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="734" cy="110" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="660" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one dot per real measurement</text>

  <!-- 4. axis label: the words AND the units -->
  <text x="140" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">axis label</text>
  <line x1="58" y1="272" x2="58" y2="330" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="330" x2="224" y2="330" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="74" y="338" width="140" height="24" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="144" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Visits (count)</text>
  <text x="42" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle" transform="rotate(-90 42 300)">Week</text>
  <text x="150" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the name AND the units</text>

  <!-- 5. savefig: sheet becomes a file -->
  <text x="400" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">savefig</text>
  <line x1="366" y1="304" x2="410" y2="304" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(414 304) rotate(0)"/>
  <rect x="302" y="278" width="60" height="52" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="332" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">fig</text>
  <path d="M420 278 H472 L494 300 V330 A6 6 0 0 1 488 336 H426 A6 6 0 0 1 420 330 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="457" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">.png</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">writes the picture to disk</text>

  <!-- 6. the rule -->
  <rect x="560" y="248" width="200" height="52" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">no labels</text>
  <text x="660" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">= a decoration</text>
  <rect x="560" y="308" width="200" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">title + both labels</text>
  <text x="660" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">= evidence</text>
  <text x="660" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the rule of the week</text>
</svg>
