<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four new words of Week 16</title>
  <desc>Four picture tiles. Confidence score is three bars adding to one hundred. Margin is the gap between the first and second bar. Class balance is a scale tipping under two hundred, two hundred and eight. The other class is a bin for none of the above.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">The four new words of Week 16</text>

    <rect x="40" y="76" width="165" height="220" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="62" y="106" width="110" height="16" rx="5" fill="#1F6FB2"/>
    <rect x="62" y="130" width="38" height="16" rx="5" fill="#55636F"/>
    <rect x="62" y="154" width="30" height="16" rx="5" fill="#55636F"/>
    <line x1="62" y1="180" x2="172" y2="180" stroke="#14202B" stroke-width="1.5"/>
    <text x="122" y="200" font-size="14" fill="#14202B" text-anchor="middle">= 100</text>
    <text x="122" y="248" font-size="18" fill="#14202B" text-anchor="middle">confidence</text>
    <text x="122" y="272" font-size="18" fill="#14202B" text-anchor="middle">score</text>

    <rect x="225" y="76" width="165" height="220" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <rect x="247" y="112" width="112" height="16" rx="5" fill="#C42B8C"/>
    <rect x="247" y="152" width="40" height="16" rx="5" fill="#55636F"/>
    <line x1="287" y1="140" x2="359" y2="140" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <polyline points="293,134 285,140 293,146" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="353,134 361,140 353,146" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="323" y="196" font-size="14" fill="#55636F" text-anchor="middle">this gap</text>
    <text x="307" y="248" font-size="18" fill="#14202B" text-anchor="middle">margin</text>
    <text x="307" y="272" font-size="18" fill="#14202B" text-anchor="middle">top − second</text>

    <rect x="410" y="76" width="165" height="220" rx="12" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(447,104) scale(0.9)">
      <line x1="50" y1="26" x2="50" y2="80" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 88 L38 80 H62 L68 88 Z" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
      <line x1="14" y1="36" x2="86" y2="16" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="26" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <path d="M0 54 Q14 72 28 54 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <path d="M72 34 Q86 52 100 34 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="492" y="248" font-size="18" fill="#14202B" text-anchor="middle">class</text>
    <text x="492" y="272" font-size="18" fill="#14202B" text-anchor="middle">balance</text>

    <rect x="595" y="76" width="165" height="220" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M640 122 H730 L720 196 H650 Z" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <line x1="632" y1="122" x2="738" y2="122" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
    <text x="685" y="164" font-size="14" fill="#14202B" text-anchor="middle">none of</text>
    <text x="685" y="182" font-size="14" fill="#14202B" text-anchor="middle">the above</text>
    <text x="677" y="248" font-size="18" fill="#14202B" text-anchor="middle">other</text>
    <text x="677" y="272" font-size="18" fill="#14202B" text-anchor="middle">class</text>

    <text x="400" y="344" font-size="14" fill="#55636F" text-anchor="middle">Every one of these four is a number or a box you can point at — not a feeling.</text>
  </g>
</svg>
