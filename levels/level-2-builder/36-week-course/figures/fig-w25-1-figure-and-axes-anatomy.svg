<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One figure, one axes, and the five things you must label</title>
  <desc>A pale sheet labelled figure holds a pink-outlined drawing box labelled axes. Five numbered pink pins mark the title, the y label, the x label, the data marks and the box itself, and a numbered key on the right names each one and the call that puts it there.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One figure, one axes, and the five things you must label</text>
  <rect x="40" y="66" width="490" height="292" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="48" y="74" width="78" height="24" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="87" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">figure</text>
  <rect x="126" y="112" width="374" height="156" rx="6" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <line x1="126" y1="193" x2="500" y2="193" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="126" y1="118" x2="500" y2="118" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="126" y1="112" x2="126" y2="268" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="126" y1="268" x2="500" y2="268" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="118" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="118" y="197" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100</text>
  <text x="118" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">200</text>
  <polyline points="160,238 240,215 320,200 400,163 470,133" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="238" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="240" cy="215" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="320" cy="200" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="400" cy="163" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="470" cy="133" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="160" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="240" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="320" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <text x="400" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <text x="470" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <text x="313" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Library visits kept climbing</text>
  <text x="313" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">School week (1 = start of term)</text>
  <text x="88" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 88 196)">Visits (count)</text>
  <circle cx="150" cy="100" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="150" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <circle cx="88" cy="124" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="88" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <circle cx="150" cy="300" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="150" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <circle cx="176" cy="140" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="176" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <circle cx="512" cy="120" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="512" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="285" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the pale sheet is the figure; the pink box is the axes</text>
  <circle cx="562" cy="92" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="562" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="584" y="89" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The title.</text>
  <text x="584" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">says the finding</text>
  <text x="776" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F6FB2" text-anchor="end" dominant-baseline="central">set_title</text>
  <circle cx="562" cy="144" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="562" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="584" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The y label.</text>
  <text x="584" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what y is + units</text>
  <text x="776" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F6FB2" text-anchor="end" dominant-baseline="central">set_ylabel</text>
  <circle cx="562" cy="196" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="562" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="584" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The x label.</text>
  <text x="584" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what x is + units</text>
  <text x="776" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F6FB2" text-anchor="end" dominant-baseline="central">set_xlabel</text>
  <circle cx="562" cy="248" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="562" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="584" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The marks.</text>
  <text x="584" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the data itself</text>
  <text x="776" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F6FB2" text-anchor="end" dominant-baseline="central">plot</text>
  <circle cx="562" cy="300" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="562" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="584" y="297" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The axes.</text>
  <text x="584" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the box you draw in</text>
  <text x="776" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F6FB2" text-anchor="end" dominant-baseline="central">subplots</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">None of the five is optional. Four of them are words you type.</text>
</svg>
