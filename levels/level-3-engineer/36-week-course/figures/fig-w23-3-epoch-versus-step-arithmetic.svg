<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>One epoch, three ways to count the steps</title>
  <desc>Three panels each arrive at 40. Divide: 1257 divided by 32 is 39.28, rounded up gives 40. Count: the loop body ran 40 times. Ask: the DataLoader reports its length as 40. Underneath, 15 epochs times 40 steps equals 600 optimizer steps.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three ways, one answer: 40</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">if the three disagree, one of them is a bug</text>
  <rect x="40" y="92" width="420" height="84" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B">way 1 &#8212; divide</text>
  <text x="60" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1257 &#247; 32 = 39.28</text>
  <text x="60" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">round UP, never down</text>
  <circle cx="410" cy="134" r="24" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="410" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">40</text>
  <rect x="40" y="188" width="420" height="84" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B">way 2 &#8212; count</text>
  <text x="60" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">add 1 every time round</text>
  <text x="60" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the inner loop</text>
  <circle cx="410" cy="230" r="24" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3"/>
  <text x="410" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">40</text>
  <rect x="40" y="284" width="420" height="84" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B">way 3 &#8212; ask</text>
  <text x="60" y="334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">the DataLoader knows</text>
  <text x="60" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">how many it will hand you</text>
  <circle cx="410" cy="326" r="24" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
  <text x="410" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">40</text>
  <rect x="40" y="388" width="420" height="88" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">15 epochs &#215; 40 steps = 600 steps</text>
  <text x="250" y="444" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">an epoch is a lap of the data;</text>
  <text x="250" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a step is one nudge of the weights</text>
</svg>
