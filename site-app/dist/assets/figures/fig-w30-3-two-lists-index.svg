<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two lists, one number joins them</title>
  <desc>A numbered list of keyword triggers on the left and a numbered list of replies on the right. Row two is highlighted on both sides with an arrow between them, showing that the same index number picks the trigger and its reply.</desc>
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two lists, one number joins them</text>
<text x="140" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" font-weight="600">triggers</text>
<text x="540" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" font-weight="600">replies</text>
<circle cx="52" cy="118" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="52" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="74" y="100" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
<text x="169" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">pineapple</text>
<rect x="316" y="100" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
<text x="326" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">Pineapple on pizza? Delicious.</text>
<circle cx="660" cy="118" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="660" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="52" cy="162" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
<text x="52" y="163" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="74" y="144" width="190" height="36" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="169" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">topping</text>
<rect x="316" y="144" width="320" height="36" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="326" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">Cheese, mushroom, paneer, corn.</text>
<circle cx="660" cy="162" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
<text x="660" y="163" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="268" y1="162" x2="310" y2="162" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(310 162) rotate(0.0)"/>
<circle cx="52" cy="206" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="52" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="74" y="188" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
<text x="169" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">price</text>
<rect x="316" y="188" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
<text x="326" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">Medium 250. Large 400.</text>
<circle cx="660" cy="206" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="660" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
<circle cx="52" cy="250" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="52" y="251" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="74" y="232" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
<text x="169" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">deliver</text>
<rect x="316" y="232" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
<text x="326" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">We deliver within 5 km.</text>
<circle cx="660" cy="250" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="660" y="251" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
<circle cx="52" cy="294" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="52" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
<rect x="74" y="276" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
<text x="169" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">open</text>
<rect x="316" y="276" width="320" height="36" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
<text x="326" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" dominant-baseline="central">Open 11am to 11pm, every day.</text>
<circle cx="660" cy="294" r="13" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
<text x="660" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
<path d="M 690 162 H 726 V 118" fill="none" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="726" y1="130" x2="726" y2="112" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(726 112) rotate(-90.0)"/>
<text x="726" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">i = 2</text>
<rect x="74" y="332" width="562" height="44" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
<text x="355" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">Row 2 of triggers goes with row 2 of replies. That is the whole lookup.</text>
<text x="400" y="394" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">Order matters: the loop stops at the FIRST match, so pineapple must sit above topping.</text>
</svg>
