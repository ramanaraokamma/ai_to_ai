<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A 2 to 16 to 1 network, with every shape written on it</title>
  <desc>Two input circles on the left join five of the sixteen hidden circles in the middle, which join one output circle on the right. Chips over the wire bundles read W1 two by sixteen and W2 sixteen by one. Chips under the columns read 200 by 2, then 200 by 16, then 200 by 1. A callout counts the knobs: 2 times 16 plus 16 plus 16 times 1 plus 1 equals 32 plus 16 plus 16 plus 1, which is 65.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A 2 to 16 to 1 network, with every shape written on it</text>
  <text x="400" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">read it out loud: 200 by 2, times 2 by 16, gives 200 by 16</text>
  <line x1="128" y1="190" x2="366" y2="136" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="190" x2="366" y2="174" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="190" x2="366" y2="212" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="190" x2="366" y2="250" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="190" x2="366" y2="288" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="250" x2="366" y2="136" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="250" x2="366" y2="174" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="250" x2="366" y2="212" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="250" x2="366" y2="250" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="128" y1="250" x2="366" y2="288" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="394" y1="136" x2="630" y2="220" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="394" y1="174" x2="630" y2="220" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="394" y1="212" x2="630" y2="220" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="394" y1="250" x2="630" y2="220" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="394" y1="288" x2="630" y2="220" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="197.0" y="99" width="96" height="26" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/><text x="245" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">W1 (2, 16)</text>
  <rect x="452.0" y="99" width="96" height="26" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/><text x="500" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">W2 (16, 1)</text>
  <circle cx="110" cy="190" r="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="110" cy="250" r="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="380" cy="136" r="14" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="380" cy="174" r="14" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="380" cy="212" r="14" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="380" cy="250" r="14" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="380" cy="288" r="14" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="650" cy="220" r="20" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="440" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">5 of the 16 drawn</text>
  <rect x="69.0" y="331" width="82" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="110" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(200, 2)</text>
  <rect x="334.0" y="331" width="92" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="380" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(200, 16)</text>
  <rect x="609.0" y="331" width="82" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="650" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(200, 1)</text>
  <text x="110" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 features</text>
  <text x="380" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">16 hidden units, then ReLU</text>
  <text x="650" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1 probability</text>
  <rect x="576" y="128" width="204" height="74" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="678" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">knobs to learn:</text>
  <text x="678" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2 &#215; 16 + 16 + 16 &#215; 1 + 1</text>
  <text x="678" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">= 32 + 16 + 16 + 1 = 65</text>
</svg>
