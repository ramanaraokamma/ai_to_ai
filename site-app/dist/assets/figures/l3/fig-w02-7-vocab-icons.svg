<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six words from Week 2, drawn</title>
  <desc>Six labelled tiles. Train slash val slash test: three bars to scale reading 1200, 400 and 400, labelled two cuts three piles, 60 20 20 of 2000. Stratified split: the same three bars, each with an amber portion and the number 0.2875 beside it, and the sum 345 plus 115 plus 115 equals 575, labelled on purpose and not by luck. Baseline: a blue accuracy bar reaching 0.7125 above a dashed pink line at 0.5000 marked the true zero, labelled one model two rulers. DummyClassifier: a box holding strategy equals most_frequent, with said not late 400 times and said late 0 times, labelled it never looks at a feature. ROC-AUC: a 0 to 1 axis with 0.5 marked coin flip and 1.0 marked perfect, labelled 0.5 is nothing not bad. Predicted probability: two columns of a grid, the second highlighted pink, an arrow to the code colon comma one, and 400 by 2 then column 1, labelled a number you can rank.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six words from Week 2, drawn</text>
