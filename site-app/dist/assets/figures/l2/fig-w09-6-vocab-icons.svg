<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's four words as pictures</title>
  <desc>Four icon cards. A function is a named machine holding a block of three lines. Define is a recipe card being written and filed, with a note that nothing runs. Call is a button being pressed three times, with the machine producing output each time. Return is a plate being handed to a waiting box named average, contrasted with a printed answer that lands nowhere.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's four words as pictures</text>

  <rect x="20" y="64" width="182" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="214" y="64" width="182" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="408" y="64" width="182" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="602" y="64" width="178" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>

  <rect x="44" y="112" width="134" height="86" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <rect x="60" y="96" width="102" height="24" rx="6" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="111" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">print_header</text>
  <g stroke="#6D28D9" stroke-width="1.5">
    <line x1="60" y1="142" x2="162" y2="142"/>
    <line x1="60" y1="160" x2="162" y2="160"/>
    <line x1="60" y1="178" x2="134" y2="178"/>
  </g>
  <text x="111" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a named block you</text>
  <text x="111" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">write once and run</text>
  <text x="111" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">whenever you like</text>
  <text x="111" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">function</text>

  <rect x="238" y="102" width="134" height="90" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#845F00" stroke-width="1.5">
    <line x1="254" y1="132" x2="356" y2="132"/>
    <line x1="254" y1="150" x2="356" y2="150"/>
    <line x1="254" y1="168" x2="330" y2="168"/>
  </g>
  <text x="305" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">def name():</text>
  <rect x="252" y="206" width="106" height="26" rx="6" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="305" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">nothing runs</text>
  <text x="305" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">writing it down and</text>
  <text x="305" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">giving it a name</text>
  <text x="305" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">define</text>

  <g stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round">
    <rect x="428" y="100" width="52" height="28" rx="8" fill="#E2F7ED"/>
    <rect x="428" y="136" width="52" height="28" rx="8" fill="#E2F7ED"/>
    <rect x="428" y="172" width="52" height="28" rx="8" fill="#E2F7ED"/>
  </g>
  <text x="454" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">run</text>
  <text x="454" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">run</text>
  <text x="454" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">run</text>
  <g stroke="#14202B" stroke-width="2" stroke-linecap="round">
    <line x1="480" y1="114" x2="512" y2="140"/>
    <line x1="480" y1="150" x2="512" y2="150"/>
    <line x1="480" y1="186" x2="512" y2="160"/>
  </g>
  <rect x="514" y="126" width="56" height="48" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="542" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">one</text>
  <text x="499" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">running it. The</text>
  <text x="499" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">brackets are what</text>
  <text x="499" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">mean &#8220;do it&#8221;</text>
  <text x="499" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">call</text>

  <rect x="620" y="98" width="70" height="34" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="655" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">75.0</text>
  <line x1="690" y1="115" x2="722" y2="115" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(722 115)"/>
  <rect x="724" y="98" width="44" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="746" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">average</text>
  <rect x="620" y="168" width="70" height="34" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="655" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">print</text>
  <line x1="690" y1="185" x2="722" y2="185" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
  <rect x="724" y="168" width="44" height="34" rx="8" fill="none" stroke="#CC2B1D" stroke-width="2" stroke-dasharray="5 5" stroke-linejoin="round"/>
  <text x="746" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">None</text>
  <text x="691" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">hands the value</text>
  <text x="691" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">back to the caller</text>
  <text x="691" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">return</text>

  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two of these are things you write. Two of them are things that happen.</text>
</svg>
