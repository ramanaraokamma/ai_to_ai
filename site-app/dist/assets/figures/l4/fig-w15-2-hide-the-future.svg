<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The causal mask hides later words before the softmax, so changing the last word cannot change earlier answers</title>
  <desc>Left, a 3 by 3 mask for the, cat, sat: row the 1, 0, 0; row cat 1, 1, 0; row sat 1, 1, 1, with the 0 cells struck through. An arrow labelled hide, then softmax leads to the weights, shape (3, 3): the 1.0000, 0, 0; cat 0.3302, 0.6698, 0; sat 0.2483, 0.2483, 0.5035; hidden cells are minus infinity and every row sums to 1. Right, a table for changing only the last word: without the mask all three rows moved; with the mask the and cat stayed and sat moved.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Hide the future: read only the past</text>
