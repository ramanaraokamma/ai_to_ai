<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Counting padding steps makes the loss look about half as big without the model learning a single letter</title>
  <desc>Left panel, bars for the 8 positions of the name uma: the four real steps u, m, a and EOS have surprise 0.6931, 1.3863, 0.2231 and 2.3026, which sum to 4.6051 and average 1.1513 over 4; the four PAD steps are each 0.0202. Right panel, two bars: padding ignored gives 1.1513 (tick), padding counted gives 0.5857 (cross), the same model on the same name. Values from Week 12 block 2 by hand and with F.cross_entropy.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Counting padding flatters the loss</text>
  <rect x="20" y="66" width="500" height="286" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="270" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">One name, uma: 8 positions</text>
  <text x="270" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">surprise per step, probabilities invented for the hand sum</text>
  <line x1="60" y1="300" x2="496" y2="300" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="62" y="258.4" width="42" height="41.6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="83" y="252.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.6931</text>
  <text x="83" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">u</text>
  <rect x="116" y="216.8" width="42" height="83.2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="137" y="210.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1.386</text>
  <text x="137" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">m</text>
  <rect x="170" y="286.6" width="42" height="13.4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="191" y="280.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.2231</text>
  <text x="191" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a</text>
  <rect x="224" y="161.8" width="42" height="138.2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="245" y="155.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2.303</text>
  <text x="245" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">EOS</text>
  <rect x="278" y="298" width="42" height="2" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
  <text x="299" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0202</text>
  <text x="299" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">PAD</text>
  <rect x="332" y="298" width="42" height="2" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
  <text x="353" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0202</text>
  <text x="353" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">PAD</text>
  <rect x="386" y="298" width="42" height="2" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
  <text x="407" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0202</text>
  <text x="407" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">PAD</text>
  <rect x="440" y="298" width="42" height="2" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
  <text x="461" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0202</text>
  <text x="461" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">PAD</text>
  <path d="M62 324 V332 H266 V324" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="167" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">4 real targets: sum 4.6051</text>
  <path d="M278 324 V332 H482 V324" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="383" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4 padding: 0.0202 each</text>
  <rect x="540" y="66" width="240" height="286" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="660" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Average loss</text>
  <text x="660" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">same model, same name</text>
  <line x1="560" y1="300" x2="760" y2="300" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="566" y="230.9" width="84" height="69.1" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="608" y="222.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1.1513</text>
  <g transform="translate(595,238.9) scale(0.26)">
  <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="608" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">ignore PAD</text>
  <text x="608" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sum &#247; 4</text>
  <rect x="668" y="264.9" width="84" height="35.1" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="710" y="256.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.5857</text>
  <g transform="translate(697,272.9) scale(0.26)">
  <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="38" y1="38" x2="62" y2="62" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
    <line x1="62" y1="38" x2="38" y2="62" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  </g>
  </g>
  <text x="710" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">count PAD</text>
  <text x="710" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sum &#247; 8</text>
  <text x="400" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Loss halved, no letter learned: easy PAD steps only dilute the average.</text>
</svg>
