<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two piles that must never be swapped</title>
  <desc>Two boxes well apart. The left box holds ten labelled messages with a magnifying glass over them and is marked studied while writing the rules. The right box holds ten sealed messages and is marked scored once, never used to decide anything. A one-way arrow runs from left to right and a crossed-out arrow runs back.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two piles of messages, two completely different jobs</text>

  <rect x="40" y="76" width="300" height="200" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="460" y="76" width="300" height="200" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>

  <text x="190" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">TRAINING EXAMPLES</text>
  <text x="610" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">FRESH EXAMPLES</text>

  <!-- training : open cards, magnifier over them -->
  <g transform="translate(70,124)">
    <rect x="0" y="0" width="96" height="24" rx="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <rect x="0" y="32" width="96" height="24" rx="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <rect x="0" y="64" width="96" height="24" rx="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
      <text x="8" y="17">message + answer</text>
      <text x="8" y="49">message + answer</text>
      <text x="8" y="81">message + answer</text>
    </g>
  </g>
  <g transform="translate(190,138) scale(0.72)">
    <line x1="60" y1="60" x2="86" y2="86" stroke="#1F6FB2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="42" r="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <path d="M30 36 A14 14 0 0 1 42 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="190" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">10 messages. You stared at them</text>
  <text x="190" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">while writing every rule.</text>

  <!-- fresh : sealed envelope -->
  <g transform="translate(530,126)">
    <rect x="0" y="0" width="160" height="94" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 8 L80 60 L160 8" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <rect x="52" y="46" width="56" height="24" rx="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="80" y="63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">SEALED</text>
    <path d="M20 84 Q34 74 46 84 Q58 94 72 82" fill="none" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M92 84 Q106 74 118 84 Q130 94 142 82" fill="none" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="610" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">10 messages, written before your</text>
  <text x="610" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">rules existed. Scored exactly once.</text>

  <!-- one-way arrow -->
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="352" y1="150" x2="440" y2="150"/>
    <polyline points="430,140 448,150 430,160" fill="none"/>
  </g>
  <text x="400" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">score, once</text>

  <!-- crossed-out return arrow -->
  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="448" y1="212" x2="360" y2="212"/>
    <polyline points="370,202 352,212 370,222" fill="none"/>
    <line x1="386" y1="196" x2="414" y2="228"/>
  </g>
  <text x="400" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">never fix</text>
  <text x="400" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">rules from</text>
  <text x="400" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">these</text>

  <text x="400" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The moment you use the right-hand pile to decide something, it stops being able to test anything.</text>
  <text x="400" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">It has quietly turned into a second training pile, and nothing on the page records that it happened.</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Score on the left pile: 10 out of 10. Score on the right pile: 5 out of 10.</text>
</svg>
