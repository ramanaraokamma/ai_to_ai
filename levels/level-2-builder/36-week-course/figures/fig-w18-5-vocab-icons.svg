<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Five icon cards. Vectorized is one sign held over a whole block of cells instead of a person carrying numbers one at a time. Elementwise is two rows of three cells tied position to position. Broadcasting is a single discount sign applying to every price tag in a shop. Arange is a numbered strip from zero to five built without typing the numbers. Silent success is a program printing an answer with a tick next to the word ran and a cross next to the word right. A sixth cell states the rule of the week.</desc>
