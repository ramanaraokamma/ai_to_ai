<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five kinds of project, and when you are ready</title>
  <desc>Five labelled bars, one per project category, each with the earliest week it makes sense. Measure It Honestly, a number with a baseline and a band, from week 11. Build a Pipeline, one sealed object saved to a file, from week 7. Teach a Network, your own weights trained by you, from week 23. See Inside the Model, a picture of what it learned, from week 29. Real-World Data, words or wine or digits plus a card, from week 33. A side panel says there are ten ideas in each category, fifty in total, that you will do four or five all year, and lists the one, two and three star difficulty marks. Every one of the fifty runs offline.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five kinds of project, and when you are ready</text>
  <rect x="40" y="88" width="480" height="46" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Measure It Honestly</text>
  <text x="58" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a number, a baseline and a band</text>
  <rect x="548" y="98" width="100" height="26" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="598" y="111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">week 11</text>
  <rect x="40" y="144" width="480" height="46" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Build a Pipeline</text>
  <text x="58" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one sealed object, saved to a file</text>
  <rect x="548" y="154" width="100" height="26" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/><text x="598" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">week 7</text>
  <rect x="40" y="200" width="480" height="46" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Teach a Network</text>
  <text x="58" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">your own weights, trained by you</text>
  <rect x="548" y="210" width="100" height="26" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/><text x="598" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">week 23</text>
  <rect x="40" y="256" width="480" height="46" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">See Inside the Model</text>
  <text x="58" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a picture of what it learned</text>
  <rect x="548" y="266" width="100" height="26" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/><text x="598" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">week 29</text>
  <rect x="40" y="312" width="480" height="46" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="58" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Real-World Data</text>
  <text x="58" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">words or wine or digits, and a card</text>
  <rect x="548" y="322" width="100" height="26" rx="12" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/><text x="598" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">week 33</text>
  <rect x="676" y="88" width="100" height="270" rx="10" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="726" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">10 ideas</text>
  <text x="726" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">in each</text>
  <text x="726" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">50 total</text>
  <line x1="690" y1="182" x2="762" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="726" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you will do</text>
  <text x="726" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">four or five</text>
  <text x="726" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">all year</text>
  <text x="726" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#9733;</text>
  <text x="726" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#9733;&#9733;</text>
  <text x="726" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#9733;&#9733;&#9733;</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every one of the fifty runs offline. Nothing here downloads anything.</text>
</svg>
