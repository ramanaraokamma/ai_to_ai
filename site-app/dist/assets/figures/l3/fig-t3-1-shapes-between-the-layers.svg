<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Shapes between the layers of a network</title>
  <desc>Seven stacked layer boxes with the tensor shape printed beside each one, for a batch of 32 eight by eight digit pictures. Input 32 comma 1 comma 8 comma 8; after Conv2d with padding 1, 32 comma 8 comma 8 comma 8; after MaxPool2d 2, 32 comma 8 comma 4 comma 4; after the second Conv2d, 32 comma 16 comma 4 comma 4; after the second pool, 32 comma 16 comma 2 comma 2; after Flatten, 32 comma 64; after Linear 64 to 10, 32 comma 10. A side panel adds 80 plus 1168 plus 650 to give 1898 learnable numbers, and a second panel says 16 times 2 times 2 equals 64, the number that welds the stack to one picture size. The batch size 32 never moves.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Shapes between the layers of a network</text>
  <text x="280" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the Week 26 digit reader, one batch of 32 pictures</text>
  <line x1="180" y1="88" x2="180" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="40" y="86" width="280" height="30" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="54" y="101" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">input pictures</text>
  <text x="336" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(32, 1, 8, 8)</text>
  <rect x="40" y="122" width="280" height="30" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="54" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">Conv2d(1, 8, 3, padding=1)</text>
  <text x="336" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(32, 8, 8, 8)</text>
  <rect x="40" y="158" width="280" height="30" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="54" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">MaxPool2d(2)</text>
  <text x="336" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(32, 8, 4, 4)</text>
  <rect x="40" y="194" width="280" height="30" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="54" y="209" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">Conv2d(8, 16, 3, padding=1)</text>
  <text x="336" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(32, 16, 4, 4)</text>
  <rect x="40" y="230" width="280" height="30" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="54" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">MaxPool2d(2)</text>
  <text x="336" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(32, 16, 2, 2)</text>
  <rect x="40" y="266" width="280" height="30" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="54" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">Flatten()</text>
  <text x="336" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(32, 64)</text>
  <rect x="40" y="302" width="280" height="30" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="54" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">Linear(64, 10)</text>
  <text x="336" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(32, 10)</text>
  <rect x="560" y="86" width="216" height="148" rx="10" fill="#F5F8FA" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="668" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">every learnable number</text>
  <text x="586" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">  80</text>
  <text x="586" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">+1168</text>
  <text x="586" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">+ 650</text>
  <line x1="584" y1="190" x2="690" y2="190" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="586" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B"> 1898</text>
  <rect x="560" y="252" width="216" height="92" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="668" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the number that welds</text>
  <text x="668" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the stack to one size</text>
  <text x="572" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">16&#215;2&#215;2 = 64</text>
  <text x="230" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The 32 never moves.</text>
</svg>
