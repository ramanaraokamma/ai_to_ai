  <rect x="344" y="184" width="68" height="52" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="378" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">50</text>
  <rect x="412" y="184" width="68" height="52" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="446" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">14</text>
  <rect x="480" y="184" width="68" height="52" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="514" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">79</text>
  <rect x="344" y="236" width="68" height="52" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="378" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">51</text>
  <rect x="412" y="236" width="68" height="52" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="446" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">15</text>
  <rect x="480" y="236" width="68" height="52" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
