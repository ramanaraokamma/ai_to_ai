<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Eight minutes, seven stops</title>
  <desc>A vertical eight-minute timeline with seven blocks whose heights match their durations. The question gets 45 seconds, the data 60, the cleaning 75, the charts a full two minutes, the models 90 seconds, what I got wrong 60 and whose data 30.</desc>
<text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Eight minutes, seven stops</text>
<line x1="110" y1="92" x2="110" y2="636" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
<line x1="100" y1="92" x2="120" y2="92" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="97" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0:00</text>
<rect x="140" y="92" width="330" height="45.0" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
<text x="305" y="114.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1. The question</text>
<line x1="100" y1="143.0" x2="120" y2="143.0" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="148.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0:45</text>
<rect x="140" y="143.0" width="330" height="62.0" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
<text x="305" y="174.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2. The data</text>
<line x1="100" y1="211.0" x2="120" y2="211.0" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="216.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1:45</text>
<rect x="140" y="211.0" width="330" height="79.0" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
<text x="305" y="241.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3. The cleaning</text>
<text x="305" y="263.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">three log lines, with reasons</text>
<line x1="100" y1="296.0" x2="120" y2="296.0" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="301.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">3:00</text>
<rect x="140" y="296.0" width="330" height="130.0" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
<text x="305" y="352.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4. The charts</text>
<text x="305" y="374.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">read the five captions as one paragraph</text>
<line x1="100" y1="432.0" x2="120" y2="432.0" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="437.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">5:00</text>
<rect x="140" y="432.0" width="330" height="96.0" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
<text x="305" y="471.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5. The models</text>
<text x="305" y="493.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">baseline first, units every time</text>
<line x1="100" y1="534.0" x2="120" y2="534.0" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="539.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">6:30</text>
<rect x="140" y="534.0" width="330" height="62.0" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
<text x="305" y="565.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">6. What I got wrong</text>
<line x1="100" y1="602.0" x2="120" y2="602.0" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="607.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">7:30</text>
<rect x="140" y="602.0" width="330" height="28.0" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
<text x="305" y="616.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">7. Whose data, what it costs</text>
<line x1="100" y1="636" x2="120" y2="636" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="641" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">8:00</text>
<text x="250" y="656" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The charts get two whole minutes. That is not an accident.</text>
<text x="250" y="674" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The audience may interrupt at any point.</text>
</svg>
