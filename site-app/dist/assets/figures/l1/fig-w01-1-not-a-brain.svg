<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>AI is a job description, not a body</title>
  <desc>Two panels. The left panel, marked wrong, shows a robot imagining a brain. The right panel, marked correct, shows a written rulebook card with three numbered steps that a person wrote down.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">AI is a job description, not a body</text>
    <line x1="400" y1="70" x2="400" y2="300" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <rect x="40" y="70" width="340" height="230" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g transform="translate(150,80) scale(1.3)">
      <circle cx="22" cy="88" r="5" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
      <circle cx="34" cy="76" r="7" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
      <path d="M40 66 C24 66 18 50 30 43 C24 27 44 16 56 25 C64 10 92 14 92 31 C108 34 106 58 90 60 C86 70 64 72 56 66 Z" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g transform="translate(202,102) scale(0.58)">
      <path d="M50 14 C34 14 24 24 24 36 C13 41 12 55 22 62 C22 76 34 87 50 87 C66 87 78 76 78 62 C88 55 87 41 76 36 C76 24 66 14 50 14 Z" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
      <line x1="50" y1="15" x2="50" y2="86" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
      <g fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round">
        <path d="M37 28 C45 33 45 43 37 47"/>
        <path d="M63 28 C55 33 55 43 63 47"/>
        <path d="M35 57 C45 61 45 71 37 75"/>
        <path d="M65 57 C55 61 55 71 63 75"/>
      </g>
    </g>
    <g transform="translate(60,190) scale(0.85)">
      <line x1="50" y1="16" x2="50" y2="7" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="5" r="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <rect x="22" y="16" width="56" height="40" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="38" cy="34" r="5" fill="#14202B"/>
      <circle cx="62" cy="34" r="5" fill="#14202B"/>
      <path d="M40 45 Q50 52 60 45" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <rect x="28" y="60" width="44" height="30" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <line x1="28" y1="68" x2="13" y2="78" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="68" x2="87" y2="78" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="75" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
    </g>
    <g transform="translate(285,215) scale(0.75)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <text x="210" y="328" font-size="18" fill="#14202B" text-anchor="middle">Not this: a machine with a mind</text>

    <rect x="420" y="70" width="340" height="230" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <rect x="448" y="96" width="216" height="178" rx="10" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <line x1="448" y1="128" x2="664" y2="128" stroke="#845F00" stroke-width="3"/>
    <text x="556" y="118" font-size="14" fill="#845F00" text-anchor="middle">THE RULEBOOK</text>
    <g>
      <circle cx="470" cy="152" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="470" y="153" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
      <circle cx="470" cy="192" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="470" y="193" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
      <circle cx="470" cy="232" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
      <text x="470" y="233" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    </g>
    <g font-size="14" fill="#14202B">
      <text x="490" y="157">Read the temperature</text>
      <text x="490" y="197">If below 20, heat</text>
      <text x="490" y="237">Wait, then start again</text>
    </g>
    <g transform="translate(676,100) scale(0.62)">
      <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="50" r="4" fill="#14202B"/>
      <circle cx="60" cy="50" r="4" fill="#14202B"/>
      <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="712" y="162" font-size="12" fill="#55636F" text-anchor="middle">a person</text>
    <text x="712" y="178" font-size="12" fill="#55636F" text-anchor="middle">wrote it</text>
    <g transform="translate(672,204) scale(0.62)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="590" y="328" font-size="18" fill="#14202B" text-anchor="middle">This: steps a person wrote down</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">AI is about the job being done, not about having a body. Most AI has no body at all.</text>
  </g>
</svg>
