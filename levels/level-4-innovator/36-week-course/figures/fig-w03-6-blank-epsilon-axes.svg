<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A blank chart: plot Adam's first step against the size of the gradient and see where epsilon starts to cost</title>
  <desc>Empty axes. The horizontal axis is gradient size from 1e-9 to 1000 with one tick per factor of ten; the vertical axis is the first step from 0 to 0.1 with a dashed line at lr equal to 0.1. Six dotted vertical guides mark the gradients 1000, 1, 1e-3, 1e-6, 1e-8 and 1e-9. No point is plotted.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Blank: Adam's first step against gradient size</text>
  <line x1="90" y1="296" x2="740" y2="296" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="90" y1="245" x2="740" y2="245" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="82" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.025</text>
  <line x1="90" y1="194" x2="740" y2="194" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="82" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.05</text>
  <line x1="90" y1="143" x2="740" y2="143" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="82" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.075</text>
  <line x1="90" y1="92" x2="740" y2="92" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <text x="82" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.1</text>
  <line x1="90" y1="296" x2="90" y2="301" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
