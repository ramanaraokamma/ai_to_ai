  <line x1="500" y1="110" x2="740" y2="110" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="492" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.80</text>
  <rect x="500" y="156.1" width="240" height="94.1" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <line x1="500" y1="203.1" x2="740" y2="203.1" stroke="#14202B" stroke-width="3"/>
  <circle cx="530" cy="208.6" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="530" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <circle cx="575" cy="223.5" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="575" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <circle cx="620" cy="171.2" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="620" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <circle cx="665" cy="136.9" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="665" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
