<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two columns, two rulers</title>
  <desc>Two panels. The left panel, marked wrong, shows distance in kilometres spanning 0.33 to 14.40 as a short bar and driver experience in months spanning 0 to 59 as a bar four times longer, on the same axis. The right panel, marked correct, shows the same order after dividing by each column's typical step: 2.78 minus 3.5263 divided by 2.3016 is minus 0.3243, and 5.00 minus 29.6512 divided by 17.1485 is minus 1.4375, both plotted on one axis running from minus 2 to plus 2.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two columns, two rulers</text>
  <rect x="30" y="68" width="360" height="258" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(46,82) scale(0.42)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
  <text x="96" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Before: the raw numbers</text>
  <line x1="60" y1="200" x2="360" y2="200" stroke="#14202B" stroke-width="2"/>
  <line x1="60" y1="200" x2="60" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="60" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="135" y1="200" x2="135" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="135" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">15</text>
  <line x1="210" y1="200" x2="210" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="210" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">30</text>
  <line x1="285" y1="200" x2="285" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="285" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">45</text>
  <line x1="360" y1="200" x2="360" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="360" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">60</text>
  <rect x="61.65" y="132" width="70.35" height="24" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">distance_km</text>
  <text x="146" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.33 to 14.40</text>
  <rect x="60" y="166" width="295" height="24" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">driver_experience_months</text>
  <text x="206" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0 to 59</text>
  <text x="210" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one step of 1 means a whole</text>
  <text x="210" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">neighbourhood, or one month.</text>
  <text x="210" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">The model cannot tell.</text>
  <rect x="410" y="68" width="360" height="258" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(426,82) scale(0.42)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="476" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">After: divide by typical step</text>
  <line x1="440" y1="200" x2="740" y2="200" stroke="#14202B" stroke-width="2"/>
  <line x1="450" y1="200" x2="450" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="450" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;2</text>
  <line x1="520" y1="200" x2="520" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="520" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;1</text>
  <line x1="590" y1="200" x2="590" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="590" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="660" y1="200" x2="660" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="660" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="730" y1="200" x2="730" y2="206" stroke="#55636F" stroke-width="1.5"/>
  <text x="730" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="590" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">typical steps from average</text>
  <circle cx="567.299" cy="144" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="567.299" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#8722;0.3243</text>
  <text x="440" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">distance_km</text>
  <circle cx="489.375" cy="178" r="6" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <text x="489.375" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#8722;1.4375</text>
  <text x="440" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">driver_experience_months</text>
  <rect x="430" y="250" width="320" height="62" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="444" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">(2.78 &#8722; 3.5263) &#247; 2.3016 = &#8722;0.3243</text>
  <text x="444" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">(5.00 &#8722; 29.6512) &#247; 17.1485 = &#8722;1.4375</text>
  <text x="444" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">same ruler now, so the weights can be compared</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One order, two columns. Only the right-hand pair can be compared.</text>
</svg>
