<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Which numbers did the human type?</title>
  <desc>A terminal window showing five lines of a profile card. A grey brace marks the top two lines as the two answers the human typed. A pink brace marks the bottom three lines as three numbers nobody typed, which the program worked out.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Which numbers did the human type?</text>
  <path d="M40 100 A10 10 0 0 1 50 90 H370 A10 10 0 0 1 380 100 V120 H40 Z" fill="#F5F8FA"/>
  <g fill="none" stroke="#55636F" stroke-width="2"><circle cx="58" cy="105" r="4"/><circle cx="74" cy="105" r="4"/><circle cx="90" cy="105" r="4"/></g>
  <text x="106" y="109" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">Terminal</text>
  <line x1="40" y1="120" x2="380" y2="120" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="58" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Age     : 12 years</text>
  <text x="58" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Height  : 1.52 m</text>
  <text x="58" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">4380 days alive</text>
  <text x="58" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">43800 screen minutes</text>
  <text x="58" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">4.99 ft tall</text>
  <rect x="40" y="90" width="340" height="216" rx="10" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M392 136 H404 V186 H392" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="424" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 424 161)">typed</text>
  <path d="M392 200 H404 V282 H392" fill="none" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="424" y="241" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle" transform="rotate(-90 424 241)">derived</text>
  <rect x="40" y="330" width="196" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="138" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2 answers the human typed</text>
  <rect x="252" y="330" width="208" height="32" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="356" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3 numbers nobody typed</text>
  <text x="250" y="396" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A derived value is one the program worked out for you.</text>
  <text x="250" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nobody typed 4380. The program multiplied 12 by 365.</text>
  <text x="250" y="468" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two answers in. Three new facts out. That is the whole bot.</text>
</svg>
