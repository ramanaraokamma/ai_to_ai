<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four new words of Week 23</title>
  <desc>Four picture tiles. A pixel is one shaded square holding the number one hundred and twenty-eight. Grayscale is a five-step ramp from black to white. Resolution is a grid with arrows labelled twelve across and twelve down. A megapixel is a circle holding one million pixels.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The four new words of Week 23</text><rect x="40" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><rect x="225" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/><rect x="410" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/><rect x="595" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/><rect x="77" y="112" width="90" height="90" fill="#8A9095" stroke="#1F6FB2" stroke-width="3"/><text x="122" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">128</text><text x="122" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one square,</text><text x="122" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one number</text><rect x="247" y="120" width="24" height="76" fill="#14202B" stroke="#14202B" stroke-width="1.5"/><rect x="271" y="120" width="24" height="76" fill="#4F5860" stroke="#14202B" stroke-width="1.5"/><rect x="295" y="120" width="24" height="76" fill="#8A9095" stroke="#14202B" stroke-width="1.5"/><rect x="319" y="120" width="24" height="76" fill="#C5C8CB" stroke="#14202B" stroke-width="1.5"/><rect x="343" y="120" width="24" height="76" fill="#FFFFFF" stroke="#14202B" stroke-width="1.5"/><text x="307" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0 = black</text><text x="307" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">255 = white</text><rect x="456" y="122" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="474" y="122" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="492" y="122" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="510" y="122" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="456" y="140" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="474" y="140" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="492" y="140" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="510" y="140" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="456" y="158" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="474" y="158" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="492" y="158" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="510" y="158" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="456" y="176" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="474" y="176" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="492" y="176" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><rect x="510" y="176" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="1.5"/><text x="492" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">12 across</text><text x="444" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 444 162)">12 down</text><text x="492" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">12 x 12 = 144</text><circle cx="677" cy="156" r="46" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="677" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1 000 000</text><text x="677" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">pixels</text><text x="677" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">“mega” means</text><text x="677" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one million</text><text x="122.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">pixel</text><text x="307.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">grayscale</text><text x="492.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">resolution</text><text x="677.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">megapixel</text><text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every photo you have ever taken is made of the first one, measured by the third one.</text>
  </g>
</svg>
