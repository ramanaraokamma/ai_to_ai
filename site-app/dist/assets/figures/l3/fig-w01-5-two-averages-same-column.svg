<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Two averages, one column</title>
  <desc>A block of twenty cells standing for the driver experience column, two of them marked as empty. Below, two boxes. The green box is what pandas gives you: 56693 divided by 1912 equals 29.6512, because it skipped the holes. The pink box is what you probably meant: 56693 divided by 2020 equals 28.0658, one value per row. The difference, 29.6512 minus 28.0658, is 1.5854 months of experience invented by a division nobody chose, with no error and no warning.</desc>
