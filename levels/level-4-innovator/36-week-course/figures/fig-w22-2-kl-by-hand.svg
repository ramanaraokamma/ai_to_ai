<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>KL divergence is the log-ratio of each outcome, weighted by the new table's own chances, then added</title>
  <desc>Four outcomes A to D. The reference q gives each 0.25. The policy p1 gives 0.50, 0.25, 0.125, 0.125. The log-ratios ln(p1/q) are plus 0.6931, 0.0000, minus 0.6931, minus 0.6931. Weighted by p1 they become plus 0.3466, 0, minus 0.0866, minus 0.0866, which add to KL 0.1733. A second policy p2 gives KL(p2 to q) 0.4458 while KL(q to p2) is 0.4298, so KL is not symmetric.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">KL: how far p moved from q, weighted by p</text>
