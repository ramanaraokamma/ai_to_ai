  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"><line x1="177" y1="283" x2="191" y2="297"/><line x1="191" y1="283" x2="177" y2="297"/></g>
  <text x="162" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">14</text>
  <rect x="212" y="264" width="56" height="56" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/>
  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"><line x1="233" y1="283" x2="247" y2="297"/><line x1="247" y1="283" x2="233" y2="297"/></g>
  <text x="218" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">15</text>
  <rect x="44" y="96" width="224" height="224" fill="none" stroke="#14202B" stroke-width="3"/>
  <text x="156" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">13 crossed &#183; 3 ticked &#183; 13 + 3 = 16</text>
  <rect x="376" y="92" width="404" height="128" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="392" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">unit 0 after the run:  bias &#8722;14.113</text>
  <text x="392" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">every one of the 200 rows gives z below 0</text>
  <text x="392" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">so ReLU output = 0, for every row</text>
  <text x="392" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">so its slope = 0, for every row</text>
  <text x="392" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">0 slope &#215; any learning rate = 0 change. Ever.</text>
  <rect x="376" y="236" width="404" height="106" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="392" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">all 16 alive, lr 0.5:   test accuracy 0.9350</text>
  <text x="392" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">13 dead, lr 20:         test accuracy 0.8100</text>
  <text x="392" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">2000 more epochs at lr 0.5:  still 13 dead,</text>
  <text x="392" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">test accuracy 0.8050 &#8212; they never came back</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A dead unit is not resting. It is a knob the loss can no longer feel.</text>
</svg>
