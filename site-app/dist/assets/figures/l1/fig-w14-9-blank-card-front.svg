<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank feature card to fill in</title>
  <desc>A blank card drawn front and back. The front has a card number box and five empty feature lines with room for a name and a value. The back has one empty line for the label. Three lettered pointers ask what belongs in each place.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fill in one card, front and back</text>

  <rect x="60" y="70" width="300" height="252" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="60" y1="108" x2="360" y2="108" stroke="#1F6FB2" stroke-width="3"/>
  <text x="76" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">CARD number:</text>
  <line x1="200" y1="98" x2="270" y2="98" stroke="#55636F" stroke-width="1.5"/>
  <text x="330" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">FRONT</text>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="80" y1="146" x2="220" y2="146"/>
    <line x1="240" y1="146" x2="340" y2="146"/>
    <line x1="80" y1="186" x2="220" y2="186"/>
    <line x1="240" y1="186" x2="340" y2="186"/>
    <line x1="80" y1="226" x2="220" y2="226"/>
    <line x1="240" y1="226" x2="340" y2="226"/>
    <line x1="80" y1="266" x2="220" y2="266"/>
    <line x1="240" y1="266" x2="340" y2="266"/>
    <line x1="80" y1="306" x2="220" y2="306"/>
    <line x1="240" y1="306" x2="340" y2="306"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="80" y="138">f1 name</text>
    <text x="240" y="138">value</text>
    <text x="80" y="178">f2 name</text>
    <text x="240" y="178">value</text>
    <text x="80" y="218">f3 name</text>
    <text x="240" y="218">value</text>
    <text x="80" y="258">f4 name</text>
    <text x="240" y="258">value</text>
    <text x="80" y="298">f5 name</text>
    <text x="240" y="298">value</text>
  </g>

  <rect x="440" y="70" width="300" height="252" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <line x1="440" y1="108" x2="740" y2="108" stroke="#6D28D9" stroke-width="3"/>
  <text x="710" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">BACK</text>
  <text x="456" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">the answer, hidden</text>
  <text x="590" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">one word only. Nothing else.</text>
  <line x1="490" y1="220" x2="690" y2="220" stroke="#55636F" stroke-width="1.5"/>
  <text x="590" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">No drawing. No hint. No smiley face.</text>

  <circle cx="88" cy="348" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="88" y="349" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text>
  <text x="112" y="353" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Why must the five names be in the same order on every card?</text>
  <circle cx="488" cy="348" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="488" y="349" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text>
  <text x="512" y="353" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Name one feature you may NOT write here.</text>
</svg>
