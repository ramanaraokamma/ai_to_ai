<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One recurrent cell is reused at every step, passing a note forward that fades</title>
  <desc>Four purple cell boxes in a row, one per word, with the inputs x = 1, 0, 0, 0 above them and the starting note h0 = 0 entering from the left. The notes passed between them are h1 = 0.7616, h2 = 0.3634, h3 = 0.1797 and h4 = 0.0896, and the pre-squash values inside the cells are 1.0000, 0.3808, 0.1817 and 0.0899. A band beneath says the same weights W_xh = 1.0 and W_hh = 0.5 are used in all four boxes. Bars below show the note shrinking. Shapes: x is (1, 4, 1), out is (1, 4, 1), h_n is (1, 1, 1).</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A cell reads one word at a time, with the same weights</text>
