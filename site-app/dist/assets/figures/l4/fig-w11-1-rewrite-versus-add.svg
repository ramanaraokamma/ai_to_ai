<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A memory that is scaled and added to keeps most of step 1 over four steps, a note that is rewritten keeps almost none</title>
  <desc>Two bar panels over four steps for one unit fed the spike 1, 0, 0, 0, each bar a percentage of step 1. Left, the plain RNN note (0.7616, 0.3634, 0.1797, 0.0896): 100%, 47.7%, 23.6%, 11.8%, marked with a cross; slope back three steps 0.1041. Right, the LSTM memory (0.8909, 0.8486, 0.8084, 0.7701): 100%, 95.3%, 90.7%, 86.4%, marked with a tick; slope back three steps 0.8644, the forget dial 0.9526 multiplied three times. Values from Week 11 block 2.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Rewrite loses the past; add keeps it</text>
