<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five kinds of project, and when you are ready for each</title>
  <desc>Five coloured cards side by side. Data Detective, collect it clean it find something, after week 24. Build a Tool, a program somebody actually uses, after week 16. Teach a Machine, X y split fit honest score, after week 30. Test It Honestly, break it measure it admit it, after week 33. Creative Code, make a thing that did not exist, after week 12. A week ruler underneath runs from week 1 to week 36.</desc>
