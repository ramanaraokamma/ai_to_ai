  <rect x="370" y="160" width="52" height="6" rx="3" fill="#55636F"/>
  <line x1="400" y1="192" x2="400" y2="218" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(400 218) rotate(90)"/>
  <rect x="346" y="224" width="108" height="30" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">disk</text>
