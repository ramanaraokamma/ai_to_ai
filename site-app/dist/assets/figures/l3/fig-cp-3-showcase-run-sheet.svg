<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The showcase run sheet, minute by minute</title>
  <desc>A seven-row run sheet for a one-hour showcase. At 0 minutes, doors: laptops shut, one terminal open, projector tested. At 5 minutes, the first talk: 8 minutes then 4 minutes of questions. At 17 minutes, the second talk, the same shape, with the timer visible to the speaker. At 29 minutes, the live run: a new terminal, a cold start, the command-line tool then the service. At 40 minutes, one wrong answer, shown on purpose and explained. At 50 minutes, the model card, with out-of-scope uses read out loud word for word. At 58 minutes, close: one sentence each on the number I am proudest of. A red side panel gives day-of triage: if torch will not import use the saved output file, if the service will not bind change the port to 8001, and if there are no numbers read the log.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The showcase run sheet, minute by minute</text>
  <rect x="30" y="80" width="620" height="34" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0:00</text>
  <text x="112" y="97" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">doors</text>
  <text x="230" y="97" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">laptops shut, one terminal open, projector tested</text>
  <rect x="30" y="120" width="620" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0:05</text>
  <text x="112" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">talk 1</text>
  <text x="230" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">8 minutes, then 4 minutes of questions</text>
  <rect x="30" y="160" width="620" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0:17</text>
  <text x="112" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">talk 2</text>
  <text x="230" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">same shape. the timer is visible to the speaker</text>
  <rect x="30" y="200" width="620" height="34" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0:29</text>
  <text x="112" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">the live run</text>
  <text x="230" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">a NEW terminal, cold start, the CLI, then the service</text>
  <rect x="30" y="240" width="620" height="34" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0:40</text>
  <text x="112" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">one wrong answer</text>
  <text x="230" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">the speaker shows it on purpose, and explains it</text>
  <rect x="30" y="280" width="620" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0:50</text>
  <text x="112" y="297" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">the card</text>
  <text x="230" y="297" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">out-of-scope uses read out loud, word for word</text>
  <rect x="30" y="320" width="620" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0:58</text>
  <text x="112" y="337" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">close</text>
  <text x="230" y="337" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">one sentence each: the number I am proudest of</text>
  <rect x="664" y="80" width="112" height="274" rx="10" fill="#F5F8FA" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="720" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">day-of triage</text>
  <line x1="674" y1="112" x2="766" y2="112" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="674" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">torch won't</text>
  <text x="674" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">import &#8594; use</text>
  <text x="674" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the saved</text>
  <text x="674" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">output file.</text>
  <text x="674" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">service won't</text>
  <text x="674" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">bind &#8594; change</text>
  <text x="674" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the port to</text>
  <text x="674" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">8001.</text>
  <text x="674" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">no numbers &#8594;</text>
  <text x="674" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">read the log.</text>
  <text x="340" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One hour. Two speakers. Every claim run live, in a terminal nobody warmed up.</text>
</svg>
