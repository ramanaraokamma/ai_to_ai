<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the doubling staircase</title>
  <desc>An unlabelled staircase of six steps rising to the right. Each tread has an empty box for the number of situations, and there are two empty boxes underneath for the name of the shape and the rule that makes it.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fill in every empty box</text>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="70" y1="290" x2="740" y2="290"/>
  </g>
  <!-- six steps, doubling heights, unlabelled -->
  <rect x="80" y="278" width="90" height="12" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="180" y="266" width="90" height="24" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="280" y="242" width="90" height="48" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="380" y="194" width="90" height="96" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="480" y="98" width="90" height="192" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="580" y="74" width="90" height="216" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <!-- empty answer boxes on each tread -->
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="92" y="248" width="66" height="26" rx="6"/>
    <rect x="192" y="236" width="66" height="26" rx="6"/>
    <rect x="292" y="212" width="66" height="26" rx="6"/>
    <rect x="392" y="164" width="66" height="26" rx="6"/>
    <rect x="492" y="68" width="66" height="26" rx="6"/>
    <rect x="592" y="44" width="66" height="26" rx="6"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="125" y="308">1 check</text>
    <text x="225" y="308">2 checks</text>
    <text x="325" y="308">3 checks</text>
    <text x="425" y="308">4 checks</text>
    <text x="525" y="308">5 checks</text>
    <text x="625" y="308">6 checks</text>
  </g>
  <text x="60" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 60 200)">situations</text>
  <rect x="80" y="330" width="290" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="86" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">The name of this shape:</text>
  <rect x="420" y="330" width="290" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="426" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">What one more check does:</text>
</svg>
