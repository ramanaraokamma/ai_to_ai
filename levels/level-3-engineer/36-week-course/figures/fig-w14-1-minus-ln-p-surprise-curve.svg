  <line x1="78" y1="414" x2="78" y2="96" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="263" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the probability you gave</text>
