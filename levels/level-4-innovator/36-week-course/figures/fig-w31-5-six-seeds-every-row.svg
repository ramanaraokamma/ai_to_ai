<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Across six seeds each method moves by a few tickets and a different category falls each time</title>
  <desc>A dot chart of tickets right out of 30 on the 15 to 20 axis, one row per seed 0 to 5, with a circle for base, a square for full fine-tuning and a triangle for LoRA, and the numbers printed to the right. Base: 18, 15, 18, 16, 17, 17. Full: 19, 18, 19, 19, 19, 20. LoRA: 19, 19, 18, 19, 18, 18. The categories that fell from base to LoRA by seed: billing minus 0.2; none; greeting minus 0.17 and billing minus 0.2; billing minus 0.2; refund minus 0.14; out of scope minus 0.2. A callout says 5 of 6 seeds flag something.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six seeds, every row kept</text>
