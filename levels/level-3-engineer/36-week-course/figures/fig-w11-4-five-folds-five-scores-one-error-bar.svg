  <text x="454" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 454 205)">ROC AUC</text>
  <text x="750" y="195.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">mean</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">(0.6183 + 0.5909 + 0.6873 + 0.7504 + 0.4954) &#247; 5 = 3.1423 &#247; 5 = 0.6285</text>
  <text x="400" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Report AUC = 0.628 +/&#8722; 0.087, never one number.</text>
