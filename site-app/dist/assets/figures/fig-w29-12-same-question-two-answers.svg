<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Same question, two different answers</title>
  <desc>Two rows. Each shows the same typed prompt tell me a story, then a die showing a different number, then a different output sentence.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same question, two different answers</text>
  <text x="40" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" font-weight="600">FIRST TRY</text>
  <rect x="40" y="96" width="250" height="56" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="165" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">“tell me a story”</text>
  <line x1="296" y1="124" x2="312" y2="124" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="307,117 318,124 307,131" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(322,96) scale(0.94)"><rect x="4" y="4" width="52" height="52" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/><circle cx="18" cy="18" r="4.5" fill="#14202B"/><circle cx="30" cy="30" r="4.5" fill="#14202B"/><circle cx="42" cy="42" r="4.5" fill="#14202B"/></g>
  <line x1="388" y1="124" x2="412" y2="124" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="407,117 418,124 407,131" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="430" y="96" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="595" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">once there was a dog .</text>
  <text x="40" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" font-weight="600">SECOND TRY</text>
  <rect x="40" y="230" width="250" height="56" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="165" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">“tell me a story”</text>
  <line x1="296" y1="258" x2="312" y2="258" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="307,251 318,258 307,265" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(322,230) scale(0.94)"><rect x="4" y="4" width="52" height="52" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="20" r="4.5" fill="#14202B"/><circle cx="40" cy="20" r="4.5" fill="#14202B"/><circle cx="30" cy="30" r="4.5" fill="#14202B"/><circle cx="20" cy="40" r="4.5" fill="#14202B"/><circle cx="40" cy="40" r="4.5" fill="#14202B"/></g>
  <line x1="388" y1="258" x2="412" y2="258" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="407,251 418,258 407,265" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="430" y="230" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="595" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">a boy found a kite .</text>
  <text x="400" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same table. Same prompt. Only the roll changed.</text>
  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">That is sampling: the same bag, drawn from twice.</text>
</svg>
