<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the neuron</title>
  <desc>Eight numbered rows, each showing one step of running a single neuron on the row x equals 1.0, 0.0, 1.0 with weights 0.4, minus 0.7 and 1.2 and a bias of minus 0.5, and an empty dashed pink box where the answer goes. Row 1 is 1.0 times 0.4. Row 2 is 0.0 times minus 0.7. Row 3 is 1.0 times 1.2. Row 4 is the bias b. Row 5 is z, the total of the four numbers above. Rows 6, 7 and 8 are ReLU of z, sigmoid of z and tanh of z. The answers are 0.4, 0.0, 1.2, minus 0.5, z equals 1.10, ReLU 1.100, sigmoid 0.750 and tanh 0.800. A panel at the bottom asks for the shape of w and the shape of a six-row table of three weights, and asks which of the three squashes can return a negative number.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the neuron</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">w = [0.4, &#8722;0.7, 1.2] &#183; b = &#8722;0.5 &#183; x = [1.0, 0.0, 1.0]</text>

  <rect x="30" y="84" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="111" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1.0 &#215; 0.4 =</text>
  <rect x="348" y="97" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="144" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="171" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0.0 &#215; (&#8722;0.7) =</text>
  <rect x="348" y="157" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="204" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="231" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="231" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1.0 &#215; 1.2 =</text>
  <rect x="348" y="217" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="264" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="291" r="13" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <text x="56" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">the bias b =</text>
  <rect x="348" y="277" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="324" width="440" height="54" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="351" r="13" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="56" y="351" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">z = add rows 1&#8211;4 =</text>
  <rect x="348" y="337" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="384" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="411" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="411" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="80" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">ReLU(z) =</text>
  <rect x="348" y="397" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="444" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="471" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="471" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
  <text x="80" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">sigmoid(z) =</text>
  <rect x="348" y="457" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="504" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="531" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="531" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="80" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">tanh(z) =</text>
  <rect x="348" y="517" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="574" width="440" height="102" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Two shapes, and one word</text>
  <text x="48" y="626" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">w.shape = ____________   six rows of three: ____________</text>
  <text x="48" y="652" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Which squash can return a negative number? ____________</text>
  <text x="48" y="670" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Rows first, columns second &#183; one of the three goes below 0</text>
</svg>
