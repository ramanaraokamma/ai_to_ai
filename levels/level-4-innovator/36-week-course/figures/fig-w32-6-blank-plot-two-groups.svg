<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank: plot the sure and unsure groups of Set A as stated against actual and draw each gap to the calibrated line</title>
  <desc>An empty square plot with stated on the horizontal axis and actual on the vertical axis, both from 0 to 1 with a faint grid, and a dashed diagonal line labelled calibrated, said equals delivered. No points are drawn. On the right, instructions to draw a circle for the sure group and a square for the unsure group, and an arrow from each to the diagonal. Three empty write-in boxes ask: above or below the line, more or less than it delivered, and the length of the longer arrow.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Plot the two groups of Set A</text>
  <line x1="90" y1="320" x2="90" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="320" x2="350" y2="320" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="116" y1="320" x2="116" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="294" x2="350" y2="294" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="142" y1="320" x2="142" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="268" x2="350" y2="268" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="168" y1="320" x2="168" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="242" x2="350" y2="242" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="194" y1="320" x2="194" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="216" x2="350" y2="216" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="220" y1="320" x2="220" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="190" x2="350" y2="190" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="246" y1="320" x2="246" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="164" x2="350" y2="164" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="272" y1="320" x2="272" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="138" x2="350" y2="138" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="298" y1="320" x2="298" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="112" x2="350" y2="112" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="324" y1="320" x2="324" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="86" x2="350" y2="86" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="350" y1="320" x2="350" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="60" x2="350" y2="60" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <line x1="90" y1="320" x2="350" y2="320" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="320" x2="90" y2="60" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="82" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="220" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <text x="82" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <text x="350" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="82" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <text x="220" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">stated (mean said)</text>
  <text x="40" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 40 190)">actual (share right)</text>
  <line x1="90" y1="320" x2="350" y2="60" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="8 5" stroke-linecap="round"/>
  <text x="251.2" y="146.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="end" transform="rotate(-45 251.2 146.8)">calibrated: said = delivered</text>
  <rect x="410" y="66" width="366" height="280" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="436" cy="100" r="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="452" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">sure group (p at least 0.8): draw a circle</text>
  <rect x="429" y="127" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="452" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">unsure group (p below 0.8): draw a square</text>
  <text x="430" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">From each point, draw an arrow straight up</text>
  <text x="430" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">or down to the dashed line: its length is the gap.</text>
  <text x="430" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">Both points lie (above / below) the line:</text>
  <rect x="690" y="216" width="80" height="28" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="430" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">So it said (more / less) than it delivered:</text>
  <rect x="690" y="256" width="80" height="28" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="430" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">Length of the longer arrow:</text>
  <rect x="690" y="296" width="80" height="28" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Fill the table on Page 32.2 first, then plot; check against the ANSWERS page.</text>
</svg>
