<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: counting the rows</title>
  <desc>Two panels showing the same four-animal table. The left panel is marked wrong and counts five rows because it counted the header line. The right panel is marked correct and counts four rows because the header is a set of labels, not an animal.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">How many rows are in this table?</text>
  <line x1="400" y1="66" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="24" y="66" width="352" height="266" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="424" y="66" width="352" height="266" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>

  <g transform="translate(40,78) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(440,78) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">"Five rows"</text>
  <text x="490" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">"Four rows"</text>

  <!-- LEFT table: all five lines numbered -->
  <rect x="76" y="120" width="252" height="150" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M76 128 A8 8 0 0 1 84 120 H320 A8 8 0 0 1 328 128 V150 H76 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="76" y1="180" x2="328" y2="180"/>
    <line x1="76" y1="210" x2="328" y2="210"/>
    <line x1="76" y1="240" x2="328" y2="240"/>
    <line x1="216" y1="120" x2="216" y2="270"/>
  </g>
  <line x1="76" y1="150" x2="328" y2="150" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="76" y="120" width="252" height="150" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="88" y="141">animal</text><text x="228" y="141">legs</text>
    <text x="88" y="171">dog</text><text x="228" y="171">4</text>
    <text x="88" y="201">pigeon</text><text x="228" y="201">2</text>
    <text x="88" y="231">spider</text><text x="228" y="231">8</text>
    <text x="88" y="261">bat</text><text x="228" y="261">2</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="end">
    <text x="68" y="141">1</text><text x="68" y="171">2</text><text x="68" y="201">3</text>
    <text x="68" y="231">4</text><text x="68" y="261">5</text>
  </g>
  <text x="200" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Counted the top line</text>
  <text x="200" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">as if it were an animal.</text>

  <!-- RIGHT table: header lifted out -->
  <rect x="476" y="120" width="252" height="30" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="488" y="141">animal</text><text x="628" y="141">legs</text>
  </g>
  <text x="602" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#845F00" text-anchor="middle">HEADER — a set of labels, not data</text>
  <rect x="476" y="180" width="252" height="120" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="476" y1="210" x2="728" y2="210"/>
    <line x1="476" y1="240" x2="728" y2="240"/>
    <line x1="476" y1="270" x2="728" y2="270"/>
    <line x1="616" y1="180" x2="616" y2="300"/>
  </g>
  <rect x="476" y="180" width="252" height="120" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="488" y="201">dog</text><text x="628" y="201">4</text>
    <text x="488" y="231">pigeon</text><text x="628" y="231">2</text>
    <text x="488" y="261">spider</text><text x="628" y="261">8</text>
    <text x="488" y="291">bat</text><text x="628" y="291">2</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="end">
    <text x="468" y="201">1</text><text x="468" y="231">2</text><text x="468" y="261">3</text><text x="468" y="291">4</text>
  </g>
  <text x="602" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Four animals, so four rows.</text>

  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The test: could you put "legs" on a weighing scale? No. So it is not a row.</text>
</svg>
