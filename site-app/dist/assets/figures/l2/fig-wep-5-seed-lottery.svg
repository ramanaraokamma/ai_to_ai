<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same model, ten times, changing only the shuffle</title>
  <desc>Ten bars of test accuracy for random_state 0 to 9, all from the same 100 songs, same k of 5 and same scaling. The values are 0.76, 0.88, 0.88, 0.80, 0.80, 0.96, 0.88, 0.84, 0.76 and 0.68. A panel reports lowest 0.68, highest 0.96, spread 0.28, which is 28 percentage points. A green band concludes that 84 percent is one deal of the cards, not a property of the model.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The same model, ten times, changing only the shuffle</text>
  <text x="400" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same 100 songs. Same k = 5. Same scaling. Only random_state changed.</text>
