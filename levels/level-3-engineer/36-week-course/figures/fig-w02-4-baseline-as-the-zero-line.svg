<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Two rulers, one useless model</title>
  <desc>Two bars on a 0 to 1 axis for the model that always says not late. Its accuracy bar reaches 0.7125 and is labelled sounds respectable. Its ROC-AUC bar reaches only 0.5000 and is labelled learned nothing, with a dashed line marking AUC 0.5 as the true zero. Below: it never says late, so it catches 0 of the 115 late orders; 285 divided by 400 is 0.7125 right, and 0 divided by 115 is 0.0000 caught.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two rulers, one useless model</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the model that always says &#8220;not late&#8221;</text>
  <line x1="120" y1="100" x2="120" y2="340" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="114" y1="340.0" x2="120" y2="340.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="344.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.00</text>
  <line x1="114" y1="280.0" x2="120" y2="280.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="284.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.25</text>
  <line x1="114" y1="220.0" x2="120" y2="220.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="224.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.50</text>
  <line x1="114" y1="160.0" x2="120" y2="160.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="164.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.75</text>
  <line x1="114" y1="100.0" x2="120" y2="100.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="108" y="104.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1.00</text>
  <line x1="120" y1="340" x2="460" y2="340" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="160" y="169.0" width="110" height="171.0" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="215" y="157.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.7125</text>
  <text x="215" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">accuracy</text>
  <text x="215" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">sounds respectable</text>
  <rect x="320" y="220.0" width="110" height="120.0" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="375" y="208.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.5000</text>
  <text x="375" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">ROC-AUC</text>
  <text x="375" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2" text-anchor="middle">learned nothing</text>
  <line x1="130" y1="220.0" x2="450" y2="220.0" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="450" y="212.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">AUC 0.5 is the true zero</text>
  <rect x="30" y="396" width="440" height="84" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="250" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">It never says &#8220;late&#8221;, so it catches 0 of the 115 late orders.</text>
  <text x="250" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">285 &#247; 400 = 0.7125 right, and 0 &#247; 115 = 0.0000 caught.</text>
  <text x="250" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One model. Two rulers. Two completely different stories.</text>
</svg>
