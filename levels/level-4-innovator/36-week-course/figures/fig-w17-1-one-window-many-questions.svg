<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Shifting the window one place gives a next-character answer at every place: 32 windows of 64 is 2,048 questions per step</title>
  <desc>Two rows of 24 character cells. Row x reads ' to school with a book u' and row y reads 'to school with a book un', which is x moved one place left, so each y cell is the character that followed the x cell above it. The second cell is highlighted: t is followed by o. Below, 64 questions per window times 32 windows equals 2,048 questions each step; x and y both have shape (32, 64). The corpus has 6,972 characters and 28 different ones.</desc>
