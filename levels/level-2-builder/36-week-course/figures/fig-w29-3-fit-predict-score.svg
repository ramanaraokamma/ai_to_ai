<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three verbs, and that is the whole model</title>
  <desc>Three panels in a row. In fit, a blue X train block and a pink y train column go into the model, which memorises them. In predict, only a pink X test block of thirty rows goes in and thirty guesses come out, with no answers given. In score, ten marked circles show nine ticks and one cross, giving a score of nought point nine, reported together with the number of rows.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three verbs, and that is the whole model</text>
  <rect x="44" y="90" width="210" height="150" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="149" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1.  fit</text>
  <rect x="66" y="112" width="72" height="54" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="102" y="139" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">X train</text>
  <rect x="150" y="112" width="60" height="54" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="180" y="139" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">y train</text>
  <line x1="149" y1="172" x2="149" y2="196" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(149 196) rotate(90.0)"/>
  <text x="149" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the model memorises</text>
  <text x="149" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">It keeps every training</text>
  <text x="149" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">row. That is all fit does.</text>
  <line x1="266" y1="160" x2="300" y2="160" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(300 160) rotate(0.0)"/>
  <rect x="312" y="90" width="176" height="150" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2.  predict</text>
  <rect x="332" y="112" width="136" height="44" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">X test  (30 rows)</text>
  <line x1="400" y1="162" x2="400" y2="186" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(400 186) rotate(90.0)"/>
  <rect x="332" y="192" width="136" height="34" rx="6" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="209" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">30 guesses</text>
  <text x="400" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">No answers given.</text>
  <text x="400" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">It has to guess.</text>
  <line x1="500" y1="160" x2="534" y2="160" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(534 160) rotate(0.0)"/>
  <rect x="546" y="90" width="210" height="150" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="651" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">3.  score</text>
  <circle cx="581" cy="126" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="574.95,126 579.35,130.4 587.05,119.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="615" cy="126" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="608.95,126 613.35,130.4 621.05,119.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="649" cy="126" r="13" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="643" y1="120" x2="655" y2="132"/>
    <line x1="655" y1="120" x2="643" y2="132"/>
  </g>
  <circle cx="683" cy="126" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="676.95,126 681.35,130.4 689.05,119.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="717" cy="126" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="710.95,126 715.35,130.4 723.05,119.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="581" cy="166" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="574.95,166 579.35,170.4 587.05,159.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="615" cy="166" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="608.95,166 613.35,170.4 621.05,159.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="649" cy="166" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="642.95,166 647.35,170.4 655.05,159.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="683" cy="166" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="676.95,166 681.35,170.4 689.05,159.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="717" cy="166" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="710.95,166 715.35,170.4 723.05,159.95" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="651" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">9 right out of 10</text>
  <text x="651" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">score = 0.90</text>
  <text x="651" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and say: on 30 rows</text>
  <line x1="40" y1="316" x2="760" y2="316" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Swap kNN for any other model in the library and these three lines do not change.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Only fit is allowed to see the answers. predict never gets them.</text>

</svg>
