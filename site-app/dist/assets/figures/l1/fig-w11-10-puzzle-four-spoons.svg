<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four spoons, four measurements each</title>
  <desc>Four spoons drawn in a row: a teaspoon, a dessert spoon, a two-part black measuring spoon and a serving spoon. Under each one is its mass, longest length, number of parts and colour.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four spoons. Which columns do you really need?</text>
  <rect x="24" y="58" width="752" height="200" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- spoon 1 : small, silver -->
  <g transform="translate(70,96)">
    <ellipse cx="30" cy="28" rx="20" ry="15" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <line x1="30" y1="43" x2="30" y2="86" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- spoon 2 : medium, silver -->
  <g transform="translate(240,88)">
    <ellipse cx="30" cy="30" rx="24" ry="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <line x1="30" y1="48" x2="30" y2="112" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- spoon 3 : two parts, black -->
  <g transform="translate(410,90)">
    <ellipse cx="22" cy="30" rx="18" ry="14" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
    <line x1="22" y1="44" x2="22" y2="86" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="66" cy="34" rx="14" ry="11" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
    <line x1="66" y1="45" x2="66" y2="82" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="44" cy="94" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  </g>
  <!-- spoon 4 : big, silver -->
  <g transform="translate(590,80)">
    <ellipse cx="42" cy="34" rx="32" ry="23" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <line x1="42" y1="57" x2="42" y2="134" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="100" y="230">24 g · 13.0 cm</text>
    <text x="100" y="250">1 part · silver</text>
    <text x="270" y="230">41 g · 18.0 cm</text>
    <text x="270" y="250">1 part · silver</text>
    <text x="454" y="230">41 g · 13.0 cm</text>
    <text x="454" y="250">2 parts · black</text>
    <text x="632" y="230">96 g · 27.5 cm</text>
    <text x="632" y="250">1 part · silver</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="100" y="284">teaspoon</text>
    <text x="270" y="284">dessert spoon</text>
    <text x="454" y="284">measuring spoons</text>
    <text x="632" y="284">serving spoon</text>
  </g>
  <text x="400" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Find the smallest set of columns where no two spoons match.</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Careful: one pair of columns looks fine and secretly fails.</text>
</svg>
