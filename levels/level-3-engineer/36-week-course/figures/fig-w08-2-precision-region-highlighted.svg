<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Precision reads down one column</title>
  <desc>The same two by two table of 979, 7, 11 and 3, with a pink outline around the whole predicted-fraud column, whose header now reads predicted fraud, 10. Underneath: 7 plus 3 equals 10 flagged; of the 10 I flagged, 3 were really fraud; and 3 divided by 10 equals 0.3000. A note says 7 of the 10 people flagged did nothing wrong, which is 7 blocked cards in one afternoon.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Precision reads down one column</text>
  <text x="250" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">of everything I flagged, how much was really fraud?</text>
  <text x="200" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">predicted legit</text>
  <text x="340" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">predicted fraud (10)</text>
  <text x="122" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">actual legit</text>
  <text x="122" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">actual fraud</text>
