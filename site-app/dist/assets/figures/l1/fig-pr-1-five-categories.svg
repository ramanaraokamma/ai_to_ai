<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five kinds of project, and when you are ready for each</title>
  <desc>Five numbered category cards in a row. One, Spot the AI, ten ideas, ready after week three, investigate the machines around you. Two, Teach a Machine, ready after week twenty-two, train a real model and measure it. Three, Data Detective, ready after week six, collect data and find something true. Four, Fairness and Ethics, ready after week thirty-one, find who it fails and say so. Five, Creative AI, ready after week twenty-nine, make something brand new.</desc>
