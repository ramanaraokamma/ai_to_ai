<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six words from Week 19, drawn</title>
  <desc>Six labelled tiles. Capacity: one straight segment beside a four-segment zigzag. Piecewise-linear: a zigzag with pink dots on its corners. Dead ReLU: a red circle holding 0, a cross, and the words slope 0. Vanishing gradient: five bars shrinking from tall to almost nothing, labelled 326.7 goes to 0.0005. Decision boundary: four blue circles on one side of a bent line and four green triangles on the other, labelled p equals 0.5. Symmetry: four purple bars all printing 0.204, labelled 16 units equals 1 unit.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six words from Week 19, drawn</text>
  <rect x="30" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">capacity</text>
  <polyline points="50,162 130,126" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="150,166 178,132 206,162 236,124" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">1 bend allowed, or many</text>
  <rect x="287" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="301" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">piecewise-linear</text>
  <polyline points="307,166 349,128 391,158 437,122 487,150" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="349" cy="128" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="391" cy="158" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="437" cy="122" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="301" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">straight bits, joined</text>
  <rect x="544" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="558" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">dead ReLU</text>
  <circle cx="596" cy="144" r="26" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="596" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <line x1="655" y1="135" x2="673" y2="153" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="673" y1="135" x2="655" y2="153" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="694" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">slope 0</text>
  <text x="558" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">0 out, so 0 slope, for ever</text>
  <rect x="30" y="224" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">vanishing gradient</text>
  <rect x="50" y="268" width="26" height="56" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="88" y="294" width="26" height="30" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="126" y="309" width="26" height="15" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
