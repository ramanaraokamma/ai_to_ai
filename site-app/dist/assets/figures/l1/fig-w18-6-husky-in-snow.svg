<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The wolves that were made of snow</title>
  <desc>Three photos. A wolf standing in snow, which the model calls wolf and is right. A husky standing on grass, which the model calls husky and is right. A husky standing in snow, which the model still calls wolf and is wrong. The model learned the snow, not the animal.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">The wolves that were made of snow</text>

    <rect x="40" y="66" width="220" height="240" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="60" y="82" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <rect x="60" y="162" width="180" height="30" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="150" y="182" font-size="12" fill="#55636F" text-anchor="middle">snow</text>
    <g transform="translate(80,100)" stroke="#55636F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="10" y="18" width="64" height="30" rx="15" fill="#F5F8FA"/>
      <path d="M10 24 Q-4 14 2 4" fill="none"/>
      <g stroke="none" fill="#F5F8FA"/>
      <path d="M78 10 L82 -1 L88 8 Z" fill="#F5F8FA"/>
      <path d="M96 8 L102 -1 L104 10 Z" fill="#F5F8FA"/>
      <circle cx="88" cy="22" r="15" fill="#F5F8FA"/>
      <path d="M100 26 L112 30 L100 34" fill="none"/>
      <line x1="22" y1="46" x2="22" y2="62"/>
      <line x1="36" y1="46" x2="36" y2="62"/>
      <line x1="56" y1="46" x2="56" y2="62"/>
      <line x1="68" y1="46" x2="68" y2="62"/>
      <circle cx="90" cy="18" r="2" fill="#14202B" stroke="none"/>
    </g>
    <text x="150" y="216" font-size="16" fill="#14202B" text-anchor="middle">a wolf, in snow</text>
    <text x="150" y="242" font-size="16" fill="#14202B" text-anchor="middle">model says: WOLF</text>
    <g transform="translate(130,254) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="290" y="66" width="220" height="240" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="310" y="82" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <rect x="310" y="162" width="180" height="30" fill="#E8C671" stroke="#845F00" stroke-width="1.5"/>
    <text x="400" y="182" font-size="12" fill="#14202B" text-anchor="middle">grass</text>
    <g transform="translate(330,100)" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="10" y="18" width="64" height="30" rx="15" fill="#E8C671"/>
      <path d="M10 24 Q-4 14 2 4" fill="none"/>
      <path d="M78 10 L82 -1 L88 8 Z" fill="#E8C671"/>
      <path d="M96 8 L102 -1 L104 10 Z" fill="#E8C671"/>
      <circle cx="88" cy="22" r="15" fill="#E8C671"/>
      <path d="M100 26 L112 30 L100 34" fill="none"/>
      <line x1="22" y1="46" x2="22" y2="62"/>
      <line x1="36" y1="46" x2="36" y2="62"/>
      <line x1="56" y1="46" x2="56" y2="62"/>
      <line x1="68" y1="46" x2="68" y2="62"/>
      <circle cx="90" cy="18" r="2" fill="#14202B" stroke="none"/>
    </g>
    <text x="400" y="216" font-size="16" fill="#14202B" text-anchor="middle">a husky, on grass</text>
    <text x="400" y="242" font-size="16" fill="#14202B" text-anchor="middle">model says: HUSKY</text>
    <g transform="translate(380,254) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="540" y="66" width="220" height="240" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <rect x="560" y="82" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
    <rect x="560" y="162" width="180" height="30" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="650" y="182" font-size="12" fill="#55636F" text-anchor="middle">snow</text>
    <g transform="translate(580,100)" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="10" y="18" width="64" height="30" rx="15" fill="#E8C671"/>
      <path d="M10 24 Q-4 14 2 4" fill="none"/>
      <path d="M78 10 L82 -1 L88 8 Z" fill="#E8C671"/>
      <path d="M96 8 L102 -1 L104 10 Z" fill="#E8C671"/>
      <circle cx="88" cy="22" r="15" fill="#E8C671"/>
      <path d="M100 26 L112 30 L100 34" fill="none"/>
      <line x1="22" y1="46" x2="22" y2="62"/>
      <line x1="36" y1="46" x2="36" y2="62"/>
      <line x1="56" y1="46" x2="56" y2="62"/>
      <line x1="68" y1="46" x2="68" y2="62"/>
      <circle cx="90" cy="18" r="2" fill="#14202B" stroke="none"/>
    </g>
    <text x="650" y="216" font-size="16" fill="#14202B" text-anchor="middle">a husky, in snow</text>
    <text x="650" y="242" font-size="16" fill="#14202B" text-anchor="middle">model says: WOLF</text>
    <g transform="translate(630,254) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>

    <text x="400" y="342" font-size="18" fill="#14202B" text-anchor="middle">Every wolf photo had snow in it. Not one husky photo did.</text>
    <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">Nobody wrote that rule. It came from the photos — and a good score hid it.</text>
  </g>
</svg>
