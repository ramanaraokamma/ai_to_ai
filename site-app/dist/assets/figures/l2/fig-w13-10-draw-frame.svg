<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 13</title>
  <desc>An empty framed drawing area titled draw a card for something that is not a cricketer, divided by a dashed line into a left half for the five labels and a right half for the five facts, with three reminder boxes underneath.</desc>
  <rect x="24" y="24" width="752" height="290" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: a card for something that is not a cricketer</text>
  <text x="211" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the five labels you chose (keys)</text>
  <text x="589" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the five facts (values)</text>
  <line x1="400" y1="82" x2="400" y2="300" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="10 6"/>
  <rect x="56" y="104" width="310" height="192" rx="10" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="8 8"/>
  <rect x="434" y="104" width="310" height="192" rx="10" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="8 8"/>
  <text x="60" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what your card describes</text>
  <rect x="60" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the key you would mistype</text>
  <rect x="300" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a key you would not email</text>
  <rect x="540" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
</svg>
