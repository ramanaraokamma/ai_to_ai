<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the two votes</title>
  <desc>Two small charts drawn from the wine sweep. The upper chart plots inertia against k from one to ten, falling steeply and then flattening, with the drop from k equals three and the drop from k equals four both marked and empty dashed boxes for their values and for the division between them. The lower chart plots the mean silhouette against k from two to ten with a single peak and a small meaningless bump near k equals eight, with empty boxes for the peak value, the k it happens at, and whether the bump beats the peak. A closing panel has one box for the chosen k and one for what makes the choice evidence rather than an opinion.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the two votes</text>
  <text x="250" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">178 wines, scaled, k-means with n_init=10, random_state=0</text>
  <rect x="30" y="84" width="440" height="214" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1F6FB2" text-anchor="start">vote 1 &#8212; inertia against k</text>
  <line x1="60" y1="256" x2="380" y2="256" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="256" x2="60" y2="116" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <polyline points="70,129.202 103.333,184.059 136.667,215.976 170,224.116 203.333,230.004 236.667,235.523 270,239.585 303.333,243.89 336.667,246.519 370,250.59" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="70" cy="129.202" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="103.333" cy="184.059" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="136.667" cy="215.976" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="170" cy="224.116" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="203.333" cy="230.004" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="236.667" cy="235.523" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="270" cy="239.585" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="303.333" cy="243.89" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="336.667" cy="246.519" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="370" cy="250.59" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="103.333" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="170" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <text x="236.667" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <text x="303.333" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <text x="370" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <text x="220" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">k</text>
  <line x1="136.667" y1="215.976" x2="170" y2="215.976" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="170" y1="215.976" x2="170" y2="224.116" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="178" y="219.988" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="start">this drop</text>
  <line x1="103.333" y1="184.059" x2="136.667" y2="184.059" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="136.667" y1="184.059" x2="136.667" y2="215.976" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="52.6667" y="199.887" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="start">and this one</text>
  <rect x="30" y="308" width="440" height="84" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">drop into k=3 =</text>
  <rect x="158" y="318" width="78" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="248" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">drop into k=4 =</text>
  <rect x="376" y="318" width="78" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="44" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">the ratio between them =</text>
  <rect x="238" y="358" width="78" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="326" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">so vote 1 says k =</text>
  <rect x="400" y="358" width="54" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="404" width="440" height="190" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#845F00" text-anchor="start">vote 2 &#8212; mean silhouette against k</text>
  <line x1="60" y1="552" x2="380" y2="552" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="552" x2="60" y2="436" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <polyline points="70,459.435 107.5,450.305 145,471.865 182.5,495.57 220,499.2 257.5,530.77 295,520.045 332.5,529.065 370,533.41" fill="none" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="70" cy="459.435" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="107.5" cy="450.305" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="145" cy="471.865" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="182.5" cy="495.57" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="220" cy="499.2" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="257.5" cy="530.77" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="295" cy="520.045" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="332.5" cy="529.065" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <circle cx="370" cy="533.41" r="5" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <text x="70" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="145" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <text x="220" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <text x="295" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <text x="370" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <text x="220" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">k</text>
  <circle cx="107.5" cy="450.305" r="11" fill="none" stroke="#C42B8C" stroke-width="3"/>
  <text x="121.5" y="442.305" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="start">the peak</text>
  <circle cx="295" cy="520.045" r="11" fill="none" stroke="#C42B8C" stroke-width="3"/>
  <text x="279" y="506.045" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="start">a bump</text>
  <rect x="30" y="604" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="628" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">peak value =</text>
  <rect x="140" y="614" width="78" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="230" y="628" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">at k =</text>
  <rect x="280" y="614" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="338" y="628" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">bump wins?</text>
  <rect x="432" y="614" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="44" y="666" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B" text-anchor="start">both votes agree on k =</text>
  <rect x="228" y="652" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="286" y="666" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="start">and THAT is the evidence</text>
</svg>
