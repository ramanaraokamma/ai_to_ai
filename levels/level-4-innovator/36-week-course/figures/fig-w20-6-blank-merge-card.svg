  <rect x="20" y="222" width="60" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="50" y="235" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">merge</text>
  <rect x="80" y="222" width="130" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="145" y="235" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pair glued</text>
  <rect x="210" y="222" width="90" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="255" y="235" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">count</text>
  <rect x="300" y="222" width="120" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="360" y="235" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">new piece</text>
  <rect x="420" y="222" width="360" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
