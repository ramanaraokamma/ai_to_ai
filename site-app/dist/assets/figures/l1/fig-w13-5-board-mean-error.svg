<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The finished board for the fruit weight worked example</title>
  <desc>A board in two halves. The left half lists the average weight of apples, oranges and bananas. The right half lists three new fruits with the predicted weight, the true weight and the error, then the mean error of 7.5 grams.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="20" y="20" width="760" height="360" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="400" y="56" font-size="24" fill="#14202B" text-anchor="middle">What the board looks like at minute 40</text>
    <line x1="398" y1="76" x2="398" y2="360" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <text x="46" y="104" font-size="18" fill="#14202B">STEP 1 &#8212; average weight</text>
    <g font-size="16" fill="#14202B">
      <text x="46" y="140">apple</text>
      <text x="150" y="140">645 &#247; 4 =</text>
      <text x="368" y="140" text-anchor="end" fill="#6D28D9">161.25 g</text>
      <text x="46" y="174">orange</text>
      <text x="150" y="174">790 &#247; 4 =</text>
      <text x="368" y="174" text-anchor="end" fill="#6D28D9">197.5 g</text>
      <text x="46" y="208">banana</text>
      <text x="150" y="208">493 &#247; 4 =</text>
      <text x="368" y="208" text-anchor="end" fill="#6D28D9">123.25 g</text>
    </g>
    <line x1="46" y1="230" x2="368" y2="230" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="258" font-size="14" fill="#55636F">These three numbers ARE the model.</text>
    <text x="46" y="280" font-size="14" fill="#55636F">Nothing else is kept.</text>
    <g transform="translate(280,244) scale(0.9)">
      <path d="M50 14 C34 14 24 24 24 36 C13 41 12 55 22 62 C22 76 34 87 50 87 C66 87 78 76 78 62 C88 55 87 41 76 36 C76 24 66 14 50 14 Z" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
      <line x1="50" y1="15" x2="50" y2="86" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
      <g fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round">
        <path d="M37 28 C45 33 45 43 37 47"/>
        <path d="M63 28 C55 33 55 43 63 47"/>
        <path d="M35 57 C45 61 45 71 37 75"/>
        <path d="M65 57 C55 61 55 71 63 75"/>
      </g>
    </g>

    <text x="422" y="104" font-size="18" fill="#14202B">STEP 2 &#8212; three new fruits</text>
    <g font-size="14" fill="#55636F">
      <text x="422" y="132">fruit</text>
      <text x="576" y="132" text-anchor="end">predicted</text>
      <text x="666" y="132" text-anchor="end">true</text>
      <text x="756" y="132" text-anchor="end">error</text>
    </g>
    <line x1="422" y1="142" x2="756" y2="142" stroke="#1F6FB2" stroke-width="3"/>
    <g font-size="16" fill="#14202B">
      <text x="422" y="170">orange</text>
      <text x="576" y="170" text-anchor="end">197.5</text>
      <text x="666" y="170" text-anchor="end">205</text>
      <text x="756" y="170" text-anchor="end" fill="#CC2B1D">7.5</text>
      <text x="422" y="202">banana</text>
      <text x="576" y="202" text-anchor="end">123.25</text>
      <text x="666" y="202" text-anchor="end">119</text>
      <text x="756" y="202" text-anchor="end" fill="#CC2B1D">4.25</text>
      <text x="422" y="234">apple</text>
      <text x="576" y="234" text-anchor="end">161.25</text>
      <text x="666" y="234" text-anchor="end">172</text>
      <text x="756" y="234" text-anchor="end" fill="#CC2B1D">10.75</text>
    </g>
    <line x1="660" y1="250" x2="756" y2="250" stroke="#14202B" stroke-width="2"/>
    <text x="756" y="276" font-size="16" fill="#14202B" text-anchor="end">total 22.5</text>

    <rect x="422" y="296" width="334" height="52" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="589" y="322" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">mean error = 22.5 &#247; 3 = 7.5 g</text>
  </g>
</svg>
