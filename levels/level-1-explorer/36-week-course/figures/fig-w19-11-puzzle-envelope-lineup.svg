<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The envelope line-up puzzle</title>
  <desc>Five envelopes labelled A to E in a row. A has a signature crossing the flap. B has a signature only in the corner. C has a torn flap. D has a signature crossing the flap but a date after the training date. E has no signature at all.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">The envelope line-up puzzle</text>
    <text x="400" y="66" font-size="14" fill="#55636F" text-anchor="middle">Only one of these five is a test set you could honestly score. Which one?</text>

    <g stroke="#845F00" stroke-width="3" stroke-linejoin="round">
      <rect x="40" y="100" width="120" height="82" rx="8" fill="#E8C671"/>
      <rect x="190" y="100" width="120" height="82" rx="8" fill="#E8C671"/>
      <rect x="490" y="100" width="120" height="82" rx="8" fill="#E8C671"/>
      <rect x="640" y="100" width="120" height="82" rx="8" fill="#E8C671"/>
    </g>
    <rect x="340" y="100" width="120" height="82" rx="8" fill="#E8C671" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

    <g fill="none" stroke="#845F00" stroke-width="3" stroke-linejoin="round">
      <path d="M40 108 L100 148 L160 108"/>
      <path d="M190 108 L250 148 L310 108"/>
      <path d="M490 108 L550 148 L610 108"/>
      <path d="M640 108 L700 148 L760 108"/>
    </g>
    <path d="M340 108 L372 130 L364 112 L400 146 L460 108" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

    <path d="M56 168 Q78 122 100 158 Q118 182 144 132" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
    <path d="M198 172 Q212 160 228 172" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
    <path d="M506 168 Q528 122 550 158 Q568 182 594 132" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>

    <g font-size="24" fill="#14202B" text-anchor="middle">
      <text x="100" y="216">A</text>
      <text x="250" y="216">B</text>
      <text x="400" y="216">C</text>
      <text x="550" y="216">D</text>
      <text x="700" y="216">E</text>
    </g>

    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="100" y="244">signature</text>
      <text x="100" y="262">crosses the flap</text>
      <text x="250" y="244">signature only</text>
      <text x="250" y="262">in the corner</text>
      <text x="400" y="244">flap torn</text>
      <text x="400" y="262">and re-taped</text>
      <text x="550" y="244">signature crosses,</text>
      <text x="550" y="262">but sealed AFTER</text>
      <text x="700" y="244">no signature</text>
      <text x="700" y="262">at all</text>
    </g>

    <g font-size="14" fill="#14202B" text-anchor="middle">
      <text x="100" y="298">sealed 14th</text>
      <text x="250" y="298">sealed 14th</text>
      <text x="400" y="298">sealed 14th</text>
      <text x="550" y="298">sealed 21st</text>
      <text x="700" y="298">sealed 14th</text>
    </g>

    <rect x="40" y="320" width="720" height="52" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="400" y="344" font-size="14" fill="#55636F" text-anchor="middle">The model was trained on the 18th.</text>
    <text x="400" y="364" font-size="14" fill="#55636F" text-anchor="middle">A seal only works if it was closed before training and cannot be opened quietly.</text>
  </g>
</svg>
