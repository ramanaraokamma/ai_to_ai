<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two lines plotted against tree depth: the training error falls smoothly all the way to zero while the test error falls to a minimum at depth five and then climbs back up, with a dashed vertical line at depth five marking where the two curves part company</title>
  <desc>A line chart with max_depth from 1 to 20 along the bottom and mean absolute error up the side. A purple train line falls smoothly from 54.47 to 0.00. A red test line falls from 56.51 to a minimum of 45.94 at depth 5, then climbs back to 54.53 at depth 20. A dashed pink vertical line at depth 5 is labelled they part company here. A red panel reads: a train MAE of 0.00 is a warning, not a result.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Training error falls forever. Test error has a bottom.</text>
