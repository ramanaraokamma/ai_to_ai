<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A patch must stop the attack and keep the legitimate task working</title>
  <desc>Four versions of a stand-in agent, 50 runs each. v0: A1 15 of 50, A2 15 of 50, legitimate save 50 of 50, A1 during the save 15 of 50. Patch 1, strict sandbox: 15, 0, 50, 15. Patch 2, named files only: 0, 0, 50, 0. The bad patch that refuses all writes: 0, 0, 0, 0, so it also stops the legitimate save and is outlined as wrong. Cells are shaded and marked with a tick or a cross.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A zero attack count is not enough to call a patch good</text>
