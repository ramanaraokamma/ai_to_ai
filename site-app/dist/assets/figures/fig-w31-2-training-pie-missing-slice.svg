<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The training data pie with one slice almost invisible</title>
  <desc>A pie chart of 200 training photos. Daylight fills 183 of them. Lamplight is a sliver of 17. Held in a hand and unusual background are zero, so they have no slice at all.</desc>
  <text x="250" y="40" font-size="24" fill="#14202B" text-anchor="middle">200 training photos, counted</text>

  <path d="M250 250 L321.3 129.5 A140 140 0 1 1 250 110 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M250 250 L250 110 A140 140 0 0 1 321.3 129.5 Z" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

  <text x="228" y="252" font-size="18" fill="#14202B" text-anchor="middle">Daylight</text>
  <text x="228" y="276" font-size="18" fill="#14202B" text-anchor="middle">183 photos</text>
  <text x="228" y="298" font-size="14" fill="#55636F" text-anchor="middle">91.5% of the set</text>

  <line x1="300" y1="150" x2="392" y2="104" stroke="#CC2B1D" stroke-width="2" stroke-linecap="round"/>
  <text x="398" y="98" font-size="18" fill="#14202B">Lamplight</text>
  <text x="398" y="120" font-size="18" fill="#14202B">17 photos</text>
  <text x="398" y="140" font-size="14" fill="#55636F">8.5% - the sliver</text>

  <g>
    <circle cx="70" cy="404" r="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round">
      <line x1="63" y1="397" x2="77" y2="411"/>
      <line x1="77" y1="397" x2="63" y2="411"/>
    </g>
    <circle cx="70" cy="446" r="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round">
      <line x1="63" y1="439" x2="77" y2="453"/>
      <line x1="77" y1="439" x2="63" y2="453"/>
    </g>
  </g>
  <text x="96" y="410" font-size="18" fill="#14202B">Held in a hand: 0 photos</text>
  <text x="96" y="452" font-size="18" fill="#14202B">Odd background: 0 photos</text>

  <text x="250" y="482" font-size="14" fill="#55636F" text-anchor="middle">Two of the four conditions have no slice at all. That is the whole story.</text>
</svg>
