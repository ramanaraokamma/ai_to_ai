<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the accuracy bars</title>
  <desc>Four horizontal bars with their percentages printed but their names left blank. Empty boxes on the left wait for labels, and a dashed vertical line has an empty label box underneath it.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">Label the accuracy bars</text>
    <text x="400" y="60" font-size="14" fill="#55636F" text-anchor="middle">Write the name of each bar in the box, and name the dashed line.</text>

    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="200" y1="80" x2="200" y2="308"/>
      <line x1="335" y1="80" x2="335" y2="308"/>
      <line x1="470" y1="80" x2="470" y2="308"/>
      <line x1="605" y1="80" x2="605" y2="308"/>
      <line x1="740" y1="80" x2="740" y2="308"/>
    </g>
    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="200" y="324">0</text>
      <text x="335" y="324">25</text>
      <text x="470" y="324">50</text>
      <text x="605" y="324">75</text>
      <text x="740" y="324">100</text>
    </g>

    <rect x="200" y="92" width="396" height="34" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="612" y="115" font-size="18" fill="#14202B">73.3%</text>
    <rect x="200" y="144" width="540" height="34" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="728" y="167" text-anchor="end" font-size="18" fill="#14202B">100%</text>
    <rect x="200" y="196" width="432" height="34" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="648" y="219" font-size="18" fill="#14202B">80%</text>
    <rect x="200" y="248" width="216" height="34" rx="4" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="432" y="271" font-size="18" fill="#14202B">40%</text>

    <g fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round">
      <rect x="24" y="92" width="160" height="34" rx="8"/>
      <rect x="24" y="144" width="160" height="34" rx="8"/>
      <rect x="24" y="196" width="160" height="34" rx="8"/>
      <rect x="24" y="248" width="160" height="34" rx="8"/>
    </g>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="38" y1="116" x2="170" y2="116"/>
      <line x1="38" y1="168" x2="170" y2="168"/>
      <line x1="38" y1="220" x2="170" y2="220"/>
      <line x1="38" y1="272" x2="170" y2="272"/>
    </g>

    <line x1="380" y1="80" x2="380" y2="308" stroke="#C42B8C" stroke-width="3" stroke-dasharray="10 6" stroke-linecap="round"/>
    <rect x="290" y="340" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <line x1="304" y1="364" x2="456" y2="364" stroke="#C7CDD4" stroke-width="1.5"/>
    <line x1="380" y1="308" x2="380" y2="340" stroke="#C42B8C" stroke-width="2"/>
    <text x="500" y="362" font-size="14" fill="#55636F">this line sits at 33.3% — what is it called?</text>
    <line x1="200" y1="308" x2="740" y2="308" stroke="#14202B" stroke-width="2"/>
  </g>
</svg>
