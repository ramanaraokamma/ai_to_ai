<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Error on a number line</title>
  <desc>A number line in grams from 180 to 220. A purple pin marks the prediction at 197.5 grams and a green pin marks the true weight at 205 grams. A double arrow between them is labelled error equals 7.5 grams.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Error is just the gap</text>

    <text x="360" y="96" font-size="18" fill="#14202B" text-anchor="middle">PREDICTED</text>
    <text x="360" y="118" font-size="18" fill="#14202B" text-anchor="middle">197.5 g</text>
    <line x1="360" y1="130" x2="360" y2="196" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="360" cy="212" r="16" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>

    <text x="480" y="96" font-size="18" fill="#14202B" text-anchor="middle">TRUE</text>
    <text x="480" y="118" font-size="18" fill="#14202B" text-anchor="middle">205 g</text>
    <line x1="480" y1="130" x2="480" y2="196" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
    <path d="M480 196 L492 212 L468 212 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>

    <line x1="60" y1="240" x2="740" y2="240" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#14202B" stroke-width="2" stroke-linecap="round">
      <line x1="80" y1="240" x2="80" y2="256"/>
      <line x1="160" y1="240" x2="160" y2="252"/>
      <line x1="240" y1="240" x2="240" y2="256"/>
      <line x1="320" y1="240" x2="320" y2="252"/>
      <line x1="400" y1="240" x2="400" y2="256"/>
      <line x1="480" y1="240" x2="480" y2="252"/>
      <line x1="560" y1="240" x2="560" y2="256"/>
      <line x1="640" y1="240" x2="640" y2="252"/>
      <line x1="720" y1="240" x2="720" y2="256"/>
    </g>
    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="80" y="274">180</text>
      <text x="240" y="274">190</text>
      <text x="400" y="274">200</text>
      <text x="560" y="274">210</text>
      <text x="720" y="274">220</text>
    </g>
    <text x="400" y="296" font-size="12" fill="#55636F" text-anchor="middle">grams</text>

    <g stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="366" y1="326" x2="474" y2="326"/>
      <polyline points="374,318 362,326 374,334"/>
      <polyline points="466,318 478,326 466,334"/>
    </g>
    <rect x="382" y="308" width="76" height="36" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="420" y="327" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">7.5 g</text>

    <text x="400" y="376" font-size="14" fill="#55636F" text-anchor="middle">error = 205 &#8722; 197.5 = 7.5 g. Always the distance, so never below zero.</text>
  </g>
</svg>
