  <rect x="632" y="236" width="148" height="54" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="706" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">sum</text>
  <text x="706" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">KL = 0.1733</text>
  <text x="400" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.3466 &#8722; 0.0866 &#8722; 0.0866 = 0.1733   (hand sum, matches kl.py)</text>
  <text x="400" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">p2 = 0.70, 0.10, 0.10, 0.10 moves further: KL(p2 || q) = 0.4458, but KL(q || p2) = 0.4298</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Zero only when p = q. Never negative. Not symmetric, so always say which table comes first.</text>
