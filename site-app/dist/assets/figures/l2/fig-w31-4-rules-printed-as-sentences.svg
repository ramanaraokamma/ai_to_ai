<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The printout is the sentence</title>
  <desc>On the left, a panel of four printed lines about petal width, with the third line highlighted. An arrow points right to a green speech box reading: if the petal is wider than 0.80 centimetres, it is not a setosa. Underneath, three printed symbols are matched to the plain words they stand for.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The printout is the sentence</text>
  <path d="M30 90 A10 10 0 0 1 40 80 H370 A10 10 0 0 1 380 90 V110 H30 Z" fill="#F5F8FA"/>
  <line x1="30" y1="110" x2="380" y2="110" stroke="#14202B" stroke-width="2"/>
  <text x="46" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what Python printed</text>
  <rect x="40" y="176" width="330" height="24" rx="4" fill="#F4D5E9"/>
  <text x="48" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">petal width (cm) &lt;= 0.80</text>
  <text x="48" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">    class: 0</text>
  <text x="48" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">petal width (cm) &gt;  0.80</text>
  <text x="48" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">    class: 2</text>
  <rect x="30" y="80" width="350" height="160" rx="10" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="392" y1="188" x2="436" y2="188" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(436 188) rotate(0)"/>
  <rect x="448" y="96" width="322" height="128" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="609" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">“If the petal is wider</text>
  <text x="609" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">than 0.80 cm, it is not</text>
  <text x="609" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">a setosa.”</text>
  <text x="609" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One line of print, one English sentence</text>
  <path d="M486 224 L520 224 L498 248 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="268" width="740" height="66" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="50" y="280" width="132" height="24" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="116" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">&lt;=</text>
  <text x="116" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">is less than or equal to</text>
  <rect x="320" y="280" width="132" height="24" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="386" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">&gt;</text>
  <text x="386" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">is more than</text>
  <rect x="572" y="280" width="132" height="24" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="638" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">class: 0</text>
  <text x="638" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it is a setosa</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">You never explain a tree. You read it out.</text>
</svg>
