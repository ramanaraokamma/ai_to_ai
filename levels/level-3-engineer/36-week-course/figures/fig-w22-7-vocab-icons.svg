<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img">
  <title>This week&#8217;s five words, drawn</title>
  <desc>Five small pictures. nn.Linear is a three by two grid of weights beside a column of three biases. nn.Sequential is three boxes stacked with arrows running down. A logit is a wide block labelled any number above a narrow block labelled 0 to 1. BCEWithLogitsLoss is a box holding two steps inside it, a sigmoid and minus the natural log of p. Dropout is five units in a row with 2 of the 5 crossed out.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week&#8217;s five words, drawn</text>
  <rect x="22" y="58" width="148" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="174" y="58" width="148" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="326" y="58" width="148" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="478" y="58" width="148" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="630" y="58" width="148" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="62" y="74" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <rect x="80" y="74" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <rect x="62" y="92" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <rect x="80" y="92" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <rect x="62" y="110" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <rect x="80" y="110" width="18" height="18" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/>
  <rect x="108" y="74" width="18" height="18" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <rect x="108" y="92" width="18" height="18" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <rect x="108" y="110" width="18" height="18" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <text x="96" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">nn.Linear</text>
  <text x="96" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a grid of weights</text>
  <text x="96" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and one bias each</text>
  <rect x="206" y="72" width="84" height="16" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="206" y="98" width="84" height="16" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="206" y="124" width="84" height="16" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <line x1="248" y1="88" x2="248" y2="88" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polygon points="248,98 242,86 254,86" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="248" y1="114" x2="248" y2="114" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polygon points="248,124 242,112 254,112" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="248" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">nn.Sequential</text>
  <text x="248" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">parts in a list,</text>
  <text x="248" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">top to bottom</text>
