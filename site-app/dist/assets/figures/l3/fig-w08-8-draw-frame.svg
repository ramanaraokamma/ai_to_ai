<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw the two errors</title>
  <desc>A write-in line for the student's chosen application, then two empty framed boxes with ruled writing lines: a red one headed false alarm, meaning I said yes and I was wrong, and a purple one headed miss, meaning I said no and I was wrong. A panel underneath lists what a good answer contains: a name, a place and a time, what the person lost, no abbreviations, which error you would rather cause, an admission of the trade, the observation that one error can cause the other, and the question of how often it happens.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the two errors</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One false alarm, one miss, both about a person.</text>
  <rect x="30" y="86" width="440" height="26" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="46" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">my application: ______________________________</text>
  <rect x="30" y="124" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#CC2B1D">FALSE ALARM &#8212; I said yes and I was wrong</text>
  <line x1="46" y1="176" x2="454" y2="176" stroke="#C7CDD4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="202" x2="454" y2="202" stroke="#C7CDD4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="228" x2="454" y2="228" stroke="#C7CDD4" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="30" y="266" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#6D28D9">MISS &#8212; I said no and I was wrong</text>
  <line x1="46" y1="318" x2="454" y2="318" stroke="#C7CDD4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="344" x2="454" y2="344" stroke="#C7CDD4" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="370" x2="454" y2="370" stroke="#C7CDD4" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="30" y="408" width="440" height="268" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="432" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; a name, a place and a time in both boxes</text>
  <text x="48" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; what the person actually lost &#8212; money, an afternoon, trust</text>
  <text x="48" y="508" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; no abbreviations: the words FP and FN score nothing here</text>
  <text x="48" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; one sentence saying which you would rather cause, and why</text>
  <text x="48" y="556" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; a sentence admitting the trade-off, both ways</text>
  <text x="48" y="580" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the best move: how one error CAUSES the other</text>
  <text x="48" y="604" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">   (too many false alarms &#8594; the battery comes out)</text>
  <text x="48" y="628" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; and the count question: how often does it happen?</text>
  <text x="48" y="652" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">   the cell says what kind of wrong, the count how bad</text>
</svg>
