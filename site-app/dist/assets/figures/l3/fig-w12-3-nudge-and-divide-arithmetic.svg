<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Nudge, subtract, divide - three times</title>
  <desc>Three identical panels for x equals 1, 3 and 5, each doing the same five-line arithmetic on f of x equals x times x with a nudge of 0.001. At x equals 1: f of x plus h is 1.002001, f of x minus h is 0.998001, the difference is 0.004000 and divided by two h it is 2.0000, while the shortcut rule two times x gives 2. At x equals 3: 9.006001, 8.994001, 0.012000, 6.0000, and the rule gives 6. At x equals 5: 25.010001, 24.990001, 0.020000, 10.0000, and the rule gives 10. Each panel carries a green tick. The three measured slopes 2, 6 and 10 are exactly two times x.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Nudge, subtract, divide &#8722; three times</text>
  <text x="400" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">f(x) = x &#215; x, and the nudge h = 0.001</text>
  <rect x="42" y="96" width="230" height="218" rx="12" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="157" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">x = 1</text>
  <line x1="58" y1="132" x2="256" y2="132" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="58" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">f(x + h)</text>
  <text x="256" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">1.002001</text>
  <text x="58" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">f(x &#8722; h)</text>
  <text x="256" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">0.998001</text>
  <text x="58" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the difference</text>
  <text x="256" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">0.004000</text>
  <line x1="58" y1="234" x2="256" y2="234" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="58" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">difference &#247; 2h</text>
  <text x="256" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="end">2.0000</text>
  <text x="58" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">shortcut rule</text>
  <text x="256" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">2 &#215; 1 = 2</text>
  <polyline points="144,297 149,302 158,290" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="292" y="96" width="230" height="218" rx="12" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="407" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">x = 3</text>
  <line x1="308" y1="132" x2="506" y2="132" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="308" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">f(x + h)</text>
  <text x="506" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">9.006001</text>
  <text x="308" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">f(x &#8722; h)</text>
  <text x="506" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">8.994001</text>
  <text x="308" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the difference</text>
  <text x="506" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">0.012000</text>
  <line x1="308" y1="234" x2="506" y2="234" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="308" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">difference &#247; 2h</text>
  <text x="506" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="end">6.0000</text>
  <text x="308" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">shortcut rule</text>
  <text x="506" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">2 &#215; 3 = 6</text>
  <polyline points="394,297 399,302 408,290" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="542" y="96" width="230" height="218" rx="12" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="657" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">x = 5</text>
  <line x1="558" y1="132" x2="756" y2="132" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="558" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">f(x + h)</text>
  <text x="756" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">25.010001</text>
  <text x="558" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">f(x &#8722; h)</text>
  <text x="756" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">24.990001</text>
  <text x="558" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the difference</text>
  <text x="756" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">0.020000</text>
  <line x1="558" y1="234" x2="756" y2="234" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="558" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">difference &#247; 2h</text>
  <text x="756" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="end">10.0000</text>
  <text x="558" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">shortcut rule</text>
  <text x="756" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">2 &#215; 5 = 10</text>
  <polyline points="644,297 649,302 658,290" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Three points, three slopes: 2, 6 and 10. Every one is exactly 2 &#215; x.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">The rule was not handed to you. You measured it, then noticed it.</text>
</svg>
