  <line x1="40" y1="66" x2="64" y2="66" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <line x1="736" y1="66" x2="760" y2="66" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <line x1="760" y1="66" x2="760" y2="90" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="310" x2="40" y2="334" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="334" x2="64" y2="334" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <line x1="736" y1="334" x2="760" y2="334" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <line x1="760" y1="310" x2="760" y2="334" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="748" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="end">sketch here</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two real pairs, one join, one false claim. Show all three.</text>
