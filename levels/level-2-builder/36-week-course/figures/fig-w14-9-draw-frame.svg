<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 14</title>
  <desc>An empty framed drawing area titled draw your own twelve-row table, with a ruled grid of five columns and eight blank rows under a tinted header row, and three reminder boxes underneath asking what one row represents, the five column names, and which column repeats.</desc>
  <rect x="24" y="24" width="752" height="290" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your own twelve-row table</text>
  <text x="400" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rule five columns, write your column names in the top row, number the rows down the left</text>
  <rect x="84" y="104" width="632" height="22" fill="#D9EAF9"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
  <line x1="124" y1="104" x2="124" y2="302"/>
  <line x1="272" y1="104" x2="272" y2="302"/>
  <line x1="420" y1="104" x2="420" y2="302"/>
  <line x1="568" y1="104" x2="568" y2="302"/>
  <line x1="84" y1="148" x2="716" y2="148"/>
  <line x1="84" y1="170" x2="716" y2="170"/>
  <line x1="84" y1="192" x2="716" y2="192"/>
  <line x1="84" y1="214" x2="716" y2="214"/>
  <line x1="84" y1="236" x2="716" y2="236"/>
  <line x1="84" y1="258" x2="716" y2="258"/>
  <line x1="84" y1="280" x2="716" y2="280"/>
  </g>
  <line x1="84" y1="126" x2="716" y2="126" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="84" y="104" width="632" height="198" rx="0" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what one row represents</text>
  <rect x="60" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">your five column names</text>
  <rect x="300" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the column that repeats</text>
  <rect x="540" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
</svg>
