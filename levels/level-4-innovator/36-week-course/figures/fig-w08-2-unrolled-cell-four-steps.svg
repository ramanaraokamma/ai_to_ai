  <line x1="300" y1="210" x2="300" y2="238" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <line x1="450" y1="210" x2="450" y2="238" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
