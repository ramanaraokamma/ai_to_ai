<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A condition is a fork in the path</title>
  <desc>A signpost asks whether your age is thirteen or more. The path forks: the branch labelled True leads to a box setting the price to 250 for an adult, the branch labelled False leads to a box setting the price to 120 for a child. Both branches curve back and join a single box that prints the price.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A condition is a fork in the path</text>
  <rect x="280" y="74" width="240" height="46" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="97" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">is your age 13 or more?</text>
  <line x1="400" y1="120" x2="400" y2="152" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <path d="M400 152 L214 200" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M400 152 L586 200" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="240" y="158" width="60" height="26" rx="13" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="270" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">True</text>
  <rect x="500" y="158" width="60" height="26" rx="13" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="530" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">False</text>
  <rect x="94" y="200" width="240" height="74" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="214" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">price = 250</text>
  <text x="214" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">band = adult</text>
  <rect x="466" y="200" width="240" height="74" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="586" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">price = 120</text>
  <text x="586" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">band = child</text>
  <text x="214" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the if block</text>
  <text x="586" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the else block</text>
  <path d="M214 298 Q214 330 300 330" fill="none" stroke="#55636F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M586 298 Q586 330 500 330" fill="none" stroke="#55636F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(304 330) rotate(0)"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(496 330) rotate(180)"/>
  <rect x="310" y="312" width="180" height="36" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">print the price</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Exactly one block runs, never both. Then the two paths join again.</text>
</svg>
