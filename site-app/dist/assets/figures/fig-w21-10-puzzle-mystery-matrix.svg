<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The mystery matrix puzzle</title>
  <desc>A three by three confusion matrix with four of its nine cells left blank as question marks. Row totals and column totals are given, and the diagonal sum is given, so every missing cell can be worked out.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">The mystery matrix puzzle</text>
    <text x="400" y="58" font-size="14" fill="#55636F" text-anchor="middle">Four cells are missing. The totals are enough. Fill in all four.</text>

    <g font-size="14" fill="#55636F" text-anchor="middle">
      <text x="300" y="98">said cat</text>
      <text x="380" y="98">said dog</text>
      <text x="460" y="98">said fox</text>
      <text x="546" y="98">row total</text>
    </g>
    <g font-size="14" fill="#55636F" text-anchor="end">
      <text x="254" y="141">true cat</text>
      <text x="254" y="201">true dog</text>
      <text x="254" y="261">true fox</text>
      <text x="254" y="317">said total</text>
    </g>

    <g stroke="#14202B" stroke-width="2" fill="none">
      <rect x="260" y="106" width="240" height="180" rx="4"/>
      <line x1="340" y1="106" x2="340" y2="286"/>
      <line x1="420" y1="106" x2="420" y2="286"/>
      <line x1="260" y1="166" x2="500" y2="166"/>
      <line x1="260" y1="226" x2="500" y2="226"/>
    </g>
    <g fill="#F4D5E9" stroke="#C42B8C" stroke-width="3">
      <rect x="340" y="106" width="80" height="60"/>
      <rect x="260" y="166" width="80" height="60"/>
      <rect x="420" y="226" width="80" height="60"/>
      <rect x="340" y="226" width="80" height="60"/>
    </g>
    <g font-size="24" fill="#14202B" text-anchor="middle">
      <text x="300" y="144">7</text>
      <text x="380" y="144">?</text>
      <text x="460" y="144">1</text>
      <text x="300" y="204">?</text>
      <text x="380" y="204">6</text>
      <text x="460" y="204">2</text>
      <text x="300" y="264">3</text>
      <text x="380" y="264">?</text>
      <text x="460" y="264">?</text>
    </g>
    <g font-size="18" fill="#14202B" text-anchor="middle">
      <text x="546" y="144">10</text>
      <text x="546" y="204">10</text>
      <text x="546" y="264">10</text>
      <text x="300" y="317">12</text>
      <text x="380" y="317">11</text>
      <text x="460" y="317">7</text>
      <text x="546" y="317">30</text>
    </g>
    <line x1="510" y1="106" x2="510" y2="330" stroke="#C7CDD4" stroke-width="1.5"/>
    <line x1="260" y1="296" x2="580" y2="296" stroke="#C7CDD4" stroke-width="1.5"/>

    <rect x="26" y="106" width="196" height="180" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="124" y="134" font-size="14" fill="#55636F" text-anchor="middle">WHAT YOU KNOW</text>
    <g font-size="14" fill="#14202B">
      <text x="42" y="164">10 photos per class</text>
      <text x="42" y="192">30 photos in total</text>
      <text x="42" y="220">the diagonal adds</text>
      <text x="42" y="240">to 17</text>
      <text x="42" y="270">every row adds to 10</text>
    </g>

    <rect x="604" y="106" width="170" height="180" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="689" y="134" font-size="14" fill="#55636F" text-anchor="middle">THEN ANSWER</text>
    <g font-size="14" fill="#14202B">
      <text x="618" y="164">overall accuracy?</text>
      <text x="618" y="192">worst class?</text>
      <text x="618" y="220">biggest mistake,</text>
      <text x="618" y="240">said as a sentence?</text>
      <text x="618" y="270">is it symmetric?</text>
    </g>

    <text x="400" y="360" font-size="14" fill="#55636F" text-anchor="middle">Hint: start with the row that has only one gap in it.</text>
    <text x="400" y="384" font-size="14" fill="#55636F" text-anchor="middle">Every row must add to 10 and every column must match its total.</text>
  </g>
</svg>
