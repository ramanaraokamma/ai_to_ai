<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Real or fake: check the provenance, not the pixels</title>
  <desc>Two identical looking photos side by side, one real and one generated, showing that pixels cannot tell you which. Underneath, four numbered provenance checks: who posted it first, when, who else has it, and what was around it.</desc>
  <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">One of these was made by a machine</text>

  <rect x="90" y="56" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="104" y="70" width="222" height="108" rx="6" fill="#D9EAF9" stroke="none"/>
  <circle cx="152" cy="104" r="16" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <path d="M104 178 L156 132 L192 160 L226 136 L326 178 Z" fill="#1F6FB2" stroke="none"/>
  <rect x="104" y="70" width="222" height="108" rx="6" fill="none" stroke="#1F6FB2" stroke-width="2"/>
  <text x="215" y="196" font-size="14" fill="#55636F" text-anchor="middle">Photo A</text>

  <rect x="460" y="56" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="474" y="70" width="222" height="108" rx="6" fill="#D9EAF9" stroke="none"/>
  <circle cx="522" cy="104" r="16" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <path d="M474 178 L526 132 L562 160 L596 136 L696 178 Z" fill="#1F6FB2" stroke="none"/>
  <rect x="474" y="70" width="222" height="108" rx="6" fill="none" stroke="#1F6FB2" stroke-width="2"/>
  <text x="585" y="196" font-size="14" fill="#55636F" text-anchor="middle">Photo B</text>

  <text x="400" y="118" font-size="24" fill="#14202B" text-anchor="middle">?</text>
  <text x="400" y="150" font-size="14" fill="#55636F" text-anchor="middle">staring</text>
  <text x="400" y="168" font-size="14" fill="#55636F" text-anchor="middle">harder</text>
  <text x="400" y="186" font-size="14" fill="#55636F" text-anchor="middle">will not help</text>

  <line x1="40" y1="222" x2="760" y2="222" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="400" y="250" font-size="18" fill="#14202B" text-anchor="middle">So do not check the pixels. Check where it came from.</text>

  <g fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5">
    <circle cx="125" cy="288" r="15"/>
    <circle cx="315" cy="288" r="15"/>
    <circle cx="505" cy="288" r="15"/>
    <circle cx="695" cy="288" r="15"/>
  </g>
  <g font-size="14" fill="#14202B" text-anchor="middle">
    <text x="125" y="293">1</text>
    <text x="315" y="293">2</text>
    <text x="505" y="293">3</text>
    <text x="695" y="293">4</text>
  </g>
  <g font-size="18" fill="#14202B" text-anchor="middle">
    <text x="125" y="330">Who posted it</text>
    <text x="125" y="352">FIRST?</text>
    <text x="315" y="330">When was it</text>
    <text x="315" y="352">posted?</text>
    <text x="505" y="330">Who else</text>
    <text x="505" y="352">has it?</text>
    <text x="695" y="330">What was</text>
    <text x="695" y="352">around it?</text>
  </g>
  <text x="400" y="384" font-size="14" fill="#55636F" text-anchor="middle">A week-old account, eleven minutes ago, nobody else reporting it, and no wider scene. Four red flags, zero pixels examined.</text>
</svg>
