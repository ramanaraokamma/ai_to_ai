<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 3</title>
  <desc>An empty framed drawing area titled draw a pile shared out and what is left, split by a dashed line into the whole pile before sharing and the piles each person gets plus a spare plate, with three blank reminder boxes underneath.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw It frame for Week 3</text>
  <rect x="24" y="60" width="752" height="262" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="60" width="752" height="40" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="100" x2="776" y2="100" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: a pile shared out, and what is left</text>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8">
    <rect x="36" y="152" width="356" height="152" rx="10" fill="none"/>
  </g>
  <text x="214.0" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the whole pile before sharing</text>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8">
    <rect x="408" y="152" width="356" height="152" rx="10" fill="none"/>
  </g>
  <text x="586.0" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the piles each person gets, and the spare plate</text>
  <rect x="40.0" y="336" width="229.33333333333334" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="154.66666666666669" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">how many altogether</text>
  <rect x="285.33333333333337" y="336" width="229.33333333333334" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400.00000000000006" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">how many each  (//)</text>
  <rect x="530.6666666666667" y="336" width="229.33333333333334" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="645.3333333333334" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">how many left  (%)</text>
</svg>
