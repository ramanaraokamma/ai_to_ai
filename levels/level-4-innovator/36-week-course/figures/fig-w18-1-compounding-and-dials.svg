<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A slope just below or above 1 compounds into fading or blowing up, and a bigger forget bias keeps the signal</title>
  <desc>Left, a log-scale bar chart of what is left after multiplying a slope by itself 30 times: 0.95 gives 0.2146, below the 1 = unchanged line (fading, clipping cannot cure it); 1.10 gives 17.45, above it (blowing up, clipping can cure it). Right, a linear bar chart of the share left after 8 steps for a forget dial: bias 0 (dial 0.5) leaves 0.00391, bias 1 (dial 0.7311) leaves 0.08159, bias 3 (dial 0.9526) leaves 0.67794, ringed. Practice numbers, not the paper's.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Near 1, small differences compound</text>
  <text x="205" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">a slope multiplied 30 times</text>
  <line x1="156.7" y1="104" x2="156.7" y2="280" stroke="#55636F" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="156.7" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1 = unchanged</text>
  <text x="50" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">0.95 times itself, 30 times</text>
  <rect x="85.4" y="142" width="71.3" height="28" rx="4" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="79.4" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">0.2146</text>
  <text x="50" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">fading: clipping cannot cure it</text>
  <text x="50" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1.10 times itself, 30 times</text>
  <rect x="156.7" y="226" width="132.5" height="28" rx="4" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="295.1" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" dominant-baseline="central">17.45</text>
  <text x="50" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F"></text>
  <text x="164.7" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">blowing up: clipping can cure it</text>
  <line x1="50" y1="286" x2="370" y2="286" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="286" x2="50" y2="292" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="50" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.1</text>
  <line x1="156.7" y1="286" x2="156.7" y2="292" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="156.7" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="263.3" y1="286" x2="263.3" y2="292" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="263.3" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <line x1="370" y1="286" x2="370" y2="292" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="370" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <text x="210" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what is left (log scale)</text>
  <text x="595" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">a forget dial, 8 steps</text>
  <text x="430" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">bias 0: dial 0.5</text>
  <rect x="430" y="124" width="3" height="26" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="441" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" dominant-baseline="central">0.00391</text>
  <text x="430" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">bias 1: dial 0.7311</text>
  <rect x="430" y="186" width="26.9" height="26" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="464.9" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" dominant-baseline="central">0.08159</text>
  <text x="430" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">bias 3: dial 0.9526</text>
  <rect x="430" y="248" width="223.7" height="26" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="4" stroke-linejoin="round"/>
  <text x="661.7" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" dominant-baseline="central">0.67794</text>
  <line x1="430" y1="296" x2="760" y2="296" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="430" y1="296" x2="430" y2="302" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="430" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="595" y1="296" x2="595" y2="302" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="595" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="760" y1="296" x2="760" y2="302" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="760" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="595" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">share of the signal left after 8 steps</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Practice numbers, not the paper's: near 1, small differences compound.</text>
</svg>
