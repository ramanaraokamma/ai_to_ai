<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Cosine is the angle between two lists</title>
  <desc>Two arrows drawn from the same corner on a pair of axes. The blue arrow a goes to 2 across and 1 up; the purple arrow b goes to 1 across and 2 up. A pink arc between them is labelled 36.87 degrees. The panel gives the arithmetic: the dot product is 2 times 1 plus 1 times 2 plus 0 times 0, which is 4; the length of a is the square root of 4 plus 1 plus 0, which is 2.2361, and the length of b is the same; so the cosine is 4 divided by 5, which is 0.8. A note says 0.8 is not 80 percent, it is the cosine of 36.87 degrees. Same direction is 1 and 0 degrees; nothing in common is 0 and 90 degrees.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Cosine is really an angle</text>
  <line x1="80" y1="400" x2="380" y2="400" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="400" x2="80" y2="96" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="230" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">column 1</text>
  <text x="46" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 46 250)">column 2</text>
  <line x1="198" y1="395" x2="198" y2="405" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="198" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="75" y1="282" x2="85" y2="282" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="66" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <line x1="316" y1="395" x2="316" y2="405" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="316" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <line x1="75" y1="164" x2="85" y2="164" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="66" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">2</text>
  <line x1="80" y1="400" x2="316" y2="282" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(316 282) rotate(0)"/>
  <line x1="80" y1="400" x2="198" y2="164" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(198 164) rotate(0)"/>
  <text x="324" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F6FB2">a = (2, 1, 0)</text>
  <text x="208" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6D28D9">b = (1, 2, 0)</text>
  <path d="M175.5 357.8 A 106 106 0 0 0 127.4 310" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="196" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">36.87</text>
  <text x="196" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">degrees</text>
  <rect x="252" y="78" width="224" height="186" rx="10" fill="#F5F8FA" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="268" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dot = 2&#215;1 + 1&#215;2 + 0&#215;0</text>
  <text x="268" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    = 4</text>
  <text x="268" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">len a = sqrt(4+1+0)</text>
  <text x="268" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">      = 2.2361</text>
  <text x="268" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">len b = sqrt(1+4+0)</text>
  <text x="268" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">      = 2.2361</text>
  <text x="268" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">cos = 4 &#247; 5 = 0.8</text>
  <text x="364" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">0.8 is not 80%.</text>
  <text x="364" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">It is the cosine of</text>
  <text x="364" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">36.87 degrees.</text>
  <text x="250" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">same direction = 1 = 0 degrees &#183; nothing shared = 0 = 90</text>
</svg>
