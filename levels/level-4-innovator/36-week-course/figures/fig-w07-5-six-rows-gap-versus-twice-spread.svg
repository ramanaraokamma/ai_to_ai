<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Only a gap longer than twice the larger spread counts, and only one of these six rows passes</title>
  <desc>Six rows from the Week 7 table, each with a blue gap bar over a gold twice-the-spread bar on one scale. Baseline 0.039 plus or minus 0.008. Dropout 0.1: 0.051, gap 0.012, twice the spread 0.016, inside noise. Dropout 0.5: 0.062, gap 0.023, twice the spread 0.016, WORSE, marked with a cross and a ringed row. Batch size 8: 0.039 plus or minus 0.019, gap 0.000, twice the spread 0.038, inside noise. Batch size 512: 0.060 plus or minus 0.013, gap 0.021, twice the spread 0.026, inside noise. Norm layer: 0.057 plus or minus 0.031, gap 0.018, twice the spread 0.062, inside noise. Weight decay 0.01: 0.050 plus or minus 0.018, gap 0.011, twice the spread 0.036, inside noise.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The rule applied to six rows of the table</text>
  <text x="24" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">row</text>
  <text x="176" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">val mean &#177; spread</text>
