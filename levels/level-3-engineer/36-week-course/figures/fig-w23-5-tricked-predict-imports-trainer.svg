<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: which file imports which</title>
  <desc>Two panels. On the left, marked wrong, predict_digits.py imports train_digits, and the arrow between them is crossed out: importing a script runs it, so every prediction retrains the model and 15 epochs of training scroll past first. The grep for optimizer, backward and DataLoader finds them and exits 0. On the right, marked right, predict_digits.py imports only from digits_net, the class is written once and both scripts import it, and the grep finds nothing and exits 1, which is the pass.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Wrong and right: which file imports which</text>
  <rect x="30" y="66" width="350" height="300" rx="12" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="66" width="350" height="36" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="47" y1="75" x2="65" y2="93" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="47" y2="93" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="215" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the shortcut</text>
  <rect x="70" y="126" width="270" height="34" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="205" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">predict_digits.py</text>
  <line x1="205" y1="160" x2="205" y2="184" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polygon points="205,194 199,182 211,182" fill="#CC2B1D" stroke="#CC2B1D" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="250" y1="168" x2="266" y2="184" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="266" y1="168" x2="250" y2="184" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <rect x="70" y="194" width="270" height="34" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="205" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">import train_digits</text>
  <text x="205" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">importing a script runs it</text>
  <text x="205" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">so every prediction retrains</text>
  <text x="205" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">grep finds: optimizer, backward,</text>
  <text x="205" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">DataLoader &#8212; and exits 0</text>
  <text x="205" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle">15 epochs scroll past first</text>
  <rect x="420" y="66" width="350" height="300" rx="12" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="420" y="66" width="350" height="36" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="437" y1="84" x2="444.2" y2="90.3" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round"/>
  <line x1="444.2" y1="90.3" x2="455" y2="76.8" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round"/>
  <text x="605" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">one file holds the class</text>
  <rect x="460" y="126" width="270" height="34" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="595" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">predict_digits.py</text>
  <line x1="595" y1="160" x2="595" y2="184" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="595,194 589,182 601,182" fill="#1B7A4B" stroke="#1B7A4B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="460" y="194" width="270" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="595" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">from digits_net import</text>
  <text x="595" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the class is written once</text>
  <text x="595" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">and both scripts import it</text>
  <text x="595" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">grep finds nothing at all,</text>
  <text x="595" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and exits 1 &#8212; the pass</text>
  <text x="595" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="middle">no training code at all</text>
</svg>
