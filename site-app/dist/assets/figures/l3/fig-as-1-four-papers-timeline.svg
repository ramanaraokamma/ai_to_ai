<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four papers, each testing only its own nine weeks</title>
  <desc>Four panels across the page. Term 1, weeks 1 to 9, Build It Honestly, no calculus yet, 75 minutes and 80 marks, given after week 9. Term 2, weeks 10 to 18, Inside the Box, slopes and log loss and the at-sign, given after week 18. Term 3, weeks 19 to 27, Real Framework, torch and shapes and CNNs, given after week 27 and before the capstone build. Term 4, weeks 28 to 36, Words and Ship It, k-means and PCA and TF-IDF, given in week 36 before the showcase. A note at the bottom says nothing from after a term appears anywhere on its paper, checked line by line against the maths ladder and the syntax ladder.</desc>
