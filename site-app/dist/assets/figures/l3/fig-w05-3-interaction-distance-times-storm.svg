<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>When distance costs more, and how much more</title>
  <desc>A two-by-three grid of how often deliveries are late, split by distance under or over 5 kilometres and by clear, rain or storm. The six rates are 0.1765 over 1105 orders, 0.2927 over 386, 0.3908 over 87, then 0.5034 over 294, 0.5914 over 93 and 0.8571 over 35. A long trip costs 0.5034 minus 0.1765, that is 0.3269, in the clear, but 0.8571 minus 0.3908, that is 0.4663, in a storm, which is 1.43 times as much. So a product column is built with severity clear 0, rain 1, storm 2: a 6 kilometre trip gives 6 times 0 equals 0 in the clear, 6 times 1 equals 6 in rain, and 6 times 2 equals 12 in a storm.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">When distance costs more, and how much more</text>
  <text x="155.0" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">clear</text>
  <text x="285.0" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">rain</text>
  <text x="415.0" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">storm</text>
  <text x="78" y="129" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">under</text>
  <text x="78" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">5 km</text>
  <text x="78" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">over</text>
  <text x="78" y="223" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">5 km</text>
  <rect x="90" y="96" width="130" height="76" fill="#E2F7ED" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="155.0" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.1765</text>
  <text x="155.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1105 orders</text>
  <rect x="220" y="96" width="130" height="76" fill="#E2F7ED" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="285.0" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.2927</text>
  <text x="285.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">386 orders</text>
  <rect x="350" y="96" width="130" height="76" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="415.0" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.3908</text>
  <text x="415.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">87 orders</text>
  <rect x="90" y="172" width="130" height="76" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="155.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.5034</text>
  <text x="155.0" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">294 orders</text>
  <rect x="220" y="172" width="130" height="76" fill="#F6AEA6" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="285.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.5914</text>
  <text x="285.0" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">93 orders</text>
  <rect x="350" y="172" width="130" height="76" fill="#F6AEA6" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="415.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.8571</text>
  <text x="415.0" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">35 orders</text>
  <rect x="90" y="96" width="390" height="152" fill="none" stroke="#14202B" stroke-width="3"/>
  <text x="285.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">share of those orders that arrived late</text>
  <rect x="90" y="282" width="300" height="78" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="104" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">what a long trip costs you:</text>
  <text x="104" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">in the clear:  0.5034 &#8722; 0.1765 = 0.3269</text>
  <text x="104" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">in a storm:    0.8571 &#8722; 0.3908 = 0.4663</text>
  <rect x="510" y="96" width="270" height="152" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="524" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">so build the product</text>
  <text x="524" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">severity: clear 0, rain 1, storm 2</text>
  <text x="524" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">6 km, clear:  6 &#215; 0 = 0</text>
  <text x="524" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">6 km, rain:   6 &#215; 1 = 6</text>
  <text x="524" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">6 km, storm:  6 &#215; 2 = 12</text>
  <text x="524" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">one knob for 'far AND wet'</text>
  <text x="510" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">A distance weight plus a storm weight</text>
  <text x="510" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">charges distance one fixed rate.</text>
  <text x="510" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">0.4663 &#247; 0.3269 = 1.43 times as costly</text>
  <text x="510" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">Multiplying can.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Six cells, 2000 orders. The bottom-right corner is where the two problems meet.</text>
</svg>
