<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week&#8217;s six words, drawn</title>
  <desc>Six small pictures. Logits is a bar chart of five raw scores about a zero line, four of them hanging below it as far as minus 10.94 and one rising above it to 4.46, labelled raw scores, one per class. Argmax is four boxes holding minus 10.94, 4.46, minus 10.63 and minus 4.69, with the 4.46 box ringed and labelled slot 1, so argmax is the position and not the value. Softmax shows the arithmetic 4.46 minus 4.46 equals 0.00, e to the 0.00 equals 1.000000, the ten total 1.024606, and 1.000000 divided by 1.024606 equals 0.9760. Adam is four weight blocks each with its own different-length step bar, and lr equals 1e-3 means 0.001. Parameter count shows 1 times 3 times 3 times 8 plus 8 equals 80, 8 times 3 times 3 times 16 plus 16 equals 1168, and 64 times 10 plus 10 equals 650, totalling 1898. Learned filter is a three by three grid whose left column is all plus and right column all minus, which answers plus 2.830 to a bright-left edge.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week&#8217;s six words, drawn</text>
  <rect x="26" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="282" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
