<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw the artifact crossing over</title>
  <desc>Two empty framed panels. The upper one is for drawing the training side: the raw table, the sealed pipeline with its two steps, and the one file that comes out of it. The lower one is for drawing the clean room: a brand-new program that loads that file, is handed three hand-typed orders and prints three probabilities, with no training code anywhere in it. A panel at the bottom says what a good answer contains: a wall between the two sides with only the 5002-byte joblib file crossing it, the model drawn as the last step and never reachable on its own, the three counts fit-open-bracket, make_data and train_test all zero, and the three real probabilities 0.968, 0.022 and 0.291.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the artifact crossing over</text>
  <text x="250" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One thing is allowed to cross the wall. Draw only that thing.</text>

  <rect x="30" y="80" width="440" height="188" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Side 1 &#8212; where the training happens</text>
  <text x="46" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the table, the sealed box, and the file that comes out</text>
  <line x1="46" y1="256" x2="456" y2="256" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="30" y1="290" x2="470" y2="290" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <text x="250" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">the wall &#8212; label what crosses it, and its size in bytes</text>

  <rect x="30" y="326" width="440" height="188" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Side 2 &#8212; the clean room</text>
  <text x="46" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the loaded file, three typed orders, three probabilities</text>
  <line x1="46" y1="502" x2="456" y2="502" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="30" y="536" width="440" height="140" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="586" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; exactly one thing crosses, and it is 5002 bytes</text>
  <text x="48" y="608" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the model is drawn last, with no door of its own</text>
  <text x="48" y="630" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; side 2 has no table, no split and no fit anywhere on it</text>
  <text x="48" y="652" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the three counts are written down, and all three are 0</text>
  <text x="48" y="674" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#183; the three probabilities are 0.968, 0.022 and 0.291</text>
</svg>
