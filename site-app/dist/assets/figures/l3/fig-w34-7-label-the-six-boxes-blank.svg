<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img">
  <title>Label the six boxes</title>
  <desc>Six empty boxes numbered one to six, arranged three across and two down, each with three blank dashed lines inside it to write on. Boxes one to three are tinted blue for the data side, four and five gold for the decisions a person made, six red for the banned uses. Underneath, the six labels are listed out of order for the student to match: one prediction is about, what goes in with types, what comes out, the two errors priced, the threshold as a sum, never used for. Two rules are printed in pink: one box must contain a times sign and an equals sign, and one box must name two things somebody would actually try.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the six boxes</text>
  <text x="400" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">the prediction contract, with the words taken off</text>
