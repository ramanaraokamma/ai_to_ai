<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five new words for Week 28</title>
  <desc>Five small icons in a row. A tinted grid block labelled X, the table of measurements, shape ten by two. A single tall column labelled y, the column of answers, shape ten comma nothing. A small rectangle of cells labelled feature matrix, the posh name for X. A bullseye labelled target, the thing you want back, same as y. And two points joined by a slanted line over a dashed right-angled triangle, labelled Euclidean distance: subtract, square, add, square root, giving 3.23.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five new words for Week 28</text>
  <rect x="74" y="100" width="72" height="72" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="98" y1="100" x2="98" y2="172" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="74" y1="124" x2="146" y2="124" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="122" y1="100" x2="122" y2="172" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="74" y1="148" x2="146" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <text x="110" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2" text-anchor="middle">X</text>
  <text x="110" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the table of</text>
  <text x="110" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">measurements</text>
  <text x="110" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">shape (10, 2)</text>
  <rect x="241" y="100" width="48" height="72" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <line x1="241" y1="124" x2="289" y2="124" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="241" y1="148" x2="289" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <text x="265" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">y</text>
  <text x="265" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the single column</text>
  <text x="265" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">of answers</text>
  <text x="265" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">shape (10,)</text>
  <rect x="358" y="112" width="84" height="48" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="379" y1="112" x2="379" y2="160" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="400" y1="112" x2="400" y2="160" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="421" y1="112" x2="421" y2="160" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="358" y1="136" x2="442" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <text x="400" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rows x columns</text>
  <text x="400" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2" text-anchor="middle">feature matrix</text>
  <text x="400" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">a rectangle of numbers.</text>
  <text x="400" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The posh name for X.</text>
  <circle cx="535" cy="136" r="34" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="535" cy="136" r="20" fill="none" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="535" cy="136" r="7" fill="#C42B8C" stroke="none"/>
  <text x="535" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">target</text>
  <text x="535" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the thing you want</text>
  <text x="535" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">back. Same as y.</text>
  <polyline points="650,168 726,168 726,108" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="650" y1="168" x2="726" y2="108" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="650" cy="168" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <polygon points="726,100 734,114 718,114" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="690" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#845F00" text-anchor="middle">Euclidean distance</text>
  <text x="690" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">subtract, square,</text>
  <text x="690" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">add, square root</text>
  <text x="690" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">3.23</text>
  <text x="400" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two of these five words are the same idea in different clothes. X is the feature matrix.</text>
</svg>
