<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Ten scores, one winner</title>
  <desc>A bar chart of ten raw scores for one handwritten digit: minus 10.94, 4.46, minus 10.63, minus 4.69, minus 0.29, minus 7.80, minus 7.97, minus 3.30, 0.14 and minus 1.70. The bar for slot 1, at 4.46, is the only tall one and is ringed. A panel says argmax is 1, that slot 1 squashes to a chance of 0.9759, and that the loss is minus the natural log of 0.9759, which is 0.0244. Squashing the scores before handing them to the loss gives 1.4818 instead, which is wrong.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Ten scores, one winner</text>
  <text x="250" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the same digit, all ten raw scores</text>
  <line x1="90" y1="90" x2="90" y2="304" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="154.824" x2="430" y2="154.824" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="82" y="158.824" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="64" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 64 200)">raw score</text>
  <rect x="94" y="154.824" width="26" height="128.706" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="107" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <rect x="128" y="102.353" width="26" height="52.4706" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="141" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <rect x="162" y="154.824" width="26" height="125.059" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="175" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <rect x="196" y="154.824" width="26" height="55.1765" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="209" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <rect x="230" y="154.824" width="26" height="3.41176" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="243" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <rect x="264" y="154.824" width="26" height="91.7647" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="277" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <rect x="298" y="154.824" width="26" height="93.7647" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="311" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <rect x="332" y="154.824" width="26" height="38.8235" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="345" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7</text>
  <rect x="366" y="153.176" width="26" height="1.64706" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="379" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <rect x="400" y="154.824" width="26" height="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="413" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">9</text>
  <text x="160" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">4.46</text>
  <text x="250" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the digit each score belongs to &#183; lowest is &#8722;10.94</text>
  <rect x="40" y="358" width="420" height="122" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">biggest of the ten is 4.46, in slot 1 &#8594; argmax = 1</text>
  <text x="56" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">squash all ten into chances: slot 1 gets 0.9759</text>
  <text x="56" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">the loss is &#8722;ln(0.9759) = 0.0244</text>
  <text x="56" y="450" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">hand the loss the ten RAW scores, never the chances:</text>
  <text x="56" y="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">squash them yourself and the loss reads 1.4818 instead.</text>
</svg>
