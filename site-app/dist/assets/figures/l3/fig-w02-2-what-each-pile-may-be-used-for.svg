<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>What each pile is allowed to do</title>
  <desc>Three stacked bands, one per pile. Train, 1200 rows: may be fitted on, may be looked at as often as you like. Validation, 400 rows: may be used to choose between models, must not be fitted on, and it costs a little honesty every time you look, so you may look many times but it wears out. Test, 400 rows: may be opened exactly once at the very end, must not be used to choose anything, and if you open it twice it is gone.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What each pile is allowed to do</text>
  <rect x="30" y="82" width="440" height="176" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="50" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" dominant-baseline="central">train</text>
  <text x="452" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">1200 rows</text>
  <line x1="46" y1="130" x2="454" y2="130" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="50" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">MAY: fit the model on it</text>
  <text x="50" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">MAY: be looked at as often</text>
  <text x="50" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">as you like</text>
  <text x="50" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">MUST NOT: be scored and</text>
  <text x="50" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">called a result</text>
  <rect x="50" y="220" width="400" height="26" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">how many times you may look: as often as you like</text>
  <rect x="30" y="278" width="440" height="176" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="50" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" dominant-baseline="central">validation</text>
  <text x="452" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">400 rows</text>
  <line x1="46" y1="326" x2="454" y2="326" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="50" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">MAY: choose between two</text>
  <text x="50" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">models, features, thresholds</text>
  <text x="50" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">MUST NOT: be fitted on</text>
  <text x="50" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">COSTS: a little honesty</text>
  <text x="50" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">every single time you look</text>
  <rect x="50" y="416" width="400" height="26" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="429" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">how many times you may look: many times &#8212; and it wears out</text>
  <rect x="30" y="474" width="440" height="176" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="50" y="504" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" dominant-baseline="central">test</text>
  <text x="452" y="504" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">400 rows</text>
  <line x1="46" y1="522" x2="454" y2="522" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="50" y="544" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">MAY: be opened exactly once,</text>
  <text x="50" y="562" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">at the very end</text>
  <text x="50" y="580" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">MUST NOT: be used to choose</text>
  <text x="50" y="598" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">anything at all</text>
  <text x="50" y="616" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Open it twice and it is gone</text>
  <rect x="50" y="612" width="400" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="625" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">how many times you may look: ONCE</text>
  <rect x="30" y="670" width="440" height="10" rx="5" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
