  <rect x="344" y="132" width="68" height="52" fill="none" stroke="#1B7A4B" stroke-width="3"/>
  <rect x="412" y="184" width="68" height="52" fill="none" stroke="#1B7A4B" stroke-width="3"/>
  <rect x="480" y="236" width="68" height="52" fill="none" stroke="#1B7A4B" stroke-width="3"/>
  <rect x="344" y="132" width="204" height="156" fill="none" stroke="#CC2B1D" stroke-width="3"/>
  <text x="446" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">answer, shape (3, 3)</text>
  <text x="446" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">nine numbers came out</text>
  <text x="446" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">green outlines: the three we wanted</text>
  <g transform="translate(566,106) scale(0.34)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <rect x="608" y="148" width="120" height="92" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="668" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 numbers</text>
  <text x="668" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">+ 3 numbers</text>
  <text x="668" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">should give 3,</text>
  <text x="668" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">not 9.</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The extra brackets made a column, not a row, and broadcasting was happy to stretch both.</text>
  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nothing crashed. Print the answer's shape - that is the only thing that catches this.</text>
</svg>
