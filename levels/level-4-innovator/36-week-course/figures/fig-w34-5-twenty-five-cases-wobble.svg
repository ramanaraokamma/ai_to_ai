<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>On 25 cases a score wobbles by about 2.3 cases, and one case is worth 0.04 of the score</title>
  <desc>A row of 25 cells with 17 filled and the 18th half filled, for 17.5 expected passes at a true pass rate of 0.70. A bracket spans 15.2 to 19.8 passes, the expected 17.5 plus and minus a wobble of 2.29 cases. Below, a hand sum: 25 times 0.70 times 0.30 is 5.25, its square root is 2.29 cases, and 2.29 divided by 25 is 0.092 of the score. A second panel shows one cell of 25 highlighted, one case is 0.04 of the score, and one cell of a six-cell category, 0.17.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What 25 cases can and cannot tell you</text>
