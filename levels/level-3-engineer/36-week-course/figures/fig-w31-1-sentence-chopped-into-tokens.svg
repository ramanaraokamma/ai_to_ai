<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One sentence, four ways to chop it up</title>
  <desc>The same sentence chopped four ways. Plain split gives 8 tokens including GREAT!! and wasn't. with their punctuation. Lowercasing first gives 8, with great!! still carrying two exclamation marks. The regex lower plus re.findall gives 8 clean tokens, but wasn't has become wasn and the t is gone. Dropping the four stopwords the, was, but and the leaves 4 tokens: pizza, great, service and wasn. 8 minus 4 stopwords is 4, and one of the four, wasn, is not a word at all.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One sentence, four ways to chop it up</text>
