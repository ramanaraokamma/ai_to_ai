<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 36 words, drawn</title>
  <desc>Four icon cards. A scrolled notebook read aloud to a listening figure for showcase. A question mark met by a card carrying three numbers for defence. A fence with a gap in it for limitation. A gate of six ticked bars for gate check.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Week 36 words, drawn</text>
  <rect x="24" y="64" width="182" height="290" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="44" y="96" width="84" height="96" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="56" y1="114" x2="116" y2="114" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="131" x2="116" y2="131" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="148" x2="116" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="165" x2="116" y2="165" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="182" x2="116" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="170" cy="122" r="18" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <path d="M152 172 q18 -30 36 0" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <line x1="132" y1="144" x2="148" y2="144" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(148 144) rotate(0.0)"/>
  <text x="115" y="214" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">to a real adult</text>
  <text x="115" y="262" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">showcase</text>
  <text x="115" y="290" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one notebook, top to</text>
  <text x="115" y="308" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">bottom, out loud</text>
  <rect x="214" y="64" width="182" height="290" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="232" y="96" width="46" height="46" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="255" y="119" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">?</text>
  <line x1="282" y1="119" x2="302" y2="119" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(302 119) rotate(0.0)"/>
  <rect x="306" y="96" width="74" height="96" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="343" y="120" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2.35 min</text>
  <text x="343" y="142" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">7.98 base</text>
  <text x="343" y="164" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">26 rows</text>
  <text x="305" y="214" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a number in every answer</text>
  <text x="305" y="262" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">defence</text>
  <text x="305" y="290" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">answering with numbers,</text>
  <text x="305" y="308" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">including “I don't know”</text>
  <rect x="404" y="64" width="182" height="290" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="430" y1="98" x2="430" y2="176" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="456" y1="98" x2="456" y2="176" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="482" y1="98" x2="482" y2="176" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="534" y1="98" x2="534" y2="176" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="560" y1="98" x2="560" y2="176" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="424" y1="118" x2="566" y2="118" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <line x1="424" y1="156" x2="566" y2="156" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <text x="495" y="214" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">point at your own gap</text>
  <text x="495" y="262" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">limitation</text>
  <text x="495" y="290" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what your project</text>
  <text x="495" y="308" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">cannot tell you</text>
  <rect x="594" y="64" width="182" height="290" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="622" y1="96" x2="622" y2="190" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="748" y1="96" x2="748" y2="190" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <rect x="628" y="100" width="114" height="12" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="628" y="115" width="114" height="12" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="628" y="130" width="114" height="12" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="628" y="145" width="114" height="12" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="628" y="160" width="114" height="12" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="628" y="175" width="114" height="12" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="685" y="214" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">all six, honestly</text>
  <text x="685" y="262" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">gate check</text>
  <text x="685" y="290" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">six honest ticks, or</text>
  <text x="685" y="308" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a blank with a plan</text>
  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four words, and not one of them is about code.</text>
</svg>
