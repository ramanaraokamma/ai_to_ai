  <rect x="662" y="216.6" width="44" height="99.4" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="684" y="210.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle" font-weight="600">46.9</text>
  <rect x="710" y="109.9" width="44" height="206.1" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="732" y="103.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">97.2</text>
  <text x="684" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">batch 2</text>
  <line x1="100" y1="104" x2="100" y2="316" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="316" x2="780" y2="316" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="440" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">validation accuracy after 10 epochs; batch 4 is one seed, the noisiest cell</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Batch norm at batch size 2 lands on the coin, 46.9%. Layer norm and no norm do not.</text>
