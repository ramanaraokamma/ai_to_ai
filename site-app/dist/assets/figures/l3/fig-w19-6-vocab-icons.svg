  <rect x="287" y="224" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="301" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">decision boundary</text>
  <circle cx="317" cy="274" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="339" cy="294" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
