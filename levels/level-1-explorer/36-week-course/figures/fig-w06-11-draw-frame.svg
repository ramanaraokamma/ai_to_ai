<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 6</title>
  <desc>An empty framed drawing area titled draw your own sample and population, with a large dashed outline for the population, a small dashed patch inside it for the sample, three dotted label lines and a strip at the bottom for one sentence beginning this does not show that.</desc>
  <rect x="24" y="24" width="752" height="286" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your own sample sitting inside your own population</text>

  <!-- population outline -->
  <rect x="200" y="92" width="380" height="192" rx="24" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8" stroke-linejoin="round"/>
  <text x="390" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">fill this shape with one dot per thing in your POPULATION</text>

  <!-- sample patch -->
  <rect x="316" y="150" width="148" height="94" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8" stroke-linejoin="round"/>
  <text x="390" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">shade the ones you MEASURED</text>

  <!-- label lines -->
  <g stroke="#C42B8C" stroke-width="1.5" fill="none">
    <path d="M200 130 H120"/>
    <path d="M316 174 H120"/>
    <path d="M580 220 H700"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">
    <text x="40" y="126">population =</text>
    <text x="40" y="170">sample =</text>
    <text x="646" y="248">how many are</text>
    <text x="646" y="266">missing?</text>
  </g>
  <g stroke="#C42B8C" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="40" y1="140" x2="196" y2="140"/>
    <line x1="40" y1="184" x2="196" y2="184"/>
    <line x1="646" y1="284" x2="756" y2="284"/>
  </g>

  <rect x="24" y="326" width="752" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="44" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Now write one sentence under your drawing: "This does not show that</text>
  <line x1="500" y1="354" x2="756" y2="354" stroke="#1B7A4B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="44" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">It must end with a "because" that names something not in your table.</text>
</svg>
