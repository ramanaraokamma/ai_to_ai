<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A rule boundary drawn on a number line</title>
  <desc>A number line of message length in characters from 10 to 50. A dashed threshold sits at 30 characters. Friend messages are circles above the line and scams are triangles below it. Two points are on the wrong side of the threshold and are marked with a cross.</desc>
  <text x="400" y="38" font-size="24" fill="#14202B" text-anchor="middle">One line, and everybody near it gets hurt</text>

  <circle cx="104" cy="82" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="120" y="87" font-size="14" fill="#14202B">friend message (ham)</text>
  <path d="M330 75 L338 89 L322 89 Z" fill="#6D28D9" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="348" y="87" font-size="14" fill="#14202B">scam (spam)</text>

  <line x1="415" y1="120" x2="415" y2="330" stroke="#CC2B1D" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="415" y="112" font-size="16" fill="#CC2B1D" text-anchor="middle">THRESHOLD: 30 characters</text>

  <text x="250" y="128" font-size="14" fill="#55636F" text-anchor="middle">rule says HAM</text>
  <text x="580" y="128" font-size="14" fill="#55636F" text-anchor="middle">rule says SPAM</text>

  <line x1="90" y1="250" x2="740" y2="250" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#14202B" stroke-width="2">
    <line x1="90" y1="244" x2="90" y2="256"/>
    <line x1="252.5" y1="244" x2="252.5" y2="256"/>
    <line x1="415" y1="244" x2="415" y2="256"/>
    <line x1="577.5" y1="244" x2="577.5" y2="256"/>
    <line x1="740" y1="244" x2="740" y2="256"/>
  </g>
  <g font-size="12" fill="#55636F" text-anchor="middle">
    <text x="90" y="274">10</text><text x="252.5" y="274">20</text><text x="415" y="274">30</text>
    <text x="577.5" y="274">40</text><text x="740" y="274">50</text>
  </g>
  <text x="400" y="298" font-size="14" fill="#55636F" text-anchor="middle">how many characters the message is</text>

  <circle cx="187.5" cy="210" r="9" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="187.5" y="196" font-size="12" fill="#55636F" text-anchor="middle">16</text>
  <circle cx="398.8" cy="210" r="9" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="398.8" y="196" font-size="12" fill="#55636F" text-anchor="middle">29</text>
  <circle cx="431.3" cy="166" r="9" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="431.3" y="152" font-size="12" fill="#55636F" text-anchor="middle">30</text>
  <g transform="translate(452,152) scale(0.28)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>

  <path d="M301.3 182 L311.3 200 L291.3 200 Z" fill="#6D28D9" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="301.3" y="174" font-size="12" fill="#55636F" text-anchor="middle">23</text>
  <g transform="translate(320,170) scale(0.28)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <path d="M447.5 292 L457.5 310 L437.5 310 Z" fill="#6D28D9" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="447.5" y="326" font-size="12" fill="#55636F" text-anchor="middle">31</text>
  <path d="M610 292 L620 310 L600 310 Z" fill="#6D28D9" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="610" y="326" font-size="12" fill="#55636F" text-anchor="middle">42</text>

  <text x="400" y="356" font-size="14" fill="#CC2B1D" text-anchor="middle">30: "can you bring my charger today" - a friend, one character over. Marked spam.</text>
  <text x="400" y="376" font-size="14" fill="#CC2B1D" text-anchor="middle">23: "Your parcel is delayed." - a real scam, seven characters under. Marked ham.</text>
</svg>
