<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label round zero of the descent</title>
  <desc>Eight numbered rows, each with an empty dashed pink box for the answer, covering the whole of round zero of gradient descent on the four delivery rows with features 1 and 1, 1 and 2, 2 and 1, 3 and 1 and labels 0, 0, 1, 1, starting from all three knobs at zero with a learning rate of 1. Row 1 is the probability for every row, which is exactly 0.5. Row 2 is the error on row 3, which is minus 0.5. Row 3 is the slope for weight 1, 0.5 plus 0.5 minus 1.0 minus 1.5 all divided by 4, giving minus 0.375. Row 4 is the slope for weight 2, 0.5 plus 1.0 minus 0.5 minus 0.5 all divided by 4, giving plus 0.125. Row 5 is the slope for the bias, 0.5 plus 0.5 minus 0.5 minus 0.5 all divided by 4, giving exactly 0. Rows 6 and 7 are the two weight updates, giving plus 0.375 and minus 0.125. Row 8 is the loss, minus the natural logarithm of 0.5, which is 0.693147. A panel at the bottom asks for the shape of the gradient, which knob did not move, and why it did not.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label round zero of the descent</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">x1 = 1,1,2,3 &#183; x2 = 1,2,1,1 &#183; y = 0,0,1,1 &#183; all knobs 0 &#183; lr = 1.0</text>

