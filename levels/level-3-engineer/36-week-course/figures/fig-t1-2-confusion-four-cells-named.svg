<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The confusion matrix: all four cells named</title>
  <desc>A two by two square of counts from 1,000 transactions. Top left, true negatives, 880, green. Top right, false positives, 20, red. Bottom left, false negatives, 60, red. Bottom right, true positives, 40, green. A dashed pink line down the right-hand column is labelled a column gives precision, and a dashed blue line across the bottom row is labelled a row gives recall. Three boxes on the right print the arithmetic: precision is 40 divided by 40 plus 20 equals 0.6667, recall is 40 divided by 40 plus 60 equals 0.4000, and accuracy is 880 plus 40 divided by 1000 equals 0.9200, which hides both.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The confusion matrix: all four cells named</text>
  <text x="212" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pred. NOT fraud</text>
  <text x="324" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pred. FRAUD</text>
  <text x="150" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">actually not fraud</text>
  <text x="150" y="229" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">actually fraud</text>
  <rect x="156" y="118" width="112" height="74" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="164" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">TN</text>
  <text x="212" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle">880</text>
  <rect x="268" y="118" width="112" height="74" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="276" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">FP</text>
  <text x="324" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle">20</text>
  <rect x="156" y="192" width="112" height="74" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="164" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">FN</text>
  <text x="212" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle">60</text>
  <rect x="268" y="192" width="112" height="74" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="276" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">TP</text>
  <text x="324" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle">40</text>
  <line x1="268" y1="110" x2="268" y2="274" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="390" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">a COLUMN &#8594; precision</text>
  <line x1="148" y1="192" x2="388" y2="192" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="148" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2">a ROW &#8594; recall</text>
  <rect x="444" y="100" width="336" height="78" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="460" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">PRECISION divides by the flagged COLUMN</text>
  <text x="460" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">40 &#247; (40 + 20) = 0.6667</text>
  <rect x="444" y="194" width="336" height="78" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="460" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">RECALL divides by the real-fraud ROW</text>
  <text x="460" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">40 &#247; (40 + 60) = 0.4000</text>
  <rect x="444" y="288" width="336" height="56" rx="12" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="460" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">accuracy = (880 + 40) &#247; 1000</text>
  <text x="460" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">= 0.9200, and it hides all of the above</text>
  <text x="300" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same four numbers.</text>
  <text x="300" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three different denominators.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">1,000 transactions &#183; 100 real frauds &#183; 60 of them missed</text>
</svg>
