<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>One epoch is one full pass</title>
  <desc>A loop of three steps. Look at all 120 photos, count the mistakes, nudge the dials, then back to the start. A counter in the middle reads pass 37 of 50, and the total is 6000 looks.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="42" font-size="24" fill="#14202B" text-anchor="middle">One trip round the loop = one epoch</text>

    <g fill="none" stroke="#55636F" stroke-width="3" stroke-linecap="round">
      <path d="M338 158 Q412 200 394 284"/>
      <path d="M278 320 H226"/>
      <path d="M106 284 Q88 200 162 158"/>
    </g>
    <path d="M392 296 L381 276 L402 279 Z" fill="#55636F"/>
    <path d="M218 320 L232 312 L232 328 Z" fill="#55636F"/>
    <path d="M167 151 L156 172 L149 154 Z" fill="#55636F"/>

    <rect x="165" y="104" width="170" height="52" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="250" y="122" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1. Look at all</text>
    <text x="250" y="140" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">120 photos</text>

    <rect x="283" y="294" width="170" height="52" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="368" y="312" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2. Count how many</text>
    <text x="368" y="330" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">it got wrong</text>

    <rect x="47" y="294" width="170" height="52" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="132" y="312" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3. Nudge every dial</text>
    <text x="132" y="330" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">a tiny bit</text>

    <circle cx="250" cy="226" r="56" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
    <text x="250" y="212" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">PASS</text>
    <text x="250" y="236" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">37</text>
    <text x="250" y="256" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">of 50</text>

    <text x="250" y="392" font-size="18" fill="#14202B" text-anchor="middle">120 photos &#215; 50 passes = 6,000 looks</text>
    <rect x="86" y="410" width="328" height="42" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="250" y="431" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">A human at one photo a second: 100 minutes.</text>

    <text x="250" y="478" font-size="14" fill="#55636F" text-anchor="middle">Nothing new arrives on pass 37. It is the same photos, looked at again.</text>
  </g>
</svg>
