<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Splitting the photos: the wrong way and the right way</title>
  <desc>Two panels. On the left, marked wrong, all fifty photos per class are uploaded and ten are tested afterwards, so the score measures memory. On the right, marked correct, ten photos are moved into a sealed envelope before uploading, so the score measures learning.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One order works. The other cannot be undone.</text>
  <line x1="400" y1="70" x2="400" y2="352" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="30" y="70" width="340" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="430" y="70" width="340" height="250" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(46,82) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(446,82) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="94" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Split AFTER training</text>
  <text x="494" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Split BEFORE training</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="52" y="150">1. Upload all 50 per class</text>
    <text x="52" y="182">2. Train the model</text>
    <text x="52" y="214">3. Test on 10 of those 50</text>
    <text x="52" y="252">Score: 38 / 40 = 95%</text>
    <text x="452" y="150">1. Move 10 out. Seal them.</text>
    <text x="452" y="182">2. Upload the other 40</text>
    <text x="452" y="214">3. Train, then open envelope</text>
    <text x="452" y="252">Score: 30 / 40 = 75%</text>
  </g>
  <text x="52" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D">Measures MEMORY. Cannot be repaired.</text>
  <text x="452" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">Measures LEARNING. Lower and true.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The 95% is the higher number and the worthless one. There is no way to make a model un-see a photo.</text>
</svg>
