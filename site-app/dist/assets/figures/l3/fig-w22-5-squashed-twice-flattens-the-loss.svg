<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Squashing twice flattens the loss</title>
  <desc>Five raw scores from minus 6 to plus 6, each with two loss numbers. Fed in raw, as BCEWithLogitsLoss expects, the loss runs from 6.0025 down to 0.0025, a range of 6 whole units. Fed in already squashed by a sigmoid, the same five scores give 0.6919 down to 0.3139, a range of only 0.378, so a disaster and a triumph score almost the same.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What happens if you squash twice</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the true label is 1 every time, so a big positive score should score a tiny loss</text>
  <text x="140" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">raw score</text>
  <text x="330" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">loss, fed in raw</text>
  <text x="560" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">loss, squashed twice</text>
  <rect x="60" y="130" width="160" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="140" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8722;6.0</text>
  <rect x="250" y="130" width="160" height="38" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="330" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">6.0025</text>
  <rect x="480" y="130" width="160" height="38" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="560" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.6919</text>
  <rect x="60" y="172" width="160" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="140" y="191" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8722;2.0</text>
  <rect x="250" y="172" width="160" height="38" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="330" y="191" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.1269</text>
  <rect x="480" y="172" width="160" height="38" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="560" y="191" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.6353</text>
  <rect x="60" y="214" width="160" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="140" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.0</text>
  <rect x="250" y="214" width="160" height="38" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="330" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.6931</text>
  <rect x="480" y="214" width="160" height="38" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="560" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.4741</text>
  <rect x="60" y="256" width="160" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="140" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+2.0</text>
  <rect x="250" y="256" width="160" height="38" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="330" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.1269</text>
  <rect x="480" y="256" width="160" height="38" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="560" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.3467</text>
  <rect x="60" y="298" width="160" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="140" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+6.0</text>
  <rect x="250" y="298" width="160" height="38" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="330" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.0025</text>
  <rect x="480" y="298" width="160" height="38" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="560" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.3139</text>
  <rect x="660" y="130" width="120" height="206" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="720" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">range</text>
  <text x="720" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">6.0025</text>
  <text x="720" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">&#8722; 0.0025</text>
  <text x="720" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">= 6.0000</text>
  <line x1="672" y1="240" x2="768" y2="240" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="720" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.6919</text>
  <text x="720" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">&#8722; 0.3139</text>
  <text x="720" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">= 0.3780</text>
  <text x="720" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">16&#215; smaller</text>
  <text x="350" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">squashed twice, a disaster and a triumph score nearly the same</text>
</svg>
