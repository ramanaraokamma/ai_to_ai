  <rect x="448" y="111.6" width="44" height="204.4" rx="2" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <text x="470" y="105.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">96.4</text>
  <rect x="496" y="181.8" width="44" height="134.2" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="518" y="175.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle" font-weight="600">63.3</text>
  <rect x="544" y="107.6" width="44" height="208.4" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
