<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Doubling the steps more than doubles the bill, because the history is paid for again</title>
  <desc>A chart of spend in dollars against tool steps k. The measured points at k 4, 8, 10, 12, 20 and 30 are $0.001649, $0.003585, $0.004748, $0.006041, $0.012513 and $0.023528 and form an upward bend. A dashed straight line fitted through k 4, 8 and 12 reaches only $0.015836 at k 30, about a third too low. Side panels: 3 times the steps costs 4.96 times; the re-sent history is 38 percent of the bill at k 10 and 64 percent at k 30. Numbers from budget.py and budget2.py, Week 29.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The bill bends upward; a straight line misses it</text>
  <line x1="100" y1="300" x2="485" y2="300" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="92" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">$0</text>
  <line x1="100" y1="216" x2="485" y2="216" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="92" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">$0.01</text>
  <line x1="100" y1="132" x2="485" y2="132" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="92" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">$0.02</text>
  <text x="100" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="226.7" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <text x="353.3" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">20</text>
  <text x="480" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">30</text>
  <text x="300" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">tool steps k</text>
  <text x="40" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 40 195)">spend, dollars</text>
  <line x1="100" y1="86" x2="100" y2="300" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="150.7,286.9 480,167" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <polyline points="150.7,286.1 201.3,269.9 226.7,260.1 252,249.3 353.3,194.9 480,102.4" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150.7" cy="286.1" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="201.3" cy="269.9" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="226.7" cy="260.1" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="252" cy="249.3" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="353.3" cy="194.9" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="480" cy="102.4" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <polygon points="480,160 487,173 473,173" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="470" y="94.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">measured $0.023528 (k=30)</text>
  <text x="470" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="end">straight line: $0.015836</text>
  <rect x="520" y="86" width="260" height="64" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="532" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">10 to 30 steps: 3 times</text>
  <text x="532" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">4.96 times the cost</text>
  <rect x="520" y="164" width="260" height="64" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="532" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">re-sent history, share of bill</text>
  <text x="532" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">38% (k=10), 64% (k=30)</text>
  <rect x="520" y="242" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="532" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">line through k = 4, 8, 12</text>
  <text x="532" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D">about a third too low</text>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Spend of a scripted plan at k = 4, 8, 10, 12, 20, 30 (illustrative prices).</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A shape, not a forecast.</text>
</svg>
