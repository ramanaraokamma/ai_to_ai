<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two pocket money plans</title>
  <desc>Two envelopes side by side. Plan A pays one thousand rupees every day for twenty days. Plan B pays one rupee on day one and doubles every day for twenty days. The reader must work out which plan pays more.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Which envelope would you take?</text>
  <line x1="400" y1="70" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- Plan A envelope -->
  <g transform="translate(70,90)">
    <rect x="0" y="0" width="270" height="150" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 10 L135 86 L270 10" fill="none" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="135" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">PLAN A</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="70" y="278">1,000 rupees</text>
    <text x="70" y="304">every single day,</text>
    <text x="70" y="330">for 20 days.</text>
  </g>
  <!-- Plan B envelope -->
  <g transform="translate(460,90)">
    <rect x="0" y="0" width="270" height="150" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 10 L135 86 L270 10" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="135" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">PLAN B</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="460" y="278">1 rupee on day 1,</text>
    <text x="460" y="304">then double it</text>
    <text x="460" y="330">every day, 20 days.</text>
  </g>
  <g transform="translate(360,150) scale(0.8)">
    <circle cx="22" cy="88" r="5" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
    <circle cx="34" cy="76" r="7" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
  </g>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Work out both totals before you choose. Day 20 of Plan B is the surprise.</text>
</svg>
