<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 13 words as pictures</title>
  <desc>Five icon cards in a row. Classification is three labelled bins. Binary classification is two boxes. Multi-class classification is four boxes. Regression is a ruler with a pin anywhere along it. Error is two pins on a line with the gap arrowed.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>

  <rect x="20" y="70" width="140" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="175" y="70" width="140" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="330" y="70" width="140" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="485" y="70" width="140" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="640" y="70" width="140" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <rect x="38" y="120" width="34" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="73" y="120" width="34" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="108" y="120" width="34" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="102" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="90" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">pick one bin</text>
  <text x="90" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">classification</text>
  <text x="90" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">which one?</text>

  <rect x="196" y="120" width="46" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="248" y="120" width="46" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="219" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">yes</text>
  <text x="271" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">no</text>
  <text x="245" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">exactly 2 boxes</text>
  <text x="245" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">binary</text>
  <text x="245" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">binary means two</text>

  <rect x="346" y="120" width="50" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="404" y="120" width="50" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="346" y="154" width="50" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="404" y="154" width="50" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">3 or more boxes</text>
  <text x="400" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">multi-class</text>
  <text x="400" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">multi means many</text>

  <line x1="502" y1="150" x2="608" y2="150" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#55636F" stroke-width="2" stroke-linecap="round">
    <line x1="502" y1="144" x2="502" y2="158"/>
    <line x1="528" y1="146" x2="528" y2="156"/>
    <line x1="555" y1="144" x2="555" y2="158"/>
    <line x1="581" y1="146" x2="581" y2="156"/>
    <line x1="608" y1="144" x2="608" y2="158"/>
  </g>
  <circle cx="570" cy="150" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="555" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">any point allowed</text>
  <text x="555" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">a sliding scale</text>
  <text x="555" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">regression</text>
  <text x="555" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">how much?</text>

  <line x1="658" y1="150" x2="762" y2="150" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="686" cy="150" r="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <circle cx="736" cy="150" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2.5"/>
  <g stroke="#14202B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="686" y1="176" x2="736" y2="176"/>
    <polyline points="693,170 686,176 693,182"/>
    <polyline points="729,170 736,176 729,182"/>
  </g>
  <text x="711" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">guess … truth</text>
  <text x="710" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the gap</text>
  <text x="710" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">error</text>
  <text x="710" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">how far off</text>

  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Bins on the left, a ruler on the right. Everything this week hangs off that one picture.</text>
</svg>
