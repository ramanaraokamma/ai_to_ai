<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week&#8217;s words, drawn</title>
  <desc>Six small pictures. Term frequency and document frequency: for the word great over four reviews, tf equals 2 in d3 and df equals 2 because d1 and d3 contain it, so the word appears 3 times in total but in only 2 documents. Inverse document frequency: the formula idf equals the natural log of 1 plus 4 over 1 plus df, plus 1, then a three-row table, and with df 1 scores 1.9163, great with df 2 scores 1.5108, pizza with df 3 scores 1.2231, so the rarer word gets the bigger boost. TF-IDF: great in d3 is 2 times 1.510826 equals 3.021651, divided by 3.592917, equals 0.841002. L2 normalization: 0.841002 squared plus 0.340432 squared plus 0.420501 squared equals 1.000000, so every row ends with length 1 and length stops deciding. Cosine similarity: two arrows from one corner, a equals 2 comma 1 comma 0 and b equals 1 comma 2 comma 0, with 4 divided by the square root of 5 times the square root of 5 equals 0.8, an angle of 36.87 degrees. N-gram: not fresh shown first as two separate 1-gram blocks and then as one purple 2-gram block, which Week 33 measures.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week&#8217;s words, drawn</text>
  <rect x="26" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="282" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="538" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
