<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the three channels</title>
  <desc>A two by two colour picture of red, yellow, blue and white pixels, with an arrow leading to three unlabelled two by two number grids marked A, B and C. Marker D sits on the yellow pixel. Four empty boxes are provided for naming each channel and writing the yellow pixel's three numbers.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the three channels</text><rect x="50" y="100" width="48" height="48" fill="#FF0000" stroke="#C7CDD4" stroke-width="1"/><rect x="98" y="100" width="48" height="48" fill="#FFFF00" stroke="#C7CDD4" stroke-width="1"/><rect x="50" y="148" width="48" height="48" fill="#0000FF" stroke="#C7CDD4" stroke-width="1"/><rect x="98" y="148" width="48" height="48" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><rect x="50" y="100" width="96" height="96" fill="none" stroke="#14202B" stroke-width="3"/><text x="98" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the picture</text><circle cx="122" cy="124" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="122" y="125" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">D</text><line x1="160" y1="148" x2="196" y2="148" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(196 148) rotate(0.0)"/><rect x="230" y="104" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="252.0" y="130.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="274" y="104" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="296.0" y="130.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="230" y="148" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="252.0" y="174.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="274" y="148" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="296.0" y="174.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="230" y="104" width="88" height="88" fill="none" stroke="#14202B" stroke-width="3"/><circle cx="274" cy="84" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="274" y="85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text><rect x="380" y="104" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="402.0" y="130.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="424" y="104" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="446.0" y="130.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="380" y="148" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="402.0" y="174.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="424" y="148" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="446.0" y="174.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="380" y="104" width="88" height="88" fill="none" stroke="#14202B" stroke-width="3"/><circle cx="424" cy="84" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="424" y="85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text><rect x="530" y="104" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="552.0" y="130.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="574" y="104" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="596.0" y="130.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="530" y="148" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="552.0" y="174.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="574" y="148" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="596.0" y="174.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="530" y="104" width="88" height="88" fill="none" stroke="#14202B" stroke-width="3"/><circle cx="574" cy="84" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="574" y="85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">C</text><text x="700" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">which is</text><text x="700" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">which?</text><text x="40" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">A  channel:</text><rect x="40" y="254" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="220" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">B  channel:</text><rect x="220" y="254" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="400" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">C  channel:</text><rect x="400" y="254" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="580" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">D  this pixel's three numbers:</text><rect x="580" y="254" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="400" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Each grid holds one number per pixel. Work out which colour each grid must belong to.</text><text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Reminder: red is (255, 0, 0), yellow is (255, 255, 0), blue is (0, 0, 255), white is all three at full.</text>
  </g>
</svg>
