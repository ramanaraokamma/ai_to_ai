<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw where the leak was hiding</title>
  <desc>One large empty framed panel for the student's own drawing, with a panel underneath listing what a good answer contains: the 2,000-row table with the late column marked, an arrow into a group holding exactly one order, that order's own label, the rate written as 1 divided by 1, the arrow returning into the feature column, the three scores 0.9240, 0.7535 and 0.6115, and the question about whether the value exists when the order is placed.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw where the leak was hiding</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One group of one order, and what its &#8216;rate&#8217; really is.</text>
  <rect x="30" y="86" width="440" height="300" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">your drawing goes here</text>
  <rect x="30" y="400" width="440" height="276" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the 2,000-row table, with the late column marked</text>
  <text x="48" y="476" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; an arrow into a box: CrustyBros, Fri, clear, 16</text>
  <text x="48" y="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; that box holding ONE order, whose late = 1</text>
  <text x="48" y="524" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the rate as 1 &#247; 1 = 1.0, marked &#8216;its own answer&#8217;</text>
  <text x="48" y="548" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the arrow going back into the feature column</text>
  <text x="48" y="572" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the three scores on the page: 0.9240 fake,</text>
  <text x="48" y="596" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">   0.7535 honest, 0.6115 rebuilt from train only</text>
  <text x="48" y="620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; and the question: at the moment the order is</text>
  <text x="48" y="644" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">   placed, does this value exist?  No.</text>
</svg>
