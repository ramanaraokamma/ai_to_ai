<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Five icon cards. A loop is a ring you go round with an arrow. An iteration is one single trip round that ring, shown as one highlighted segment out of four. A range is a factory hopper handing out the values zero, one, two and three onto a belt. An accumulator is one box named total that goes from empty to 88 to 180 to 250 as cards drop in. An off-by-one is twelve cards going in and eleven prompts coming out, with the last card left over and no error message.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>

  <rect x="20" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="174" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="328" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="482" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="636" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M118 118 A26 26 0 1 1 92 118" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-10,-7 0,0 -10,7" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(92 118) rotate(-30)"/>
  <circle cx="105" cy="144" r="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="105" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">n</text>
  <line x1="105" y1="168" x2="105" y2="188" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="92" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a block Python</text>
  <text x="92" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">runs more than</text>
  <text x="92" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">once</text>
  <text x="92" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">loop</text>

  <circle cx="246" cy="136" r="34" fill="none" stroke="#C7CDD4" stroke-width="3"/>
  <path d="M246 102 A34 34 0 0 1 280 136" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round"/>
  <text x="246" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1 of 4</text>
  <text x="246" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one single trip</text>
  <text x="246" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">round the ring.</text>
  <text x="246" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Out loud we say</text>
  <text x="246" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8220;a pass&#8221;</text>
  <text x="246" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">iteration</text>

  <path d="M356 92 H444 L424 132 H376 Z" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <line x1="352" y1="150" x2="448" y2="150" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round">
    <rect x="352" y="158" width="22" height="22" rx="5" fill="#D9EAF9"/>
    <rect x="378" y="158" width="22" height="22" rx="5" fill="#D9EAF9"/>
    <rect x="404" y="158" width="22" height="22" rx="5" fill="#D9EAF9"/>
    <rect x="430" y="158" width="22" height="22" rx="5" fill="#D9EAF9"/>
  </g>
  <text x="363" y="169" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="389" y="169" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="415" y="169" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="441" y="169" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="400" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a value factory.</text>
  <text x="400" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One number per</text>
  <text x="400" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pass. Stops early.</text>
  <text x="400" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">range</text>

  <g stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round">
    <rect x="500" y="96" width="108" height="30" rx="8" fill="#FFFFFF"/>
    <rect x="500" y="132" width="108" height="30" rx="8" fill="#E2F7ED"/>
    <rect x="500" y="168" width="108" height="30" rx="8" fill="#E2F7ED"/>
  </g>
  <text x="554" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">total = 0</text>
  <text x="554" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">total = 88</text>
  <text x="554" y="183" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">total = 180</text>
  <text x="554" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one box, not three.</text>
  <text x="554" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Made before, added</text>
  <text x="554" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">to inside, used after</text>
  <text x="554" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">accumulator</text>

  <g stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round">
    <rect x="652" y="96" width="24" height="18" rx="4" fill="#D9EAF9"/>
    <rect x="652" y="118" width="24" height="18" rx="4" fill="#D9EAF9"/>
    <rect x="652" y="140" width="24" height="18" rx="4" fill="#D9EAF9"/>
    <rect x="652" y="162" width="24" height="18" rx="4" fill="#D9EAF9"/>
  </g>
  <text x="664" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">12 in</text>
  <g stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round">
    <rect x="716" y="96" width="24" height="18" rx="4" fill="#FFFFFF"/>
    <rect x="716" y="118" width="24" height="18" rx="4" fill="#FFFFFF"/>
    <rect x="716" y="140" width="24" height="18" rx="4" fill="#FFFFFF"/>
  </g>
  <rect x="716" y="162" width="24" height="18" rx="4" fill="none" stroke="#CC2B1D" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>
  <text x="728" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">11 out</text>
  <text x="700" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one pass too few.</text>
  <text x="700" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">No error message.</text>
  <text x="700" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Counting finds it.</text>
  <text x="708" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">off-by-one</text>

  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Five words. Four of them are about counting, and the fifth is what happens when you count wrong.</text>
</svg>
