<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>An 80 20 split dealt as two unequal piles</title>
  <desc>A shuffled stack of thirty cards at the top splits into two piles. The left pile holds twenty-four training cards, the right pile holds six test cards which go into an envelope. The arithmetic underneath shows zero point two times thirty equals six.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">Deal 30 shuffled cards into two unequal piles</text>

    <g stroke="#55636F" stroke-width="2" fill="none">
      <path d="M362 128 L250 166"/>
      <path d="M438 128 L560 166"/>
    </g>

    <g transform="translate(360,54)">
      <rect x="8" y="10" width="80" height="56" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round" transform="rotate(-7 48 38)"/>
      <rect x="4" y="6" width="80" height="56" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round" transform="rotate(5 44 34)"/>
      <rect x="0" y="8" width="80" height="56" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <text x="40" y="42" font-size="18" fill="#14202B" text-anchor="middle">30</text>
    </g>
    <text x="400" y="140" font-size="14" fill="#55636F" text-anchor="middle">shuffled face down</text>

    <rect x="40" y="152" width="380" height="152" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="230" y="178" font-size="18" fill="#14202B" text-anchor="middle">TRAINING SET - 24 cards (80%)</text>
    <g fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round">
      <rect x="67" y="192" width="46" height="20" rx="4"/><rect x="123" y="192" width="46" height="20" rx="4"/><rect x="179" y="192" width="46" height="20" rx="4"/><rect x="235" y="192" width="46" height="20" rx="4"/><rect x="291" y="192" width="46" height="20" rx="4"/><rect x="347" y="192" width="46" height="20" rx="4"/>
      <rect x="67" y="220" width="46" height="20" rx="4"/><rect x="123" y="220" width="46" height="20" rx="4"/><rect x="179" y="220" width="46" height="20" rx="4"/><rect x="235" y="220" width="46" height="20" rx="4"/><rect x="291" y="220" width="46" height="20" rx="4"/><rect x="347" y="220" width="46" height="20" rx="4"/>
      <rect x="67" y="248" width="46" height="20" rx="4"/><rect x="123" y="248" width="46" height="20" rx="4"/><rect x="179" y="248" width="46" height="20" rx="4"/><rect x="235" y="248" width="46" height="20" rx="4"/><rect x="291" y="248" width="46" height="20" rx="4"/><rect x="347" y="248" width="46" height="20" rx="4"/>
      <rect x="67" y="276" width="46" height="20" rx="4"/><rect x="123" y="276" width="46" height="20" rx="4"/><rect x="179" y="276" width="46" height="20" rx="4"/><rect x="235" y="276" width="46" height="20" rx="4"/><rect x="291" y="276" width="46" height="20" rx="4"/><rect x="347" y="276" width="46" height="20" rx="4"/>
    </g>

    <rect x="450" y="152" width="310" height="152" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="605" y="178" font-size="18" fill="#14202B" text-anchor="middle">TEST SET - 6 cards (20%)</text>
    <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
      <rect x="526" y="196" width="46" height="24" rx="4"/><rect x="582" y="196" width="46" height="24" rx="4"/><rect x="638" y="196" width="46" height="24" rx="4"/>
      <rect x="526" y="230" width="46" height="24" rx="4"/><rect x="582" y="230" width="46" height="24" rx="4"/><rect x="638" y="230" width="46" height="24" rx="4"/>
    </g>
    <text x="605" y="284" font-size="14" fill="#55636F" text-anchor="middle">straight into the envelope, unseen</text>

    <text x="400" y="336" font-size="18" fill="#14202B" text-anchor="middle">0.20 x 30 = 6 test&#160;&#160;&#160;&#160;30 - 6 = 24 train&#160;&#160;&#160;&#160;check: 24 + 6 = 30</text>
    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Shuffle first. An unshuffled deal can hand you six cards that are all the same class.</text>
  </g>
</svg>
