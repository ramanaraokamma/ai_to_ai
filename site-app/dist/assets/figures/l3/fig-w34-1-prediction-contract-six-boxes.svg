<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The prediction contract, six boxes</title>
  <desc>Six numbered boxes, all filled in. Box 1: one prediction is about one review written by one person. Box 2: input is a field called text, a non-empty string, limit 100 kilobytes. Box 3: output is label, probability, threshold, model_version and latency_ms. Box 4: the two errors priced &#8212; a nasty review called positive costs 10, a nice review called negative costs 1. Box 5: the threshold, with the cost arithmetic on 16 validation rows &#8212; at 0.50 the cost is 10 times 1 plus 1 times 1 equals 11, at 0.55 it is 10 times 0 plus 1 times 5 equals 5, so 0.55 ships. Box 6: never used for banning anybody or marking schoolwork.</desc>

  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The prediction contract, six boxes</text>

  <!-- box 1 -->
  <rect x="40" y="62" width="230" height="122" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="64" cy="86" r="14" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <text x="64" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1</text>
  <text x="88" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">ONE PREDICTION IS ABOUT</text>
  <text x="58" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">one review, written by</text>
  <text x="58" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">one person, at one time</text>
  <text x="58" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">not a person. not an account.</text>

  <!-- box 2 -->
  <rect x="285" y="62" width="230" height="122" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="309" cy="86" r="14" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="309" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2</text>
  <text x="333" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">INPUT</text>
  <text x="303" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">text</text>
  <text x="303" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">a non-empty string</text>
  <text x="303" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">limit 100,000 bytes</text>

  <!-- box 3 -->
  <rect x="530" y="62" width="230" height="122" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="554" cy="86" r="14" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="554" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">3</text>
  <text x="578" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">OUTPUT &#8212; five fields</text>
  <text x="548" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">label  probability</text>
  <text x="548" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">threshold  latency_ms</text>
  <text x="548" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">model_version</text>
  <text x="548" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the log and the reply share these</text>

  <!-- box 4 -->
  <rect x="40" y="198" width="230" height="122" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="64" cy="222" r="14" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2"/>
  <text x="64" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4</text>
  <text x="88" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">THE TWO ERRORS, PRICED</text>
  <text x="58" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">nasty called positive</text>
  <text x="58" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">and never read: 10</text>
  <text x="58" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">nice read anyway: 1</text>

  <!-- box 5 -->
  <rect x="285" y="198" width="230" height="122" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="309" cy="222" r="14" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <text x="309" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">5</text>
  <text x="333" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">THE THRESHOLD</text>
  <text x="303" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">cost on the 16 validation rows</text>
  <text x="303" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.50: 10&#215;1 + 1&#215;1 = 11</text>
  <text x="303" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.55: 10&#215;0 + 1&#215;5 =  5</text>
  <text x="303" y="311" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">so ship 0.55</text>

  <!-- box 6 -->
  <rect x="530" y="198" width="230" height="122" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="554" cy="222" r="14" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2"/>
  <text x="554" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">6</text>
  <text x="578" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">NEVER USED FOR</text>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="550" y1="248" x2="562" y2="260"/>
    <line x1="562" y1="248" x2="550" y2="260"/>
    <line x1="550" y1="276" x2="562" y2="288"/>
    <line x1="562" y1="276" x2="550" y2="288"/>
  </g>
  <text x="574" y="259" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">banning anybody</text>
  <text x="574" y="287" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">marking schoolwork</text>
  <text x="548" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">it suggests. it does not decide.</text>

  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">All six filled in before one line of serving code is written. Box 5 is arithmetic, not taste.</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Boxes 4 and 6 are the two nobody writes, and they are the two a stranger needs most.</text>
</svg>
