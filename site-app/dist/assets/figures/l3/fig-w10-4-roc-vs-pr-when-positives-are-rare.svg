<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Same nine thresholds, two very different pictures</title>
  <desc>Two charts of the same nine threshold rows from the fraud sweep. On the left an ROC curve with recall up the side and false positive rate along the bottom, area 0.6116, with a dashed diagonal for a coin. On the right the precision-recall curve for exactly the same nine rows, average precision 0.2078, with a dashed line at 0.0140 for a coin. Three points are ringed and numbered on both charts: 1 is threshold 0.12, 2 is threshold 0.10, 3 is threshold 0.02. Between points 2 and 3 the ROC moves gently across because 211 false alarms divided by 986 real legitimate rows is only 0.2140, while precision collapses from 0.3750 to 5 divided by 216 equals 0.0231.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same nine thresholds, two very different pictures</text>
  <text x="200" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">ROC &#183; AUC 0.6116</text>
  <text x="570" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Precision-Recall &#183; AP 0.2078</text>
  <line x1="96" y1="300" x2="296" y2="100" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <polyline points="96,300 96,285.7 96,271.4 97,257.1 98.4,257.1 100.5,257.1 108.4,242.9 138.8,228.6 181.4,185.7" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="96" y1="84" x2="96" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="96" y1="300" x2="310" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="96" y1="300" x2="96" y2="306" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="96" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="90" y1="300" x2="96" y2="300" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="196" y1="300" x2="196" y2="306" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="196" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="90" y1="200" x2="96" y2="200" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <line x1="296" y1="300" x2="296" y2="306" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="296" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="90" y1="100" x2="96" y2="100" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <text x="196" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">false positive rate</text>
  <text x="54" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 54 200)">recall</text>
  <text x="200" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a coin</text>
  <line x1="468" y1="297.2" x2="668" y2="297.2" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="528" y="289.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a coin gets 0.0140, the fraud rate</text>
  <polyline points="482.3,100 496.6,100 510.9,225 510.9,260 510.9,276 525.1,287.7 539.4,295.4 582.3,296.3" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="468" y1="84" x2="468" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="468" y1="300" x2="682" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="468" y1="300" x2="468" y2="306" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="468" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="462" y1="300" x2="468" y2="300" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="458" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="568" y1="300" x2="568" y2="306" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="568" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="462" y1="200" x2="468" y2="200" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="458" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <line x1="668" y1="300" x2="668" y2="306" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="668" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="462" y1="100" x2="468" y2="100" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="458" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <text x="568" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">recall</text>
  <text x="426" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 426 200)">precision</text>
  <circle cx="96" cy="271.4" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="96" y="271.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <circle cx="496.6" cy="100" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="496.6" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <circle cx="97" cy="257.1" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="97" y="257.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <circle cx="510.9" cy="225" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="510.9" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <circle cx="138.8" cy="228.6" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="138.8" y="228.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <circle cx="539.4" cy="295.4" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="539.4" y="295.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">At t = 0.02, 211 false alarms slide the ROC across by only 211 &#247; 986 = 0.2140</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">but they crush precision to 5 &#247; 216 = 0.0231</text>
</svg>
