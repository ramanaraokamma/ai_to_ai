  <circle cx="349" cy="320" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <polygon points="437,273 444,286 430,286" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="463,291 470,304 456,304" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="445,309 452,322 438,322" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="473,317 480,330 466,330" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="395,268 407,298 387,328" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="301" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">it changes its mind: p = 0.5</text>
  <rect x="544" y="224" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="558" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">symmetry</text>
