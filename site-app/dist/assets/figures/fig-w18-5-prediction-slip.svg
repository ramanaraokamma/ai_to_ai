<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The prediction slip blank and filled in</title>
  <desc>Two note slips side by side. The left slip is the blank template with spaces for the run number, what was changed, the predicted score out of five, and the reason. The right slip is filled in for run two, one background only, predicting four out of five, with the actual result of two out of five written in red underneath.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">The prediction slip - written before you press Train</text>

    <rect x="40" y="80" width="340" height="250" rx="12" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <line x1="40" y1="118" x2="380" y2="118" stroke="#845F00" stroke-width="3"/>
    <text x="210" y="105" font-size="16" fill="#14202B" text-anchor="middle">BEFORE - the blank slip</text>
    <g font-size="14" fill="#14202B">
      <text x="60" y="148">Run number: ______</text>
      <text x="60" y="180">What I changed:</text>
      <text x="60" y="230">I predict the score will be ____ / 5</text>
      <text x="60" y="262">because</text>
    </g>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="60" y1="200" x2="360" y2="200"/>
      <line x1="60" y1="282" x2="360" y2="282"/>
      <line x1="60" y1="308" x2="360" y2="308"/>
    </g>

    <rect x="420" y="80" width="340" height="250" rx="12" fill="#F5F8FA" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <line x1="420" y1="118" x2="760" y2="118" stroke="#845F00" stroke-width="3"/>
    <text x="590" y="105" font-size="16" fill="#14202B" text-anchor="middle">AFTER - a real one</text>
    <g font-size="14" fill="#14202B">
      <text x="440" y="148">Run number: 2</text>
      <text x="440" y="180">What I changed: one background only</text>
      <text x="440" y="230">I predict the score will be 4 / 5</text>
      <text x="440" y="262">because the table is in every photo, so</text>
      <text x="440" y="284">it should still be fine here on the table.</text>
    </g>
    <line x1="440" y1="200" x2="740" y2="200" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="440" y="314" font-size="14" fill="#CC2B1D">Actual: 2 / 5. I was wrong, and here is why.</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">You write it, you keep it, and you report it even when you were wrong.</text>
  </g>
</svg>
