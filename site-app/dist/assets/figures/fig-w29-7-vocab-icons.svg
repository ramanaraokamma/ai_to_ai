<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week’s five words</title>
  <desc>Five labelled panels: sampling drawn as a bag and a die, greedy drawn as bars with the tallest ringed, prompt drawn as an arrow into a word chip, context drawn as a window showing only one of three words, and hallucination drawn as a written sentence with a red FALSE stamp across it.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week’s five words</text>
  <rect x="26" y="68" width="140" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="178" y="68" width="140" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="330" y="68" width="140" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="482" y="68" width="140" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="634" y="68" width="140" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g transform="translate(42,96) scale(0.78)">
    <path d="M24 30 H76 L84 90 H16 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M24 30 Q34 12 50 12 Q66 12 76 30" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="46" x2="84" y2="46" stroke="#845F00" stroke-width="2"/>
  </g>
  <g transform="translate(104,150) scale(0.62)"><rect x="4" y="4" width="52" height="52" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/><circle cx="18" cy="18" r="4.5" fill="#14202B"/><circle cx="30" cy="30" r="4.5" fill="#14202B"/><circle cx="42" cy="42" r="4.5" fill="#14202B"/></g>
  <text x="96" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">sampling</text>
  <text x="96" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pick at random,</text>
  <text x="96" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">common words</text>
  <text x="96" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">get more chances</text>
  <line x1="200" y1="190" x2="298" y2="190" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="208" y="124" width="22" height="66" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="219" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <rect x="238" y="162" width="22" height="28" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="249" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <rect x="268" y="162" width="22" height="28" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="279" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <circle cx="219" cy="157" r="26" fill="none" stroke="#C42B8C" stroke-width="3"/>
  <text x="248" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">always the biggest</text>
  <text x="248" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">greedy</text>
  <text x="248" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">always take the</text>
  <text x="248" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">highest count,</text>
  <text x="248" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">never roll</text>
  <line x1="344" y1="152" x2="364" y2="152" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="359,145 370,152 359,159" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="376" y="132" width="64" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="408.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">the</text>
  <text x="400" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you start it here</text>
  <text x="400" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">prompt</text>
  <text x="400" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the text you give</text>
  <text x="400" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it to start from</text>
  <rect x="498" y="106" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="552" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#C7CDD4" text-anchor="middle" dominant-baseline="central">amma</text>
  <rect x="498" y="140" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="552" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#C7CDD4" text-anchor="middle" dominant-baseline="central">takes</text>
  <rect x="498" y="174" width="108" height="28" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="552" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">the</text>
  <rect x="492" y="168" width="120" height="40" rx="8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="552" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it can see one word</text>
  <text x="552" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">context</text>
  <text x="552" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">how many words</text>
  <text x="552" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">back it can look</text>
  <rect x="648" y="118" width="112" height="58" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="660" y1="134" x2="748" y2="134" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
  <line x1="660" y1="148" x2="748" y2="148" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
  <line x1="660" y1="162" x2="726" y2="162" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
  <g transform="rotate(-9 704 148)">
  <rect x="642" y="132" width="124" height="32" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="704" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle" font-weight="600" dominant-baseline="central">FALSE</text>
  </g>
  <text x="704" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">reads well, is untrue</text>
  <text x="704" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle">hallucination</text>
  <text x="704" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">when it produces</text>
  <text x="704" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">something that sounds</text>
  <text x="704" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">right but is not true</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Five words. Between them they explain almost everything a chatbot does.</text>
</svg>
