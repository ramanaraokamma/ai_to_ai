<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Before and after training: eight cards in, one rule out</title>
  <desc>Two panels. Before training, eight labelled cards sit in front of a learner and the rule box is empty. After training the cards have been taken away and the rule box holds one written rule: if it gives to a squeeze and smells sweet then ripe. The cards are gone but the rule remains.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">Training ends. The cards go. The rule stays.</text>
    <line x1="400" y1="60" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <rect x="30" y="60" width="340" height="270" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="200" y="86" font-size="18" fill="#14202B" text-anchor="middle">BEFORE — studying</text>
    <g stroke="#1F6FB2" stroke-width="2" fill="#D9EAF9" stroke-linejoin="round">
      <rect x="54" y="100" width="66" height="44" rx="6"/>
      <rect x="132" y="100" width="66" height="44" rx="6"/>
      <rect x="210" y="100" width="66" height="44" rx="6"/>
      <rect x="288" y="100" width="66" height="44" rx="6"/>
      <rect x="54" y="154" width="66" height="44" rx="6"/>
      <rect x="132" y="154" width="66" height="44" rx="6"/>
      <rect x="210" y="154" width="66" height="44" rx="6"/>
      <rect x="288" y="154" width="66" height="44" rx="6"/>
    </g>
    <g font-size="12" fill="#14202B" text-anchor="middle">
      <text x="87" y="127">card 1</text><text x="165" y="127">card 2</text><text x="243" y="127">card 3</text><text x="321" y="127">card 4</text>
      <text x="87" y="181">card 5</text><text x="165" y="181">card 6</text><text x="243" y="181">card 7</text><text x="321" y="181">card 8</text>
    </g>
    <rect x="54" y="216" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/>
    <text x="204" y="240" font-size="14" fill="#6D28D9" text-anchor="middle">MY RULE:</text>
    <text x="204" y="262" font-size="14" fill="#55636F" text-anchor="middle">(still empty)</text>
    <text x="200" y="306" font-size="14" fill="#55636F" text-anchor="middle">8 labelled examples in front of you</text>

    <rect x="430" y="60" width="340" height="270" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="600" y="86" font-size="18" fill="#14202B" text-anchor="middle">AFTER — cards taken away</text>
    <g stroke="#C7CDD4" stroke-width="1.5" fill="none" stroke-dasharray="5 5" stroke-linejoin="round">
      <rect x="454" y="100" width="66" height="44" rx="6"/>
      <rect x="532" y="100" width="66" height="44" rx="6"/>
      <rect x="610" y="100" width="66" height="44" rx="6"/>
      <rect x="688" y="100" width="66" height="44" rx="6"/>
      <rect x="454" y="154" width="66" height="44" rx="6"/>
      <rect x="532" y="154" width="66" height="44" rx="6"/>
      <rect x="610" y="154" width="66" height="44" rx="6"/>
      <rect x="688" y="154" width="66" height="44" rx="6"/>
    </g>
    <text x="604" y="155" font-size="18" fill="#CC2B1D" text-anchor="middle">gone</text>
    <rect x="454" y="216" width="300" height="60" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="604" y="238" font-size="14" fill="#6D28D9" text-anchor="middle">MY RULE:</text>
    <text x="604" y="262" font-size="14" fill="#14202B" text-anchor="middle">gives to a squeeze AND smells sweet = ripe</text>
    <text x="600" y="306" font-size="14" fill="#55636F" text-anchor="middle">The rule is the only thing left. That is the model.</text>

    <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">A model is not a box of the examples. The examples are gone. What survives is the rule they produced.</text>
  </g>
</svg>
