<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Explained variance is the promise, rebuild error is the bill</title>
  <desc>A four-row table for the 178 scaled wines. With 2 components the running share is 0.5541 and the average rebuild miss is 2.2550; with 6 it is 0.8510 and 1.3258; with 8 it is 0.9202 and 0.9599; with all 13 it is 1.0000 and exactly 0.0000. Beside it, two bars compared against the yardstick that a typical wine sits 3.5180 from the middle: 2.2550 divided by 3.5180 is 0.6410, and 1.3258 divided by 3.5180 is 0.3769.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One number promises. The other one bills.</text>
  <rect x="40" y="70" width="340" height="190" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="60" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">PCs</text>
  <text x="170" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">share kept</text>
  <text x="288" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">miss</text>
  <line x1="56.00" y1="106.00" x2="364.00" y2="106.00" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="66" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C">2</text>
  <text x="170" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C">0.5541</text>
  <text x="280" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C">2.2550</text>
  <text x="66" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C">6</text>
  <text x="170" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C">0.8510</text>
  <text x="280" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C">1.3258</text>
  <text x="66" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">8</text>
  <text x="170" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0.9202</text>
  <text x="280" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0.9599</text>
  <text x="66" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">13</text>
  <text x="170" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1.0000</text>
  <text x="280" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">0.0000</text>
  <text x="60" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the bill is in standardised units</text>
  <rect x="408" y="70" width="352" height="190" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="584" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">how big is a miss of 2.2550?</text>
  <rect x="440" y="128.5055555555556" width="54" height="107.49444444444443" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="467" y="118.50555555555559" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3.5180</text>
  <rect x="544" y="167.09722222222223" width="54" height="68.90277777777777" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="571" y="157.09722222222223" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2.2550</text>
  <rect x="648" y="195.48944444444444" width="54" height="40.51055555555556" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="675" y="185.48944444444444" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1.3258</text>
  <line x1="430.00" y1="236.00" x2="740.00" y2="236.00" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="467" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">typical</text>
  <text x="571" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 PCs</text>
  <text x="675" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6 PCs</text>
  <rect x="40" y="284" width="720" height="72" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="60" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">2.2550 &#247; 3.5180 = 0.6410   &#8212;   two components miss by 64% of a typical distance</text>
  <text x="60" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">1.3258 &#247; 3.5180 = 0.3769   &#8212;   six components miss by 38%</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">55% of the spread kept sounds better than missing by 64%. Same fact.</text>
</svg>
