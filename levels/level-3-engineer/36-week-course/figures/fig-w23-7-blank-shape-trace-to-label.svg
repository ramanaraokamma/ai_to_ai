<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Write the shape after every part</title>
  <desc>Six stages stacked down the page with an arrow between each: a batch of digits, then fc1 which is nn.Linear(64, 64), then nn.ReLU(), then nn.Dropout(0.2), then fc2 which is nn.Linear(64, 10), then ten scores per digit. Only the first shape chip is filled in, reading 32 by 64. The other five chips are empty for the student to write in; the answers are 32 by 64 three times and then 32 by 10 twice. Two questions underneath ask which of the two numbers never changes and which part turned 64 into 10.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Write the shape after every part</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">32 digits at a time, 64 numbers each</text>
  <rect x="48" y="100" width="240" height="48" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="64" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">a batch of digits</text>
  <rect x="310" y="108" width="140" height="32" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="380" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">(32, 64)</text>
  <line x1="168" y1="148" x2="168" y2="164" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="168,174 162,162 174,162" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="48" y="178" width="240" height="48" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="64" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">fc1  nn.Linear(64, 64)</text>
  <rect x="310" y="186" width="140" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <line x1="168" y1="226" x2="168" y2="242" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="168,252 162,240 174,240" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="48" y="256" width="240" height="48" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="64" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">nn.ReLU()</text>
  <rect x="310" y="264" width="140" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <line x1="168" y1="304" x2="168" y2="320" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="168,330 162,318 174,318" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="48" y="334" width="240" height="48" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="64" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">nn.Dropout(0.2)</text>
  <rect x="310" y="342" width="140" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <line x1="168" y1="382" x2="168" y2="398" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="168,408 162,396 174,396" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="48" y="412" width="240" height="48" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="64" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">fc2  nn.Linear(64, 10)</text>
  <rect x="310" y="420" width="140" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <line x1="168" y1="460" x2="168" y2="476" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="168,486 162,474 174,474" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="48" y="490" width="240" height="48" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="64" y="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">ten scores per digit</text>
  <rect x="310" y="498" width="140" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="48" y="588" width="402" height="62" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="64" y="614" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">which of the two numbers never changes?</text>
  <text x="64" y="636" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">and which part changed 64 into 10?</text>
  <text x="250" y="674" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">only the first chip is filled in. Write the other five.</text>
</svg>
