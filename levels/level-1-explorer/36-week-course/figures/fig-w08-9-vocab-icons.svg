<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 8 words as pictures</title>
  <desc>Five icon cards in a row. Edge case is a figure standing right on a dashed boundary line. False alarm is a ringing bell over a good letter in a bin. Miss is a silent bell with a scam letter in the inbox. First match wins is a ladder where rung one stops the input and the rungs below are never read. Labelled example is a message card with a tag reading spam tied to it.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
  <rect x="20" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="176" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="332" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="488" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="644" y="58" width="136" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- 1 edge case : a child standing on the boundary -->
  <g transform="translate(36,90)">
    <line x1="62" y1="0" x2="62" y2="122" stroke="#C42B8C" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
    <text x="62" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">the line: 140 cm</text>
    <g transform="translate(30,32) scale(0.62)">
      <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="50" r="4" fill="#14202B"/>
      <circle cx="60" cy="50" r="4" fill="#14202B"/>
      <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="34" y="20" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">138</text>
  </g>
  <text x="93" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">edge case</text>
  <text x="93" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">an example the rule gets</text>
  <text x="93" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">wrong, right at its edge</text>

  <!-- 2 false alarm : bell ringing, good letter in the bin -->
  <g transform="translate(196,92)">
    <path d="M28 34 A22 22 0 0 1 72 34 V54 L80 66 H20 L28 54 Z" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M42 70 A8 8 0 0 0 58 70" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round">
      <line x1="10" y1="20" x2="2" y2="12"/>
      <line x1="90" y1="20" x2="98" y2="12"/>
    </g>
    <rect x="20" y="86" width="60" height="34" rx="5" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20 90 L50 108 L80 90" fill="none" stroke="#14202B" stroke-width="2"/>
    <text x="50" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a real message,</text>
    <text x="50" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">in the junk bin</text>
  </g>
  <text x="249" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">false alarm</text>
  <text x="249" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it said yes,</text>
  <text x="249" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the truth was no</text>

  <!-- 3 miss : bell silent, scam letter arrives -->
  <g transform="translate(352,92)">
    <path d="M28 34 A22 22 0 0 1 72 34 V54 L80 66 H20 L28 54 Z" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
    <path d="M42 70 A8 8 0 0 0 58 70" fill="none" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="70" x2="82" y2="24" stroke="#55636F" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="86" width="60" height="34" rx="5" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20 90 L50 108 L80 90" fill="none" stroke="#CC2B1D" stroke-width="2"/>
    <text x="50" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a scam, sitting</text>
    <text x="50" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">in your inbox</text>
  </g>
  <text x="405" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">miss</text>
  <text x="405" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it said no,</text>
  <text x="405" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the truth was yes</text>

  <!-- 4 first match wins : rung 1 stops it -->
  <g transform="translate(502,92)">
    <rect x="0" y="0" width="118" height="26" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="38" width="118" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="0" y="76" width="118" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
      <text x="59" y="18">RULE 1 fires</text>
    </g>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
      <text x="59" y="55">never read</text>
      <text x="59" y="93">never read</text>
    </g>
    <line x1="59" y1="-14" x2="59" y2="-2" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <polyline points="53,-8 59,0 65,-8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it STOPS at rung 1</text>
  </g>
  <text x="561" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">first match wins</text>
  <text x="561" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">top to bottom; the first</text>
  <text x="561" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rule to match decides</text>

  <!-- 5 labelled example : message card with a tag -->
  <g transform="translate(656,100)">
    <rect x="0" y="0" width="112" height="56" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round">
      <line x1="14" y1="20" x2="98" y2="20"/>
      <line x1="14" y1="34" x2="74" y2="34"/>
    </g>
    <line x1="56" y1="56" x2="56" y2="72" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
    <rect x="20" y="72" width="72" height="30" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="56" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">spam</text>
    <text x="56" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">data plus its answer</text>
  </g>
  <text x="712" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">labelled</text>
  <text x="712" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">example</text>
  <text x="712" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the right answer,</text>
  <text x="712" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">attached</text>

  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Before you can use the words false alarm and miss, say out loud which answer counts as raising the flag.</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Get the flag backwards and the two error words swap places.</text>
</svg>
