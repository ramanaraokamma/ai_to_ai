<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the four knobs</title>
  <desc>A machine with four unlabelled knobs marked A, B, C and D on top, and four empty boxes underneath for the student to write what each knob controls.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Label the four knobs</text>

    <circle cx="250" cy="116" r="26" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
    <line x1="250" y1="116" x2="250" y2="96" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <text x="250" y="138" font-size="14" fill="#C42B8C" text-anchor="middle">A</text>
    <circle cx="350" cy="116" r="26" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
    <line x1="350" y1="116" x2="350" y2="96" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <text x="350" y="138" font-size="14" fill="#C42B8C" text-anchor="middle">B</text>
    <circle cx="450" cy="116" r="26" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
    <line x1="450" y1="116" x2="450" y2="96" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <text x="450" y="138" font-size="14" fill="#C42B8C" text-anchor="middle">C</text>
    <circle cx="550" cy="116" r="26" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
    <line x1="550" y1="116" x2="550" y2="96" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <text x="550" y="138" font-size="14" fill="#C42B8C" text-anchor="middle">D</text>

    <rect x="180" y="146" width="440" height="150" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="176" font-size="18" fill="#14202B" text-anchor="middle">MY MODEL</text>
    <rect x="250" y="196" width="300" height="18" rx="6" fill="#6D28D9"/>
    <rect x="250" y="222" width="90" height="18" rx="6" fill="#55636F"/>
    <rect x="250" y="248" width="54" height="18" rx="6" fill="#55636F"/>
    <text x="230" y="205" font-size="12" fill="#55636F" text-anchor="end">spoon</text>
    <text x="230" y="231" font-size="12" fill="#55636F" text-anchor="end">toothbrush</text>
    <text x="230" y="257" font-size="12" fill="#55636F" text-anchor="end">comb</text>

    <rect x="52" y="310" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="66" y="331" font-size="14" fill="#55636F" dominant-baseline="central">A =</text>
    <rect x="240" y="310" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="254" y="331" font-size="14" fill="#55636F" dominant-baseline="central">B =</text>
    <rect x="428" y="310" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="442" y="331" font-size="14" fill="#55636F" dominant-baseline="central">C =</text>
    <rect x="616" y="310" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="630" y="331" font-size="14" fill="#55636F" dominant-baseline="central">D =</text>

    <text x="400" y="376" font-size="14" fill="#55636F" text-anchor="middle">Four things about your photos that you can change. Write one in each box.</text>
  </g>
</svg>
