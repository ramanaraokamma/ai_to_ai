<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Nine numbers by hand, nine numbers from autograd</title>
  <desc>A table of nine gradient entries. For each one the by-hand column and the autograd column hold the same number and the difference column reads 0.00000000. The first row, dW1 row 0 column 0, is highlighted in pink and worked out beside the table: 0.90024951 minus 1 is minus 0.09975049, input 1 was 1.0, and 1.0 times minus 0.09975049 is minus 0.09975049. A green panel states that the biggest disagreement anywhere is 0.00000000, with float64 on both sides.</desc>
