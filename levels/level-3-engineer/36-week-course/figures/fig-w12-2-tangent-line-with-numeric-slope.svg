  <line x1="100" y1="86" x2="100" y2="352" stroke="#14202B" stroke-width="2"/>
  <line x1="100" y1="352" x2="404" y2="352" stroke="#14202B" stroke-width="2"/>
  <line x1="100" y1="352" x2="100" y2="358" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="150" y1="352" x2="150" y2="358" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="150" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="200" y1="352" x2="200" y2="358" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <line x1="250" y1="352" x2="250" y2="358" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="250" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <line x1="300" y1="352" x2="300" y2="358" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="300" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <line x1="350" y1="352" x2="350" y2="358" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="350" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <line x1="94" y1="352" x2="100" y2="352" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="90" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="94" y1="262.7" x2="100" y2="262.7" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="90" y="266.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">9</text>
  <line x1="94" y1="173.4" x2="100" y2="173.4" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="90" y="177.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">18</text>
  <line x1="94" y1="103.9" x2="100" y2="103.9" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="90" y="107.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">25</text>
  <text x="245" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">x</text>
  <text x="54" y="223" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 54 223)">f(x) = x &#215; x</text>
  <line x1="225" y1="290" x2="275" y2="290" stroke="#55636F" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
  <line x1="275" y1="290" x2="275" y2="230.4" stroke="#55636F" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
  <text x="250" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">run 1.00</text>
  <text x="280" y="264.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">rise 6.00</text>
  <circle cx="225" cy="290" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="275" cy="230.4" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="250" cy="262.7" r="7" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="242" y="282.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">(3, 9)</text>
  <text x="219" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">(2.5, 6.25)</text>
  <text x="280" y="222.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">(3.5, 12.25)</text>
  <rect x="112" y="96" width="276" height="122" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="126" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">step half a unit each way:</text>
  <text x="126" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">f(3.5) = 3.5 &#215; 3.5 = 12.25</text>
  <text x="126" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">f(2.5) = 2.5 &#215; 2.5 = 6.25</text>
  <text x="126" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">12.25 &#8722; 6.25 = 6.00</text>
  <text x="126" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">6.00 &#247; 1.00 = 6.000</text>
  <text x="250" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The shortcut rule 2 &#215; x says 6 as well.</text>
  <text x="250" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">With a nudge of 0.001: 0.012 &#247; 0.002 = 6.000. Same answer.</text>
</svg>
