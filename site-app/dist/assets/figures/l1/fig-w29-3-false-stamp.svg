<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Fluent, and false</title>
  <desc>The sentence amma takes the bus to the market written in word boxes with a red FALSE stamp across it. The words to the market are highlighted, and a callout names the two learned pairs that were glued together to produce a claim the corpus never made.</desc>
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fluent, and false</text>
<rect x="97.0" y="110" width="86" height="52" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="140.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">amma</text>
<rect x="191.0" y="110" width="86" height="52" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="234.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">takes</text>
<rect x="285.0" y="110" width="62" height="52" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="316.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">the</text>
<rect x="355.0" y="110" width="68" height="52" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="389.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">bus</text>
<rect x="431.0" y="110" width="52" height="52" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="457.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">to</text>
<rect x="491.0" y="110" width="62" height="52" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="522.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">the</text>
<rect x="561.0" y="110" width="104" height="52" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="613.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">market</text>
<rect x="673.0" y="110" width="30" height="52" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="688.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#14202B" text-anchor="middle" dominant-baseline="central">.</text>
<g transform="rotate(-9 400 136)">
<rect x="292" y="104" width="216" height="66" rx="10" fill="none" stroke="#CC2B1D" stroke-width="6"/>
<text x="400" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" fill="#CC2B1D" text-anchor="middle" font-weight="700" dominant-baseline="central">FALSE</text>
</g>
<path d="M 457.0 168 V 196" fill="none" stroke="#C42B8C" stroke-width="2"/>
<path d="M 613.0 168 V 196" fill="none" stroke="#C42B8C" stroke-width="2"/>
<rect x="120" y="200" width="560" height="64" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="400" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#C42B8C" text-anchor="middle" font-weight="600" dominant-baseline="central">two learned pairs, glued together</text>
<text x="400" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">to -> the   (seen 3 times)        +        the -> market   (seen once)</text>
<rect x="120" y="284" width="560" height="58" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
<text x="400" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">But in the corpus it is I who goes to the market.</text>
<text x="400" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">Amma goes to the shop. The table cannot see that far back.</text>
<text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nothing here is broken. The machine did exactly what it was built to do.</text>
</svg>
