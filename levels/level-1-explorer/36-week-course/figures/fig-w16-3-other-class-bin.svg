<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The other class is a box for none of the above</title>
  <desc>Three cards on the left show an empty hand, a bare table and a fork. Curved arrows send all three into a large open bin on the right labelled other, none of the above, filled with 40 photos of nothing in particular.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">The 'other' class is a box for none of the above</text>

    <g stroke="#14202B" stroke-width="2" fill="none">
      <path d="M248 124 Q370 130 448 184"/>
      <path d="M248 212 Q360 206 448 200"/>
      <path d="M248 300 Q370 292 448 216"/>
    </g>
    <g fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-12,-7 0,0 -12,7" transform="translate(450 186) rotate(34)"/>
      <polyline points="-12,-7 0,0 -12,7" transform="translate(450 200) rotate(-4)"/>
      <polyline points="-12,-7 0,0 -12,7" transform="translate(450 214) rotate(-44)"/>
    </g>

    <rect x="456" y="176" width="300" height="24" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M466 200 H746 L722 344 H490 Z" fill="#F5F8FA" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="606" y="256" font-size="24" fill="#14202B" text-anchor="middle">other</text>
    <text x="606" y="286" font-size="14" fill="#55636F" text-anchor="middle">none of the above</text>
    <text x="606" y="312" font-size="14" fill="#55636F" text-anchor="middle">40 photos of nothing in particular</text>

    <rect x="40" y="88" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="64" y="118" width="34" height="28" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#845F00" stroke-width="2.5" stroke-linecap="round">
      <line x1="70" y1="118" x2="70" y2="106"/>
      <line x1="78" y1="118" x2="78" y2="102"/>
      <line x1="86" y1="118" x2="86" y2="102"/>
      <line x1="94" y1="118" x2="94" y2="108"/>
      <line x1="64" y1="130" x2="54" y2="138"/>
    </g>
    <text x="118" y="129" font-size="16" fill="#14202B">an empty hand</text>

    <rect x="40" y="176" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="58" y="200" width="52" height="9" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#845F00" stroke-width="2.5" stroke-linecap="round">
      <line x1="66" y1="209" x2="66" y2="230"/>
      <line x1="102" y1="209" x2="102" y2="230"/>
    </g>
    <text x="122" y="217" font-size="16" fill="#14202B">a bare table</text>

    <rect x="40" y="264" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="74" y="286" width="18" height="18" rx="4" fill="#F5F8FA" stroke="#55636F" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#55636F" stroke-width="2.5" stroke-linecap="round">
      <line x1="79" y1="286" x2="79" y2="276"/>
      <line x1="83" y1="286" x2="83" y2="274"/>
      <line x1="87" y1="286" x2="87" y2="276"/>
      <line x1="83" y1="304" x2="83" y2="326"/>
    </g>
    <text x="118" y="305" font-size="16" fill="#14202B">a fork</text>

    <text x="400" y="378" font-size="14" fill="#55636F" text-anchor="middle">Without this box, a fork comes out as "spoon, 74%".</text>
  </g>
</svg>
