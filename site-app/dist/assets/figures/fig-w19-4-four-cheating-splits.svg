<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four cheating splits</title>
  <desc>Four panels, each marked with a red cross. Splitting after training, taking test photos from the same burst, peeking at the test set and retraining, and using the same physical object in both sets. Each panel names the flaw in one line.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="32" font-size="24" fill="#14202B" text-anchor="middle">Four splits that are all cheating</text>

    <rect x="40" y="56" width="350" height="140" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <rect x="410" y="56" width="350" height="140" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <rect x="40" y="210" width="350" height="140" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <rect x="410" y="210" width="350" height="140" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <g transform="translate(54,68) scale(0.34)">
        <circle cx="50" cy="50" r="34" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="8"/>
        <line x1="38" y1="38" x2="62" y2="62" stroke-width="10"/><line x1="62" y1="38" x2="38" y2="62" stroke-width="10"/>
      </g>
      <g transform="translate(424,68) scale(0.34)">
        <circle cx="50" cy="50" r="34" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="8"/>
        <line x1="38" y1="38" x2="62" y2="62" stroke-width="10"/><line x1="62" y1="38" x2="38" y2="62" stroke-width="10"/>
      </g>
      <g transform="translate(54,222) scale(0.34)">
        <circle cx="50" cy="50" r="34" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="8"/>
        <line x1="38" y1="38" x2="62" y2="62" stroke-width="10"/><line x1="62" y1="38" x2="38" y2="62" stroke-width="10"/>
      </g>
      <g transform="translate(424,222) scale(0.34)">
        <circle cx="50" cy="50" r="34" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="8"/>
        <line x1="38" y1="38" x2="62" y2="62" stroke-width="10"/><line x1="62" y1="38" x2="38" y2="62" stroke-width="10"/>
      </g>
    </g>

    <g font-size="18" fill="#14202B">
      <text x="102" y="94">1. Split AFTER training</text>
      <text x="472" y="94">2. Same burst of photos</text>
      <text x="102" y="248">3. Peek, then retrain</text>
      <text x="472" y="248">4. Same object in both</text>
    </g>

    <g font-size="14" fill="#14202B">
      <text x="56" y="128">Trained on all 30, then picked 6</text>
      <text x="56" y="148">of them and called them the test.</text>
      <text x="426" y="128">Training frames and test frames</text>
      <text x="426" y="148">came from one 3-second clip.</text>
      <text x="56" y="282">Opened the envelope, saw 4/6,</text>
      <text x="56" y="302">added photos, retrained, got 6/6.</text>
      <text x="426" y="282">The same blue bottle photographed</text>
      <text x="426" y="302">for training AND for the test.</text>
    </g>

    <g font-size="14" fill="#CC2B1D" font-weight="600">
      <text x="56" y="178">Flaw: it already studied all six.</text>
      <text x="426" y="178">Flaw: near-twins. Already seen.</text>
      <text x="56" y="332">Flaw: the test set trained it - via you.</text>
      <text x="426" y="332">Flaw: measures THIS bottle, not bottles.</text>
    </g>

    <text x="400" y="376" font-size="14" fill="#55636F" text-anchor="middle">All four report a score that is too high. Number 4 is the sneakiest, because the folders really are separate.</text>
  </g>
</svg>
