<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Twenty cards, dealt twice</title>
  <desc>Twenty cards, five red and fifteen black, dealt into piles of twelve, four and four. On the left, dealt straight off a shuffled deck, all five red cards land in the train pile: 5 divided by 12 is 0.4167, and 0 divided by 4 is 0.0000 in both other piles, so the test pile cannot measure anything about red. On the right, dealt red by red on purpose, the reds go 3, 1 and 1: 3 divided by 12 is 0.2500 and 1 divided by 4 is 0.2500 twice, matching the whole deck's 5 divided by 20 equals 0.2500.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Twenty cards, dealt twice</text>
  <text x="400" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5 red and 15 black, into piles of 12, 4 and 4</text>
