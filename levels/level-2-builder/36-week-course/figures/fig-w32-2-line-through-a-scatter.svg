  <line x1="96" y1="220.0" x2="444" y2="220.0" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="96" y1="181.3" x2="444" y2="181.3" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="96" y1="142.7" x2="444" y2="142.7" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="96" y1="104.0" x2="444" y2="104.0" stroke="#C7CDD4" stroke-width="1.5"/>
