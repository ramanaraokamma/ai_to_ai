<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Report one number, or report all of them</title>
  <desc>Two panels. The wrong one shows a poster with only the best number, ninety one point seven percent. The right one shows all four condition numbers, the gap of fifty eight point four percentage points, the sealed prediction reported as wrong, and a warning strip.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Report one number, or report all of them</text>
  <rect x="40" y="76" width="330" height="252" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="430" y="76" width="330" height="252" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <g transform="translate(56,90) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="110" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">The flattering one</text>
  <g transform="translate(446,90) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="500" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">The whole picture</text>
  <rect x="76" y="140" width="258" height="150" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="205" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">91.7%</text>
  <text x="205" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">accurate</text>
  <text x="205" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(the other three left off)</text>
  <text x="205" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">True, and misleading.</text>
  <rect x="452" y="134" width="286" height="120" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="466" y="158">daylight</text>
    <text x="466" y="180">held in a hand</text>
    <text x="466" y="202">odd background</text>
    <text x="466" y="224">lamplight</text>
    <text x="466" y="246">GAP</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">
    <text x="724" y="158">91.7%</text>
    <text x="724" y="180">66.7%</text>
    <text x="724" y="202">58.3%</text>
    <text x="724" y="224">33.3%</text>
    <text x="724" y="246">58.4 points</text>
  </g>
  <line x1="452" y1="232" x2="738" y2="232" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="452" y="264" width="286" height="26" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="595" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">MY PREDICTION WAS WRONG</text>
  <rect x="452" y="296" width="286" height="24" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="595" y="313" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">DO NOT USE THIS IN LAMPLIGHT</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">If the flattering number is the biggest thing on the page, you designed the misunderstanding.</text>
</svg>
