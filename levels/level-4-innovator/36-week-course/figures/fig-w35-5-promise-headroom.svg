<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A promise written before the build is read back as headroom; the score promise was missed by one case</title>
  <desc>Four horizontal bars measured against a dashed line at headroom 1.0, the promise. Mean cost per task, promised under 0.001, measured 0.00045 stand-in dollars: headroom 2.21, kept. Worst single task, promised under 0.003, measured 0.00148: headroom 2.02, kept. Score, promised at least 0.70, measured 17 of 25 which is 0.68: headroom 0.97, just short of the line, MISSED; 18 of 25 would have been 0.72. Refusals right, promised at least 5, measured 5: headroom 1.00, kept with no room to spare. Dollars are stand-in dollars, from scripted stand-ins, not a model.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four promises, read back as headroom</text>
  <rect x="604" y="56" width="172" height="26" rx="6" fill="#F5F8FA" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="690" y="69" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">stand-in, not a model</text>
  <line x1="300" y1="100" x2="300" y2="316" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="96" x2="460" y2="316" stroke="#14202B" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="460" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">promise = 1.0</text>
  <text x="24" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">mean cost per task</text>
  <text x="24" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">promised under $0.001; measured $0.00045</text>
  <text x="24" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">worst single task</text>
  <text x="24" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">promised under $0.003; measured $0.00148</text>
  <text x="24" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">score</text>
  <text x="24" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">promised at least 0.70; measured 17 of 25 = 0.68</text>
  <text x="24" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">refusals right</text>
  <text x="24" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">promised at least 5; measured 5</text>
  <rect x="300" y="112" width="353.6" height="20" rx="3" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="653.6" cy="122" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="650.1,122 652.6,124.8 657.6,119" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="671.6" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">2.21x kept</text>
  <rect x="300" y="166" width="323.2" height="20" rx="3" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="623.2" cy="176" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="619.7,176 622.2,178.8 627.2,173" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="641.2" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">2.02x kept</text>
  <rect x="300" y="220" width="155.2" height="20" rx="3" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="455.2" cy="230" r="11" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <polyline points="451.2,226 459.2,234" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="451.2,234 459.2,226" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="473.2" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">0.97x MISSED</text>
  <rect x="300" y="274" width="160" height="20" rx="3" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="460" cy="284" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="456.5,284 459,286.8 464,281" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="478" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">1.00x kept</text>
  <line x1="300" y1="316" x2="300" y2="324" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="300" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="460" y1="316" x2="460" y2="324" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1.0</text>
  <line x1="620" y1="316" x2="620" y2="324" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="620" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="460" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">headroom (right of the dashed line = kept)</text>
  <text x="24" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">18 of 25 would have been 0.72</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Cost: 0.001 &#247; 0.00045 = 2.21. Score: 0.68 &#247; 0.70 = 0.97, one case short, so MISSED.</text>
</svg>
