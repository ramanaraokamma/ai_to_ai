<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The chart she should have drawn on day one</title>
  <desc>A scatter plot of 100 songs, beats per minute along the bottom from 50 to 190 and length in seconds up the side from 160 to 370. Fifty filled red circles are Hype songs and fifty open blue squares are Chill songs. The two groups overlap heavily through the middle of the chart. A callout reads: no straight line separates these, a model will get some wrong, and 84 percent may be near the ceiling.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The chart she should have drawn on day one</text>
  <text x="400" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">100 songs. Two features. The groups overlap, and that is the whole story.</text>
