<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One change, one measurement, one row</title>
  <desc>Two lanes. The top lane, ticked, shows a champion pipeline at validation AUC 0.7586, one arrow labelled drop order_hour, a challenger at 0.7599, and the row that gets written down: 0.7599 minus 0.7586 equals plus 0.0013, keep. The bottom lane, crossed out and struck through, shows the same champion at 0.7586, one arrow carrying TWO changes at once, a challenger at 0.7571, and the row 0.7571 minus 0.7586 equals minus 0.0015 followed by question marks, because nothing on that row says which of the two changes lost the 0.0015.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One change, one measurement, one row</text>
  <rect x="30" y="66" width="740" height="132" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="44,82 50,88 62,76" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">legal move</text>
  <rect x="44" y="106" width="180" height="56" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="134" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">champion</text>
  <text x="134" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">val AUC 0.7586</text>
  <line x1="232" y1="134" x2="322" y2="134" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(322 134) rotate(0.0)"/>
  <text x="277" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">drop order_hour</text>
  <text x="277" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one change</text>
  <rect x="330" y="106" width="180" height="56" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="420" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">challenger</text>
  <text x="420" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">val AUC 0.7599</text>
  <line x1="518" y1="134" x2="560" y2="134" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(560 134) rotate(0.0)"/>
  <rect x="568" y="106" width="186" height="56" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="661" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.7599 &#8722; 0.7586</text>
  <text x="661" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle" dominant-baseline="central">= +0.0013  keep</text>
  <text x="400" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">You know exactly which change bought the 0.0013, because only one thing moved.</text>
  <rect x="30" y="212" width="740" height="132" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="44" y1="224" x2="58" y2="236" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="224" x2="44" y2="236" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="74" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D">struck out &#8212; re-run it</text>
  <rect x="44" y="252" width="180" height="56" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="134" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">champion</text>
  <text x="134" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">val AUC 0.7586</text>
  <line x1="232" y1="280" x2="322" y2="280" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(322 280) rotate(0.0)"/>
  <text x="277" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">drop order_hour AND</text>
  <text x="277" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">swap the scaler</text>
  <rect x="330" y="252" width="180" height="56" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="420" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">challenger</text>
  <text x="420" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">val AUC 0.7571</text>
  <line x1="518" y1="280" x2="560" y2="280" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(560 280) rotate(0.0)"/>
  <rect x="568" y="252" width="186" height="56" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="661" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.7571 &#8722; 0.7586</text>
  <text x="661" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">= &#8722;0.0015  ???</text>
  <line x1="576" y1="281" x2="746" y2="281" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Two changes, one number. Which one lost the 0.0015? Nothing on this row can tell you.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">The rule: change one thing, measure, write the row. Then change the next thing.</text>
</svg>
