<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank scoreboard to fill in</title>
  <desc>An empty scoreboard with a percentage axis from zero to one hundred, a dashed line waiting to be labelled as the baseline, five empty bar slots with blank name boxes underneath, and an empty box at the top for the baseline fraction.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Your scoreboard</text>
  <rect x="560" y="46" width="216" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="560" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">BASELINE =        /        =        %</text>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="96" y1="300" x2="740" y2="300"/>
    <line x1="96" y1="240" x2="740" y2="240"/>
    <line x1="96" y1="180" x2="740" y2="180"/>
    <line x1="96" y1="120" x2="740" y2="120"/>
    <line x1="96" y1="60" x2="740" y2="60"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">
    <text x="88" y="304">0</text><text x="88" y="244">25</text><text x="88" y="184">50</text>
    <text x="88" y="124">75</text><text x="88" y="64">100</text>
  </g>
  <!-- the line the student draws in -->
  <line x1="96" y1="220" x2="740" y2="220" stroke="#14202B" stroke-width="3" stroke-dasharray="10 6" stroke-linecap="round"/>
  <rect x="600" y="196" width="140" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="602" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">name this line</text>
  <!-- five empty bar slots -->
  <g fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5">
    <rect x="132" y="60" width="76" height="240"/>
    <rect x="252" y="60" width="76" height="240"/>
    <rect x="372" y="60" width="76" height="240"/>
    <rect x="492" y="60" width="76" height="240"/>
    <rect x="612" y="60" width="76" height="240"/>
  </g>
  <line x1="96" y1="300" x2="740" y2="300" stroke="#14202B" stroke-width="2"/>
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="126" y="312" width="88" height="30" rx="6"/>
    <rect x="246" y="312" width="88" height="30" rx="6"/>
    <rect x="366" y="312" width="88" height="30" rx="6"/>
    <rect x="486" y="312" width="88" height="30" rx="6"/>
    <rect x="606" y="312" width="88" height="30" rx="6"/>
  </g>
  <g fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round">
    <rect x="126" y="348" width="88" height="30" rx="6"/>
    <rect x="246" y="348" width="88" height="30" rx="6"/>
    <rect x="366" y="348" width="88" height="30" rx="6"/>
    <rect x="486" y="348" width="88" height="30" rx="6"/>
    <rect x="606" y="348" width="88" height="30" rx="6"/>
  </g>
  <text x="60" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">feature</text>
  <text x="60" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">verdict</text>
</svg>
