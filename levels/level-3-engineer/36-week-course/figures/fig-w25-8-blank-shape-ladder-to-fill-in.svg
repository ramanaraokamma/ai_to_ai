<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Fill in all six shapes</title>
  <desc>Six blank rows, one per layer of the stack, each naming the layer and giving n, k, s and p, with an empty dashed box for the shape and a dashed rule for the division that produced it. The layers are: input of 4 pictures, 1 channel, 8 by 8; a 3 by 3 convolution with 8 filters and padding 1; a 2 by 2 max pool; a 3 by 3 convolution with 16 filters and padding 1; another 2 by 2 max pool; and a flatten. A final blank box asks what number nn.Linear must start at. The answers are 4 by 1 by 8 by 8, 4 by 8 by 8 by 8, 4 by 8 by 4 by 4, 4 by 16 by 4 by 4, 4 by 16 by 2 by 2, 4 by 64, and 64.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fill in all six shapes</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">in pen, before you run anything</text>
  <rect x="40" y="96" width="420" height="78" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">input: 4 pictures, 1 channel, 8 by 8</text>
  <rect x="280" y="142" width="164" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="60" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the division:</text>
  <line x1="150" y1="164" x2="268" y2="164" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <rect x="40" y="180" width="420" height="78" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Conv2d(1, 8, 3, padding=1)</text>
  <text x="56" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">n=8  k=3  s=1  p=1</text>
  <rect x="280" y="226" width="164" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="60" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the division:</text>
  <line x1="150" y1="248" x2="268" y2="248" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <rect x="40" y="264" width="420" height="78" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">MaxPool2d(2)</text>
  <text x="56" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">n=8  k=2  s=2  p=0</text>
  <rect x="280" y="310" width="164" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="60" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the division:</text>
  <line x1="150" y1="332" x2="268" y2="332" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <rect x="40" y="348" width="420" height="78" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Conv2d(8, 16, 3, padding=1)</text>
  <text x="56" y="394" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">n=?  k=3  s=1  p=1</text>
  <rect x="280" y="394" width="164" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="60" y="416" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the division:</text>
  <line x1="150" y1="416" x2="268" y2="416" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <rect x="40" y="432" width="420" height="78" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">MaxPool2d(2)</text>
  <text x="56" y="478" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">n=?  k=2  s=2  p=0</text>
  <rect x="280" y="478" width="164" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="60" y="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the division:</text>
  <line x1="150" y1="500" x2="268" y2="500" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <rect x="40" y="516" width="420" height="78" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Flatten()</text>
  <text x="56" y="562" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">channels &#215; height &#215; width</text>
  <rect x="280" y="562" width="164" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="60" y="584" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the division:</text>
  <line x1="150" y1="584" x2="268" y2="584" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="60" y="622" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">so nn.Linear must start at</text>
  <rect x="300" y="604" width="140" height="26" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="250" y="658" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the first number never changes &#8212; say why</text>
</svg>
