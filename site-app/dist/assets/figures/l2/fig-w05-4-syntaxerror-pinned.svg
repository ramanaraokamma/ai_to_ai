<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Python points at the exact spot</title>
  <desc>A red-outlined error panel shows five lines: the file and line number, the offending line if age equals 12 with a single equals sign, a row of carets under it, and a SyntaxError message suggesting a double equals sign. Two arrows label the carets as the spot and the last line as the one to read first. A green strip below shows the fixed line.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Python points at the exact spot</text>
  <path d="M40 92 A10 10 0 0 1 50 82 H420 A10 10 0 0 1 430 92 V112 H40 Z" fill="#F6AEA6"/>
  <g stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"><line x1="58" y1="92" x2="68" y2="102"/><line x1="68" y1="92" x2="58" y2="102"/></g>
  <text x="80" y="101" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">SyntaxError</text>
  <line x1="40" y1="112" x2="430" y2="112" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="52" y="156" width="300" height="22" fill="#F6AEA6"/>
  <text x="56" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">  File "scratch.py", line 3</text>
  <text x="56" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    if age = 12:</text>
  <text x="56" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D">       ^^^^^^^^</text>
  <text x="56" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">SyntaxError: invalid syntax. Maybe you</text>
  <text x="56" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">meant '==' or ':=' instead of '='?</text>
  <rect x="40" y="82" width="390" height="182" rx="10" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="560" y1="194" x2="452" y2="194" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(448 194) rotate(180)"/>
  <rect x="566" y="176" width="204" height="36" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="668" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">the carets mark the spot</text>
  <line x1="560" y1="233" x2="452" y2="233" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(448 233) rotate(180)"/>
  <rect x="566" y="215" width="204" height="36" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="668" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">read this line first</text>
  <g transform="translate(566,276) scale(0.34)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="606" y="280" width="164" height="30" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="618" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">if age == 12:</text>
  <text x="255" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">It even tells you the fix.</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every SyntaxError is Python saying: I could not even read this.</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nothing ran. No output. Look at the line number, then the carets.</text>
</svg>
