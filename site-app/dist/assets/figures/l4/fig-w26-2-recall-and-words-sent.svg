<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A perfect recall bought by sending the whole notebook is not retrieval: report words sent beside recall</title>
  <desc>Five rows, one per way of cutting the same notebook, each with a bar for the share of the notebook sent at k equals 3 and the recall at 1, 3 and 5 on ten questions. By note: 21 percent, 146 words, recall 1.00 1.00 1.00. 30 words overlap 8: 13 percent, 90 words, 0.80 0.90 1.00. 60 words overlap 15: 26 percent, 180 words, 0.90 1.00 1.00. 120 words: 51 percent, 354 words, 0.90 1.00 1.00. 250 words overlap 50: 104 percent, 718 words, 1.00 1.00 1.00, drawn past the 100 percent line and marked with a cross.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Recall, and what it cost in words</text>
  <text x="250" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">share of the notebook sent per question (k = 3)</text>
  <text x="676" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">r@1</text>
  <text x="716" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">r@3</text>
