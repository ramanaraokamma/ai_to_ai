<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 16</title>
  <desc>An empty framed drawing area titled draw your own round trip field by field, with a ruled grid of four columns headed my column, went in as, came back as, and convert with, above eight blank rows, and three reminder boxes underneath for the number of lines in the file, whether that is records plus one, and whether the round trip printed identical.</desc>
  <rect x="24" y="24" width="752" height="290" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your own round trip, field by field</text>
  <text x="400" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one row per column of your data - what it was, what came back, what you did about it</text>
  <rect x="84" y="104" width="632" height="22" fill="#D9EAF9"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="244" y1="104" x2="244" y2="302"/>
    <line x1="404" y1="104" x2="404" y2="302"/>
    <line x1="564" y1="104" x2="564" y2="302"/>
    <line x1="84" y1="148" x2="716" y2="148"/>
    <line x1="84" y1="170" x2="716" y2="170"/>
    <line x1="84" y1="192" x2="716" y2="192"/>
    <line x1="84" y1="214" x2="716" y2="214"/>
    <line x1="84" y1="236" x2="716" y2="236"/>
    <line x1="84" y1="258" x2="716" y2="258"/>
    <line x1="84" y1="280" x2="716" y2="280"/>
    <line x1="84" y1="302" x2="716" y2="302"/>
  </g>
  <line x1="84" y1="126" x2="716" y2="126" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="164.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">my column</text>
  <text x="324.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">went in as</text>
  <text x="484.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">came back as</text>
  <text x="640.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">convert with</text>
  <rect x="84" y="104" width="632" height="198" rx="0" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">lines in my file</text>
  <rect x="60" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">records + 1?</text>
  <rect x="300" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">round trip identical?</text>
  <rect x="540" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
</svg>
