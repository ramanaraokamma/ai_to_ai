<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: where does the ink that falls off go?</title>
  <desc>Two panels, each showing a six by six handwritten 6 with a stroke down the middle and a loop at the bottom. On the left, marked wrong, np.roll slides the rows down by one and the bottom row of the loop reappears at the top, outlined in red; the label still says 6 but the picture is not a 6, and five times 1,257 training rows bought plus 0.00 accuracy points. On the right, marked right, the same roll is followed by out colon comma 0 comma colon equals 0.0, which blanks the wrapped top row, outlined in green; it is still a 6 one pixel lower down, and 529 of 540 becomes 536 of 540, a gain of 1.30 points.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Wrong and right: where does the ink that falls off go?</text>
