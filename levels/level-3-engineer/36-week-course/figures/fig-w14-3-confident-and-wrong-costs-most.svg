<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Confident and wrong costs the most</title>
  <desc>A grouped bar chart. Four probabilities the model might have given, all on rows where the true answer was yes: 0.90, 0.40, 0.10 and 0.02. Each has two bars, log loss and squared error, on the same scale from 0 to 4. Log loss reads 0.1053, 0.9163, 2.3026 and 3.9120, so it keeps growing. Squared error reads 0.0100, 0.3600, 0.8100 and 0.9604, and a dashed line at 1 marks the ceiling it can never pass. At p = 0.02 the two bars are 3.9120 and 0.9604.</desc>
  <rect x="20" y="20" width="760" height="360" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Confident and wrong costs the most</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">every row below had the true answer YES</text>
  <line x1="96" y1="330" x2="640" y2="330" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="330" x2="96" y2="80" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="58" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 58 210)">cost of that row</text>
  <line x1="90" y1="330.0" x2="96" y2="330.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="334.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="90" y1="267.5" x2="96" y2="267.5" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="271.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <line x1="90" y1="205.0" x2="96" y2="205.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="209.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">2</text>
  <line x1="90" y1="142.5" x2="96" y2="142.5" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="146.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">3</text>
  <line x1="90" y1="80.0" x2="96" y2="80.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="86" y="84.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">4</text>
  <line x1="96" y1="267.5" x2="640" y2="267.5" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/>
  <text x="636" y="244.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">squared error can never get past 1</text>
  <rect x="120" y="323.4" width="46" height="6.6" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="176" y="329.4" width="46" height="0.6" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="143" y="315.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.1054</text>
  <text x="199" y="321.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0100</text>
  <text x="171" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">said 0.90</text>
  <rect x="242" y="272.7" width="46" height="57.3" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="298" y="307.5" width="46" height="22.5" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="265" y="264.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.9163</text>
  <text x="321" y="299.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.3600</text>
  <text x="293" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">said 0.40</text>
  <rect x="364" y="186.1" width="46" height="143.9" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="420" y="279.4" width="46" height="50.6" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="387" y="178.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2.3026</text>
  <text x="443" y="271.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.8100</text>
  <text x="415" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">said 0.10</text>
  <rect x="486" y="85.5" width="46" height="244.5" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="542" y="270.0" width="46" height="60.0" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="509" y="77.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3.9120</text>
  <text x="565" y="262.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.9604</text>
  <text x="537" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">said 0.02</text>
  <rect x="660" y="96" width="120" height="62" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="672" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">log loss</text>
  <text x="672" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#8722;ln(p)</text>
  <rect x="660" y="172" width="120" height="62" rx="10" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="672" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D">squared</text>
  <text x="672" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">(1 &#8722; p)&#178;</text>
  <rect x="660" y="248" width="120" height="112" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="672" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one row at</text>
  <text x="672" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">p = 0.02:</text>
  <text x="672" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#8722;ln(0.02)</text>
  <text x="672" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">= 3.9120</text>
  <text x="672" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">vs 0.9604</text>
</svg>
