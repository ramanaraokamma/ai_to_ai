<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>An average hides how many rows it came from</title>
  <desc>A bar chart of average runs for four teams. The Owls bar is the tallest at 104 and is ringed, with a note saying it is one player's score, not an average. Each team's row count is printed under its name: four, four, three and one.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Average runs per team</text>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="90" y1="320" x2="450" y2="320"/>
    <line x1="90" y1="260" x2="450" y2="260"/>
    <line x1="90" y1="200" x2="450" y2="200"/>
    <line x1="90" y1="140" x2="450" y2="140"/>
  </g>
  <text x="80" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="80" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">25</text>
  <text x="80" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">50</text>
  <text x="80" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">75</text>
  <text x="80" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100</text>
  <path d="M110 380 V299 A4 4 0 0 1 114 295 H156 A4 4 0 0 1 160 299 V380 Z" fill="#1F6FB2"/>
  <text x="135" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">35.50</text>
  <path d="M200 380 V304 A4 4 0 0 1 204 300 H246 A4 4 0 0 1 250 304 V380 Z" fill="#1F6FB2"/>
  <text x="225" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">33.50</text>
  <path d="M290 380 V250 A4 4 0 0 1 294 246 H336 A4 4 0 0 1 340 250 V380 Z" fill="#1F6FB2"/>
  <text x="315" y="237" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">55.67</text>
  <path d="M380 380 V134 A4 4 0 0 1 384 130 H426 A4 4 0 0 1 430 134 V380 Z" fill="#C42B8C"/>
  <text x="405" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">104.00</text>
  <circle cx="405" cy="132" r="24" fill="none" stroke="#C42B8C" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="278" y1="166" x2="382" y2="139" stroke="#C42B8C" stroke-width="2"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(384 138) rotate(-15)"/>
  <rect x="96" y="140" width="182" height="60" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="187" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">The Owls have one player.</text>
  <text x="187" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">104 is Priya's score, not an average.</text>
  <line x1="90" y1="96" x2="90" y2="380" stroke="#14202B" stroke-width="2"/>
  <line x1="90" y1="380" x2="450" y2="380" stroke="#14202B" stroke-width="2"/>
  <text x="135" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Falcons</text>
  <text x="225" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Tigers</text>
  <text x="315" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Hawks</text>
  <text x="405" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Owls</text>
  <text x="135" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4 players</text>
  <text x="225" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4 players</text>
  <text x="315" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 players</text>
  <text x="405" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">1 player</text>
  <text x="270" y="446" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Team, with its row count</text>
  <text x="48" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 48 245)">Average runs</text>
  <text x="250" y="476" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Print the row count beside every average, or the tallest bar tells a lie.</text>
</svg>
