  <rect x="688" y="106" width="18" height="26" rx="4" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="697" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="708" y="106" width="18" height="26" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="717" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="728" y="106" width="18" height="26" rx="4" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="737" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="748" y="106" width="18" height="26" rx="4" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="757" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="556" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">1 column &#8594; 5 columns</text>
  <text x="556" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">exactly one 1 per row</text>
  <text x="556" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="start">no order invented</text>
  <rect x="20" y="224" width="240" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="36" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">ordinal encoding</text>
  <rect x="40" y="268" width="60" height="26" rx="5" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="70" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">clear = 0</text>
  <rect x="110" y="268" width="60" height="26" rx="5" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="140" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">rain = 1</text>
  <rect x="180" y="268" width="60" height="26" rx="5" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="210" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">storm = 2</text>
  <text x="36" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">it says both steps are equal</text>
  <text x="36" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">0.3507 &#8722; 0.2451 = 0.1056</text>
  <text x="36" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="start">0.5360 &#8722; 0.3507 = 0.1853</text>
  <rect x="280" y="224" width="240" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
