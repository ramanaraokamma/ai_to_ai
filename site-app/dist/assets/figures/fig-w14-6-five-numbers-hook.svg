<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five numbers and nothing else</title>
  <desc>A scene. On the left a hidden object sits behind a screen. In the middle a slip of paper lists five feature values. On the right a child with a thought bubble guesses from the numbers alone.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five numbers. That is the whole thing.</text>
  <rect x="30" y="62" width="740" height="258" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <rect x="52" y="96" width="140" height="180" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="122" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">hidden</text>
  <text x="122" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">object</text>
  <text x="122" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">never seen, never held</text>

  <g transform="translate(212,178) scale(0.7)">
    <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="290" y="86" width="210" height="200" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="290" y1="116" x2="500" y2="116" stroke="#1F6FB2" stroke-width="3"/>
  <text x="395" y="107" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">CARD 01</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="306" y="146">longest side: 14 cm</text>
    <text x="306" y="176">weight: 6 g</text>
    <text x="306" y="206">colour: blue</text>
    <text x="306" y="236">material: plastic</text>
    <text x="306" y="266">hollow: yes</text>
  </g>

  <g transform="translate(516,178) scale(0.7)">
    <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(596,180) scale(0.95)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(620,78) scale(0.95)">
    <circle cx="22" cy="88" r="5" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
    <circle cx="34" cy="76" r="7" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
    <path d="M40 66 C24 66 18 50 30 43 C24 27 44 16 56 25 C64 10 92 14 92 31 C108 34 106 58 90 60 C86 70 64 72 56 66 Z"
          fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="684" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">a pen?</text>
  <text x="655" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the tester, guessing from the row</text>

  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">This is exactly the position a machine is in, every time, for ever.</text>
</svg>
