<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Eight steps downhill, and the arithmetic of one step</title>
  <desc>A U-shaped bowl, loss equals w minus 8 all squared, drawn in grey. Eight pink dots walk down the left wall towards the bottom at w equals 8, joined by arrows that get shorter every time. Dot 1 is at w 2.000000 with loss 36.000000 and dot 2 at w 5.600000 with loss 5.760000; dots 3 to 8 are packed together at the bottom and are labelled as such. The table beside gives all eight: 2.000000 and 36.000000, 5.600000 and 5.760000, 7.040000 and 0.921600, 7.616000 and 0.147456, 7.846400 and 0.023593, 7.938560 and 0.003775, 7.975424 and 0.000604, 7.990170 and 0.000097. One step is worked out in full: 2 minus 0.3 times minus 12 equals 2 plus 3.6 equals 5.6.</desc>
