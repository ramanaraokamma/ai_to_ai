<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>More merges shorten the text, until no pair is left worth gluing</title>
  <desc>Line chart of bytes per token against merges learned on the 6,972-character Week 17 corpus: 0 merges 1.00, 10 merges 1.20, 50 merges 1.49, 100 merges 1.69, 200 merges 1.99, 300 merges 2.16, 400 merges 2.30. A dashed pink line continues flat at 2.30: asking for 500 or 1,000 merges still learns only 400, because no pair occurs twice. A box states that at 300 merges there are 3,227 tokens, 2.161 bytes per token, and 1,277 of the tokens are lone spaces, 40 percent.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Bytes per token as merges are learned</text>
  <line x1="90" y1="320" x2="560" y2="320" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">1.0</text>
  <line x1="90" y1="237.8" x2="560" y2="237.8" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="237.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">1.5</text>
  <line x1="90" y1="155.7" x2="560" y2="155.7" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="155.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">2.0</text>
  <line x1="90" y1="320" x2="90" y2="326" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="205" y1="320" x2="205" y2="326" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="205" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <line x1="320" y1="320" x2="320" y2="326" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="320" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">200</text>
  <line x1="435" y1="320" x2="435" y2="326" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="435" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">300</text>
  <line x1="550" y1="320" x2="550" y2="326" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="550" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">400</text>
  <line x1="90" y1="80" x2="90" y2="320" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="320" x2="560" y2="320" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="40" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 40 200)">bytes per token (higher = shorter text)</text>
  <text x="325" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">merges learned</text>
  <polyline points="90,320 101.5,287.1 147.5,239.5 205,206.6 320,157.3 435,129.4 550,106.4" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90" cy="320" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="100" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">1.00</text>
  <circle cx="101.5" cy="287.1" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="111.5" y="305.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">1.20</text>
  <circle cx="147.5" cy="239.5" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="157.5" y="257.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">1.49</text>
  <circle cx="205" cy="206.6" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="215" y="224.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">1.69</text>
  <circle cx="320" cy="157.3" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="330" y="175.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">1.99</text>
  <circle cx="435" cy="129.4" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="445" y="147.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">2.16</text>
  <circle cx="550" cy="106.4" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="560" y="124.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">2.30</text>
  <line x1="550" y1="106.4" x2="560" y2="106.4" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <circle cx="554" cy="82.4" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="554" y="82.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="590" y="90" width="190" height="124" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="602" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">At 300 merges:</text>
  <text x="602" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">3,227 tokens</text>
  <text x="602" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">2.161 bytes per token</text>
  <text x="602" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">1,277 lone spaces</text>
  <text x="602" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">(40% of the tokens)</text>
  <rect x="590" y="232" width="190" height="100" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="608" cy="252" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="608" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="626" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">Asked for 500 or</text>
  <text x="602" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">1,000: learned 400.</text>
  <text x="602" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">No pair occurs twice,</text>
  <text x="602" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">so it stops at 2.30.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Week 17 corpus, 6,972 characters; measured on the training text itself.</text>
</svg>
