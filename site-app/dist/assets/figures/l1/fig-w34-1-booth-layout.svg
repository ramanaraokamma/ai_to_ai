<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The booth: all eleven artefacts</title>
  <desc>A fair booth seen from the front. A poster board carries the do-not-use sign and the bias report. A table holds a laptop, a data card, a test sheet, a confusion matrix, the brief, the photo counts, a sealed envelope of held-out photos and a signed demo script. Eleven numbered pins are listed underneath.</desc>

  <text x="250" y="42" font-size="24" fill="#14202B" text-anchor="middle">The booth: all eleven artefacts</text>

  <!-- poster board -->
  <rect x="120" y="66" width="260" height="122" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
  <text x="250" y="100" font-size="18" fill="#CC2B1D" text-anchor="middle" font-weight="700">DO NOT USE THIS FOR</text>
  <text x="250" y="120" font-size="12" fill="#55636F" text-anchor="middle">anything in a dark kitchen</text>
  <rect x="140" y="134" width="100" height="44" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="190" y="151" font-size="12" fill="#14202B" text-anchor="middle">bias gap</text>
  <text x="190" y="168" font-size="12" fill="#14202B" text-anchor="middle">50 points</text>
  <rect x="260" y="134" width="100" height="44" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="310" y="151" font-size="12" fill="#14202B" text-anchor="middle">30 / 40</text>
  <text x="310" y="168" font-size="12" fill="#14202B" text-anchor="middle">= 75%</text>

  <!-- table -->
  <rect x="50" y="210" width="400" height="192" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>

  <!-- laptop -->
  <rect x="70" y="250" width="130" height="92" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="80" y="258" width="110" height="58" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="135" y="282" font-size="12" fill="#14202B" text-anchor="middle">RECYCLING</text>
  <text x="135" y="302" font-size="12" fill="#14202B" text-anchor="middle">94% - blue bin</text>
  <line x1="82" y1="330" x2="188" y2="330" stroke="#55636F" stroke-width="3" stroke-linecap="round"/>

  <!-- data card -->
  <rect x="220" y="245" width="64" height="88" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="230" y1="266" x2="274" y2="266"/><line x1="230" y1="282" x2="274" y2="282"/>
    <line x1="230" y1="298" x2="274" y2="298"/><line x1="230" y1="314" x2="258" y2="314"/>
  </g>
  <!-- test sheet -->
  <rect x="296" y="245" width="64" height="88" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="306" y1="266" x2="350" y2="266"/><line x1="306" y1="282" x2="350" y2="282"/>
    <line x1="306" y1="298" x2="350" y2="298"/><line x1="306" y1="314" x2="334" y2="314"/>
  </g>
  <!-- confusion matrix sheet -->
  <rect x="372" y="245" width="64" height="88" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="386" y1="266" x2="422" y2="266"/><line x1="386" y1="288" x2="422" y2="288"/>
    <line x1="386" y1="310" x2="422" y2="310"/>
    <line x1="398" y1="256" x2="398" y2="320"/><line x1="410" y1="256" x2="410" y2="320"/>
  </g>
  <rect x="386" y="256" width="36" height="64" fill="none" stroke="#1F6FB2" stroke-width="2"/>

  <!-- brief -->
  <rect x="70" y="354" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <text x="110" y="378" font-size="12" fill="#14202B" text-anchor="middle">brief</text>
  <!-- counts -->
  <rect x="162" y="354" width="80" height="38" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <text x="202" y="378" font-size="12" fill="#14202B" text-anchor="middle">counts</text>
  <!-- envelope -->
  <rect x="254" y="354" width="80" height="38" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M254 356 L294 378 L334 356" fill="none" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <!-- demo script, signed -->
  <rect x="346" y="354" width="90" height="38" rx="6" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2"/>
  <text x="382" y="378" font-size="12" fill="#14202B" text-anchor="middle">demo</text>
  <polyline points="410,374 418,382 430,364" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pins -->
  <g stroke="#C42B8C" stroke-width="2.5" fill="#F4D5E9">
    <circle cx="134" cy="88" r="12"/><circle cx="144" cy="140" r="12"/>
    <circle cx="74" cy="248" r="12"/><circle cx="196" cy="248" r="12"/>
    <circle cx="222" cy="243" r="12"/><circle cx="298" cy="243" r="12"/><circle cx="374" cy="243" r="12"/>
    <circle cx="72" cy="352" r="12"/><circle cx="164" cy="352" r="12"/><circle cx="256" cy="352" r="12"/><circle cx="348" cy="352" r="12"/>
  </g>
  <g font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">
    <text x="134" y="89">10</text><text x="144" y="141">9</text>
    <text x="74" y="249">4</text><text x="196" y="249">8</text>
    <text x="222" y="244">5</text><text x="298" y="244">6</text><text x="374" y="244">7</text>
    <text x="72" y="353">1</text><text x="164" y="353">2</text><text x="256" y="353">3</text><text x="348" y="353">11</text>
  </g>

  <!-- legend -->
  <g stroke="#C42B8C" stroke-width="2" fill="#F4D5E9">
    <circle cx="66" cy="424" r="9"/><circle cx="66" cy="446" r="9"/><circle cx="66" cy="468" r="9"/>
    <circle cx="66" cy="490" r="9"/><circle cx="66" cy="512" r="9"/><circle cx="66" cy="534" r="9"/>
    <circle cx="66" cy="556" r="9"/><circle cx="66" cy="578" r="9"/><circle cx="66" cy="600" r="9"/>
    <circle cx="66" cy="622" r="9"/><circle cx="66" cy="644" r="9"/>
  </g>
  <g font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">
    <text x="66" y="425">1</text><text x="66" y="447">2</text><text x="66" y="469">3</text>
    <text x="66" y="491">4</text><text x="66" y="513">5</text><text x="66" y="535">6</text>
    <text x="66" y="557">7</text><text x="66" y="579">8</text><text x="66" y="601">9</text>
    <text x="66" y="623">10</text><text x="66" y="645">11</text>
  </g>
  <g font-size="14" fill="#14202B" dominant-baseline="central">
    <text x="84" y="425">Brief: the annoyance, 4 classes, success bar</text>
    <text x="84" y="447">Photo counts, balanced within 20%</text>
    <text x="84" y="469">Envelope: 20% held out before training</text>
    <text x="84" y="491">booth-v1.tm - the saved model file</text>
    <text x="84" y="513">Data card, all 8 boxes filled in</text>
    <text x="84" y="535">Test sheet: every held-out photo scored</text>
    <text x="84" y="557">Confusion matrix, drawn by hand</text>
    <text x="84" y="579">Scratch app: 4 behaviours + "not sure"</text>
    <text x="84" y="601">Bias report: the gap in percentage points</text>
    <text x="84" y="623">DO NOT USE THIS FOR sign</text>
    <text x="84" y="645">5-minute demo, ticked by a listener</text>
  </g>

  <text x="250" y="678" font-size="14" fill="#55636F" text-anchor="middle">Only two of the eleven are software. The rest is honest paperwork.</text>
</svg>
