<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the slice</title>
  <desc>The expression scores of one colon four sits above five data slots holding 45, 0, 112, 67 and 8, numbered 0 to 4 in pink underneath. A dashed vertical line stands between slot 3 and slot 4 with a question mark below it. Four blank write-in lines ask which slots are taken, how many items there are, what the dashed line is and whether slot 4 is taken.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the slice</text>
  <text x="400" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle">scores[1:4]</text>
  <rect x="130" y="100" width="92" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="176" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">45</text>
  <text x="176" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">0</text>
  <rect x="242" y="100" width="92" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="288" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="288" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">1</text>
  <rect x="354" y="100" width="92" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">112</text>
  <text x="400" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">2</text>
  <rect x="466" y="100" width="92" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="512" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">67</text>
  <text x="512" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">3</text>
  <rect x="578" y="100" width="92" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="624" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="624" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">4</text>
  <line x1="578" y1="92" x2="578" y2="168" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="578" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#845F00" text-anchor="middle">?</text>
  <text x="40" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Which slots does it take?</text>
  <rect x="400" y="212" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="233" x2="748" y2="233" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">How many items? Show the sum.</text>
  <rect x="400" y="254" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="275" x2="748" y2="275" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">What is the dashed line?</text>
  <rect x="400" y="296" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="317" x2="748" y2="317" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Is slot 4 taken? Why not?</text>
  <rect x="400" y="338" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="359" x2="748" y2="359" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
