<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The S-curve, drawn through four points we worked out by hand</title>
  <desc>A rising S-shaped curve on axes: z runs from minus 6 to plus 6 across, p runs from 0 to 1 up. Four points are ringed on the curve: z = minus 2 gives p = 0.1192, z = 0 gives exactly 0.5000, z = 1.4 gives 0.8022 and z = 3 gives 0.9526. A callout works the last one out: e to the minus 3 is 0.049787, and 1 divided by 1.049787 is 0.9526. A dashed line marks p = 0.5, which the curve crosses exactly at z = 0.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The S-curve, drawn through four</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">points we worked out by hand</text>
  <line x1="80" y1="400" x2="460" y2="400" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="72" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.0</text>
  <line x1="80" y1="255" x2="460" y2="255" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="72" y="259" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <line x1="80" y1="110" x2="460" y2="110" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="72" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1.0</text>
  <line x1="270" y1="400" x2="270" y2="104" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="80" y1="400" x2="460" y2="400" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="400" x2="80" y2="104" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="400" x2="80" y2="406" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;6</text>
  <line x1="143.3" y1="400" x2="143.3" y2="406" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="143.3" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;4</text>
  <line x1="206.7" y1="400" x2="206.7" y2="406" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="206.7" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;2</text>
  <line x1="270" y1="400" x2="270" y2="406" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="270" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="333.3" y1="400" x2="333.3" y2="406" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="333.3" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <line x1="396.7" y1="400" x2="396.7" y2="406" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="396.7" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <line x1="460" y1="400" x2="460" y2="406" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
