<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four new words of Week 21</title>
  <desc>Four picture tiles. Overfitting shows a photo learnt instead of the object. Confusion matrix shows a small labelled grid. Diagonal shows three shaded corner-to-corner cells. Off-diagonal cell shows one cell circled with a spoken sentence.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">The four new words of Week 21</text>

    <rect x="26" y="58" width="180" height="238" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <rect x="72" y="86" width="88" height="72" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="80" y="94" width="72" height="42" rx="4" fill="#D9EAF9" stroke="none"/>
    <line x1="86" y1="148" x2="126" y2="148" stroke="#55636F" stroke-width="3" stroke-linecap="round"/>
    <path d="M92 176 Q116 166 140 176" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
    <text x="116" y="204" font-size="18" fill="#14202B" text-anchor="middle">overfitting</text>
    <text x="116" y="234" font-size="14" fill="#55636F" text-anchor="middle">it learned the</text>
    <text x="116" y="254" font-size="14" fill="#55636F" text-anchor="middle">photos, not</text>
    <text x="116" y="274" font-size="14" fill="#55636F" text-anchor="middle">the object</text>

    <rect x="216" y="58" width="180" height="238" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="306" y="84" font-size="12" fill="#55636F" text-anchor="middle">said &#8594;</text>
    <text x="240" y="146" font-size="12" fill="#55636F" transform="rotate(-90 240 146)" text-anchor="middle">truth</text>
    <g stroke="#14202B" stroke-width="2" fill="none">
      <rect x="252" y="92" width="108" height="108" rx="4"/>
      <line x1="288" y1="92" x2="288" y2="200"/>
      <line x1="324" y1="92" x2="324" y2="200"/>
      <line x1="252" y1="128" x2="360" y2="128"/>
      <line x1="252" y1="164" x2="360" y2="164"/>
    </g>
    <g font-size="14" fill="#14202B" text-anchor="middle">
      <text x="270" y="115">5</text><text x="306" y="115">0</text><text x="342" y="115">0</text>
      <text x="270" y="151">0</text><text x="306" y="151">4</text><text x="342" y="151">1</text>
      <text x="270" y="187">1</text><text x="306" y="187">2</text><text x="342" y="187">2</text>
    </g>
    <text x="306" y="228" font-size="18" fill="#14202B" text-anchor="middle">confusion</text>
    <text x="306" y="250" font-size="18" fill="#14202B" text-anchor="middle">matrix</text>
    <text x="306" y="276" font-size="14" fill="#55636F" text-anchor="middle">a tally chart with</text>
    <text x="306" y="294" font-size="14" fill="#55636F" text-anchor="middle">two labels</text>

    <rect x="406" y="58" width="180" height="238" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#E2F7ED" stroke="none">
      <rect x="442" y="92" width="36" height="36"/>
      <rect x="478" y="128" width="36" height="36"/>
      <rect x="514" y="164" width="36" height="36"/>
    </g>
    <g stroke="#14202B" stroke-width="2" fill="none">
      <rect x="442" y="92" width="108" height="108" rx="4"/>
      <line x1="478" y1="92" x2="478" y2="200"/>
      <line x1="514" y1="92" x2="514" y2="200"/>
      <line x1="442" y1="128" x2="550" y2="128"/>
      <line x1="442" y1="164" x2="550" y2="164"/>
    </g>
    <g font-size="14" fill="#14202B" text-anchor="middle">
      <text x="460" y="115">5</text><text x="496" y="151">4</text><text x="532" y="187">2</text>
    </g>
    <text x="496" y="228" font-size="18" fill="#14202B" text-anchor="middle">diagonal</text>
    <text x="496" y="254" font-size="14" fill="#55636F" text-anchor="middle">truth = guess.</text>
    <text x="496" y="274" font-size="14" fill="#55636F" text-anchor="middle">All the correct</text>
    <text x="496" y="292" font-size="14" fill="#55636F" text-anchor="middle">answers: 5+4+2=11</text>

    <rect x="596" y="58" width="180" height="238" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#14202B" stroke-width="2" fill="none">
      <rect x="632" y="92" width="108" height="108" rx="4"/>
      <line x1="668" y1="92" x2="668" y2="200"/>
      <line x1="704" y1="92" x2="704" y2="200"/>
      <line x1="632" y1="128" x2="740" y2="128"/>
      <line x1="632" y1="164" x2="740" y2="164"/>
    </g>
    <rect x="668" y="164" width="36" height="36" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
    <text x="686" y="187" font-size="14" fill="#14202B" text-anchor="middle">2</text>
    <text x="686" y="228" font-size="18" fill="#14202B" text-anchor="middle">off-diagonal</text>
    <text x="686" y="250" font-size="18" fill="#14202B" text-anchor="middle">cell</text>
    <text x="686" y="276" font-size="14" fill="#55636F" text-anchor="middle">"two combs were</text>
    <text x="686" y="294" font-size="14" fill="#55636F" text-anchor="middle">called toothbrush"</text>

    <text x="400" y="340" font-size="14" fill="#55636F" text-anchor="middle">The grid does not just say how good the model is. It says exactly what got mixed up with what.</text>
    <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">The biggest number that is NOT on the diagonal is your shopping list for tomorrow's photos.</text>
  </g>
</svg>
