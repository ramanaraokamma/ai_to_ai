  <text x="76" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">30 s</text>
  <circle cx="76" cy="95" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
