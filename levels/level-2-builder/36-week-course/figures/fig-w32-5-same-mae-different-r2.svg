<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Same MAE, very different R²</title>
  <desc>Two panels. Predicting sepal length: guessing the mean is off by 0.688 centimetres and the line is off by 0.234, giving R squared 0.852. Predicting sepal width: guessing the mean is off by only 0.337 and the line is off by 0.235, giving R squared 0.393. The two MAE values are almost identical.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same MAE, very different R²</text>
  <line x1="400" y1="72" x2="400" y2="322" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="210" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">predicting sepal length</text>
  <rect x="30" y="84" width="360" height="238" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="76" y="71.4" width="88" height="196.6" rx="4" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
  <text x="120" y="61.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.688</text>
  <text x="120" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">guessing the mean</text>
  <rect x="226" y="201.1" width="88" height="66.9" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="270" y="191.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.234</text>
  <text x="270" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the line</text>
  <line x1="50" y1="268" x2="370" y2="268" stroke="#14202B" stroke-width="2"/>
  <text x="210" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">R² = 0.852</text>
  <text x="590" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">predicting sepal width</text>
  <rect x="410" y="84" width="360" height="238" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="456" y="171.7" width="88" height="96.3" rx="4" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
  <text x="500" y="161.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.337</text>
  <text x="500" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">guessing the mean</text>
  <rect x="606" y="200.9" width="88" height="67.1" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="650" y="190.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.235</text>
  <text x="650" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the line</text>
  <line x1="430" y1="268" x2="750" y2="268" stroke="#14202B" stroke-width="2"/>
  <text x="590" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">R² = 0.393</text>
  <rect x="30" y="336" width="740" height="26" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="349" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">MAE is almost identical: 0.234 cm and 0.235 cm.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">R² asks: how much better than guessing the mean?</text>
</svg>
