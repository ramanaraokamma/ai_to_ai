<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A count of 20 runs wobbles by about 2, so a gap of 2 is not a finding</title>
  <desc>First ten of 200 batches of 20 runs of the same stand-in system: 3, 7, 8, 7, 5, 8, 6, 7, 4, 3 landings. Expected count is 6; the shaded ordinary range is 6 plus or minus 2.05, 4 to 8. Batches 2 and 3 (7 and 8) are ringed. Over all 200 batches the smallest count was 1 and the largest 13, the mean 6.08, the measured wobble 2.03 against a formula value of 2.05, and 16 batches showed 9 or more.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The same system, ten times: the count moves</text>
  <rect x="80" y="159" width="440" height="82" rx="0" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="80" y1="200" x2="520" y2="200" stroke="#1F6FB2" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <line x1="80" y1="320" x2="520" y2="320" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="320" x2="80" y2="100" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="72" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="72" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">3</text>
  <text x="72" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">6</text>
  <text x="72" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">9</text>
  <text x="34" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 34 210)">landings out of 20 runs</text>
  <text x="300" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">batch (same system, new seeds each time)</text>
  <polyline points="110,260 154,180 198,160 242,180 286,220 330,160 374,200 418,180 462,240 506,260" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="260" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="110" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3</text>
  <text x="110" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <circle cx="154" cy="180" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="154" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">7</text>
  <text x="154" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <circle cx="198" cy="160" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="198" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">8</text>
  <text x="198" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <circle cx="242" cy="180" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="242" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">7</text>
  <text x="242" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <circle cx="286" cy="220" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="286" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">5</text>
  <text x="286" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <circle cx="330" cy="160" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="330" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">8</text>
  <text x="330" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <circle cx="374" cy="200" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="374" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">6</text>
  <text x="374" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7</text>
  <circle cx="418" cy="180" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="418" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">7</text>
  <text x="418" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <circle cx="462" cy="240" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="462" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">4</text>
  <text x="462" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">9</text>
  <circle cx="506" cy="260" r="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="506" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3</text>
  <text x="506" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">10</text>
  <text x="88" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">shaded: 6 &#177; 2.05, the ordinary range (4 to 8)</text>
  <text x="88" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">dashed: expected count n &#215; p = 20 &#215; 0.3 = 6</text>
  <rect x="552" y="92" width="228" height="262" rx="12" fill="#F5F8FA" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <rect x="580" y="66" width="172" height="26" rx="6" fill="#F5F8FA" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="666" y="79" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">stand-in, not a model</text>
  <text x="566" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">200 batches of 20 runs</text>
  <text x="566" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">smallest 1, largest 13</text>
  <text x="566" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">mean count 6.08</text>
  <text x="566" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">measured wobble 2.03</text>
  <text x="566" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">formula says 2.05</text>
  <text x="566" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">9 or more: 16 of 200</text>
  <text x="566" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">with nothing changed</text>
  <text x="566" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">batches 2 and 3: 7 then 8</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A gap of 2 is inside what this stand-in does with no change.</text>
</svg>
