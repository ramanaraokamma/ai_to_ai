<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Where bias comes from, in four links</title>
  <desc>Four boxes left to right. Who got photographed, training data is lopsided, model learns what it saw, somebody gets bad answers. A dashed arrow runs back from the last box to the first, labelled the fix goes here.</desc>
  <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Where bias comes from, in four links</text>

  <g stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="198" y1="145" x2="212" y2="145"/>
    <polyline points="207,138 217,145 207,152"/>
    <line x1="390" y1="145" x2="404" y2="145"/>
    <polyline points="399,138 409,145 399,152"/>
    <line x1="582" y1="145" x2="596" y2="145"/>
    <polyline points="591,138 601,145 591,152"/>
  </g>

  <rect x="30" y="90" width="165" height="110" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="222" y="90" width="165" height="110" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="414" y="90" width="165" height="110" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <rect x="606" y="90" width="165" height="110" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

  <g fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5">
    <circle cx="52" cy="112" r="14"/>
    <circle cx="244" cy="112" r="14"/>
    <circle cx="436" cy="112" r="14"/>
    <circle cx="628" cy="112" r="14"/>
  </g>
  <g font-size="14" fill="#14202B" text-anchor="middle">
    <text x="52" y="117">1</text>
    <text x="244" y="117">2</text>
    <text x="436" y="117">3</text>
    <text x="628" y="117">4</text>
  </g>

  <g font-size="18" fill="#14202B" text-anchor="middle">
    <text x="112" y="155">Who got</text>
    <text x="112" y="180">photographed</text>
    <text x="304" y="155">Training data</text>
    <text x="304" y="180">is lopsided</text>
    <text x="496" y="155">Model learns</text>
    <text x="496" y="180">what it saw</text>
    <text x="688" y="155">Somebody gets</text>
    <text x="688" y="180">bad answers</text>
  </g>

  <g font-size="14" fill="#55636F" text-anchor="middle">
    <text x="112" y="226">one person, one</text>
    <text x="112" y="244">kitchen, afternoons</text>
    <text x="304" y="226">183 daylight</text>
    <text x="304" y="244">17 lamplight</text>
    <text x="496" y="226">sharp in daylight,</text>
    <text x="496" y="244">lost by lamp</text>
    <text x="688" y="226">anyone using it</text>
    <text x="688" y="244">after dark</text>
  </g>

  <path d="M688 270 V310 H112 V212" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="105,219 112,208 119,219" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="300" y="292" width="200" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="315" font-size="18" fill="#14202B" text-anchor="middle">the fix goes here</text>

  <text x="400" y="366" font-size="14" fill="#55636F" text-anchor="middle">Nobody was unkind. Somebody was in a hurry, and the counts remember it.</text>
</svg>
