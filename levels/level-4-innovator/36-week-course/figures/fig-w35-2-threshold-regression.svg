  <circle cx="324.2" cy="200" r="11" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <polyline points="320.2,196 328.2,204" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
