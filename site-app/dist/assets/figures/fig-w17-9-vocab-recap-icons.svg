<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 400" role="img">
  <title>Six words you already own</title>
  <desc>Six picture tiles for words used in this lab: training shown as a machine, epoch shown as a loop arrow around a stack of photos marked fifty times, baseline shown as a low dashed line, confidence score shown as three bars, margin shown as the gap between two bars, and class balance shown as a level scale.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="474" y="42" font-size="24" fill="#14202B" text-anchor="middle">Six words you already own</text>

    <rect x="40" y="76" width="128" height="216" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(55,108) scale(0.7)">
      <rect x="28" y="14" width="84" height="72" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="70" cy="50" r="14" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
      <circle cx="70" cy="50" r="5" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
      <line x1="2" y1="48" x2="14" y2="48" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
      <polyline points="10,42 18,48 10,54" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="104" y="248" font-size="16" fill="#14202B" text-anchor="middle">training</text>
    <text x="104" y="270" font-size="12" fill="#55636F" text-anchor="middle">it studies, it tunes</text>

    <rect x="188" y="76" width="128" height="216" rx="12" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <line x1="206" y1="196" x2="298" y2="196" stroke="#14202B" stroke-width="2"/>
    <line x1="206" y1="152" x2="298" y2="152" stroke="#845F00" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="214" y="152" width="26" height="44" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
    <rect x="252" y="120" width="26" height="76" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
    <text x="252" y="146" font-size="12" fill="#55636F" text-anchor="middle">33%</text>
    <text x="252" y="248" font-size="16" fill="#14202B" text-anchor="middle">baseline</text>
    <text x="252" y="270" font-size="12" fill="#55636F" text-anchor="middle">beat this or go home</text>

    <rect x="336" y="76" width="128" height="216" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="354" y="120" width="86" height="16" rx="5" fill="#1F6FB2"/>
    <rect x="354" y="146" width="30" height="16" rx="5" fill="#55636F"/>
    <rect x="354" y="172" width="22" height="16" rx="5" fill="#55636F"/>
    <line x1="354" y1="198" x2="440" y2="198" stroke="#14202B" stroke-width="1.5"/>
    <text x="440" y="214" font-size="12" fill="#55636F" text-anchor="end">= 100</text>
    <text x="400" y="248" font-size="16" fill="#14202B" text-anchor="middle">confidence</text>
    <text x="400" y="270" font-size="16" fill="#14202B" text-anchor="middle">score</text>

    <rect x="484" y="76" width="128" height="216" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <rect x="502" y="128" width="88" height="16" rx="5" fill="#C42B8C"/>
    <rect x="502" y="168" width="32" height="16" rx="5" fill="#55636F"/>
    <line x1="534" y1="156" x2="590" y2="156" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <polyline points="540,150 532,156 540,162" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="584,150 592,156 584,162" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="548" y="248" font-size="16" fill="#14202B" text-anchor="middle">margin</text>
    <text x="548" y="270" font-size="12" fill="#55636F" text-anchor="middle">top − second</text>

    <rect x="632" y="76" width="128" height="216" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(656,116) scale(0.8)">
      <line x1="50" y1="26" x2="50" y2="80" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 88 L38 80 H62 L68 88 Z" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
      <line x1="16" y1="26" x2="84" y2="26" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="26" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <path d="M2 44 Q16 62 30 44 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <path d="M70 44 Q84 62 98 44 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="696" y="248" font-size="16" fill="#14202B" text-anchor="middle">class</text>
    <text x="696" y="270" font-size="16" fill="#14202B" text-anchor="middle">balance</text>

    <rect x="780" y="76" width="128" height="216" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="820" y="140" width="48" height="34" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="814" y="148" width="48" height="34" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="808" y="156" width="48" height="34" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M796 172 A 48 48 0 1 1 844 220" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
    <polyline points="838,214 846,221 838,228" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="868" y="126" font-size="13" fill="#6D28D9" text-anchor="middle">&#215; 50</text>
    <text x="844" y="248" font-size="16" fill="#14202B" text-anchor="middle">epoch</text>
    <text x="844" y="270" font-size="12" fill="#55636F" text-anchor="middle">one full pass</text>

    <text x="474" y="342" font-size="14" fill="#55636F" text-anchor="middle">No new words this week. You use all six of these before you press Train.</text>
  </g>
</svg>
