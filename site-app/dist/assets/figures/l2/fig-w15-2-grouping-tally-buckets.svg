<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Grouping: one bucket per value</title>
  <desc>Twelve rows drop into four buckets labelled Falcons, Tigers, Hawks and Owls, holding four, four, three and one tally marks. Below, the sum four plus four plus three plus one equals twelve is marked correct.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Grouping: one bucket per value</text>
  <rect x="330" y="66" width="140" height="42" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">12 rows</text>
  <path d="M370 112 L130 158" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <path d="M388 112 L308 158" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <path d="M412 112 L492 158" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <path d="M430 112 L670 158" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sorted by the team field</text>
  <path d="M56 166 H204 L188 286 H72 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="130" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Falcons</text>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="212" x2="100" y2="248"/>
    <line x1="120" y1="212" x2="120" y2="248"/>
    <line x1="140" y1="212" x2="140" y2="248"/>
    <line x1="160" y1="212" x2="160" y2="248"/>
  </g>
  <text x="130" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">4</text>
  <path d="M234 166 H382 L366 286 H250 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="308" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Tigers</text>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round">
    <line x1="278" y1="212" x2="278" y2="248"/>
    <line x1="298" y1="212" x2="298" y2="248"/>
    <line x1="318" y1="212" x2="318" y2="248"/>
    <line x1="338" y1="212" x2="338" y2="248"/>
  </g>
  <text x="308" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">4</text>
  <path d="M418 166 H566 L550 286 H434 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="492" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Hawks</text>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round">
    <line x1="472" y1="212" x2="472" y2="248"/>
    <line x1="492" y1="212" x2="492" y2="248"/>
    <line x1="512" y1="212" x2="512" y2="248"/>
  </g>
  <text x="492" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">3</text>
  <path d="M596 166 H744 L728 286 H612 Z" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="670" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Owls</text>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round">
    <line x1="670" y1="212" x2="670" y2="248"/>
  </g>
  <text x="670" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">1</text>
  <text x="670" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">watch this one</text>
  <g transform="translate(214,314) scale(0.32)">
  <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="256" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">4 + 4 + 3 + 1 = 12, so no row was dropped</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nothing is thrown away. Grouping only decides which pile each row belongs to.</text>
</svg>
