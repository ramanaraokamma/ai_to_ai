<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four parts of a Python traceback, with the last line marked as the one to read first</title>
  <desc>A terminal panel shows a four-line traceback ending in a NameError, with the last line highlighted in red. Four numbered pins on the right label the parts: a header to ignore, the file and line number, your own quoted code, and the kind of problem. A green band underneath gives the reading order: last line first, then the line number, then your code.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Every traceback has four parts. Read part 4 first.</text>
  <rect x="40" y="70" width="452" height="176" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="40" y1="100" x2="492" y2="100" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="56" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">terminal</text>
  <rect x="48" y="203" width="436" height="24" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="56" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">Traceback (most recent call last):</text>
  <text x="56" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">  File "total.py", line 4, in &lt;module&gt;</text>
  <text x="56" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    print(f"The total is {totl}")</text>
  <text x="56" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" font-weight="600">NameError: name 'totl' is not defined</text>
  <line x1="500" y1="124" x2="528" y2="124" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(528 124) rotate(0.00)"/>
  <circle cx="548" cy="124" r="15" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3"/>
  <text x="548" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="570" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">a header. Ignore it.</text>
  <line x1="500" y1="154" x2="528" y2="154" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(528 154) rotate(0.00)"/>
  <circle cx="548" cy="154" r="15" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="548" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="570" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">WHICH FILE, WHICH LINE</text>
  <line x1="500" y1="184" x2="528" y2="184" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(528 184) rotate(0.00)"/>
  <circle cx="548" cy="184" r="15" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3"/>
  <text x="548" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="570" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">your line, quoted back</text>
  <line x1="500" y1="214" x2="528" y2="214" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(528 214) rotate(0.00)"/>
  <circle cx="548" cy="214" r="15" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="548" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="570" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">THE KIND OF PROBLEM</text>
  <rect x="40" y="266" width="720" height="60" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">READ IN THIS ORDER</text>
  <circle cx="192" cy="303" r="14" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
  <text x="192" y="303" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="214" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">the last line</text>
  <line x1="320" y1="303" x2="364" y2="303" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(364 303) rotate(0.00)"/>
  <circle cx="386" cy="303" r="14" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
  <text x="386" y="303" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="408" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">the line number</text>
  <line x1="514" y1="303" x2="558" y2="303" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(558 303) rotate(0.00)"/>
  <circle cx="592" cy="303" r="14" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
  <text x="592" y="303" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="614" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">your code</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The last line names the KIND of problem. Everything else tells you where.</text>
  <text x="400" y="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three steps, in that order, every single time.</text>
</svg>
