  <line x1="210" y1="206" x2="256" y2="222" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(256 222) rotate(19.2)"/>
  <rect x="602" y="92" width="168" height="40" rx="8" fill="none" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <circle cx="614" cy="84" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="614" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">C</text>
  <line x1="600" y1="112" x2="590" y2="136" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(590 136) rotate(112.6)"/>
  <rect x="602" y="186" width="168" height="40" rx="8" fill="none" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <circle cx="614" cy="178" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="614" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">D</text>
  <line x1="600" y1="206" x2="578" y2="194" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(578 194) rotate(-151.4)"/>
  <rect x="520" y="316" width="168" height="40" rx="8" fill="none" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <circle cx="532" cy="308" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="532" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">E</text>
  <line x1="516" y1="324" x2="480" y2="288" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(480 288) rotate(-135)"/>
  <text x="360" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One word or phrase per box: row count, bucket label, counting dictionary, the group you would not report - and what E proves.</text>
</svg>
