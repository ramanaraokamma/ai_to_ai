<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: a squasher with the minus sign lost</title>
  <desc>Two panels. On the left, crossed out, a red box printing sigmoid of 1.4 becomes 0.1978, with notes that there is no error message and that a busy oven with a long drive now comes out as almost certainly on time. On the right, ticked, a green box printing sigmoid of 1.4 becomes 0.8022, worked out as e to the minus 1.4 equals 0.246597, plus 1 gives 1.246597, and 1 divided by that gives 0.8022, with the note that 0.1978 is exactly 1 minus 0.8022 so the S-curve is running backwards. A strip underneath says to check against a hand answer that is not z equals 0, because sigmoid of 0 is 0.5000 either way round. The caption adds that 0.8022 plus 0.1978 equals 1.0000, which is how you catch a lost minus sign.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Wrong and right: a squasher with the minus sign lost</text>
  <rect x="30" y="62" width="350" height="292" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="48" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">&#10007; e^(z) &#8212; the minus dropped</text>
  <rect x="60" y="108" width="290" height="76" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="76" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">sigmoid(1.4) &#8594; 0.1978</text>
  <text x="76" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#8220;almost certainly on time&#8221;</text>
  <text x="60" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">No error. No warning. Nothing red.</text>
  <text x="60" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Busy oven, five km to drive, and the</text>
  <text x="60" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">model is relaxed. The S-curve is</text>
  <text x="60" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">running backwards, silently.</text>
  <line x1="322" y1="122" x2="338" y2="138" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/><line x1="338" y1="122" x2="322" y2="138" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <rect x="420" y="62" width="350" height="292" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="438" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">&#10003; e^(&#8722;z) &#8212; as you worked it</text>
  <rect x="450" y="108" width="290" height="76" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="466" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">sigmoid(1.4) &#8594; 0.8022</text>
  <text x="466" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#8220;probably late&#8221;</text>
  <text x="450" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">e^(&#8722;1.4) = 0.246597</text>
  <text x="450" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">1 + that  = 1.246597</text>
  <text x="450" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">1 &#247; that  = 0.8022</text>
  <text x="450" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">and 0.1978 is exactly 1 &#8722; 0.8022.</text>
  <polyline points="711,130 717,136 729,122" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="292" width="740" height="62" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">The test: check against a hand answer that is NOT z = 0.</text>
  <text x="400" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sigmoid(0) = 0.5000 either way round &#8212; a test that passes on broken code is worse than none.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">0.8022 + 0.1978 = 1.0000. sigmoid(z) + sigmoid(&#8722;z) is always 1, and that is the check.</text>
</svg>
