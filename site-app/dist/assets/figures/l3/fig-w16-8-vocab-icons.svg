<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six words from Week 16, drawn</title>
  <desc>Six labelled tiles. Neuron: three input circles feeding one purple circle, labelled multiply, add, squash. Pre-activation z: a column of the four terms 0.8, minus 0.7, 0.6 and minus 0.5 adding to 0.20. Activation a: a box holding 0.200 with the words ReLU let it through. ReLU: a bent line, flat on the left and rising on the right, with the corner marked at zero. Tanh: an S shape running from minus 1 up to plus 1 with the value minus 0.980 marked. Hidden layer: two purple circles between an input and an output, with the note you never look at what they say.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six words from Week 16, drawn</text>

  <rect x="30" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">neuron / unit</text>
  <circle cx="62" cy="120" r="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="62" cy="146" r="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="62" cy="172" r="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <line x1="71" y1="120" x2="126" y2="142" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="146" x2="126" y2="146" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="172" x2="126" y2="150" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="146" cy="146" r="20" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="185" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">multiply,</text>
  <text x="185" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">add, squash</text>
  <text x="44" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">three steps, nothing else</text>

  <rect x="287" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="301" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">pre-activation z</text>
  <text x="330" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="end">0.8</text>
  <text x="330" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="end">&#8722;0.7</text>
  <text x="330" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="end">0.6</text>
  <text x="330" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="end">&#8722;0.5</text>
  <line x1="292" y1="185" x2="336" y2="185" stroke="#14202B" stroke-width="2"/>
  <text x="336" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C">&#8594;</text>
  <rect x="366" y="126" width="86" height="38" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="409" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.20</text>
  <text x="301" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">before the squash; any number at all</text>

  <rect x="544" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="558" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">activation a</text>
  <rect x="570" y="120" width="76" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="608" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.200</text>
  <text x="664" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">ReLU let</text>
  <text x="664" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">it through</text>
  <text x="558" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what the neuron actually says</text>

  <rect x="30" y="224" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">ReLU</text>
  <line x1="60" y1="330" x2="230" y2="330" stroke="#C7CDD4" stroke-width="2"/>
  <line x1="145" y1="266" x2="145" y2="340" stroke="#C7CDD4" stroke-width="2"/>
  <polyline points="62,330 145,330 226,272" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="145" cy="330" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="100" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">says 0</text>
  <text x="196" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">slope 1</text>
  <text x="44" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">negatives to zero, positives through</text>

  <rect x="287" y="224" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="301" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">tanh</text>
  <line x1="317" y1="304" x2="487" y2="304" stroke="#C7CDD4" stroke-width="2"/>
  <line x1="402" y1="266" x2="402" y2="342" stroke="#C7CDD4" stroke-width="2"/>
  <path d="M 319 340 C 360 338 386 330 402 304 C 418 278 444 270 485 268" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="332" cy="338" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="336" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#8722;0.980</text>
  <text x="450" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">up to +1</text>
  <text x="301" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the only one that can go negative</text>

  <rect x="544" y="224" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="558" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">hidden layer</text>
  <circle cx="576" cy="300" r="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="654" cy="280" r="14" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="654" cy="320" r="14" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="734" cy="300" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <line x1="586" y1="300" x2="640" y2="282" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="586" y1="300" x2="640" y2="318" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="668" y1="282" x2="724" y2="298" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="668" y1="318" x2="724" y2="302" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="654" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 units</text>
  <text x="558" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">you never look at what they say</text>

  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every number on this page came off your own screen.</text>
</svg>
