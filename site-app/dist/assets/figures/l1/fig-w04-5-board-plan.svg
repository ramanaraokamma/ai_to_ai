<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>What the board should look like at minute 26</title>
  <desc>A board with the sentence one row equals one blank written large, two numbered rules underneath, a note about the header, and an empty three column table sketched on the right hand side.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Board plan &#8212; copy this exactly</text>

  <rect x="30" y="62" width="740" height="272" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>

  <text x="56" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B">ONE ROW = ONE</text>
  <line x1="256" y1="118" x2="416" y2="118" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="336" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">leave this blank</text>

  <circle cx="70" cy="178" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="70" y="179" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="96" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Every row is the same kind of thing.</text>
  <text x="96" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">No days mixed in with objects.</text>

  <circle cx="70" cy="238" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="70" y="239" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="96" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Every column is measured the</text>
  <text x="96" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">same way, in every single row.</text>

  <text x="56" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">The header is the top row. It names the columns. It is not data.</text>

  <rect x="520" y="118" width="220" height="146" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M520 126 A8 8 0 0 1 528 118 H732 A8 8 0 0 1 740 126 V152 H520 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="520" y1="189" x2="740" y2="189"/><line x1="520" y1="226" x2="740" y2="226"/>
    <line x1="593" y1="152" x2="593" y2="264"/><line x1="666" y1="152" x2="666" y2="264"/>
  </g>
  <line x1="520" y1="152" x2="740" y2="152" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="520" y="118" width="220" height="146" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="556" y="135" dominant-baseline="central">?</text>
    <text x="629" y="135" dominant-baseline="central">?</text>
    <text x="703" y="135" dominant-baseline="central">?</text>
    <text x="630" y="286">draw it empty &#8212; they fill it</text>
  </g>

  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">This stays on the board for the whole lesson. Point at it every time the student drifts.</text>
</svg>
