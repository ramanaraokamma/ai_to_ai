<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Layer norm takes its mean and spread from one example's row; batch norm takes them from one feature's column across the batch</title>
  <desc>Two grids of four examples (rows A to D) by four features (columns 1 to 4). In the left grid row B is highlighted and holds 2, 4, 6, 8; an arrow leads to the normalised row minus 1.342, minus 0.447, 0.447, 1.342, with a note that mean 5 and spread 2.236 come from that row alone. In the right grid column 2 is highlighted; an arrow leads to a box saying the same arithmetic runs down the column, so the mean and spread need the other examples.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The two norms take their mean from different places</text>
  <text x="182" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Layer norm: one row at a time</text>
