  <title>One formula, one drag, one hundred answers</title>
  <desc>A spreadsheet mock-up. The formula bar holds one long edge-filter formula. Cell C18 is highlighted and a dashed arrow runs from its drag handle down to cell L27, filling 100 cells.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One formula, one drag, one hundred answers</text>
