  <text x="165.0" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">45</text>
  <text x="255.0" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">185</text>
  <text x="345.0" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">90</text>
  <text x="435.0" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">230</text>
  <line x1="500" y1="194" x2="580" y2="194" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="194" x2="700" y2="194" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="60" y="206" width="660" height="42" rx="0" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="90.0" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">C</text>
  <text x="165.0" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">60</text>
  <text x="255.0" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">200</text>
  <text x="345.0" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">105</text>
  <text x="435.0" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">245</text>
  <line x1="500" y1="236" x2="580" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="236" x2="700" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="60" y="248" width="660" height="42" rx="0" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="90.0" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">D</text>
  <text x="165.0" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">55</text>
  <text x="255.0" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">195</text>
  <text x="345.0" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">100</text>
  <text x="435.0" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">150</text>
  <line x1="500" y1="278" x2="580" y2="278" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="278" x2="700" y2="278" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="60" y="122" width="660" height="168" rx="0" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="480" y1="122" x2="480" y2="290" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Fill in the six edge values. Three rows tell the same story. One does not.</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Then say what could have happened at that spot.</text>
