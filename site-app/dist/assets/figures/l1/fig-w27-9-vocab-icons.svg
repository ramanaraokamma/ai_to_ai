<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week’s three words</title>
  <desc>Three tiles. A stack of written pages for corpus. A box holding the word pizza and a smaller box holding a full stop for token. A pair of scissors cutting between two words for tokenize.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week’s three words</text>
  <rect x="50" y="90" width="220" height="190" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="160" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">corpus</text>
  <text x="160" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">the pile of text we learn from</text>
  <rect x="290" y="90" width="220" height="190" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">token</text>
  <text x="400" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">one piece after chopping</text>
  <rect x="530" y="90" width="220" height="190" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="640" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">tokenize</text>
  <text x="640" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">to chop text into tokens</text>
  <rect x="110" y="134" width="78" height="96" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="126" y="122" width="78" height="96" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="142" y="110" width="78" height="96" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="152" y1="128" x2="200" y2="128" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="144" x2="200" y2="144" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="160" x2="200" y2="160" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="176" x2="200" y2="176" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="192" x2="200" y2="192" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <rect x="340" y="140" width="100" height="42" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="390.0" y="161.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">pizza</text>
  <rect x="340" y="190" width="44" height="42" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="362.0" y="211.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">.</text>
  <text x="420" y="211" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">also a</text>
  <text x="420" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">token</text>
  <text x="640" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">pizza  tonight</text>
  <line x1="640" y1="112" x2="640" y2="220" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="626" y1="194" x2="652" y2="146" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="654" y1="194" x2="628" y2="146" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="624" cy="204" r="9" fill="#FFFFFF" stroke="#55636F" stroke-width="2.5"/>
  <circle cx="656" cy="204" r="9" fill="#FFFFFF" stroke="#55636F" stroke-width="2.5"/>
  <circle cx="640" cy="170" r="4" fill="#14202B"/>
  <text x="400" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three words, and that is the whole vocabulary for this week.</text>
</svg>
