<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six questions, and two of them are hard</title>
  <desc>Six numbered question cards laid out two rows by three. Each card holds a question an audience might ask and, below a divider, the ingredients a good answer must contain. Two cards, about the sample size and about whether anyone should decide with the result, are tinted and labelled hard.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six questions, and two of them are hard</text>
<rect x="30" y="90" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="44" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">1. How do you know the</text>
<text x="44" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">model actually works?</text>
<line x1="44" y1="148" x2="236" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
<text x="44" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the metric, its units, and</text>
<text x="44" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the baseline it beats</text>
<rect x="290" y="90" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="304" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2. Why did you pick that</text>
<text x="304" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">model, and not the other?</text>
<line x1="304" y1="148" x2="496" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
<text x="304" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one reason that is not</text>
<text x="304" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the score</text>
<rect x="550" y="90" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="564" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">3. Couldn't you just use</text>
<text x="564" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the average instead?</text>
<line x1="564" y1="148" x2="756" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
<text x="564" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">point at the baseline row:</text>
<text x="564" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">off by 7.98 minutes</text>
<rect x="30" y="220" width="220" height="110" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="44" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">4. Isn't 126 rows really</text>
<text x="44" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">quite small?</text>
<line x1="44" y1="278" x2="236" y2="278" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
<text x="44" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">yes - and say how small:</text>
<text x="44" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">3.8% a row</text>
<text x="236" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">hard</text>
<rect x="290" y="220" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="304" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">5. Did you delete any data</text>
<text x="304" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">that didn't fit?</text>
<line x1="304" y1="278" x2="496" y2="278" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
<text x="304" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the cleaning log, out loud,</text>
<text x="304" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">reasons included</text>
<rect x="550" y="220" width="220" height="110" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
<text x="564" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">6. Should anyone decide</text>
<text x="564" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">anything with this yet?</text>
<line x1="564" y1="278" x2="756" y2="278" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
<text x="564" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a yes or a no, plus what</text>
<text x="564" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">would change it</text>
<text x="756" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">hard</text>
<text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Rehearse all six out loud. The two marked hard decide whether the room believes you.</text>
</svg>
