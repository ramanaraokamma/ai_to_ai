<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two rows of slots side by side: the top row has four filled slots, the bottom row has three filled slots and one empty slot with a cross over it, showing there is no partner for the fourth value</title>
  <desc>The top row, labelled morning shape 4, has four blue slots holding 1200, 900, 1500 and 1100. The bottom row, labelled evening shape 3, has three blue slots holding 800, 1000 and 700, and a fourth dashed red slot holding a question mark. Green ticks join the first three pairs; a red cross marks the fourth, labelled no partner for slot 3. A red band reads: numpy refuses, it will not invent a zero for the empty slot.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">shapes (4,) and (3,) cannot be paired up</text>
  <text x="132" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="end">morning</text>
  <text x="132" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">shape (4,)</text>
  <rect x="150" y="78" width="111" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="205.5" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1200</text>
  <rect x="275" y="78" width="111" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="330.5" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">900</text>
  <rect x="400" y="78" width="111" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="455.5" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1500</text>
  <rect x="525" y="78" width="111" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="580.5" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1100</text>
  <text x="132" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="end">evening</text>
  <text x="132" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">shape (3,)</text>
  <rect x="150" y="190" width="111" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="205.5" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">800</text>
  <rect x="275" y="190" width="111" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="330.5" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1000</text>
  <rect x="400" y="190" width="111" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="455.5" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">700</text>
  <rect x="525" y="190" width="111" height="54" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-dasharray="7 6" stroke-linejoin="round"/>
  <text x="580.5" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">?</text>
  <line x1="205.5" y1="136" x2="205.5" y2="186" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(192.5,148) scale(0.3824)"><circle cx="34" cy="34" r="32" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="4"/><polyline points="18,36 29,48 52,22" fill="none" stroke="#1B7A4B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <line x1="330.5" y1="136" x2="330.5" y2="186" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(317.5,148) scale(0.3824)"><circle cx="34" cy="34" r="32" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="4"/><polyline points="18,36 29,48 52,22" fill="none" stroke="#1B7A4B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <line x1="455.5" y1="136" x2="455.5" y2="186" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(442.5,148) scale(0.3824)"><circle cx="34" cy="34" r="32" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="4"/><polyline points="18,36 29,48 52,22" fill="none" stroke="#1B7A4B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <line x1="580.5" y1="136" x2="580.5" y2="186" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <g transform="translate(566.5,147) scale(0.4118)"><circle cx="34" cy="34" r="32" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="4"/><line x1="22" y1="22" x2="46" y2="46" stroke="#CC2B1D" stroke-width="7" stroke-linecap="round"/><line x1="46" y1="22" x2="22" y2="46" stroke="#CC2B1D" stroke-width="7" stroke-linecap="round"/></g>
  <text x="610.5" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">no partner</text>
  <text x="610.5" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">for slot 3</text>
  <rect x="40" y="272" width="720" height="56" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">numpy refuses. It will NOT invent a zero for the empty slot.</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The bug is in the data on lines 3 and 4, not in the + on line 5.</text>
  <text x="400" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">Check it in one line before you add:  print(morning.shape, evening.shape)</text>
</svg>
