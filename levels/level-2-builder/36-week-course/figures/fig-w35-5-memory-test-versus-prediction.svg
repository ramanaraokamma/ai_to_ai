<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A memory test is not a prediction</title>
  <desc>The same model sits between two exam papers. On the left it is handed the 100 rows it already learned from and scores an error of 1.71 minutes, labelled a memory test. On the right it is handed 26 rows it has never seen and scores 2.35 minutes, labelled a result. Only two names in the code changed between them.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A memory test is not a prediction</text>
  <rect x="316" y="168" width="168" height="76" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="196" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">the same model</text>
  <text x="400" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">tree depth=4</text>
  <rect x="20" y="62" width="260" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="150" y="88" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">exam paper 1</text>
  <rect x="46" y="102" width="208" height="84" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="150" y="128" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">100 rows</text>
  <text x="150" y="156" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">it already learned from</text>
  <line x1="258" y1="206" x2="310" y2="206" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(310 206) rotate(0.0)"/>
  <path d="M46 214 q0 -8 8 -8 H236 L254 224 V282 q0 8 -8 8 H54 q-8 0 -8 -8 Z" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M236 206 V224 H254 Z" fill="#F5F8FA" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="150" y="240" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">MAE 1.71 minutes</text>
  <text x="150" y="266" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">a MEMORY test</text>
  <g transform="translate(130,300) scale(0.5882)">
    <circle cx="34" cy="34" r="31" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="6"/>
    <line x1="20" y1="20" x2="48" y2="48" stroke="#CC2B1D" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="20" x2="20" y2="48" stroke="#CC2B1D" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="150" y="356" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">not a result</text>
  <rect x="520" y="62" width="260" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="650" y="88" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">exam paper 2</text>
  <rect x="546" y="102" width="208" height="84" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="650" y="128" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">26 rows</text>
  <text x="650" y="156" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">it has never seen</text>
  <line x1="490" y1="206" x2="542" y2="206" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(542 206) rotate(0.0)"/>
  <path d="M546 214 q0 -8 8 -8 H736 L754 224 V282 q0 8 -8 8 H554 q-8 0 -8 -8 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M736 206 V224 H754 Z" fill="#F5F8FA" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="650" y="240" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">MAE 2.35 minutes</text>
  <text x="650" y="266" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">a RESULT</text>
  <g transform="translate(630,300) scale(0.5882)">
    <circle cx="34" cy="34" r="31" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="6"/>
    <polyline points="18,36 30,49 52,20" fill="none" stroke="#1B7A4B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="650" y="356" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">worse, and honest</text>
  <text x="400" y="292" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">two names</text>
  <text x="400" y="310" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">changed</text>
  <text x="400" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">X_train → X_test</text>
  <text x="400" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">y_train → y_test</text>
  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Neither version printed a warning. The broken one just printed a nicer number.</text>
</svg>
