  <line x1="430" y1="210" x2="764" y2="210" stroke="#14202B" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="764" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">half = 0.5</text>
  <rect x="575" y="104" width="180" height="26" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="665" y="117" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">half-life: 6.58 steps</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Each step multiplies by 0.9, so the first value counts for half after 6.58 steps.</text>
</svg>
