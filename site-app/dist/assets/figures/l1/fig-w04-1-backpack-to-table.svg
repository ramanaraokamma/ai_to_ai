<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>From a backpack to a table, in three steps</title>
  <desc>Three panels left to right. Panel one, a backpack tipped over with a book, a ball, a pencil and a bottle falling out. Panel two, the same four objects lined up in a stack with a dashed line beside each one, labelled one row is one object. Panel three, a ruled table with a shaded header row and four filled rows.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A pile becomes a table in three steps</text>

  <rect x="30" y="70" width="230" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="285" y="70" width="230" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="540" y="70" width="230" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <g transform="translate(52,96) rotate(-22 45 55)">
    <rect x="10" y="16" width="72" height="86" rx="16" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M10 44 H82" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 16 Q46 -6 68 16" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
    <rect x="30" y="58" width="32" height="24" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <circle cx="150" cy="176" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <rect x="152" y="216" width="54" height="38" rx="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="162" y1="228" x2="196" y2="228" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
  <line x1="162" y1="240" x2="188" y2="240" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="288" x2="158" y2="272" stroke="#845F00" stroke-width="7" stroke-linecap="round"/>
  <rect x="212" y="242" width="24" height="56" rx="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="218" y="232" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>

  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="352" y1="130" x2="496" y2="130"/>
    <line x1="352" y1="176" x2="496" y2="176"/>
    <line x1="352" y1="222" x2="496" y2="222"/>
    <line x1="352" y1="268" x2="496" y2="268"/>
  </g>
  <circle cx="325" cy="130" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <rect x="311" y="164" width="28" height="22" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="311" y1="226" x2="339" y2="216" stroke="#845F00" stroke-width="5" stroke-linecap="round"/>
  <rect x="317" y="252" width="16" height="32" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="360" y="126">ball</text>
    <text x="360" y="172">book</text>
    <text x="360" y="218">pencil</text>
    <text x="360" y="264">bottle</text>
  </g>

  <rect x="562" y="112" width="186" height="176" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M562 120 A8 8 0 0 1 570 112 H740 A8 8 0 0 1 748 120 V148 H562 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="562" y1="183" x2="748" y2="183"/>
    <line x1="562" y1="218" x2="748" y2="218"/>
    <line x1="562" y1="253" x2="748" y2="253"/>
    <line x1="609" y1="148" x2="609" y2="288"/>
    <line x1="655" y1="148" x2="655" y2="288"/>
    <line x1="701" y1="148" x2="701" y2="288"/>
  </g>
  <line x1="562" y1="148" x2="748" y2="148" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="562" y="112" width="186" height="176" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#55636F">
    <rect x="571" y="126" width="28" height="6" rx="3"/>
    <rect x="617" y="126" width="28" height="6" rx="3"/>
    <rect x="663" y="126" width="28" height="6" rx="3"/>
    <rect x="709" y="126" width="28" height="6" rx="3"/>
    <rect x="571" y="162" width="28" height="6" rx="3"/><rect x="617" y="162" width="28" height="6" rx="3"/><rect x="663" y="162" width="28" height="6" rx="3"/><rect x="709" y="162" width="28" height="6" rx="3"/>
    <rect x="571" y="197" width="28" height="6" rx="3"/><rect x="617" y="197" width="28" height="6" rx="3"/><rect x="663" y="197" width="28" height="6" rx="3"/><rect x="709" y="197" width="28" height="6" rx="3"/>
    <rect x="571" y="232" width="28" height="6" rx="3"/><rect x="617" y="232" width="28" height="6" rx="3"/><rect x="663" y="232" width="28" height="6" rx="3"/><rect x="709" y="232" width="28" height="6" rx="3"/>
    <rect x="571" y="267" width="28" height="6" rx="3"/><rect x="617" y="267" width="28" height="6" rx="3"/><rect x="663" y="267" width="28" height="6" rx="3"/><rect x="709" y="267" width="28" height="6" rx="3"/>
  </g>

  <g transform="translate(262,182) scale(0.22)">
    <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(517,182) scale(0.22)">
    <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="145" y="340">1. Tip it all out</text>
    <text x="400" y="340">2. Agree: one row = one object</text>
    <text x="655" y="340">3. Fill the table</text>
  </g>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Step 2 is the one everybody skips, and it is the one that decides everything.</text>
</svg>
