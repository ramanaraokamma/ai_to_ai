<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The finished board</title>
  <desc>Three stacked blocks. The first is the by-hand work for 2, 4, 6, 8 and 100: the mean is 120 divided by 5 which is 24, the standard deviation is the square root of 7240 divided by 5, that is the square root of 1448, which is 38.0526, and the range is 100 minus 2 which is 98; then the five z-scores minus 0.5781, minus 0.5256, minus 0.4730, minus 0.4205 and plus 1.9972, and the five min-max values 0, 0.0204, 0.0408, 0.0612 and 1. The second block is marked correct and shows scikit-learn printing a mean of 24, a scale of 38.05259518 and the same five z-scores. The third block is the written judgement: use the z-score here, because min-max squeezes four of the five values into 0.0612 of the ruler.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The finished board</text>
  <text x="30" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">By hand, on graph paper</text>
  <rect x="30" y="88" width="440" height="176" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="46" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">mean</text>
  <text x="130" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">120 &#247; 5 = 24</text>
  <text x="46" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">sd</text>
  <text x="130" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#8730;(7240 &#247; 5) = &#8730;1448 = 38.0526</text>
  <text x="46" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">range</text>
  <text x="130" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">100 &#8722; 2 = 98</text>
  <line x1="44" y1="172" x2="456" y2="172" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="46" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">x</text>
  <text x="150" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">z-score</text>
  <text x="300" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">min-max</text>
  <text x="46" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2      4      6      8      100</text>
  <text x="150" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#8722;0.5781   &#8722;0.5256   &#8722;0.4730   &#8722;0.4205   +1.9972</text>
  <text x="150" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.0000   0.0204   0.0408   0.0612   1.0000</text>
  <text x="46" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">z</text>
  <text x="46" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">min-max</text>
  <text x="30" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Then the check</text>
  <rect x="30" y="308" width="440" height="130" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(42,316) scale(0.34)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="84" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">sklearn agrees to 4 decimal places</text>
  <text x="46" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">scaler.mean_   [24.]</text>
  <text x="46" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">scaler.scale_  [38.05259518]</text>
  <text x="46" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">transform      &#8722;0.5781  &#8722;0.5256  &#8722;0.4730  &#8722;0.4205  1.9972</text>
  <text x="46" y="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">the machine did the same subtraction and the same division</text>
  <text x="30" y="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">The decision, in one line</text>
  <rect x="30" y="482" width="440" height="100" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="506" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">I would use the z-score on this column,</text>
  <text x="250" y="526" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">because 100 is a freak value and min-max lets it</text>
  <text x="250" y="546" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">crush 2, 4, 6 and 8 into the bottom 6% of the range.</text>
  <text x="250" y="570" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0612 &#8722; 0.0000 = 0.0612 of the ruler, for four of five values</text>
  <text x="250" y="618" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Hand first, machine second, judgement last.</text>
</svg>
