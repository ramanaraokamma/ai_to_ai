<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four kinds of mess</title>
  <desc>Four cartoon panels. One, an empty dashed box with a question mark for a missing value. Two, two identical faces for a duplicate row. Three, a person asleep in bed with a tag reading eighty eight hours for an impossible value. Four, four bubbles reading Monday, monday, MON and Mon for an inconsistent category.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four kinds of mess &#8212; and they look nothing alike</text>

  <rect x="30" y="66" width="164" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="222" y="66" width="164" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="414" y="66" width="164" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="606" y="66" width="164" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <g>
    <circle cx="52" cy="88" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="52" y="89" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
    <circle cx="244" cy="88" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="244" y="89" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    <circle cx="436" cy="88" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="436" y="89" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <circle cx="628" cy="88" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="628" y="89" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  </g>

  <rect x="70" y="136" width="84" height="66" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/>
  <text x="112" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">?</text>
  <text x="112" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">nobody wrote it down</text>
  <text x="112" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">leave it blank</text>

  <g transform="translate(246,124) scale(0.58)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(304,124) scale(0.58)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="304" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle">Sat = Sat</text>
  <text x="304" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one day, written twice</text>
  <text x="304" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it now votes twice</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#55636F">
    <text x="512" y="126" font-size="12">z</text>
    <text x="524" y="140" font-size="14">z</text>
    <text x="538" y="118" font-size="12">z</text>
  </g>
  <rect x="444" y="158" width="104" height="30" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="448" y="140" width="32" height="20" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="464" cy="136" r="12" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <rect x="458" y="200" width="76" height="28" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="496" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">88 hours</text>
  <text x="496" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3.7 days in one night</text>
  <text x="496" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">reality says no</text>

  <rect x="612" y="122" width="70" height="30" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="647" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Monday</text>
  <rect x="692" y="122" width="70" height="30" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="727" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">monday</text>
  <rect x="612" y="162" width="70" height="30" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="647" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">MON</text>
  <rect x="692" y="162" width="70" height="30" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="727" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Mon.</text>
  <text x="688" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you see one day</text>
  <text x="688" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the machine sees four</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="112" y="326">MISSING</text>
    <text x="304" y="326">DUPLICATE</text>
    <text x="496" y="326">IMPOSSIBLE</text>
    <text x="688" y="326">INCONSISTENT</text>
  </g>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four different problems. Four different fixes. Naming which one you found is half the job.</text>
</svg>
