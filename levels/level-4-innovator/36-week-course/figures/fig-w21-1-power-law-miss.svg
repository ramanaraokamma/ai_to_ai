  <text x="80" y="283.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.10</text>
  <line x1="90" y1="215.1" x2="560" y2="215.1" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="215.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.20</text>
  <line x1="90" y1="146.6" x2="560" y2="146.6" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="146.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.30</text>
  <line x1="90" y1="78" x2="560" y2="78" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="80" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.40</text>
  <line x1="90" y1="318" x2="90" y2="324" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4.0</text>
  <line x1="187.9" y1="318" x2="187.9" y2="324" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="187.9" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4.5</text>
  <line x1="285.8" y1="318" x2="285.8" y2="324" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="285.8" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5.0</text>
  <line x1="383.7" y1="318" x2="383.7" y2="324" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="383.7" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5.5</text>
  <line x1="481.6" y1="318" x2="481.6" y2="324" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="481.6" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6.0</text>
  <line x1="90" y1="80" x2="90" y2="318" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="318" x2="560" y2="318" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 34 205)">log10 of validation loss</text>
  <text x="325" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">log10 of knobs (14,549 up to 1,704,149)</text>
