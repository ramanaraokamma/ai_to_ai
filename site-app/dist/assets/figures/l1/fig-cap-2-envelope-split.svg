<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Split before you train - the one step you cannot undo</title>
  <desc>A stack of fifty photos of one class forks into two paths. The top path, forty photos into a train folder, goes into a training machine. The bottom path, ten photos into a held-out folder, goes into a sealed envelope which is opened once at the very end.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Split before you train - the one step you cannot undo</text>
  <g transform="translate(50,150) scale(1.3)"><g transform="rotate(-11 50 54) translate(-5 -7)"><rect x="24" y="26" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/></g><g transform="rotate(7 50 54) translate(6 -4)"><rect x="24" y="26" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/></g><rect x="24" y="26" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><rect x="30" y="32" width="40" height="30" rx="4" fill="#D9EAF9" stroke="none"/><circle cx="42" cy="42" r="5" fill="#E8C671" stroke="#845F00" stroke-width="2"/><path d="M30 62 L44 50 L54 58 L62 52 L70 62 Z" fill="#1F6FB2" stroke="none"/><rect x="30" y="32" width="40" height="30" rx="4" fill="none" stroke="#1F6FB2" stroke-width="2"/><line x1="32" y1="70" x2="56" y2="70" stroke="#55636F" stroke-width="3" stroke-linecap="round"/></g>
  <text x="115" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">50 photos</text>
  <text x="115" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">of one class</text>
  <path d="M200 200 H250 V115 H310" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="298,107 312,115 298,123" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200 200 H250 V280 H310" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="298,272 312,280 298,288" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="320" y="84" width="210" height="62" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="425" y="111.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" font-weight="700">40 photos  -&gt;  train/</text>
  <text x="425" y="132.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the model may study these</text>
  <line x1="538" y1="115" x2="588" y2="115" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/><polyline points="582,107 596,115 582,123" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(600,68) scale(1.0)"><line x1="2" y1="48" x2="14" y2="48" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/><polyline points="10,42 18,48 10,54" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="122" y1="48" x2="132" y2="48" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/><polyline points="128,42 136,48 128,54" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="14" width="84" height="72" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/><rect x="18" y="38" width="14" height="20" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><rect x="108" y="38" width="14" height="20" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/><g stroke="#14202B" stroke-width="3" stroke-linecap="round"><line x1="84" y1="50" x2="89" y2="50"/><line x1="79.9" y1="59.9" x2="83.4" y2="63.4"/><line x1="70" y1="64" x2="70" y2="69"/><line x1="60.1" y1="59.9" x2="56.6" y2="63.4"/><line x1="56" y1="50" x2="51" y2="50"/><line x1="60.1" y1="40.1" x2="56.6" y2="36.6"/><line x1="70" y1="36" x2="70" y2="31"/><line x1="79.9" y1="40.1" x2="83.4" y2="36.6"/></g><circle cx="70" cy="50" r="14" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/><circle cx="70" cy="50" r="5" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/></g>
  <text x="670" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">training</text>
  <rect x="320" y="246" width="210" height="86" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M320 254 L425 306 L530 254" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="425" cy="300" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="425" y="304.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="700">S</text>
  <text x="425" y="274.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" font-weight="700">10 photos  -&gt;  heldout/</text>
  <line x1="538" y1="289" x2="588" y2="289" stroke="#845F00" stroke-width="3" stroke-linecap="round"/><polyline points="582,281 596,289 582,297" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="604" y="258" width="170" height="62" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="689" y="284.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">opened ONCE,</text>
  <text x="689" y="306.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">at the very end</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Move the ten files into another folder before Teachable Machine is even open.</text>
</svg>
