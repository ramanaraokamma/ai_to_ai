  <text x="36" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">add them up</text>
  <rect x="370" y="448" width="96" height="40" rx="8" fill="#F5F8FA" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="34" y="510" width="432" height="108" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="48" y="534" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the four names, in the wrong order:</text>
  <text x="48" y="556" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">second bias &#183; first grid &#183; second grid &#183; first bias</text>
  <text x="48" y="578" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">a grid glyph is a weight grid. A single column is a bias.</text>
  <text x="48" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">shapes go in the middle box, counts in the right one.</text>
  <text x="250" y="660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the total is the number PyTorch has to agree with</text>
</svg>
