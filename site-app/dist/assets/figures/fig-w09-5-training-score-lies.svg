<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Why a training score proves nothing</title>
  <desc>Two panels. On the left, a student revises from the answer sheet and scores ten out of ten; the panel is marked wrong because the score proves nothing. On the right, the same student sits a sealed paper and scores five out of ten; the panel is marked correct because that number is real.</desc>
  <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Which of these two marks tells you anything?</text>

  <line x1="400" y1="70" x2="400" y2="338" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="30" y="70" width="340" height="268" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="430" y="70" width="340" height="268" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>

  <g transform="translate(48,84) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="96" y="112" font-size="18" fill="#14202B">Revised from the answer sheet</text>

  <rect x="66" y="140" width="120" height="150" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="126" y="164" font-size="12" fill="#55636F" text-anchor="middle">ANSWER SHEET</text>
  <g stroke="#55636F" stroke-width="3" stroke-linecap="round">
    <line x1="84" y1="184" x2="168" y2="184"/><line x1="84" y1="204" x2="168" y2="204"/>
    <line x1="84" y1="224" x2="168" y2="224"/><line x1="84" y1="244" x2="140" y2="244"/>
  </g>
  <text x="126" y="278" font-size="12" fill="#55636F" text-anchor="middle">seen before the test</text>
  <text x="290" y="196" font-size="36" fill="#14202B" text-anchor="middle">10/10</text>
  <text x="290" y="228" font-size="16" fill="#14202B" text-anchor="middle">100%</text>
  <text x="200" y="322" font-size="16" fill="#14202B">Proves nothing at all.</text>

  <g transform="translate(448,84) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="496" y="112" font-size="18" fill="#14202B">Sat a paper nobody had seen</text>

  <rect x="466" y="140" width="120" height="150" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="526" y="164" font-size="12" fill="#55636F" text-anchor="middle">SEALED PAPER</text>
  <path d="M480 180 L572 180 L572 262 L480 262 Z" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M486 190 Q506 176 520 194 Q534 212 552 190" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="526" y="232" font-size="12" fill="#55636F" text-anchor="middle">written before</text>
  <text x="526" y="250" font-size="12" fill="#55636F" text-anchor="middle">the rules existed</text>
  <text x="526" y="278" font-size="12" fill="#55636F" text-anchor="middle">opened once, today</text>
  <text x="690" y="196" font-size="36" fill="#14202B" text-anchor="middle">5/10</text>
  <text x="690" y="228" font-size="16" fill="#14202B" text-anchor="middle">50%</text>
  <text x="600" y="322" font-size="16" fill="#14202B">This one is real news.</text>

  <text x="400" y="378" font-size="14" fill="#55636F" text-anchor="middle">A lower number that you can trust is worth more than a higher number that you cannot.</text>
</svg>
