<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Nila's model - accuracy by lighting</title>
  <desc>A bar chart of accuracy in three lighting conditions: window daylight ninety per cent from one hundred and eighteen training photos, ceiling light seventy per cent from thirty training photos, kitchen lamp at night forty per cent from twelve training photos. A dashed line marks blind guessing at twenty-five per cent.</desc>
  <text x="250" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Nila's model - accuracy by lighting</text>
  <line x1="110" y1="380.0" x2="470" y2="380.0" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="384.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0%</text>
  <line x1="110" y1="307.5" x2="470" y2="307.5" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="311.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">25%</text>
  <line x1="110" y1="235.0" x2="470" y2="235.0" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="239.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">50%</text>
  <line x1="110" y1="162.5" x2="470" y2="162.5" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="166.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">75%</text>
  <line x1="110" y1="90.0" x2="470" y2="90.0" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="94.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100%</text>
  <rect x="130" y="119.0" width="80" height="261.0" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="170" y="107.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">90%</text>
  <text x="170" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Window</text>
  <text x="170" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">118 training photos</text>
  <rect x="240" y="177.0" width="80" height="203.0" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="280" y="165.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">70%</text>
  <text x="280" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Ceiling light</text>
  <text x="280" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">30 training photos</text>
  <rect x="350" y="264.0" width="80" height="116.0" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="390" y="252.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">40%</text>
  <text x="390" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Lamp at night</text>
  <text x="390" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">12 training photos</text>
  <line x1="110" y1="307.5" x2="470" y2="307.5" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5"/>
  <text x="470" y="299.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">blind guessing 25%</text>
  <text x="250" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle"></text>
  <text x="250" y="448" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">Gap  =  90%  -  40%  =  50 percentage points</text>
  <text x="250" y="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nila predicted the lamp would be worst - in writing, before testing.</text>
  <text x="250" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">10 fresh test photos in each condition</text>
</svg>
