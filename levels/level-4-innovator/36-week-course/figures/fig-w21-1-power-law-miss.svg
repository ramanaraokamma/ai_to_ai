<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The line fitted the four models it was drawn through and missed the fifth</title>
  <desc>Log-log scatter. X is log10 of knobs, 4.0 to 6.4; y is log10 of validation loss. Four circles for widths 16, 32, 64 and 128 with losses 2.2760, 2.0878, 1.7127, 1.4991 lie close to a solid straight line of slope &#8722;0.1262. A dashed pink extension reaches the width-256 model at 1,704,149 knobs, where a hollow diamond marks the prediction 1.2654. A square marks what that model scored, 1.4656, higher than predicted: 15.8 percent worse. A box says ten times the knobs multiplies the loss by 0.748 and twice the knobs by 0.916.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A line through four points, then a fifth</text>
