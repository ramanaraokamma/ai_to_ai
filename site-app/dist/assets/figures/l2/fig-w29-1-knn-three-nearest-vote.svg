<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The three nearest get a vote</title>
  <desc>A pink square with a question mark stands for a new song. A dashed ring labelled k equals 3 encloses the three closest known songs: two triangles meaning hype and one circle meaning chill. Six further songs sit outside the ring and get no vote. On the right a tally reads hype times two with a tick, chill times one, and the verdict: two beats one, so hype.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The three nearest get a vote</text>
  <rect x="30" y="62" width="440" height="268" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="230" cy="190" r="78" fill="none" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="230" y1="112" x2="230" y2="100" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="butt"/>
  <text x="230" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">k = 3</text>
  <circle cx="78" cy="104" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="110" cy="300" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="404" cy="156" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <path d="M392 283 L401 301 L383 301 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M386 79 L395 97 L377 97 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M66 235 L75 253 L57 253 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M196 137 L205 155 L187 155 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M280 217 L289 235 L271 235 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="180" cy="236" r="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="230" y1="190" x2="196" y2="146" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 4"/>
  <line x1="230" y1="190" x2="280" y2="226" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 4"/>
  <line x1="230" y1="190" x2="180" y2="236" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 4"/>
  <rect x="217" y="177" width="26" height="26" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="230" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">?</text>
  <text x="254" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the new song</text>
  <line x1="510" y1="76" x2="770" y2="76" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <text x="640" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the tally</text>
  <path d="M534 106 L544 126 L524 126 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="560" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">hype  x 2</text>
  <polyline points="705.0,116 713.0,124.0 727.0,105.0" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">closest and third closest</text>
  <circle cx="534" cy="186" r="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="560" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">chill  x 1</text>
  <text x="560" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">second closest</text>
  <line x1="510" y1="244" x2="770" y2="244" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <rect x="510" y="258" width="260" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="640" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2 beats 1, so: hype</text>
  <text x="640" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 + 1 = 3. The votes always add up to k.</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Two shapes, not two colours: a circle is chill, a triangle is hype.</text>

</svg>
