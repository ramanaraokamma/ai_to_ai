<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The Crime Scene Table with all nine faults marked</title>
  <desc>A twelve row sleep and school bag tracker. Nine pink numbered callouts mark the faults: four different spellings of Monday, two blank cells, a negative bag weight, an eighty eight hour sleep, and a duplicated final row. A tenth green callout marks a screen time of four hundred and eighty minutes, which is a real outlier and not a fault.</desc>
  <text x="250" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Crime Scene Table &#8212; teacher copy</text>
  <text x="250" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One row = one school day. Aug 2026, Mondays, Wednesdays and Fridays.</text>

  <rect x="24" y="108" width="96" height="38" fill="#F6AEA6"/>
  <rect x="24" y="222" width="96" height="38" fill="#F6AEA6"/>
  <rect x="204" y="260" width="92" height="38" fill="#F6AEA6"/>
  <rect x="296" y="298" width="88" height="38" fill="#F6AEA6"/>
  <rect x="24" y="336" width="96" height="38" fill="#F6AEA6"/>
  <rect x="204" y="374" width="92" height="38" fill="#F6AEA6"/>
  <rect x="384" y="412" width="92" height="38" fill="#F6AEA6"/>
  <rect x="24" y="450" width="96" height="38" fill="#F6AEA6"/>
  <rect x="24" y="526" width="452" height="38" fill="#F6AEA6"/>
  <rect x="384" y="184" width="92" height="38" fill="#E2F7ED"/>

  <path d="M24 84 A8 8 0 0 1 32 76 H468 A8 8 0 0 1 476 84 V108 H24 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="24" y1="146" x2="476" y2="146"/><line x1="24" y1="184" x2="476" y2="184"/>
    <line x1="24" y1="222" x2="476" y2="222"/><line x1="24" y1="260" x2="476" y2="260"/>
    <line x1="24" y1="298" x2="476" y2="298"/><line x1="24" y1="336" x2="476" y2="336"/>
    <line x1="24" y1="374" x2="476" y2="374"/><line x1="24" y1="412" x2="476" y2="412"/>
    <line x1="24" y1="450" x2="476" y2="450"/><line x1="24" y1="488" x2="476" y2="488"/>
    <line x1="24" y1="526" x2="476" y2="526"/>
    <line x1="120" y1="108" x2="120" y2="564"/><line x1="204" y1="108" x2="204" y2="564"/>
    <line x1="296" y1="108" x2="296" y2="564"/><line x1="384" y1="108" x2="384" y2="564"/>
  </g>
  <line x1="24" y1="108" x2="476" y2="108" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="24" y="76" width="452" height="488" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="526" width="452" height="38" fill="none" stroke="#CC2B1D" stroke-width="3"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="32" y="92" dominant-baseline="central">day</text>
    <text x="212" y="92" dominant-baseline="central">sleep_h</text>
    <text x="128" y="92" dominant-baseline="central">date</text>
    <text x="304" y="92" dominant-baseline="central">bag_kg</text>
    <text x="392" y="92" dominant-baseline="central">screen_min</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
    <text x="32" y="127" dominant-baseline="central">Monday</text><text x="128" y="127" dominant-baseline="central">Aug 3</text><text x="212" y="127" dominant-baseline="central">7.5</text><text x="304" y="127" dominant-baseline="central">4.1</text><text x="392" y="127" dominant-baseline="central">95</text>
    <text x="32" y="165" dominant-baseline="central">Wed</text><text x="128" y="165" dominant-baseline="central">Aug 5</text><text x="212" y="165" dominant-baseline="central">8.0</text><text x="304" y="165" dominant-baseline="central">3.8</text><text x="392" y="165" dominant-baseline="central">120</text>
    <text x="32" y="203" dominant-baseline="central">Fri</text><text x="128" y="203" dominant-baseline="central">Aug 7</text><text x="212" y="203" dominant-baseline="central">6.5</text><text x="304" y="203" dominant-baseline="central">4.0</text><text x="392" y="203" dominant-baseline="central">480</text>
    <text x="32" y="241" dominant-baseline="central">monday</text><text x="128" y="241" dominant-baseline="central">Aug 10</text><text x="212" y="241" dominant-baseline="central">7.0</text><text x="304" y="241" dominant-baseline="central">4.2</text><text x="392" y="241" dominant-baseline="central">110</text>
    <text x="32" y="279" dominant-baseline="central">Wed</text><text x="128" y="279" dominant-baseline="central">Aug 12</text><text x="212" y="279" dominant-baseline="central" fill="#CC2B1D">&#8212;</text><text x="304" y="279" dominant-baseline="central">3.9</text><text x="392" y="279" dominant-baseline="central">105</text>
    <text x="32" y="317" dominant-baseline="central">Fri</text><text x="128" y="317" dominant-baseline="central">Aug 14</text><text x="212" y="317" dominant-baseline="central">8.5</text><text x="304" y="317" dominant-baseline="central">-3.2</text><text x="392" y="317" dominant-baseline="central">150</text>
    <text x="32" y="355" dominant-baseline="central">MON</text><text x="128" y="355" dominant-baseline="central">Aug 17</text><text x="212" y="355" dominant-baseline="central">7.5</text><text x="304" y="355" dominant-baseline="central">4.4</text><text x="392" y="355" dominant-baseline="central">130</text>
    <text x="32" y="393" dominant-baseline="central">Wed</text><text x="128" y="393" dominant-baseline="central">Aug 19</text><text x="212" y="393" dominant-baseline="central">88</text><text x="304" y="393" dominant-baseline="central">4.0</text><text x="392" y="393" dominant-baseline="central">140</text>
    <text x="32" y="431" dominant-baseline="central">Fri</text><text x="128" y="431" dominant-baseline="central">Aug 21</text><text x="212" y="431" dominant-baseline="central">9.0</text><text x="304" y="431" dominant-baseline="central">4.1</text><text x="392" y="431" dominant-baseline="central" fill="#CC2B1D">&#8212;</text>
    <text x="32" y="469" dominant-baseline="central">Mon.</text><text x="128" y="469" dominant-baseline="central">Aug 24</text><text x="212" y="469" dominant-baseline="central">7.0</text><text x="304" y="469" dominant-baseline="central">4.3</text><text x="392" y="469" dominant-baseline="central">115</text>
    <text x="32" y="507" dominant-baseline="central">Wed</text><text x="128" y="507" dominant-baseline="central">Aug 26</text><text x="212" y="507" dominant-baseline="central">8.0</text><text x="304" y="507" dominant-baseline="central">3.7</text><text x="392" y="507" dominant-baseline="central">125</text>
    <text x="32" y="545" dominant-baseline="central">Wed</text><text x="128" y="545" dominant-baseline="central">Aug 26</text><text x="212" y="545" dominant-baseline="central">8.0</text><text x="304" y="545" dominant-baseline="central">3.7</text><text x="392" y="545" dominant-baseline="central">125</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
    <circle cx="106" cy="127" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="106" y="128" dominant-baseline="central">1</text>
    <circle cx="106" cy="241" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="106" y="242" dominant-baseline="central">2</text>
    <circle cx="282" cy="279" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="282" y="280" dominant-baseline="central">3</text>
    <circle cx="370" cy="317" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="370" y="318" dominant-baseline="central">4</text>
    <circle cx="106" cy="355" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="106" y="356" dominant-baseline="central">5</text>
    <circle cx="282" cy="393" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="282" y="394" dominant-baseline="central">6</text>
    <circle cx="462" cy="431" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="462" y="432" dominant-baseline="central">7</text>
    <circle cx="106" cy="469" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="106" y="470" dominant-baseline="central">8</text>
    <circle cx="462" cy="545" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/><text x="462" y="546" dominant-baseline="central">9</text>
    <circle cx="462" cy="203" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2.5"/><text x="462" y="204" dominant-baseline="central">10</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">
    <text x="250" y="596">Pins 1, 2, 5, 8 are one problem in four places: four spellings of Monday.</text>
    <text x="250" y="618">Pins 3 and 7 are blanks. Pins 4 and 6 are impossible. Pin 9 is a duplicated row.</text>
    <text x="250" y="646" fill="#1B7A4B">Pin 10 is green because it is NOT a fault. 480 screen-minutes is a real outlier.</text>
    <text x="250" y="672">The student's printed sheet is identical but has no pins and no shading.</text>
  </g>
</svg>
