<text x="430" y="271" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.000</text>
<text x="550" y="271" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">-0.375</text>
<text x="680" y="271" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">26</text>
<rect x="610" y="120" width="140" height="168" fill="none" stroke="#C42B8C" stroke-width="3"/>
<rect x="50" y="120" width="700" height="168" fill="none" stroke="#14202B" stroke-width="3"/>
<text x="50" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the bottom row is the baseline: always guess the mean of the training rows</text>
<text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A metric with no units, no baseline and no row count is a rumour, not a result.</text>
</svg>
