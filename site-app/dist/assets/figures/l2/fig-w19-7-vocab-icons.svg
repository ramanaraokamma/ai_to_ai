<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Six icon cards. Axis is a small grid with a downward arrow numbered zero and an arrow across numbered one. Row is a grid with one band across it tinted pink. Column is the same grid with one band down it tinted. Two-D indexing is a grid with a single cell ringed and its row and column numbers marked. Hand-check is a yellow note reading 162 divided by 6 equals 27 with a green tick beside it. The sixth card states the rule of the week: the axis you name is the axis that gets eaten.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
