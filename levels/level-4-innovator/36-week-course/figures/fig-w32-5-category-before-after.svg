<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>At threshold 0.8 the average rose but billing fell, and three rows rest on three or fewer answers</title>
  <desc>Five rows of paired bars for 40 invented results, a dashed bar for the share right before and a solid bar for the share of the answered that are right after. Greeting 7 of 8 then 6 of 6 with 6 answered. Refund 5 of 8 then 3 of 3 with 3 answered, marked few. Technical 4 of 8 then 1 of 1 with 1 answered, marked few. Billing 4 of 8 then 2 of 6 with 6 answered, outlined in red with a cross as the row that fell. Out of scope 3 of 8 then 1 of 2 with 2 answered, marked few.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Did every category get better at 0.8?</text>
  <text x="170" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
