<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A big grid can be a thin column times a thin row, so a patch is a small share of the weights</title>
  <desc>Left: a column of four numbers 1, 2, 0, minus 1 beside a row of four numbers 2, 1, 0, 3. Their products fill a 4 by 4 grid whose rows are 2 1 0 3, 4 2 0 6, 0 0 0 0, and minus 2, minus 1, 0, minus 3: 16 cells from 8 numbers. Right: one 64 by 64 projection stores 4,096 numbers; a rank-4 patch of A (4 by 64) and B (64 by 4) stores 512, which is 0.1250 of it.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A thin column times a thin row builds a grid</text>
