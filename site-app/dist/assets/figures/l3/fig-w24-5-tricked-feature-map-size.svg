<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: how big is the feature map?</title>
  <desc>Two panels, each with a six by six picture whose left half holds the bright pixels. On the left, marked wrong, the answer grid is drawn six by six, 36 cells, but the window cannot hang off the edge so the last two cells of every row have nowhere to sit. On the right, marked right, the top-left three by three window is outlined on the picture and the answer grid is four by four: 6 minus 3 plus 1 equals 4, four starting columns and four starting rows, so 4 times 4 equals 16 cells, and one ring of cells is lost.</desc>
