<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the two pipelines</title>
  <desc>Two rows of four empty boxes joined by arrows, numbered one and two, for the student to label as the rule-writing pipeline and the machine learning pipeline.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="44" font-size="24" fill="#14202B" text-anchor="middle">Label the two pipelines</text>

    <g stroke="#14202B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="244" y1="145" x2="262" y2="145"/>
      <polyline points="256,139 266,145 256,151"/>
      <line x1="412" y1="145" x2="430" y2="145"/>
      <polyline points="424,139 434,145 424,151"/>
      <line x1="580" y1="145" x2="598" y2="145"/>
      <polyline points="592,139 602,145 592,151"/>
      <line x1="244" y1="285" x2="262" y2="285"/>
      <polyline points="256,279 266,285 256,291"/>
      <line x1="412" y1="285" x2="430" y2="285"/>
      <polyline points="424,279 434,285 424,291"/>
      <line x1="580" y1="285" x2="598" y2="285"/>
      <polyline points="592,279 602,285 592,291"/>
    </g>

    <g fill="#FFFFFF" stroke="#14202B" stroke-width="3">
      <rect x="100" y="110" width="140" height="70" rx="10"/>
      <rect x="268" y="110" width="140" height="70" rx="10"/>
      <rect x="436" y="110" width="140" height="70" rx="10"/>
      <rect x="604" y="110" width="140" height="70" rx="10"/>
      <rect x="100" y="250" width="140" height="70" rx="10"/>
      <rect x="268" y="250" width="140" height="70" rx="10"/>
      <rect x="436" y="250" width="140" height="70" rx="10"/>
      <rect x="604" y="250" width="140" height="70" rx="10"/>
    </g>
    <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5">
      <line x1="115" y1="155" x2="225" y2="155"/>
      <line x1="283" y1="155" x2="393" y2="155"/>
      <line x1="451" y1="155" x2="561" y2="155"/>
      <line x1="619" y1="155" x2="729" y2="155"/>
      <line x1="115" y1="295" x2="225" y2="295"/>
      <line x1="283" y1="295" x2="393" y2="295"/>
      <line x1="451" y1="295" x2="561" y2="295"/>
      <line x1="619" y1="295" x2="729" y2="295"/>
    </g>
    <g>
      <circle cx="62" cy="145" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="62" y="146" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
      <circle cx="62" cy="285" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="62" y="286" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    </g>
    <text x="400" y="352" font-size="14" fill="#55636F" text-anchor="middle">Row 1 is the way from Week 1. Row 2 is the way from Week 2. Write one label in every box.</text>
    <text x="400" y="374" font-size="14" fill="#55636F" text-anchor="middle">Then draw a big X on the box where the person is standing in each row.</text>
  </g>
</svg>
