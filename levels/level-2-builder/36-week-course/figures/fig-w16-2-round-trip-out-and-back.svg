<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The round trip: out to the file and back again</title>
  <desc>Four numbered stages left to right. Stage 1 is a stack of record cards in memory with runs holding the number 48. Stage 2 is a file on a disk holding the characters four eight. Stage 3 is the cards back in memory but runs now holds the characters four eight in quotation marks, marked with a cross. Stage 4 is the same cards after int was applied, runs holding the number 48 again, marked with a tick.</desc>
