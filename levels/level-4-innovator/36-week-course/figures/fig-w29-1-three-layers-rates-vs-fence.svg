<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Prompt-level defences lower the rate, the sandbox fence stops the damage</title>
  <desc>Four horizontal bars of how many of 100 seeded runs obeyed the planted order, with gullibility 1.0 on a scripted stand-in. No layers: 100 obeyed, expected 100. Layer 1 framing: 69, expected 60. Layer 2 scan: 58, expected 50. Both layers: 32, expected 30. Under each bar a green tick states that the file landed in 0 of 100 runs with the strict sandbox. Numbers from layers.py, Week 29.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Soft layers lower the rate; the fence stops it</text>
  <rect x="590" y="56" width="172" height="26" rx="6" fill="#F5F8FA" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="676" y="69" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">stand-in, not a model</text>
  <line x1="240" y1="96" x2="240" y2="372" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="228" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">no layers</text>
  <rect x="240" y="100" width="300" height="24" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="548" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">100 obeyed (expected 100)</text>
  <polyline points="246.4,141 250.4,145.4 258.4,136.2" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" dominant-baseline="central">file landed: 0 of 100 runs, strict sandbox</text>
  <text x="228" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">layer 1: frame</text>
  <rect x="240" y="162" width="207" height="24" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="455" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">69 obeyed (expected 60)</text>
  <polyline points="246.4,203 250.4,207.4 258.4,198.2" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268" y="203" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" dominant-baseline="central">file landed: 0 of 100 runs, strict sandbox</text>
  <text x="228" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">layer 2: scan</text>
  <rect x="240" y="224" width="174" height="24" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="422" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">58 obeyed (expected 50)</text>
  <polyline points="246.4,265 250.4,269.4 258.4,260.2" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" dominant-baseline="central">file landed: 0 of 100 runs, strict sandbox</text>
  <text x="228" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">layers 1 + 2</text>
  <rect x="240" y="286" width="96" height="24" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="344" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" dominant-baseline="central">32 obeyed (expected 30)</text>
  <polyline points="246.4,327 250.4,331.4 258.4,322.2" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268" y="327" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" dominant-baseline="central">file landed: 0 of 100 runs, strict sandbox</text>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Gullibility 1.0, 100 seeded runs each (seeds 0&#8211;99), on a stand-in.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The rates are typed in: they show which defence moves a rate, not model behaviour.</text>
</svg>
