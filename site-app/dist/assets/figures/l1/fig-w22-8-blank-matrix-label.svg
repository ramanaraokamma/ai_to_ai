<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the confusion matrix</text><text x="279.0" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">what the model SAID</text><text x="60" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">TRUTH</text><text x="205.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">apple</text><text x="279.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">banana</text><text x="353.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">orange</text><text x="427" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">total</text><text x="60" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">apple</text><rect x="168" y="140" width="74" height="40" fill="#DBCEF3" stroke="#C7CDD4" stroke-width="1.5"/><text x="205.0" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">4</text><rect x="242" y="140" width="74" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="279.0" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1</text><rect x="316" y="140" width="74" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="353.0" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="390" y="140" width="74" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="427" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">5</text><text x="60" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">banana</text><rect x="168" y="180" width="74" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="205.0" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="242" y="180" width="74" height="40" fill="#DBCEF3" stroke="#C7CDD4" stroke-width="1.5"/><text x="279.0" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">5</text><rect x="316" y="180" width="74" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="353.0" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="390" y="180" width="74" height="40" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/><text x="427" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">5</text><text x="60" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">orange</text><rect x="168" y="220" width="74" height="40" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="205.0" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fon