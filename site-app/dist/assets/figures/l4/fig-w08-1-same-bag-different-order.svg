<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Counting words erases word order, so two different sentences give a classifier the same row</title>
  <desc>Two sentences of five blue word boxes: 'the dog bit the postman' and 'the postman bit the dog'. An arrow from each leads to a bag row over the vocabulary the, dog, bit, postman. Both rows read 2, 1, 1, 1 and a bracket marks them as equal. Below: same bag is True, same text is False, and five different words can be ordered 120 ways that all give one bag.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A bag keeps the counts and throws the order away</text>
