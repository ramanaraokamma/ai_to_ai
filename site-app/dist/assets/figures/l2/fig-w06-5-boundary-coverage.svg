<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>No gaps, no overlaps</title>
  <desc>A number line of marks from zero to one hundred, split into five bands labelled F, D, C, B and A, with dashed lines at the boundaries 35, 60, 75 and 90. Below, two zoomed strips show marks 33 to 36 and 88 to 91 with their grades, and in each strip the two cells either side of the boundary are highlighted.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">No gaps, no overlaps</text>
  <rect x="50.0" y="110" width="136.5" height="56" fill="#E8C671"/>
  <rect x="50.0" y="110" width="136.5" height="56" fill="none" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="118.25" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">F</text>
  <rect x="186.5" y="110" width="97.5" height="56" fill="#D9EAF9"/>
  <rect x="186.5" y="110" width="97.5" height="56" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="235.25" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">D</text>
  <rect x="284.0" y="110" width="58.5" height="56" fill="#D9EAF9"/>
  <rect x="284.0" y="110" width="58.5" height="56" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="313.25" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">C</text>
  <rect x="342.5" y="110" width="58.5" height="56" fill="#D9EAF9"/>
  <rect x="342.5" y="110" width="58.5" height="56" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="371.75" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text>
  <rect x="401.0" y="110" width="42.89999999999998" height="56" fill="#E2F7ED"/>
  <rect x="401.0" y="110" width="42.89999999999998" height="56" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="422.45" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text>
  <line x1="50" y1="190" x2="444" y2="190" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="50.0" y1="190" x2="50.0" y2="198" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="50.0" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="186.5" y1="190" x2="186.5" y2="198" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="186.5" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">35</text>
  <line x1="284.0" y1="190" x2="284.0" y2="198" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="284.0" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">60</text>
  <line x1="342.5" y1="190" x2="342.5" y2="198" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="342.5" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">75</text>
  <line x1="401.0" y1="190" x2="401.0" y2="198" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="401.0" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">90</text>
  <line x1="440.0" y1="190" x2="440.0" y2="198" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="440.0" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <line x1="186.5" y1="102" x2="186.5" y2="190" stroke="#C42B8C" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <line x1="284.0" y1="102" x2="284.0" y2="190" stroke="#C42B8C" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <line x1="342.5" y1="102" x2="342.5" y2="190" stroke="#C42B8C" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <line x1="401.0" y1="102" x2="401.0" y2="190" stroke="#C42B8C" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <text x="250" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">mark out of 100</text>
  <text x="162" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">zoom: 33 to 36</text>
  <rect x="74" y="286" width="44" height="48" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="96" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">33</text>
  <text x="96" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">F</text>
  <rect x="118" y="286" width="44" height="48" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="140" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">34</text>
  <text x="140" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">F</text>
  <rect x="162" y="286" width="44" height="48" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="184" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">35</text>
  <text x="184" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">D</text>
  <rect x="206" y="286" width="44" height="48" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="228" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">36</text>
  <text x="228" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">D</text>
  <line x1="162" y1="282" x2="162" y2="286" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <text x="358" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">zoom: 88 to 91</text>
  <rect x="270" y="286" width="44" height="48" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="292" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">88</text>
  <text x="292" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text>
  <rect x="314" y="286" width="44" height="48" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="336" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">89</text>
  <text x="336" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text>
  <rect x="358" y="286" width="44" height="48" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="380" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">90</text>
  <text x="380" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text>
  <rect x="402" y="286" width="44" height="48" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="424" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">91</text>
  <text x="424" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text>
  <line x1="358" y1="282" x2="358" y2="286" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <text x="250" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the two pink cells in each zoom are the only ones worth testing</text>
  <text x="250" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every mark from 0 to 100 lands in exactly one band.</text>
  <text x="250" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Count them: 35 + 25 + 15 + 15 + 11 = 101 marks, and 101 whole numbers.</text>
  <text x="250" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">If the counts do not add up, you have a gap or an overlap.</text>
</svg>
