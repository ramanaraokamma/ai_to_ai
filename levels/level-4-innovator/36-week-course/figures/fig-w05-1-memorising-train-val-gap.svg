  <line x1="278.8" y1="316" x2="278.8" y2="321" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="278.8" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
