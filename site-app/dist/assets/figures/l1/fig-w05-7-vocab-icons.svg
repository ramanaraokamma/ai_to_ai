<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 5 words as pictures</title>
  <desc>Five icon cards in a row. Data type is a sorting tray with a number, a word and a clock. Missing value is an empty dashed box. Duplicate is two identical rows side by side. Impossible value is a crossed out reading of eighty-eight hours. Controlled vocabulary is a short written list of three allowed words with a padlock.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
  <rect x="20" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="176" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="332" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="488" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="644" y="58" width="136" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- 1 data type : three sorting slots -->
  <g transform="translate(38,88)">
    <rect x="0" y="18" width="34" height="76" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="46" y="18" width="34" height="76" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <rect x="92" y="18" width="34" height="76" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
      <text x="17" y="62">7.5</text>
      <text x="63" y="62">Mon</text>
    </g>
    <circle cx="109" cy="56" r="14" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.5"/>
    <g stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round">
      <line x1="109" y1="56" x2="109" y2="48"/>
      <line x1="109" y1="56" x2="115" y2="60"/>
    </g>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
      <text x="17" y="112">number</text>
      <text x="63" y="112">category</text>
      <text x="109" y="112">time</text>
    </g>
  </g>
  <text x="93" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">data type</text>
  <text x="93" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what a column</text>
  <text x="93" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">holds</text>

  <!-- 2 missing value : empty dashed box -->
  <g transform="translate(200,96)">
    <rect x="0" y="0" width="98" height="86" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="0" y1="43" x2="98" y2="43"/>
      <line x1="49" y1="0" x2="49" y2="86"/>
    </g>
    <rect x="49" y="0" width="49" height="43" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
      <text x="25" y="27">7.5</text>
      <text x="25" y="70">8.0</text>
      <text x="74" y="70">4.1</text>
    </g>
    <text x="74" y="28" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle">?</text>
  </g>
  <text x="249" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">missing value</text>
  <text x="249" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">an empty box.</text>
  <text x="249" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Never a zero</text>

  <!-- 3 duplicate : two identical strips -->
  <g transform="translate(354,102)">
    <rect x="0" y="10" width="102" height="28" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="46" width="102" height="28" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="1.5">
      <line x1="34" y1="10" x2="34" y2="38"/>
      <line x1="68" y1="10" x2="68" y2="38"/>
      <line x1="34" y1="46" x2="34" y2="74"/>
      <line x1="68" y1="46" x2="68" y2="74"/>
    </g>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
      <text x="17" y="29">Wed</text><text x="51" y="29">8.0</text><text x="85" y="29">125</text>
      <text x="17" y="65">Wed</text><text x="51" y="65">8.0</text><text x="85" y="65">125</text>
    </g>
    <text x="51" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">same day, twice</text>
  </g>
  <text x="405" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">duplicate</text>
  <text x="405" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one example</text>
  <text x="405" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">written twice</text>

  <!-- 4 impossible value : 88 hours crossed out -->
  <g transform="translate(516,94)">
    <rect x="0" y="8" width="94" height="60" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="47" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">88 h</text>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="6" y1="62" x2="88" y2="14"/>
    </g>
    <text x="47" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">legal range 0-16</text>
    <text x="47" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">so: outside it</text>
  </g>
  <text x="561" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">impossible</text>
  <text x="561" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">reality does not</text>
  <text x="561" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">allow it</text>

  <!-- 5 controlled vocabulary : short locked list -->
  <g transform="translate(662,90)">
    <rect x="0" y="6" width="100" height="94" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
      <text x="26" y="34">Mon</text>
      <text x="26" y="60">Wed</text>
      <text x="26" y="86">Fri</text>
    </g>
    <g fill="#1B7A4B">
      <circle cx="14" cy="29" r="3"/>
      <circle cx="14" cy="55" r="3"/>
      <circle cx="14" cy="81" r="3"/>
    </g>
    <rect x="76" y="-12" width="26" height="20" rx="5" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M82 -12 V-19 A7 7 0 0 1 96 -19 V-12" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="712" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">controlled</text>
  <text x="712" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">vocabulary</text>
  <text x="712" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the allowed list</text>

  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four kinds of mess, four different fixes. Naming which one you found is half the job.</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">And the fifth word, outlier, is the one that is NOT a fault.</text>
</svg>
