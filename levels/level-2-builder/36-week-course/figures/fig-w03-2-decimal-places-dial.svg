<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One stored number, four things a reader can see</title>
  <desc>A box at the top holds the stored value 1.0625. A line runs down to a slider with four stops. Each stop shows what a reader sees: 1, then 1.1, then 1.06, then 1.0625. The two-decimal stop is ringed in pink and labelled what money needs.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One stored number, four things a reader can see</text>
  <text x="400" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what Python actually stores</text>
  <rect x="310" y="72" width="180" height="56" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.0625</text>
  <path d="M400 128 V160 H497 V184" fill="none" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(497 188) rotate(90)"/>
  <line x1="110" y1="200" x2="690" y2="200" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="192" x2="110" y2="208" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="110" cy="200" r="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="110" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">:.0f</text>
  <rect x="55" y="228" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="110" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="110" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no decimals</text>
  <text x="110" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">wrong for money</text>
  <line x1="303" y1="192" x2="303" y2="208" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="303" cy="200" r="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="303" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">:.1f</text>
  <rect x="248" y="228" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="303" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.1</text>
  <text x="303" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one decimal</text>
  <text x="303" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">still wrong</text>
  <line x1="497" y1="192" x2="497" y2="208" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="497" cy="200" r="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="497" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">:.2f</text>
  <rect x="442" y="228" width="110" height="42" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="497" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.06</text>
  <text x="497" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">two decimals</text>
  <text x="497" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what money needs</text>
  <line x1="690" y1="192" x2="690" y2="208" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="690" cy="200" r="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="690" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no spec</text>
  <rect x="635" y="228" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="690" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.0625</text>
  <text x="690" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">everything</text>
  <text x="690" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">nobody reads this</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The stored value never changes. A format specifier only changes what gets shown.</text>
</svg>
