<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>What the machine actually gets</title>
  <desc>On the left a real apple with a list of things about it that were never measured: smell, taste, the bruise on the back, who gave it to you. An arrow labelled you choose and measure points to the right, where a single table row holds mass 150, length 8, colour red and skin smooth. A red banner underneath reads everything not measured is gone forever.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What the machine actually gets</text>

  <rect x="40" y="90" width="250" height="200" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="165" y1="120" x2="165" y2="108" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="165" cy="152" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="165" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">smell</text>
  <text x="165" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">taste</text>
  <text x="165" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the bruise on the back</text>
  <text x="165" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">who gave it to you</text>

  <text x="355" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">you choose</text>
  <text x="355" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">and measure</text>
  <line x1="308" y1="192" x2="392" y2="192" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="384,182 402,192 384,202" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="420" y="140" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="420" y="140" width="350" height="36" fill="#D9EAF9" stroke="none"/>
  <line x1="420" y1="176" x2="770" y2="176" stroke="#1F6FB2" stroke-width="3"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="507" y1="140" x2="507" y2="212"/>
    <line x1="595" y1="140" x2="595" y2="212"/>
    <line x1="682" y1="140" x2="682" y2="212"/>
  </g>
  <rect x="420" y="140" width="350" height="72" rx="10" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="463" y="163">mass_g</text>
    <text x="551" y="163">length_cm</text>
    <text x="638" y="163">colour</text>
    <text x="726" y="163">skin</text>
    <text x="463" y="199">150</text>
    <text x="551" y="199">8</text>
    <text x="638" y="199">red</text>
    <text x="726" y="199">smooth</text>
  </g>
  <text x="595" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">ONE ROW</text>
  <text x="595" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">four values, and that is all</text>

  <rect x="40" y="310" width="730" height="50" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="405" y="341" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Everything you did not measure is gone forever.</text>

  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A model is not stupid. It is blindfolded, and you chose the blindfold.</text>
</svg>
