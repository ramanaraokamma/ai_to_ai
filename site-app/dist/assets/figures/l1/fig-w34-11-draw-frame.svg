<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank frame: draw the split</title>
  <desc>An empty rectangular drawing frame with a title strip at the top reading draw the split, and three faint prompt words at the bottom: 200 photos, envelope, model.</desc>
  <rect x="24" y="24" width="752" height="352" rx="12" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 36 A12 12 0 0 1 36 24 H764 A12 12 0 0 1 776 36 V78 H24 Z" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="78" x2="776" y2="78" stroke="#14202B" stroke-width="3"/>
  <text x="46" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B">DRAW THE SPLIT</text>
  <text x="756" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end">Name: ________________</text>
  <rect x="48" y="102" width="704" height="222" rx="10" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">
    <text x="48" y="352">Your drawing must contain: 200 photos</text>
    <text x="330" y="352">the sealed envelope</text>
    <text x="520" y="352">the model</text>
    <text x="640" y="352">an arrow of time</text>
  </g>
</svg>
