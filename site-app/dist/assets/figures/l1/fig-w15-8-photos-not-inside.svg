<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The photos are not inside the model</title>
  <desc>Two panels. The wrong panel imagines the model holding all 120 photos and looking a new one up, marked with a cross. The right panel shows 40 megabytes of photos going in and a 3 megabyte model coming out, with the photos in a drawer, marked with a tick.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Where did the 120 photos go?</text>
  <line x1="400" y1="66" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

  <rect x="30" y="66" width="340" height="254" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="430" y="66" width="340" height="254" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>

  <g transform="translate(46,78) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(446,78) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="106" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Wrong</text>
  <text x="506" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Right</text>

  <text x="200" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">"It keeps my photos and looks the new one up."</text>
  <rect x="82" y="150" width="236" height="112" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="200" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">inside the model (imagined)</text>
  <g fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round">
    <rect x="98" y="184" width="28" height="28" rx="4"/>
    <rect x="132" y="184" width="28" height="28" rx="4"/>
    <rect x="166" y="184" width="28" height="28" rx="4"/>
    <rect x="200" y="184" width="28" height="28" rx="4"/>
    <rect x="234" y="184" width="28" height="28" rx="4"/>
    <rect x="268" y="184" width="28" height="28" rx="4"/>
    <rect x="98" y="220" width="28" height="28" rx="4"/>
    <rect x="132" y="220" width="28" height="28" rx="4"/>
    <rect x="166" y="220" width="28" height="28" rx="4"/>
    <rect x="200" y="220" width="28" height="28" rx="4"/>
    <rect x="234" y="220" width="28" height="28" rx="4"/>
    <rect x="268" y="220" width="28" height="28" rx="4"/>
  </g>
  <text x="200" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">40 MB of photos cannot fit</text>
  <text x="200" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">inside a 3 MB model.</text>

  <text x="600" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">"They were the ingredients. The bake is finished."</text>
  <rect x="452" y="156" width="96" height="76" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <text x="500" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">120 photos</text>
  <text x="500" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">40 MB</text>
  <text x="500" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">in a drawer</text>
  <g transform="translate(556,178) scale(0.6)">
    <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="620" y="156" width="128" height="76" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="684" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the model</text>
  <text x="684" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">3 MB</text>
  <text x="684" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">this is what you keep</text>
  <text x="600" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Delete the photos tonight. The model</text>
  <text x="600" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">works exactly the same tomorrow.</text>

  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">What survived was the pattern the photos had in common — not the pictures.</text>
</svg>
