<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Two networks, four rows</title>
  <desc>A table comparing a CNN with a dense multi-layer network on the same 1,257 training digits and 540 held-out digits. Parameters: 1,898 against 4,810. Seconds to train: 3.1 against 0.4. Train accuracy: 0.9881 against 0.9889. Test accuracy, the highlighted row: 0.9796 against 0.9722. 0.9796 minus 0.9722 is 0.0074, about 0.7 points, which is 529 correct out of 540 against 525 out of 540, achieved with 2,912 fewer weights because 4,810 minus 1,898 is 2,912. Four digits out of 540 is inside the wobble; the 2,912 is not.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two networks, four rows</text>
  <text x="250" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">same 1,257 training digits, same 540 held-out digits</text>
  <rect x="60" y="92" width="380" height="44" fill="#F5F8FA" stroke="#14202B" stroke-width="2"/>
  <text x="290" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">CNN</text>
  <text x="390" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">dense MLP</text>
  <rect x="60" y="136" width="380" height="44" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
  <text x="72" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">parameters</text>
  <text x="290" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1,898</text>
  <text x="390" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4,810</text>
  <rect x="60" y="180" width="380" height="44" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
  <text x="72" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">seconds to train</text>
  <text x="290" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">3.1</text>
  <text x="390" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.4</text>
  <rect x="60" y="224" width="380" height="44" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
  <text x="72" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">train accuracy</text>
  <text x="290" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.9881</text>
  <text x="390" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.9889</text>
  <rect x="60" y="268" width="380" height="44" fill="#F4D5E9" stroke="#14202B" stroke-width="2"/>
  <text x="72" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">test accuracy</text>
  <text x="290" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.9796</text>
  <text x="390" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.9722</text>
  <line x1="240" y1="92" x2="240" y2="312" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="340" y1="92" x2="340" y2="312" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="268" width="380" height="44" fill="none" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="44" cy="290" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="44" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="40" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">0.9796 &#8722; 0.9722 = 0.0074, about 0.7 points</text>
  <text x="40" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">529 correct out of 540, against 525 out of 540</text>
  <text x="40" y="396" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">4 more digits &#183; with 2,912 FEWER weights</text>
  <text x="40" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">4,810 &#8722; 1,898 = 2,912</text>
  <text x="40" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Four digits out of 540 is inside the wobble.</text>
  <text x="40" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">The 2,912 is not. Report the row you can defend.</text>
</svg>
