<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Lay a ruler through the dots</title>
  <desc>A scatter of six classmates, hours of revision against marks out of 100, with a straight purple line drawn through them. A step triangle on the line shows that going one hour across raises the line by 3.6 marks. A box underneath reads marks equals 3.6 times hours plus 49.4.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Lay a ruler through the dots</text>
