<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank DPO pair: plot where the policy now sits, then find moved, gap, margin and loss</title>
  <desc>A blank worksheet. Two log-chance number lines from minus 16 to minus 12, one for the chosen answer with a hollow reference marker at minus 15.0 and one for the rejected answer with a hollow reference marker at minus 14.0. At the right of each line is an empty dashed box labelled moved. Below, three empty dashed boxes: gap, beta 0.1 with blanks for margin and loss, and beta 0.5 with blanks for margin and loss. The policy now values, minus 13.0 and minus 15.0, are in the instruction line; no answers are drawn.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Blank: one DPO pair, then two leashes</text>
  <line x1="110" y1="206" x2="490" y2="206" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="206" x2="110" y2="212" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="110" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;16</text>
  <line x1="205" y1="206" x2="205" y2="212" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="205" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;15</text>
  <line x1="300" y1="206" x2="300" y2="212" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="300" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;14</text>
  <line x1="395" y1="206" x2="395" y2="212" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="395" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;13</text>
  <line x1="490" y1="206" x2="490" y2="212" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="490" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;12</text>
  <text x="300" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">log-chance of the answer</text>
  <line x1="110" y1="100" x2="490" y2="100" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="20" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">chosen</text>
  <circle cx="205" cy="100" r="7" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <text x="205" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ref &#8722;15.0</text>
  <rect x="520" y="83" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="534" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">moved</text>
  <line x1="594" y1="108" x2="700" y2="108" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="160" x2="490" y2="160" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="20" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">rejected</text>
  <circle cx="300" cy="160" r="7" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <text x="300" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ref &#8722;14.0</text>
  <rect x="520" y="143" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="534" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">moved</text>
  <line x1="594" y1="168" x2="700" y2="168" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <rect x="20" y="268" width="240" height="84" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="34" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">gap</text>
  <line x1="34" y1="326" x2="170" y2="326" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <rect x="280" y="268" width="240" height="84" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="294" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">beta = 0.1</text>
  <text x="294" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">margin</text>
  <line x1="346" y1="326" x2="396" y2="326" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="410" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">loss</text>
  <line x1="446" y1="326" x2="506" y2="326" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <rect x="540" y="268" width="240" height="84" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="554" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">beta = 0.5</text>
  <text x="554" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">margin</text>
  <line x1="606" y1="326" x2="656" y2="326" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="670" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">loss</text>
  <line x1="706" y1="326" x2="766" y2="326" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="300" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">now: chosen &#8722;13.0, rejected &#8722;15.0. Mark each, draw the arrows, fill the boxes.</text>
</svg>
