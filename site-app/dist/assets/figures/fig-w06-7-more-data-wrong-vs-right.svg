<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: does more data fix a bad sample?</title>
  <desc>Two panels. On the left, marked wrong, three hundred people are asked at cricket practice and cricket still wins with seventy-three percent. On the right, marked correct, thirty people are asked from stirred spots all over the school and the three sports come out much closer together.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Does asking MORE people fix it?</text>
  <line x1="400" y1="66" x2="400" y2="332" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="24" y="66" width="352" height="268" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="424" y="66" width="352" height="268" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>

  <g transform="translate(40,78) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(440,78) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">300 asked — all at cricket practice</text>
  <text x="490" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">30 asked — stirred all over school</text>

  <!-- LEFT bars: cricket 73, football 17, badminton 10 -->
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="140" y1="262" x2="356" y2="262"/>
    <line x1="140" y1="222" x2="356" y2="222"/>
    <line x1="140" y1="182" x2="356" y2="182"/>
    <line x1="140" y1="142" x2="356" y2="142"/>
  </g>
  <rect x="150" y="145" width="40" height="117" fill="#1F6FB2"/>
  <rect x="214" y="235" width="40" height="27" fill="#1F6FB2"/>
  <rect x="278" y="246" width="40" height="16" fill="#1F6FB2"/>
  <line x1="140" y1="262" x2="356" y2="262" stroke="#14202B" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="170" y="137">73%</text><text x="234" y="227">17%</text><text x="298" y="238">10%</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="170" y="280">cricket</text><text x="234" y="280">football</text><text x="298" y="280">badminton</text>
  </g>
  <text x="200" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Ten times the data.</text>
  <text x="200" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Same wrong answer, now more convincing.</text>

  <!-- RIGHT bars: cricket 40, football 35, badminton 25 -->
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="540" y1="262" x2="756" y2="262"/>
    <line x1="540" y1="222" x2="756" y2="222"/>
    <line x1="540" y1="182" x2="756" y2="182"/>
    <line x1="540" y1="142" x2="756" y2="142"/>
  </g>
  <rect x="550" y="198" width="40" height="64" fill="#1B7A4B"/>
  <rect x="614" y="206" width="40" height="56" fill="#1B7A4B"/>
  <rect x="678" y="222" width="40" height="40" fill="#1B7A4B"/>
  <line x1="540" y1="262" x2="756" y2="262" stroke="#14202B" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="570" y="190">40%</text><text x="634" y="198">35%</text><text x="698" y="214">25%</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="570" y="280">cricket</text><text x="634" y="280">football</text><text x="698" y="280">badminton</text>
  </g>
  <text x="600" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">A tenth of the data.</text>
  <text x="600" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Much closer to the real school.</text>

  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Stirring beats spoon size. A well-stirred teaspoon beats an unstirred ladle, every time.</text>
</svg>
