<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week&#8217;s six words, drawn</title>
  <desc>Six small pictures. Unsupervised learning is a blue table of features beside a red y column struck through with a cross: you get X, there is no y, so there is no score. Cluster is two dashed rings, each holding three dots, labelled the sets A B C and D E F. Centroid is two points at 1,2 and 2,1 with a purple cross halfway between them, and the sum 1 plus 2 divided by 2 equals 1.5. Inertia, also called WCSS, is a sigma symbol beside the six numbers it stands for, 0.4444 plus 1.1111 plus 1.1111 plus 0 plus 2.0000 plus 2.0000, boxed as equals 6.6667. k-means plus plus is a red crowded start scoring 5.0000 beside a green spread-out start scoring 3.6667 on the same six points. The elbow method is a falling curve of seven dots with the third ringed as the bend, and the division 381.1 divided by 97.2 equals 3.9.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week&#8217;s six words, drawn</text>
  <rect x="26" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="282" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="538" y="58" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="26" y="220" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="282" y="220" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="538" y="220" width="236" height="150" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="46" y="74" width="100" height="58" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="79" y1="74" x2="79" y2="132" stroke="#1F6FB2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="112" y1="74" x2="112" y2="132" stroke="#1F6FB2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="92" x2="146" y2="92" stroke="#1F6FB2" stroke-width="1.5" stroke-linecap="round"/>
  <text x="96" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">X</text>
  <rect x="156" y="74" width="46" height="58" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="179" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">y</text>
  <line x1="160" y1="78" x2="198" y2="128" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="198" y1="78" x2="160" y2="128" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="144" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you get X. There is no y.</text>
  <text x="144" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">unsupervised learning</text>
  <text x="144" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no answer key, so no score</text>
  <circle cx="330" cy="92" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="352" cy="106" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="340" cy="120" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="341" cy="106" r="32" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="440" cy="92" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="462" cy="104" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="448" cy="120" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="450" cy="106" r="32" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="400" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">{A, B, C} and {D, E, F}</text>
  <text x="400" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">cluster</text>
  <text x="400" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">closer to each other than to anything outside</text>
  <circle cx="590" cy="118" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="590" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(1,2)</text>
  <circle cx="652" cy="92" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="660" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">(2,1)</text>
  <line x1="611" y1="110" x2="637" y2="99" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="612" y1="96" x2="632" y2="116" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <line x1="632" y1="96" x2="612" y2="116" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <text x="700" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9">centre</text>
  <text x="656" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">(1+2) &#247; 2 = 1.5</text>
  <text x="656" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">centroid</text>
  <text x="656" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the average position of its members</text>
  <text x="46" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#6D28D9">&#931;</text>
  <text x="74" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">means: add up all of these</text>
  <text x="46" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.4444 + 1.1111 + 1.1111</text>
  <text x="46" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">+ 0 + 2.0000 + 2.0000</text>
  <rect x="46" y="314" width="190" height="26" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="141" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">= 6.6667</text>
  <text x="144" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">inertia (WCSS)</text>
  <rect x="300" y="240" width="92" height="54" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="346" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">crowded</text>
  <text x="346" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5.0000</text>
  <rect x="408" y="240" width="92" height="54" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="454" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">spread out</text>
  <text x="454" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3.6667</text>
  <text x="400" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">same six points, two starting places</text>
  <text x="400" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">k-means++</text>
  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">spreads the first centres apart, then n_init=10 restarts</text>
  <polyline points="558,246 588,272 618,286 648,294 678,299 708,303 738,306" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="558" cy="246" r="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="588" cy="272" r="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="618" cy="286" r="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="648" cy="294" r="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="678" cy="299" r="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="708" cy="303" r="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="738" cy="306" r="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="618" cy="286" r="10" fill="none" stroke="#C42B8C" stroke-width="3"/>
  <text x="632" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">the bend</text>
  <text x="656" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">381.1 &#247; 97.2 = 3.9</text>
  <text x="656" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">elbow method</text>
</svg>
