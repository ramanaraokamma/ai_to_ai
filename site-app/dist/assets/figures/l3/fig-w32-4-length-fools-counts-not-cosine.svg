<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Length fools the counts. It does not fool the angle.</title>
  <desc>A query, cold pizza, and two candidate documents. Doc A is exactly cold pizza. Doc B is a long review that mentions pizza three times and cold once. Ranked by raw counts, doc A scores 1 shared pizza plus 1 shared cold equals 2, and doc B scores 3 plus 1 equals 4, so doc B is ranked first and a red cross marks that as wrong: the long one wins on bulk. Ranked by cosine, doc A scores 2 divided by 1.4142 times 1.4142 which is 1.0000, and doc B scores 4 divided by 1.4142 times 6.7082 which is 0.4216, so doc A is first and a green tick marks that as right. Doc B's row is 6.7082 long because it has 11 words in it, and dividing by the length undoes that.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Length fools the counts. It does not fool the angle.</text>
  <rect x="24" y="68" width="180" height="38" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="114" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">cold pizza</text>
  <text x="114" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">the query</text>
  <rect x="236" y="68" width="540" height="44" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="252" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">doc A:  cold pizza</text>
  <rect x="236" y="124" width="540" height="44" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="252" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">doc B:  the pizza was hot and the pizza was fresh and</text>
  <text x="252" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">        the pizza was lovely but the chips were cold</text>
  <rect x="24" y="196" width="368" height="128" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="208" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle">ranked by raw counts</text>
  <text x="44" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">doc A:  1 shared pizza + 1 shared cold = 2</text>
  <text x="44" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">doc B:  3 shared pizza + 1 shared cold = 4</text>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="56" y1="294" x2="72" y2="310"/><line x1="72" y1="294" x2="56" y2="310"/></g>
  <text x="86" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D">B first. The long one wins on bulk.</text>
  <rect x="408" y="196" width="368" height="128" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="592" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle">ranked by cosine</text>
  <text x="428" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">doc A:  2 &#247; (1.4142 &#215; 1.4142) = 1.0000</text>
  <text x="428" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">doc B:  4 &#247; (1.4142 &#215; 6.7082) = 0.4216</text>
  <g stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" fill="none"><polyline points="440,302 446,309 457,293"/></g>
  <text x="470" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">A first, and A is the right answer.</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Doc B's row is 6.7082 long because it has 11 words in it. Dividing by the length undoes that.</text>
  <text x="400" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Cosine asks which way the row points, not how long it is.</text>
</svg>
