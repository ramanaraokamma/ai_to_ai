<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Scaling is worth about 17 accuracy points</title>
  <desc>A line chart of accuracy on the 36 held-back wines against k from 1 to 25. The blue line with round markers, for scaled columns, runs between nought point nine two and nought point nine seven. The red line with square markers, for raw columns, runs between nought point seven two and nought point seven eight. The blue line is above the red line at every k. A pink band marks the flat high region at k equals 7, 8, 9 and 10, and a dashed line marks the chosen k of 9. The y axis starts at zero.</desc>
