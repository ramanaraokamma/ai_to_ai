<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Same rulebook, two very different scores</title>
  <desc>Two bars. The rulebook scores 100 percent, ten out of ten, on the messages it was written from. It scores 50 percent, five out of ten, on the fresh sealed messages. An arrow marks the fifty percentage point drop between them.</desc>
  <text x="250" y="38" font-size="24" fill="#14202B" text-anchor="middle">Same rulebook, two scores</text>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="100" y1="400" x2="400" y2="400"/>
    <line x1="100" y1="322.5" x2="400" y2="322.5"/>
    <line x1="100" y1="245" x2="400" y2="245"/>
    <line x1="100" y1="167.5" x2="400" y2="167.5"/>
    <line x1="100" y1="90" x2="400" y2="90"/>
  </g>
  <g font-size="12" fill="#55636F" text-anchor="end">
    <text x="90" y="404">0</text><text x="90" y="326">25</text><text x="90" y="249">50</text>
    <text x="90" y="171">75</text><text x="90" y="94">100</text>
  </g>

  <path d="M130 400 V94 A4 4 0 0 1 134 90 H196 A4 4 0 0 1 200 94 V400 Z" fill="#1F6FB2"/>
  <text x="165" y="78" font-size="18" fill="#14202B" text-anchor="middle">100%</text>
  <text x="165" y="240" font-size="18" fill="#FFFFFF" text-anchor="middle">10 / 10</text>
  <text x="165" y="424" font-size="14" fill="#55636F" text-anchor="middle">Its own 10</text>
  <text x="165" y="442" font-size="14" fill="#55636F" text-anchor="middle">training messages</text>

  <path d="M270 400 V249 A4 4 0 0 1 274 245 H336 A4 4 0 0 1 340 249 V400 Z" fill="#1F6FB2"/>
  <text x="305" y="233" font-size="18" fill="#14202B" text-anchor="middle">50%</text>
  <text x="305" y="330" font-size="18" fill="#FFFFFF" text-anchor="middle">5 / 10</text>
  <text x="305" y="424" font-size="14" fill="#55636F" text-anchor="middle">10 fresh messages</text>
  <text x="305" y="442" font-size="14" fill="#55636F" text-anchor="middle">from the envelope</text>

  <line x1="200" y1="90" x2="432" y2="90" stroke="#CC2B1D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="340" y1="245" x2="432" y2="245" stroke="#CC2B1D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="425" y1="94" x2="425" y2="241" stroke="#CC2B1D" stroke-width="3"/>
  <polyline points="419,100 425,88 431,100" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="419,235 425,247 431,235" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="462" y="168" font-size="16" fill="#CC2B1D" text-anchor="middle" transform="rotate(-90 462 168)">a 50-point drop</text>

  <line x1="100" y1="400" x2="400" y2="400" stroke="#14202B" stroke-width="2"/>
  <text x="250" y="476" font-size="14" fill="#55636F" text-anchor="middle">The left bar is the exam the rulebook wrote for itself. Only the right bar is news.</text>
</svg>
