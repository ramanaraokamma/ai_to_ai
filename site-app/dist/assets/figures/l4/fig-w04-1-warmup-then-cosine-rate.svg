<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The rate is the peak times a multiplier that depends on the step</title>
  <desc>Line chart of learning rate against step, peak 0.003, 1000 steps. Dashed cosine-only starts at 0.00300 and falls to 0.00150 at step 500 (ringed 1) and 0.00000 at step 1000. Solid warm+cosine climbs from 0.00006 at step 0 to 0.00300 at step 49 over a 50-step ramp, then falls to 0.00162 at step 500 and 0.00000 at step 1000. A table beside it lists the printed rates at steps 0, 10, 49, 250, 500, 750 and 1000.</desc>
