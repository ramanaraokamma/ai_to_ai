<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 17</title>
  <desc>An empty framed drawing area titled draw your table then rub out the words. On the left an empty ruled grid of five columns with a tinted header row, labelled with the labels. An arrow marked rub out points right to a second empty ruled grid with no header row, labelled numbers only, this is the array. Three reminder boxes underneath for the shape, the dtype, and what was lost.</desc>
