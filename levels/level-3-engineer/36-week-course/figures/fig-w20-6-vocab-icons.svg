<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Seven words from Week 20, drawn</title>
  <desc>Eight labelled tiles. Tensor: a blue block holding 1, 2, 3, 4, labelled a grid plus two extras. Dtype: float32 with 7 digits and float64 with 16 digits, and the printed value 2.0999999046325684. Device: a filled cpu box beside an empty cuda box, labelled we say cpu all year. requires_grad: a green ON circle with an arrow to the word rec, labelled start recording. Graph: three purple nodes joined in a line, labelled Mm then Add then Relu, the receipt in order. Autograd: a dashed pink arrow pointing back the other way, labelled read it backwards, one rule per operation. .grad: a pink box printing 6 plus 27 equals 33, labelled it adds and never replaces, and None until backward. .item(): a blue box holding 4.0 with an arrow to a bare 4.0, labelled the number with no receipt, type becomes float.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Seven words from Week 20, drawn</text>
  <rect x="30" y="66" width="170" height="140" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="42" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">tensor</text>
  <rect x="50" y="104" width="128" height="56" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1. 2.</text>
  <text x="60" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">3. 4.</text>
  <text x="42" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a grid, plus two extras</text>
  <rect x="220" y="66" width="170" height="140" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="232" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">dtype</text>
  <text x="236" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">float32</text>
  <text x="316" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">7 digits</text>
  <text x="236" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">float64</text>
  <text x="316" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">16 digits</text>
  <text x="232" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">2.0999999046325684</text>
  <rect x="410" y="66" width="170" height="140" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="422" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">device</text>
  <rect x="434" y="106" width="60" height="52" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="464" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">cpu</text>
  <rect x="506" y="106" width="60" height="52" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="536" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">cuda</text>
  <text x="422" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">we say cpu all year</text>
  <rect x="600" y="66" width="170" height="140" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="612" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">requires_grad</text>
  <circle cx="644" cy="132" r="22" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
