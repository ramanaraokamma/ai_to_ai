<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Slopes multiply along a chain</title>
  <desc>A chain of three: w equals 2 goes into stage 1, z equals 3w plus 1, giving z equals 7, which goes into stage 2, L equals z times z, giving L equals 49. Stage 1 measured by nudging: z at 2.001 is 7.003 and z at 1.999 is 6.997, and 0.006 divided by 0.002 is 3. Stage 2 measured: L at 7.001 is 49.014001 and L at 6.999 is 48.986001, and 0.028 divided by 0.002 is 14. Multiplying the two stages gives 3 times 14 equals 42, and measuring straight through gives 0.084 divided by 0.002 equals 42, the same number.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Slopes multiply along a chain</text>
  <text x="400" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">nudge w by a thousandth and watch what each stage does with it</text>
  <circle cx="78" cy="130" r="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="78" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">w = 2</text>
  <line x1="106" y1="130" x2="176" y2="130" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(176 130) rotate(0.0)"/>
  <rect x="178" y="104" width="120" height="52" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="238" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">stage 1</text>
  <text x="238" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">z = 3w + 1</text>
  <line x1="300" y1="130" x2="356" y2="130" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(356 130) rotate(0.0)"/>
  <circle cx="384" cy="130" r="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="384" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">z = 7</text>
  <line x1="412" y1="130" x2="468" y2="130" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(468 130) rotate(0.0)"/>
  <rect x="470" y="104" width="120" height="52" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="530" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">stage 2</text>
  <text x="530" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">L = z &#215; z</text>
  <line x1="592" y1="130" x2="648" y2="130" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(648 130) rotate(0.0)"/>
  <circle cx="682" cy="130" r="30" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="682" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">L = 49</text>
  <rect x="140" y="186" width="216" height="116" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="248" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">stage 1, measured</text>
  <line x1="152" y1="218" x2="344" y2="218" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="248" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">z(2.001) = 7.003</text>
  <text x="248" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">z(1.999) = 6.997</text>
  <text x="248" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">0.006 &#247; 0.002 = 3</text>
  <rect x="430" y="186" width="226" height="116" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="543" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">stage 2, measured</text>
  <line x1="442" y1="218" x2="644" y2="218" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="543" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">L(7.001) = 49.014001</text>
  <text x="543" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">L(6.999) = 48.986001</text>
  <text x="543" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">0.028 &#247; 0.002 = 14</text>
  <rect x="60" y="316" width="316" height="62" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="218" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">multiply the two stages</text>
  <text x="218" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">3 &#215; 14 = 42</text>
  <text x="400" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">=</text>
  <rect x="424" y="316" width="316" height="62" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="582" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">or measure straight through</text>
  <text x="582" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.084 &#247; 0.002 = 42</text>
</svg>
