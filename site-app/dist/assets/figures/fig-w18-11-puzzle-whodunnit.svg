<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Puzzle: which sabotage was it?</title>
  <desc>Four damaged models are described by their results only. The student matches each one to one of four sabotages: five photos each, one background only, blurry photos, or an imbalance of forty forty five.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Puzzle: which sabotage was it?</text>

    <rect x="40" y="58" width="720" height="34" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="400" y="80" font-size="14" fill="#14202B" text-anchor="middle">A  5 photos each   ·   B  one background only   ·   C  blurry photos   ·   D  imbalance 40 / 40 / 5</text>

    <rect x="40" y="104" width="720" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="60" y="131" font-size="18" fill="#14202B" dominant-baseline="central">Model 1</text>
    <text x="160" y="124" font-size="14" fill="#55636F">5 out of 5 right on the kitchen table.</text>
    <text x="160" y="146" font-size="14" fill="#55636F">1 out of 5 right at the sink, two metres away.</text>
    <rect x="630" y="114" width="110" height="32" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="685" y="131" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>

    <rect x="40" y="164" width="720" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="60" y="191" font-size="18" fill="#14202B" dominant-baseline="central">Model 2</text>
    <text x="160" y="184" font-size="14" fill="#55636F">All three objects still right — but every margin roughly halved.</text>
    <text x="160" y="206" font-size="14" fill="#55636F">It does worst on the thin object with the finest edges.</text>
    <rect x="630" y="174" width="110" height="32" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="685" y="191" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>

    <rect x="40" y="224" width="720" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="60" y="251" font-size="18" fill="#14202B" dominant-baseline="central">Model 3</text>
    <text x="160" y="244" font-size="14" fill="#55636F">2 out of 3 right. Margins 41, 14 and 7 — all three collapsed.</text>
    <text x="160" y="266" font-size="14" fill="#55636F">Even the right answers are only just holding on.</text>
    <rect x="630" y="234" width="110" height="32" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="685" y="251" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>

    <rect x="40" y="284" width="720" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="60" y="311" font-size="18" fill="#14202B" dominant-baseline="central">Model 4</text>
    <text x="160" y="304" font-size="14" fill="#55636F">Spoon margin 88, toothbrush margin 83 — both perfectly healthy.</text>
    <text x="160" y="326" font-size="14" fill="#55636F">It never said "comb" once, not even holding an actual comb.</text>
    <rect x="630" y="294" width="110" height="32" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="685" y="311" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Each sabotage was used exactly once. Write the letter in each box, then give one reason per row.</text>
  </g>
</svg>
