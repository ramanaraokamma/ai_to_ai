  <text x="236" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">held-out chunk in pink, trained on the blue</text>
  <text x="236" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">stratified: 14 or 15 of the 72 frauds per fold</text>
  <line x1="500" y1="96" x2="500" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="500" y1="300" x2="754" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="500" y1="272.9" x2="740" y2="272.9" stroke="#C7CDD4" stroke-width="1.5"/>
