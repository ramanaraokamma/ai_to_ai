<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>A block is attention then an MLP, each on a residual road; nine parts add to 848 knobs</title>
  <desc>A top-to-bottom stack. Input x of shape (1, 6, 8) goes through layer norm 1 (16 knobs), then an attention panel with q, k, v of 64 knobs each and proj with 72, then a residual add, then layer norm 2 (16), then an MLP panel with up 288, GELU 0 and down 264, then a second residual add, and out of shape (1, 6, 8). Two residual roads run down the left. The sum 16 + 64 + 64 + 64 + 72 + 16 + 288 + 0 + 264 = 848. At d = 128 the MLP holds 131,712 of 197,888 knobs.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One block, counted: 848 knobs</text>
