<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>What this data cannot tell you</title>
  <desc>A warning panel headed what this data cannot tell you, with three worked sentences each marked with a red cross: it does not show that other children sleep the same, it does not show that a heavy bag causes bad sleep, and it does not show anything about weekends.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three sentences your data does NOT prove</text>

  <rect x="30" y="56" width="740" height="288" rx="12" fill="#F5F8FA" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 68 A12 12 0 0 1 42 56 H758 A12 12 0 0 1 770 68 V96 H30 Z" fill="#F6AEA6" stroke="none"/>
  <text x="400" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Every sentence starts &#8220;This does not show that&#8230;&#8221;</text>

  <g transform="translate(50,112) scale(0.36)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="96" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">&#8230;other children sleep about 7.7 hours a night.</text>
  <text x="96" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Why not: the sample is one person. Sample size 1 says nothing about anyone else.</text>

  <g transform="translate(50,190) scale(0.36)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="96" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">&#8230;a heavy school bag makes me sleep badly.</text>
  <text x="96" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Why not: heavy-bag days are also test days. I never separated the two.</text>

  <g transform="translate(50,268) scale(0.36)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="96" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">&#8230;I sleep 7.7 hours at weekends too.</text>
  <text x="96" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Why not: I only recorded Mondays, Wednesdays and Fridays. Saturday is not in the table.</text>

  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Each sentence names a specific thing the table is missing. &#8220;It might be wrong&#8221; does not count.</text>
</svg>
