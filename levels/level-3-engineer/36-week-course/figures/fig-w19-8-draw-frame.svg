<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw the boundary at three epochs</title>
  <desc>Three empty framed panels stacked, labelled epoch 0, epoch 50 and epoch 500, each with a pair of blank axes and write-in lines for loss and test accuracy. A panel underneath lists what a good answer looks like: panel 1 a straight line, panel 2 one bend sitting in the gap, panel 3 following the gap and curling at both ends, an arrow on the part that is not straight, and the numbers 0.8095 and 0.6450, 0.3104 and 0.9150, 0.1542 and 0.9350.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the boundary at three epochs</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Three panels. Put the loss and the test accuracy under each one.</text>
  <rect x="30" y="86" width="440" height="116" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">epoch 0</text>
  <line x1="120" y1="182" x2="456" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="182" x2="120" y2="120" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="150" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">loss ____________</text>
  <text x="300" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">test acc ____________</text>
  <rect x="30" y="218" width="440" height="116" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">epoch 50</text>
  <line x1="120" y1="314" x2="456" y2="314" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="314" x2="120" y2="252" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="150" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">loss ____________</text>
  <text x="300" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">test acc ____________</text>
  <rect x="30" y="350" width="440" height="116" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">epoch 500</text>
  <line x1="120" y1="446" x2="456" y2="446" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="446" x2="120" y2="384" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="150" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">loss ____________</text>
  <text x="300" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">test acc ____________</text>
  <rect x="30" y="494" width="440" height="182" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="518" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="544" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; panel 1 is one straight line, in a nearly random place</text>
  <text x="48" y="566" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; panel 2 has acquired one bend and sits in the gap</text>
  <text x="48" y="588" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; panel 3 follows the gap and curls at both ends</text>
  <text x="48" y="610" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; an arrow on panel 3, on the part that is not straight</text>
  <text x="48" y="632" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the three numbers: 0.8095 / 0.6450, 0.3104 / 0.9150,</text>
  <text x="60" y="654" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.1542 / 0.9350</text>
</svg>
