<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: what does stride 2 shrink?</title>
  <desc>Two panels. On the left, marked wrong, a row of only four squares labelled the picture they think, with a note that 8 squares became 4 and half the data was thrown away. On the right, marked right, the full row of eight squares is still there, with three highlighted window positions starting at columns 0, 2 and 4, and the arithmetic 8 plus 0 minus 3, divided by 2, is 2.5 rounded down to 2, then 2 plus 1 equals 3, so the answer row is 3 long. Six window starts became three; the picture did not change.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Wrong and right: what does stride 2 shrink?</text>
  <rect x="30" y="66" width="350" height="306" rx="12" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="66" width="350" height="36" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(40,71) scale(0.36)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <line x1="38" y1="38" x2="62" y2="62" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
    <line x1="62" y1="38" x2="38" y2="62" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="220" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">stride 2 makes the picture smaller</text>
  <text x="50" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the picture, they think</text>
  <rect x="50" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="67" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="84" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="101" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="118" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="135" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="152" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="169" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <text x="50" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">four squares left. Where did the other four go?</text>
  <rect x="50" y="210" width="310" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="64" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">8 squares became 4 squares</text>
  <text x="64" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">and half the data was thrown away</text>
  <text x="50" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">nothing was thrown away, and nothing</text>
  <text x="50" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">about the picture changed at all</text>
  <text x="50" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">this is the misconception, not the answer</text>
  <rect x="420" y="66" width="350" height="306" rx="12" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="420" y="66" width="350" height="36" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(430,71) scale(0.36)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="610" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">stride 2 shrinks the ANSWER</text>
  <text x="440" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the picture, all 8 squares, untouched</text>
  <rect x="440" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="457" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="474" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="491" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="508" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="525" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="542" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="559" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="576" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="593" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="610" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="627" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="644" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="661" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="678" y="138" width="34" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="695" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <rect x="440" y="176" width="102" height="9" rx="3" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="508" y="188" width="102" height="9" rx="3" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="576" y="200" width="102" height="9" rx="3" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="440" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">3 window starts: 0, 2, 4</text>
  <rect x="440" y="236" width="310" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="454" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">(8 + 0 &#8722; 3) &#247; 2 = 2.5, rounded down 2</text>
  <text x="454" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">2 + 1 = 3, so the answer row is 3 long</text>
  <text x="440" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">the 8 squares are still there. You looked</text>
  <text x="440" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">at them half as often: 6 starts became 3.</text>
</svg>
