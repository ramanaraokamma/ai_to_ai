<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Stride 2 halves the output</title>
  <desc>Two bands. In the top band a 3-wide window slides one cell at a time across 8 numbers, giving 6 window starts and an output row 6 long, with the arithmetic 8 plus 0 minus 3, divided by 1, plus 1, equals 6. In the bottom band the same window jumps two cells at a time, giving only 3 window starts and an output row 3 long, with the arithmetic 8 plus 0 minus 3, divided by 2, which is 2.5 rounded down to 2, plus 1, equals 3.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Stride 2 halves the output</text>
  <text x="40" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">stride 1 &#183; the window moves 1 cell each step</text>
  <rect x="40" y="96" width="320" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="80" y1="96" x2="80" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="96" x2="120" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="160" y1="96" x2="160" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="200" y1="96" x2="200" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="240" y1="96" x2="240" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="280" y1="96" x2="280" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="320" y1="96" x2="320" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="52,154 68,154 60,142" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="92,154 108,154 100,142" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="132,154 148,154 140,142" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="172,154 188,154 180,142" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="212,154 228,154 220,142" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="252,154 268,154 260,142" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="40" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">6 window starts</text>
  <line x1="374" y1="116" x2="440" y2="116" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(440 116) rotate(0)"/>
  <rect x="460" y="96" width="204" height="40" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="494" y1="96" x2="494" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="528" y1="96" x2="528" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="562" y1="96" x2="562" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="596" y1="96" x2="596" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="630" y1="96" x2="630" y2="136" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="562" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">output row: 6 long</text>
  <text x="40" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">(8 + 0 &#8722; 3) &#247; 1 + 1 = 5 + 1 = 6</text>
  <text x="40" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">stride 2 &#183; the window moves 2 cells each step</text>
  <rect x="40" y="230" width="320" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="80" y1="230" x2="80" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="230" x2="120" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="160" y1="230" x2="160" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="200" y1="230" x2="200" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="240" y1="230" x2="240" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="280" y1="230" x2="280" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="320" y1="230" x2="320" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="52,288 68,288 60,276" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="132,288 148,288 140,276" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="212,288 228,288 220,276" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="40" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">3 window starts</text>
  <line x1="374" y1="250" x2="440" y2="250" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(440 250) rotate(0)"/>
  <rect x="460" y="230" width="102" height="40" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="494" y1="230" x2="494" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="528" y1="230" x2="528" y2="270" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="511" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">output row: 3 long</text>
  <text x="40" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C">(8 + 0 &#8722; 3) &#247; 2 + 1 = 2.5 &#8594; 2, so 2 + 1 = 3</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Half the window starts, half the output row.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">The picture did not shrink &#183; you only looked at it half as often.</text>
</svg>
