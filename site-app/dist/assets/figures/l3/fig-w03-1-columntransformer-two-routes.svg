<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One switchboard, two routes, twenty columns out</title>
  <desc>Eight named columns enter on the left, five of numbers in blue and three of words in amber. They split into two routes. Route one takes the five number columns, fills their holes with the train median and puts them on the same ruler: five in, five out. Route two takes the three word columns and makes one column per value that exists: five restaurants plus seven days plus three weathers, so three in and fifteen out. The two routes are glued side by side into one block of shape 1200 by 20, because 5 plus 5 plus 7 plus 3 equals 20.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One switchboard, two routes, twenty columns out</text>
  <text x="400" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8 columns in &#8212; 5 of numbers, 3 of words</text>
  <rect x="30" y="92" width="130" height="216" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="95" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the raw row</text>
  <rect x="40" y="130" width="110" height="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">distance_km</text>
  <rect x="40" y="152" width="110" height="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">items</text>
  <rect x="40" y="174" width="110" height="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">prep_minutes</text>
  <rect x="40" y="196" width="110" height="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">order_hour</text>
  <rect x="40" y="218" width="110" height="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">driver_exp</text>
  <rect x="40" y="240" width="110" height="20" fill="#E8C671" stroke="#845F00" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">restaurant</text>
  <rect x="40" y="262" width="110" height="20" fill="#E8C671" stroke="#845F00" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">day_of_week</text>
  <rect x="40" y="284" width="110" height="20" fill="#E8C671" stroke="#845F00" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="95" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">weather</text>
  <line x1="162" y1="186" x2="208" y2="150" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(208 150) rotate(-38.0)"/>
  <line x1="162" y1="250" x2="208" y2="286" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#845F00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(208 286) rotate(38.0)"/>
  <rect x="212" y="108" width="300" height="84" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="362" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">route 1 &#183; the 5 number columns</text>
  <text x="362" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1. fill the holes with the train median</text>
  <text x="362" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2. put them all on the same ruler</text>
  <text x="362" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">5 columns in, 5 columns out</text>
  <rect x="212" y="244" width="300" height="84" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="362" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">route 2 &#183; the 3 word columns</text>
  <text x="362" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one column per value that exists:</text>
  <text x="362" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5 restaurants + 7 days + 3 weathers</text>
  <text x="362" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3 columns in, 15 columns out</text>
  <line x1="516" y1="150" x2="566" y2="200" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(566 200) rotate(45.0)"/>
  <line x1="516" y1="286" x2="566" y2="236" stroke="#845F00" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#845F00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(566 236) rotate(-45.0)"/>
  <rect x="570" y="176" width="200" height="84" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="670" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">glued side by side</text>
  <text x="670" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">shape (1200, 20)</text>
  <text x="670" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one block of numbers</text>
  <rect x="212" y="344" width="380" height="36" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="402" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5 + 5 + 7 + 3 = 20 columns</text>
  <text x="120" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">8 in, 20 out</text>
</svg>
