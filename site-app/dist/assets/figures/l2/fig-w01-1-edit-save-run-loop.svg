<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Type it, save it, run it, then go round again</title>
  <desc>Three numbered stages left to right: you type instructions into a file, the file is saved to disk, and running it makes the computer print your words. A red arrow loops back from the end to the start, labelled: it broke, read the last line, change one thing, go round again.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Type it, save it, run it, then go round again</text>
