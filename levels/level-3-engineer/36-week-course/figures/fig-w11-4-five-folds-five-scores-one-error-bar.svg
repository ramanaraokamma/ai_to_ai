<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five folds, five scores, one honest number</title>
  <desc>On the left, five rows of five equal chunks. In row one the first chunk is pink and held out; in row two the second, and so on, so every row trains on four chunks and is scored on the one left out. Each row is labelled with the number of frauds in its held-out chunk: 14, 14, 14, 15, 15, because the split was stratified. On the right the five resulting ROC AUC scores are plotted as dots: 0.6183, 0.5909, 0.6873, 0.7504 and 0.4954, with a horizontal line at their mean and an amber band one standard deviation either side. The mean is worked out underneath: 0.6183 plus 0.5909 plus 0.6873 plus 0.7504 plus 0.4954 is 3.1423, divided by 5 gives 0.6285, and it is reported as 0.628 plus or minus 0.087.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five folds, five scores, one honest number</text>
  <rect x="96" y="90" width="56" height="28" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <rect x="152" y="90" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="208" y="90" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="264" y="90" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="320" y="90" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="388" y="109" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">14 frauds</text>
  <text x="88" y="109" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">fold 1</text>
  <rect x="96" y="130" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="152" y="130" width="56" height="28" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <rect x="208" y="130" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <rect x="264" y="130" width="56" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
