<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same six words, heard two ways</title>
  <desc>Two mirrored panels, each showing the same written instruction: put the bread on the plate. On the left, a person and a plate holding two flat slices of bread. On the right, a wrong badge and the same plate holding an entire loaf still in its wrapper.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The same six words, heard two ways</text>
  <line x1="400" y1="80" x2="400" y2="320" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <rect x="30" y="80" width="360" height="240" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="410" y="80" width="360" height="240" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(48,92) scale(0.42)">
  <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="40" cy="50" r="4" fill="#14202B"/><circle cx="60" cy="50" r="4" fill="#14202B"/>
  <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="104" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">What you meant</text>
  <g transform="translate(428,92) scale(0.42)">
  <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g>
  </g>
  <text x="484" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">What it did</text>
  <rect x="54" y="146" width="312" height="32" rx="8" fill="#FFFFFF" stroke="#55636F" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="210" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Put the bread on the plate.</text>
  <rect x="434" y="146" width="312" height="32" rx="8" fill="#FFFFFF" stroke="#55636F" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="590" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Put the bread on the plate.</text>
  <ellipse cx="210" cy="272" rx="94" ry="16" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <rect x="175" y="236" width="70" height="18" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <rect x="175" y="254" width="70" height="18" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="210" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">two slices, out of the bag, flat</text>
  <ellipse cx="590" cy="272" rx="94" ry="16" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <rect x="515" y="190" width="150" height="82" rx="16" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="529" y1="212" x2="651" y2="212" stroke="#CC2B1D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="529" y1="232" x2="651" y2="232" stroke="#CC2B1D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="529" y1="252" x2="651" y2="252" stroke="#CC2B1D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M665 214 L681 202 L681 226 Z" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="590" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the whole loaf, still wrapped</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">It is not being funny. It has no idea what you left out.</text>
</svg>
