<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank: label a rank-4 LoRA patch beside a 64 by 64 projection</title>
  <desc>A diagram with the input x going two ways. One way into a box 'old projection, 64 in, 64 out' (ringed 1, and ringed 6 for its count). The other way through a dashed patch holding box A (ringed 2) and box B (ringed 3), both rank r = 4, with a ringed 4 between them and a ringed 5 on the patch outline. Both ways are added at a plus sign. On the right six numbered questions each have an empty write-in box: frozen or trainable, shape of A, shape of B, which starts at 0, numbers stored in the patch, numbers in the old projection. Nothing is filled in.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the patch</text>
  <rect x="20" y="176" width="76" height="38" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="58" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">input x</text>
  <line x1="98" y1="188" x2="128" y2="124" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(128 124) rotate(-64.9)"/>
  <line x1="98" y1="204" x2="128" y2="266" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(128 266) rotate(64.2)"/>
  <rect x="130" y="84" width="190" height="56" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="225" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">old projection</text>
  <text x="225" y="123" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">64 in, 64 out</text>
  <line x1="322" y1="112" x2="386" y2="112" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="386" y1="112" x2="386" y2="174" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(386 174) rotate(90)"/>
  <rect x="118" y="228" width="262" height="104" rx="10" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <rect x="130" y="238" width="100" height="56" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="180" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text>
  <text x="180" y="277" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">rank r = 4</text>
  <line x1="232" y1="266" x2="258" y2="266" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(258 266) rotate(0)"/>
  <rect x="260" y="238" width="100" height="56" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="310" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text>
  <text x="310" y="277" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">rank r = 4</text>
  <text x="250" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the patch, then times a scale</text>
  <line x1="362" y1="266" x2="386" y2="266" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="386" y1="266" x2="386" y2="206" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(386 206) rotate(-90)"/>
  <circle cx="386" cy="190" r="14" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="386" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">+</text>
  <circle cx="130" cy="84" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="130" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <circle cx="130" cy="238" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="130" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <circle cx="260" cy="238" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="260" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <circle cx="245" cy="312" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="245" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <circle cx="118" cy="332" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="118" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <circle cx="320" cy="140" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
