<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Write down the two prices before you touch the dial</title>
  <desc>A two by two grid of prices instead of counts. Rows are what really happened, columns are what the model said. Top left, actually legit and predicted legit, right and free, 0. Top right, actually legit but predicted fraud, a false alarm, 10. Bottom left, actually fraud but predicted legit, a miss, 500. Bottom right, caught in time, 0. A miss therefore costs 500 divided by 10 equals 50 false alarms. Below, the cost rule: cost equals 500 times misses plus 10 times false alarms, worked at threshold 0.10 where there were 11 misses and 5 false alarms: 500 times 11 is 5500, 10 times 5 is 50, and 5500 plus 50 is 5550.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Write down the two prices</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">before you touch the dial</text>
  <text x="210" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">predicted legit</text>
  <text x="330" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">predicted fraud</text>
  <text x="144" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">actually legit</text>
  <text x="144" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">actually fraud</text>
  <rect x="150" y="124" width="120" height="64" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/>
  <rect x="270" y="124" width="120" height="64" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/>
  <rect x="150" y="188" width="120" height="64" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/>
  <rect x="270" y="188" width="120" height="64" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/>
  <text x="210" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">right, and free</text>
  <text x="210" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">0</text>
  <text x="330" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">false alarm</text>
  <text x="330" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">10</text>
  <text x="210" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">a miss</text>
  <text x="210" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">500</text>
  <text x="330" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">caught in time</text>
  <text x="330" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">0</text>
  <rect x="150" y="124" width="240" height="128" fill="none" stroke="#14202B" stroke-width="3"/>
  <text x="270" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">a miss costs 500 &#247; 10 = 50 false alarms</text>
  <rect x="84" y="296" width="332" height="104" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">cost = 500 &#215; misses + 10 &#215; false alarms</text>
  <text x="250" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">at t = 0.10 there were 11 misses and 5 false alarms</text>
  <text x="250" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">500 &#215; 11 = 5500 &#183;  10 &#215; 5 = 50</text>
  <text x="250" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">5500 + 50 = 5550</text>
  <text x="250" y="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nobody can pick a threshold from a curve alone.</text>
  <text x="250" y="452" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">You pick it from a price list.</text>
</svg>
