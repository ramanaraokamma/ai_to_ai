<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week&#8217;s words, drawn</title>
  <desc>Five small pictures. Learned coefficient: a three-row table giving cold minus 3.2388 in red, hot plus 2.9625 in green and fluffy plus 0.9114 in gold, one number per word that you can read off. Negation trap: the review not fresh and not hot with a true label of negative comes out at a probability of positive of 0.9824, because not has no column and so contributed plus 0.0000 twice. Co-occurrence matrix: a three by three grid of how often hot, cold and pizza sit near each other, with hot and pizza at 4, cold and pizza at 5, hot and cold at 1, and zeros down the diagonal. Distributional hypothesis: the two sentence frames the pizza was blank and hot and the curry was blank and hot, both filled by tasty and by delicious, so the same company kept means a similar meaning. Word embedding: one short list per word, tasty 0.81 and 0.12, delicious 0.79 and 0.15 sitting close together, and torn minus 0.44 and 0.67 sitting far away.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week&#8217;s words, drawn</text>
