<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Does the rulebook beat guessing?</title>
  <desc>A bar chart of four strategies scored on the same fourteen days. Always saying on time gets 57 percent, always saying late gets 43 percent, a coin flip gets 50 percent, and the two-rule rulebook gets 93 percent. A dashed line marks the best guessing score.</desc>
  <text x="250" y="38" font-size="24" fill="#14202B" text-anchor="middle">Does the rulebook beat guessing?</text>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="100" y1="400" x2="470" y2="400"/>
    <line x1="100" y1="322.5" x2="470" y2="322.5"/>
    <line x1="100" y1="245" x2="470" y2="245"/>
    <line x1="100" y1="167.5" x2="470" y2="167.5"/>
    <line x1="100" y1="90" x2="470" y2="90"/>
  </g>
  <g font-size="12" fill="#55636F" text-anchor="end">
    <text x="90" y="404">0</text><text x="90" y="326">25</text><text x="90" y="249">50</text>
    <text x="90" y="171">75</text><text x="90" y="94">100</text>
  </g>

  <path d="M117 400 V227.3 A4 4 0 0 1 121 223.3 H155 A4 4 0 0 1 159 227.3 V400 Z" fill="#1F6FB2"/>
  <text x="138" y="212" font-size="14" fill="#14202B" text-anchor="middle">57%</text>
  <text x="138" y="422" font-size="12" fill="#55636F" text-anchor="middle">Always say</text>
  <text x="138" y="437" font-size="12" fill="#55636F" text-anchor="middle">"on time"</text>
  <text x="138" y="452" font-size="12" fill="#55636F" text-anchor="middle">8 of 14</text>

  <path d="M205 400 V266.7 A4 4 0 0 1 209 262.7 H243 A4 4 0 0 1 247 266.7 V400 Z" fill="#1F6FB2"/>
  <text x="226" y="251" font-size="14" fill="#14202B" text-anchor="middle">43%</text>
  <text x="226" y="422" font-size="12" fill="#55636F" text-anchor="middle">Always say</text>
  <text x="226" y="437" font-size="12" fill="#55636F" text-anchor="middle">"late"</text>
  <text x="226" y="452" font-size="12" fill="#55636F" text-anchor="middle">6 of 14</text>

  <path d="M293 400 V249 A4 4 0 0 1 297 245 H331 A4 4 0 0 1 335 249 V400 Z" fill="#1F6FB2"/>
  <text x="314" y="233" font-size="14" fill="#14202B" text-anchor="middle">50%</text>
  <text x="314" y="422" font-size="12" fill="#55636F" text-anchor="middle">Flip a coin</text>
  <text x="314" y="437" font-size="12" fill="#55636F" text-anchor="middle">every day</text>
  <text x="314" y="452" font-size="12" fill="#55636F" text-anchor="middle">7 of 14</text>

  <path d="M381 400 V115.7 A4 4 0 0 1 385 111.7 H419 A4 4 0 0 1 423 115.7 V400 Z" fill="#1F6FB2"/>
  <text x="402" y="100" font-size="14" fill="#14202B" text-anchor="middle">93%</text>
  <text x="402" y="422" font-size="12" fill="#55636F" text-anchor="middle">The 2-rule</text>
  <text x="402" y="437" font-size="12" fill="#55636F" text-anchor="middle">rulebook</text>
  <text x="402" y="452" font-size="12" fill="#55636F" text-anchor="middle">13 of 14</text>

  <line x1="100" y1="223.3" x2="470" y2="223.3" stroke="#CC2B1D" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="466" y="216" font-size="12" fill="#CC2B1D" text-anchor="end">best you can do by guessing</text>

  <line x1="100" y1="400" x2="470" y2="400" stroke="#14202B" stroke-width="2"/>
  <text x="250" y="478" font-size="14" fill="#55636F" text-anchor="middle">The rulebook wins by 36 percentage points.</text>
  <text x="250" y="496" font-size="14" fill="#55636F" text-anchor="middle">That is what "worth betting on" means.</text>
</svg>
