<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A feature card front and back</title>
  <desc>Two cards side by side. The front shows a card number and five labelled measurements in a fixed order. The back shows only the object name, hidden from the tester until the guess is written down.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Five numbers on the front. The answer on the back.</text>

    <rect x="40" y="76" width="320" height="240" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 88 A12 12 0 0 1 52 76 H348 A12 12 0 0 1 360 88 V116 H40 Z" fill="#D9EAF9" stroke="none"/>
    <line x1="40" y1="116" x2="360" y2="116" stroke="#1F6FB2" stroke-width="3"/>
    <text x="60" y="103" font-size="18" fill="#14202B">CARD 08</text>
    <g font-size="14" fill="#55636F">
      <text x="60" y="148">longest_side_cm</text>
      <text x="60" y="180">weight_g</text>
      <text x="60" y="212">main_colour</text>
      <text x="60" y="244">material</text>
      <text x="60" y="276">is_hollow</text>
    </g>
    <g font-size="16" fill="#14202B" text-anchor="end">
      <text x="340" y="148">7.0</text>
      <text x="340" y="180">38</text>
      <text x="340" y="212">red</text>
      <text x="340" y="244">plastic</text>
      <text x="340" y="276">yes</text>
    </g>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="60" y1="160" x2="340" y2="160"/>
      <line x1="60" y1="192" x2="340" y2="192"/>
      <line x1="60" y1="224" x2="340" y2="224"/>
      <line x1="60" y1="256" x2="340" y2="256"/>
    </g>
    <text x="200" y="340" font-size="18" fill="#14202B" text-anchor="middle">FRONT &#8212; the tester sees this</text>
    <text x="200" y="366" font-size="14" fill="#55636F" text-anchor="middle">Same five rows, same order, on all twenty cards.</text>

    <g transform="translate(374,178) scale(0.6)">
      <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="440" y="76" width="320" height="240" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="600" y="180" font-size="24" fill="#14202B" text-anchor="middle">toy car</text>
    <text x="600" y="214" font-size="14" fill="#14202B" text-anchor="middle">(category: toy)</text>
    <line x1="490" y1="240" x2="710" y2="240" stroke="#845F00" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="600" y="266" font-size="14" fill="#14202B" text-anchor="middle">Keep face down until the guess</text>
    <text x="600" y="286" font-size="14" fill="#14202B" text-anchor="middle">is written on the sheet.</text>
    <text x="600" y="340" font-size="18" fill="#14202B" text-anchor="middle">BACK &#8212; the label</text>
    <text x="600" y="366" font-size="14" fill="#55636F" text-anchor="middle">No hints, no drawings, no clues.</text>
  </g>
</svg>
