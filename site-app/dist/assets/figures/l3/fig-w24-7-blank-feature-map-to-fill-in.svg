<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Fill in all sixteen cells</title>
  <desc>A six by six picture whose left three columns hold 10 and right three columns hold 2, beside a three by three kernel holding 1, 0 and minus 1 in every row. Underneath is an empty four by four grid for the student to fill in; the answer is 0, 24, 24, 0 in every row. Three empty boxes ask for the number of windows across, the number down, and how many cells altogether: 4, 4 and 16.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fill in all sixteen cells</text>
