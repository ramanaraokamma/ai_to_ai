  <text x="448" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Asha,Falcons,48</text>
  <circle cx="485.8" cy="160" r="6" fill="none" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="553.0" cy="160" r="6" fill="none" stroke="#C42B8C" stroke-width="2"/>
  <path d="M740 154 v10 h-10" fill="none" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-7,-5 0,0 -7,5" fill="none" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(722 164) rotate(180)"/>
  <text x="448" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Ravi,Falcons,12</text>
  <circle cx="485.8" cy="188" r="6" fill="none" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="553.0" cy="188" r="6" fill="none" stroke="#C42B8C" stroke-width="2"/>
  <path d="M740 182 v10 h-10" fill="none" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-7,-5 0,0 -7,5" fill="none" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(722 192) rotate(180)"/>
  <text x="448" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Nita,Falcons,77</text>
  <circle cx="485.8" cy="216" r="6" fill="none" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="553.0" cy="216" r="6" fill="none" stroke="#C42B8C" stroke-width="2"/>
  <path d="M740 210 v10 h-10" fill="none" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-7,-5 0,0 -7,5" fill="none" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(722 220) rotate(180)"/>
  <text x="600" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">ringed pink: a comma ends a column</text>
  <text x="600" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">green hook: a new line ends a row</text>
  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four lines of writing. 63 characters. That is the whole file.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Header row first, then one line per record. No fonts, no colours, no formulas.</text>
</svg>
