  <line x1="420.8" y1="158" x2="508.8" y2="158" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="464.8" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pull the record</text>
  <text x="464.8" y="211" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">out of a chatty</text>
  <text x="464.8" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">reply</text>
  <rect x="538.4" y="110" width="112" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <circle cx="556.4" cy="128" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="556.4" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <line x1="550.4" y1="158" x2="638.4" y2="158" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="594.4" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">count the boxes</text>
  <text x="594.4" y="211" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">that match the</text>
  <text x="594.4" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">right answers</text>
  <rect x="668" y="110" width="112" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <circle cx="686" cy="128" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="686" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <line x1="680" y1="158" x2="768" y2="158" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="724" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">list the scores</text>
  <text x="724" y="211" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and what was</text>
  <text x="724" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">right, now wrong</text>
  <rect x="20" y="262" width="760" height="70" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="40" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">around the whole loop, stops the run when the money runs out:</text>
  <text x="40" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">its name</text>
  <line x1="100" y1="320" x2="320" y2="320" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
