  <rect x="520" y="246" width="11.2" height="16" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <text x="537.2" y="259" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">train 0.005</text>
  <text x="422" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">batch 256</text>
  <text x="422" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">260 epochs</text>
  <rect x="520" y="278" width="164.2" height="16" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="690.2" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">val 0.073</text>
  <rect x="520" y="298" width="2" height="16" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <text x="528" y="311" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">train 0.000</text>
  <text x="520" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">solid = validation, dashed = train</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A fixes epochs, so steps change. B fixes steps, so epochs change. Neither fixes everything.</text>
</svg>
