<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the four parts</title>
  <desc>A function definition reading def change left paid cost above a call reading change left of 100 and 65. Four pink callout circles marked A, B, C and D point at paid, cost, 100 and 65. Four blank write-in lines wait for the labels.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the four parts</text>
  <text x="400" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle">def change_left(paid, cost):</text>
  <text x="400" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#55636F" text-anchor="middle">return paid - cost</text>
  <text x="400" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B" text-anchor="middle">change_left(100, 65)</text>
  <circle cx="298" cy="60" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="298" y="60" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">A</text>
  <circle cx="370" cy="60" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="370" y="60" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">B</text>
  <circle cx="340" cy="176" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="340" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">C</text>
  <circle cx="414" cy="176" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="414" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">D</text>
  <text x="40" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">A. paid, in the def line, is a ...</text>
  <rect x="400" y="200" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="221" x2="748" y2="221" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">B. cost, in the def line, is a ...</text>
  <rect x="400" y="240" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="261" x2="748" y2="261" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">C. the 100, in the call, is an ...</text>
  <rect x="400" y="280" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="301" x2="748" y2="301" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">D. the 65, in the call, is an ...</text>
  <rect x="400" y="320" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="412" y1="341" x2="748" y2="341" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two of these are names. Two of these are values. Say which is which.</text>
</svg>
