<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The five-step shading key</title>
  <desc>Five cards in a row. Each shows a shaded square, how much pencil is on it, and the number it becomes: 0 for solid, 64 for nearly filled, 128 for half, 192 for a light touch and 255 for untouched paper.</desc>
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The five-step shading key</text><rect x="30" y="70" width="136" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="48" y="86" width="100" height="100" fill="#14202B" stroke="#14202B" stroke-width="3"/>
<text x="98.0" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">filled in solid</text><text x="98.0" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no white left</text><rect x="58" y="248" width="80" height="46" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
<text x="98.0" y="279.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">0</text>
<rect x="181" y="70" width="136" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="199" y="86" width="100" height="100" fill="#4F5860" stroke="#14202B" stroke-width="3"/>
<text x="249.0" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">nearly filled</text><text x="249.0" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a bit of white</text><rect x="209" y="248" width="80" height="46" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
<text x="249.0" y="279.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">64</text>
<rect x="332" y="70" width="136" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="350" y="86" width="100" height="100" fill="#8A9095" stroke="#14202B" stroke-width="3"/>
<text x="400.0" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">half and half</text><rect x="360" y="248" width="80" height="46" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
<text x="400.0" y="279.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">128</text>
<rect x="483" y="70" width="136" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="501" y="86" width="100" height="100" fill="#C5C8CB" stroke="#14202B" stroke-width="3"/>
<text x="551.0" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a light touch</text><text x="551.0" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">of pencil</text><rect x="511" y="248" width="80" height="46" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
<text x="551.0" y="279.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">192</text>
<rect x="634" y="70" width="136" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="652" y="86" width="100" height="100" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
<text x="702.0" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">not touched</text><text x="702.0" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">clean paper</text><rect x="662" y="248" width="80" height="46" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
<text x="702.0" y="279.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">255</text>
<text x="400" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Write this key at the top of the page before you start.</text><text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Then your grid means the same thing to everybody else.</text></svg>
