<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Five icon cards. A while loop is a check diamond with a yes exit that loops back and a no exit that leaves. An infinite loop is the same diamond with the no exit crossed out because nothing in the body changes the answer. A break is an arrow leaving the whole ring. A continue is an arrow curling back to the top of the ring. Input validation is a gate that sends the word banana back with a polite message and lets the digits four and two through to be converted.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>

  <rect x="20" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="174" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="328" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="482" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="636" y="64" width="144" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M92 96 L128 122 L92 148 L56 122 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="92" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">check</text>
  <line x1="92" y1="148" x2="92" y2="168" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
  <text x="104" y="163" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">yes</text>
  <rect x="52" y="168" width="80" height="26" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="92" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">do + change</text>
  <path d="M52 181 H40 V122 H54" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="122" x2="146" y2="122" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">no</text>
  <text x="92" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">repeats while the</text>
  <text x="92" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">answer stays yes.</text>
  <text x="92" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Checks first, always</text>
  <text x="92" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">while loop</text>

  <path d="M246 96 L282 122 L246 148 L210 122 Z" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="246" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">always yes</text>
  <line x1="246" y1="148" x2="246" y2="168" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <rect x="206" y="168" width="80" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="246" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">no change</text>
  <path d="M206 181 H194 V122 H208" fill="none" stroke="#CC2B1D" stroke-width="2" stroke-linecap="round"/>
  <line x1="282" y1="122" x2="300" y2="122" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round">
    <line x1="294" y1="112" x2="308" y2="132"/>
    <line x1="308" y1="112" x2="294" y2="132"/>
  </g>
  <text x="246" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">nothing moves the</text>
  <text x="246" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">answer, so the exit</text>
  <text x="246" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">is never reached</text>
  <text x="246" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">infinite loop</text>

  <circle cx="392" cy="132" r="40" fill="none" stroke="#C7CDD4" stroke-width="3"/>
  <line x1="392" y1="132" x2="392" y2="132" stroke="#14202B" stroke-width="2"/>
  <line x1="432" y1="132" x2="462" y2="132" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(462 132)"/>
  <text x="392" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">the loop</text>
  <text x="400" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">leave the loop now.</text>
  <text x="400" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Every remaining</text>
  <text x="400" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pass is skipped</text>
  <text x="400" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">break</text>

  <circle cx="546" cy="132" r="40" fill="none" stroke="#C7CDD4" stroke-width="3"/>
  <path d="M546 172 A40 40 0 0 0 586 132" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round"/>
  <polyline points="-9,-9 0,0 9,-9" fill="none" stroke="#C42B8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(586 132) rotate(90)"/>
  <text x="546" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">this pass</text>
  <text x="554" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">drop the rest of this</text>
  <text x="554" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pass and go back to</text>
  <text x="554" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the check</text>
  <text x="554" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">continue</text>

  <rect x="650" y="94" width="116" height="30" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="708" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">banana</text>
  <line x1="708" y1="124" x2="708" y2="140" stroke="#CC2B1D" stroke-width="2" stroke-linecap="round"/>
  <rect x="650" y="140" width="116" height="30" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="708" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">all digits?</text>
  <line x1="708" y1="170" x2="708" y2="186" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round"/>
  <rect x="650" y="186" width="116" height="30" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="708" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">42</text>
  <text x="708" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">check it BEFORE you</text>
  <text x="708" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">convert it</text>
  <text x="708" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">input validation</text>

  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four of these are about how a loop ends. The fifth is about who is allowed in.</text>
</svg>
