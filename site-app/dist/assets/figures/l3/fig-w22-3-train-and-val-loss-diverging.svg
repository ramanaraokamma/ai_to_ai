  <line x1="80.14" y1="84" x2="80.14" y2="400" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <circle cx="80.14" cy="318.965" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
