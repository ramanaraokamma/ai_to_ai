<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The three tables you have to know</title>
  <desc>Three truth tables side by side. The and table has four rows and is True only when both A and B are True. The or table has four rows and is True whenever at least one is True. The not table has two rows and flips its input. Each result cell carries a filled dot for True or a hollow ring for False as well as the word.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The three tables you have to know</text>
