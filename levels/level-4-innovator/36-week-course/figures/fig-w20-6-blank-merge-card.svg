  <rect x="146" y="132" width="126" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="209" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">he</text>
  <rect x="146" y="158" width="126" height="34" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="272" y="132" width="126" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="335" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ha</text>
