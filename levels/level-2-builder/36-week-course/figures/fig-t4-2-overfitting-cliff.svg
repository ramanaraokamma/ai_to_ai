  <line x1="94" y1="160.66666666666669" x2="590" y2="160.66666666666669" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="160.66666666666669" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">40</text>
