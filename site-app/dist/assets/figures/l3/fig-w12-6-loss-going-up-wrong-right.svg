<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A rising loss is a wrong sign, not learning</title>
  <desc>Two panels. Left, marked wrong with a red cross: the belief that a loss going up means the model is busy learning, with the update written as w equals w plus lr times slope and a red box listing the losses 92.16, 235.93, 603.98, 1546.19 and 3958.24 climbing, while w runs away to minus 54.91. Right, marked right with a green tick: the update written as w equals w minus lr times slope, because the slope points uphill so you step the opposite way, with a green box listing the losses 36.00, 5.76, 0.92, 0.15 and 0.02 collapsing and w arriving at 7.996068 when the hidden answer was 8. Underneath, the rule: if the loss rises, check the sign first and the learning rate second.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A rising loss is a wrong sign, not learning</text>
  <rect x="24" y="62" width="372" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <line x1="38" y1="78" x2="58" y2="98" stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"/>
  <line x1="58" y1="78" x2="38" y2="98" stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"/>
  <text x="70" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="start" font-weight="bold" dominant-baseline="central">WRONG</text>
  <text x="70" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">"the numbers are moving, so it is learning"</text>
  <rect x="44" y="126" width="332" height="34" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="210" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">w = w + lr * slope</text>
  <text x="44" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">the loss, five steps in a row:</text>
  <rect x="44" y="192" width="332" height="80" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">92.16   235.93   603.98   1546.19</text>
  <text x="60" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">3958.24</text>
  <text x="60" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">w has run off to &#8722;54.91</text>
  <text x="44" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">The slope points UPHILL. Adding it</text>
  <text x="44" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">walks you up the side of the valley.</text>
  <text x="44" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#CC2B1D" text-anchor="start">No error message. Just the wrong way.</text>
  <rect x="408" y="62" width="372" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="422,88 429.5,95.0 442,80.0" fill="none" stroke="#1B7A4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="454" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="start" font-weight="bold" dominant-baseline="central">RIGHT</text>
  <text x="454" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">step the opposite way to the slope</text>
  <rect x="428" y="126" width="332" height="34" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="594" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">w = w - lr * slope</text>
  <text x="428" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">the loss, five steps in a row:</text>
  <rect x="428" y="192" width="332" height="80" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="444" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">36.00   5.76   0.92   0.15   0.02</text>
  <text x="444" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">2 &#8722; 0.3 &#215; (&#8722;12) = 2 + 3.6 = 5.6</text>
  <text x="444" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">after eight steps w = 7.996068</text>
  <rect x="428" y="286" width="332" height="30" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="594" y="301" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">the answer hidden in the data was 8</text>
  <text x="428" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">Loss up? Check the sign first,</text>
  <text x="428" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1B7A4B" text-anchor="start">the learning rate second.</text>
</svg>
