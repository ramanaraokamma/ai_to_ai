  <line x1="144.2" y1="296" x2="144.2" y2="301" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="144.2" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1e-8</text>
