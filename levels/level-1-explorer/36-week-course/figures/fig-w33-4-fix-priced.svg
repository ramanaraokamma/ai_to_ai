<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The fix, priced at 30 more lamplight photos</title>
  <desc>On the left the algebra that turns a target of one photo in five into an answer of thirty extra lamplight photos. On the right the current lamplight bar at 33.3 percent beside a dashed bar marked hoped for, with a reminder that it must be measured.</desc>
  <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">Price the fix in actual photos</text>

  <rect x="30" y="62" width="382" height="268" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="221" y="92" font-size="18" fill="#14202B" text-anchor="middle">HOW MANY PHOTOS?</text>
  <line x1="46" y1="104" x2="396" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>
  <g font-size="18" fill="#14202B">
    <text x="50" y="132">Lamplight now: 0 of 120 photos</text>
    <text x="50" y="158">Target: 1 photo in 5, so 20%</text>
  </g>
  <g font-size="18" fill="#6D28D9">
    <text x="70" y="194">x / (120 + x) = 0.20</text>
    <text x="70" y="220">x = 24 + 0.20x</text>
    <text x="70" y="246">0.80x = 24</text>
  </g>
  <rect x="60" y="258" width="180" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="70" y="281" font-size="18" fill="#14202B">x = 30 photos</text>
  <text x="50" y="316" font-size="14" fill="#55636F">Check: 30 out of 150 = 0.20, which is 20%.</text>

  <rect x="436" y="62" width="334" height="268" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="603" y="92" font-size="18" fill="#14202B" text-anchor="middle">WILL IT WORK?</text>
  <line x1="452" y1="104" x2="754" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="500" y1="290" x2="740" y2="290"/>
    <line x1="500" y1="230" x2="740" y2="230"/>
    <line x1="500" y1="170" x2="740" y2="170"/>
    <line x1="500" y1="130" x2="740" y2="130"/>
  </g>
  <g font-size="12" fill="#55636F" text-anchor="end">
    <text x="492" y="294">0</text>
    <text x="492" y="234">25</text>
    <text x="492" y="174">50</text>
    <text x="492" y="134">67</text>
  </g>

  <rect x="530" y="210" width="72" height="80" rx="4" fill="#1F6FB2"/>
  <text x="566" y="202" font-size="14" fill="#14202B" text-anchor="middle">33.3%</text>
  <text x="566" y="310" font-size="12" fill="#55636F" text-anchor="middle">now</text>

  <rect x="646" y="130" width="72" height="160" rx="4" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round"/>
  <text x="682" y="122" font-size="14" fill="#14202B" text-anchor="middle">hoped for</text>
  <text x="682" y="216" font-size="24" fill="#1B7A4B" text-anchor="middle">?</text>
  <text x="682" y="310" font-size="12" fill="#55636F" text-anchor="middle">after 30 photos</text>

  <line x1="500" y1="290" x2="740" y2="290" stroke="#14202B" stroke-width="2"/>

  <text x="400" y="366" font-size="18" fill="#14202B" text-anchor="middle">The dashed bar is a hope, not a result. It stays dashed until you retest.</text>
  <text x="400" y="390" font-size="14" fill="#55636F" text-anchor="middle">Retest with the identical four batches and publish both columns, before and after.</text>
</svg>
