<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four score bands, each ending in an instruction</title>
  <desc>Four stacked bands out of 80 marks. Sixty-four to eighty, 80 per cent and above, Secure: every section above half, nothing to reteach &#8212; so pick a harder project from the menu. Forty-eight to sixty-three, 60 to 79 per cent, Solid with a gap: one section clearly weaker than the rest &#8212; so reteach the two weakest weeks, not the paper. Thirty-two to forty-seven, 40 to 59 per cent, the maths did not land: sections B and C are where the marks went missing &#8212; so redo one week's workbook page by hand with them. Zero to thirty-one, under 40 per cent, stop and go back: a whole idea is missing rather than a detail &#8212; so name the one week, reteach it, and resit in a fortnight. A note says a band is not a verdict; every one of them ends with a DO.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four score bands, each ending in an instruction</text>
  <rect x="24" y="86" width="752" height="66" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="40" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B">64&#8211;80</text>
  <text x="40" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">80%+</text>
  <text x="150" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Secure</text>
  <text x="150" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Every section above half. Nothing to reteach.</text>
  <text x="400" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">DO: pick a harder project from the menu.</text>
  <rect x="24" y="160" width="752" height="66" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="40" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B">48&#8211;63</text>
  <text x="40" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">60&#8211;79%</text>
  <text x="150" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Solid, with a gap</text>
  <text x="150" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">One section clearly weaker than the rest.</text>
  <text x="400" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">DO: reteach the two weakest WEEKS, not the paper.</text>
  <rect x="24" y="234" width="752" height="66" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="40" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B">32&#8211;47</text>
  <text x="40" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">40&#8211;59%</text>
  <text x="150" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">The maths did not land</text>
  <text x="150" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Sections B and C are where the marks went missing.</text>
  <text x="400" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">DO: redo a workbook page by hand, with them.</text>
  <rect x="24" y="308" width="752" height="66" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="40" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B">0&#8211;31</text>
  <text x="40" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">under 40%</text>
  <text x="150" y="334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Stop and go back</text>
  <text x="150" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">A whole idea is missing, not a detail.</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">DO: name the ONE week, reteach it, then resit.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">A band is not a verdict. Every one of them ends with a DO.</text>
</svg>
