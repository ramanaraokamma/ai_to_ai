<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One word column becomes five yes-or-no columns</title>
  <desc>On the left a single column of five restaurant names with the shape 5 by 1. An arrow labelled one-hot leads to a grid on the right with five named columns and the shape 5 by 5, where every row holds exactly one 1 and four 0s. Underneath, a sixth restaurant called PopUpPizza, never seen in training, is turned into a row of five zeros rather than an error, because handle unknown is set to ignore. A closing line counts 5 restaurants plus 7 weekdays plus 3 kinds of weather as 15 new columns replacing 3 old ones.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One word column becomes five yes-or-no columns</text>
