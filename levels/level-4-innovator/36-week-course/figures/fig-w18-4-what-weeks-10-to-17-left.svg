<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Weeks 10 to 17 each left one skill on the paper, and Weeks 15 to 17 are the ones Week 19 depends on</title>
  <desc>Eight tiles in two rows, Weeks 10 to 17, each naming what the week left: 10 slopes multiply, fading, blowing up and clipping; 11 gates and the forget dial; 12 name model, teacher forcing, train against validation loss; 13 temperature, top-k, top-p, greedy; 14 the three-word attention pass; 15 divide by square root of d, the mask, heads; 16 places, the block, 848 knobs at d = 8; 17 TinyGPT with 807,196 knobs and a first loss of ln 28 = 3.332. Tiles for Weeks 15, 16 and 17 are pink with a thick border and a bracket reads Week 19 leans on these three. Below, a box for the Week 18 paper points to a box for Week 19, which takes TinyGPT apart.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What Weeks 10 to 17 left behind</text>
