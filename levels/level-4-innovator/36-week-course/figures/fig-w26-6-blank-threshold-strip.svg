  <line x1="467.1" y1="292" x2="467.1" y2="299" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="467.1" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.4</text>
  <line x1="561.4" y1="292" x2="561.4" y2="299" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="561.4" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="655.7" y1="292" x2="655.7" y2="299" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="655.7" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.6</text>
  <line x1="750" y1="292" x2="750" y2="299" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="750" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.7</text>
  <text x="420" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">similarity of the best note</text>
  <rect x="560" y="346" width="60" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="554" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">my line</text>
  <rect x="716" y="346" width="50" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="710" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">mistakes</text>
  <text x="36" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">left of the line = refused</text>
</svg>
