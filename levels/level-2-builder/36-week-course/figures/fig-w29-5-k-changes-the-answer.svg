<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Change k, change the answer</title>
  <desc>On the left, six known songs are stacked nearest first with their distances: hype, hype, chill, chill, chill, hype. Three pink boxes take the top one, the top three and the top five of that stack. Underneath each, the tally and the winner: k equals one gives hype, k equals three gives hype, k equals five gives chill. Same data, same distances, three different answers.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Change k, change the answer</text>
  <text x="150" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">nearest first</text>
