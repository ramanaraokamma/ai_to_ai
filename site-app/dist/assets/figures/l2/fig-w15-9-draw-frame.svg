<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 15</title>
  <desc>An empty framed drawing area titled draw your answers and the denominator beside every one, with a ruled grid of three columns headed the question I asked, the answer, and out of how many rows, above eight blank rows, and three reminder boxes underneath for the minimum group size, the answer trusted least, and why.</desc>
  <rect x="24" y="24" width="752" height="290" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your answers, and the denominator beside every one</text>
  <text x="400" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one row per answer - the question, the number, and how many rows it came from</text>
  <rect x="84" y="104" width="632" height="22" fill="#D9EAF9"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="400" y1="104" x2="400" y2="302"/>
    <line x1="560" y1="104" x2="560" y2="302"/>
    <line x1="84" y1="148" x2="716" y2="148"/>
    <line x1="84" y1="170" x2="716" y2="170"/>
    <line x1="84" y1="192" x2="716" y2="192"/>
    <line x1="84" y1="214" x2="716" y2="214"/>
    <line x1="84" y1="236" x2="716" y2="236"/>
    <line x1="84" y1="258" x2="716" y2="258"/>
    <line x1="84" y1="280" x2="716" y2="280"/>
  </g>
  <line x1="84" y1="126" x2="716" y2="126" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="242" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">the question I asked</text>
  <text x="480" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">the answer</text>
  <text x="638" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">out of how many rows</text>
  <rect x="84" y="104" width="632" height="198" rx="0" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">my minimum group size</text>
  <rect x="60" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the answer I trust least</text>
  <rect x="300" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">and why - in one line</text>
  <rect x="540" y="338" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
</svg>
