<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Truth down the side, said across the top</title>
  <desc>Two three by three grids. The left one is labelled the wrong way round with what the model said down the side, and one cell is read as a sentence that never happened. The right one is labelled correctly.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">Truth down the side, said across the top</text>

    <line x1="400" y1="60" x2="400" y2="340" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <rect x="26" y="60" width="348" height="280" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(42,72) scale(0.34)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <text x="92" y="94" font-size="18" fill="#14202B">WRONG WAY ROUND</text>
    <text x="200" y="122" font-size="14" fill="#CC2B1D" text-anchor="middle">said  spoon / brush / comb</text>
    <text x="46" y="188" font-size="14" fill="#CC2B1D" transform="rotate(-90 46 188)" text-anchor="middle">truth</text>
    <g stroke="#14202B" stroke-width="2" fill="none">
      <rect x="64" y="132" width="252" height="126" rx="4"/>
      <line x1="148" y1="132" x2="148" y2="258"/>
      <line x1="232" y1="132" x2="232" y2="258"/>
      <line x1="64" y1="174" x2="316" y2="174"/>
      <line x1="64" y1="216" x2="316" y2="216"/>
    </g>
    <g font-size="18" fill="#14202B" text-anchor="middle">
      <text x="106" y="159">5</text><text x="190" y="159">0</text><text x="274" y="159">1</text>
      <text x="106" y="201">0</text><text x="190" y="201">4</text><text x="274" y="201">2</text>
      <text x="106" y="243">0</text><text x="190" y="243">1</text><text x="274" y="243">2</text>
    </g>
    <rect x="232" y="216" width="84" height="42" fill="none" stroke="#CC2B1D" stroke-width="3"/>
    <text x="200" y="288" font-size="14" fill="#14202B" text-anchor="middle">reading the red cell out loud gives:</text>
    <text x="200" y="312" font-size="14" fill="#CC2B1D" text-anchor="middle">"two combs said comb wrongly"  — meaningless</text>

    <rect x="426" y="60" width="348" height="280" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(442,72) scale(0.34)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="492" y="94" font-size="18" fill="#14202B">RIGHT WAY ROUND</text>
    <text x="600" y="122" font-size="14" fill="#1B7A4B" text-anchor="middle">SAID  spoon / brush / comb</text>
    <text x="446" y="188" font-size="14" fill="#1B7A4B" transform="rotate(-90 446 188)" text-anchor="middle">TRUTH</text>
    <g stroke="#14202B" stroke-width="2" fill="none">
      <rect x="464" y="132" width="252" height="126" rx="4"/>
      <line x1="548" y1="132" x2="548" y2="258"/>
      <line x1="632" y1="132" x2="632" y2="258"/>
      <line x1="464" y1="174" x2="716" y2="174"/>
      <line x1="464" y1="216" x2="716" y2="216"/>
    </g>
    <g font-size="18" fill="#14202B" text-anchor="middle">
      <text x="506" y="159">5</text><text x="590" y="159">0</text><text x="674" y="159">0</text>
      <text x="506" y="201">0</text><text x="590" y="201">4</text><text x="674" y="201">1</text>
      <text x="506" y="243">1</text><text x="590" y="243">2</text><text x="674" y="243">2</text>
    </g>
    <rect x="548" y="216" width="84" height="42" fill="none" stroke="#1B7A4B" stroke-width="3"/>
    <text x="600" y="288" font-size="14" fill="#14202B" text-anchor="middle">reading the green cell out loud gives:</text>
    <text x="600" y="312" font-size="14" fill="#1B7A4B" text-anchor="middle">"two combs were called toothbrush"  — a real event</text>

    <text x="400" y="374" font-size="14" fill="#55636F" text-anchor="middle">Both grids have a diagonal that adds to 11, so the check passes either way. Only reading a cell aloud catches it.</text>
  </g>
</svg>
