<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: what to do with an empty box</title>
  <desc>Two panels. On the left, marked wrong, the empty sleep box has been filled with a zero and the average drops to six point nine hours. On the right, marked correct, the box is left blank with a note saying forgot to record, and the average stays at seven point six hours computed from nine values instead of ten.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One empty box. Two ways to handle it.</text>
  <line x1="400" y1="66" x2="400" y2="332" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="24" y="66" width="352" height="268" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="424" y="66" width="352" height="268" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>

  <g transform="translate(40,78) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(440,78) scale(0.40)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Typed a 0 in it</text>
  <text x="490" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Left it blank + wrote a note</text>

  <!-- LEFT: sleep column with a 0 -->
  <rect x="80" y="122" width="88" height="150" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M80 130 A8 8 0 0 1 88 122 H160 A8 8 0 0 1 168 130 V148 H80 Z" fill="#D9EAF9" stroke="none"/>
  <line x1="80" y1="148" x2="168" y2="148" stroke="#1F6FB2" stroke-width="3"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="80" y1="179" x2="168" y2="179"/>
    <line x1="80" y1="210" x2="168" y2="210"/>
    <line x1="80" y1="241" x2="168" y2="241"/>
  </g>
  <rect x="80" y="179" width="88" height="31" fill="#F6AEA6" stroke="none"/>
  <rect x="80" y="122" width="88" height="150" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="124" y="140">sleep_h</text>
    <text x="124" y="171">7.5</text>
    <text x="124" y="202">0</text>
    <text x="124" y="233">8.0</text>
    <text x="124" y="264">7.0</text>
  </g>
  <text x="124" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">... and 6 more rows</text>
  <text x="266" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Average of</text>
  <text x="266" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">10 values</text>
  <text x="266" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#CC2B1D" text-anchor="middle">6.9 h</text>
  <text x="266" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">claims a night</text>
  <text x="266" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">with NO sleep</text>
  <text x="200" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">A made-up fact you will forget making up.</text>

  <!-- RIGHT: sleep column blank + note -->
  <rect x="480" y="122" width="88" height="150" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M480 130 A8 8 0 0 1 488 122 H560 A8 8 0 0 1 568 130 V148 H480 Z" fill="#D9EAF9" stroke="none"/>
  <line x1="480" y1="148" x2="568" y2="148" stroke="#1F6FB2" stroke-width="3"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="480" y1="179" x2="568" y2="179"/>
    <line x1="480" y1="210" x2="568" y2="210"/>
    <line x1="480" y1="241" x2="568" y2="241"/>
  </g>
  <rect x="480" y="122" width="88" height="150" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="524" y="140">sleep_h</text>
    <text x="524" y="171">7.5</text>
    <text x="524" y="233">8.0</text>
    <text x="524" y="264">7.0</text>
  </g>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="492" y1="196" x2="556" y2="196"/>
  </g>
  <text x="524" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">... and 6 more rows</text>
  <path d="M586 168 H756 V204 L740 218 H586 Z" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="596" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">note: forgot to</text>
  <text x="596" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">record that night</text>
  <text x="668" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#1B7A4B" text-anchor="middle">7.6 h</text>
  <text x="668" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">average of 9 values,</text>
  <text x="668" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and it says so</text>
  <text x="600" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">One measurement lost. Nothing invented.</text>

  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A blank says "I don't know." A zero says "I know, and it was zero." Opposite sentences.</text>
</svg>
