<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The snowball: price three fixes in a row</title>
  <desc>Three stacked steps. Each step shows a condition, how many photos of it exist now, the running total of the training set, and a blank box for how many photos must be added to reach one in five. A final blank box asks for the total number of new photographs.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The snowball</text>
  <text x="250" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Fix one gap and the training set grows &#8212; so the next fix costs more.</text>
  <text x="250" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Target every time: that condition is 1 photo in 5, which is 20%.</text>
  <rect x="40" y="106" width="420" height="120" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <circle cx="70" cy="136" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="70" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1</text>
  <text x="96" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">LAMPLIGHT</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">
    <text x="60" y="172">Have now: 0 lamplight, out of 120 photos</text>
    <text x="60" y="196">Add x, so that x / (120 + x) = 0.20</text>
  </g>
  <rect x="330" y="176" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <text x="385" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C7CDD4" text-anchor="middle">x = ?</text>
  <rect x="40" y="242" width="420" height="120" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <circle cx="70" cy="272" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="70" y="277" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">2</text>
  <text x="96" y="277" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">ODD BACKGROUND</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">
    <text x="60" y="308">Have now: 14, out of the NEW total from step 1</text>
    <text x="60" y="332">Add y, so that (14 + y) / (total + y) = 0.20</text>
  </g>
  <rect x="330" y="312" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <text x="385" y="334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C7CDD4" text-anchor="middle">y = ?</text>
  <rect x="40" y="378" width="420" height="120" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <circle cx="70" cy="408" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="70" y="413" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">3</text>
  <text x="96" y="413" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">HELD IN A HAND</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">
    <text x="60" y="444">Have now: 22, out of the NEW total from step 2</text>
    <text x="60" y="468">Add z, so that (22 + z) / (total + z) = 0.20</text>
  </g>
  <rect x="330" y="448" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <text x="385" y="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C7CDD4" text-anchor="middle">z = ?</text>
  <rect x="40" y="518" width="420" height="60" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="60" y="555" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Total new photos to shoot:</text>
  <rect x="330" y="530" width="110" height="36" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2"/>
  <text x="250" y="616" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">And the last question, which is the real one:</text>
  <text x="250" y="640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">how much EXTRA would it have cost to shoot the original</text>
  <text x="250" y="664" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">120 photos across all four conditions in the first place?</text>
</svg>
