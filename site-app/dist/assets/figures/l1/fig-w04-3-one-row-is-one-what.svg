  <path d="M558 128 A8 8 0 0 1 566 120 H744 A8 8 0 0 1 752 128 V148 H558 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="558" y1="177" x2="752" y2="177"/>
    <line x1="660" y1="148" x2="660" y2="206"/><line x1="706" y1="148" x2="706" y2="206"/>
  </g>
  <line x1="558" y1="148" x2="752" y2="148" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="558" y="120" width="194" height="86" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
    <text x="566" y="134" dominant-baseline="central" fill="#55636F">owner</text>
    <text x="668" y="134" dominant-baseline="central" fill="#55636F">items</text>
    <text x="714" y="134" dominant-baseline="central" fill="#55636F">grams</text>
    <text x="566" y="162" dominant-baseline="central">Asha</text>
    <text x="566" y="191" dominant-baseline="central">Ben</text>
