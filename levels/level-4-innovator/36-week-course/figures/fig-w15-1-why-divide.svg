<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Dividing by the square root of the width keeps the spread at 1 and keeps the softmax from saturating</title>
  <desc>Left, two bar charts of the weights from three scores. Raw scores 8, minus 2, 1 give weights 0.999044, 0.000045, 0.000911: one winner takes almost everything. Divided by 8, the square root of 64, the scores 1, minus 0.25, 0.125 give 0.587, 0.168, 0.245. Right, horizontal bars for the spread of a dot product: width 4 raw 2.01, width 16 raw 4.00, width 64 raw 7.91, while after dividing by the square root of d they are 1.00, 1.00 and 0.99.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Why the dot product is divided by &#8730;d</text>
  <rect x="20" y="62" width="370" height="284" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="410" y="62" width="370" height="284" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="110" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">raw scores</text>
  <text x="130" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">saturated: one winner</text>
  <line x1="22" y1="290" x2="198" y2="290" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="35" y="150.1" width="30" height="139.9" rx="3" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="50" y="144.1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">0.999044</text>
  <text x="50" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">8</text>
  <rect x="95" y="288.5" width="30" height="1.5" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="110" y="282.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">0.000045</text>
  <text x="110" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">&#8722;2</text>
  <rect x="155" y="288.5" width="30" height="1.5" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="170" y="282.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">0.000911</text>
  <text x="170" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">1</text>
  <text x="295" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">divided by 8</text>
  <text x="315" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">everyone still counts</text>
  <line x1="207" y1="290" x2="383" y2="290" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="220" y="207.8" width="30" height="82.2" rx="3" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="235" y="201.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">0.587</text>
  <text x="235" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">1</text>
  <rect x="280" y="266.5" width="30" height="23.5" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="295" y="260.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">0.168</text>
  <text x="295" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">&#8722;0.25</text>
  <rect x="340" y="255.7" width="30" height="34.3" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="355" y="249.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">0.245</text>
  <text x="355" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">0.125</text>
  <text x="205" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">bar = weight; number below = score</text>
  <rect x="338" y="304" width="42" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="359" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(3,)</text>
  <polyline points="226.1,105 229.6,108.8 236.6,100.8" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="41,100 51,110" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="41,110 51,100" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="595" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">spread of q &#183; k, by width d</text>
  <text x="462" y="133" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">d = 4</text>
  <rect x="470" y="112" width="60.3" height="18" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="538.3" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">raw: 2.01</text>
  <rect x="470" y="134" width="30" height="18" rx="3" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="508" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">&#247; &#8730;d: 1.00</text>
  <text x="462" y="199" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">d = 16</text>
  <rect x="470" y="178" width="120" height="18" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="598" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">raw: 4.00</text>
  <rect x="470" y="200" width="30" height="18" rx="3" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="508" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">&#247; &#8730;d: 1.00</text>
  <text x="462" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">d = 64</text>
  <rect x="470" y="244" width="237.3" height="18" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="715.3" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">raw: 7.91</text>
  <rect x="470" y="266" width="29.7" height="18" rx="3" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="507.7" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">&#247; &#8730;d: 0.99</text>
  <text x="595" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">10,000 random pairs per width, seed 0</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">At width 64 a raw row of 8 scores gives its biggest weight 0.880; divided, the biggest weight</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">stays near 0.365 at every width (4, 16, 64). An equal share would be 0.125.</text>
</svg>
