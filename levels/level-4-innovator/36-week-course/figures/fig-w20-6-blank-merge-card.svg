  <rect x="524" y="132" width="126" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="587" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">en</text>
