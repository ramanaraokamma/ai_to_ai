<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Elementwise means position by position</title>
  <desc>Two rows of six cells, one above the other, joined by six short vertical ties. Under each tie the sum of that pair is printed in a third row of cells. A note states that the first cell only ever meets the first cell and never any other, and that both rows must therefore have the same number of cells.</desc>
