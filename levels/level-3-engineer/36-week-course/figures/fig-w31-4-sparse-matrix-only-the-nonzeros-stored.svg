<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A sparse matrix stores only the numbers that are there</title>
  <desc>The four by eight count grid with its 15 non-zero cells outlined in pink and its 17 empty cells left grey. 32 minus 15 is 17, and 17 divided by 32 is 53 percent empty. A panel on the right shows what the computer actually keeps: four coordinate lines reading 0 6 1, 0 4 1, 0 7 1, 0 3 1, then a note saying eleven more and not one zero. Below it, the same count for the student's own 60-review corpus: 5,520 cells, 363 of them stored, 93.4 percent empty.</desc>
