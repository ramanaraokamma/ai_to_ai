  <text x="556" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">4.46 &#8722; 4.46 = 0.00</text>
  <text x="556" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">e^0.00       = 1.000000</text>
  <text x="556" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">the ten total  1.024606</text>
  <line x1="554" y1="126" x2="750" y2="126" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
