<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the grid yourself</title>
  <desc>An unlabelled three by three confusion matrix holding twelve, zero, zero on the top row, zero, thirteen, one on the middle row, and two, five, three on the bottom row, with index numbers 0, 1 and 2 down the side and along the top. Three empty dashed slots on the right are for writing whether the rows are the truth or the guess, whether the columns are the truth or the guess, and which row is worst and what got called what. Three more empty slots beside the grid are for the row totals. A note gives the real class counts, twelve, fourteen and ten, so the learner can check.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the grid yourself</text>
  <text x="400" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Which way round is this grid? Fill in the three empty slots, then add up a row and check.</text>
  <rect x="84" y="108" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="152" y="108" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="220" y="108" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="84" y="176" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="152" y="176" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="220" y="176" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="84" y="244" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="152" y="244" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="220" y="244" width="68" height="68" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="118.0" y="142.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
  <text x="186.0" y="142.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="254.0" y="142.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="118.0" y="210.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="186.0" y="210.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">13</text>
  <text x="254.0" y="210.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="118.0" y="278.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="186.0" y="278.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="254.0" y="278.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="84" y="108" width="204" height="204" rx="10" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="118.0" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="68" y="142.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="186.0" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="68" y="210.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="254.0" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="68" y="278.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="304" y="125" width="56" height="34" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="304" y="193" width="56" height="34" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="304" y="261" width="56" height="34" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="332" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">row totals</text>
  <text x="420" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">The ROWS of this grid are the</text>
  <rect x="420" y="128" width="300" height="34" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="420" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">The COLUMNS of this grid are the</text>
  <rect x="420" y="204" width="300" height="34" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="420" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">The worst row, and what got called what:</text>
  <rect x="420" y="280" width="300" height="34" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The real test set held 12 class-0 wines, 14 class-1 wines and 10 class-2 wines.</text>
</svg>
