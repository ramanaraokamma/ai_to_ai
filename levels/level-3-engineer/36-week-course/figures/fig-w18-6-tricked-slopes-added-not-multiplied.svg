<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: slopes multiply, they do not add</title>
  <desc>Two panels showing the same two-stage chain, w to z to L, starting at w equals 2 where z is 7 and L is 49. Both panels have the measured stage slopes 3 and 14. On the left, marked wrong, they are added to give 17. On the right, marked right, they are multiplied to give 42, and the independent measurement straight through gives 0.084 divided by 0.002 which is also 42, so 42 is the answer and 17 is not.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Slopes multiply, they do not add</text>

  <rect x="30" y="66" width="350" height="300" rx="12" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="66" width="350" height="36" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="47" y1="75" x2="65" y2="93" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="47" y2="93" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="220" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">two stages, so add the slopes</text>

  <circle cx="70" cy="140" r="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="70" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">w=2</text>
  <line x1="88" y1="140" x2="140" y2="140" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="150,140 138,134 138,146" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="118" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">3</text>
  <circle cx="172" cy="140" r="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="172" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">z=7</text>
  <line x1="190" y1="140" x2="242" y2="140" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="252,140 240,134 240,146" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="220" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">14</text>
  <circle cx="276" cy="140" r="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="276" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">L=49</text>

  <text x="205" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#14202B" text-anchor="middle">3 + 14 = 17</text>
  <rect x="120" y="228" width="170" height="42" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="205" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#14202B" text-anchor="middle" dominant-baseline="central">17</text>
  <text x="205" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">nothing was measured to check this</text>
  <text x="205" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">and 17 is a plausible-looking number</text>
  <text x="205" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle">the measurement says no</text>

  <rect x="420" y="66" width="350" height="300" rx="12" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="420" y="66" width="350" height="36" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="437" y1="84" x2="444.2" y2="90.3" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round"/>
  <line x1="444.2" y1="90.3" x2="455" y2="76.8" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round"/>
  <text x="610" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">each stage scales, so multiply</text>

  <circle cx="460" cy="140" r="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="460" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">w=2</text>
  <line x1="478" y1="140" x2="530" y2="140" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="540,140 528,134 528,146" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="508" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">3</text>
  <circle cx="562" cy="140" r="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="562" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">z=7</text>
  <line x1="580" y1="140" x2="632" y2="140" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="642,140 630,134 630,146" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="610" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">14</text>
  <circle cx="666" cy="140" r="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="666" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">L=49</text>
  <path d="M 460 168 C 500 200 626 200 666 168" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
  <text x="563" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">measured straight through</text>

  <text x="595" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">3 &#215; 14 = 42</text>
  <text x="595" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.084 &#247; 0.002 = 42</text>
  <rect x="510" y="292" width="170" height="42" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="595" y="313" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#14202B" text-anchor="middle" dominant-baseline="central">42</text>
  <text x="595" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="middle">two methods, one answer</text>
</svg>
