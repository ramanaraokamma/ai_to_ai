<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>A completed confusion matrix with its verdict</title>
  <desc>A three by three confusion matrix for a spoon, toothbrush and comb model. The diagonal reads 5, 4 and 2. The largest mistake cell, two real combs called toothbrush, is highlighted. Underneath, a box holds the three sentence verdict naming comb as the worst class.</desc>
<text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Confusion matrix and verdict</text><text x="250" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">what the model SAID  (columns)</text><text x="196.0" y="111.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">said spoon</text><text x="272.0" y="111.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">said toothbrush</text><text x="348.0" y="111.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">said comb</text><text x="423.0" y="111.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">total</text><text x="99.0" y="111.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">TRUE class</text><text x="99.0" y="157.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">true spoon</text><rect x="158" y="126" width="76" height="54" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<text x="196.0" y="159.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">5</text><rect x="234" y="126" width="76" height="54" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="272.0" y="159.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="310" y="126" width="76" height="54" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="348.0" y="159.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><text x="423.0" y="157.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text><text x="99.0" y="211.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">true toothbrush</text><rect x="158" y="180" width="76" height="54" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="196.0" y="213.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><rect x="234" y="180" width="76" height="54" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<text x="272.0" y="213.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">4</text><rect x="310" y="180" width="76" height="54" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="348.0" y="213.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1</text><text x="423.0" y="211.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text><text x="99.0" y="265.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">true comb</text><rect x="158" y="234" width="76" height="54" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="196.0" y="267.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1</text><rect x="234" y="234" width="76" height="54" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<text x="272.0" y="267.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2</text><rect x="310" y="234" width="76" height="54" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<text x="348.0" y="267.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2</text><text x="423.0" y="265.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text><line x1="40" y1="288" x2="460" y2="288" stroke="#14202B" stroke-width="2"/>
<text x="99.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">total said</text><text x="196.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text><text x="272.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text><text x="348.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text><text x="423.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">15</text><text x="250" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">diagonal 5 + 4 + 2 = 11 correct   -&gt;   11/15 = 73.3%</text><rect x="40" y="364" width="420" height="176" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
<text x="56" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">THE VERDICT</text><text x="56" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">My worst class was comb: 2 out of 5, which is 40%.</text><text x="56" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">It got confused with toothbrush 2 times out of the 3</text><text x="56" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">combs it missed. I think that happened because 14 of</text><text x="56" y="486" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">my 20 comb training photos were taken lying flat on</text><text x="56" y="508" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">the same tea towel, and a comb lying flat looks like</text><text x="56" y="530" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">a toothbrush lying flat.</text><text x="250" y="570" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The biggest mistake cell names the photos to reshoot.</text></svg>
