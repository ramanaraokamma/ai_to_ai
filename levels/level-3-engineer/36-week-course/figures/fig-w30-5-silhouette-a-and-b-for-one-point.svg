<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>One point's silhouette is two averages and a subtraction</title>
  <desc>Point C sits with A and B in the left-hand cluster; D, E and F are far away to the upper right. Two short arrows from C to A and B are labelled 1.4142 and 2.0000, whose average a is 1.7071. Three long arrows from C to D, E and F are labelled 7.8102, 8.0623 and 7.8102, whose average b is 7.8943. Below, the arithmetic: 7.8943 minus 1.7071 is 6.1872, divided by 7.8943 gives 0.7838.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two averages, one subtraction.</text>
  <line x1="60.00" y1="320.00" x2="344.40" y2="320.00" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="60.00" y1="49.60" x2="60.00" y2="320.00" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100.00" cy="268.00" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="126.00" cy="294.00" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="126.00" cy="242.00" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M282.00 105.00 L289.00 118.30 L275.00 118.30 Z" fill="#1B7A4B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M308.00 131.00 L315.00 144.30 L301.00 144.30 Z" fill="#1B7A4B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M256.00 79.00 L263.00 92.30 L249.00 92.30 Z" fill="#1B7A4B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="126.00" y1="242.00" x2="100.00" y2="268.00" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <line x1="126.00" y1="242.00" x2="126.00" y2="294.00" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <text x="88.0" y="272.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">A</text>
  <text x="140.0" y="298.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">B</text>
  <text x="114.0" y="234.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">C</text>
  <text x="282.0" y="98.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">D</text>
  <text x="322.0" y="142.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">E</text>
  <text x="242.0" y="80.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">F</text>
  <line x1="131.20" y1="236.80" x2="276.80" y2="91.20" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="94.6" y="252.39999999999998" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">1.4142</text>
  <text x="137.2" y="270.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">2.0000</text>
  <text x="200.0" y="171.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">about 7.9</text>
  <rect x="40" y="356" width="420" height="112" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">a = (1.4142 + 2.0000) &#247; 2 = 1.7071</text>
  <text x="56" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">b = (7.8102 + 8.0623 + 7.8102) &#247; 3 = 7.8943</text>
  <line x1="54.00" y1="418.00" x2="446.00" y2="418.00" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="56" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1B7A4B">s = (7.8943 &#8722; 1.7071) &#247; 7.8943 = 0.7838</text>
  <text x="56" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">near +1 means firmly inside its own cluster</text>
</svg>
