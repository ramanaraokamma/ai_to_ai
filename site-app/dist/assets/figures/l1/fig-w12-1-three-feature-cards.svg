<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three kinds of feature</title>
  <desc>Three cards with cartoon faces. The useful card smiles and scores 83 percent. The useless card has a flat mouth and shrug marks and scores 33 percent, exactly the baseline. The leaky card looks sideways and hides a card marked ANS behind its head, and scores 100 percent, marked bad news.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three kinds of feature</text>

  <rect x="60" y="80" width="220" height="240" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="290" y="80" width="220" height="240" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="520" y="80" width="220" height="240" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

  <circle cx="170" cy="150" r="34" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
  <circle cx="158" cy="142" r="4" fill="#14202B"/>
  <circle cx="182" cy="142" r="4" fill="#14202B"/>
  <path d="M156 162 Q170 174 184 162" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>

  <circle cx="400" cy="150" r="34" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <circle cx="388" cy="142" r="4" fill="#14202B"/>
  <circle cx="412" cy="142" r="4" fill="#14202B"/>
  <line x1="386" y1="166" x2="414" y2="166" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <path d="M344 142 L336 154 L346 160" fill="none" stroke="#55636F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M456 142 L464 154 L454 160" fill="none" stroke="#55636F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="rotate(12 660 150)">
    <rect x="648" y="122" width="44" height="54" rx="4" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
    <text x="670" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">ANS</text>
  </g>
  <circle cx="630" cy="150" r="34" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3"/>
  <circle cx="624" cy="142" r="4" fill="#14202B"/>
  <circle cx="648" cy="142" r="4" fill="#14202B"/>
  <path d="M616 166 Q623 160 630 166 Q637 172 644 166" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="170" y="222">USEFUL</text>
    <text x="400" y="222">USELESS</text>
    <text x="630" y="222">LEAKY</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="170" y="250">beats guessing</text>
    <text x="170" y="272">keep it</text>
    <text x="400" y="250">same as guessing</text>
    <text x="400" y="272">cut it</text>
    <text x="630" y="250">it is the answer</text>
    <text x="630" y="272">cut it, always</text>
  </g>

  <rect x="112" y="286" width="116" height="26" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="170" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">83% &#8212; good</text>
  <rect x="342" y="286" width="116" height="26" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">33% &#8212; baseline</text>
  <rect x="572" y="286" width="116" height="26" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="630" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">100% &#8212; bad news</text>

  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A perfect score is not a triumph. It is the first symptom of a leak.</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Only the numbers decide which card a feature gets. Never a feeling.</text>
</svg>
