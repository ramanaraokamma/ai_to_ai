<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank page: unroll the cell for x = [1, 1, 0, 0] and write each pre and note</title>
  <desc>A blank fill-in figure showing the recurrent cell drawn four times with the same weights, W_xh 1.0 and W_hh 0.5. The inputs above the four boxes are 1, 1, 0 and 0, the starting note on the left is 0, and arrows labelled note run from each box to the next. Each box has two empty write-in boxes, one for the pre and one for the note. No answers are drawn.</desc>
