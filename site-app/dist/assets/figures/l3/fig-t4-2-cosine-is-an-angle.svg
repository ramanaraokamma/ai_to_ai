<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Cosine similarity is an angle</title>
  <desc>Two axes labelled cold and pizza, with two arrows drawn from the origin: A pointing to 2 comma 1 and B pointing to 1 comma 2, with a pink arc between them marked 36.87 degrees. A pink box prints the arithmetic: the dot product is 2 times 1 plus 1 times 2 equals 4, the length of A is the square root of 4 plus 1 equals 2.2361, the length of B is the same, so the cosine is 4 divided by 5 equals 0.8000, which is an angle of 36.87 degrees. A red box warns that 0.8 is not 80 per cent alike, and that the vectors 3 comma 1 and 6 comma 2 score exactly 1.0000 and zero degrees because length is thrown away on purpose.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Cosine similarity is an angle</text>
  <line x1="130" y1="330" x2="380" y2="330" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="330" x2="130" y2="80" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="382" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#8220;cold&#8221;</text>
  <text x="124" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#8220;pizza&#8221;</text>
  <text x="192" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="118" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="254" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="118" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="316" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <text x="118" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">3</text>
  <line x1="130" y1="330" x2="246" y2="272" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="254,268 242,269 248,279" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="1"/>
  <line x1="130" y1="330" x2="188" y2="214" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <polygon points="192,206 181,212 191,218" fill="#845F00" stroke="#845F00" stroke-width="1"/>
  <text x="262" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">A = (2, 1)</text>
  <text x="200" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">B = (1, 2)</text>
  <path d="M170 310 A 44 44 0 0 0 150 290" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="182" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">36.87&#176;</text>
  <rect x="420" y="92" width="356" height="150" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="436" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">dot product, then both lengths</text>
  <text x="436" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">dot   = 2&#215;1 + 1&#215;2 = 4</text>
  <text x="436" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">|A|   = &#8730;(4 + 1) = 2.2361</text>
  <text x="436" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">|B|   = &#8730;(1 + 4) = 2.2361</text>
  <text x="436" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">cos   = 4 &#247; 5 = 0.8000</text>
  <text x="436" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">angle = 36.87&#176;</text>
  <rect x="420" y="258" width="356" height="78" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="436" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.8 is NOT &#8220;80 per cent alike&#8221;.</text>
  <text x="436" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">(3,1) against (6,2) gives 1.0000 and 0&#176;,</text>
  <text x="436" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">because length is thrown away on purpose.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Cosine measures the direction two rows point, and nothing else.</text>
</svg>
