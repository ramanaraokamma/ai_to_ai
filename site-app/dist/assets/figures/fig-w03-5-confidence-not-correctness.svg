<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>A confidence score is a preference, not a promise</title>
  <desc>Three horizontal bars showing a model's confidence for one photo: dog ninety-four percent, fox four percent, cat two percent. The photo was actually a fox, so the top answer is marked wrong. A note explains the scores always add to one hundred percent and say nothing about being right.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="38" font-size="24" fill="#14202B" text-anchor="middle">94% sure. Still wrong.</text>
    <text x="250" y="62" font-size="14" fill="#55636F" text-anchor="middle">One photo in. Three numbers out.</text>

    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="130" y1="90" x2="130" y2="290"/>
      <line x1="220" y1="90" x2="220" y2="290"/>
      <line x1="310" y1="90" x2="310" y2="290"/>
      <line x1="400" y1="90" x2="400" y2="290"/>
      <line x1="450" y1="90" x2="450" y2="290"/>
    </g>

    <rect x="130" y="110" width="301" height="44" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="120" y="132" font-size="18" fill="#14202B" text-anchor="end" dominant-baseline="central">dog</text>
    <text x="445" y="132" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">94%</text>

    <rect x="130" y="174" width="13" height="44" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="120" y="196" font-size="18" fill="#14202B" text-anchor="end" dominant-baseline="central">fox</text>
    <text x="175" y="196" font-size="14" fill="#14202B" dominant-baseline="central">4%</text>

    <rect x="130" y="238" width="7" height="44" rx="3" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="120" y="260" font-size="18" fill="#14202B" text-anchor="end" dominant-baseline="central">cat</text>
    <text x="169" y="260" font-size="14" fill="#14202B" dominant-baseline="central">2%</text>

    <line x1="130" y1="290" x2="450" y2="290" stroke="#14202B" stroke-width="2"/>
    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="130" y="308">0%</text><text x="220" y="308">25%</text><text x="310" y="308">50%</text>
      <text x="400" y="308">75%</text><text x="450" y="308">100%</text>
    </g>
    <text x="290" y="332" font-size="14" fill="#55636F" text-anchor="middle">94 + 4 + 2 = 100. They always add up to 100.</text>

    <rect x="40" y="352" width="420" height="118" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(58,368) scale(0.44)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <g font-size="14" fill="#14202B">
      <text x="112" y="382">The photo was actually a FOX.</text>
      <text x="60" y="412">94% does not mean &#8220;right 94 times out of 100&#8221;.</text>
      <text x="60" y="436">It means &#8220;dog is the one I lean towards hardest&#8221;.</text>
      <text x="60" y="460">Leaning hard and being wrong are not opposites.</text>
    </g>
  </g>
</svg>
