<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A weighted sum, then a squash</title>
  <desc>Two inputs on the left &#8212; 4 orders in the oven and 5 km to drive &#8212; travel along wires marked times 0.6 and times 0.4 into a box that adds them up together with a bias of minus 3. The arithmetic is printed: 0.6 times 4 is 2.4, 0.4 times 5 is 2.0, 2.4 plus 2.0 minus 3 gives z = 1.40. An arrow leads to a second box that squashes it: 1 divided by 1.246597 gives p = 0.8022, read as an 80.2 per cent chance the order is late.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A weighted sum, then a squash</text>
  <rect x="40" y="110" width="168" height="46" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="124" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4 orders in the oven</text>
  <text x="124" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">this is x1</text>
  <rect x="40" y="210" width="168" height="46" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="124" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">5 km to drive</text>
  <text x="124" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">this is x2</text>
  <rect x="40" y="300" width="168" height="46" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="124" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">bias  &#8722;3</text>
  <text x="124" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">start out calm</text>
  <line x1="212" y1="133" x2="316" y2="200" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(316 200) rotate(32.8)"/>
  <line x1="212" y1="233" x2="316" y2="216" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(316 216) rotate(-9.3)"/>
  <line x1="212" y1="323" x2="316" y2="232" stroke="#845F00" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(316 232) rotate(-41.2)"/>
  <text x="232" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6D28D9">&#215; 0.6</text>
  <text x="232" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6D28D9">&#215; 0.4</text>
  <rect x="320" y="168" width="172" height="96" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="406" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">add them up</text>
  <text x="406" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">2.4 + 2.0 &#8722; 3</text>
  <text x="406" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">z = 1.40</text>
  <line x1="496" y1="216" x2="552" y2="216" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(552 216) rotate(0.0)"/>
  <rect x="556" y="168" width="132" height="96" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="622" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">squash it</text>
  <text x="622" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">1 &#247; 1.246597</text>
  <text x="622" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">p = 0.8022</text>
  <text x="692" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">80.2% chance this</text>
  <text x="692" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">order is late</text>
  <line x1="640" y1="268" x2="668" y2="288" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(668 288) rotate(35.5)"/>
  <text x="40" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">0.6 &#215; 4 = 2.4      0.4 &#215; 5 = 2.0      then take away 3</text>
  <text x="40" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">The three knobs are the two weights and the bias. Nothing else in the model moves.</text>
</svg>
