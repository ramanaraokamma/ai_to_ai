    <rect x="668" y="188" width="24" height="5" rx="2.5"/><rect x="714" y="188" width="24" height="5" rx="2.5"/>
  </g>

  <g>
    <circle cx="145" cy="290" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="145" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    <circle cx="400" cy="290" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="400" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <circle cx="655" cy="290" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="655" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="145" y="318">rows</text>
    <text x="400" y="318">rows</text>
    <text x="655" y="318">rows</text>
  </g>

  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Pick the row unit that matches the question you want answered. Then never change it.</text>
</svg>
