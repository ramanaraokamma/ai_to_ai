<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>What the board looks like at the end of Week 30</title>
  <desc>Three zones left to right. Zone one is the four build stages with a test after each. Zone two is the ten-question failure log with columns for what was typed, whether a trigger matched, and whether the reply was sensible. Zone three is the comparison: the rule bot fails loudly and the bigram generator fails silently.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What the board looks like at the end of Week 30</text>

  <rect x="30" y="66" width="204" height="264" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="258" y="66" width="268" height="264" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="550" y="66" width="220" height="264" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <text x="46" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2">1 &#183; THE STAGES</text>
  <text x="274" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#845F00">2 &#183; THE LOG</text>
  <text x="566" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#6D28D9">3 &#183; THE VERDICT</text>
  <line x1="46" y1="104" x2="218" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="274" y1="104" x2="510" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="566" y1="104" x2="754" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>

  <g>
    <rect x="46" y="118" width="172" height="42" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <rect x="46" y="168" width="172" height="42" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <rect x="46" y="218" width="172" height="42" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <rect x="46" y="268" width="172" height="42" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="58" y="136">S1 ask and say</text>
    <text x="58" y="153" font-size="12" fill="#55636F">test: it answers once</text>
    <text x="58" y="186">S2 two lists</text>
    <text x="58" y="203" font-size="12" fill="#55636F">test: 3 real questions</text>
    <text x="58" y="236">S3 the fallback</text>
    <text x="58" y="253" font-size="12" fill="#55636F">test: ask nonsense</text>
    <text x="58" y="286">S4 anti-repeat</text>
    <text x="58" y="303" font-size="12" fill="#55636F">test: 5 turns in a row</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="274" y="126">YOU TYPED</text>
    <text x="418" y="126">MATCH?</text>
    <text x="474" y="126">OK?</text>
  </g>
  <line x1="274" y1="134" x2="510" y2="134" stroke="#845F00" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="274" y="158">what toppings</text><text x="424" y="158">yes</text>
    <text x="274" y="186">how much is it</text><text x="424" y="186">yes</text>
    <text x="274" y="220">how do i open it</text><text x="424" y="220">yes</text>
    <text x="274" y="254">what is the moon</text><text x="424" y="254">no</text>
    <text x="274" y="282">... 6 more rows</text>
  </g>
  <g stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="476,154 483,161 496,145"/>
    <polyline points="476,182 483,189 496,173"/>
    <polyline points="476,250 483,257 496,241"/>
  </g>
  <g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round">
    <line x1="478" y1="210" x2="492" y2="224"/>
    <line x1="492" y1="210" x2="478" y2="224"/>
  </g>
  <text x="274" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Row 3 matched and was still wrong:</text>
  <text x="274" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#8220;open&#8221; is too short a trigger.</text>

  <rect x="566" y="118" width="188" height="86" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">THE RULE BOT</text>
  <text x="660" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">fails LOUDLY</text>
  <text x="660" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8220;I don't know that one.&#8221;</text>

  <rect x="566" y="216" width="188" height="86" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">THE BIGRAM GENERATOR</text>
  <text x="660" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">fails SILENTLY</text>
  <text x="660" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8220;amma takes the bus</text>
  <text x="660" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">to the market.&#8221;</text>

  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Zone 3 is the sentence to write down: annoying beats dangerous,</text>
  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">and you can only tell which you have if you know the insides.</text>
</svg>
