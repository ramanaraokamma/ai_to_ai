<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The five lines, in order, and the job of each</title>
  <desc>Five numbered boxes stacked with arrows between them. One, optimizer.zero_grad, wipes last step's slopes. Two, pred equals hours times w plus b, predicts with today's knobs. Three, loss equals the mean of pred minus marks squared, gives one number for how wrong: 1786.6666 at step 0. Four, loss.backward, gives one slope per knob: dL by dw is minus 326.6667. Five, optimizer.step, moves every knob: 0 minus 0.05 times minus 326.6667 is 16.3333. A closing panel says four needs three, three needs two, five needs four, and one must be first because four adds to what is already there.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The five lines, in order,</text>
  <text x="250" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">and the job of each</text>
  <rect x="36" y="92" width="428" height="78" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="68" cy="118" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="68" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="96" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">optimizer.zero_grad()</text>
  <text x="96" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">wipe last step's slopes off the whiteboard</text>
  <line x1="250" y1="170" x2="250" y2="184" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 184) rotate(90.0)"/>
  <rect x="36" y="188" width="428" height="78" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="68" cy="214" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="68" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="96" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">pred = hours @ w + b</text>
  <text x="96" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">predict, with today's knobs</text>
  <line x1="250" y1="266" x2="250" y2="280" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 280) rotate(90.0)"/>
  <rect x="36" y="284" width="428" height="78" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="68" cy="310" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="68" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="96" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">loss = ((pred &#8722; marks) ** 2).mean()</text>
  <text x="96" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">one number for how wrong: 1786.6666 at step 0</text>
  <line x1="250" y1="362" x2="250" y2="376" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 376) rotate(90.0)"/>
  <rect x="36" y="380" width="428" height="78" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="68" cy="406" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="68" y="406" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="96" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">loss.backward()</text>
  <text x="96" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">one slope per knob: dL/dw = &#8722;326.6667</text>
  <line x1="250" y1="458" x2="250" y2="472" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(250 472) rotate(90.0)"/>
  <rect x="36" y="476" width="428" height="78" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="68" cy="502" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="68" y="502" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="96" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">optimizer.step()</text>
  <text x="96" y="534" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">move every knob: 0 &#8722; 0.05 &#215; (&#8722;326.6667) = 16.3333</text>
  <rect x="36" y="588" width="428" height="88" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="612" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">The order is not a style choice.</text>
  <text x="250" y="636" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">4 needs 3. 3 needs 2. 5 needs 4. And 1 has to be first,</text>
  <text x="250" y="656" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">because 4 ADDS to what is already there.</text>
</svg>
