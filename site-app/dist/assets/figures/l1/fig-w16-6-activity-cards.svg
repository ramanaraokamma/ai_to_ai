<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The eight readout cards and one worked card</title>
  <desc>Eight small cards on the left, each showing three confidence numbers. On the right, card five is enlarged and worked through: bars for 45, 44 and 11, the winner named as class A, the margin worked out as 1, and the verdict do not trust.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Eight cards to read, one worked in full</text>

    <g>
      <rect x="40" y="76" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="50" y="94" font-size="12" fill="#55636F">#1</text>
      <text x="95" y="116" font-size="14" fill="#14202B" text-anchor="middle">97 / 2 / 1</text>

      <rect x="164" y="76" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="174" y="94" font-size="12" fill="#55636F">#2</text>
      <text x="219" y="116" font-size="14" fill="#14202B" text-anchor="middle">51 / 45 / 4</text>

      <rect x="40" y="140" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="50" y="158" font-size="12" fill="#55636F">#3</text>
      <text x="95" y="180" font-size="14" fill="#14202B" text-anchor="middle">40 / 33 / 27</text>

      <rect x="164" y="140" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="174" y="158" font-size="12" fill="#55636F">#4</text>
      <text x="219" y="180" font-size="14" fill="#14202B" text-anchor="middle">68 / 30 / 2</text>

      <rect x="40" y="204" width="110" height="52" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="50" y="222" font-size="12" fill="#55636F">#5</text>
      <text x="95" y="244" font-size="14" fill="#14202B" text-anchor="middle">45 / 44 / 11</text>

      <rect x="164" y="204" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="174" y="222" font-size="12" fill="#55636F">#6</text>
      <text x="219" y="244" font-size="14" fill="#14202B" text-anchor="middle">99 / 1 / 0</text>

      <rect x="40" y="268" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="50" y="286" font-size="12" fill="#55636F">#7</text>
      <text x="95" y="308" font-size="14" fill="#14202B" text-anchor="middle">34 / 33 / 33</text>

      <rect x="164" y="268" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="174" y="286" font-size="12" fill="#55636F">#8</text>
      <text x="219" y="308" font-size="14" fill="#14202B" text-anchor="middle">80 / 19 / 1</text>
    </g>

    <rect x="330" y="76" width="430" height="244" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="545" y="106" font-size="18" fill="#14202B" text-anchor="middle">Card #5 - worked</text>

    <rect x="430" y="124" width="117" height="24" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="430" y="156" width="114.4" height="24" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="430" y="188" width="28.6" height="24" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <g font-size="14" fill="#14202B" text-anchor="end">
      <text x="422" y="141">class A</text>
      <text x="422" y="173">class B</text>
      <text x="422" y="205">class C</text>
    </g>
    <g font-size="14" fill="#14202B">
      <text x="555" y="141">45%</text>
      <text x="553" y="173">44%</text>
      <text x="467" y="205">11%</text>
    </g>

    <g font-size="16" fill="#14202B">
      <text x="360" y="242">winner:  class A</text>
      <text x="360" y="268">margin:  45 - 44 = 1</text>
      <text x="360" y="294">call:  DO NOT TRUST - too close</text>
    </g>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Two of the eight are traps. Find them before you turn to the answer key.</text>
  </g>
</svg>
