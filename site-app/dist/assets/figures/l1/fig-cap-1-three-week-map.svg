  <rect x="310" y="166" width="200" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="410" y="186.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">M6  Bias + card + sign</text>
  <rect x="310" y="204" width="200" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="410" y="224.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">M7  Booth + rehearse</text>
  <text x="410" y="298.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you hold: a running ap</text>
  <text x="410" y="313.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">p + the printed signs</text>
  <line x1="528" y1="196" x2="576" y2="196" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="570,188 584,196 570,204" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="556" y="74" width="224" height="244" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="556" y="74" width="224" height="44" fill="#D9EAF9"/>
