<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The line walking into place</title>
  <desc>A scatter of 36 standardised delivery rows: circles for on time, triangles for late. Four straight decision boundaries are drawn over them. Line 1, at epoch 0 with weights 2.0 and minus 2.0 and bias 1.0, cuts steeply across the wrong way and its training loss is 2.0454. By line 2 at epoch 50 the loss is 0.3590, by line 3 at epoch 150 it is 0.3423, and line 4 at epoch 300 has a loss of 0.3416 and lies almost flat, separating most circles below from most triangles above. A note reads 2.0454 becomes 0.3416 in 300 small steps.</desc>
