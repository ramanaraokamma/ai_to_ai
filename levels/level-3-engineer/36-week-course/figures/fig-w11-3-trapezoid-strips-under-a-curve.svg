<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Area, added up in four strips</title>
  <desc>A five-point curve going up from 0.00, 0.00 through 0.25, 0.60 and 0.50, 0.80 and 0.75, 0.90 to 1.00, 1.00, with the space underneath divided into four shaded trapezoid strips numbered 1 to 4. Beside it each strip is worked out as left height plus right height, divided by two, times the width 0.25: strip 1 gives 0.0750, strip 2 gives 0.1750, strip 3 gives 0.2125 and strip 4 gives 0.2375. Added up, 0.0750 plus 0.1750 plus 0.2125 plus 0.2375 equals 0.7000, and np.trapz of the same numbers prints 0.7.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Area, added up in four strips</text>
  <polygon points="92,330 92,330 162,186 162,330" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="162,330 162,186 232,138 232,330" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="232,330 232,138 302,114 302,330" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="302,330 302,114 372,90 372,330" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="92,330 162,186 232,138 302,114 372,90" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="92" y1="76" x2="92" y2="330" stroke="#14202B" stroke-width="2"/>
  <line x1="92" y1="330" x2="386" y2="330" stroke="#14202B" stroke-width="2"/>
  <line x1="92" y1="330" x2="92" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="92" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="86" y1="330" x2="92" y2="330" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="232" y1="330" x2="232" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="232" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="86" y1="210" x2="92" y2="210" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <line x1="372" y1="330" x2="372" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="372" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="86" y1="90" x2="92" y2="90" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <circle cx="127" cy="308" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="127" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <circle cx="197" cy="308" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="197" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <circle cx="267" cy="308" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="267" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <circle cx="337" cy="308" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="337" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <circle cx="92" cy="330" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="162" cy="186" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="232" cy="138" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="302" cy="114" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="372" cy="90" r="5" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="232" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">false positive rate</text>
  <text x="48" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 48 210)">true positive rate</text>
  <rect x="410" y="78" width="370" height="216" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="432" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">each strip: (left + right) &#247; 2 &#215; width</text>
  <circle cx="438" cy="126" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="438" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="462" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">(0.00 + 0.60) &#247; 2 &#215; 0.25 = 0.0750</text>
  <circle cx="438" cy="156" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="438" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="462" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">(0.60 + 0.80) &#247; 2 &#215; 0.25 = 0.1750</text>
  <circle cx="438" cy="186" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="438" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="462" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">(0.80 + 0.90) &#247; 2 &#215; 0.25 = 0.2125</text>
  <circle cx="438" cy="216" r="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="438" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="462" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">(0.90 + 1.00) &#247; 2 &#215; 0.25 = 0.2375</text>
  <line x1="432" y1="254" x2="762" y2="254" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="438" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B">0.0750 + 0.1750 + 0.2125 + 0.2375 = 0.7000</text>
  <text x="595" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">np.trapz(ys, xs) prints 0.7</text>
  <text x="595" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">The hand and the machine agree.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four strips. Four averages. Four multiplications. One area.</text>
</svg>
