<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A rulebook is a ladder with a default at the bottom</title>
  <desc>An input card reading Thursday 4 millimetres falls down a ladder of rules. Rule 1 does not match, rule 2 matches and stops, so the default at the bottom is never reached. The answer is late.</desc>
  <text x="250" y="42" font-size="24" fill="#14202B" text-anchor="middle">A rulebook is a ladder</text>

  <g stroke="#14202B" stroke-width="2" fill="none">
    <path d="M250 132 V156"/>
    <path d="M250 242 V266"/>
  </g>
  <polyline points="244,148 250,158 256,148" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="244,258 250,268 256,258" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M90 306 H50 V520 H158" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="150,514 162,520 150,526" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="140" y="76" width="220" height="56" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="100" font-size="14" fill="#55636F" text-anchor="middle">new day to judge</text>
  <text x="250" y="122" font-size="18" fill="#14202B" text-anchor="middle">Thursday, rain 4 mm</text>

  <rect x="90" y="156" width="320" height="72" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="110" y="184" font-size="14" fill="#55636F">RULE 1</text>
  <text x="110" y="210" font-size="18" fill="#14202B">IF day = Monday</text>
  <text x="330" y="210" font-size="18" fill="#14202B" text-anchor="end">LATE</text>
  <g transform="translate(418,174) scale(0.3)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="424" y="240" font-size="12" fill="#55636F">no match</text>

  <rect x="90" y="266" width="320" height="72" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="110" y="294" font-size="14" fill="#55636F">RULE 2</text>
  <text x="110" y="320" font-size="18" fill="#14202B">IF rain_mm &gt;= 3</text>
  <text x="330" y="320" font-size="18" fill="#14202B" text-anchor="end">LATE</text>
  <g transform="translate(418,284) scale(0.3)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="420" y="350" font-size="12" fill="#1B7A4B">MATCH</text>

  <rect x="90" y="376" width="320" height="72" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/>
  <text x="110" y="404" font-size="14" fill="#55636F">DEFAULT</text>
  <text x="110" y="430" font-size="18" fill="#55636F">OTHERWISE</text>
  <text x="330" y="430" font-size="18" fill="#55636F" text-anchor="end">ON TIME</text>
  <text x="250" y="470" font-size="14" fill="#55636F" text-anchor="middle">never reached this time - but it must exist</text>

  <rect x="162" y="492" width="200" height="58" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="262" y="528" font-size="20" fill="#14202B" text-anchor="middle">Answer: LATE</text>

  <text x="250" y="596" font-size="18" fill="#14202B" text-anchor="middle">FIRST MATCH WINS</text>
  <text x="250" y="622" font-size="14" fill="#55636F" text-anchor="middle">Check top to bottom. The first rule that fires decides.</text>
  <text x="250" y="642" font-size="14" fill="#55636F" text-anchor="middle">Every rule below it is skipped, even if it disagrees.</text>
  <text x="250" y="672" font-size="14" fill="#55636F" text-anchor="middle">Without a default, the rulebook would have no answer at all.</text>
</svg>
