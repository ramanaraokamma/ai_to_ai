<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's three words, drawn</title>
  <desc>Three icon panels. Attribution is a photo with a signed note saying who took it and when. Misinformation is a message passed on by someone who believes it. Disinformation is the same message sent on purpose by someone who knows it is false.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's three words</text>
  <g fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5">
    <rect x="40" y="72" width="226" height="196" rx="10"/>
    <rect x="287" y="72" width="226" height="196" rx="10"/>
    <rect x="534" y="72" width="226" height="196" rx="10"/>
  </g>
  <rect x="70" y="100" width="94" height="80" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="78" y="108" width="78" height="58" rx="4" fill="#D9EAF9" stroke="none"/>
  <circle cx="98" cy="126" r="7" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M78 166 L104 144 L120 158 L134 146 L156 166 Z" fill="#1F6FB2" stroke="none"/>
  <path d="M172 112 H244 V182 L228 198 H172 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M228 198 V182 H244 Z" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
    <text x="182" y="134">taken by me</text>
    <text x="182" y="152">14 March</text>
    <text x="182" y="170">my own spoon</text>
  </g>
  <text x="118" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a photo</text>
  <g transform="translate(306,96) scale(0.72)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="378" y1="140" x2="418" y2="140" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="410,132 426,140 410,148" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="432" y="112" width="66" height="56" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="465" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#CC2B1D" text-anchor="middle">?</text>
  <text x="400" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">She thinks it is true.</text>
  <text x="400" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">It is not. She passes it on.</text>
  <g transform="translate(553,96) scale(0.72)">
    <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="50" r="4" fill="#14202B"/>
    <circle cx="60" cy="50" r="4" fill="#14202B"/>
    <path d="M39 66 Q50 60 61 66" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="625" y1="140" x2="665" y2="140" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="657,132 673,140 657,148" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="679" y="112" width="66" height="56" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="712" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#CC2B1D" text-anchor="middle">!</text>
  <text x="647" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">He knows it is false.</text>
  <text x="647" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">He sends it anyway.</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="153" y="298">attribution</text>
    <text x="400" y="298">misinformation</text>
    <text x="647" y="298">disinformation</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="153" y="324">Saying where it came from</text>
    <text x="153" y="342">and who made it</text>
    <text x="400" y="324">False information spreading,</text>
    <text x="400" y="342">whether or not anyone meant it</text>
    <text x="647" y="324">False information spread</text>
    <text x="647" y="342">on purpose</text>
  </g>
</svg>
