<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six words from Week 1, drawn</title>
  <desc>Six labelled tiles. Unit of prediction: three ticked rows reading one order 2020, one restaurant-day 35, one restaurant 5, labelled a decision and not a fact. Target y: a row of six 0 and 1 boxes with the 1s filled amber, and 0.2881 of rows are 1, labelled the one column with the answer in it. Features X: a blue block holding 8 columns beside two crossed-out chips late and order_id, with the arithmetic ten minus one target minus one ID equals 8, labelled only what exists at order time. Data audit: four ticked lines, duplicate rows 20, ID fraction 0.9901, empty cells 108, class balance 0.7119, labelled same four questions every table. ID column: a pink block reading 2000 different over 2020 rows equals 0.9901, above 0.95, labelled names the row and describes nothing. Class balance: a long blue bar of 0.7119 above a short amber bar of 0.2881, with 1438 not late and 582 late, labelled so never late is right 71.19 percent.</desc>
