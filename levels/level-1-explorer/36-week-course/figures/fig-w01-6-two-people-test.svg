<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The two-people test</title>
  <desc>Two panels. On the left, two people asked how many chairs are in the room both answer four, so the job is not judgement. On the right, two people asked whether the room is tidy give different answers, so the job is judgement.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">The two-people test</text>
    <line x1="400" y1="70" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="30" y="70" width="340" height="255" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <rect x="430" y="70" width="340" height="255" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>

    <rect x="55" y="88" width="290" height="46" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <text x="200" y="111" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">How many chairs are here?</text>
    <g transform="translate(80,150) scale(0.7)">
      <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="50" r="4" fill="#14202B"/>
      <circle cx="60" cy="50" r="4" fill="#14202B"/>
      <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(230,150) scale(0.7)">
      <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="50" r="4" fill="#14202B"/>
      <circle cx="60" cy="50" r="4" fill="#14202B"/>
      <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="115" y="238" font-size="12" fill="#55636F" text-anchor="middle">Person A</text>
    <text x="265" y="238" font-size="12" fill="#55636F" text-anchor="middle">Person B</text>
    <rect x="85" y="248" width="60" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
    <text x="115" y="265" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    <rect x="235" y="248" width="60" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
    <text x="265" y="265" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    <text x="190" y="265" font-size="30" fill="#14202B" text-anchor="middle" dominant-baseline="central">=</text>
    <text x="200" y="306" font-size="16" fill="#14202B" text-anchor="middle">Same answer, so NOT judgement</text>

    <rect x="455" y="88" width="290" height="46" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <text x="600" y="111" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">Is this room tidy?</text>
    <g transform="translate(480,150) scale(0.7)">
      <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="50" r="4" fill="#14202B"/>
      <circle cx="60" cy="50" r="4" fill="#14202B"/>
      <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(630,150) scale(0.7)">
      <circle cx="50" cy="52" r="30" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <path d="M20 44 A30 30 0 0 1 80 44 A34 22 0 0 0 20 44 Z" fill="#845F00" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="40" cy="50" r="4" fill="#14202B"/>
      <circle cx="60" cy="50" r="4" fill="#14202B"/>
      <path d="M39 63 Q50 72 61 63" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="515" y="238" font-size="12" fill="#55636F" text-anchor="middle">Person A</text>
    <text x="665" y="238" font-size="12" fill="#55636F" text-anchor="middle">Person B</text>
    <rect x="485" y="248" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
    <text x="515" y="265" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">Yes</text>
    <rect x="635" y="248" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
    <text x="665" y="265" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">No</text>
    <text x="590" y="265" font-size="30" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8800;</text>
    <text x="600" y="306" font-size="16" fill="#14202B" text-anchor="middle">Different answers, so JUDGEMENT</text>

    <text x="400" y="362" font-size="14" fill="#55636F" text-anchor="middle">If two sensible people can disagree, the job needs judgement. Most AI jobs are like this.</text>
  </g>
</svg>
