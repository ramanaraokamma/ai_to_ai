  <text x="144" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">logits</text>
  <text x="144" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">raw scores, one per class</text>
  <rect x="302" y="76" width="50" height="30" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="327" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8722;10.94</text>
