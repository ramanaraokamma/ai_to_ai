<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw both rulers on one picture</title>
  <desc>A large empty frame with the chance you gave the thing that happened running from 0 to 1 along the bottom and the cost running from 0 to 4 up the side, with a dashed grey line drawn across at a cost of 1 to mark the squared error ceiling, for the learner to plot two curves into. A panel underneath lists what a good answer contains: the four hand computed log loss points at 0.9 comma 0.105, 0.5 comma 0.693, 0.1 comma 2.303 and 0.02 comma 3.912, a curve through them that climbs off the top of the frame on the left, the matching squared error points at 0.9 comma 0.010, 0.5 comma 0.250, 0.1 comma 0.810 and 0.02 comma 0.960, a second curve that flattens against the dashed ceiling, the single point p equals 1 where both curves reach zero and agree, and the two ratios 4.27 and 2.67 written beside the p equals 0.02 end.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw both rulers on one picture</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Chance you gave along the bottom &#183; what it costs up the side</text>

  <rect x="30" y="86" width="440" height="360" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="86" y1="406" x2="440" y2="406" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="406" x2="86" y2="116" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="334" x2="440" y2="334" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="448" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">cost = 1</text>
  <text x="78" y="410" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="78" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <text x="78" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">2</text>
  <text x="78" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">3</text>
  <text x="78" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">4</text>
  <text x="86" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="174" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.25</text>
  <text x="263" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <text x="351" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.75</text>
  <text x="440" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="263" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">p, the chance you gave what happened</text>

  <rect x="30" y="460" width="440" height="216" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; log loss: 0.9&#8594;0.105  0.5&#8594;0.693  0.1&#8594;2.303  0.02&#8594;3.912</text>
  <text x="48" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; a curve through them, leaving the frame at the top left</text>
  <text x="48" y="554" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; squared error: 0.9&#8594;0.010  0.5&#8594;0.250  0.1&#8594;0.810  0.02&#8594;0.960</text>
  <text x="48" y="576" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; a second curve flattening onto the dashed line</text>
  <text x="48" y="598" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; both curves at 0 where p = 1: a perfect call costs nothing</text>
  <text x="48" y="620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; p = 1 ringed: the only place both rulers agree, both 0</text>
  <text x="48" y="642" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the ratios 4.27 and 2.67 written in at the p = 0.02 end</text>
  <text x="48" y="664" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#183; and the word &#8220;ceiling&#8221; with an arrow at the dashed line</text>
</svg>
