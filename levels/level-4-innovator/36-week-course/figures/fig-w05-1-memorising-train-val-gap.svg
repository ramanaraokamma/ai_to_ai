  <text x="82" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="90" y1="206" x2="560" y2="206" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <line x1="90" y1="96" x2="560" y2="96" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <line x1="90" y1="163.5" x2="560" y2="163.5" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
