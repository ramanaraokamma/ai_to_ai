<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One neuron: multiply, add, squash</title>
  <desc>Three input circles holding 2.0, 1.0 and 0.5 feed a node labelled add along wires labelled times 0.4, times minus 0.7 and times 1.2, with a bias of minus 0.5 arriving from below. The sum, 0.20, passes into a box labelled ReLU and out to an output circle holding 0.20. A panel on the right works it out: 2.0 times 0.4 is 0.8, 1.0 times minus 0.7 is minus 0.7, 0.5 times 1.2 is 0.6, the bias is minus 0.5, and 0.8 minus 0.7 plus 0.6 minus 0.5 gives 0.20.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One neuron: multiply, add, squash</text>
  <line x1="96" y1="110" x2="208" y2="168" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="178" x2="208" y2="182" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="246" x2="208" y2="196" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="78" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">inputs</text>
  <circle cx="78" cy="110" r="22" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="78" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.0</text>
  <circle cx="78" cy="178" r="22" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="78" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.0</text>
  <circle cx="78" cy="246" r="22" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="78" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.5</text>
  <text x="96" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">distance, storm, prep</text>
  <text x="152" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle">&#215; 0.4</text>
  <text x="152" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle">&#215; &#8722;0.7</text>
  <text x="152" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle">&#215; 1.2</text>
  <text x="152" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">weights</text>
  <circle cx="240" cy="182" r="30" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
  <text x="240" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">add</text>
  <text x="240" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">weighted sum</text>
  <line x1="240" y1="260" x2="240" y2="216" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(240 216) rotate(-90.0)"/>
  <text x="240" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">bias &#8722;0.5</text>
  <line x1="272" y1="182" x2="320" y2="182" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(320 182) rotate(0.0)"/>
  <text x="296" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">z = 0.20</text>
  <text x="296" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pre-activation</text>
  <rect x="322" y="154" width="88" height="58" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="366" y="183" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ReLU</text>
  <text x="366" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the squash</text>
  <line x1="412" y1="182" x2="456" y2="182" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(456 182) rotate(0.0)"/>
  <circle cx="482" cy="182" r="24" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="482" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.20</text>
  <text x="482" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">activation a</text>
  <text x="482" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what the unit says</text>
  <rect x="540" y="104" width="240" height="176" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="662" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the whole neuron, in numbers</text>
  <line x1="556" y1="142" x2="768" y2="142" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="556" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2.0 &#215; 0.4 &#160;= &#160;0.8</text>
  <text x="556" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">1.0 &#215; &#8722;0.7 = &#8722;0.7</text>
  <text x="556" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.5 &#215; 1.2 &#160;= &#160;0.6</text>
  <text x="556" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the bias &#160;&#160;&#160;&#160;= &#8722;0.5</text>
  <line x1="556" y1="250" x2="768" y2="250" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="556" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">0.8 &#8722; 0.7 + 0.6 &#8722; 0.5 = 0.20</text>
  <text x="400" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three multiplications, three additions, one squash. That is the whole unit.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">ReLU keeps a positive number as it is: max(0, 0.20) = 0.20.</text>
</svg>
