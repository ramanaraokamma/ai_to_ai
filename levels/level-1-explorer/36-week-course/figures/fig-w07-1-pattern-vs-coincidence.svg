<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Pattern or coincidence?</title>
  <desc>Two tally panels. On the left, four out of four Mondays are marked late, and the verdict is yes, worth betting on. On the right, one out of four Fridays is late, and the verdict is no.</desc>
  <text x="400" y="44" font-size="24" fill="#14202B" text-anchor="middle">Pattern or coincidence?</text>

  <rect x="40" y="70" width="340" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="420" y="70" width="340" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <text x="210" y="100" font-size="18" fill="#14202B" text-anchor="middle">The four Mondays</text>
  <text x="590" y="100" font-size="18" fill="#14202B" text-anchor="middle">The four Fridays</text>

  <rect x="70" y="118" width="60" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="140" y="118" width="60" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="210" y="118" width="60" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="280" y="118" width="60" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="100" y="153" font-size="12" fill="#14202B" text-anchor="middle">late</text>
  <text x="170" y="153" font-size="12" fill="#14202B" text-anchor="middle">late</text>
  <text x="240" y="153" font-size="12" fill="#14202B" text-anchor="middle">late</text>
  <text x="310" y="153" font-size="12" fill="#14202B" text-anchor="middle">late</text>

  <rect x="450" y="118" width="60" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="520" y="118" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <rect x="590" y="118" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <rect x="660" y="118" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="480" y="153" font-size="12" fill="#14202B" text-anchor="middle">late</text>
  <text x="550" y="153" font-size="12" fill="#55636F" text-anchor="middle">on time</text>
  <text x="620" y="153" font-size="12" fill="#55636F" text-anchor="middle">on time</text>
  <text x="690" y="153" font-size="12" fill="#55636F" text-anchor="middle">on time</text>

  <text x="210" y="214" font-size="24" fill="#14202B" text-anchor="middle">4 out of 4 late</text>
  <text x="590" y="214" font-size="24" fill="#14202B" text-anchor="middle">1 out of 4 late</text>

  <g transform="translate(88,236) scale(0.44)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="144" y="256" font-size="16" fill="#14202B">Worth betting on?</text>
  <text x="144" y="278" font-size="16" fill="#1B7A4B">YES. Bet "late".</text>

  <g transform="translate(468,236) scale(0.44)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="524" y="256" font-size="16" fill="#14202B">Worth betting on?</text>
  <text x="524" y="278" font-size="16" fill="#CC2B1D">NO. That is noise.</text>

  <text x="400" y="356" font-size="14" fill="#55636F" text-anchor="middle">A pattern has to beat guessing. One out of four does not beat anything.</text>
</svg>
