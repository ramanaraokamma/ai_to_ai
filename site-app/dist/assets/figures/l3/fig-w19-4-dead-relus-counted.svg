  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"><line x1="177" y1="115" x2="191" y2="129"/><line x1="191" y1="115" x2="177" y2="129"/></g>
  <text x="162" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">2</text>
