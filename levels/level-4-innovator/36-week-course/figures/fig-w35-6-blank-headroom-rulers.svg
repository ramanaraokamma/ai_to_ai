<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank rulers: mark each promise's headroom and say whether it was kept</title>
  <desc>Four horizontal rulers from 0 to 2.5, one each for mean cost under $0.001, worst task under $0.003, score at least 0.70 and refusals right at least 5 of 6. A dashed vertical line at 1.0 marks the promise. At the right of each ruler is an empty box for the words kept or MISSED. No ruler is marked.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Mark your headroom on each ruler</text>
  <line x1="460" y1="92" x2="460" y2="312" stroke="#14202B" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="460" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">promise = 1.0</text>
  <text x="24" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">mean cost, under $0.001</text>
  <line x1="300" y1="122" x2="700" y2="122" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="116" x2="300" y2="128" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="380" y1="116" x2="380" y2="128" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="116" x2="460" y2="128" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="540" y1="116" x2="540" y2="128" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="116" x2="620" y2="128" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="700" y1="116" x2="700" y2="128" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="692" y="108" width="84" height="28" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="734" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">kept / MISSED</text>
  <text x="24" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">worst task, under $0.003</text>
  <line x1="300" y1="176" x2="700" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="170" x2="300" y2="182" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="380" y1="170" x2="380" y2="182" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="170" x2="460" y2="182" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="540" y1="170" x2="540" y2="182" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="170" x2="620" y2="182" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="700" y1="170" x2="700" y2="182" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="692" y="162" width="84" height="28" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="734" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">kept / MISSED</text>
  <text x="24" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">score, at least 0.70</text>
  <line x1="300" y1="230" x2="700" y2="230" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="224" x2="300" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="380" y1="224" x2="380" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="224" x2="460" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="540" y1="224" x2="540" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="224" x2="620" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="700" y1="224" x2="700" y2="236" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="692" y="216" width="84" height="28" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="734" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">kept / MISSED</text>
  <text x="24" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">refusals right, at least 5 of 6</text>
  <line x1="300" y1="284" x2="700" y2="284" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="278" x2="300" y2="290" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="380" y1="278" x2="380" y2="290" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="278" x2="460" y2="290" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="540" y1="278" x2="540" y2="290" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="278" x2="620" y2="290" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="700" y1="278" x2="700" y2="290" stroke="#14202B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="692" y="270" width="84" height="28" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="734" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">kept / MISSED</text>
  <text x="300" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="380" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <text x="460" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1.0</text>
  <text x="540" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1.5</text>
  <text x="620" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="700" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2.5</text>
  <text x="500" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">headroom</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Mark each headroom from Part A with a cross; write kept or MISSED in the box.</text>
</svg>
