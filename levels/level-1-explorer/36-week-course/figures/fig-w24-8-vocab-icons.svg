<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four new words of Week 24</title>
  <desc>Four picture tiles. RGB is three coloured lamps labelled R, G and B. A channel is one of three stacked grids. Downsampling is a two by two block of four numbers becoming one number, eighty. Anti-aliasing is a diagonal line crossing a grid, leaving grey in-between numbers along it.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The four new words of Week 24</text><rect x="40" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/><rect x="225" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><rect x="410" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/><rect x="595" y="76" width="165" height="220" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/><circle cx="62" cy="140" r="20" fill="#FF0000" stroke="#14202B" stroke-width="2"/><text x="62" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">R</text><circle cx="104" cy="140" r="20" fill="#00CC00" stroke="#14202B" stroke-width="2"/><text x="104" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">G</text><circle cx="146" cy="140" r="20" fill="#0000FF" stroke="#14202B" stroke-width="2"/><text x="146" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">B</text><text x="122" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">three numbers,</text><text x="122" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">every pixel</text><rect x="275" y="112" width="78" height="62" rx="4" fill="#F5F8FA" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/><rect x="265" y="124" width="78" height="62" rx="4" fill="#F5F8FA" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/><rect x="255" y="136" width="78" height="62" rx="4" fill="#F5F8FA" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/><text x="294" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0-255</text><text x="307" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one of the three</text><text x="307" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">grids on its own</text><rect x="430" y="118" width="26" height="26" fill="#8A9095" stroke="#C7CDD4" stroke-width="1"/><text x="443.0" y="134.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">128</text><rect x="456" y="118" width="26" height="26" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="469.0" y="134.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">0</text><rect x="430" y="144" width="26" height="26" fill="#C5C8CB" stroke="#C7CDD4" stroke-width="1"/><text x="443.0" y="160.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">192</text><rect x="456" y="144" width="26" height="26" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="469.0" y="160.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">0</text><rect x="430" y="118" width="52" height="52" fill="none" stroke="#14202B" stroke-width="3"/><line x1="490" y1="144" x2="514" y2="144" stroke="#C42B8C" stroke-width="2.5" stroke-linecap="round"/><poly