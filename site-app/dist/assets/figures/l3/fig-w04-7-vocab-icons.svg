<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five words from Week 4, drawn</title>
  <desc>Six labelled tiles. Standardization: a number line centred on 0 with four dots left of centre and one far right, and the sum 8 minus 24 divided by 38.0526 equals minus 0.4205. Min-max scaling: a 0 to 1 line with four dots crammed at the left and one at 1, with the note that four values sit inside 0.0612. One-hot encoding: the word Napoli becoming the five digits 0, 0, 1, 0, 0 with the 1 in green, one column becoming five. Ordinal encoding: clear equals 0, rain equals 1, storm equals 2, with the two real gaps 0.1056 and 0.1853 showing the steps are not equal. Cardinality: restaurant 5, day_of_week 7, weather 3, and 5 plus 7 plus 3 equals 15 new columns. The rule for both rulers: fit sees training rows only, transform is applied to everything, mean_ 24.0 and scale_ 38.0526.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five words from Week 4, drawn</text>
  <rect x="20" y="60" width="240" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="36" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">standardization</text>
  <line x1="40" y1="134" x2="240" y2="134" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="107" y1="128" x2="107" y2="140" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="107" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <circle cx="68.3" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="71.8" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="75.3" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="78.8" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="240.8" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="36" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">(8 &#8722; 24) &#247; 38.0526</text>
  <text x="36" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">= &#8722;0.4205 typical steps</text>
  <rect x="280" y="60" width="240" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="296" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">min-max scaling</text>
  <line x1="300" y1="134" x2="500" y2="134" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300.0" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="304.1" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="308.2" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="312.2" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="500.0" cy="134" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="300" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="500" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="296" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">smallest &#8594; 0, biggest &#8594; 1</text>
  <text x="296" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="start">four values inside 0.0612</text>
  <rect x="540" y="60" width="240" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="556" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">one-hot encoding</text>
  <rect x="556" y="106" width="84" height="26" rx="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="598" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Napoli</text>
  <line x1="644" y1="119" x2="657" y2="119" stroke="#14202B" stroke-width="2" stroke-linecap="round"/><polyline points="655,113 664,119 655,125" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
