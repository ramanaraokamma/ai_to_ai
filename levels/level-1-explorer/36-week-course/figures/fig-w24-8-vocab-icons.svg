ght="26" fill="#8A9095" stroke="#C7CDD4" stroke-width="1"/><text x="664.0" y="154.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">128</text><rect x="677" y="138" width="26" height="26" fill="#C5C8CB" stroke="#C7CDD4" stroke-width="1"/><text x="690.0" y="154.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">192</text><rect x="625" y="164" width="26" height="26" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="638.0" y="180.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">255</text><rect x="651" y="164" width="26" height="26" fill="#C5C8CB" stroke="#C7CDD4" stroke-width="1"/><text x="664.0" y="180.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">192</text><rect x="677" y="164" width="26" height="26" fill="#8A9095" stroke="#C7CDD4" stroke-width="1"/><text x="690.0" y="180.85" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">128</text><rect x="625" y="112" width="78" height="78" fill="none" stroke="#14202B" stroke-width="3"/><path d="M621 194 L707 108" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/><text x="677" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the honest greys</text><text x="677" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">along an edge</text><text x="122.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">RGB</text><text x="307.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">channel</text><text x="492.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">downsampling</text><text x="677.5" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">anti-aliasing</text><text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three of these four are about storing a picture. The third one is about throwing part of it away.</text>
