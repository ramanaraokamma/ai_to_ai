<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Anatomy of an if-then rule</title>
  <desc>One rule written out: IF rain_mm is 3 or more THEN predict late. An arrow above points to the number 3 and labels it the threshold. A bracket under the middle labels it the condition, and a bracket under the end labels it the action.</desc>
  <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Anatomy of an if-then rule</text>

  <line x1="292" y1="98" x2="292" y2="140" stroke="#C42B8C" stroke-width="2"/>
  <polyline points="286,132 292,142 298,132" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="292" y="80" font-size="18" fill="#14202B" text-anchor="middle">THRESHOLD</text>
  <text x="292" y="98" font-size="14" fill="#55636F" text-anchor="middle">the cut-off number you chose</text>

  <rect x="90" y="150" width="620" height="72" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="120" y="196" font-size="24" fill="#55636F">IF</text>
  <text x="165" y="196" font-size="24" fill="#1F6FB2">rain_mm &gt;= 3</text>
  <text x="345" y="196" font-size="24" fill="#55636F">THEN</text>
  <text x="425" y="196" font-size="24" fill="#1B7A4B">predict "late"</text>

  <path d="M165 236 V250 H330 V236" fill="none" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="248" y1="250" x2="248" y2="266" stroke="#14202B" stroke-width="2"/>
  <text x="248" y="288" font-size="18" fill="#14202B" text-anchor="middle">CONDITION</text>
  <text x="248" y="310" font-size="14" fill="#55636F" text-anchor="middle">the part a machine can test</text>
  <text x="248" y="330" font-size="14" fill="#55636F" text-anchor="middle">and always get the same answer</text>

  <path d="M425 236 V250 H600 V236" fill="none" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="512" y1="250" x2="512" y2="266" stroke="#14202B" stroke-width="2"/>
  <text x="512" y="288" font-size="18" fill="#14202B" text-anchor="middle">ACTION</text>
  <text x="512" y="310" font-size="14" fill="#55636F" text-anchor="middle">the answer the rule gives</text>
  <text x="512" y="330" font-size="14" fill="#55636F" text-anchor="middle">when the condition is true</text>

  <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">No adjectives allowed. "Rainy" is an opinion; "rain_mm &gt;= 3" is a condition.</text>
</svg>
