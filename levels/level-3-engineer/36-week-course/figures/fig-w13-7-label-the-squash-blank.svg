<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the squash, both ways</title>
  <desc>Eight numbered rows with an empty dashed pink box at the end of each, walking one raw score forwards into a chance and one chance backwards into a raw score. Rows 1 to 4 take z equals 1.4 forwards: e to the minus 1.4, then add 1, then 1 divided by that, then whether the answer is at or above one half. Rows 5 to 8 take p equals 0.90 backwards: 0.90 divided by 0.10 to get the odds, then the natural logarithm of the odds, then e to the minus that number, then 1 divided by 1 plus it. The answers are 0.246597, 1.246597, 0.8022, yes, 9.000000, 2.197225, 0.111111 and 0.900000. A panel at the bottom asks for the shape of the eight raw scores, the exact value of sigmoid of zero, and which of the eight boxes hold a probability.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the squash, both ways</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Rows 1&#8211;4 go forwards from z = 1.4 &#183; rows 5&#8211;8 back from p = 0.90</text>

  <rect x="30" y="84" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="111" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="56" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">e^(&#8722;1.4) =</text>
  <rect x="330" y="97" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="144" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="171" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="56" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1 + row 1 =</text>
  <rect x="330" y="157" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="204" width="440" height="54" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="231" r="13" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="56" y="231" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1 &#247; row 2 = p =</text>
  <rect x="330" y="217" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="264" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="291" r="13" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  <text x="56" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">row 3 &#8805; 0.5, so late? =</text>
  <rect x="330" y="277" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="324" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="351" r="13" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="56" y="351" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">odds = 0.90 &#247; 0.10 =</text>
  <rect x="330" y="337" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="384" width="440" height="54" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="411" r="13" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3"/>
  <text x="56" y="411" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="80" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">z = ln(row 5) =</text>
  <rect x="330" y="397" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="444" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="471" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="56" y="471" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
  <text x="80" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">check: e^(&#8722;row 6) =</text>
  <rect x="330" y="457" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="504" width="440" height="54" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="531" r="13" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
  <text x="56" y="531" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="80" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">1 &#247; (1 + row 7) =</text>
  <rect x="330" y="517" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="574" width="440" height="102" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">One shape, one exact number, one count</text>
  <text x="48" y="626" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">z for the eight orders: z.shape = ____________</text>
  <text x="48" y="648" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">sigmoid(0) = ____________ &#183; exactly, or roughly? ____________</text>
  <text x="48" y="668" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">How many of your eight boxes could be a probability? ______</text>
</svg>
