<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Per-field counts for the three prompts against the stand-in add up to 16, 22 and 30 of 32 boxes</title>
  <desc>A dashed panel marked stand-in, not a model. Three rows of squares, eight squares per cell, filled for each message right. Columns category, urgency, order_id, refund_requested. v1: 6, 3, 4, 3, which adds to 16 of 32, 50.0 percent. v2: 6, 5, 7, 4, which adds to 22 of 32, 68.8 percent. v3: 8, 6, 8, 8, which adds to 30 of 32, 93.8 percent. The constant-answer floor is 14 of 32, 43.8 percent. Seed 0.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Which boxes each prompt got right (out of 8 messages)</text>
