  <circle cx="82.0" cy="112" r="15" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <text x="82.0" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
