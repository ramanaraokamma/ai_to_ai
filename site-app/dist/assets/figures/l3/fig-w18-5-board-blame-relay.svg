<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The finished board: Blame Relay and Term 2 circuit</title>
  <desc>Along the top a chain of three stages: w equals 2 goes through stage 1, z equals 3w plus 1, giving z equals 7; through stage 2, u equals z times z, giving u equals 49; through stage 3, L equals u divided by 7, giving L equals 7. Under each stage its measured slope: 3, then 14, then 0.142857. A pink box multiplies them: 3 times 14 times 0.142857 equals 6.000000. A green box measures straight through: 0.012 divided by 0.002 equals 6.000000, the same number. Along the bottom, five review stations with their answers: the slope of w minus 4 all squared at w equals 1 is minus 6; the sigmoid of 1.4 is 0.8022; the log loss of 0.8022 is 0.2204 when y is 1 and 1.6204 when y is 0; one gradient step from w equals 3 with slope 6 and learning rate 0.1 gives 2.4 and the loss falls from 9.00 to 5.76; and a 4 by 2 grid times a 2 by 3 grid gives 4 by 3.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The finished board: Blame Relay and Term 2 circuit</text>
  <text x="400" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">measure each stage, multiply &#8212; then measure the whole thing and check you got the same answer</text>

  <line x1="78" y1="112" x2="92" y2="112" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(92 112)"/>
  <line x1="192" y1="112" x2="210" y2="112" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(210 112)"/>
  <line x1="256" y1="112" x2="270" y2="112" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(270 112)"/>
  <line x1="370" y1="112" x2="388" y2="112" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(388 112)"/>
  <line x1="434" y1="112" x2="448" y2="112" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(448 112)"/>
  <line x1="548" y1="112" x2="562" y2="112" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(562 112)"/>

  <circle cx="56" cy="112" r="22" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="56" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">w = 2</text>
  <rect x="96" y="90" width="96" height="44" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="144" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">stage 1</text>
  <text x="144" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">z = 3w + 1</text>
  <circle cx="234" cy="112" r="22" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="234" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">z = 7</text>
  <rect x="274" y="90" width="96" height="44" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="322" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">stage 2</text>
  <text x="322" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">u = z &#215; z</text>
  <circle cx="412" cy="112" r="22" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="412" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">u = 49</text>
  <rect x="452" y="90" width="96" height="44" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="500" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">stage 3</text>
  <text x="500" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">L = u &#247; 7</text>
  <circle cx="590" cy="112" r="26" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="590" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">L = 7</text>

  <rect x="628" y="86" width="152" height="96" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="704" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the same nudge</text>
  <text x="704" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">everywhere:</text>
  <text x="704" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="middle">h = 0.001</text>
  <text x="704" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">up once, down once</text>

  <rect x="89" y="146" width="110" height="36" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="144" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">slope = 3</text>
  <rect x="267" y="146" width="110" height="36" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="322" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">slope = 14</text>
  <rect x="445" y="146" width="110" height="36" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="500" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">slope = 0.1429</text>

  <rect x="20" y="192" width="330" height="52" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="185" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">multiply the three stage slopes</text>
  <text x="185" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">3 &#215; 14 &#215; 0.1429 = 6.000000</text>
  <text x="373" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">=</text>
  <rect x="396" y="192" width="384" height="52" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="588" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">or ignore the middle and measure w against L directly</text>
  <text x="588" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.012 &#247; 0.002 = 6.000000</text>

  <text x="20" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">The Term 2 circuit, five stations, five minutes each &#8212; every answer checked on a calculator</text>

  <rect x="20" y="266" width="144" height="114" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="92" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">1 &#183; slope</text>
  <text x="92" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">(w&#8722;4) squared</text>
  <text x="92" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">at w = 1</text>
  <text x="92" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">&#8722;0.012 &#247; 0.002</text>
  <text x="92" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="middle">= &#8722;6</text>

  <rect x="174" y="266" width="144" height="114" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="246" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">2 &#183; sigmoid</text>
  <text x="246" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">z = 1.4</text>
  <text x="246" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">e&#8722;1.4 = 0.2466</text>
  <text x="246" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">1 &#247; 1.2466</text>
  <text x="246" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="middle">= 0.8022</text>

  <rect x="328" y="266" width="144" height="114" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">3 &#183; log loss</text>
  <text x="400" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">p = 0.8022</text>
  <text x="400" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B" text-anchor="middle">y = 1: 0.2204</text>
  <text x="400" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" text-anchor="middle">y = 0: 1.6204</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7&#215; worse</text>

  <rect x="482" y="266" width="144" height="114" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="554" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">4 &#183; one step</text>
  <text x="554" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">w = 3, slope 6</text>
  <text x="554" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">3 &#8722; 0.1&#215;6</text>
  <text x="554" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="middle">= 2.4</text>
  <text x="554" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B" text-anchor="middle">9.00 &#8594; 5.76</text>

  <rect x="636" y="266" width="144" height="114" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="708" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">5 &#183; shapes</text>
  <text x="708" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">(4,2) @ (2,3)</text>
  <text x="708" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="middle">&#8594; (4,3)</text>
  <text x="708" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">(4,3) @ (3,1)</text>
  <text x="708" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C42B8C" text-anchor="middle">&#8594; (4,1)</text>
</svg>
