<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The name goes on the left. Always.</title>
  <desc>Two mirrored panels. On the left, marked wrong, an arrow tries to push the name pizza_price into a plain value 8.50 and Python answers cannot assign to literal here. On the right, marked correct, the label pizza_price sits on a box and the value 8.50 drops inside, read aloud as pizza_price gets 8.50.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The name goes on the left. Always.</text>
  <line x1="400" y1="74" x2="400" y2="332" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <rect x="30" y="74" width="360" height="244" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="410" y="74" width="360" height="244" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="72" cy="110" r="17" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="66.0" y1="104.0" x2="78.0" y2="116.0"/>
    <line x1="78.0" y1="104.0" x2="66.0" y2="116.0"/>
  </g>
  <circle cx="452" cy="110" r="17" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="444.0,111.0 449.5,117.0 461.0,104.0" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Wrong</text>
  <text x="478" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Right</text>
  <text x="210" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">trying to put a name INTO a value</text>
  <text x="590" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">putting a value INTO a name</text>
  <rect x="72" y="168" width="110" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="127" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#55636F" text-anchor="middle" dominant-baseline="central">8.50</text>
  <text x="127" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a value. Not a box.</text>
  <line x1="300" y1="194" x2="196" y2="194" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(196 194) rotate(180.0)"/>
  <rect x="220" y="168" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="280" y="183" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">pizza_price</text>
  <text x="280" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a name</text>
  <rect x="60" y="258" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="210" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" text-anchor="middle" font-weight="600">SyntaxError: cannot assign to</text>
  <text x="210" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" text-anchor="middle" font-weight="600">literal here</text>
  <rect x="506" y="168" width="130" height="30" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="571" y="183" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">pizza_price</text>
  <rect x="506" y="198" width="180" height="50" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="596" y="223" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">8.50</text>
  <line x1="730" y1="223" x2="700" y2="223" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(700 223) rotate(180.0)"/>
  <text x="690" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">the value drops in</text>
  <rect x="440" y="276" width="300" height="32" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="590" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle" dominant-baseline="central">read it out loud: pizza_price GETS 8.50</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The equals sign is an instruction, not a claim. It only works one way round.</text>
</svg>
