<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five fields go out, five come back, three of them changed</title>
  <desc>Two mirrored panels listing the same five fields. On the left, marked correct, name and team are text, runs and balls are whole numbers and out is a true or false. On the right, marked wrong, all five are text: the three that changed are ringed and each has the word str beside it.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five go out. Five come back. Three changed.</text>
