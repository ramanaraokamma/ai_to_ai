  <text x="630" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 and 3 &#8212; settled</text>
  <rect x="45" y="292" width="710" height="70" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="64" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">why C left:      to (1, 2) &#8594; 1 + 1 = 2        to (2, 3) &#8594; 0 + 0 = 0</text>
  <text x="64" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">why C came back: to (1.5,1.5) &#8594; 0.25+2.25 = 2.50   to (6.5,6.75) &#8594; 20.25+14.06 = 34.31</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Membership is a shape, not just a colour: circle or triangle.</text>
</svg>
