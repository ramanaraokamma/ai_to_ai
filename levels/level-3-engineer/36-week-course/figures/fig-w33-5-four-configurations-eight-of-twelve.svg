<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five tries at the twelve traps</title>
  <desc>A five-row ladder. Unigrams alone fixes 0 of the 12 negation traps and scores 1.0000 on the ordinary held-out 20. Adding bigrams to the same 60 reviews fixes 0 of the 12 negation traps and scores 1.0000 on the ordinary held-out 20. Adding 8 short negation reviews as well fixes 0 of the 12 negation traps and scores 0.9500 on the ordinary held-out 20. Gluing a negator onto the word after it, with no new data fixes 6 of the 12 negation traps and scores 0.9500 on the ordinary held-out 20. Gluing plus the 8 negation reviews fixes 7 of the 12 negation traps and scores 0.9500 on the ordinary held-out 20. 7 minus 0 is 7 traps recovered, and 7 divided by 12 is 58 percent. More columns fixed nothing and more rows fixed nothing; only changing what counts as a token helped at all, and five traps are still wrong.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five tries at the twelve traps</text>
  <text x="40" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what changed</text>
  <text x="392" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">traps out of 12</text>
  <text x="716" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">held-out 20</text>
