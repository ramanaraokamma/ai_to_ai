<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img">
  <title>The error names two numbers. Only one is yours.</title>
  <desc>A red-outlined traceback panel whose last line reads: RuntimeError, mat1 and mat2 shapes cannot be multiplied, 4 by 64 and 32 by 10. The 64 is boxed and numbered 1, the 32 is boxed and numbered 2. Callout 1 says the 64 came from the picture, because 16 channels times 2 times 2 is 64. Callout 2 says the 32 came from the layer you typed yourself, and should be changed to 64.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The error names two numbers. Only one is yours.</text>
  <path d="M40 74 A10 10 0 0 1 50 64 H420 A10 10 0 0 1 430 74 V94 H40 Z" fill="#F6AEA6"/>
  <line x1="52" y1="74" x2="62" y2="84" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="74" x2="52" y2="84" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"/>
  <text x="72" y="83" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Traceback</text>
  <line x1="40" y1="94" x2="430" y2="94" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">  File "stack.py", line 12, in &lt;module&gt;</text>
  <text x="52" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    logits = net(batch)</text>
  <text x="52" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">RuntimeError: mat1 and mat2 shapes</text>
  <rect x="236" y="169" width="18" height="17" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <rect x="280" y="169" width="18" height="17" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="52" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">cannot be multiplied (4x</text>
  <text x="238" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" font-weight="600">64</text>
  <text x="256" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">and</text>
  <text x="282" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" font-weight="600">32</text>
  <text x="300" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">x10)</text>
  <circle cx="245" cy="202" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="245" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <circle cx="289" cy="202" r="9" fill="#E8C671" stroke="#845F00" stroke-width="3"/><text x="289" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="40" y="64" width="390" height="148" rx="10" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="456" y="76" width="324" height="58" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="478" cy="105" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="478" y="105" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="498" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">64 came from the picture</text>
  <text x="498" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">16 channels &#215; 2 &#215; 2 = 64</text>
  <rect x="456" y="152" width="324" height="58" rx="10" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="478" cy="181" r="9" fill="#E8C671" stroke="#845F00" stroke-width="3"/><text x="478" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="498" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">32 came from your own layer</text>
  <text x="498" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">you typed 32; change it to 64</text>
  <text x="400" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Read the last line, find the two numbers, and ask which one you chose.</text>
</svg>
