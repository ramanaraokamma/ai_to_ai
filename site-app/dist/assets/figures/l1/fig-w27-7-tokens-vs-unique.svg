<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Nine tokens, seven unique</title>
  <desc>The sentence I love pizza. Do you love pizza? chopped into nine numbered token boxes. Underneath, the same nine boxes again with the second love and the second pizza crossed out, leaving seven unique tokens.</desc>
