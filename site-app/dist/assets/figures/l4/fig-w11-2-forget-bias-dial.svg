<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Raising the forget bias before training lets the first step reach the last: one bias number turns Week 10's fade into a highway</title>
  <desc>Four panels for forget bias 0, 1, 2 and 4. Each shows the average forget dial at step 1 as a bar out of 1: 0.510, 0.732, 0.879, 0.981; and the measured ratio of the gradient at position 1 to position 40: 1.93e-09, 9.84e-04, 2.21e-01, 1.08e+00, with a log-scale bar from 1e-10 to 1. Biases 0 and 1 have dashed red outlines and a cross, biases 2 and 4 a tick. Values from Week 11 block 5, seed 0, 40 steps.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Start the forget dial high</text>
