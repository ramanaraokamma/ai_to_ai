<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>SFT scores only the answer guesses and blanks the prompt guesses</title>
  <desc>Nine tokens, five of them prompt and four answer, sit in a row. Under them eight guesses, each made at one place for the next token. The first four guesses (surprises 4.574, 1.972, 2.968, 4.729) are dashed and marked minus 100 because their right answers are still inside the prompt. The last four (4.111, 4.044, 3.102, 4.907) count. The mean of all eight is 3.8008 and the mean of the four that count is 4.0407. Scores are random numbers of shape (8, 12), not a model.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">SFT scores only the answer: 4 of 8 guesses count</text>
  <text x="247" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#845F00" text-anchor="middle">prompt (5 tokens)</text>
  <text x="589" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1F6FB2" text-anchor="middle">answer (4 tokens)</text>
