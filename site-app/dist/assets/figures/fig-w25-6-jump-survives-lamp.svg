<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The jump survives; the brightness does not</title>
  <desc>A wall meeting a wooden door frame, then two rows of six pixel numbers. Under room light the wall reads 200 and the frame reads 40. With a lamp on they read 250 and 90. Both times the jump across the boundary is 160.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The jump survives; the brightness does not</text>
  <rect x="30" y="70" width="210" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="46" y="100" width="110" height="150" rx="0" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="156" y="100" width="68" height="150" rx="0" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="101" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">wall</text>
  <text x="190" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">frame</text>
  <line x1="52" y1="292" x2="216" y2="292" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/><polyline points="206,285 216,292 206,299" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="134" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">slide your finger</text>
  <text x="486" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">wall</text>
  <text x="618" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">door frame</text>
  <text x="406" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">Room light</text>
  <rect x="420" y="110" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="442.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">200</text>
  <rect x="464" y="110" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="486.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">200</text>
  <rect x="508" y="110" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="530.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">200</text>
  <rect x="552" y="110" width="44" height="44" fill="#1F6FB2" stroke="#C7CDD4" stroke-width="1.5"/><text x="574.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">40</text>
  <rect x="596" y="110" width="44" height="44" fill="#1F6FB2" stroke="#C7CDD4" stroke-width="1.5"/><text x="618.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">40</text>
  <rect x="640" y="110" width="44" height="44" fill="#1F6FB2" stroke="#C7CDD4" stroke-width="1.5"/><text x="662.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">40</text>
  <text x="740" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">jump</text>
  <rect x="700" y="112" width="80" height="40" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="740" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">160</text>
  <text x="406" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">Lamp on</text>
  <rect x="420" y="210" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="442.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">250</text>
  <rect x="464" y="210" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="486.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">250</text>
  <rect x="508" y="210" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/><text x="530.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">250</text>
  <rect x="552" y="210" width="44" height="44" fill="#1F6FB2" stroke="#C7CDD4" stroke-width="1.5"/><text x="574.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">90</text>
  <rect x="596" y="210" width="44" height="44" fill="#1F6FB2" stroke="#C7CDD4" stroke-width="1.5"/><text x="618.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">90</text>
  <rect x="640" y="210" width="44" height="44" fill="#1F6FB2" stroke="#C7CDD4" stroke-width="1.5"/><text x="662.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">90</text>
  <text x="740" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">jump</text>
  <rect x="700" y="212" width="80" height="40" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="740" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">160</text>
  <line x1="552" y1="96" x2="552" y2="270" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
  <text x="552" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">EDGE</text>
  <line x1="452" y1="162" x2="452" y2="202" stroke="#845F00" stroke-width="3" stroke-linecap="round"/><polyline points="445,192 452,202 459,192" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="662" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#845F00" text-anchor="middle" dominant-baseline="central">+50 to every number</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every number moved by 50. The jump did not move at all.</text>
</svg>
