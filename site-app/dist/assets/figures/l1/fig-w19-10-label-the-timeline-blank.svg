<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the six steps</title>
  <desc>Six numbered circles joined left to right along a line, each with an empty box underneath for the reader to write the name of the step. A word bank sits at the bottom.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Label the six steps</text>

    <line x1="90" y1="110" x2="710" y2="110" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
    <g>
      <circle cx="90" cy="110" r="22" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
      <text x="90" y="117" font-size="18" fill="#14202B" text-anchor="middle">1</text>
      <circle cx="214" cy="110" r="22" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
      <text x="214" y="117" font-size="18" fill="#14202B" text-anchor="middle">2</text>
      <circle cx="338" cy="110" r="22" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
      <text x="338" y="117" font-size="18" fill="#14202B" text-anchor="middle">3</text>
      <circle cx="462" cy="110" r="22" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
      <text x="462" y="117" font-size="18" fill="#14202B" text-anchor="middle">4</text>
      <circle cx="586" cy="110" r="22" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
      <text x="586" y="117" font-size="18" fill="#14202B" text-anchor="middle">5</text>
      <circle cx="710" cy="110" r="22" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
      <text x="710" y="117" font-size="18" fill="#14202B" text-anchor="middle">6</text>
    </g>

    <g fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round">
      <rect x="34" y="158" width="112" height="56" rx="10"/>
      <rect x="158" y="158" width="112" height="56" rx="10"/>
      <rect x="282" y="158" width="112" height="56" rx="10"/>
      <rect x="406" y="158" width="112" height="56" rx="10"/>
      <rect x="530" y="158" width="112" height="56" rx="10"/>
      <rect x="654" y="158" width="112" height="56" rx="10"/>
    </g>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="50" y1="196" x2="130" y2="196"/>
      <line x1="174" y1="196" x2="254" y2="196"/>
      <line x1="298" y1="196" x2="378" y2="196"/>
      <line x1="422" y1="196" x2="502" y2="196"/>
      <line x1="546" y1="196" x2="626" y2="196"/>
      <line x1="670" y1="196" x2="750" y2="196"/>
    </g>

    <rect x="34" y="240" width="732" height="64" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="400" y="266" font-size="14" fill="#55636F" text-anchor="middle">WORD BANK (one is a decoy — you only need six)</text>
    <text x="400" y="292" font-size="18" fill="#14202B" text-anchor="middle">seal · score · train · collect · open the envelope · split · delete</text>

    <text x="400" y="352" font-size="14" fill="#55636F" text-anchor="middle">Then circle the one step that makes all the others honest.</text>
  </g>
</svg>
