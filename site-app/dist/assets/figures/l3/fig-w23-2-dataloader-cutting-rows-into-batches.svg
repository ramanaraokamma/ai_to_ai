<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A DataLoader cuts the rows into batches</title>
  <desc>A single wide bar of 1257 training rows is cut into 40 pieces. The first 39 pieces each hold 32 rows, and 39 times 32 is 1248. The last piece is visibly narrower and holds the 9 rows left over, because 1257 minus 1248 is 9. Every piece is one optimizer step.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">1257 rows, 32 at a time</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one batch is one optimizer step, so the cutting is the arithmetic that matters</text>
  <rect x="40" y="96" width="720" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="58.3294" y1="96" x2="58.3294" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="76.6587" y1="96" x2="76.6587" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="94.9881" y1="96" x2="94.9881" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="113.317" y1="96" x2="113.317" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
