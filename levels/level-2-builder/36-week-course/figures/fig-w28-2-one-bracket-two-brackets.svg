<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One bracket or two?</title>
  <desc>On the left, one bracket gives a single column of loose values with shape ten, which is what y needs. On the right, two brackets give a table with a header row and shape ten by two, which is what X needs. The two shapes are printed underneath each picture.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One bracket or two?</text>
  <text x="200" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">ONE bracket</text>
  <text x="200" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">a single column of values</text>
  <rect x="150" y="126" width="100" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="200" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">68</text>
  <rect x="150" y="166" width="100" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="200" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">148</text>
  <rect x="150" y="206" width="100" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="200" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">80</text>
  <rect x="150" y="246" width="100" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="200" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">160</text>
  <text x="200" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">shape (10,)</text>
  <text x="200" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one number, then a comma</text>
  <text x="200" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">good for  y</text>
  <line x1="400" y1="76" x2="400" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="6 5"/>
  <text x="600" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">TWO brackets</text>
  <text x="600" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">a table, even with one column in it</text>
  <rect x="500" y="122" width="200" height="36" fill="#D9EAF9"/>
  <rect x="500" y="158" width="200" height="32" fill="#FFFFFF"/>
  <rect x="500" y="190" width="200" height="32" fill="#FFFFFF"/>
  <rect x="500" y="222" width="200" height="32" fill="#FFFFFF"/>
  <rect x="500" y="254" width="200" height="32" fill="#FFFFFF"/>
  <line x1="500" y1="190" x2="700" y2="190" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="500" y1="222" x2="700" y2="222" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="500" y1="254" x2="700" y2="254" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="500" y1="286" x2="700" y2="286" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="600" y1="122" x2="600" y2="286" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="butt"/>
  <line x1="500" y1="158" x2="700" y2="158" stroke="#14202B" stroke-width="2" stroke-linecap="butt"/>
  <rect x="500" y="122" width="200" height="164" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="550" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central" font-weight="600">bpm</text>
  <text x="650" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central" font-weight="600">minutes</text>
  <text x="550" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">68</text>
  <text x="650" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4.2</text>
  <text x="550" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">148</text>
  <text x="650" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3.1</text>
  <text x="550" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">80</text>
  <text x="650" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3.8</text>
  <text x="550" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">160</text>
  <text x="650" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.8</text>
  <text x="600" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">shape (10, 2)</text>
  <text x="600" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rows, then columns</text>
  <text x="600" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2" text-anchor="middle">good for  X</text>

</svg>
