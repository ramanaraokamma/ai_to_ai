<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The same cloud, measured against two new axes</title>
  <desc>Five points lie on a line leaning up to the right. The old axes are drawn in grey. Two new purple axes cross at the middle of the cloud: a long one at 42.62 degrees labelled PC1, the direction of most spread, and a short one across it labelled PC2. The top point, 4 across and 4 up from the middle, is dropped onto PC1 at right angles; the place it lands is ringed and labelled 5.652. Beside it the arithmetic: 4 times 0.7359 plus 4 times 0.6771 is 5.6520.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">New axes, chosen by spread.</text>
  <line x1="104.40" y1="260.00" x2="395.60" y2="260.00" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="250.00" y1="353.60" x2="250.00" y2="119.60" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="395.6" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">hours studied</text>
  <text x="260" y="121.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">hours slept</text>
  <line x1="150.51" y1="351.55" x2="349.49" y2="168.45" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <line x1="295.77" y1="309.74" x2="204.23" y2="210.26" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <text x="344.1824718583949" y="194.53599912339567" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9">PC1</text>
  <text x="286.2530913872387" y="321.9177119227608" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="end">PC2</text>
  <circle cx="146.00" cy="364.00" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="198.00" cy="286.00" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="250.00" cy="260.00" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="302.00" cy="234.00" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="354.00" cy="156.00" r="5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="354.00" y1="156.00" x2="358.14" y2="160.49" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <circle cx="358.14" cy="160.49" r="7" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3"/>
  <text x="340.0" y="142.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">(4, 4) from the middle</text>
  <rect x="40" y="366" width="420" height="100" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="56" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">PC1 points (0.7359 across, 0.6771 up)</text>
  <text x="56" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">4 &#215; 0.7359 + 4 &#215; 0.6771 = 5.6520</text>
  <text x="56" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C42B8C">that one number 5.6520 is where it lands</text>
  <text x="250" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">PC1 and PC2 cross at the middle of the cloud, at (8, 7).</text>
</svg>
