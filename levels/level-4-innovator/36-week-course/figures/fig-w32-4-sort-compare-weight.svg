<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>ECE sorts results into buckets by stated confidence, compares said with delivered in each, then weights each gap by the bucket size</title>
  <desc>Top left, the 40 results, each a stated confidence and a right or wrong. An arrow leads to a strip of five buckets split at 0.6, 0.7, 0.8 and 0.9, holding 9, 7, 6, 8 and 10 results; the top bucket is outlined. A zoom of that bucket shows a dashed bar for what it said, 0.931, beside a solid bar for what it delivered, 0.700, with the gap marked between their tops. Three boxes in order read: 1 sort by what it said, 2 compare said against delivered, 3 weight and add, bigger bucket more say. A panel says ECE here is 0.1788, not the share it gets wrong, which is 42.5 percent.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Calibration: sort by what it said, then compare</text>
  <rect x="20" y="80" width="140" height="64" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="90" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">40 results</text>
  <text x="90" y="123" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">said p, right/wrong</text>
  <circle cx="32" cy="80" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="32" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <line x1="162" y1="112" x2="200" y2="112" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(200 112) rotate(0)"/>
  <text x="214" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">sorted into five buckets by what it said, n per bucket</text>
  <rect x="214" y="82" width="70" height="58" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="249" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#14202B" text-anchor="middle" dominant-baseline="central">9</text>
  <rect x="284" y="82" width="70" height="58" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="319" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
  <rect x="354" y="82" width="70" height="58" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="389" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="424" y="82" width="70" height="58" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="459" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#14202B" text-anchor="middle" dominant-baseline="central">8</text>
  <rect x="494" y="82" width="70" height="58" fill="#F4D5E9" stroke="#C42B8C" stroke-width="4"/>
  <text x="529" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <text x="284" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.6</text>
  <text x="354" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.7</text>
  <text x="424" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.8</text>
  <text x="494" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.9</text>
  <text x="214" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">said less</text>
  <text x="564" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">said more</text>
  <line x1="529" y1="142" x2="640" y2="194" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <rect x="590" y="170" width="190" height="160" rx="12" fill="#F5F8FA" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="590" cy="170" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="590" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="685" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the top bucket, 10 results</text>
  <line x1="612" y1="306" x2="764" y2="306" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="622" y="227.8" width="44" height="78.2" rx="2" fill="#F5F8FA" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <rect x="706" y="247.2" width="44" height="58.8" rx="2" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="644" y="221.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.931</text>
  <text x="728" y="241.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.700</text>
  <text x="644" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">said</text>
  <text x="728" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">delivered</text>
  <line x1="660" y1="227.8" x2="700" y2="227.8" stroke="#55636F" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <line x1="700" y1="227.8" x2="700" y2="247.2" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="696" y="238.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">gap</text>
  <rect x="20" y="196" width="168" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="104" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1  sort</text>
  <text x="104" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">by what it said</text>
  <line x1="190" y1="223" x2="210" y2="223" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(210 223) rotate(0)"/>
  <rect x="212" y="196" width="168" height="54" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="296" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2  compare</text>
  <text x="296" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">said against delivered</text>
  <line x1="382" y1="223" x2="402" y2="223" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(402 223) rotate(0)"/>
  <rect x="404" y="196" width="168" height="54" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="488" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3  weight and add</text>
  <text x="488" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">bigger bucket, more say</text>
  <rect x="20" y="272" width="552" height="58" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="296" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">ECE: the average size of the gap, each bucket counted by its size.</text>
  <text x="296" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Here 0.1788: not the share it gets wrong, which is 42.5%.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Sort first, compare second, weight third: the order matters.</text>
</svg>
