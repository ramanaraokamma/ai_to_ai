<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 4</title>
  <desc>An empty framed drawing area titled draw your own table, with a dashed blank grid of five rows and four columns inside it, a line at the top for writing one row equals one, and three reminder boxes along the bottom.</desc>
  <rect x="24" y="24" width="752" height="298" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your own table, with every part labelled</text>

  <text x="56" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#845F00">ONE ROW = ONE</text>
  <line x1="180" y1="102" x2="470" y2="102" stroke="#845F00" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- blank grid: header + 5 rows, 4 columns -->
  <rect x="56" y="120" width="560" height="180" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8">
    <line x1="56" y1="150" x2="616" y2="150"/>
    <line x1="56" y1="180" x2="616" y2="180"/>
    <line x1="56" y1="210" x2="616" y2="210"/>
    <line x1="56" y1="240" x2="616" y2="240"/>
    <line x1="56" y1="270" x2="616" y2="270"/>
    <line x1="196" y1="120" x2="196" y2="300"/>
    <line x1="336" y1="120" x2="336" y2="300"/>
    <line x1="476" y1="120" x2="476" y2="300"/>
  </g>
  <text x="336" y="139" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">write your four column headers along this top line</text>

  <!-- three arrow labels pointing into the grid -->
  <g stroke="#C42B8C" stroke-width="1.5" fill="none">
    <path d="M660 136 H628"/>
    <path d="M660 196 H628"/>
    <path d="M660 256 H628"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">
    <text x="666" y="140">label this ....</text>
    <text x="666" y="200">label this ....</text>
    <text x="666" y="260">label this ....</text>
  </g>

  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="40" y="344" width="226" height="34" rx="8"/>
    <rect x="286" y="344" width="226" height="34" rx="8"/>
    <rect x="532" y="344" width="226" height="34" rx="8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="40" y="340">one question it CAN answer</text>
    <text x="286" y="340">one question it CANNOT answer</text>
    <text x="532" y="340">the row unit you rejected</text>
  </g>
</svg>
