  <text x="205.6" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">under a name</text>
  <rect x="279.2" y="110" width="112" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <circle cx="297.2" cy="128" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="297.2" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <line x1="291.2" y1="158" x2="379.2" y2="158" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="335.2" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">send it to the</text>
  <text x="335.2" y="211" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">model and get</text>
  <text x="335.2" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">text back</text>
  <rect x="408.8" y="110" width="112" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <circle cx="426.8" cy="128" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
