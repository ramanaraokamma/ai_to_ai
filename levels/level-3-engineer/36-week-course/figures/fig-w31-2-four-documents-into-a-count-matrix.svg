<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four reviews become one grid of counts</title>
  <desc>Four short reviews on the left, an arrow labelled count, and a four by eight grid on the right whose columns are the vocabulary and, cold, food, great, pizza, service, the, was. Row d1 reads 0 0 0 1 1 0 1 1. Row d2 reads 0 1 0 0 1 0 1 1. Row d3 reads 0 0 0 2 1 1 0 0 and its great cell, ringed in pink, holds 2 because the review Great pizza, great service contains the word great twice. Row d4 reads 1 2 1 0 0 1 0 0. The shape is 4 by 8, and 4 times 8 is 32 cells.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four reviews become one grid of counts</text>
