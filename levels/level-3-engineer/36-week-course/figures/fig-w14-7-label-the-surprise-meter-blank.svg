<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the surprise meter</title>
  <desc>Eight numbered rows, each with an empty dashed pink box for the answer. Rows 1 to 4 are minus the natural logarithm of 0.9, 0.5, 0.1 and 0.02, whose answers are 0.105361, 0.693147, 2.302585 and 3.912023. Rows 5 and 6 are rows where the thing did not happen, so the chance given to what happened is one minus the prediction: minus the natural logarithm of 1 minus 0.20 gives 0.223144, and minus the natural logarithm of 1 minus 0.95 gives 2.995732. Rows 7 and 8 are the same two disasters priced with squared error instead: 1 minus 0.02 all squared gives 0.960400, and 1 minus 0.40 all squared gives 0.360000. A panel at the bottom asks for the two ratios, 3.912023 divided by 0.916291 and 0.960400 divided by 0.360000, and for which of the two rulers has a ceiling and what that ceiling is.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the surprise meter</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Rows 1&#8211;6 are log loss &#183; rows 7&#8211;8 squared error, same two rows</text>

  <rect x="30" y="84" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="111" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="56" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">it happened, you said 0.9</text>
  <rect x="330" y="97" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="144" width="440" height="54" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="171" r="13" fill="#FFFFFF" stroke="#845F00" stroke-width="3"/>
  <text x="56" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">it happened, you said 0.5</text>
  <rect x="330" y="157" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="204" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="231" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="56" y="231" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">it happened, you said 0.1</text>
  <rect x="330" y="217" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="264" width="440" height="54" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="291" r="13" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3"/>
  <text x="56" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">it happened, you said 0.02</text>
  <rect x="330" y="277" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="324" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="351" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="56" y="351" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">it did NOT, you said 0.20</text>
  <rect x="330" y="337" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="384" width="440" height="54" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="411" r="13" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3"/>
  <text x="56" y="411" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="80" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">it did NOT, you said 0.95</text>
  <rect x="330" y="397" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="444" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="471" r="13" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="56" y="471" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
  <text x="80" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">squared: (1 &#8722; 0.02)&#178; =</text>
  <rect x="330" y="457" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="504" width="440" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="531" r="13" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="56" y="531" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">8</text>
  <text x="80" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">squared: (1 &#8722; 0.40)&#178; =</text>
  <rect x="330" y="517" width="126" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <rect x="30" y="574" width="440" height="102" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Two ratios, and one ceiling</text>
  <text x="48" y="626" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">log loss: 3.912023 &#247; 0.916291 = ____________</text>
  <text x="48" y="648" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">squared error: 0.960400 &#247; 0.360000 = ____________</text>
  <text x="48" y="668" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Which ruler has a ceiling, and what is it? ____________</text>
</svg>
