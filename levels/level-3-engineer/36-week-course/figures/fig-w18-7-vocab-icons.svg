<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six words from Week 18, drawn</title>
  <desc>Six labelled tiles. Backpropagation: three blocks with a pink dashed arrow running right to left, labelled blame walks backwards. Chain rule: two arrows marked 3 and 14 with the product 42 beside them. The gradient check tile: two numbers, 0.29789053 worked by the chain and 0.29789053 measured by nudging, joined by an equals sign. Relative error: two bars against a dashed threshold line at 1e minus 6, one at 2.97e minus 08 marked pass and one at 2.66e minus 01 marked fail. He initialization: four purple bars of different heights above the note spread of sqrt of 2 over 2 equals 1.000000. Symmetry breaking: three identical red bars crossed out beside three different green bars ticked.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six words from Week 18, drawn</text>

  <rect x="30" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">backpropagation</text>
  <rect x="48" y="112" width="52" height="44" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="118" y="112" width="52" height="44" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="188" y="112" width="52" height="44" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="186" y1="174" x2="66" y2="174" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
  <polygon points="54,174 68,167 68,181" fill="#C42B8C" stroke="#C42B8C" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="44" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">blame walks backwards, one sweep</text>

  <rect x="287" y="66" width="226" height="142" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="301" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">chain rule</text>
  <line x1="310" y1="132" x2="366" y2="132" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="376,132 364,126 364,138" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="340" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">3</text>
  <line x1="388" y1="132" x2="444" y2="132" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="454,132 442,126 442,138" fill="#1F6FB2" stroke="#1F6FB2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="418" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">14</text>
  <rect x="366" y="152" width="90" height="34" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
