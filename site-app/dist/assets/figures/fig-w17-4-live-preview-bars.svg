<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Holding a spoon up to the live preview</title>
  <desc>On the left, a webcam view marked LIVE shows a hand holding a spoon. On the right, the output panel shows three bars: spoon 91 percent, toothbrush 5 percent, comb 4 percent. Below them the sum is checked as 100 and the margin is worked out as 91 minus 5 equals 86.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Hold it up, then write the three numbers down</text>

    <rect x="40" y="80" width="320" height="250" rx="12" fill="#F5F8FA" stroke="#55636F" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="200" cy="140" rx="26" ry="36" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <line x1="200" y1="176" x2="200" y2="250" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <rect x="172" y="246" width="56" height="46" rx="14" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#845F00" stroke-width="2" stroke-linecap="round">
      <line x1="176" y1="258" x2="224" y2="258"/>
      <line x1="176" y1="270" x2="224" y2="270"/>
      <line x1="176" y1="282" x2="224" y2="282"/>
    </g>
    <rect x="52" y="92" width="58" height="24" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="81" y="109" font-size="12" fill="#14202B" text-anchor="middle">LIVE</text>
    <text x="200" y="318" font-size="14" fill="#55636F" text-anchor="middle">webcam view</text>

    <rect x="400" y="80" width="360" height="250" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="580" y="110" font-size="18" fill="#14202B" text-anchor="middle">Output</text>

    <rect x="508" y="134" width="191.1" height="32" rx="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="508" y="180" width="10.5" height="32" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="508" y="226" width="8.4" height="32" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g font-size="14" fill="#14202B" text-anchor="end">
      <text x="500" y="155">spoon</text>
      <text x="500" y="201">toothbrush</text>
      <text x="500" y="247">comb</text>
    </g>
    <g font-size="14" fill="#14202B">
      <text x="707" y="155">91%</text>
      <text x="527" y="201">5%</text>
      <text x="525" y="247">4%</text>
    </g>
    <text x="508" y="284" font-size="14" fill="#55636F">91 + 5 + 4 = 100</text>
    <text x="508" y="310" font-size="16" fill="#14202B">margin = 91 - 5 = 86</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Three positions per object, nine rows in total. That is your baseline.</text>
  </g>
</svg>
