<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A score that shouts is a bad day</title>
  <desc>Two panels. Left, marked wrong with a red cross: a red box holding validation AUC 0.9762 in the lab, the note that customer_called_support is in the table, the subtraction 0.9762 minus 0.7752 equals plus 0.2011 from one column against Week 5's plus 0.0091 from four honest features, and a white box showing that on the day it is switched on recall is 0.0174 and only 2 late orders out of 115 are flagged. Right, marked right with a green tick: a green box holding validation AUC 0.7752 from the honest columns only, the note that every one of those values exists the moment ORDER is clicked, and the crosstab that convicted the column: 1413 and 35 on the top row, 12 and 540 on the bottom row, with 540 divided by 552 equals 0.9783.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A score that shouts is a bad day</text>
  <rect x="24" y="62" width="372" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <line x1="43.0" y1="83.0" x2="53.0" y2="93.0" stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"/><line x1="53.0" y1="83.0" x2="43.0" y2="93.0" stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"/>
  <text x="70" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="start" font-weight="bold" dominant-baseline="central">WRONG</text>
  <text x="70" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">&quot;0.9762! Make a slide about it&quot;</text>
  <rect x="60" y="132" width="300" height="56" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="210" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">validation AUC in the lab</text>
  <text x="210" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#CC2B1D" text-anchor="middle" font-weight="bold" dominant-baseline="central">0.9762</text>
  <text x="210" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">customer_called_support is in the table</text>
  <text x="210" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">0.9762 &#8722; 0.7752 = +0.2011 from ONE column</text>
  <text x="210" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">Week 5's four honest features: +0.0091</text>
  <rect x="60" y="270" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="210" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">on the day it is switched on:</text>
  <text x="210" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#CC2B1D" text-anchor="middle" font-weight="bold">recall 0.0174</text>
  <text x="210" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">2 late orders flagged out of 115</text>
  <text x="210" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">nobody has rung up yet, so the column is 0</text>
  <rect x="408" y="62" width="372" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="422,88 429,95 440,80" fill="none" stroke="#1B7A4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="454" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="start" font-weight="bold" dominant-baseline="central">RIGHT</text>
  <text x="454" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">&quot;does this value exist yet? No. Drop it&quot;</text>
  <rect x="444" y="132" width="300" height="56" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="594" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">validation AUC, honest columns only</text>
  <text x="594" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#1B7A4B" text-anchor="middle" font-weight="bold" dominant-baseline="central">0.7752</text>
  <text x="594" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">distance, weather, prep, hour, experience</text>
  <text x="594" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">every value exists the moment ORDER is clicked</text>
  <text x="594" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">so the number survives contact with Tuesday</text>
  <rect x="444" y="270" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="594" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the crosstab that convicted the column:</text>
  <text x="594" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">1413   35</text>
  <text x="594" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CC2B1D" text-anchor="middle" font-weight="bold">  12  540</text>
  <text x="594" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">540 &#247; 552 = 0.9783 &#8594; almost a copy of the answer</text>
</svg>
