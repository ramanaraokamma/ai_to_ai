<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>What the model said about photo 17</title>
  <desc>A horizontal bar chart of one prediction's confidence scores: recycling forty-four per cent, landfill thirty-nine per cent, compost twelve per cent, other five per cent. A note says the four scores always add up to one hundred per cent, and that the top score minus the second score is the margin.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What the model said about photo 17</text>
  <line x1="180.0" y1="86" x2="180.0" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180.0" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0%</text>
  <line x1="250.0" y1="86" x2="250.0" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="250.0" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">25%</text>
  <line x1="320.0" y1="86" x2="320.0" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="320.0" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">50%</text>
  <line x1="390.0" y1="86" x2="390.0" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="390.0" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">75%</text>
  <line x1="460.0" y1="86" x2="460.0" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460.0" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100%</text>
  <rect x="180" y="96" width="123.19999999999999" height="42" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="168" y="123.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="end">recycling</text>
  <text x="315.2" y="123.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">44%</text>
  <rect x="180" y="158" width="109.19999999999999" height="42" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="168" y="185.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="end">landfill</text>
  <text x="301.2" y="185.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">39%</text>
  <rect x="180" y="220" width="33.599999999999994" height="42" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="168" y="247.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="end">compost</text>
  <text x="225.6" y="247.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">12%</text>
  <rect x="180" y="282" width="14.0" height="42" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="168" y="309.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="end">other</text>
  <text x="206.0" y="309.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">5%</text>
  <line x1="180" y1="344" x2="460" y2="344" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <rect x="60" y="386" width="400" height="54" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="260" y="418.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">The four scores always add up to 100%.</text>
  <text x="250" y="466" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Top score minus second score is called the margin.</text>
</svg>
