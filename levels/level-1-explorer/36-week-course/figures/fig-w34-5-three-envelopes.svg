<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Three piles of photos, three different jobs</title>
  <desc>Three envelopes side by side. The first is open and labelled train, the homework you study. The second is sealed with a red seal and labelled held out, the exam paper, do not open until milestone four. The third is dashed and labelled bias test, a pop quiz collected later.</desc>

  <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Three piles of photos, three different jobs</text>

  <!-- train -->
  <rect x="40" y="90" width="220" height="150" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <path d="M40 96 L150 176 L260 96" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(100,96) scale(0.7)">
    <rect x="24" y="26" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="30" y="32" width="40" height="30" rx="4" fill="#D9EAF9" stroke="none"/>
    <circle cx="42" cy="42" r="5" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
    <path d="M30 62 L44 50 L54 58 L62 52 L70 62 Z" fill="#1F6FB2" stroke="none"/>
    <rect x="30" y="32" width="40" height="30" rx="4" fill="none" stroke="#1F6FB2" stroke-width="2"/>
  </g>
  <text x="150" y="270" font-size="18" fill="#14202B" text-anchor="middle">train/  160 photos</text>
  <text x="150" y="294" font-size="14" fill="#55636F" text-anchor="middle">the homework you study</text>
  <text x="150" y="316" font-size="14" fill="#55636F" text-anchor="middle">80% - the model sees all of it</text>

  <!-- heldout -->
  <rect x="290" y="90" width="220" height="150" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <path d="M290 96 L400 176 L510 96" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="400" cy="176" r="26" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3"/>
  <g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round">
    <line x1="390" y1="166" x2="410" y2="186"/>
    <line x1="410" y1="166" x2="390" y2="186"/>
  </g>
  <text x="400" y="270" font-size="18" fill="#14202B" text-anchor="middle">heldout/  40 photos</text>
  <text x="400" y="294" font-size="14" fill="#55636F" text-anchor="middle">the sealed exam paper</text>
  <text x="400" y="316" font-size="14" fill="#CC2B1D" text-anchor="middle">sealed BEFORE training. One look, one score.</text>

  <!-- bias test -->
  <rect x="540" y="90" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M540 96 L650 176 L760 96" fill="none" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(614,108) scale(0.72)">
    <line x1="60" y1="60" x2="86" y2="86" stroke="#845F00" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="42" r="26" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
  </g>
  <text x="650" y="270" font-size="18" fill="#14202B" text-anchor="middle">biastest/  40 photos</text>
  <text x="650" y="294" font-size="14" fill="#55636F" text-anchor="middle">the pop quiz, in a room</text>
  <text x="650" y="316" font-size="14" fill="#55636F" text-anchor="middle">you did not expect - next week</text>

  <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">Mixing the first two is the only mistake in this project that cannot be undone.</text>
</svg>
