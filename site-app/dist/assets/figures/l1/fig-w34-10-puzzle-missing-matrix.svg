<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The missing matrix puzzle</title>
  <desc>A three by three confusion matrix for three classes with four cells filled in and four cells marked with question marks. All row totals are five and the column totals are six, four and five.</desc>
  <text x="250" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fill the four question marks</text>
  <text x="250" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every row adds to 5. The column totals are given. Only one answer works.</text>
  <text x="272" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">PREDICTED</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="200" y="120">apple</text><text x="272" y="120">pear</text><text x="344" y="120">plum</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="end">
    <text x="160" y="168">apple</text><text x="160" y="240">pear</text><text x="160" y="312">plum</text>
  </g>
  <text x="96" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 96 240)">TRUE</text>
  <g fill="none" stroke="#C7CDD4" stroke-width="1.5">
    <rect x="172" y="134" width="56" height="48"/><rect x="244" y="134" width="56" height="48"/><rect x="316" y="134" width="56" height="48"/>
    <rect x="172" y="206" width="56" height="48"/><rect x="244" y="206" width="56" height="48"/><rect x="316" y="206" width="56" height="48"/>
    <rect x="172" y="278" width="56" height="48"/><rect x="244" y="278" width="56" height="48"/><rect x="316" y="278" width="56" height="48"/>
  </g>
  <g fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5">
    <rect x="172" y="134" width="56" height="48"/><rect x="244" y="206" width="56" height="48"/><rect x="316" y="278" width="56" height="48"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">
    <text x="200" y="166">4</text><text x="344" y="166">0</text>
    <text x="272" y="238">3</text><text x="344" y="238">1</text>
    <text x="200" y="310">1</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#C42B8C" text-anchor="middle">
    <text x="272" y="166">?</text>
    <text x="200" y="238">?</text>
    <text x="272" y="310">?</text><text x="344" y="310">?</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#55636F" text-anchor="middle">
    <text x="410" y="166">= 5</text><text x="410" y="238">= 5</text><text x="410" y="310">= 5</text>
    <text x="200" y="356">6</text><text x="272" y="356">4</text><text x="344" y="356">5</text>
  </g>
  <line x1="172" y1="332" x2="372" y2="332" stroke="#14202B" stroke-width="2"/>
  <text x="128" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">totals</text>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="40" y1="418" x2="460" y2="418"/>
    <line x1="40" y1="458" x2="460" y2="458"/>
  </g>
  <text x="40" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Shaded boxes add to ______, so accuracy = ______ / 15 = ______%</text>
  <text x="40" y="444" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Baseline for 3 equal classes = ______%  Gain = ______ points</text>
</svg>
