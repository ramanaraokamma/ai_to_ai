<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One output cell, multiplied out in full</title>
  <desc>A three by two block holding 1, 2, 3, 4, 5, 6, times a two by four block holding 10, 20, 30, 40 and 50, 60, 70, 80, equals a three by four block whose first row is 110, 140, 170, 200. The first row of A, the first column of B and the top-left answer cell are outlined in pink, and a callout works the cell out: 1 times 10 is 10, 2 times 50 is 100, and 10 plus 100 gives 110. Two more cells are given underneath: 3 times 30 plus 4 times 70 is 370, and 5 times 40 plus 6 times 80 is 680.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One output cell, multiplied out in full</text>
