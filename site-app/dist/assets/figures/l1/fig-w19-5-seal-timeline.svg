<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Timeline from collect to score with the seal step highlighted</title>
  <desc>A six step timeline: collect, split, seal, train, open the envelope, score. The third step, seal, is drawn larger and highlighted, with a note saying every step after it is only honest because of it.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">The order is the whole lesson</text>

    <line x1="60" y1="180" x2="750" y2="180" stroke="#C7CDD4" stroke-width="1.5"/>

    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="70" y="126">30 photos</text>
      <text x="204" y="126">24 / 6</text>
      <text x="338" y="118">envelope</text>
      <text x="338" y="102">signed</text>
      <text x="472" y="126">on the 24</text>
      <text x="606" y="126">in Week 22</text>
      <text x="740" y="126">6 answers</text>
    </g>

    <g fill="#FFFFFF" stroke="#14202B" stroke-width="3">
      <circle cx="70" cy="180" r="26"/>
      <circle cx="204" cy="180" r="26"/>
      <circle cx="472" cy="180" r="26"/>
      <circle cx="606" cy="180" r="26"/>
      <circle cx="740" cy="180" r="26"/>
    </g>
    <circle cx="338" cy="180" r="34" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>

    <g font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">
      <text x="70" y="181">1</text>
      <text x="204" y="181">2</text>
      <text x="338" y="181">3</text>
      <text x="472" y="181">4</text>
      <text x="606" y="181">5</text>
      <text x="740" y="181">6</text>
    </g>

    <g font-size="18" fill="#14202B" text-anchor="middle">
      <text x="70" y="240">Collect</text>
      <text x="204" y="240">Split</text>
      <text x="338" y="240">SEAL</text>
      <text x="472" y="240">Train</text>
      <text x="606" y="240">Open</text>
      <text x="740" y="240">Score</text>
    </g>

    <line x1="338" y1="250" x2="338" y2="278" stroke="#C42B8C" stroke-width="2"/>
    <rect x="160" y="278" width="440" height="62" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="380" y="304" font-size="18" fill="#14202B" text-anchor="middle">Steps 4, 5 and 6 are only honest</text>
    <text x="380" y="328" font-size="18" fill="#14202B" text-anchor="middle">because step 3 actually happened.</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Move the seal to after step 4 and the whole timeline stops measuring anything.</text>
  </g>
</svg>
