  <line x1="168.305" y1="96" x2="168.305" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="186.635" y1="96" x2="186.635" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="204.964" y1="96" x2="204.964" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="223.294" y1="96" x2="223.294" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="241.623" y1="96" x2="241.623" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="259.952" y1="96" x2="259.952" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="278.282" y1="96" x2="278.282" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="296.611" y1="96" x2="296.611" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="314.94" y1="96" x2="314.94" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="333.27" y1="96" x2="333.27" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="351.599" y1="96" x2="351.599" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="369.928" y1="96" x2="369.928" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="388.258" y1="96" x2="388.258" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="406.587" y1="96" x2="406.587" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="424.916" y1="96" x2="424.916" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="443.246" y1="96" x2="443.246" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="461.575" y1="96" x2="461.575" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="479.905" y1="96" x2="479.905" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="498.234" y1="96" x2="498.234" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="516.563" y1="96" x2="516.563" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="534.893" y1="96" x2="534.893" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="553.222" y1="96" x2="553.222" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
