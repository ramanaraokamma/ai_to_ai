<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The capstone folder grows in three steps: the test, the system, then the card and the demo</title>
  <desc>Three panels joined by arrows. Week 34, the test before the system: DESIGN.md, eval/cases.py, eval/freeze.py and eval/FROZEN.txt. Week 35, the system and its numbers: src/contract.py, eval/score.py, src/baseline.py, src/guards.py, src/spine.py, eval/run_eval.py, eval/COMMITTED.json, eval/redteam.py and RED_TEAM.md. Week 36, say it twice: SYSTEM_CARD.md, ask.py and demo.py, with a dashed box for Sitting 2, the paper: 75 marks, no computer, no notes. A line below names the pieces from earlier weeks: Week 26 retrieve and cite, Week 28 tool loop, Week 29 trace and cost, Week 30 frozen suite, Week 33 attacks and redaction.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What the capstone folder holds</text>
  <line x1="254" y1="190" x2="274" y2="190" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(274 190) rotate(0)"/>
  <rect x="20" y="64" width="232" height="250" rx="12" fill="#F5F8FA" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="32" y="76" width="208" height="28" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="136" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">Week 34</text>
  <text x="136" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">the test, before the system</text>
  <text x="42" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">DESIGN.md</text>
  <text x="42" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">eval/cases.py</text>
  <text x="42" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">eval/freeze.py</text>
  <text x="42" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">eval/FROZEN.txt</text>
  <line x1="510" y1="190" x2="530" y2="190" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(530 190) rotate(0)"/>
