<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Write the division above the answer</title>
  <desc>Two panels. On the left, a red panel with a cross: the single line precision equals 0.6667, scoring 1 mark out of 4 because nothing says which two numbers were divided. On the right, a green panel with a tick: three lines reading precision equals 40 divided by open bracket 40 plus 20 close bracket, then equals 40 divided by 60, then equals 0.6667 &#8212; scoring 4 out of 4. A note underneath says 40 were flagged as fraud, 40 of them really were and 20 were not, so the division is 40 divided by 60.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Write the division above the answer</text>
  <text x="210" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">1 mark out of 4</text>
  <text x="590" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">4 marks out of 4</text>
  <rect x="40" y="86" width="340" height="200" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="420" y="86" width="340" height="200" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#14202B">precision = 0.6667</text>
  <path d="M331 109 L349 127" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M349 109 L331 127" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">The number is right.</text>
  <text x="60" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Nothing on the page says which</text>
  <text x="60" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">two numbers were divided, so</text>
  <text x="60" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">nothing on the page can be</text>
  <text x="60" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">checked &#8212; not even by you.</text>
  <text x="440" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">precision = 40 &#247; (40 + 20)</text>
  <text x="440" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">          = 40 &#247; 60</text>
  <text x="440" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">          = 0.6667</text>
  <path d="M716 118 L723 126 L736 107" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Same answer. But the 40 and the 60</text>
  <text x="440" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">are named, so a marker can see you</text>
  <text x="440" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">divided by the FLAGGED column &#8212;</text>
  <text x="440" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">and a slip costs 1 mark, not 4.</text>
  <text x="400" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The division is the skill. The answer is only the receipt.</text>
  <rect x="150" y="336" width="500" height="44" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">40 flagged as fraud &#183; 40 of them really were &#183; 20 were not &#8594; 40 &#247; 60</text>
</svg>
