<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five words you already own</title>
  <desc>Five picture tiles. A sealed envelope of fifteen photos for the held-out test set. A dice showing one in three for the baseline. Three bars with fractions for per-class accuracy. A three by three grid with a shaded diagonal for the confusion matrix. Two bars of different heights for the gap.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">No new words this week. Five you already own.</text><rect x="40" y="76" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><rect x="189" y="76" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/><rect x="338" y="76" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/><rect x="487" y="76" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/><rect x="636" y="76" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/><rect x="58" y="118" width="100" height="66" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><path d="M58 118 L108 156 L158 118" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">15 photos</text><rect x="219" y="116" width="76" height="76" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/><circle cx="241" cy="138" r="6" fill="#14202B"/><circle cx="257" cy="154" r="6" fill="#14202B"/><circle cx="273" cy="170" r="6" fill="#14202B"/><text x="257" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">33.3%</text><rect x="360" y="118" width="92" height="18" rx="5" fill="#C42B8C"/><text x="456" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">5/5</text><rect x="360" y="148" width="74" height="18" rx="5" fill="#C42B8C"/><text x="456" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">4/5</text><rect x="360" y="178" width="37" height="18" rx="5" fill="#C42B8C"/><text x="456" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2/5</text><text x="406" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">worst = 2/5</text><rect x="515" y="118" width="26" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/><rect x="541" y="118" width="26" height="26" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/><rect x="567" y="118" width="26" height="26" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/><rect x="515" y="144" width="26" height="26" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/><rect x="541" y="144" width="26" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/><rect x="567" y="144" width="26" height="26" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/><rect x="515" y="170" width="26" height="26" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/><rect x="541" y="170" width="26" height="26" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/><rect x="567" y="170" width="26" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2"/><text x="555" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rows = truth</text><text x="555" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">cols = what it said</text><rect x="666" y="118" width="30" height="78" rx="4" fill="#1B7A4B"/><rect x="712" y="150" width="30" height="46" rx="4" fill="#1F6FB2"/><line x1="681" y1="110" x2="727" y2="110" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/><line x1="681" y1="110" x2="681" y2="118" stroke="#C42B8C" stroke-width="2"/><line x1="727" y1="110" x2="727" y2="150" stroke="#C42B8C" stroke-width="2"/><text x="681" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">train</text><text x="727" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">test</text><text x="108.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">held-out</text><text x="108.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">test set</text><text x="257.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">baseline</text><text x="257.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1 in 3</text><text x="406.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">per-class</text><text x="406.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">accuracy</text><text x="555.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">confusion</text><text x="555.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">matrix</text><text x="704.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the gap</text><text x="704.0" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">train − test</text><text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every one of these five is a number or a grid you can point at. None of them is an opinion.</text>
  </g>
</svg>
