<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Uniform sorter - accuracy by lighting</title>
  <desc>A bar chart of one model's accuracy in three lighting conditions: daylight ninety-two per cent from one hundred and sixty-eight training photos, ceiling light seventy-four per cent from twenty-four training photos, and a lamp at night forty-five per cent from eight training photos. A dashed line marks blind guessing at twenty-five per cent.</desc>
  <text x="250" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Uniform sorter - accuracy by lighting</text>
  <line x1="110" y1="380.0" x2="470" y2="380.0" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="384.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0%</text>
  <line x1="110" y1="307.5" x2="470" y2="307.5" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="311.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">25%</text>
  <line x1="110" y1="235.0" x2="470" y2="235.0" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="239.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">50%</text>
  <line x1="110" y1="162.5" x2="470" y2="162.5" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="166.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">75%</text>
  <line x1="110" y1="90.0" x2="470" y2="90.0" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="100" y="94.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100%</text>
  <rect x="130" y="113.19999999999999" width="80" height="266.8" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="170" y="101.19999999999999" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">92%</text>
  <text x="170" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Daylight</text>
  <text x="170" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">168 training photos</text>
  <rect x="240" y="165.4" width="80" height="214.6" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="280" y="153.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">74%</text>
  <text x="280" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Ceiling light</text>
  <text x="280" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">24 training photos</text>
  <rect x="350" y="249.5" width="80" height="130.5" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="390" y="237.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">45%</text>
  <text x="390" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Lamp at night</text>
  <text x="390" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8 training photos</text>
  <line x1="110" y1="307.5" x2="470" y2="307.5" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5"/>
  <text x="470" y="299.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">blind guessing 25%</text>
  <text x="250" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle"></text>
  <text x="250" y="448" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">Gap  =  92%  -  45%  =  47 percentage points</text>
  <text x="250" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">20 test photos in each condition</text>
</svg>
