<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A controlled experiment is one knob turned and the rest taped down</title>
  <desc>A machine with four dials. The first dial, photos per class, is turned and marked CHANGED in pink with a curved arrow above it. The other three dials, backgrounds, sharpness and class balance, each have a strip of tape across them and are marked taped. Underneath it says 40 photos becomes 5 photos, everything else identical.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">One knob turned. Every other knob taped down.</text>

    <rect x="120" y="90" width="560" height="200" rx="14" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>

    <path d="M178 108 Q210 86 244 110" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
    <polyline points="236,100 246,112 232,116" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="210" cy="170" r="42" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
    <line x1="210" y1="170" x2="233" y2="147" stroke="#C42B8C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="210" cy="170" r="5" fill="#C42B8C"/>

    <circle cx="350" cy="170" r="42" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <line x1="350" y1="170" x2="350" y2="140" stroke="#14202B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="350" cy="170" r="5" fill="#14202B"/>
    <g transform="rotate(-18 350 170)">
      <rect x="296" y="158" width="108" height="22" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <circle cx="490" cy="170" r="42" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <line x1="490" y1="170" x2="490" y2="140" stroke="#14202B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="490" cy="170" r="5" fill="#14202B"/>
    <g transform="rotate(-18 490 170)">
      <rect x="436" y="158" width="108" height="22" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <circle cx="630" cy="170" r="42" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <line x1="630" y1="170" x2="630" y2="140" stroke="#14202B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="630" cy="170" r="5" fill="#14202B"/>
    <g transform="rotate(-18 630 170)">
      <rect x="576" y="158" width="108" height="22" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <g font-size="14" fill="#14202B" text-anchor="middle">
      <text x="210" y="238">photos per class</text>
      <text x="350" y="238">backgrounds</text>
      <text x="490" y="238">sharpness</text>
      <text x="630" y="238">class balance</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="210" y="262" fill="#C42B8C">CHANGED</text>
      <text x="350" y="262" fill="#55636F">taped down</text>
      <text x="490" y="262" fill="#55636F">taped down</text>
      <text x="630" y="262" fill="#55636F">taped down</text>
    </g>

    <text x="400" y="326" font-size="18" fill="#14202B" text-anchor="middle">40 photos each  -&gt;  5 photos each.  Everything else identical.</text>
    <text x="400" y="366" font-size="14" fill="#55636F" text-anchor="middle">Turn two knobs and you can never say which one caused the change.</text>
  </g>
</svg>
