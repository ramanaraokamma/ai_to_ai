<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Say what every line of info() tells you</title>
  <desc>Five stacked bands, numbered one to five in pink circles. Each band carries one line of an info printout in a typewriter face with an empty dashed write-in line underneath it. The lines are the class line, RangeIndex 10 entries 0 to 9, Data columns total 4 columns, the per-column line for steps showing 9 non-null and float64, and the closing dtypes tally. A caption points out that the fourth line is the one with a column name on it and that two of its numbers disagree.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Say what every line of info() tells you</text>
  <rect x="30" y="66" width="740" height="52" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="56" cy="92" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="56" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">&lt;class 'pandas.core.frame.DataFrame'&gt;</text>
  <rect x="80" y="94" width="660" height="18" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="30" y="126" width="740" height="52" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="56" cy="152" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="56" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">RangeIndex: 10 entries, 0 to 9</text>
  <rect x="80" y="154" width="660" height="18" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="30" y="186" width="740" height="52" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="56" cy="212" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="56" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">Data columns (total 4 columns):</text>
  <rect x="80" y="214" width="660" height="18" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="30" y="246" width="740" height="52" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="56" cy="272" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="56" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B"> 3   steps   9 non-null      float64</text>
  <rect x="80" y="274" width="660" height="18" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="30" y="306" width="740" height="52" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="56" cy="332" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="56" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dtypes: float64(3), object(1)</text>
  <rect x="80" y="334" width="660" height="18" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Line 4 is the one with a name on it, so it is the most useful line on the page. Two of its three numbers disagree.</text>
</svg>
