<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A causal attention pass turns scores into weights that sum to 1, then blends the value rows</title>
  <desc>Left, a 3 by 3 grid of attention weights, query rows by key columns, for cat, sat, down. Row cat: 1.0 then two hidden cells. Row sat: 0.3302, 0.6698, hidden. Row down: 0.2483, 0.5035, 0.2483. Each row sums to 1.0; the largest in each row is ringed. Right, the third row blends the value rows cat (2, 2), sat (4, 1) and down (2, 0) with those weights into the output (3.007, 1.0). Practice numbers, not the paper's.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A practice attention pass, by hand then by machine</text>
  <text x="400" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">practice numbers (not the paper's): cat, sat, down; width d = 2</text>
  <text x="215" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">key (being looked at)</text>
  <text x="145" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">cat</text>
  <text x="215" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">sat</text>
