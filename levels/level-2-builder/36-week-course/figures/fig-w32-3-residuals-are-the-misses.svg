  <circle cx="344.6" cy="150.4" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="394.3" cy="150.4" r="7" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="270" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Hours of revision per week</text>
  <text x="50" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 50 220)">Marks out of 100</text>
  <text x="250" y="414" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">miss = what happened  −  what the line said</text>
  <text x="250" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Above the line is a plus, below it is a minus.</text>
  <text x="250" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Pluses and minuses cancel out, so we drop the signs.</text>
