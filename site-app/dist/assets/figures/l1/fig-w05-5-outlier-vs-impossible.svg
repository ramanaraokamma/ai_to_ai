<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Impossible value versus outlier</title>
  <desc>Two number lines. The top line shows sleep hours with a green legal band from zero to sixteen; the recorded nights cluster near eight and a value of eighty eight sits off the end of the scale marked with a cross. The bottom line shows screen minutes, all legal, with a tight cluster near one hundred and twenty and a single triangle at four hundred and eighty marked as an outlier.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Impossible is not the same as unusual</text>

  <text x="100" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">sleep_h &#8212; legal range 0 to 16 hours</text>
  <rect x="100" y="137" width="480" height="26" fill="#E2F7ED" stroke="none"/>
  <rect x="580" y="137" width="120" height="26" fill="#F6AEA6" stroke="none"/>
  <line x1="100" y1="150" x2="700" y2="150" stroke="#14202B" stroke-width="2"/>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="100" y1="163" x2="100" y2="171"/><line x1="220" y1="163" x2="220" y2="171"/>
    <line x1="340" y1="163" x2="340" y2="171"/><line x1="460" y1="163" x2="460" y2="171"/>
    <line x1="580" y1="163" x2="580" y2="171"/><line x1="700" y1="163" x2="700" y2="171"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="100" y="186">0</text><text x="220" y="186">4</text><text x="340" y="186">8</text>
    <text x="460" y="186">12</text><text x="580" y="186">16</text><text x="700" y="186">20</text>
  </g>
  <g>
    <circle cx="295" cy="150" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="310" cy="150" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="325" cy="150" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="340" cy="150" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="355" cy="150" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="370" cy="150" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <line x1="704" y1="150" x2="726" y2="150" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <polyline points="720,143 730,150 720,157" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(736,133) scale(0.34)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="736" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">88</text>
  <text x="100" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">88 is outside what reality allows &#8594; IMPOSSIBLE. Blank the cell and note &#8220;was 88&#8221;.</text>

  <text x="100" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">screen_min &#8212; legal range 0 to 1440 minutes</text>
  <rect x="100" y="271" width="600" height="26" fill="#E2F7ED" stroke="none"/>
  <line x1="100" y1="284" x2="700" y2="284" stroke="#14202B" stroke-width="2"/>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="100" y1="297" x2="100" y2="305"/><line x1="220" y1="297" x2="220" y2="305"/>
    <line x1="340" y1="297" x2="340" y2="305"/><line x1="460" y1="297" x2="460" y2="305"/>
    <line x1="580" y1="297" x2="580" y2="305"/><line x1="700" y1="297" x2="700" y2="305"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="100" y="320">0</text><text x="220" y="320">100</text><text x="340" y="320">200</text>
    <text x="460" y="320">300</text><text x="580" y="320">400</text><text x="700" y="320">500</text>
  </g>
  <g>
    <circle cx="214" cy="284" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="226" cy="284" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="238" cy="284" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="250" cy="284" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="262" cy="284" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="274" cy="284" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="286" cy="284" r="6" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <path d="M676 274 L686 292 L666 292 Z" fill="#845F00" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <line x1="676" y1="270" x2="676" y2="258" stroke="#C42B8C" stroke-width="1.5"/>
  <text x="676" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">480</text>
  <text x="100" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">480 is inside the range, just far from the rest &#8594; OUTLIER. Keep it. Add a note.</text>

  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Circles are ordinary nights. The triangle is the outlier. Shape, not colour, tells you which.</text>
</svg>
