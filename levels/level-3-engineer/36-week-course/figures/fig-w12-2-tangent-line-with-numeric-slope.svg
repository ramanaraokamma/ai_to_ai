<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The slope at one point is a rise over a run</title>
  <desc>The curve f of x equals x times x, with a straight line just touching it at the point 3, 9. Two points half a unit either side are ringed: 2.5, 6.25 and 3.5, 12.25. A dashed horizontal leg of 1.00 and a dashed vertical leg of 6.00 join them. A callout does the arithmetic: f of 3.5 is 3.5 times 3.5 equals 12.25, f of 2.5 is 2.5 times 2.5 equals 6.25, 12.25 minus 6.25 is 6.00, and 6.00 divided by 1.00 is 6.000. The shortcut rule two times x says 6 as well, and so does a much smaller nudge: 0.012 divided by 0.002 equals 6.000.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The slope at one point</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">is a rise over a run</text>
