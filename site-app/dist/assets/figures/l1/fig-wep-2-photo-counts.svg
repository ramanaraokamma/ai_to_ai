  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Read down the boxed column. Every over-ripe banana sat on the chopping board - and nothing else ever did.</text>
