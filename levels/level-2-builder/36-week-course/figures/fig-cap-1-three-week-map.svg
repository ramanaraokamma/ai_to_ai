<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three weeks, seven milestones, about 11 hours</title>
  <desc>Three panels. Week 34, question and data: lock the question, collect 100 plus rows, clean it and write the log, 4 hours 15. Week 35, charts and models: five charts in order, one split and four models, what I got wrong, 4 hours 45. Week 36, tell it to a room: assemble the story, rehearse out loud, showcase day, 2 hours. A red band warns that the order is not negotiable because you cannot hold out rows after you have trained on them.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three weeks, seven milestones, about 11 hours</text>
  <rect x="40" y="82" width="226" height="214" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="153.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">WEEK 34</text>
  <text x="153.0" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Question and data</text>
  <line x1="60" y1="146" x2="246" y2="146" stroke="#1F6FB2" stroke-width="1.5" stroke-linecap="round"/>
  <text x="62" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1 · Lock the question</text>
  <text x="62" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">2 · Collect 100+ rows</text>
  <text x="62" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">3 · Clean it + the log</text>
  <rect x="62" y="246" width="182" height="34" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="153.0" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4 h 15 of work</text>
  <line x1="268" y1="189" x2="285" y2="189" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(285 189) rotate(0.00)"/>
  <rect x="287" y="82" width="226" height="214" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="400.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">WEEK 35</text>
  <text x="400.0" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Charts and models</text>
  <line x1="307" y1="146" x2="493" y2="146" stroke="#6D28D9" stroke-width="1.5" stroke-linecap="round"/>
  <text x="309" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">4 · Five charts, in order</text>
  <text x="309" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">5 · One split, 4 models</text>
  <text x="309" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">6 · What I got wrong</text>
  <rect x="309" y="246" width="182" height="34" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="400.0" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4 h 45 of work</text>
  <line x1="515" y1="189" x2="532" y2="189" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(532 189) rotate(0.00)"/>
  <rect x="534" y="82" width="226" height="214" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="647.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">WEEK 36</text>
  <text x="647.0" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Tell it to a room</text>
  <line x1="554" y1="146" x2="740" y2="146" stroke="#845F00" stroke-width="1.5" stroke-linecap="round"/>
  <text x="556" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">7 · Assemble the story</text>
  <text x="556" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">  · Rehearse out loud</text>
  <text x="556" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">  · SHOWCASE DAY</text>
  <rect x="556" y="246" width="182" height="34" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="647.0" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2 h of work</text>
  <rect x="40" y="312" width="720" height="44" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">The order is not negotiable. You cannot hold out rows AFTER you have trained on them.</text>
  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Add an hour of slack per week. You will need it, and everybody does.</text>
</svg>
