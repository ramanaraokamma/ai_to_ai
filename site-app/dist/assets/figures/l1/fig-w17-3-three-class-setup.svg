<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three classes with real names and their sample counts</title>
  <desc>Three class cards named spoon, toothbrush and comb, each showing six photo thumbnails and a sample count of 41, 40 and 39. A green box underneath shows the balance check: biggest 41 minus smallest 39 equals 2, and 2 divided by 41 is 4.9 percent, which is under the 20 percent limit.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Real names, and the counts checked before you train</text>

    <rect x="40" y="80" width="230" height="190" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <line x1="40" y1="120" x2="270" y2="120" stroke="#1F6FB2" stroke-width="3"/>
    <text x="155" y="106" font-size="18" fill="#14202B" text-anchor="middle">spoon</text>
    <g fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round">
      <rect x="56" y="138" width="56" height="46" rx="6"/>
      <rect x="123" y="138" width="56" height="46" rx="6"/>
      <rect x="190" y="138" width="56" height="46" rx="6"/>
      <rect x="56" y="192" width="56" height="46" rx="6"/>
      <rect x="123" y="192" width="56" height="46" rx="6"/>
      <rect x="190" y="192" width="56" height="46" rx="6"/>
    </g>
    <ellipse cx="84" cy="152" rx="8" ry="11" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
    <line x1="84" y1="163" x2="84" y2="178" stroke="#1F6FB2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="155" y="260" font-size="14" fill="#55636F" text-anchor="middle">41 image samples</text>

    <rect x="285" y="80" width="230" height="190" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <line x1="285" y1="120" x2="515" y2="120" stroke="#1F6FB2" stroke-width="3"/>
    <text x="400" y="106" font-size="18" fill="#14202B" text-anchor="middle">toothbrush</text>
    <g fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round">
      <rect x="301" y="138" width="56" height="46" rx="6"/>
      <rect x="368" y="138" width="56" height="46" rx="6"/>
      <rect x="435" y="138" width="56" height="46" rx="6"/>
      <rect x="301" y="192" width="56" height="46" rx="6"/>
      <rect x="368" y="192" width="56" height="46" rx="6"/>
      <rect x="435" y="192" width="56" height="46" rx="6"/>
    </g>
    <rect x="325" y="146" width="8" height="26" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="2" stroke-linecap="round">
      <line x1="325" y1="146" x2="325" y2="140"/>
      <line x1="329" y1="146" x2="329" y2="140"/>
      <line x1="333" y1="146" x2="333" y2="140"/>
    </g>
    <text x="400" y="260" font-size="14" fill="#55636F" text-anchor="middle">40 image samples</text>

    <rect x="530" y="80" width="230" height="190" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <line x1="530" y1="120" x2="760" y2="120" stroke="#1F6FB2" stroke-width="3"/>
    <text x="645" y="106" font-size="18" fill="#14202B" text-anchor="middle">comb</text>
    <g fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round">
      <rect x="546" y="138" width="56" height="46" rx="6"/>
      <rect x="613" y="138" width="56" height="46" rx="6"/>
      <rect x="680" y="138" width="56" height="46" rx="6"/>
      <rect x="546" y="192" width="56" height="46" rx="6"/>
      <rect x="613" y="192" width="56" height="46" rx="6"/>
      <rect x="680" y="192" width="56" height="46" rx="6"/>
    </g>
    <rect x="562" y="148" width="26" height="8" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="2" stroke-linecap="round">
      <line x1="567" y1="156" x2="567" y2="170"/>
      <line x1="575" y1="156" x2="575" y2="170"/>
      <line x1="583" y1="156" x2="583" y2="170"/>
    </g>
    <text x="645" y="260" font-size="14" fill="#55636F" text-anchor="middle">39 image samples</text>

    <rect x="40" y="286" width="720" height="58" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="310" font-size="16" fill="#14202B" text-anchor="middle">Balance check:  biggest 41  -  smallest 39  =  2</text>
    <text x="400" y="332" font-size="16" fill="#14202B" text-anchor="middle">2 / 41 = 4.9%  -  under 20%, so we are safe to train</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Never leave a class called Class 1. In three days you will not remember which was which.</text>
  </g>
</svg>
