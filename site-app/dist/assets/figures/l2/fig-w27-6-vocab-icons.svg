<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Six icon cards. Truncated axis is a bar chart whose bottom has been sliced off, with the missing length shown as a grey block. Exaggeration factor is a division sum: what your eye sees divided by what is true. Legend is a small box naming a round-marker line and a square-marker line. Correlation is a number line running from minus one through zero to plus one. Causation is one arrow from a first box to a second. A sixth card states the rule of the week: bar charts start at zero.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>

  <rect x="20" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="280" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="540" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="20" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="280" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="540" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 1. truncated axis -->
  <text x="140" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">truncated axis</text>
  <rect x="86" y="152" width="34" height="18" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <rect x="146" y="102" width="34" height="68" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <line x1="70" y1="98" x2="70" y2="170" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="170" x2="210" y2="170" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="70" y="176" width="140" height="16" fill="#C7CDD4"/>
  <text x="140" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">deleted length</text>
  <text x="140" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">an axis that does not start at 0</text>

  <!-- 2. exaggeration factor -->
  <text x="400" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">exaggeration factor</text>
  <rect x="304" y="102" width="192" height="30" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="117" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">what your eye sees: 6.00</text>
  <line x1="304" y1="142" x2="496" y2="142" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="304" y="152" width="192" height="30" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="167" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">what is true: 1.04</text>
  <text x="400" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6.00 divided by 1.04 = 5.76 times</text>

  <!-- 3. legend -->
  <text x="660" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">legend</text>
  <line x1="576" y1="102" x2="576" y2="172" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="576" y1="172" x2="744" y2="172" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="588,158 616,142 644,148 672,124" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="588" cy="158" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="616" cy="142" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="644" cy="148" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="672" cy="124" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <polyline points="588,118 616,132 644,126 672,152" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="584.5" y="114.5" width="7" height="7" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <rect x="612.5" y="128.5" width="7" height="7" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <rect x="640.5" y="122.5" width="7" height="7" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <rect x="668.5" y="148.5" width="7" height="7" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <rect x="684" y="104" width="76" height="46" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="696" cy="118" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="708" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">runs</text>
  <rect x="692.5" y="132.5" width="7" height="7" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <text x="708" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">wides</text>
  <text x="660" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the box that names each line</text>

  <!-- 4. correlation -->
  <text x="140" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">correlation</text>
  <line x1="46" y1="300" x2="234" y2="300" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="46" y1="300" x2="46" y2="308"/>
    <line x1="140" y1="300" x2="140" y2="308"/>
    <line x1="234" y1="300" x2="234" y2="308"/>
  </g>
  <text x="46" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">-1</text>
  <text x="140" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="234" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">+1</text>
  <text x="46" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">opposite</text>
  <text x="140" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">nothing</text>
  <text x="234" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">together</text>
  <circle cx="222" cy="300" r="7" fill="#C42B8C" stroke="#FFFFFF" stroke-width="2"/>
  <text x="222" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">0.93</text>
  <text x="140" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a position, not a percentage</text>

  <!-- 5. causation -->
  <text x="400" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">causation</text>
  <line x1="366" y1="292" x2="418" y2="292" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(422 292) rotate(0)"/>
  <rect x="300" y="272" width="66" height="40" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="333" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">hours</text>
  <rect x="428" y="272" width="66" height="40" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="461" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">marks</text>
  <text x="400" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one thing MAKING the other happen</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">a chart can never show you this arrow</text>

  <!-- 6. the rule -->
  <rect x="560" y="248" width="200" height="52" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">bar chart, axis from 48.6</text>
  <text x="660" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">= a stunt</text>
  <rect x="560" y="308" width="200" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">bar chart, axis from 0</text>
  <text x="660" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">= the truth</text>
  <text x="660" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the rule of the week</text>
</svg>
