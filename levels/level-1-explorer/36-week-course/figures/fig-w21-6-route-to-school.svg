<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two ways to learn the way to school</title>
  <desc>Two panels showing the same walk to school. On the left the route is memorised as landmarks and fails when the big tree is cut down. On the right the route is understood as a direction and still works.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Two ways to learn the way to school</text>

    <line x1="400" y1="66" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <rect x="30" y="66" width="340" height="264" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="200" y="96" font-size="18" fill="#14202B" text-anchor="middle">MEMORISED</text>
    <g font-size="14" fill="#14202B">
      <text x="54" y="130">"Left at the postbox,</text>
      <text x="54" y="154">right at the big tree,</text>
      <text x="54" y="178">straight on past the shop."</text>
    </g>
    <line x1="54" y1="216" x2="346" y2="216" stroke="#C7CDD4" stroke-width="1.5"/>
    <g transform="translate(54,226)">
      <path d="M28 60 L28 28" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="18" r="14" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round">
        <line x1="8" y1="4" x2="48" y2="44"/>
        <line x1="48" y1="4" x2="8" y2="44"/>
      </g>
    </g>
    <text x="130" y="256" font-size="14" fill="#CC2B1D">the tree gets cut down</text>
    <text x="130" y="282" font-size="18" fill="#14202B">completely lost</text>
    <text x="130" y="308" font-size="12" fill="#55636F">on a street walked 400 times</text>

    <rect x="430" y="66" width="340" height="264" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="600" y="96" font-size="18" fill="#14202B" text-anchor="middle">GENERALISED</text>
    <g font-size="14" fill="#14202B">
      <text x="454" y="130">"School is north-east.</text>
      <text x="454" y="154">Head that way and</text>
      <text x="454" y="178">follow the main road."</text>
    </g>
    <line x1="454" y1="216" x2="746" y2="216" stroke="#C7CDD4" stroke-width="1.5"/>
    <g transform="translate(454,226)">
      <path d="M28 60 L28 28" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="18" r="14" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round">
        <line x1="8" y1="4" x2="48" y2="44"/>
        <line x1="48" y1="4" x2="8" y2="44"/>
      </g>
    </g>
    <text x="530" y="256" font-size="14" fill="#1B7A4B">the tree gets cut down</text>
    <text x="530" y="282" font-size="18" fill="#14202B">does not even notice</text>
    <text x="530" y="308" font-size="12" fill="#55636F">north-east is still north-east</text>

    <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">On every normal morning these two look identical. You only find out on the day something changes.</text>
  </g>
</svg>
