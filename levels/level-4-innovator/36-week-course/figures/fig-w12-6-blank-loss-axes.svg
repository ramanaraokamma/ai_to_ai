<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank axes for Week 12 page 12.4: plot train and validation loss at seven steps</title>
  <desc>A blank chart for the page 12.4 table. The horizontal axis is training steps with ticks at 0, 200, 400, 600 and 800 and dotted vertical lines at 100, 200, 300, 400, 600 and 800; the vertical axis is loss from 0 to 3 with horizontal grid lines. No data is drawn. A key shows train as a solid line with circles and validation as a dashed line with squares, and three numbered instructions: mark 14 points, join each series, ring the lowest validation point.</desc>
