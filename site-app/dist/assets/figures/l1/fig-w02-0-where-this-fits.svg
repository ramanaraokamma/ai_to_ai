<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"
     aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The course map after Week 2: both branches of the fork now have a name</title>
  <desc id="d">A machine that decides forks into two branches under the question "where did its rules come from?". The left branch, rules written by a person, is white with a solid ink outline and labelled wk 1 — finished last week: rule-based systems, if-then, first match wins, they fail quietly. The right branch, rules worked out from examples, is the filled-in room this week: it is tinted, solid-outlined and marked "you are here", and it says nobody writes the rule, it studies labelled examples, then training stops. Both branches are now named, so nothing on the map is dashed yet; the nine tiles that will subdivide the learned branch arrive from Week 3. Along the bottom, the six-thread strip has model and learning signal lit and data, representation, evaluation and impact still white.</desc>

  <!-- ── root: solid from week 1, never badged ────────────────────── -->
  <g>
    <rect x="290" y="28" width="220" height="52" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <text x="400" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#14202B">A MACHINE</text>
    <text x="400" y="71" text-anchor="middle" font-size="18" font-weight="700" fill="#14202B">THAT DECIDES</text>
  </g>

  <!-- ── the published fork ───────────────────────────────────────── -->
  <g stroke="#14202B" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M400 80 L400 100"/>
    <path d="M180 100 L620 100"/>
    <path d="M180 100 L180 124"/>
    <path d="M620 100 L620 124"/>
  </g>
  <text x="400" y="118" text-anchor="middle" font-size="14" fill="#55636F">where did its rules come from?</text>

  <!-- ── LEFT LEG: rules written by A PERSON — done in week 1 ─────── -->
  <g>
    <rect x="40" y="124" width="280" height="196" rx="14" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <text x="52" y="143" font-size="12" fill="#55636F">wk 1</text>
    <text x="180" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#14202B">rules written by</text>
    <text x="180" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#14202B">A PERSON</text>
    <line x1="72" y1="188" x2="288" y2="188" stroke="#14202B" stroke-width="1.5"/>
    <text x="180" y="212" text-anchor="middle" font-size="15" fill="#55636F">rule-based systems</text>
    <text x="180" y="234" text-anchor="middle" font-size="15" fill="#55636F">if-then · first match wins</text>
    <text x="180" y="256" text-anchor="middle" font-size="15" fill="#55636F">they fail quietly</text>
  </g>

  <!-- ── RIGHT LEG: rules worked out FROM EXAMPLES — this week ────── -->
  <g>
    <rect x="480" y="124" width="280" height="196" rx="14" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <text x="620" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#14202B">rules worked out</text>
    <text x="620" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#14202B">FROM EXAMPLES</text>
    <line x1="512" y1="188" x2="728" y2="188" stroke="#845F00" stroke-width="1.5"/>
    <text x="620" y="212" text-anchor="middle" font-size="15" fill="#14202B">nobody writes the rule</text>
    <text x="620" y="234" text-anchor="middle" font-size="15" fill="#14202B">it studies labelled examples</text>
    <text x="620" y="256" text-anchor="middle" font-size="15" fill="#14202B">then training stops</text>
    <rect x="526" y="274" width="188" height="32" rx="16" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
    <path d="M544 290 l7 8 l13 -16" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="636" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#1B7A4B">YOU ARE HERE</text>
  </g>

  <!-- ── the six threads ──────────────────────────────────────────── -->
  <g>
    <text x="40" y="350" font-size="13" font-weight="700" fill="#55636F">THE SIX THREADS</text>
    <g font-size="12" text-anchor="middle">
      <rect x="168" y="336" width="86" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="211" y="352" fill="#55636F">data</text>
      <rect x="262" y="336" width="112" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="318" y="352" fill="#55636F">representation</text>
      <rect x="382" y="336" width="72" height="24" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
      <text x="418" y="352" font-weight="700" fill="#14202B">model</text>
      <rect x="462" y="336" width="112" height="24" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
      <text x="518" y="352" font-weight="700" fill="#14202B">learning signal</text>
      <rect x="582" y="336" width="88" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="626" y="352" fill="#55636F">evaluation</text>
      <rect x="678" y="336" width="82" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="719" y="352" fill="#55636F">impact</text>
    </g>
    <text x="400" y="380" text-anchor="middle" font-size="13" fill="#55636F">The fork is complete. Both branches have a name now, and neither one is magic.</text>
  </g>
</svg>
