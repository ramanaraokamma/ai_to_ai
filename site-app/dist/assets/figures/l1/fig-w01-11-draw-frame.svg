<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Drawing frame for Week 1</title>
  <desc>An empty framed box with a dashed inner area for the student to draw a decision loop in, with a label reading Draw here.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="30" y="70" width="740" height="270" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <rect x="52" y="92" width="696" height="226" rx="8" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="7 7"/>
    <rect x="52" y="46" width="190" height="38" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <text x="147" y="65" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">DRAW HERE</text>
    <text x="400" y="366" font-size="14" fill="#55636F" text-anchor="middle">Boxes for steps. Arrows for what happens next. One loop arrow back to the top.</text>
  </g>
</svg>
