<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Why red and green make yellow</title>
  <desc>Two panels. On the left, paint: a red swatch plus a green swatch equals a muddy dark brown swatch, because paint takes light away. On the right, light: a red swatch plus a green swatch equals a yellow swatch, because lamps add light. Below, the sum 255,0,0 plus 0,255,0 equals 255,255,0.</desc>
<text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Why red and green make yellow</text>
<line x1="400" y1="56" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="30" y="56" width="340" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="430" y="56" width="340" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="200" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">PAINT on paper</text>
<text x="600" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">LIGHT on a screen</text>
<rect x="64" y="110" width="56" height="56" rx="8" fill="#FF0000" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="92" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">red</text>
<text x="142" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
<rect x="164" y="110" width="56" height="56" rx="8" fill="#00FF00" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="192" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">green</text>
<text x="242" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
<rect x="264" y="110" width="56" height="56" rx="8" fill="#4F5860" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="292" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">muddy brown</text>
<rect x="464" y="110" width="56" height="56" rx="8" fill="#FF0000" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="492" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">red</text>
<text x="542" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
<rect x="564" y="110" width="56" height="56" rx="8" fill="#00FF00" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="592" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">green</text>
<text x="642" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
<rect x="664" y="110" width="56" height="56" rx="8" fill="#FFFF00" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="692" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">yellow</text>
<text x="200" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Each blob of paint takes some</text>
<text x="200" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">light away. Two paints take away</text>
<text x="200" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">more, so it gets DARKER.</text>
<text x="600" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Each tiny lamp adds light.</text>
<text x="600" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two lamps add more light,</text>
<text x="600" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">so it gets BRIGHTER.</text>
<text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">(255, 0, 0) + (0, 255, 0) = (255, 255, 0) = yellow</text>
<text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A screen has no paint in it. It has three tiny lamps per pixel, and they only ever add.</text>
</svg>
