<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Price the network before building</title>
  <desc>Eight blank rows, one per layer of the CNN, each naming the layer and its in, k and out numbers, with empty dashed boxes for the weights, the biases and the layer total, and a final dashed box for the grand total. The formulas are given at the top: a conv layer is in times k times k times out, plus out, and a linear layer is in times out, plus out. The answers are 80, 0, 0, 1168, 0, 0, 0 and 650, totalling 1898, against Week 23&#8217;s dense network at 4,810.</desc>
  <text x="250" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Price the network before building</text>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a conv layer is (in &#215; k &#215; k &#215; out) + out</text>
  <text x="250" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a linear layer is (in &#215; out) + out</text>
