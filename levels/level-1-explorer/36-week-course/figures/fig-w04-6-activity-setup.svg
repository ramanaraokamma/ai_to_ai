<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Backpack activity: the setup and the finished table</title>
  <desc>Top half shows the four things needed on the desk: the emptied objects, a kitchen scale, a ruler and a record sheet with a pen. Bottom half shows the finished table, eight rows of objects with columns for grams, length in centimetres, colour and pocket.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Turn the Backpack Into a Table</text>

  <rect x="30" y="62" width="440" height="196" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="250" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">On the desk, before you start</text>

  <rect x="62" y="120" width="40" height="28" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="112" cy="112" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <line x1="66" y1="162" x2="112" y2="152" stroke="#845F00" stroke-width="5" stroke-linecap="round"/>

  <rect x="158" y="106" width="66" height="9" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="164" y="115" width="54" height="42" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="174" y="126" width="34" height="16" rx="3" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <text x="191" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">340</text>

  <rect x="252" y="122" width="88" height="24" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#845F00" stroke-width="2" stroke-linecap="round">
    <line x1="264" y1="122" x2="264" y2="133"/><line x1="278" y1="122" x2="278" y2="129"/>
    <line x1="292" y1="122" x2="292" y2="133"/><line x1="306" y1="122" x2="306" y2="129"/>
    <line x1="320" y1="122" x2="320" y2="133"/>
  </g>

  <rect x="368" y="102" width="56" height="68" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="376" y1="120" x2="416" y2="120"/><line x1="376" y1="134" x2="416" y2="134"/>
    <line x1="376" y1="148" x2="416" y2="148"/>
  </g>
  <line x1="430" y1="164" x2="446" y2="120" stroke="#845F00" stroke-width="5" stroke-linecap="round"/>

  <g>
    <circle cx="88" cy="192" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="88" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
    <circle cx="191" cy="192" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="191" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    <circle cx="296" cy="192" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="296" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <circle cx="400" cy="192" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="400" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="88" y="224">8 objects,</text><text x="88" y="240">tipped out</text>
    <text x="191" y="224">kitchen scale</text><text x="191" y="240">in grams</text>
    <text x="296" y="224">30 cm ruler</text><text x="296" y="240">flat on desk</text>
    <text x="400" y="224">record sheet</text><text x="400" y="240">and one pen</text>
  </g>

  <text x="250" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Finished looks like this</text>

  <rect x="40" y="310" width="420" height="308" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M40 318 A8 8 0 0 1 48 310 H452 A8 8 0 0 1 460 318 V346 H40 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="40" y1="380" x2="460" y2="380"/><line x1="40" y1="414" x2="460" y2="414"/>
    <line x1="40" y1="448" x2="460" y2="448"/><line x1="40" y1="482" x2="460" y2="482"/>
    <line x1="40" y1="516" x2="460" y2="516"/><line x1="40" y1="550" x2="460" y2="550"/>
    <line x1="40" y1="584" x2="460" y2="584"/>
    <line x1="160" y1="346" x2="160" y2="618"/><line x1="235" y1="346" x2="235" y2="618"/>
    <line x1="310" y1="346" x2="310" y2="618"/><line x1="385" y1="346" x2="385" y2="618"/>
  </g>
  <line x1="40" y1="346" x2="460" y2="346" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="40" y="310" width="420" height="308" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
    <text x="50" y="328" dominant-baseline="central" fill="#55636F">object</text>
    <text x="170" y="328" dominant-baseline="central" fill="#55636F">grams</text>
    <text x="245" y="328" dominant-baseline="central" fill="#55636F">length_cm</text>
    <text x="320" y="328" dominant-baseline="central" fill="#55636F">colour</text>
    <text x="395" y="328" dominant-baseline="central" fill="#55636F">pocket</text>

    <text x="50" y="363" dominant-baseline="central">pencil</text><text x="170" y="363" dominant-baseline="central">6</text><text x="245" y="363" dominant-baseline="central">18</text><text x="320" y="363" dominant-baseline="central">yellow</text><text x="395" y="363" dominant-baseline="central">front</text>
    <text x="50" y="397" dominant-baseline="central">eraser</text><text x="170" y="397" dominant-baseline="central">12</text><text x="245" y="397" dominant-baseline="central">4</text><text x="320" y="397" dominant-baseline="central">white</text><text x="395" y="397" dominant-baseline="central">front</text>
    <text x="50" y="431" dominant-baseline="central">notebook</text><text x="170" y="431" dominant-baseline="central">210</text><text x="245" y="431" dominant-baseline="central">24</text><text x="320" y="431" dominant-baseline="central">red</text><text x="395" y="431" dominant-baseline="central">main</text>
    <text x="50" y="465" dominant-baseline="central">textbook</text><text x="170" y="465" dominant-baseline="central">640</text><text x="245" y="465" dominant-baseline="central">27</text><text x="320" y="465" dominant-baseline="central">blue</text><text x="395" y="465" dominant-baseline="central">main</text>
    <text x="50" y="499" dominant-baseline="central">water_bottle</text><text x="170" y="499" dominant-baseline="central">500</text><text x="245" y="499" dominant-baseline="central">22</text><text x="320" y="499" dominant-baseline="central">blue</text><text x="395" y="499" dominant-baseline="central">side</text>
    <text x="50" y="533" dominant-baseline="central">lunch_box</text><text x="170" y="533" dominant-baseline="central">380</text><text x="245" y="533" dominant-baseline="central">18</text><text x="320" y="533" dominant-baseline="central">green</text><text x="395" y="533" dominant-baseline="central">main</text>
    <text x="50" y="567" dominant-baseline="central">keys</text><text x="170" y="567" dominant-baseline="central">45</text><text x="245" y="567" dominant-baseline="central">8</text><text x="320" y="567" dominant-baseline="central">grey</text><text x="395" y="567" dominant-baseline="central">front</text>
    <text x="50" y="601" dominant-baseline="central">umbrella</text><text x="170" y="601" dominant-baseline="central">260</text><text x="245" y="601" dominant-baseline="central">30</text><text x="320" y="601" dominant-baseline="central">black</text><text x="395" y="601" dominant-baseline="central">side</text>
  </g>

  <text x="250" y="646" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">8 rows &#215; 4 measured columns. One row = one object.</text>
  <text x="250" y="670" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every gram came off the scale. None were guessed.</text>
</svg>
