  <text x="131.9" y="99.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">2.2760</text>
  <circle cx="210.3" cy="133.1" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
