<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 27</title>
  <desc>An empty framed drawing area headed draw the lie and the fix, side by side. Two blank chart panels sit next to each other, the left one headed LIE with an empty box for the y-axis floor and the right one headed HONEST with the floor already printed as zero. Underneath, four reminder boxes ask for the two millimetre measurements, the ratio the eye sees, the true ratio, and the exaggeration factor.</desc>
  <rect x="24" y="24" width="752" height="272" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: the lie and the fix, side by side, from your own two numbers</text>

  <text x="52" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">my two true numbers, and what they measure</text>
  <rect x="52" y="96" width="696" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <!-- LEFT panel: the lie -->
  <rect x="52" y="134" width="332" height="146" rx="10" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="218" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle">LIE</text>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="112" y1="196" x2="368" y2="196"/>
    <line x1="112" y1="226" x2="368" y2="226"/>
  </g>
  <line x1="112" y1="164" x2="112" y2="256" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="256" x2="368" y2="256" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="244" width="46" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4"/>
  <text x="83" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">floor</text>
  <text x="240" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">draw your two bars here</text>

  <!-- RIGHT panel: the fix -->
  <rect x="416" y="134" width="332" height="146" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="582" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle">HONEST</text>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="476" y1="196" x2="732" y2="196"/>
    <line x1="476" y1="226" x2="732" y2="226"/>
  </g>
  <line x1="476" y1="164" x2="476" y2="256" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="476" y1="256" x2="732" y2="256" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <rect x="428" y="244" width="42" height="22" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="449" y="255" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="604" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">and the same two bars here</text>

  <!-- arithmetic boxes -->
  <text x="52" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">short bar, in mm</text>
  <rect x="52" y="332" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="228" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">tall bar, in mm</text>
  <rect x="228" y="332" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="404" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">tall divided by short</text>
  <rect x="404" y="332" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="580" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">exaggeration factor</text>
  <rect x="580" y="332" width="168" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Measure the bars you drew. Not the numbers you started with.</text>
</svg>
