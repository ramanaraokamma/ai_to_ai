  <text x="230" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">1.75</text>
  <rect x="60" y="164" width="180" height="28" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="82" cy="178.0" r="7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
