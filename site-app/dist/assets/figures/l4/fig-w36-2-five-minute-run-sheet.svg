  <line x1="400" y1="168" x2="400" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2:30</text>
  <line x1="544" y1="168" x2="544" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="544" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3:30</text>
  <line x1="688" y1="168" x2="688" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
