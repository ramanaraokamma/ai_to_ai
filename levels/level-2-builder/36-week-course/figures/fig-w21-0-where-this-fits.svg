  <g font-size="12" text-anchor="middle">
    <rect x="20" y="336" width="103" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="71" y="352" fill="#55636F">toolcraft</text>
    <rect x="129" y="336" width="103" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="180" y="352" fill="#55636F">data</text>
    <rect x="238" y="336" width="103" height="24" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
    <text x="289" y="352" font-weight="700" fill="#14202B">representation</text>
    <rect x="347" y="336" width="103" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="398" y="352" fill="#55636F">model</text>
    <rect x="456" y="336" width="103" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
