<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two filters, two directions</title>
  <desc>The vertical filter, minus one zero plus one in every row, labelled right column minus left column. Beside it the horizontal filter, minus ones on top and plus ones underneath, labelled bottom row minus top row.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two filters, two directions</text>
  <rect x="40" y="80" width="330" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="205" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">Vertical filter</text>
  <rect x="142" y="122" width="42" height="42" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/><text x="163.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">−1</text>
  <rect x="184" y="122" width="42" height="42" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/><text x="205.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="226" y="122" width="42" height="42" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/><text x="247.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+1</text>
  <rect x="142" y="164" width="42" height="42" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/><text x="163.0" y="185.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">−1</text>
  <rect x="184" y="164" width="42" height="42" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/><text x="205.0" y="185.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="226" y="164" width="42" height="42" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/><text x="247.0" y="185.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+1</text>
  <rect x="142" y="206" width="42" height="42" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/><text x="163.0" y="227.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">−1</text>
  <rect x="184" y="206" width="42" height="42" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/><text x="205.0" y="227.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="226" y="206" width="42" height="42" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/><text x="247.0" y="227.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+1</text>
  <text x="205" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" dominant-baseline="central">right column  −  left column</text>
  <text x="205" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">finds LEFT and RIGHT edges</text>
  <rect x="430" y="80" width="330" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="595" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">Horizontal filter</text>
  <rect x="532" y="122" width="42" height="42" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/><text x="553.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">−1</text>
  <rect x="574" y="122" width="42" height="42" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/><text x="595.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">−1</text>
  <rect x="616" y="122" width="42" height="42" fill="#F6AEA6" stroke="#14202B" stroke-width="2"/><text x="637.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">−1</text>
  <rect x="532" y="164" width="42" height="42" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/><text x="553.0" y="185.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="574" y="164" width="42" height="42" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/><text x="595.0" y="185.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="616" y="164" width="42" height="42" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/><text x="637.0" y="185.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="532" y="206" width="42" height="42" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/><text x="553.0" y="227.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+1</text>
  <rect x="574" y="206" width="42" height="42" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/><text x="595.0" y="227.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+1</text>
  <rect x="616" y="206" width="42" height="42" fill="#E2F7ED" stroke="#14202B" stroke-width="2"/><text x="637.0" y="227.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">+1</text>
  <text x="595" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" dominant-baseline="central">bottom row  −  top row</text>
  <text x="595" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">finds TOP and BOTTOM edges</text>
  <line x1="400" y1="80" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The same idea turned ninety degrees. Neither one can see the other one’s edges.</text>
</svg>
