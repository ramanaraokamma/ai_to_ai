<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two bar charts side by side from the same three numbers: on the left the y-axis starts at seventy-two point five and the first bar towers over the others; on the right the y-axis starts at zero and the three bars are almost identical in height</title>
  <desc>Left panel, framed in red and headed THE LIE with set y limits of 72.5 to 74.6: three bars for Blue, Green and Red at 74.4, 72.9 and 73.1, where Blue's bar is nearly five times taller than Green's. Right panel, framed in green and headed THE FIX with set y limits of 0 to 100: the same three values, and the three bars are now almost exactly the same height. A caption states the real gap is 1.5 marks out of 100.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The same three numbers, twice</text>
  <text x="400" y="60" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Nothing changed but where the y-axis starts.</text>
  <rect x="32" y="76" width="340" height="292" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="202.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">THE LIE:  set_ylim(72.5, 74.6)</text>
  <line x1="94" y1="120" x2="94" y2="306" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="306" x2="354" y2="306" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="88" y1="306.0" x2="94" y2="306.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="306.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">72.5</text>
  <line x1="88" y1="213.0" x2="94" y2="213.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="213.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">73.5</text>
  <line x1="88" y1="120.0" x2="94" y2="120.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="120.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">74.6</text>
  <rect x="114" y="137.71428571428476" width="52" height="168.28571428571524" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="140.0" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Blue</text>
  <text x="140.0" y="129.71428571428476" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">74.4</text>
  <rect x="186" y="270.571428571428" width="52" height="35.42857142857203" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="212.0" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Green</text>
  <text x="212.0" y="262.571428571428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">72.9</text>
  <rect x="258" y="252.85714285714323" width="52" height="53.142857142856776" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="284.0" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Red</text>
  <text x="284.0" y="244.85714285714323" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">73.1</text>
  <text x="202.0" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Blue's bar is 4.75x Green's</text>
  <rect x="428" y="76" width="340" height="292" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="598.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">THE FIX:  set_ylim(0, 100)</text>
  <line x1="490" y1="120" x2="490" y2="306" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="490" y1="306" x2="750" y2="306" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="484" y1="306.0" x2="490" y2="306.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="478" y="306.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0</text>
  <line x1="484" y1="213.0" x2="490" y2="213.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="478" y="213.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">50</text>
  <line x1="484" y1="120.0" x2="490" y2="120.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="478" y="120.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">100</text>
  <rect x="510" y="167.61599999999999" width="52" height="138.38400000000001" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="536.0" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Blue</text>
  <text x="536.0" y="159.61599999999999" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">74.4</text>
  <rect x="582" y="170.40599999999998" width="52" height="135.59400000000002" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="608.0" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Green</text>
  <text x="608.0" y="162.40599999999998" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">72.9</text>
  <rect x="654" y="170.034" width="52" height="135.966" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="680.0" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Red</text>
  <text x="680.0" y="162.034" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">73.1</text>
  <text x="598.0" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Blue's bar is 1.02x Green's</text>
  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Real gap: 74.4 - 72.9 = 1.5 marks out of 100. Bars encode LENGTH, so bars need zero.</text>
</svg>
