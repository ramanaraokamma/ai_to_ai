<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The finished board for the shot list worked example</title>
  <desc>A board in two halves. The left half counts the variety plan: five backgrounds, three lights, eight turns and two distances, multiplying to two hundred and forty situations. The right half is a six row numbered shot list with background, light and distance, and the counts adding up to forty photos per object.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="20" y="20" width="760" height="360" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="400" y="56" font-size="24" fill="#14202B" text-anchor="middle">What the board looks like at minute 40</text>
    <line x1="398" y1="76" x2="398" y2="360" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <text x="46" y="104" font-size="18" fill="#14202B">STEP 1 &#8212; the variety plan</text>
    <g font-size="16" fill="#14202B">
      <text x="46" y="140">backgrounds</text>
      <text x="368" y="140" text-anchor="end" fill="#1F6FB2">5</text>
      <text x="46" y="170">lighting kinds</text>
      <text x="368" y="170" text-anchor="end" fill="#1F6FB2">3</text>
      <text x="46" y="200">turns (angles)</text>
      <text x="368" y="200" text-anchor="end" fill="#1F6FB2">8</text>
      <text x="46" y="230">distances</text>
      <text x="368" y="230" text-anchor="end" fill="#1F6FB2">2</text>
    </g>
    <line x1="46" y1="248" x2="368" y2="248" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="278" font-size="16" fill="#14202B">5 &#215; 3 &#215; 8 &#215; 2 =</text>
    <text x="368" y="278" font-size="16" fill="#6D28D9" text-anchor="end">240 situations</text>
    <text x="46" y="312" font-size="14" fill="#55636F">We will shoot only 40 of the 240.</text>
    <text x="46" y="334" font-size="14" fill="#55636F">Spread them out; never repeat one.</text>
    <text x="46" y="356" font-size="14" fill="#CC2B1D">All in one scene = 2 situations.</text>

    <text x="422" y="104" font-size="18" fill="#14202B">STEP 2 &#8212; the shot list, per object</text>
    <g font-size="14" fill="#55636F">
      <text x="422" y="134">#</text>
      <text x="450" y="134">background</text>
      <text x="576" y="134">light</text>
      <text x="668" y="134">how far</text>
      <text x="756" y="134" text-anchor="end">shots</text>
    </g>
    <g font-size="14" fill="#14202B">
      <text x="422" y="162">1</text>
      <text x="450" y="162">desk</text>
      <text x="576" y="162">window</text>
      <text x="668" y="162">close</text>
      <text x="756" y="162" text-anchor="end">6</text>
      <text x="422" y="188">2</text>
      <text x="450" y="188">desk</text>
      <text x="576" y="188">low lamp</text>
      <text x="668" y="188">far</text>
      <text x="756" y="188" text-anchor="end">6</text>
      <text x="422" y="214">3</text>
      <text x="450" y="214">carpet</text>
      <text x="576" y="214">ceiling</text>
      <text x="668" y="214">close</text>
      <text x="756" y="214" text-anchor="end">7</text>
      <text x="422" y="240">4</text>
      <text x="450" y="240">tiles</text>
      <text x="576" y="240">ceiling</text>
      <text x="668" y="240">far</text>
      <text x="756" y="240" text-anchor="end">7</text>
      <text x="422" y="266">5</text>
      <text x="450" y="266">wood table</text>
      <text x="576" y="266">window</text>
      <text x="668" y="266">close</text>
      <text x="756" y="266" text-anchor="end">7</text>
      <text x="422" y="292">6</text>
      <text x="450" y="292">bed sheet</text>
      <text x="576" y="292">low lamp</text>
      <text x="668" y="292">far</text>
      <text x="756" y="292" text-anchor="end">7</text>
    </g>
    <line x1="422" y1="308" x2="756" y2="308" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="422" y="332" font-size="16" fill="#14202B">TOTAL per object</text>
    <text x="756" y="332" font-size="16" fill="#1B7A4B" text-anchor="end">40</text>
    <text x="422" y="358" font-size="14" fill="#55636F">Turn the object one notch of eight between every shot.</text>
  </g>
</svg>
