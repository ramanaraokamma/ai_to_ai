<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Puzzle: the secret colours</title>
  <desc>Four numbered clue cards. Each card has an empty swatch to colour, a two-line clue about the red, green and blue numbers, and an empty bracket for writing the triple.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Puzzle: the secret colours</text><rect x="40" y="68" width="720" height="58" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/><circle cx="66" cy="97" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="66" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text><rect x="94" y="79" width="56" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="166" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">All three numbers are the same,</text><text x="166" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">and they add up to 384.</text><rect x="600" y="79" width="146" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="673" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">( __ , __ , __ )</text><rect x="40" y="134" width="720" height="58" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/><circle cx="66" cy="163" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="66" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text><rect x="94" y="145" width="56" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="166" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Two lamps at full, one lamp off —</text><text x="166" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">and it is the colour of a lemon.</text><rect x="600" y="145" width="146" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="673" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">( __ , __ , __ )</text><rect x="40" y="200" width="720" height="58" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/><circle cx="66" cy="229" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="66" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text><rect x="94" y="211" width="56" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="166" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">The three numbers add up to 255,</text><text x="166" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">and only one lamp is on at all.</text><rect x="600" y="211" width="146" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="673" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">( __ , __ , __ )</text><rect x="40" y="266" width="720" height="58" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/><circle cx="66" cy="295" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="66" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text><rect x="94" y="277" width="56" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="166" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Averaging the three gives exactly 100.</text><text x="166" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Give TWO different triples for this one.</text><rect x="600" y="277" width="146" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="673" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">( __ , __ , __ )</text><text x="400" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One of the four has more than one right answer. Say which, and why that is not a mistake in the puzzle.</text><text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Colour the little swatch in too, if you have the pencils for it.</text>
  </g>
</svg>
