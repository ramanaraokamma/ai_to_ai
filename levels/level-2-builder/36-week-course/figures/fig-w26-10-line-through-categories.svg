<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Shuffle the names and the line changes shape</title>
  <desc>Three panels showing the same three club counts, fourteen twelve and twelve, joined by a line. In each panel the three club names are in a different order along the bottom, so the line climbs, dips or falls. A red note underneath asks what is halfway between art and chess, and answers that there is no such thing, so a line drawn between them is a road to nowhere.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same three numbers, three orders, three different lines</text>

  <!-- panel 1: art, chess, music -->
  <rect x="24" y="60" width="240" height="180" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="66" y1="120" x2="240" y2="120"/>
    <line x1="66" y1="160" x2="240" y2="160"/>
  </g>
  <text x="60" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">14</text>
  <text x="60" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">12</text>
  <line x1="66" y1="96" x2="66" y2="196" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="196" x2="244" y2="196" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="96,160 152,120 210,160" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="96" cy="160" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="152" cy="120" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="210" cy="160" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="96" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">art</text>
  <text x="152" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">chess</text>
  <text x="210" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">music</text>
  <text x="144" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">"chess is a peak"</text>

  <!-- panel 2: chess, music, art -->
  <rect x="280" y="60" width="240" height="180" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="322" y1="120" x2="496" y2="120"/>
    <line x1="322" y1="160" x2="496" y2="160"/>
  </g>
  <text x="316" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">14</text>
  <text x="316" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">12</text>
  <line x1="322" y1="96" x2="322" y2="196" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="322" y1="196" x2="500" y2="196" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="352,120 408,160 466,160" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="352" cy="120" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="408" cy="160" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="466" cy="160" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="352" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">chess</text>
  <text x="408" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">music</text>
  <text x="466" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">art</text>
  <text x="400" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">"clubs are in decline"</text>

  <!-- panel 3: music, art, chess -->
  <rect x="536" y="60" width="240" height="180" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="578" y1="120" x2="752" y2="120"/>
    <line x1="578" y1="160" x2="752" y2="160"/>
  </g>
  <text x="572" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">14</text>
  <text x="572" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">12</text>
  <line x1="578" y1="96" x2="578" y2="196" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="578" y1="196" x2="756" y2="196" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="608,160 664,160 722,120" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="608" cy="160" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="664" cy="160" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="722" cy="120" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="608" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">music</text>
  <text x="664" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">art</text>
  <text x="722" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">chess</text>
  <text x="656" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">"clubs are booming"</text>

  <!-- the question -->
  <rect x="140" y="264" width="520" height="72" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What is halfway between art and chess?</text>
  <text x="400" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Nothing. So the line between them is a road to nowhere.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">If reordering the x axis changes the shape of your chart, you have used the wrong chart.</text>
  <text x="400" y="388" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Six orderings of three names give six lines. Not one of them means anything.</text>
</svg>
