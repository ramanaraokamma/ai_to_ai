<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The surprise meter</title>
  <desc>A falling curve on axes: across is the probability you gave the thing that actually happened, from 0 to 1; up is the surprise, minus ln of that probability, from 0 to 4. Four points are ringed and numbered. Point 1 at p = 0.90 has surprise 0.1053. Point 2 at p = 0.50 has surprise 0.6931. Point 3 at p = 0.10 has surprise 2.3026. Point 4 at p = 0.02 has surprise 3.9120. A dashed line at 0.6931 is labelled a coin flip. A callout works point 4 out: 1 divided by 0.02 is 50, and ln(50) is 3.912023. The curve climbs without limit as p approaches 0, and reaches 0 when p is 1.</desc>
  <rect x="20" y="20" width="460" height="460" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="250" y="54" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The surprise meter</text>
  <text x="250" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;ln(p), where p is what you gave the thing that happened</text>
