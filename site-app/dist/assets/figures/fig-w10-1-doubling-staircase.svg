<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The doubling staircase</title>
  <desc>A staircase of eight even-looking steps. Each step is one more yes or no check and the number of situations printed on it doubles: 2, 4, 8, 16, 32, 64, 128, 256. A dashed gap marked twenty-two more doublings leads to a tall pink column for check thirty holding 1,073,741,824 situations.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Every new check doubles the situations</text>

  <line x1="40" y1="330" x2="780" y2="330" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>

  <rect x="55" y="300" width="58" height="30" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="113" y="270" width="58" height="60" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="171" y="240" width="58" height="90" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="229" y="210" width="58" height="120" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="287" y="180" width="58" height="150" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="345" y="150" width="58" height="180" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="403" y="120" width="58" height="210" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="461" y="90" width="58" height="240" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
    <text x="84" y="318">2</text>
    <text x="142" y="288">4</text>
    <text x="200" y="258">8</text>
    <text x="258" y="228">16</text>
    <text x="316" y="198">32</text>
    <text x="374" y="168">64</text>
    <text x="432" y="138">128</text>
    <text x="490" y="108">256</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="84" y="350">1</text>
    <text x="142" y="350">2</text>
    <text x="200" y="350">3</text>
    <text x="258" y="350">4</text>
    <text x="316" y="350">5</text>
    <text x="374" y="350">6</text>
    <text x="432" y="350">7</text>
    <text x="490" y="350">8</text>
  </g>

  <line x1="530" y1="205" x2="590" y2="205" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="560" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">22 more</text>
  <text x="560" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">doublings</text>

  <rect x="600" y="70" width="160" height="260" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="680" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">check 30</text>
  <text x="680" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">1,073,741,824</text>
  <text x="680" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">situations</text>
  <text x="680" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">30</text>

  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Eight even-looking steps and you are already at 256. Thirty steps is over a billion.</text>
</svg>
