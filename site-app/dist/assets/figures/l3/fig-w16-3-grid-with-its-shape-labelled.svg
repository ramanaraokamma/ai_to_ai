<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same six numbers, three shapes</title>
  <desc>Three blocks of cells. The first, G, is three rows of two: 1 and 2, then 3 and 4, then 5 and 6, labelled shape 3 comma 2. The second, G.T, is two rows of three: 1, 3, 5 then 2, 4, 6, labelled shape 2 comma 3. The third, G.reshape(2, 3), is also two rows of three but reads 1, 2, 3 then 4, 5, 6. A box on the right counts the cells: 3 times 2 is 6 and 2 times 3 is 6, so both shapes hold the same six numbers.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The same six numbers, three shapes</text>
  <text x="112" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">G</text>
  <rect x="72" y="112" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="92.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="112" y="112" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="132.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="72" y="152" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="92.0" y="172.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="112" y="152" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="132.0" y="172.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="72" y="192" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="92.0" y="212.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="112" y="192" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="132.0" y="212.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="72" y="112" width="80" height="120" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="48" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 48 172 48 172)">3 rows</text>
  <text x="112" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 columns</text>
  <rect x="64.0" y="275.0" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="112" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(3, 2)</text>
  <text x="112" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rows first, always</text>
  <text x="320" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">G.T</text>
  <rect x="260" y="132" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="280.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="300" y="132" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="320.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="340" y="132" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="360.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="260" y="172" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="280.0" y="192.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="300" y="172" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="320.0" y="192.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="340" y="172" width="40" height="40" fill="#D9EAF9" stroke="#14202B" stroke-width="2"/>
  <text x="360.0" y="192.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="260" y="132" width="120" height="80" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="236" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 236 172 236 172)">2 rows</text>
  <text x="320" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 columns</text>
  <rect x="272.0" y="275.0" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="320" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(2, 3)</text>
  <text x="320" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">flipped over its diagonal</text>
  <text x="560" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">G.reshape(2, 3)</text>
  <rect x="500" y="132" width="40" height="40" fill="#DBCEF3" stroke="#14202B" stroke-width="2"/>
  <text x="520.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="540" y="132" width="40" height="40" fill="#DBCEF3" stroke="#14202B" stroke-width="2"/>
  <text x="560.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="580" y="132" width="40" height="40" fill="#DBCEF3" stroke="#14202B" stroke-width="2"/>
  <text x="600.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="500" y="172" width="40" height="40" fill="#DBCEF3" stroke="#14202B" stroke-width="2"/>
  <text x="520.0" y="192.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="540" y="172" width="40" height="40" fill="#DBCEF3" stroke="#14202B" stroke-width="2"/>
  <text x="560.0" y="192.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="580" y="172" width="40" height="40" fill="#DBCEF3" stroke="#14202B" stroke-width="2"/>
  <text x="600.0" y="192.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="500" y="132" width="120" height="80" rx="8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="476" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 476 172 476 172)">2 rows</text>
  <text x="560" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 columns</text>
  <rect x="512.0" y="275.0" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/><text x="560" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(2, 3)</text>
  <text x="560" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">same shape, different numbers</text>
  <rect x="660" y="112" width="120" height="152" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="720" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">count them</text>
  <line x1="672" y1="148" x2="768" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="720" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3 &#215; 2 = 6</text>
  <text x="720" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2 &#215; 3 = 6</text>
  <line x1="672" y1="210" x2="768" y2="210" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="720" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">6 = 6, so</text>
  <text x="720" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">both are legal</text>
  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Read G.T and G.reshape(2, 3) side by side: same shape (2, 3), different numbers in the cells.</text>
</svg>
