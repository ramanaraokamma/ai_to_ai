<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>TinyGPT is a tree: two tables, four Blocks, a norm and an output layer, with 64 places of width 128 flowing through</title>
  <desc>A left-to-right row of boxes. Character ids with shape (32, 64) go into two tables, tok with 28 rows and pos with 64 rows, then through a stack of four Block boxes, a last layer norm ln_f and an output layer head, and come out as 28 scores per place with shape (32, 64, 28). Shape chips below read (32, 64, 128) after the tables and after the blocks, and the last norm keeps the same shape. Two rows of chips list the children of the model: tok, pos, blocks, ln_f, head, and the children of one Block: ln1, q, k, v, proj, ln2, up, act, down.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">TinyGPT: shapes in, shapes out</text>
  <rect x="40" y="90" width="70" height="80" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="75" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">ids</text>
  <line x1="110" y1="130" x2="132" y2="130" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(132 130) rotate(0)"/>
