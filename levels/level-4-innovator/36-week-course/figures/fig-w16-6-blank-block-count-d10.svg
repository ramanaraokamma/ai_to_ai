<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank worksheet for Week 16 page 16.4 Part B: the knob count of each of the nine parts at d = 10</title>
  <desc>A blank worksheet. Nine grey boxes name the parts of one block: attention half ln1 LayerNorm(d), q, k and v each Linear(d, d) with no bias, proj Linear(d, d); MLP half ln2 LayerNorm(d), up Linear(d, 4d), act GELU(), down Linear(4d, d). Beside each is an empty dashed box for the knob count at d = 10. At the bottom are two empty dashed boxes for the total counted the long way and the total from the formula 12 times 10 times 10 plus 10 times 10, and an empty tick box for whether they agree.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Page 16.4 Part B: count one block at d = 10</text>
