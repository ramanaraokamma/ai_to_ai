<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>A 7 x 7 grayscale picture, as numbers only</title>
  <desc>A seven by seven grid of brightness numbers with rows labelled r1 to r7 and columns c1 to c7. Row 2 is bright, value 255, from column 2 to column 6. Column 4 is bright, value 255, from row 2 to row 6. Every other cell is 0. The bright cells form the shape of a capital letter T.</desc>
