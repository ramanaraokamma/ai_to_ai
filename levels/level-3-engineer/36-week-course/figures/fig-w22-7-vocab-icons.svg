  <circle cx="678" cy="100" r="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <line x1="671" y1="93" x2="685" y2="107" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="685" y1="93" x2="671" y2="107" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <circle cx="702" cy="100" r="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="726" cy="100" r="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <line x1="719" y1="93" x2="733" y2="107" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="733" y1="93" x2="719" y2="107" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <circle cx="750" cy="100" r="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="702" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 of 5 switched off</text>
  <text x="702" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">dropout</text>
  <text x="702" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">units off at random,</text>
  <text x="702" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">only while training</text>
  <text x="400" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the whole week in five pictures &#8212; the loss does the squash, so the model must not</text>
