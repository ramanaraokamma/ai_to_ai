<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <title>Label the eight questions</title>
  <desc>Eight empty boxes in two columns, labelled Q1 to Q8, each with a long blank for the question and a second blank underneath labelled my number. Below them a red strip lists the seven banned words: production-ready, scalable, it just works, robust, real-time, seamless, 99 percent accurate. At the bottom the eight questions are listed out of order for the student to place: what happens if I send it something weird, how fast is it, how do you know it still works next month, somebody says it got their comment wrong, why 127.0.0.1, is it any good, who should not use this, and could you retrain it on its own log.</desc>
