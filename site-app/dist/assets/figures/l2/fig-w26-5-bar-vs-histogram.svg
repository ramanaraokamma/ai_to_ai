<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Bars have gaps. Histogram bars touch.</title>
  <desc>Two panels. The left shows three separated bars labelled chess, music and art with their counts printed above. The right shows six touching bars whose x axis is numbered 40 to 100 at the bar edges rather than in the middle.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Bars have gaps. Histogram bars touch.</text>
  <text x="205" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">bar chart</text>
  <rect x="24" y="70" width="362" height="230" rx="12" fill="None" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="70" y1="96" x2="70" y2="270" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="270" x2="360" y2="270" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="62" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="62" y="189" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">8</text>
  <line x1="70" y1="185" x2="360" y2="185" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="62" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">16</text>
  <line x1="70" y1="100" x2="360" y2="100" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="90" y="121.6" width="60" height="148.4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="120" y="113.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">14</text>
  <text x="120" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">chess</text>
  <rect x="180" y="142.8" width="60" height="127.2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="210" y="134.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">12</text>
  <text x="210" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">music</text>
  <rect x="270" y="142.8" width="60" height="127.2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="134.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">12</text>
  <text x="300" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">art</text>
  <text x="595" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">histogram</text>
  <rect x="414" y="70" width="362" height="230" rx="12" fill="None" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="460" y1="96" x2="460" y2="270" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="460" y1="270" x2="750" y2="270" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="452" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="452" y="189" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">4</text>
  <line x1="460" y1="185" x2="750" y2="185" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="452" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">8</text>
  <line x1="460" y1="100" x2="750" y2="100" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="470" y="207" width="46" height="63" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="516" y="144" width="46" height="126" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="562" y="123" width="46" height="147" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="608" y="102" width="46" height="168" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="654" y="102" width="46" height="168" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="700" y="144" width="46" height="126" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="470" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">40</text>
  <text x="516" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">50</text>
  <text x="562" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">60</text>
  <text x="608" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">70</text>
  <text x="654" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">80</text>
  <text x="700" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">90</text>
  <text x="746" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <text x="205" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">one bar per CATEGORY</text>
  <text x="205" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the gaps say: these do not join up</text>
  <text x="595" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">one bar per NUMBER RANGE</text>
  <text x="595" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no gaps: 50 to 60 touches 60 to 70</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Both are rectangles. Only one of them counts a category.</text>
</svg>
