<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The gap between training and held-out accuracy</title>
  <desc>A bar chart with two bars. Training photos score 100 percent, held-out photos score 73.3 percent. A double headed arrow between the bar tops is labelled gap equals 26.7 points. A dashed line across both bars marks the 33.3 percent blind guessing baseline.</desc>
<text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The gap is the story</text><g stroke="#C7CDD4" stroke-width="1.5">
  <line x1="90" y1="390.0" x2="390" y2="390.0"/>
  <line x1="90" y1="315.0" x2="390" y2="315.0"/>
  <line x1="90" y1="240.0" x2="390" y2="240.0"/>
  <line x1="90" y1="165.0" x2="390" y2="165.0"/>
  <line x1="90" y1="90.0" x2="390" y2="90.0"/>
</g>
<text x="80" y="394.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text><text x="80" y="319.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">25</text><text x="80" y="244.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">50</text><text x="80" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">75</text><text x="80" y="94.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100</text><rect x="120" y="90.0" width="80" height="300.0" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
<rect x="250" y="170.1" width="80" height="219.9" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
<text x="160" y="78.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">100%</text><text x="290" y="158.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">73.3%</text><line x1="225" y1="90.0" x2="225" y2="170.1" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
<polyline points="218,100.0 225,90.0 232,100.0" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="218,160.1 225,170.1 232,160.1" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="234" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C">gap = 26.7 points</text><text x="234" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">of memorising</text><line x1="90" y1="290.1" x2="398" y2="290.1" stroke="#CC2B1D" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"/>
<text x="404" y="286.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">baseline</text><text x="404" y="304.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">33.3%</text><line x1="90" y1="390" x2="390" y2="390" stroke="#14202B" stroke-width="2"/>
<text x="160" y="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Training photos</text><text x="160" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(it studied these)</text><text x="290" y="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Held-out photos</text><text x="290" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(it had never seen these)</text><text x="250" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">100% on your own study material is ordinary.</text><text x="250" y="480" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Only the gap to the held-out score tells you anything.</text></svg>
