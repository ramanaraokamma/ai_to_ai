  <rect x="70" y="124" width="172" height="120" rx="6" fill="#D9EAF9" stroke="none"/>
  <circle cx="106" cy="152" r="14" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M70 244 L128 196 L164 226 L196 202 L242 244 Z" fill="#1F6FB2" stroke="none"/>
