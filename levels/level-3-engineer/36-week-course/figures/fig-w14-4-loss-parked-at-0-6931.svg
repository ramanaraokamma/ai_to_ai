<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A loss parked at 0.6931</title>
  <desc>A chart of log loss against training step, 0 to 500 across and 0 to 1 up. The loss is a flat horizontal line at 0.6931 for all 500 steps, marked with a ringed point at the end reading 0.6931. Beside it the arithmetic: the model answered 0.50 to every row, so each row costs minus ln of 0.50, which is 0.6931, four rows shown, and the mean is 0.693147, which is exactly ln of 2. A note says 0.6931 is not a fault in the data; it is the model saying it has not learned anything.</desc>
  <rect x="20" y="20" width="760" height="360" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A loss parked at 0.6931</text>
  <line x1="94" y1="330" x2="528" y2="330" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="330" x2="94" y2="76" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="310" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">training step</text>
  <text x="56" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 56 200)">log loss</text>
  <line x1="88" y1="330.0" x2="94" y2="330.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="84" y="334.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.0</text>
  <line x1="88" y1="280.0" x2="94" y2="280.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="84" y="284.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.2</text>
  <line x1="88" y1="230.0" x2="94" y2="230.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="84" y="234.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.4</text>
  <line x1="88" y1="180.0" x2="94" y2="180.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="84" y="184.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.6</text>
  <line x1="88" y1="130.0" x2="94" y2="130.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="84" y="134.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.8</text>
  <line x1="88" y1="80.0" x2="94" y2="80.0" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="84" y="84.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1.0</text>
  <line x1="94.0" y1="330" x2="94.0" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="94.0" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="180.0" y1="330" x2="180.0" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180.0" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <line x1="266.0" y1="330" x2="266.0" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="266.0" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">200</text>
  <line x1="352.0" y1="330" x2="352.0" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="352.0" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">300</text>
  <line x1="438.0" y1="330" x2="438.0" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="438.0" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">400</text>
  <line x1="524.0" y1="330" x2="524.0" y2="336" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="524.0" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">500</text>
  <line x1="94" y1="156.7" x2="524" y2="156.7" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="142.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">500 steps, and it has not moved</text>
  <circle cx="524" cy="156.7" r="9" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3"/>
  <text x="520" y="186.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">0.6931</text>
  <rect x="548" y="74" width="232" height="148" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="562" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">the model said 0.50</text>
  <text x="562" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">to every single row:</text>
  <text x="562" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">row 1   &#8722;ln(0.50) = 0.6931</text>
  <text x="562" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">row 2   &#8722;ln(0.50) = 0.6931</text>
  <text x="562" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">row 3   &#8722;ln(0.50) = 0.6931</text>
  <text x="562" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">row 4   &#8722;ln(0.50) = 0.6931</text>
  <rect x="548" y="238" width="232" height="122" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="562" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">mean = 0.693147</text>
  <text x="562" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">and ln(2) = 0.693147</text>
  <text x="562" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">0.6931 is not a bug in the</text>
  <text x="562" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">data. It is the model saying</text>
  <text x="562" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">"I have not learned anything".</text>
</svg>
