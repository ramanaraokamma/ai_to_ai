<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the three families</title>
  <desc>Four empty nested boxes with numbered pins and dashed writing lines, for the student to label as artificial intelligence, rule-based, machine learning and generative AI.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="30" y="60" width="740" height="262" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <circle cx="60" cy="90" r="15" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="60" y="91" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
    <line x1="86" y1="96" x2="430" y2="96" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="55" y="116" width="300" height="188" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
    <circle cx="85" cy="146" r="15" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="85" y="147" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    <line x1="110" y1="152" x2="332" y2="152" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5">
      <line x1="80" y1="200" x2="332" y2="200"/>
      <line x1="80" y1="234" x2="332" y2="234"/>
      <line x1="80" y1="268" x2="332" y2="268"/>
    </g>
    <text x="205" y="186" font-size="12" fill="#55636F" text-anchor="middle">write two examples you met this week</text>

    <rect x="385" y="116" width="360" height="188" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3"/>
    <circle cx="415" cy="146" r="15" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="415" y="147" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <line x1="440" y1="152" x2="722" y2="152" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="410" y1="186" x2="722" y2="186" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="405" y="204" width="320" height="88" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3"/>
    <circle cx="435" cy="232" r="15" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="435" y="233" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    <line x1="460" y1="238" x2="702" y2="238" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="430" y1="274" x2="702" y2="274" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5"/>

    <text x="400" y="352" font-size="14" fill="#55636F" text-anchor="middle">Write one family name on each numbered line. Word bank: artificial intelligence &#183;</text>
    <text x="400" y="374" font-size="14" fill="#55636F" text-anchor="middle">rule-based &#183; machine learning &#183; generative AI. The nesting is part of the answer.</text>
  </g>
</svg>
