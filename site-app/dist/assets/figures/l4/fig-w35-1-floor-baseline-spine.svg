  <text x="236" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">out of scope  n=3</text>
  <rect x="250" y="218" width="200" height="14" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="450" cy="225" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="462" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">baseline 2/3</text>
  <rect x="250" y="235" width="200" height="14" rx="3" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="445" y="237" width="10" height="10" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="462" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start" dominant-baseline="central">v1 2/3</text>
  <text x="236" y="271" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">adversarial  n=3</text>
  <circle cx="250" cy="263" r="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
