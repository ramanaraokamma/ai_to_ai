<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four cards and a hidden twin</title>
  <desc>Four feature card fronts side by side, each showing four measured values. Two of the four cards carry identical values on every line, so no tester could ever tell them apart.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four cards. Two of them are twins.</text>

  <rect x="26" y="66" width="176" height="212" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="218" y="66" width="176" height="212" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="410" y="66" width="176" height="212" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="602" y="66" width="176" height="212" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>

  <line x1="26" y1="100" x2="202" y2="100" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="218" y1="100" x2="394" y2="100" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="410" y1="100" x2="586" y2="100" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="602" y1="100" x2="778" y2="100" stroke="#1F6FB2" stroke-width="3"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="114" y="90">CARD 04</text>
    <text x="306" y="90">CARD 09</text>
    <text x="498" y="90">CARD 13</text>
    <text x="690" y="90">CARD 18</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="42" y="132">length: 14.0</text>
    <text x="42" y="164">weight: 6</text>
    <text x="42" y="196">colour: blue</text>
    <text x="42" y="228">material: plastic</text>
    <text x="42" y="260">hollow: yes</text>

    <text x="234" y="132">length: 17.5</text>
    <text x="234" y="164">weight: 5</text>
    <text x="234" y="196">colour: yellow</text>
    <text x="234" y="228">material: wood</text>
    <text x="234" y="260">hollow: no</text>

    <text x="426" y="132">length: 14.0</text>
    <text x="426" y="164">weight: 6</text>
    <text x="426" y="196">colour: blue</text>
    <text x="426" y="228">material: plastic</text>
    <text x="426" y="260">hollow: yes</text>

    <text x="618" y="132">length: 4.5</text>
    <text x="618" y="164">weight: 9</text>
    <text x="618" y="196">colour: white</text>
    <text x="618" y="228">material: rubber</text>
    <text x="618" y="260">hollow: no</text>
  </g>

  <text x="400" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Which two are the twins — and what does that prove about the deck?</text>
  <text x="400" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Then: invent a sixth feature that would split them, with its unit and its measuring instruction.</text>
  <line x1="120" y1="378" x2="680" y2="378" stroke="#55636F" stroke-width="1.5"/>
</svg>
