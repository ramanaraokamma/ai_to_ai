  <circle cx="308.9" cy="192" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="318.9" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">1.7127</text>
  <circle cx="415.4" cy="231.7" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="425.4" y="223.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">1.4991</text>
  <polygon points="526.9,274.2 534.9,282.2 526.9,290.2 518.9,282.2" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <rect x="520.9" y="232.5" width="12" height="12" rx="2" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="575" y="286.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">line predicted 1.2654</text>
  <text x="575" y="242.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">measured 1.4656</text>
  <line x1="540.9" y1="240.5" x2="540.9" y2="280.2" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <rect x="575" y="96" width="205" height="100" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="585" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">the line, from 4 points:</text>
  <text x="585" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">slope &#8722;0.1262</text>
  <text x="585" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">10&#215; knobs: loss &#215; 0.748</text>
  <text x="585" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">2&#215; knobs: loss &#215; 0.916</text>
  <rect x="575" y="212" width="205" height="30" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="677" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">15.8% worse than the line</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Circles: widths 16 to 128. Diamond: predicted for width 256. Square: what it scored.</text>
</svg>
