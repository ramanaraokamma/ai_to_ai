<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" role="img">
  <title>A log entry without a reason is not a log entry</title>
  <desc>A numbered cleaning log on a note. Four entries each give what was done on the left and why on the right, with a green tick at the end. Entry three, highlighted in red, has nothing written in the why column and carries a red cross instead.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A log entry without a reason is not a log entry</text>
  <rect x="28" y="76" width="744" height="262" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="44" y="92" width="712" height="230" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="60" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">CLEANING LOG</text>
  <text x="60" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what I did</text>
  <text x="390" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">why I did it</text>
  <line x1="56" y1="152" x2="744" y2="152" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="64" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">1.</text>
  <text x="84" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Filled 3 blank ages with 13</text>
  <text x="390" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">13 is the median, so one silly age cannot drag it</text>
  <circle cx="724" cy="172" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="718,173 722,177 730,167" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="56" y1="195" x2="744" y2="195" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="64" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">2.</text>
  <text x="84" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Turned age from writing into numbers</text>
  <text x="390" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">three rows said "unknown" and blocked astype</text>
  <circle cx="724" cy="210" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="718,211 722,215 730,205" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="56" y1="233" x2="744" y2="233" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="56" y="236" width="688" height="32" rx="6" fill="#F6AEA6"/>
  <text x="64" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">3.</text>
  <text x="84" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Filled 1 blank hours with 3.5</text>
  <text x="390" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">(nothing written here)</text>
  <circle cx="724" cy="248" r="11" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"><line x1="719" y1="243" x2="729" y2="253"/><line x1="729" y1="243" x2="719" y2="253"/></g>
  <line x1="56" y1="271" x2="744" y2="271" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="64" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">4.</text>
  <text x="84" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Found 1 duplicate row, did NOT remove it</text>
  <text x="390" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">no tool for it until next week, so it is flagged</text>
  <circle cx="724" cy="286" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="718,287 722,291 730,281" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Entry 3 filled a hole and never said why. In six weeks nobody, including you, will know.</text>
  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every repair is a decision. The log is where the decision is written down.</text>
</svg>
