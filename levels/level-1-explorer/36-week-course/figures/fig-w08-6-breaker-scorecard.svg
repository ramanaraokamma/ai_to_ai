<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Five messages built to break the rulebook</title>
  <desc>A five row scorecard. Each row gives the message, the first rule that fired, what the rulebook said, the truth, and the result. Four rows are wrong: three false alarms and one miss. Only one row is correct.</desc>
  <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Five messages built to break the rulebook</text>
  <path d="M30 96 A8 8 0 0 1 38 88 H762 A8 8 0 0 1 770 96 V120 H30 Z" fill="#D9EAF9"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="30" y1="158" x2="770" y2="158"/>
    <line x1="30" y1="196" x2="770" y2="196"/>
    <line x1="30" y1="234" x2="770" y2="234"/>
    <line x1="30" y1="272" x2="770" y2="272"/>
    <line x1="320" y1="88" x2="320" y2="310"/>
    <line x1="470" y1="88" x2="470" y2="310"/>
    <line x1="560" y1="88" x2="560" y2="310"/>
    <line x1="650" y1="88" x2="650" y2="310"/>
  </g>
  <line x1="30" y1="120" x2="770" y2="120" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="30" y="88" width="740" height="222" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="42" y="110" font-size="14" fill="#14202B">the message</text>
  <text x="395" y="110" font-size="14" fill="#14202B" text-anchor="middle">first rule that fires</text>
  <text x="515" y="110" font-size="14" fill="#14202B" text-anchor="middle">says</text>
  <text x="605" y="110" font-size="14" fill="#14202B" text-anchor="middle">truth</text>
  <text x="710" y="110" font-size="14" fill="#14202B" text-anchor="middle">result</text>
  <text x="42" y="143" font-size="12" fill="#14202B">"I PASSED MY PIANO EXAM!!"</text>
  <text x="395" y="143" font-size="12" fill="#14202B" text-anchor="middle">RULE 1  ("!!")</text>
  <text x="515" y="143" font-size="14" fill="#14202B" text-anchor="middle">spam</text>
  <text x="605" y="143" font-size="14" fill="#14202B" text-anchor="middle">ham</text>
  <g transform="translate(650,127) scale(0.24)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
  <text x="680" y="143" font-size="12" fill="#CC2B1D">FALSE ALARM</text>
  <text x="42" y="181" font-size="12" fill="#14202B">"Your parcel is delayed."</text>
  <text x="395" y="181" font-size="12" fill="#14202B" text-anchor="middle">DEFAULT</text>
  <text x="515" y="181" font-size="14" fill="#14202B" text-anchor="middle">ham</text>
  <text x="605" y="181" font-size="14" fill="#14202B" text-anchor="middle">spam</text>
  <g transform="translate(650,165) scale(0.24)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
  <text x="680" y="181" font-size="12" fill="#CC2B1D">MISS</text>
  <text x="42" y="219" font-size="12" fill="#14202B">"Free period tomorrow?"</text>
  <text x="395" y="219" font-size="12" fill="#14202B" text-anchor="middle">RULE 2  ("free")</text>
  <text x="515" y="219" font-size="14" fill="#14202B" text-anchor="middle">spam</text>
  <text x="605" y="219" font-size="14" fill="#14202B" text-anchor="middle">ham</text>
  <g transform="translate(650,203) scale(0.24)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
  <text x="680" y="219" font-size="12" fill="#CC2B1D">FALSE ALARM</text>
  <text x="42" y="257" font-size="12" fill="#14202B">"can you bring my charger today"</text>
  <text x="395" y="257" font-size="12" fill="#14202B" text-anchor="middle">RULE 3  (30 chars)</text>
  <text x="515" y="257" font-size="14" fill="#14202B" text-anchor="middle">spam</text>
  <text x="605" y="257" font-size="14" fill="#14202B" text-anchor="middle">ham</text>
  <g transform="translate(650,241) scale(0.24)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
  <text x="680" y="257" font-size="12" fill="#CC2B1D">FALSE ALARM</text>
  <text x="42" y="295" font-size="12" fill="#14202B">"can you bring my charger back"</text>
  <text x="395" y="295" font-size="12" fill="#14202B" text-anchor="middle">DEFAULT</text>
  <text x="515" y="295" font-size="14" fill="#14202B" text-anchor="middle">ham</text>
  <text x="605" y="295" font-size="14" fill="#14202B" text-anchor="middle">ham</text>
  <g transform="translate(650,279) scale(0.24)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="680" y="295" font-size="12" fill="#1B7A4B">correct</text>
  <rect x="30" y="330" width="360" height="50" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="210" y="361" font-size="18" fill="#14202B" text-anchor="middle">1 out of 5 = 0.2 = 20%</text>
  <rect x="410" y="330" width="360" height="50" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="590" y="361" font-size="16" fill="#14202B" text-anchor="middle">3 false alarms  -  1 miss  -  0 scams caught</text>
</svg>
