<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the nudge</title>
  <desc>The curve is f of x equals x times x and the point is x equals 5, with a nudge of 0.001. Five numbered rows each have an empty dashed pink box: row one is 5.001 times 5.001, row two is 4.999 times 4.999, row three is row one minus row two which is the rise, row four is the distance from 4.999 to 5.001 which is the run, and row five is row three divided by row four, the slope. A green panel then asks for the shortcut rule two times x at x equals 5, which is 10, and whether the measured slope and the rule agree, with a tick or a cross. A final panel warns that six decimal places are needed on rows one and two, because rounding to three decimals gives 0.020 instead of 0.020000 and loses the answer.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the nudge</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">f(x) = x &#215; x, at x = 5, with a nudge of 0.001.</text>
  <rect x="30" y="90" width="440" height="70" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="114" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="80" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">5.001 &#215; 5.001</text>
  <text x="80" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">six decimal places</text>
  <rect x="320" y="104" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="172" width="440" height="70" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="196" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="80" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">4.999 &#215; 4.999</text>
  <text x="80" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">six decimal places</text>
  <rect x="320" y="186" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="254" width="440" height="70" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="278" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="80" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">row 1 &#8722; row 2</text>
  <text x="80" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the rise</text>
  <rect x="320" y="268" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="336" width="440" height="70" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="360" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="80" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">5.001 &#8722; 4.999</text>
  <text x="80" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the run, and it is TWO nudges</text>
  <rect x="320" y="350" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="418" width="440" height="70" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="442" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="56" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="80" y="447" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">row 3 &#247; row 4</text>
  <text x="80" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the slope at x = 5</text>
  <rect x="320" y="432" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="500" width="440" height="82" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="524" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1B7A4B">now the shortcut rule, and the check</text>
  <text x="46" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">2 &#215; x  at x = 5  =</text>
  <rect x="220" y="536" width="90" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="46" y="574" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">do row 5 and the rule agree?  tick / cross</text>
  <rect x="30" y="594" width="440" height="82" rx="10" fill="#F5F8FA" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="618" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#CC2B1D">&#9888; six decimals on rows 1 and 2, always</text>
  <text x="46" y="644" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">round to three and row 3 reads 0.020, not</text>
  <text x="46" y="668" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.020000, and the answer walks away</text>
</svg>
