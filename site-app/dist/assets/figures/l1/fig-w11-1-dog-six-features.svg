<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six measurable features of one dog</title>
  <desc>A cartoon dog seen from the side with six numbered pins on it: mass on the body, shoulder height with a dashed vertical line, ear length on the ear, coat colour on the flank, white paws on the front feet, and tail length on the tail. A numbered list on the right gives the six measured values.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six measurable features of one dog</text>

  <line x1="60" y1="324" x2="540" y2="324" stroke="#C7CDD4" stroke-width="1.5"/>

  <path d="M240 210 Q206 176 224 146" fill="none" stroke="#1F6FB2" stroke-width="6" stroke-linecap="round"/>
  <rect x="266" y="272" width="18" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="300" y="272" width="18" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="368" y="272" width="18" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="402" y="272" width="18" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="264" y="304" width="22" height="20" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="366" y="304" width="22" height="20" rx="7" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="330" cy="235" rx="92" ry="50" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <path d="M432 154 Q408 146 402 182 Q400 208 420 208 Q436 200 434 172 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="452" cy="190" r="40" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="478" y="196" width="46" height="28" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="522" cy="210" r="7" fill="#14202B"/>
  <circle cx="462" cy="180" r="4" fill="#14202B"/>

  <line x1="352" y1="192" x2="352" y2="322" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 6"/>

  <g>
    <circle cx="300" cy="238" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="300" y="239" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
    <circle cx="352" cy="292" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="352" y="293" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    <circle cx="418" cy="176" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="418" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <circle cx="286" cy="204" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="286" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    <circle cx="326" cy="312" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="326" y="313" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
    <circle cx="222" cy="150" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="222" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  </g>

  <text x="566" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">One row of features</text>
  <line x1="566" y1="84" x2="772" y2="84" stroke="#C7CDD4" stroke-width="1.5"/>
  <g>
    <circle cx="578" cy="112" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="578" y="113" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="596" y="117" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">mass &#8212; 12,400 g</text>
    <circle cx="578" cy="150" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="578" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="596" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">shoulder height &#8212; 46 cm</text>
    <circle cx="578" cy="188" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="578" y="189" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="596" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">ear length &#8212; 14 cm</text>
    <circle cx="578" cy="226" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="578" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
    <text x="596" y="231" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">coat colour &#8212; brown</text>
    <circle cx="578" cy="264" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="578" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
    <text x="596" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">white paws &#8212; 2</text>
    <circle cx="578" cy="302" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="578" y="303" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
    <text x="596" y="307" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">tail length &#8212; 31 cm</text>
  </g>

  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The machine gets these six values. Nothing else about the dog exists for it.</text>
</svg>
