<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The training pipeline</title>
  <desc>Four stages left to right. Labelled example photos, drawn in grey because they are put away afterwards, go into training. Training produces a model, drawn in purple. The model then makes guesses about new photos.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Examples go in once. A model comes out.</text>

    <g transform="translate(182,162) scale(0.38)">
      <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(382,162) scale(0.38)">
      <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(582,162) scale(0.38)">
      <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="20" y="96" width="160" height="166" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/>
    <g transform="translate(50,118)">
      <g transform="rotate(-11 50 54) translate(-5 -7)">
        <rect x="24" y="26" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(7 50 54) translate(6 -4)">
        <rect x="24" y="26" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <rect x="24" y="26" width="52" height="52" rx="7" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
      <line x1="32" y1="40" x2="68" y2="40" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="52" x2="68" y2="52" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="64" x2="56" y2="64" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="100" y="238" font-size="12" fill="#55636F" text-anchor="middle">put away afterwards</text>
    <text x="100" y="286" font-size="18" fill="#14202B" text-anchor="middle">1. Examples</text>
    <text x="100" y="308" font-size="14" fill="#55636F" text-anchor="middle">120 photos, each</text>
    <text x="100" y="326" font-size="14" fill="#55636F" text-anchor="middle">with a name on it</text>

    <rect x="220" y="96" width="160" height="166" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(230,128)">
      <rect x="28" y="14" width="84" height="72" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
      <rect x="18" y="38" width="14" height="20" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
      <rect x="108" y="38" width="14" height="20" rx="4" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="#14202B" stroke-width="3" stroke-linecap="round">
        <line x1="84" y1="50" x2="89" y2="50"/>
        <line x1="79.9" y1="59.9" x2="83.4" y2="63.4"/>
        <line x1="70" y1="64" x2="70" y2="69"/>
        <line x1="60.1" y1="59.9" x2="56.6" y2="63.4"/>
        <line x1="56" y1="50" x2="51" y2="50"/>
        <line x1="60.1" y1="40.1" x2="56.6" y2="36.6"/>
        <line x1="70" y1="36" x2="70" y2="31"/>
        <line x1="79.9" y1="40.1" x2="83.4" y2="36.6"/>
      </g>
      <circle cx="70" cy="50" r="14" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
      <circle cx="70" cy="50" r="5" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
    </g>
    <text x="300" y="238" font-size="12" fill="#55636F" text-anchor="middle">about 20 seconds, once</text>
    <text x="300" y="286" font-size="18" fill="#14202B" text-anchor="middle">2. Training</text>
    <text x="300" y="308" font-size="14" fill="#55636F" text-anchor="middle">50 passes over</text>
    <text x="300" y="326" font-size="14" fill="#55636F" text-anchor="middle">all 120 photos</text>

    <rect x="420" y="96" width="160" height="166" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(450,116)">
      <path d="M50 14 C34 14 24 24 24 36 C13 41 12 55 22 62 C22 76 34 87 50 87 C66 87 78 76 78 62 C88 55 87 41 76 36 C76 24 66 14 50 14 Z" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
      <line x1="50" y1="15" x2="50" y2="86" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
      <g fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round">
        <path d="M37 28 C45 33 45 43 37 47"/>
        <path d="M63 28 C55 33 55 43 63 47"/>
        <path d="M35 57 C45 61 45 71 37 75"/>
        <path d="M65 57 C55 61 55 71 63 75"/>
      </g>
    </g>
    <text x="500" y="238" font-size="12" fill="#55636F" text-anchor="middle">a few megabytes</text>
    <text x="500" y="286" font-size="18" fill="#14202B" text-anchor="middle">3. Model</text>
    <text x="500" y="308" font-size="14" fill="#55636F" text-anchor="middle">the only thing</text>
    <text x="500" y="326" font-size="14" fill="#55636F" text-anchor="middle">you keep</text>

    <rect x="620" y="96" width="160" height="166" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(650,118)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="700" y="238" font-size="12" fill="#55636F" text-anchor="middle">again and again</text>
    <text x="700" y="286" font-size="18" fill="#14202B" text-anchor="middle">4. Guesses</text>
    <text x="700" y="308" font-size="14" fill="#55636F" text-anchor="middle">on brand new</text>
    <text x="700" y="326" font-size="14" fill="#55636F" text-anchor="middle">photos, forever</text>

    <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">Box 1 is grey because after training the photos are gone. The model is not a copy of them.</text>
  </g>
</svg>
