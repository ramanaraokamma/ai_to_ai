<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 20</title>
  <desc>An empty framed drawing area titled Draw the number that lies, with a wide upper strip for one overall bar and a lower strip for three per class bars, plus three reminder boxes underneath.</desc>
  <rect x="24" y="24" width="752" height="296" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: one honest-looking overall bar, and the three bars hiding under it</text>
  <text x="60" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">THE HEADLINE (one bar)</text>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8">
    <rect x="56" y="104" width="688" height="52" rx="10" fill="none"/>
    <rect x="56" y="186" width="688" height="112" rx="10" fill="none"/>
  </g>
  <text x="60" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">WHAT IT WAS COVERING UP (three bars, one per class)</text>
  <line x1="286" y1="104" x2="286" y2="298" stroke="#C42B8C" stroke-width="3" stroke-dasharray="10 6" stroke-linecap="round"/>
  <text x="286" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">baseline 33.3%</text>
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="60" y="342" width="200" height="36" rx="8"/>
    <rect x="300" y="342" width="200" height="36" rx="8"/>
    <rect x="540" y="342" width="200" height="36" rx="8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="60" y="338">the fraction, written out</text>
    <text x="300" y="338">the class you would circle</text>
    <text x="540" y="338">the gap, in points</text>
  </g>
</svg>
