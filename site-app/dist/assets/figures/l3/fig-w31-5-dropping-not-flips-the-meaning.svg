<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Drop the word not and the meaning flips</title>
  <desc>Two reviews, the pizza was not cold from a happy customer and the pizza was cold from an unhappy one. A stopword list removes the, was and not from the first and the, was from the second, struck through in grey with not struck through in red. Both are left with the same two kept words, pizza and cold, so both rows read pizza 1, cold 1. A red cross marks the result: two opposite reviews with one identical row, because the stopword list deleted the only word carrying the meaning.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Drop the word not and the meaning flips</text>
  <text x="150" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">a happy customer</text>
  <rect x="24" y="86" width="252" height="38" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="150" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">the pizza was not cold</text>
  <line x1="286" y1="105" x2="320" y2="105" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(320 105) rotate(0)"/>
  <text x="303" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">drop</text>
  <rect x="330" y="86" width="62" height="38" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="361" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">the</text>
  <line x1="336" y1="105" x2="386" y2="105" stroke="#C7CDD4" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="396" y="86" width="62" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="427" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pizza</text>
  <rect x="462" y="86" width="62" height="38" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="493" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">was</text>
  <line x1="468" y1="105" x2="518" y2="105" stroke="#C7CDD4" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="528" y="86" width="62" height="38" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="559" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">not</text>
  <line x1="534" y1="105" x2="584" y2="105" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="594" y="86" width="62" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="625" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">cold</text>
  <text x="460" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">the row: ( pizza 1, cold 1 )</text>
  <text x="150" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">an unhappy customer</text>
  <rect x="24" y="212" width="252" height="38" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="150" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">the pizza was cold</text>
  <line x1="286" y1="231" x2="320" y2="231" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(320 231) rotate(0)"/>
  <text x="303" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">drop</text>
  <rect x="330" y="212" width="62" height="38" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="361" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">the</text>
  <line x1="336" y1="231" x2="386" y2="231" stroke="#C7CDD4" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="396" y="212" width="62" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="427" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pizza</text>
  <rect x="462" y="212" width="62" height="38" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="493" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">was</text>
  <line x1="468" y1="231" x2="518" y2="231" stroke="#C7CDD4" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="528" y="212" width="62" height="38" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="559" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">cold</text>
  <text x="460" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">the row: ( pizza 1, cold 1 )</text>
  <rect x="322" y="78" width="358" height="172" rx="10" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="718.8" y1="152.8" x2="741.2" y2="175.2"/><line x1="741.2" y1="152.8" x2="718.8" y2="175.2"/></g>
  <rect x="24" y="300" width="752" height="58" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Two opposite reviews, one identical row.</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">The stopword list threw away the only word that carried the meaning.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">not has three letters, so the regex keeps it. The stopword list deletes it.</text>
</svg>
