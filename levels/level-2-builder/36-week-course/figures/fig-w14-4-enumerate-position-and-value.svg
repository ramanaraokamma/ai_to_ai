<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>enumerate hands you two things at once</title>
  <desc>A circular arrow with a counter reading position 2 sits on the left. Two output boxes in the middle show the position 2 and the record for Nita. On the right a four row table has row 2 highlighted, and its index cell also reads 2.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">enumerate hands you two things at once</text>
  <path d="M144 122 A48 48 0 1 1 96 122" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(96 122) rotate(-30)"/>
  <circle cx="120" cy="164" r="34" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
