<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>An overall gain can hide a falling category, and one ticket can be the whole fall</title>
  <desc>Per-category accuracy before and after LoRA, seed 0: greeting 0.833 to 0.833 on 6 tickets, refund 1.000 to 1.000 on 7, technical 0.286 to 0.571 on 7 (up), billing 0.400 to 0.200 on 5 (down, outlined as a regression), out_of_scope 0.400 to 0.400 on 5, overall 0.600 to 0.633 on 30. The weighted pieces are plus 0.0667 and minus 0.0333, summing to plus 0.0333.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The average rose; one row fell</text>
