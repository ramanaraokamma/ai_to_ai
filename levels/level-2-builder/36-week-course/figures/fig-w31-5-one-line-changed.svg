<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img">
  <title>Only the model box changes</title>
  <desc>Four numbered stages left to right: the same table, the same cut into 120 and 30 rows, a different model where a kNN chip is struck through and a tree chip is ticked, and the same score of 0.9667.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Only the model box changes</text>
  <rect x="34" y="84" width="156" height="96" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="112" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1. the same table</text>
  <rect x="226" y="84" width="156" height="96" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="304" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2. the same cut</text>
  <rect x="418" y="84" width="156" height="96" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="496" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3. a DIFFERENT model</text>
  <rect x="610" y="84" width="156" height="96" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="688" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4. the same score</text>
  <line x1="194" y1="132" x2="222" y2="132" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(222 132) rotate(0)"/>
  <line x1="386" y1="132" x2="414" y2="132" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(414 132) rotate(0)"/>
  <line x1="578" y1="132" x2="606" y2="132" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(606 132) rotate(0)"/>
  <rect x="430" y="96" width="132" height="30" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="496" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">kNN</text>
  <line x1="438" y1="111" x2="554" y2="111" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="430" y="138" width="132" height="30" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="496" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">tree</text>
  <rect x="46" y="100" width="132" height="62" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <line x1="46" y1="120" x2="178" y2="120" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="90" y1="100" x2="90" y2="162" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="134" y1="100" x2="134" y2="162" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="46" y1="141" x2="178" y2="141" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="250" y="96" width="108" height="72" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="250" y1="148" x2="358" y2="148" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="304" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">120</text>
  <text x="304" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">30</text>
  <text x="688" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.9667</text>
  <text x="688" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">test accuracy</text>
  <text x="400" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One line of the file is different. Everything either side of it is byte-identical.</text>
</svg>
