<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three lines of typing turn a decoration into evidence</title>
  <desc>Three panels of the same rising line. The first has no words and is outlined in red. The second adds both axis labels and is outlined in amber. The third adds a title stating the finding and is outlined in green.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three lines of typing turn a decoration into evidence</text>
  <text x="141" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Rung 1 - a decoration</text>
  <rect x="20" y="78" width="242" height="196" rx="12" fill="None" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="78" y1="116" x2="78" y2="244" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="244" x2="246" y2="244" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="90.0,240.0 128.0,217.2 166.0,224.8 204.0,188.7 242.0,154.5" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90.0" cy="240.0" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="128.0" cy="217.2" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="166.0" cy="224.8" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="204.0" cy="188.7" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="242.0" cy="154.5" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="141" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">It rises. So what?</text>
  <text x="399" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Rung 2 - half a sentence</text>
  <rect x="278" y="78" width="242" height="196" rx="12" fill="None" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <line x1="336" y1="116" x2="336" y2="244" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="336" y1="244" x2="504" y2="244" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="348.0,240.0 386.0,217.2 424.0,224.8 462.0,188.7 500.0,154.5" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="348.0" cy="240.0" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="386.0" cy="217.2" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="424.0" cy="224.8" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="462.0" cy="188.7" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="500.0" cy="154.5" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="420" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">School week</text>
  <text x="318" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 318 180)">Visits (count)</text>
  <text x="399" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Rises in what, measured how?</text>
  <text x="657" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Rung 3 - evidence</text>
  <rect x="536" y="78" width="242" height="196" rx="12" fill="None" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="665" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">Visits climbed 60%</text>
  <line x1="594" y1="116" x2="594" y2="244" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="594" y1="244" x2="762" y2="244" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="606.0,240.0 644.0,217.2 682.0,224.8 720.0,188.7 758.0,154.5" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="606.0" cy="240.0" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="644.0" cy="217.2" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="682.0" cy="224.8" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="720.0" cy="188.7" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="758.0" cy="154.5" r="4.5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="678" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">School week</text>
  <text x="576" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 576 180)">Visits (count)</text>
  <text x="657" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Now you can argue with it.</text>
  <line x1="262" y1="176" x2="272" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(272 176) rotate(0.0)"/>
  <line x1="520" y1="176" x2="530" y2="176" stroke="#14202B" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(530 176) rotate(0.0)"/>
  <text x="400" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Rung 2 adds set_xlabel and set_ylabel. Rung 3 adds set_title.</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same numbers, same pixels of line. Only the words changed.</text>
</svg>
