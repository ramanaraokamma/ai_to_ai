<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"
     aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The course map after Week 1: one branch of two is filled in</title>
  <desc id="d">A machine that decides splits into two branches. The left branch, rules written by a
  person, is filled in and marked "you are here" — it holds if-then rules, first match wins, and
  quiet failure. The right branch, rules worked out from examples, is an empty dashed box marked
  week 2. A footer strip shows the six course threads with only Model lit.</desc>

  <!-- ── root ─────────────────────────────────────────────────────── -->
  <g>
    <rect x="290" y="28" width="220" height="52" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
    <text x="400" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#14202B">A MACHINE</text>
    <text x="400" y="71" text-anchor="middle" font-size="18" font-weight="700" fill="#14202B">THAT DECIDES</text>
  </g>

  <!-- ── the fork ─────────────────────────────────────────────────── -->
  <g stroke="#14202B" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M400 80 L400 100"/>
    <path d="M180 100 L620 100"/>
    <path d="M180 100 L180 124"/>
    <path d="M620 100 L620 124"/>
  </g>
  <text x="400" y="118" text-anchor="middle" font-size="14" fill="#55636F">where did its rules come from?</text>

  <!-- ── LEFT: done this week ─────────────────────────────────────── -->
  <g>
    <rect x="40" y="124" width="280" height="196" rx="14" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <text x="180" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#14202B">rules written by</text>
    <text x="180" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#14202B">A PERSON</text>
    <line x1="72" y1="188" x2="288" y2="188" stroke="#845F00" stroke-width="1.5"/>
    <text x="180" y="212" text-anchor="middle" font-size="15" fill="#14202B">rule-based systems</text>
    <text x="180" y="234" text-anchor="middle" font-size="15" fill="#14202B">if-then · first match wins</text>
    <text x="180" y="256" text-anchor="middle" font-size="15" fill="#14202B">they fail quietly</text>
    <!-- you are here badge -->
    <rect x="86" y="274" width="188" height="32" rx="16" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3"/>
    <path d="M104 290 l7 8 13 -16" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="196" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#1B7A4B">YOU ARE HERE</text>
  </g>

  <!-- ── RIGHT: still empty, on purpose ──────────────────────────── -->
  <g>
    <rect x="480" y="124" width="280" height="196" rx="14" fill="none"
          stroke="#C7CDD4" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="620" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#55636F">rules worked out</text>
    <text x="620" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#55636F">FROM EXAMPLES</text>
    <line x1="512" y1="188" x2="728" y2="188" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="620" y="222" text-anchor="middle" font-size="15" fill="#55636F">nobody writes them</text>
    <text x="620" y="246" text-anchor="middle" font-size="15" fill="#55636F">and that is strange</text>
    <rect x="536" y="274" width="168" height="32" rx="16" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="620" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#55636F">WEEK 2</text>
  </g>

  <!-- ── the six threads, only Model lit ─────────────────────────── -->
  <g>
    <text x="40" y="350" font-size="13" font-weight="700" fill="#55636F">THE SIX THREADS</text>
    <g font-size="12" text-anchor="middle">
      <rect x="168" y="336" width="86" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="211" y="352" fill="#55636F">data</text>
      <rect x="262" y="336" width="112" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="318" y="352" fill="#55636F">representation</text>
      <rect x="382" y="336" width="72" height="24" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2.5"/>
      <text x="418" y="352" font-weight="700" fill="#14202B">model</text>
      <rect x="462" y="336" width="112" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="518" y="352" fill="#55636F">learning signal</text>
      <rect x="582" y="336" width="88" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="626" y="352" fill="#55636F">evaluation</text>
      <rect x="678" y="336" width="82" height="24" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
      <text x="719" y="352" fill="#55636F">impact</text>
    </g>
    <text x="400" y="380" text-anchor="middle" font-size="13" fill="#55636F">
      Week 1 adds to one thread. The other five start in the weeks ahead.</text>
  </g>
</svg>
