<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label it: what else is in the file?</title>
  <desc>On the left a photo of a sun over a hill, labelled what you see. An arrow leads to a panel on the right headed hidden inside the same file, with five numbered blank lines for the student to fill in.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label it: what else is in the file?</text>
