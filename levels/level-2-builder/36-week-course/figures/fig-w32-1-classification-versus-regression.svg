<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Which one? or how much?</title>
  <desc>Two panels. On the left, classification: three named boxes, setosa ticked and the other two crossed, because an answer is right or wrong. On the right, regression: a number line from 40 to 80 with the truth at 63 and the guess at 73, labelled off by 10 marks.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Which one? or how much?</text>
  <line x1="400" y1="74" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="210" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">CLASSIFICATION</text>
  <text x="600" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">REGRESSION</text>
  <rect x="30" y="88" width="360" height="226" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="410" y="88" width="360" height="226" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <rect x="60" y="116" width="190" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="155" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">setosa</text>
  <rect x="60" y="168" width="190" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="155" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">versicolor</text>
  <rect x="60" y="220" width="190" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="155" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">virginica</text>
  <polyline points="272,140 279,147 292,132" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="272" y1="190" x2="288" y2="206"/><line x1="288" y1="190" x2="272" y2="206"/></g>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="272" y1="242" x2="288" y2="258"/><line x1="288" y1="242" x2="272" y2="258"/></g>
  <text x="210" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">right, or wrong. Nothing in between.</text>
  <line x1="452" y1="200" x2="730" y2="200" stroke="#14202B" stroke-width="2"/>
  <line x1="452.0" y1="200" x2="452.0" y2="208" stroke="#55636F" stroke-width="1.5"/>
  <text x="452.0" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">40</text>
  <line x1="521.5" y1="200" x2="521.5" y2="208" stroke="#55636F" stroke-width="1.5"/>
  <text x="521.5" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">50</text>
  <line x1="591.0" y1="200" x2="591.0" y2="208" stroke="#55636F" stroke-width="1.5"/>
  <text x="591.0" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">60</text>
  <line x1="660.5" y1="200" x2="660.5" y2="208" stroke="#55636F" stroke-width="1.5"/>
  <text x="660.5" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">70</text>
  <line x1="730.0" y1="200" x2="730.0" y2="208" stroke="#55636F" stroke-width="1.5"/>
  <text x="730.0" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">80</text>
  <circle cx="591" cy="200" r="8" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2"/>
  <text x="591" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">truth 63</text>
  <path d="M660 181 L669 197.2 L651 197.2 Z" fill="#6D28D9" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="668" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">guess 73</text>
  <line x1="591" y1="156" x2="591" y2="176" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="660" y1="232" x2="660" y2="250" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="560" y="116" width="172" height="28" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="646" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">off by 10 marks</text>
  <text x="600" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">wrong by an AMOUNT, with a unit</text>
  <text x="210" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Look at the label column.</text>
  <text x="210" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A short fixed list → classify.</text>
  <text x="600" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Look at the label column.</text>
  <text x="600" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Any number on a scale → regress.</text>
</svg>
