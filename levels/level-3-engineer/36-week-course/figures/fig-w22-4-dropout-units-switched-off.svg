  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">our real hidden layer has 64 units, so 0.3 &#215; 64 &#8776; 19 go off each step, and a different 19 next step</text>
