<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The Level 3 gate: all six, or go back</title>
  <desc>A gate between two posts made of six horizontal bars, each ticked and each carrying one requirement: the assessment score, the finished capstone, blank-file fluency, reading a shape error, explaining leakage, and drawing the overfitting graph.</desc>
<text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The Level 3 gate: all six, or go back</text>
<rect x="40" y="76" width="22" height="270" rx="6" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<rect x="738" y="76" width="22" height="270" rx="6" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<rect x="62" y="88" width="676" height="32" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
<circle cx="92" cy="104" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="86.82352941176471,104.6470588235294 90.38235294117646,108.52941176470588 97.82352941176471,100.11764705882354" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">42 or more on the written assessment, and no single module holding four mistakes</text>
<rect x="62" y="132" width="676" height="32" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
<circle cx="92" cy="148" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="86.82352941176471,148.64705882352942 90.38235294117646,152.52941176470588 97.82352941176471,144.11764705882354" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">The capstone finished, not started: log, five charts, three models, admissions</text>
<rect x="62" y="176" width="676" height="32" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
<circle cx="92" cy="192" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="86.82352941176471,192.64705882352942 90.38235294117646,196.52941176470588 97.82352941176471,188.11764705882354" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">A working function with a loop and an if inside it, from memory, in five minutes</text>
<rect x="62" y="220" width="676" height="32" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
<circle cx="92" cy="236" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="86.82352941176471,236.64705882352942 90.38235294117646,240.52941176470588 97.82352941176471,232.11764705882354" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">Given a shape error, I can name both shapes and the fix without running it</text>
<rect x="62" y="264" width="676" height="32" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
<circle cx="92" cy="280" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="86.82352941176471,280.6470588235294 90.38235294117646,284.52941176470586 97.82352941176471,276.11764705882354" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">I can explain leakage using StandardScaler in a minute, and its direction</text>
<rect x="62" y="308" width="676" height="32" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
<circle cx="92" cy="324" r="11" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="86.82352941176471,324.6470588235294 90.38235294117646,328.52941176470586 97.82352941176471,320.11764705882354" fill="none" stroke="#1B7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">I can draw the overfitting graph on a napkin: both lines, both axes labelled</text>
<text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Six honest ticks. A tick you argued yourself into does not count as a tick.</text>
</svg>
