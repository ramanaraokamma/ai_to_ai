<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank page: for each week ring the guess you made, shade your percentage, and pick at most two redos</title>
  <desc>A blank fill-in figure with eight columns, Week 1 to Week 8. Above each column are three empty circles marked Y, M and N for yes, maybe and no. Below them an empty bar track runs from 0% to 100% with a dashed 60% redo line. Under each column is the week number and its marks available: 11, 10, 10, 9, 8, 8, 7 and 12. No answers are drawn.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Confidence map: my guess, my mark</text>
