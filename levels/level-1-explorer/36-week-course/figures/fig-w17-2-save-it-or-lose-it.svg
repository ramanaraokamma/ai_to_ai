<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Save it or lose it</title>
  <desc>Two panels. The left panel, marked with a cross, shows a browser tab being closed and an empty window, with the note model gone and forty minutes gone. The right panel, marked with a tick, shows the menu path: menu at top left, then download project as file, then a saved file called baseline-v1 dot t m.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="44" font-size="24" fill="#14202B" text-anchor="middle">Save it, or lose it</text>

    <line x1="400" y1="80" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <rect x="40" y="80" width="330" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(56,92) scale(0.44)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <text x="118" y="120" font-size="18" fill="#14202B">You closed the tab</text>
    <path d="M70 152 V142 H150 V152" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="70" y="152" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round">
      <line x1="132" y1="140" x2="144" y2="152"/>
      <line x1="144" y1="140" x2="132" y2="152"/>
    </g>
    <text x="180" y="217" font-size="14" fill="#55636F" text-anchor="middle">nothing left in here</text>
    <text x="70" y="302" font-size="14" fill="#14202B">Model gone. Forty minutes gone.</text>

    <rect x="430" y="80" width="330" height="250" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(446,92) scale(0.44)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="508" y="120" font-size="18" fill="#14202B">You downloaded it</text>

    <rect x="460" y="146" width="230" height="30" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#14202B" stroke-width="2" stroke-linecap="round">
      <line x1="472" y1="155" x2="486" y2="155"/>
      <line x1="472" y1="161" x2="486" y2="161"/>
      <line x1="472" y1="167" x2="486" y2="167"/>
    </g>
    <text x="498" y="166" font-size="14" fill="#14202B">menu, top-left corner</text>
    <line x1="575" y1="178" x2="575" y2="192" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="568,185 575,194 582,185" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="460" y="198" width="230" height="30" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="575" y="218" font-size="14" fill="#14202B" text-anchor="middle">Download project as file</text>
    <line x1="575" y1="230" x2="575" y2="244" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="568,237 575,246 582,237" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="460" y="250" width="230" height="30" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M474 256 H486 L492 262 V274 H474 Z" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
    <text x="502" y="270" font-size="14" fill="#14202B">baseline-v1.tm</text>

    <text x="460" y="308" font-size="14" fill="#14202B">It is on your disk. Go and find it now.</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">There is no autosave. Closing the tab deletes the model for good.</text>
  </g>
</svg>
