  <rect x="428" y="192" width="116" height="34" fill="#E2F7ED"/>
  <text x="332.0" y="209" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">False</text>
