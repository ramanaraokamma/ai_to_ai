<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>98.6% accurate, nothing caught</title>
  <desc>Two confusion matrices side by side on the same 1000 validation orders. On the left, the model that never says yes: 986 true negatives, 0 false positives, 14 false negatives, 0 true positives, accuracy 986 divided by 1000 equals 0.9860, frauds caught 0 of 14. On the right, a real decision tree: 979, 7, 11 and 3, accuracy 982 divided by 1000 equals 0.9820, frauds caught 3 of 14. The caption says accuracy went down by 0.0040 and the model got better.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">98.6% accurate, nothing caught</text>
