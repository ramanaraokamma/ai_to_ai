  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(407 137) rotate(0)"/>
  <line x1="465" y1="137" x2="483" y2="137" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
