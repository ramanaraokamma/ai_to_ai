<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same two numbers, drawn two ways</title>
  <desc>Two panels of the same bar chart. The red-outlined left panel starts its y axis at 48.6, so one bar is a stub and the other is six times taller. The green-outlined right panel starts at zero and the two bars are almost the same height.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The same two numbers, drawn two ways</text>
  <text x="205" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">LIE: axis starts at 48.6</text>
  <rect x="24" y="70" width="362" height="254" rx="12" fill="None" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="80" y1="268" x2="350" y2="268" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="72" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">49</text>
  <line x1="80" y1="198" x2="350" y2="198" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="72" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">50</text>
  <line x1="80" y1="128" x2="350" y2="128" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="72" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">51</text>
  <rect x="120" y="268" width="60" height="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="240" y="128" width="60" height="168" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="80" y1="100" x2="80" y2="296" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="296" x2="350" y2="296" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7A</text>
  <text x="270" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7B</text>
  <text x="595" y="62" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">HONEST: axis starts at 0</text>
  <rect x="414" y="70" width="362" height="254" rx="12" fill="None" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="462" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="470" y1="198" x2="740" y2="198" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="462" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">50</text>
  <line x1="470" y1="100" x2="740" y2="100" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="462" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100</text>
  <rect x="510" y="200" width="60" height="96" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="630" y="196" width="60" height="100" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="470" y1="100" x2="470" y2="296" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="470" y1="296" x2="740" y2="296" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="540" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7A</text>
  <text x="660" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7B</text>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="43" y1="341" x2="57" y2="355"/><line x1="57" y1="341" x2="43" y2="355"/></g>
  <text x="70" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">7B looks 6 times taller than 7A</text>
  <polyline points="435.0,349.0 441.0,355.0 453.0,341.0" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="462" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">7B is 1.04 times taller than 7A</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One argument to set_ylim is the entire difference.</text>
</svg>
