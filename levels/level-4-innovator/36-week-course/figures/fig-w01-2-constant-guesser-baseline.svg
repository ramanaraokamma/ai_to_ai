<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A model that ends on a constant guesser's accuracy has learned nothing</title>
  <desc>Horizontal bars of final validation accuracy for Week 1's six runs, with two dashed vertical lines for models that ignore their input. Always saying class 0 scores 169 / 360 = 46.9 percent; always saying class 1 scores 191 / 360 = 53.1 percent. Run A ends at 53.1 percent and run F at 46.9 percent, exactly on the lines, marked with crosses. Run B reaches 55.3 percent, just above. Runs C, D and E reach 98.1, 99.4 and 99.2 percent, marked with ticks.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two runs sit exactly on a constant guesser</text>
  <text x="20" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">run</text>
  <text x="776" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">val accuracy</text>
  <line x1="190" y1="88" x2="190" y2="300" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="190" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0%</text>
  <line x1="460" y1="88" x2="460" y2="300" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">50%</text>
  <line x1="730" y1="88" x2="730" y2="300" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="730" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100%</text>
  <text x="20" y="113" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">A  lr=1e-6</text>
  <rect x="190" y="96" width="286.7" height="24" rx="4" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="776" y="113" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">53.1%</text>
  <polyline points="161,101 175,115" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="161,115 175,101" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">B  lr=1e-5</text>
  <rect x="190" y="130" width="298.6" height="24" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="776" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">55.3%</text>
  <text x="20" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">C  lr=1e-4</text>
  <rect x="190" y="164" width="529.7" height="24" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="776" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">98.1%</text>
  <polyline points="161.7,176 166.2,180.9 175.2,170.6" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">D  lr=1e-3</text>
  <rect x="190" y="198" width="536.8" height="24" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="776" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">99.4%</text>
  <polyline points="161.7,210 166.2,214.9 175.2,204.6" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">E  lr=1e-2</text>
  <rect x="190" y="232" width="535.7" height="24" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="776" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">99.2%</text>
  <polyline points="161.7,244 166.2,248.9 175.2,238.6" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="20" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">F  lr=1e-1</text>
  <rect x="190" y="266" width="253.3" height="24" rx="4" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="776" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">46.9%</text>
  <polyline points="161,271 175,285" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="161,285 175,271" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="443.3" y1="88" x2="443.3" y2="300" stroke="#14202B" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <line x1="476.7" y1="88" x2="476.7" y2="300" stroke="#14202B" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="437.3" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">always class 0: 169 / 360</text>
  <text x="482.7" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">always class 1: 191 / 360</text>
  <text x="460" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">validation accuracy, 360 points</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A and F end exactly on a constant guesser: a model must beat both lines to have learned.</text>
</svg>
