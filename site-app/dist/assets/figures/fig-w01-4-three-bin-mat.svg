<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The three-bin sorting mat and its twelve cards</title>
  <desc>A sorting mat with three empty bins labelled a human wrote the steps, it worked it out itself, and not sure. Below the mat is a tray of twelve labelled cards ready to cut out: thermostat, calculator, spam filter, YouTube recommendations, traffic light, vending machine, face unlock, autocorrect, alarm clock, self-checkout scale, Google Translate and video doorbell.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">The Thermostat Trial: mat and cards</text>

    <rect x="30" y="52" width="240" height="150" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="150" y="80" font-size="18" fill="#14202B" text-anchor="middle">A HUMAN wrote</text>
    <text x="150" y="102" font-size="18" fill="#14202B" text-anchor="middle">the steps</text>
    <text x="150" y="132" font-size="12" fill="#55636F" text-anchor="middle">you could read every rule</text>
    <text x="150" y="150" font-size="12" fill="#55636F" text-anchor="middle">on one sheet of paper</text>
    <rect x="52" y="162" width="196" height="26" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="280" y="52" width="240" height="150" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="80" font-size="18" fill="#14202B" text-anchor="middle">IT WORKED IT</text>
    <text x="400" y="102" font-size="18" fill="#14202B" text-anchor="middle">out itself</text>
    <text x="400" y="132" font-size="12" fill="#55636F" text-anchor="middle">nobody could write these</text>
    <text x="400" y="150" font-size="12" fill="#55636F" text-anchor="middle">rules out by hand</text>
    <rect x="302" y="162" width="196" height="26" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="5 5"/>

    <rect x="530" y="52" width="240" height="150" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="650" y="80" font-size="18" fill="#14202B" text-anchor="middle">NOT SURE YET</text>
    <text x="650" y="112" font-size="12" fill="#55636F" text-anchor="middle">the best bin on the mat</text>
    <text x="650" y="132" font-size="12" fill="#55636F" text-anchor="middle">say what you would need</text>
    <text x="650" y="150" font-size="12" fill="#55636F" text-anchor="middle">to look up to be certain</text>
    <rect x="552" y="162" width="196" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="1.5" stroke-dasharray="5 5"/>

    <text x="30" y="230" font-size="14" fill="#55636F">Cut these twelve out before class:</text>

    <g stroke="#14202B" stroke-width="2" fill="#FFFFFF" stroke-linejoin="round">
      <rect x="30" y="242" width="178" height="40" rx="8"/>
      <rect x="218" y="242" width="178" height="40" rx="8"/>
      <rect x="406" y="242" width="178" height="40" rx="8"/>
      <rect x="594" y="242" width="178" height="40" rx="8"/>
      <rect x="30" y="290" width="178" height="40" rx="8"/>
      <rect x="218" y="290" width="178" height="40" rx="8"/>
      <rect x="406" y="290" width="178" height="40" rx="8"/>
      <rect x="594" y="290" width="178" height="40" rx="8"/>
      <rect x="30" y="338" width="178" height="40" rx="8"/>
      <rect x="218" y="338" width="178" height="40" rx="8"/>
      <rect x="406" y="338" width="178" height="40" rx="8"/>
      <rect x="594" y="338" width="178" height="40" rx="8"/>
    </g>
    <g font-size="14" fill="#14202B" text-anchor="middle">
      <text x="119" y="262" dominant-baseline="central">1 Thermostat</text>
      <text x="307" y="262" dominant-baseline="central">2 Calculator</text>
      <text x="495" y="262" dominant-baseline="central">3 Spam filter</text>
      <text x="683" y="256" dominant-baseline="central">4 YouTube</text>
      <text x="683" y="272" dominant-baseline="central">recommendations</text>
      <text x="119" y="310" dominant-baseline="central">5 Traffic light</text>
      <text x="307" y="310" dominant-baseline="central">6 Vending machine</text>
      <text x="495" y="310" dominant-baseline="central">7 Face unlock</text>
      <text x="683" y="310" dominant-baseline="central">8 Autocorrect</text>
      <text x="119" y="358" dominant-baseline="central">9 Alarm clock</text>
      <text x="307" y="352" dominant-baseline="central">10 Self-checkout</text>
      <text x="307" y="368" dominant-baseline="central">scale</text>
      <text x="495" y="358" dominant-baseline="central">11 Google Translate</text>
      <text x="683" y="358" dominant-baseline="central">12 Video doorbell</text>
    </g>
  </g>
</svg>
