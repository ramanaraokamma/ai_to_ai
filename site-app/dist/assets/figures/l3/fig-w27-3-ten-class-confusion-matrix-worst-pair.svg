<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Ten classes, eleven mistakes</title>
  <desc>A ten by ten confusion matrix for a plain CNN on 540 held-out digits: 529 on the green diagonal and 11 red cells off it. The two ringed cells are three real 8s predicted as 1 and one real 1 predicted as 8, which is 4 of the 11 mistakes, leaning towards calling an 8 a 1. The average 1 carries ink per column of 0, 5, 42, 93, 106, 56, 9 and 2, piled in the middle columns just as an 8 is.</desc>
