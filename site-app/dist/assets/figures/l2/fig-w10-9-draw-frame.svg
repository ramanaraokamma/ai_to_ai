<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 10</title>
  <desc>An empty framed drawing area titled draw your own function as a machine, split into two dashed halves for the boxes going in and the single value coming out, with three blank reminder boxes underneath.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw It frame for Week 10</text>
  <rect x="24" y="60" width="752" height="262" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="60" width="752" height="40" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="100" x2="776" y2="100" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your own function as a machine</text>
  <rect x="36" y="152" width="356" height="152" rx="10" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8"/>
  <text x="214" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the boxes going in, with their names on</text>
  <rect x="408" y="152" width="356" height="152" rx="10" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8"/>
  <text x="586" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the one value coming out of the chute</text>
  <rect x="40.0" y="336" width="229" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="154.5" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">what my function is called</text>
  <rect x="285.3" y="336" width="229" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="399.8" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">what it gives back</text>
  <rect x="530.6" y="336" width="229" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="645.1" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">which box has a default</text>
</svg>
