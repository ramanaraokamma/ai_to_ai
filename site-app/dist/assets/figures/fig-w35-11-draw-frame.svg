<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank frame: draw the five states</title>
  <desc>An empty drawing frame divided into five equal columns with a title strip reading draw the five states and a numbered label under each column.</desc>
  <rect x="24" y="24" width="752" height="352" rx="12" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 36 A12 12 0 0 1 36 24 H764 A12 12 0 0 1 776 36 V78 H24 Z" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="78" x2="776" y2="78" stroke="#14202B" stroke-width="3"/>
  <text x="46" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B">DRAW THE FIVE STATES</text>
  <text x="756" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end">Name: ________________</text>
  <g fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="7 6">
    <rect x="44" y="98" width="132" height="200" rx="8"/>
    <rect x="188" y="98" width="132" height="200" rx="8"/>
    <rect x="332" y="98" width="132" height="200" rx="8"/>
    <rect x="476" y="98" width="132" height="200" rx="8"/>
    <rect x="620" y="98" width="132" height="200" rx="8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">
    <text x="110" y="322">1</text><text x="254" y="322">2</text><text x="398" y="322">3</text><text x="542" y="322">4</text><text x="686" y="322">5</text>
  </g>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">In each box: the backdrop colour, the sentence the sprite says, and what happens to the counter.</text>
</svg>
