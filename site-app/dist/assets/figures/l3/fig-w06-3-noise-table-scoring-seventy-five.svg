<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three-quarters right, on data with nothing in it</title>
  <desc>A block of pure noise with the shape 200 by 2000, and a target that is a coin flip of 98 ones and 102 zeros, so there is nothing to find by construction. The wrong route picks the 20 best columns using all 200 rows and all 200 labels, then cross-validates, and its five folds score 0.875, 0.750, 0.800, 0.725 and 0.675, which add to 3.825 and divide by 5 to give 0.765. The right route puts the choosing inside the Pipeline so it re-runs on each fold's training rows only, and its folds score 0.425, 0.475, 0.600, 0.425 and 0.675, which add to 2.600 and divide by 5 to give 0.520. The difference, 0.765 minus 0.520, is 0.245 of pure invention.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three-quarters right, on data with nothing in it</text>
  <rect x="30" y="76" width="190" height="150" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="30" y1="106" x2="220" y2="106" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="30" y1="136" x2="220" y2="136" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="30" y1="166" x2="220" y2="166" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="30" y1="196" x2="220" y2="196" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="61.6" y1="76" x2="61.6" y2="226" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="93.2" y1="76" x2="93.2" y2="226" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="124.80000000000001" y1="76" x2="124.80000000000001" y2="226" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="156.4" y1="76" x2="156.4" y2="226" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="188.0" y1="76" x2="188.0" y2="226" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="125" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">pure noise</text>
  <rect x="52" y="236" width="148" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/><text x="126.0" y="249.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">shape (200, 2000)</text>
  <rect x="30" y="274" width="190" height="44" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="125" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">y: a coin flip</text>
  <text x="125" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">98 ones, 102 zeros</text>
  <text x="125" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">there is nothing to find,</text>
  <text x="125" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">by construction</text>
  <line x1="232" y1="196" x2="268" y2="196" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(268 196) rotate(0.0)"/>
  <rect x="282" y="76" width="236" height="146" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(294,86) scale(0.34)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
  <text x="336" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">pick 20 columns first</text>
  <text x="296" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">using all 200 rows and</text>
  <text x="296" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">all 200 labels, then cross-validate</text>
  <text x="296" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.875  0.750  0.800  0.725  0.675</text>
  <text x="296" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">3.825 &#247; 5 = 0.765</text>
  <rect x="282" y="234" width="236" height="142" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(294,244) scale(0.34)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="336" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">pick inside the Pipeline</text>
  <text x="296" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">so the choosing re-runs on each</text>
  <text x="296" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">fold's training rows only</text>
  <text x="296" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.425  0.475  0.600  0.425  0.675</text>
  <text x="296" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">2.600 &#247; 5 = 0.520</text>
  <rect x="542" y="76" width="238" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="661" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What happened</text>
  <text x="556" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2000 columns of noise means</text>
  <text x="556" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2000 chances for a column to</text>
  <text x="556" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">line up with the coin flip by</text>
  <text x="556" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">luck. Choosing the best 20</text>
  <text x="556" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">while looking at every label</text>
  <text x="556" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">hands the model a cheat sheet</text>
  <text x="556" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">for the very rows it is about</text>
  <text x="556" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">to be tested on.</text>
  <line x1="554" y1="278" x2="768" y2="278" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="556" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D">0.765 &#8722; 0.520 = 0.245</text>
  <text x="556" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">of pure invention</text>
  <text x="556" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Nothing about the model</text>
  <text x="556" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">was wrong: the leak is upstream.</text>
</svg>
