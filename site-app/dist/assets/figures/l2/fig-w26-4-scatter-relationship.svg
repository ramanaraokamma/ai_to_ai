  <rect x="110" y="100" width="190" height="58" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="205" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1.5 hours, and 78.</text>
  <text x="205" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">Every cloud has one.</text>
  <line x1="200" y1="160" x2="184" y2="176" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(184 176) rotate(135.0)"/>
  <line x1="90" y1="70" x2="90" y2="380" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="380" x2="452" y2="380" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="255" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Study hours per week</text>
  <text x="48" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 48 230)">Score (points out of 100)</text>
  <text x="250" y="462" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Up and to the right, fairly tight, with one dot that argues.</text>
</svg>
