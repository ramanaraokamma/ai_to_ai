<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One extra zero flattens everybody else</title>
  <desc>Two rulers running 0 to 1. The top one, ticked green, shows fourteen scaled scores spread evenly across the whole ruler. The bottom one, crossed in red, shows the same scores after one score was typed as 950: they are all crushed into a small box at the far left, with a single lone dot out at 1.0 labelled 950.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One extra zero flattens everybody else</text>
  <text x="400" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">typed right: the highest score is 99</text>
