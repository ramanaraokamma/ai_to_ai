<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The board at the end of the sweep</title>
  <desc>A nine-row table as it should look on the board when the sweep is finished. Columns are the threshold t, how many rows were flagged, how many of the 14 real frauds were caught, how many false alarms, the precision and the recall. The rows read: 0.50 flagged 0, caught 0, 0 false alarms, no precision, recall 0.0000. 0.15 flagged 1, caught 1, 0 false alarms, precision 1.0000, recall 0.0714. 0.12 flagged 2, caught 2, 0 false alarms, precision 1.0000, recall 0.1429. 0.10 flagged 8, caught 3, 5 false alarms, precision 0.3750, recall 0.2143. 0.08 flagged 15, caught 3, 12 false alarms, precision 0.2000, recall 0.2143. 0.06 flagged 25, caught 3, 22 false alarms, precision 0.1200, recall 0.2143. 0.04 flagged 65, caught 4, 61 false alarms, precision 0.0615, recall 0.2857. 0.02 flagged 216, caught 5, 211 false alarms, precision 0.0231, recall 0.3571. 0.01 flagged 429, caught 8, 421 false alarms, precision 0.0186, recall 0.5714. Three rows are highlighted and numbered as the three thresholds a student might defend: 0.12, 0.10 and 0.02.</desc>
