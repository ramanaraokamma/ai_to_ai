<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Puzzle: whose bar is whose?</title>
  <desc>Three confidence readouts from a model whose class names have been lost. Holding a comb gives nine, eight and eighty-three. Holding a spoon gives twelve, eighty and eight. A third mystery object gives seventy-four, fifteen and eleven. Blank lines are provided for the three class names.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Puzzle: whose bar is whose?</text>

    <rect x="40" y="70" width="220" height="196" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="150" y="98" font-size="16" fill="#14202B" text-anchor="middle">held up: a comb</text>
    <g font-size="12" fill="#55636F">
      <text x="62" y="130">1 ?</text>
      <text x="62" y="156">2 ?</text>
      <text x="62" y="182">3 ?</text>
    </g>
    <rect x="96" y="118" width="14" height="16" rx="4" fill="#55636F"/>
    <rect x="96" y="144" width="13" height="16" rx="4" fill="#55636F"/>
    <rect x="96" y="170" width="130" height="16" rx="4" fill="#1F6FB2"/>
    <g font-size="12" fill="#14202B">
      <text x="116" y="131">9</text>
      <text x="115" y="157">8</text>
      <text x="232" y="183">83</text>
    </g>
    <text x="150" y="228" font-size="14" fill="#55636F" text-anchor="middle">sum 9 + 8 + 83 = 100</text>
    <text x="150" y="250" font-size="14" fill="#55636F" text-anchor="middle">margin 83 − 9 = 74</text>

    <rect x="290" y="70" width="220" height="196" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="400" y="98" font-size="16" fill="#14202B" text-anchor="middle">held up: a spoon</text>
    <g font-size="12" fill="#55636F">
      <text x="312" y="130">1 ?</text>
      <text x="312" y="156">2 ?</text>
      <text x="312" y="182">3 ?</text>
    </g>
    <rect x="346" y="118" width="19" height="16" rx="4" fill="#55636F"/>
    <rect x="346" y="144" width="125" height="16" rx="4" fill="#1F6FB2"/>
    <rect x="346" y="170" width="13" height="16" rx="4" fill="#55636F"/>
    <g font-size="12" fill="#14202B">
      <text x="371" y="131">12</text>
      <text x="477" y="157">80</text>
      <text x="365" y="183">8</text>
    </g>
    <text x="400" y="228" font-size="14" fill="#55636F" text-anchor="middle">sum 12 + 80 + 8 = 100</text>
    <text x="400" y="250" font-size="14" fill="#55636F" text-anchor="middle">margin 80 − 12 = 68</text>

    <rect x="540" y="70" width="220" height="196" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="650" y="98" font-size="16" fill="#14202B" text-anchor="middle">held up: something else</text>
    <g font-size="12" fill="#55636F">
      <text x="562" y="130">1 ?</text>
      <text x="562" y="156">2 ?</text>
      <text x="562" y="182">3 ?</text>
    </g>
    <rect x="596" y="118" width="116" height="16" rx="4" fill="#C42B8C"/>
    <rect x="596" y="144" width="23" height="16" rx="4" fill="#55636F"/>
    <rect x="596" y="170" width="17" height="16" rx="4" fill="#55636F"/>
    <g font-size="12" fill="#14202B">
      <text x="718" y="131">74</text>
      <text x="625" y="157">15</text>
      <text x="619" y="183">11</text>
    </g>
    <text x="650" y="228" font-size="14" fill="#55636F" text-anchor="middle">sum 74 + 15 + 11 = 100</text>
    <text x="650" y="250" font-size="14" fill="#55636F" text-anchor="middle">margin 74 − 15 = 59</text>

    <rect x="120" y="286" width="560" height="54" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="400" y="318" font-size="18" fill="#14202B" text-anchor="middle">1 = ________   2 = ________   3 = ________</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">The three classes are spoon, toothbrush and comb — but which slot is which? Then: what did panel 3 say?</text>
  </g>
</svg>
