  <line x1="618" y1="130" x2="770" y2="130" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="694" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1 &#215; 10 = 10</text>
  <text x="694" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2 &#215; 50 = 100</text>
  <line x1="618" y1="188" x2="770" y2="188" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="694" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">10 + 100 = 110</text>
  <line x1="604" y1="130" x2="468" y2="118" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The pink row times the pink column lands in the pink cell.</text>
  <text x="400" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Row 1, column 2:  3 &#215; 30 + 4 &#215; 70 = 90 + 280 = 370.</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Row 2, column 3:  5 &#215; 40 + 6 &#215; 80 = 200 + 480 = 680.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Twelve cells, twelve of these sums. That is all a matrix multiply is.</text>
</svg>
