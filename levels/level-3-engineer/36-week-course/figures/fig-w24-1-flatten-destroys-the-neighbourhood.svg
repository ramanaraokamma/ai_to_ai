<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Flattening throws the neighbourhood away</title>
  <desc>On the left an 8 by 8 picture with three pixels ringed: A, the pixel B directly below it, and the pixel C directly to its right. On the right the same 64 numbers laid out as one long row of 64 slots. A sits in slot 19, C in slot 20 right next door, but B has landed in slot 27, eight slots away. Underneath: a dense layer on the flat row needs 16 times 64 plus 16 which is 1040 numbers, a 3 by 3 convolution needs 9 plus 1 which is 10, and 1040 divided by 10 is 104.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The pixel below is not the number next door</text>
