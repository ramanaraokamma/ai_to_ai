<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three learning rates, three fates</title>
  <desc>A chart of training log loss against epoch, 0 to 500 across, with a logarithmic vertical scale marked at 0.3, 1, 3, 10 and 20. All three curves start at 0.6931, marked with a dashed line labelled ln 2. Curve 1, lr = 0.005, falls slowly and is still falling at epoch 500, ending at 0.5098: too small. Curve 2, lr = 0.5, drops fast and is flat by epoch 100, ending at 0.3416: converged. Curve 3, lr = 800, jumps above the dashed line immediately and thrashes between about 2 and 12 for the rest of the run, ending at 7.8482 with a worst value of 12.1169: diverged. Each curve carries a numbered badge matching its row in the scoreboard on the right.</desc>
