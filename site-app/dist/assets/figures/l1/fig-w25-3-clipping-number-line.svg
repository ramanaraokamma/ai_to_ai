<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two fixes: drop the minus, then pin at 255</title>
  <desc>A number line marked minus 765, 0, 255, 765 and 1020. A curved arrow above flips minus 765 to plus 765. Two arrows below pin 765 and 1020 down onto 255, the top of the shaded 0 to 255 band.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two fixes: drop the minus, then pin at 255</text>
  <rect x="358.5365853658537" y="234" width="84.58536585365852" height="32" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="400.82926829268297" y="294.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle">0 to 255</text>
  <text x="400.82926829268297" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the only values you can shade</text>
  <line x1="60" y1="250" x2="740" y2="250" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="104.78048780487805" y1="241" x2="104.78048780487805" y2="259" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="104.78048780487805" y="282.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">-765</text>
  <line x1="612.2926829268292" y1="241" x2="612.2926829268292" y2="259" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="612.2926829268292" y="282.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">765</text>
  <line x1="696.8780487804878" y1="241" x2="696.8780487804878" y2="259" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="696.8780487804878" y="282.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">1020</text>
  <line x1="358.5365853658537" y1="241" x2="358.5365853658537" y2="259" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="443.1219512195122" y1="241" x2="443.1219512195122" y2="259" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="358.5365853658537" y="224.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="443.1219512195122" y="224.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">255</text>
  <path d="M 105 226 Q 359 76 612 226" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(612 226) rotate(62)"/>
  <text x="400" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Step 1 - absolute value:   | -765 | = 765</text>
  <text x="400" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">an edge is an edge whichever way the brightness went</text>
  <path d="M 612 266 V 328 H 443 V 268" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(443 268) rotate(-90)"/>
  <path d="M 697 266 V 328 H 443 V 268" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(443 268) rotate(-90)"/>
  <text x="400" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Step 2 - clip:   765 becomes 255,   1020 becomes 255</text>
  <text x="400" y="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Anything 255 or bigger is pinned to 255. After Step 1 nothing can be below 0, so there is no bottom pin to do.</text>
</svg>
