<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Two rulers, all the arithmetic</title>
  <desc>A four-step stack for the values 2, 4, 6, 8 and 100. Step one plots them on a number line with the mean marked at 24, since 2 plus 4 plus 6 plus 8 plus 100 is 120 and 120 divided by 5 is 24. Step two works the standard deviation: the gaps are minus 22, minus 20, minus 18, minus 16 and plus 76; their squares are 484, 400, 324, 256 and 5776; the squares add to 7240; 7240 divided by 5 is 1448; and the square root of 1448 is 38.0526. Step three divides each gap by 38.0526, giving minus 0.5781 up to plus 1.9972. Step four divides by the range of 98 instead, giving 0, 0.0204, 0.0408, 0.0612 and 1, so four of the five points sit crushed at the left-hand end.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two rulers, all the arithmetic</text>
  <text x="30" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">1. The five raw values</text>
  <line x1="50" y1="130" x2="460" y2="130" stroke="#14202B" stroke-width="2"/>
  <line x1="50.0" y1="130" x2="50.0" y2="136" stroke="#55636F" stroke-width="1.5"/>
  <text x="50.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="152.5" y1="130" x2="152.5" y2="136" stroke="#55636F" stroke-width="1.5"/>
  <text x="152.5" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">25</text>
  <line x1="254.99999999999997" y1="130" x2="254.99999999999997" y2="136" stroke="#55636F" stroke-width="1.5"/>
  <text x="254.99999999999997" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">50</text>
  <line x1="357.5" y1="130" x2="357.5" y2="136" stroke="#55636F" stroke-width="1.5"/>
  <text x="357.5" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">75</text>
  <line x1="459.99999999999994" y1="130" x2="459.99999999999994" y2="136" stroke="#55636F" stroke-width="1.5"/>
  <text x="459.99999999999994" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100</text>
  <circle cx="58.2" cy="130" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="66.4" cy="130" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="74.6" cy="130" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="82.8" cy="130" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="459.99999999999994" cy="130" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="148.39999999999998" y1="106" x2="148.39999999999998" y2="130" stroke="#C42B8C" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="148.39999999999998" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">mean 24</text>
  <text x="50" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2 + 4 + 6 + 8 + 100 = 120, and 120 &#247; 5 = 24</text>
  <text x="30" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">2. The typical distance from that mean</text>
  <rect x="30" y="216" width="440" height="150" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="46" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">take away 24:   &#8722;22   &#8722;20   &#8722;18   &#8722;16   +76</text>
  <text x="46" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">square each:    484   400   324   256   5776</text>
  <text x="46" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">add them up:    484 + 400 + 324 + 256 + 5776 = 7240</text>
  <text x="46" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">share out:      7240 &#247; 5 = 1448</text>
  <text x="46" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">square root of 1448 = 38.0526</text>
  <line x1="44" y1="340" x2="456" y2="340" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="46" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">that 38.0526 is the standard deviation: the typical gap</text>
  <text x="30" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">3. Divide each gap by 38.0526</text>
  <line x1="50" y1="452" x2="460" y2="452" stroke="#14202B" stroke-width="2"/>
  <line x1="50" y1="452" x2="50" y2="458" stroke="#55636F" stroke-width="1.5"/>
  <text x="50" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;1</text>
  <line x1="150" y1="452" x2="150" y2="458" stroke="#55636F" stroke-width="1.5"/>
  <text x="150" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="250" y1="452" x2="250" y2="458" stroke="#55636F" stroke-width="1.5"/>
  <text x="250" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="350" y1="452" x2="350" y2="458" stroke="#55636F" stroke-width="1.5"/>
  <text x="350" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <circle cx="92.19" cy="452" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="97.44" cy="452" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="102.7" cy="452" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="107.95" cy="452" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="349.72" cy="452" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="50" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">(&#8722;22) &#247; 38.0526 = &#8722;0.5781      76 &#247; 38.0526 = +1.9972</text>
  <text x="50" y="492" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the four small numbers stay together; 100 is 2 steps out</text>
  <text x="30" y="528" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">4. Or divide by the range instead</text>
  <line x1="50" y1="580" x2="460" y2="580" stroke="#14202B" stroke-width="2"/>
  <line x1="60" y1="580" x2="60" y2="586" stroke="#55636F" stroke-width="1.5"/>
  <text x="60" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="157.5" y1="580" x2="157.5" y2="586" stroke="#55636F" stroke-width="1.5"/>
  <text x="157.5" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.25</text>
  <line x1="255.0" y1="580" x2="255.0" y2="586" stroke="#55636F" stroke-width="1.5"/>
  <text x="255.0" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="352.5" y1="580" x2="352.5" y2="586" stroke="#55636F" stroke-width="1.5"/>
  <text x="352.5" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.75</text>
  <line x1="450" y1="580" x2="450" y2="586" stroke="#55636F" stroke-width="1.5"/>
  <text x="450" y="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <circle cx="60.0" cy="580" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="67.956" cy="580" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="75.912" cy="580" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="83.868" cy="580" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="450.0" cy="580" r="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="50" y="556" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">(4 &#8722; 2) &#247; 98 = 0.0204        (100 &#8722; 2) &#247; 98 = 1.0000</text>
  <rect x="30" y="612" width="440" height="46" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="630" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">four of the five are crushed into the first 6% of the line</text>
  <text x="250" y="648" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">one freak value ate the whole ruler</text>
  <text x="250" y="676" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every step is a subtraction and a division.</text>
</svg>
