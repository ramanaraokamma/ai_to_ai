<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw the cost bowl</title>
  <desc>One large empty framed panel for the student's own cost curve, with a dashed baseline underneath labelled high threshold at the left and low threshold at the right. A panel below lists what a good answer contains: threshold along the bottom from 0.50 down to 0.01 and total cost in pounds up the side, nine dots for the nine rows, the dot at 0.50 highest at 7000 pounds and the dot at 0.10 lowest at 5550 pounds, the winner ringed, the bump at 0.04 at 5610 pounds which is cheaper than its neighbour at 0.06 at 5720 pounds marked in red, an arrow showing the 1450 pounds saved between 7000 and 5550, the price list written in a box in the corner as a miss costs 500 and a false alarm costs 10, and a note that the bump is what fourteen frauds look like.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the cost bowl</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Nine thresholds, nine totals, one cheapest.</text>
  <rect x="30" y="86" width="440" height="300" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">your cost curve goes here</text>
  <line x1="60" y1="356" x2="440" y2="356" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="60" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">high threshold</text>
  <text x="440" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">low threshold</text>
  <rect x="30" y="396" width="440" height="280" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="448" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; threshold across, total cost in pounds up the side</text>
  <text x="48" y="471" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; nine dots, one per row of the table</text>
  <text x="48" y="494" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; 0.50 highest at &#163;7,000 &#8212; the default, and the worst</text>
  <text x="48" y="517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; 0.10 lowest at &#163;5,550 &#8212; ring it, that is the winner</text>
  <text x="48" y="540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; 0.04 at &#163;5,610, cheaper than 0.06 at &#163;5,720:</text>
  <text x="48" y="563" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">   outline that one in red, it is the bump</text>
  <text x="48" y="586" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; an arrow from 7,000 to 5,550 labelled &#163;1,450 saved</text>
  <text x="48" y="609" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the price list in a box: miss &#163;500, alarm &#163;10</text>
  <text x="48" y="632" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; a note: the bump is what 14 frauds look like &#8212; one</text>
  <text x="48" y="655" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">   fraud crossing a line moves the curve by &#163;500</text>
</svg>
