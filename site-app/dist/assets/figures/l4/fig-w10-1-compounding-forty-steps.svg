<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Below 1 the repeated multiplication shrinks to almost nothing and above 1 it grows large; only exactly 1 stays put</title>
  <desc>Two bar panels, each with six bars for k = 1, 2, 5, 10, 20 and 40 multiplications. Left panel, rate 0.9526: 0.9526, 0.9074, 0.7844, 0.6153, 0.3786 and 0.1434, falling toward zero, with dashed lines at 1 and 0.5. Right panel, rate 1.05: 1.05, 1.103, 1.276, 1.629, 2.653 and 7.04, rising, with dashed lines at 1 and 2. The k = 40 bar in each panel is highlighted. The two panels use different heights per unit. Values are the Week 10 block 1 printout, plain arithmetic with no random numbers.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Forty small steps compound</text>
