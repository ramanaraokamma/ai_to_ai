<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Cutting a number line into three named buckets</title>
  <desc>The top row shows a number line of homework minutes with eight separate dots at their exact values. The bottom row shows the same line cut into three named buckets, quick, normal and long, where every dot inside a bucket has lost its own position.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Bucketing throws information away</text>

    <text x="60" y="82" font-size="18" fill="#14202B">BEFORE &#8212; every value has its own spot</text>
    <line x1="60" y1="150" x2="740" y2="150" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#14202B" stroke-width="2" stroke-linecap="round">
      <line x1="60" y1="150" x2="60" y2="164"/>
      <line x1="230" y1="150" x2="230" y2="164"/>
      <line x1="400" y1="150" x2="400" y2="164"/>
      <line x1="570" y1="150" x2="570" y2="164"/>
      <line x1="740" y1="150" x2="740" y2="164"/>
    </g>
    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="60" y="182">0</text>
      <text x="230" y="182">30</text>
      <text x="400" y="182">60</text>
      <text x="570" y="182">90</text>
      <text x="740" y="182">120</text>
    </g>
    <text x="400" y="204" font-size="12" fill="#55636F" text-anchor="middle">minutes of homework</text>
    <g fill="#1F6FB2" stroke="#FFFFFF" stroke-width="2">
      <circle cx="128" cy="132" r="8"/>
      <circle cx="184" cy="132" r="8"/>
      <circle cx="224" cy="132" r="8"/>
      <circle cx="241" cy="132" r="8"/>
      <circle cx="309" cy="132" r="8"/>
      <circle cx="366" cy="132" r="8"/>
      <circle cx="468" cy="132" r="8"/>
      <circle cx="649" cy="132" r="8"/>
    </g>
    <text x="224" y="112" font-size="12" fill="#55636F" text-anchor="end">29</text>
    <text x="243" y="112" font-size="12" fill="#55636F" text-anchor="start">31</text>

    <line x1="60" y1="222" x2="740" y2="222" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <text x="60" y="256" font-size="18" fill="#14202B">AFTER &#8212; three named buckets</text>
    <rect x="60" y="276" width="170" height="60" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <rect x="230" y="276" width="170" height="60" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="400" y="276" width="340" height="60" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="145" y="298" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">quick</text>
    <text x="145" y="320" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">under 30</text>
    <text x="315" y="298" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">normal</text>
    <text x="315" y="320" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">30 to 60</text>
    <text x="570" y="298" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">long</text>
    <text x="570" y="320" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">over 60</text>

    <g fill="#55636F" stroke="#FFFFFF" stroke-width="2">
      <circle cx="112" cy="356" r="8"/>
      <circle cx="134" cy="356" r="8"/>
      <circle cx="156" cy="356" r="8"/>
      <circle cx="282" cy="356" r="8"/>
      <circle cx="304" cy="356" r="8"/>
      <circle cx="326" cy="356" r="8"/>
      <circle cx="348" cy="356" r="8"/>
      <circle cx="560" cy="356" r="8"/>
    </g>
    <text x="400" y="386" font-size="14" fill="#55636F" text-anchor="middle">29 and 31 were 2 minutes apart. Now they are in different buckets, and 31 and 59 are the same answer.</text>
  </g>
</svg>
