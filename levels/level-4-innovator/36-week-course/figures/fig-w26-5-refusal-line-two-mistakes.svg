<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>No refusal line has zero mistakes, and a line tuned on your own wording fails on a stranger's</title>
  <desc>Seven rows, one for each refusal line tau from 0.05 to 0.30. Each row has a red bar to the left for answerable questions that were refused and a gold bar to the right for unanswerable questions that were answered, then the total, then ten squares showing how many of the stranger set were answered. Rows: tau 0.05, 0 refused, 2 leaked, total 2, stranger 8 of 10. 0.10: 0, 2, total 2, 8. 0.12: 0, 1, total 1, 7, the best row, ringed. 0.15: 1, 1, total 2, 3. 0.20: 2, 1, total 3, 2. 0.25: 2, 0, total 2, 1. 0.30: 2, 0, total 2, 1.</desc>
