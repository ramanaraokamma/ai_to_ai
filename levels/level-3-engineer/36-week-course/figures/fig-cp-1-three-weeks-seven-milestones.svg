<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three weeks, seven milestones</title>
  <desc>Three week panels side by side. Week 34, the contract and the artifact: milestone 1 write the contract, milestone 2 freeze the artifact, milestone 3 a command-line tool with no fit call. Week 35, the service, the log and the card: milestone 4 a local service, milestone 5 at least 100 logged lines, milestone 6 a subgroup table and a model card, milestone 7 the monitoring plan. Week 36, showcase day: the eight-minute talk, given in a new terminal, with a number in every answer, and one wrong answer shown on purpose. Each panel notes that evidence is a file you can point at, not a promise. A green box at the bottom gives the two commands that turn a promise into evidence: a grep of the serve folder for fit or train_test_split, and a word count of the prediction log.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three weeks, seven milestones</text>
  <rect x="24" y="82" width="244" height="214" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="40" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">WEEK 34</text>
  <text x="40" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the contract and the artifact</text>
  <line x1="36" y1="146" x2="256" y2="146" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">M1  write the contract</text>
  <text x="40" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">M2  freeze the artifact</text>
  <text x="40" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">M3  a CLI with no fit()</text>
  <text x="40" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">evidence: a file you can</text>
  <text x="40" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">point at, not a promise</text>
  <rect x="276" y="82" width="244" height="214" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="292" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">WEEK 35</text>
  <text x="292" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the service, the log, the card</text>
  <line x1="288" y1="146" x2="508" y2="146" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="292" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">M4  a local service</text>
  <text x="292" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">M5  100+ logged lines</text>
  <text x="292" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">M6  subgroup table + card</text>
  <text x="292" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">M7  the monitoring plan</text>
  <text x="292" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">evidence: a file you can</text>
  <text x="292" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">point at, not a promise</text>
  <rect x="528" y="82" width="244" height="214" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="544" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">WEEK 36</text>
  <text x="544" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">showcase day</text>
  <line x1="540" y1="146" x2="760" y2="146" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="544" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the eight-minute talk</text>
  <text x="544" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">in a NEW terminal</text>
  <text x="544" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">a number in every answer</text>
  <text x="544" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">one wrong answer, shown</text>
  <text x="544" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">evidence: a file you can</text>
  <text x="544" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">point at, not a promise</text>
  <line x1="270" y1="189" x2="267" y2="189" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polygon points="276,189 266,183 266,195" fill="#55636F" stroke="#55636F" stroke-width="1"/>
  <line x1="522" y1="189" x2="519" y2="189" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polygon points="528,189 518,183 518,195" fill="#55636F" stroke="#55636F" stroke-width="1"/>
  <rect x="24" y="314" width="748" height="60" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="40" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the two greps that turn a promise into evidence:</text>
  <text x="40" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">grep -rnE &quot;\.fit\(&quot; serve/   &#183;   wc -l logs/predictions.jsonl</text>
</svg>
