<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One table, two jobs</title>
  <desc>A four-column table of songs splits into two pieces. The bpm and minutes columns become a block called X with shape 10 by 2. The mood column alone becomes a single column called y with shape 10. Dashed lines join row one of X to row one of y. The song name column is left out of both, because a name belongs to only one row.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One table, two jobs</text>
