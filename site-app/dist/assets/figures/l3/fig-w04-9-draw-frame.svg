<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw five numbers three times</title>
  <desc>Three empty framed number lines to draw on. The first is for the raw values 2, 4, 6, 8 and 100 on a line from 0 to 100, with the mean of 24 marked. The second is for the five z-scores minus 0.5781, minus 0.5256, minus 0.4730, minus 0.4205 and plus 1.9972 on a line from minus 1 to plus 2. The third is for the five min-max values 0.0000, 0.0204, 0.0408, 0.0612 and 1.0000 on a line from 0 to 1. A panel at the bottom says what a good answer contains: four dots bunched at the left and one far right on every line, the mean of 24 sitting to the right of four of the five dots, the first four min-max dots touching each other inside the bottom 6 per cent of the line, the same order on all three lines, and one sentence naming the z-score as the ruler you would use and why.</desc>
  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw five numbers three times</text>
  <text x="250" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Same five numbers. Three rulers. Only the spacing changes.</text>
  <rect x="30" y="80" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Line 1 &#8212; the raw values</text>
  <text x="46" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">0 to 100. Mark the mean too.</text>
  <line x1="60" y1="176" x2="440" y2="176" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="170" x2="60" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="136" y1="170" x2="136" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="212" y1="170" x2="212" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="288" y1="170" x2="288" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="364" y1="170" x2="364" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="440" y1="170" x2="440" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="30" y="226" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Line 2 &#8212; the z-scores</text>
  <text x="46" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#8722;1 to +2. Mark 0.</text>
  <line x1="60" y1="322" x2="440" y2="322" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="316" x2="60" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="136" y1="316" x2="136" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="212" y1="316" x2="212" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="288" y1="316" x2="288" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="364" y1="316" x2="364" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="440" y1="316" x2="440" y2="328" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="30" y="372" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="398" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Line 3 &#8212; the min-max values</text>
  <text x="46" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">0 to 1. Mark 0.5.</text>
  <line x1="60" y1="468" x2="440" y2="468" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="462" x2="60" y2="474" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="136" y1="462" x2="136" y2="474" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="212" y1="462" x2="212" y2="474" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="288" y1="462" x2="288" y2="474" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="364" y1="462" x2="364" y2="474" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="440" y1="462" x2="440" y2="474" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="30" y="518" width="440" height="158" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="544" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="570" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; every line has four dots bunched up and one far away</text>
  <text x="48" y="592" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; 24 is marked to the RIGHT of four of the five dots</text>
  <text x="48" y="614" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; on line 3 the first four dots are touching each other</text>
  <text x="48" y="636" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; all three lines are in the same left-to-right order</text>
  <text x="48" y="658" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#183; one sentence: which ruler, and the value that decided it</text>
</svg>
