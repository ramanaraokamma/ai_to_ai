<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Six icon cards. Loc is an arrow coming in from outside a table and reading the row labels printed on its left edge. Iloc ignores those labels and counts down from zero on numbered tabs outside the edge. Label is a luggage tag reading steps tied to the top of a column. Position is a row of three slots numbered zero, one and two with slot one ringed. Boolean filter is a column of False and True answers beside the table, with only the True rows carried through to a smaller table. A sixth card carries the rule of the week: use loc unless you really mean the first one or the last one.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>

  <rect x="20" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="280" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="540" y="56" width="240" height="160" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="20" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="280" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="540" y="224" width="240" height="156" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 1. loc - reads the labels on the edge -->
  <text x="140" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">loc</text>
  <line x1="42" y1="124" x2="70" y2="124" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(70 124)"/>
  <rect x="72" y="100" width="142" height="72" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="72" y="100" width="26" height="72" fill="#F4D5E9"/>
  <g stroke="#C7CDD4" stroke-width="1.5"><line x1="72" y1="124" x2="214" y2="124"/><line x1="72" y1="148" x2="214" y2="148"/></g>
  <line x1="98" y1="100" x2="98" y2="172" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <text x="85" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="85" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="85" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="156" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Meera</text>
  <text x="156" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Kabir</text>
  <text x="156" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Nova</text>
  <text x="140" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">picks by NAME, read off the edge</text>
  <text x="140" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">week.loc[1, "steps"]</text>

  <!-- 2. iloc - ignores the labels and counts -->
  <text x="400" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">iloc</text>
  <circle cx="312" cy="112" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="312" cy="136" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <circle cx="312" cy="160" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="312" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="312" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="312" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="332" y="100" width="142" height="72" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="332" y="100" width="26" height="72" fill="#F5F8FA"/>
  <g stroke="#C7CDD4" stroke-width="1.5"><line x1="332" y1="124" x2="474" y2="124"/><line x1="332" y1="148" x2="474" y2="148"/><line x1="358" y1="100" x2="358" y2="172"/></g>
  <text x="345" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="345" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="345" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="416" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Arjun</text>
  <text x="416" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Kabir</text>
  <text x="416" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Meera</text>
  <text x="400" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ignores the edge and COUNTS from 0</text>
  <text x="400" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">week.iloc[1, 3]</text>

  <!-- 3. label - a name printed on an edge -->
  <text x="660" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">label</text>
  <line x1="612" y1="110" x2="628" y2="126" stroke="#845F00" stroke-width="2" stroke-linecap="round"/>
  <rect x="592" y="96" width="88" height="30" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="604" cy="111" r="3" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <text x="640" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">steps</text>
  <rect x="628" y="132" width="120" height="40" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="688" y1="132" x2="688" y2="172" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="658" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">8200</text>
  <text x="718" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">11050</text>
  <text x="660" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a name printed on an edge of</text>
  <text x="660" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the table - not a piece of data</text>

  <!-- 4. position - how far along, from 0 -->
  <text x="140" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">position</text>
  <rect x="44" y="272" width="62" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="110" y="272" width="62" height="44" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <rect x="176" y="272" width="62" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="75" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="141" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">1</text>
  <text x="207" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="75" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">first</text>
  <text x="141" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">second</text>
  <text x="207" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">third</text>
  <text x="140" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">how far along something is.</text>
  <text x="140" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">The second one is position 1.</text>

  <!-- 5. boolean filter - keep the True rows -->
  <text x="400" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">boolean filter</text>
  <rect x="300" y="266" width="52" height="22" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <rect x="300" y="290" width="52" height="22" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="300" y="314" width="52" height="22" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <rect x="300" y="338" width="52" height="22" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="326" y="277" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">False</text>
  <text x="326" y="301" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">True</text>
  <text x="326" y="325" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">False</text>
  <text x="326" y="349" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">True</text>
  <line x1="360" y1="313" x2="392" y2="313" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(392 313)"/>
  <rect x="400" y="290" width="100" height="46" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="400" y1="313" x2="500" y2="313" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="450" y="301" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Kabir  11050</text>
  <text x="450" y="325" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Zoya   12300</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">ask every row; keep only the True ones</text>

  <!-- 6. the rule of the week -->
  <text x="660" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the rule</text>
  <rect x="558" y="264" width="204" height="76" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="660" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Use loc unless you really</text>
  <text x="660" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">mean "the first one" or</text>
  <text x="660" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">"the last one".</text>
  <text x="660" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Names survive sorting and filtering.</text>
  <text x="660" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Positions do not.</text>
</svg>
