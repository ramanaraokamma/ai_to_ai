<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A balance scale tipping under 200 200 and 8</title>
  <desc>A balance scale tipped hard to the left. The left pan holds two heavy blocks labelled spoon 200 and toothbrush 200. The right pan is high in the air and a small block labelled comb 8 is sliding off it. A note says a model that never says comb still scores 400 divided by 408, which is 98 percent.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">200 / 200 / 8 - the small class slides off</text>

    <g stroke="#55636F" stroke-width="2" stroke-linecap="round">
      <line x1="175" y1="195" x2="128" y2="300"/>
      <line x1="175" y1="195" x2="224" y2="300"/>
      <line x1="625" y1="85" x2="590" y2="190"/>
      <line x1="625" y1="85" x2="660" y2="190"/>
    </g>

    <path d="M378 330 L400 138 L422 330 Z" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <rect x="340" y="330" width="120" height="14" rx="6" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <line x1="175" y1="195" x2="625" y2="85" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="400" cy="140" r="7" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>

    <path d="M112 300 H240 L228 318 H124 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M576 190 H674 L662 208 H588 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>

    <rect x="122" y="268" width="108" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="176" y="285" font-size="12" fill="#14202B" text-anchor="middle">spoon 200</text>
    <rect x="122" y="238" width="108" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="176" y="255" font-size="12" fill="#14202B" text-anchor="middle">toothbrush 200</text>

    <g transform="rotate(22 660 172)">
      <rect x="622" y="158" width="76" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
      <text x="660" y="175" font-size="12" fill="#14202B" text-anchor="middle">comb 8</text>
    </g>
    <path d="M706 206 Q728 222 736 244" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
    <polyline points="726,236 738,250 722,252" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="176" y="346" font-size="16" fill="#14202B" text-anchor="middle">spoon + toothbrush = 400</text>
    <text x="625" y="240" font-size="16" fill="#14202B" text-anchor="middle">comb = 8</text>

    <g font-size="14" fill="#14202B">
      <text x="500" y="292">If it never says comb:</text>
      <text x="500" y="314">400 out of 408 correct</text>
      <text x="500" y="336">400 / 408 = 98% accurate</text>
    </g>

    <text x="400" y="378" font-size="14" fill="#55636F" text-anchor="middle">Training goes where the examples are. 98% accurate, 0% right on combs.</text>
  </g>
</svg>
