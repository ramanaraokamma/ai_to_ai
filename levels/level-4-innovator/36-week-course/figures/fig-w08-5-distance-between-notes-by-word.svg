<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The two sentences have the same bag view but their notes sit 0.8842 apart after the last word</title>
  <desc>Left, five bars of the distance between the two sentences' notes after each word, from order.py: 0.0000, 0.9854, 0.6620, 0.2906 and 0.8842, with the word read in sentence a and sentence b under each bar. Right, the two final states: a is 0.5728, -0.0141, 0.3677, 0.1722 and b is -0.1963, -0.0411, 0.3475, 0.6072. Their differences are 0.7691, 0.0270, 0.0202 and -0.4350; the squares 0.5915, 0.0007, 0.0004 and 0.1892 add to 0.7819, and its square root is 0.8842. Both sentences have the bag view 0.7301, -0.286, -1.2587.</desc>
