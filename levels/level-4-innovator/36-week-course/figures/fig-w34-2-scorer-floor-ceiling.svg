<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A scorer is tested on answers typed by hand: floor, ceiling and junk</title>
  <desc>Three scripted stand-ins, each marked on the same 8 example cases (3 factual, multi_hop, arithmetic, out_of_scope, adversarial, ambiguous). refuse_all passes only the out_of_scope and adversarial cases: 2/8 = 0.25. oracle passes all 8: 1.00. echo passes none: 0.00. Ticks mark a pass and crosses a fail.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Test the scorer, not just use it</text>
