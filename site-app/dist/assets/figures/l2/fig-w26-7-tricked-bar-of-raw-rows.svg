<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A bar chart needs one number per category, not one bar per row</title>
  <desc>Two panels. On the left, outlined red, thirty-eight thin rectangles of wildly different heights are crammed into three crowded columns labelled chess, music and art, with a note saying thirty-eight bars, no error, and nothing readable. On the right, outlined green, value counts has been used first, so there are exactly three bars of heights fourteen, twelve and twelve, each printing its own number, marked with a tick.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A bar chart needs one number per category</text>

  <rect x="24" y="70" width="364" height="274" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 82 A12 12 0 0 1 36 70 H376 A12 12 0 0 1 388 82 V104 H24 Z" fill="#F6AEA6"/>
  <line x1="24" y1="104" x2="388" y2="104" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="206" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">raw rows, straight to the chart</text>
  <text x="206" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">ax.bar(df["club"], df["score"])</text>

  <line x1="56" y1="144" x2="56" y2="248" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="248" x2="360" y2="248" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <g fill="#F6AEA6" stroke="#CC2B1D" stroke-width="1.5">
    <rect x="70" y="188" width="5" height="60"/>
    <rect x="77" y="164" width="5" height="84"/>
    <rect x="84" y="212" width="5" height="36"/>
    <rect x="91" y="176" width="5" height="72"/>
    <rect x="98" y="200" width="5" height="48"/>
    <rect x="105" y="158" width="5" height="90"/>
    <rect x="112" y="184" width="5" height="64"/>
    <rect x="119" y="206" width="5" height="42"/>
    <rect x="126" y="170" width="5" height="78"/>
    <rect x="133" y="194" width="5" height="54"/>
    <rect x="140" y="180" width="5" height="68"/>
    <rect x="147" y="216" width="5" height="32"/>
    <rect x="154" y="162" width="5" height="86"/>
    <rect x="161" y="198" width="5" height="50"/>
    <rect x="176" y="172" width="5" height="76"/>
    <rect x="183" y="210" width="5" height="38"/>
    <rect x="190" y="186" width="5" height="62"/>
    <rect x="197" y="160" width="5" height="88"/>
    <rect x="204" y="204" width="5" height="44"/>
    <rect x="211" y="178" width="5" height="70"/>
    <rect x="218" y="220" width="5" height="28"/>
    <rect x="225" y="166" width="5" height="82"/>
    <rect x="232" y="192" width="5" height="56"/>
    <rect x="239" y="182" width="5" height="66"/>
    <rect x="246" y="208" width="5" height="40"/>
    <rect x="253" y="174" width="5" height="74"/>
    <rect x="268" y="196" width="5" height="52"/>
    <rect x="275" y="168" width="5" height="80"/>
    <rect x="282" y="214" width="5" height="34"/>
    <rect x="289" y="190" width="5" height="58"/>
    <rect x="296" y="162" width="5" height="86"/>
    <rect x="303" y="202" width="5" height="46"/>
    <rect x="310" y="176" width="5" height="72"/>
    <rect x="317" y="218" width="5" height="30"/>
