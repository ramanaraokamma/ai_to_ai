<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Six icon cards. Boolean mask is a small block of scores beside a same-sized block of T and F cells, green for T and red for F. Selection is five cells above a row of T and F, with only three pink cells surviving underneath. Normalization is two parallel rulers, one running 58 to 88 with five dots on it and one running 0.00 to 1.00 with the dots in the same order. Min-max is two boxes reading min 30 and max 99 with the gap 69 noted underneath. Vectorized gradebook is a grid with both margins filled and a badge reading for equals zero. The sixth card states the rule of the week: look at the mask before you use it.</desc>
