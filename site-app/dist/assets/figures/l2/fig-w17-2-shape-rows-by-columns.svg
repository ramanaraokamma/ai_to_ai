<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Shape is rows first, then columns</title>
  <desc>Two blocks of the same eight numbers. The left block has four rows and two columns and is labelled shape four comma two. The right block has two rows and four columns and is labelled shape two comma four. Arrows label the rows direction downwards and the columns direction across on both. A caption states that the two shapes hold the same eight numbers and are not the same array.</desc>
