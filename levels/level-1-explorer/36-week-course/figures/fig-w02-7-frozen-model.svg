<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Training stops, and the model freezes</title>
  <desc>Two panels. The wrong panel shows a brain with a rising arrow and the claim that the model gets better every day you use it. The right panel shows examples going into training, training stopping, and a finished model that never changes afterwards.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Training stops. The model freezes.</text>
    <rect x="30" y="70" width="350" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <rect x="420" y="70" width="350" height="250" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <g transform="translate(48,84) scale(0.44)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <g transform="translate(438,84) scale(0.44)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="100" y="107" font-size="18" fill="#14202B">A very common guess</text>
    <text x="490" y="107" font-size="18" fill="#14202B">What really happens</text>

    <g transform="translate(55,145) scale(0.8)">
      <path d="M50 14 C34 14 24 24 24 36 C13 41 12 55 22 62 C22 76 34 87 50 87 C66 87 78 76 78 62 C88 55 87 41 76 36 C76 24 66 14 50 14 Z" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
      <line x1="50" y1="15" x2="50" y2="86" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
      <g fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round">
        <path d="M37 28 C45 33 45 43 37 47"/>
        <path d="M63 28 C55 33 55 43 63 47"/>
        <path d="M35 57 C45 61 45 71 37 75"/>
        <path d="M65 57 C55 61 55 71 63 75"/>
      </g>
    </g>
    <g stroke="#CC2B1D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 240 L230 165"/>
      <polyline points="216,164 232,162 230,178"/>
    </g>
    <g font-size="16" fill="#14202B">
      <text x="60" y="272">"It gets a little better</text>
      <text x="60" y="294">every time I use it."</text>
    </g>

    <rect x="438" y="150" width="90" height="60" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <text x="483" y="180" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">examples</text>
    <g stroke="#14202B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="532" y1="180" x2="552" y2="180"/>
      <polyline points="546,174 556,180 546,186"/>
    </g>
    <rect x="560" y="150" width="90" height="60" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
    <text x="605" y="180" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">training</text>
    <line x1="662" y1="132" x2="662" y2="232" stroke="#CC2B1D" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="662" y="126" font-size="12" fill="#CC2B1D" text-anchor="middle">STOP</text>
    <rect x="676" y="150" width="82" height="60" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <text x="717" y="180" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">model</text>
    <g font-size="16" fill="#14202B">
      <text x="440" y="254">Training happens once,</text>
      <text x="440" y="276">finishes, and stops. What</text>
      <text x="440" y="298">comes out never changes.</text>
    </g>
    <text x="400" y="358" font-size="14" fill="#55636F" text-anchor="middle">To make it better, people collect new examples and train a brand new model. The old one never grew.</text>
  </g>
</svg>
