<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same mistake, priced two ways</title>
  <desc>On one pair of axes, two cost curves for a row whose true answer was yes. Across is the probability the model gave, from 0 to 1; up is the cost of that row, from 0 to 4. The log loss curve, minus ln of p, climbs without limit as p falls. The squared error curve, one minus p all squared, flattens against a dashed line at 1 and can never pass it. Two probabilities are ringed on both curves. At p = 0.02, a disaster, log loss is 3.9120 and squared error is 0.9604. At p = 0.40, a near miss, log loss is 0.9163 and squared error is 0.3600. The two divisions are printed: 3.9120 divided by 0.9163 is 4.27, and 0.9604 divided by 0.3600 is 2.67.</desc>
