<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A filter is a sieve</title>
  <desc>A pile of twelve rows is tipped into a sieve carrying the test runs greater than fifty. Five rows fall out below and seven are swept aside, with the arithmetic five plus seven equals twelve printed beside them.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A filter is a sieve</text>
  <rect x="290" y="72" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="290" y1="86" x2="510" y2="86"/>
    <line x1="290" y1="100" x2="510" y2="100"/>
    <line x1="290" y1="114" x2="510" y2="114"/>
    <line x1="290" y1="128" x2="510" y2="128"/>
  </g>
  <text x="400" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">12 rows in</text>
  <line x1="400" y1="146" x2="400" y2="164" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(400 168) rotate(90)"/>
  <path d="M270 174 L530 174 L448 240 L352 240 Z" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="300" y1="204" x2="500" y2="204"/>
    <line x1="322" y1="182" x2="322" y2="230"/>
    <line x1="400" y1="178" x2="400" y2="238"/>
    <line x1="478" y1="182" x2="478" y2="230"/>
  </g>
  <rect x="304" y="186" width="192" height="34" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="203" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">runs more than 50?</text>
  <text x="560" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">the test lives on the sieve</text>
  <line x1="400" y1="244" x2="400" y2="266" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(400 270) rotate(90)"/>
  <rect x="300" y="276" width="200" height="62" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="300" y1="290" x2="500" y2="290"/>
    <line x1="300" y1="304" x2="500" y2="304"/>
    <line x1="300" y1="318" x2="500" y2="318"/>
  </g>
  <text x="400" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">5 rows out</text>
  <line x1="296" y1="216" x2="196" y2="252" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(194 253) rotate(160)"/>
  <rect x="60" y="258" width="130" height="56" rx="10" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="125" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">7 rows</text>
  <text x="125" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">did not pass the test</text>
  <rect x="590" y="258" width="170" height="56" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="675" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">5 + 7 = 12</text>
  <text x="675" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">check this every time</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">What comes out is still rows, with all their labels. There are simply fewer of them.</text>
</svg>
