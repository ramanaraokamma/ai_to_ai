  <text x="205" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">5 &#247; 12 = 0.4167, then 0 &#247; 4 = 0.0000 twice</text>
