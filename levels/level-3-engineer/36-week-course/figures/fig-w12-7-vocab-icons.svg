<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Seven words from Week 12, drawn</title>
  <desc>Four labelled tiles. Loss and loss surface: the ten squared errors at w equals 6 averaging to 1540 divided by 10 equals 154.00, and the eight losses 2464, 1386, 616, 154, 0, 154, 616 and 1386 drawn as a symmetric valley with its bottom at w equals 8. Slope at a point and derivative: 3.001 times 3.001 equals 9.006001, 2.999 times 2.999 equals 8.994001, the difference 0.012000 divided by 0.002 giving 6.000, and the three measured answers 2, 6 and 10 at x equals 1, 3 and 5 shown to be 2 times x. Numerical gradient: the same nudge on the ten-student loss giving minus 462.0000 at w equals 2, matched by the shortcut 77 times w minus 8, with a warning that a nudge of a millionth of a millionth gives the worse answer 6.0005334035. Learning rate and gradient descent: lr 0.001 crawling to 7.1905, lr 0.01 arriving at 8.0000, and lr 0.03 exploding to 5135.8303.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Seven words from Week 12, drawn</text>
  <rect x="30" y="66" width="359" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">loss &amp; loss surface</text>
  <text x="44" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">one number for how wrong. Big is bad.</text>
  <rect x="44" y="122" width="150" height="30" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="119" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">1540 / 10 = 154</text>
  <polyline points="214,150 236,138 258,126 280,120 302,126 324,138 346,150" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="280" cy="120" r="5" fill="#CC2B1D" stroke="#CC2B1D" stroke-width="2"/>
  <text x="280" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">bottom at w = 8</text>
  <text x="44" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="start">2464 1386 616 154 0 154 616 1386</text>
  <text x="44" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">a valley, and it is symmetric because errors are squared</text>
  <rect x="401" y="66" width="369" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="415" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">slope at a point &amp; derivative</text>
  <text x="415" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">3.001 &#215; 3.001 = 9.006001</text>
  <text x="415" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">2.999 &#215; 2.999 = 8.994001</text>
  <rect x="415" y="140" width="200" height="30" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="515" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.012000 / 0.002 = 6.000</text>
  <text x="415" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">at x = 1, 3, 5 the slopes are 2, 6, 10</text>
  <rect x="625" y="140" width="130" height="30" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="690" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">that is 2 &#215; x</text>
  <text x="415" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">a rule, noticed after measuring &#8212; not looked up</text>
  <rect x="30" y="228" width="359" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">numerical gradient</text>
  <text x="44" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">nudge, subtract, divide. Slow, honest if h is sane.</text>
  <rect x="44" y="284" width="331" height="30" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="209" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">w = 2  slope -462.0000  =  77 x (w-8)</text>
  <rect x="44" y="320" width="331" height="30" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="209" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">h = 1e-12  ->  6.0005334035</text>
  <text x="44" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">smaller is not better: h = 0.001 is the sweet spot</text>
  <rect x="401" y="228" width="369" height="148" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="415" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">learning rate &amp; gradient descent</text>
  <text x="415" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">w = w - lr * slope,  repeat</text>
  <rect x="415" y="284" width="340" height="26" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="585" y="297" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">lr 0.001, 25 steps: w 7.1905 &#8212; too slow</text>
  <rect x="415" y="314" width="340" height="26" rx="6" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="585" y="327" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">lr 0.01, 25 steps: w 8.0000 &#8212; arrived</text>
  <rect x="415" y="344" width="340" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="585" y="357" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">lr 0.03, 25 steps: w 5135.8303 &#8212; exploded</text>
</svg>
