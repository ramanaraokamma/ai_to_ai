<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>MAE is the average height of the misses</title>
  <desc>Six pink bars of heights 5.0, 3.4, 2.8, 1.2, 0.6 and 3.0, one per classmate, with a dashed purple line drawn across them at 2.67 labelled MAE equals 2.67, off by about 3 marks.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">MAE is the average height of the misses</text>
  <line x1="110" y1="264.0" x2="700" y2="264.0" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="98" y="268.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <line x1="110" y1="228.0" x2="700" y2="228.0" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="98" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">2</text>
  <line x1="110" y1="192.0" x2="700" y2="192.0" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="98" y="196.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">3</text>
  <line x1="110" y1="156.0" x2="700" y2="156.0" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="98" y="160.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">4</text>
  <line x1="110" y1="120.0" x2="700" y2="120.0" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="98" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">5</text>
  <line x1="110" y1="84.0" x2="700" y2="84.0" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="98" y="88.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">6</text>
  <text x="98" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <rect x="132" y="120.0" width="52" height="180.0" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="158" y="110.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">5.0</text>
  <text x="158" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1 h</text>
  <rect x="228" y="177.6" width="52" height="122.4" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="254" y="167.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3.4</text>
  <text x="254" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 h</text>
  <rect x="324" y="199.2" width="52" height="100.8" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="350" y="189.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2.8</text>
  <text x="350" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 h</text>
  <rect x="420" y="256.8" width="52" height="43.2" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="446" y="246.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1.2</text>
  <text x="446" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4 h</text>
  <rect x="516" y="278.4" width="52" height="21.6" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="542" y="268.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.6</text>
  <text x="542" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5 h</text>
  <rect x="612" y="192.0" width="52" height="108.0" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="638" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3.0</text>
  <text x="638" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6 h</text>
  <line x1="110" y1="204.0" x2="700" y2="204.0" stroke="#6D28D9" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="110" y1="84" x2="110" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="110" y1="300" x2="700" y2="300" stroke="#14202B" stroke-width="2"/>
  <rect x="556" y="96" width="214" height="60" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="663" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">MAE = 2.67</text>
  <text x="663" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">“off by about 3 marks”</text>
  <line x1="608" y1="162" x2="570" y2="198.0" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(570 198.0) rotate(136.5)"/>
  <text x="405" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">one bar per classmate  —  each bar is |miss|</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Sizes only, no signs. Add them, divide by six.</text>
</svg>
