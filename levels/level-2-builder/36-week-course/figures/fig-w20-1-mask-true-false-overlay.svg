<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A mask is a yes/no array, cell for cell</title>
  <desc>Two grids of the same size sit side by side. The left grid holds four students' scores across five tests. An arrow labelled scores greater than 50 leads to the right grid, which holds True in green or False in red in exactly the same positions. One pair of cells is ringed in pink: a score of 50 maps to False.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A mask is a yes/no array, cell for cell</text>
