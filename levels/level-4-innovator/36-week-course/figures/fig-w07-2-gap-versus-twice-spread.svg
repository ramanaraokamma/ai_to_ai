<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A difference counts only when the gap is bigger than twice the larger spread</title>
  <desc>Two worked rows from the Week 7 table, each with a blue gap bar above a gold twice-the-spread bar on the same scale. Dropout 0.3: gap 0.043 minus 0.039 is 0.004, twice the larger spread 2 times 0.013 is 0.026, so the gap is shorter and the verdict is inside noise. Learning rate 1e-4: gap 0.079 minus 0.039 is 0.040, twice the larger spread 2 times 0.012 is 0.024, so the gap is longer and the verdict is WORSE, marked with a cross.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Is the gap bigger than twice the spread?</text>
  <rect x="20" y="76" width="760" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="36" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">dropout 0.3</text>
  <text x="36" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">this row vs baseline</text>
  <text x="36" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">baseline 0.039 &#177; 0.008</text>
  <text x="292" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">gap</text>
  <rect x="300" y="98" width="20" height="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="328" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.043 &#8722; 0.039 = 0.004</text>
  <text x="292" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">2 &#215; spread</text>
  <rect x="300" y="142" width="130" height="24" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <text x="438" y="159" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2 &#215; 0.013 = 0.026</text>
  <rect x="656" y="98" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="706" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" dominant-baseline="central">inside noise</text>
  <text x="706" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.004 &lt; 0.026</text>
  <rect x="20" y="200" width="760" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="36" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">lr 1e-4</text>
  <text x="36" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">this row vs baseline</text>
  <text x="36" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">baseline 0.039 &#177; 0.008</text>
  <text x="292" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">gap</text>
  <rect x="300" y="222" width="200" height="24" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="508" y="239" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">0.079 &#8722; 0.039 = 0.040</text>
  <text x="292" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">2 &#215; spread</text>
  <rect x="300" y="266" width="120" height="24" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <text x="428" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2 &#215; 0.012 = 0.024</text>
  <g transform="translate(680,204) scale(0.5)">
  <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="38" y1="38" x2="62" y2="62" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
    <line x1="62" y1="38" x2="38" y2="62" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  </g>
  </g>
  <text x="706" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle">WORSE</text>
  <text x="706" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.040 &gt; 0.024</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A habit we chose, not a theorem: with 3 seeds we could not show a difference.</text>
</svg>
