<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Momentum reaches the target in fewer steps because it carries old steps, and that is also why it overshoots</title>
  <desc>Two rows of numbered circles on the number line for w, with a dashed line at the target w = 0. Plain SGD on f(w) = w times w from w = 1.0, learning rate 0.1: w is 1.0000, 0.8000, 0.6400, 0.5120 and 0.4096 after steps 0 to 4, creeping toward zero and never passing it. Momentum: w is 1.0000, 0.8000, 0.4600, 0.0620 and minus 0.3086, so at step 4 it has gone past zero, marked as an overshoot.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Momentum arrives sooner, then overshoots</text>
  <rect x="20" y="92" width="760" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="20" y="214" width="760" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="36" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">plain SGD</text>
  <text x="36" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="start">momentum</text>
  <text x="780" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">number in a circle = step</text>
  <text x="330" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">target w = 0</text>
  <polyline points="710,148 634,148 573.2,148 524.6,148 485.6,148" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="710" cy="148" r="13" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="710" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="710" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1.0000</text>
  <circle cx="634" cy="148" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="634" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="634" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.8000</text>
  <circle cx="573.2" cy="148" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="573.2" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="573.2" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.6400</text>
  <circle cx="524.6" cy="148" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="524.6" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="524.6" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.5120</text>
  <circle cx="485.6" cy="148" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="485.6" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="485.6" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.4096</text>
  <polyline points="710,270 634,270 504.8,270 353.6,270 212.7,270" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="710" cy="270" r="13" fill="#FFFFFF" stroke="#14202B" stroke-width="3"/>
  <text x="710" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="710" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1.0000</text>
  <circle cx="634" cy="270" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="634" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="634" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.8000</text>
  <circle cx="504.8" cy="270" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="504.8" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="504.8" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.4600</text>
  <circle cx="353.6" cy="270" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="353.6" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="353.6" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0620</text>
  <circle cx="212.7" cy="270" r="13" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="212.7" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="212.7" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">&#8722;0.3086</text>
  <line x1="330" y1="86" x2="330" y2="322" stroke="#14202B" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="468" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end">creeps toward 0,</text>
  <text x="468" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end">never passes it</text>
  <text x="213" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle">overshoot: past 0</text>
  <text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Momentum is at 0.0620 after step 3 (SGD 0.5120), then goes past zero to &#8722;0.3086.</text>
</svg>
