<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank: plot the wobble of a count of 50 runs against p and find where it is largest</title>
  <desc>An empty plot with p from 0 to 1 on the horizontal axis, marked at 0, 0.1, 0.3, 0.5, 0.7, 0.9 and 1, and the wobble of the count from 0 to 4 on the vertical axis. No dots are drawn. On the right, seven empty boxes, one for each p, to work out the square root of 50 times p times 1 minus p, and two empty boxes asking where the highest dot is and what the wobble is at p equal to 0 and to 1.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the wobble curve, n = 50</text>
  <line x1="90" y1="320" x2="90" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="90" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="120" y1="320" x2="120" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="120" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.1</text>
  <line x1="180" y1="320" x2="180" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="180" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.3</text>
  <line x1="240" y1="320" x2="240" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="240" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="300" y1="320" x2="300" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="300" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.7</text>
  <line x1="360" y1="320" x2="360" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="360" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.9</text>
  <line x1="390" y1="320" x2="390" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="390" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="90" y1="320" x2="390" y2="320" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="82" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="90" y1="260" x2="390" y2="260" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="82" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <line x1="90" y1="200" x2="390" y2="200" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="82" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">2</text>
  <line x1="90" y1="140" x2="390" y2="140" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="82" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">3</text>
  <line x1="90" y1="80" x2="390" y2="80" stroke="#C7CDD4" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="82" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">4</text>
  <line x1="90" y1="320" x2="390" y2="320" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="320" x2="90" y2="80" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="240" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">p, the chance one run lands</text>
  <text x="40" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 40 200)">wobble of the count</text>
  <rect x="430" y="66" width="346" height="282" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="446" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">Use the four steps of Page 33.1 for n = 50.</text>
  <text x="446" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">Work each one, then plot a dot above its p.</text>
  <text x="446" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">p = 0</text>
  <rect x="520" y="126" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="446" y="167" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">p = 0.1</text>
  <rect x="520" y="152" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="446" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">p = 0.3</text>
  <rect x="520" y="178" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="446" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">p = 0.5</text>
  <rect x="520" y="204" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="446" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">p = 0.7</text>
  <rect x="520" y="230" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="446" y="271" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">p = 0.9</text>
  <rect x="520" y="256" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="446" y="297" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">p = 1</text>
  <rect x="520" y="282" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="618" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">Join the dots.</text>
  <text x="618" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">Highest dot at p =</text>
  <rect x="618" y="198" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="618" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">Wobble at p = 0</text>
  <text x="618" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">and at p = 1:</text>
  <rect x="618" y="270" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Fill the boxes first, then plot; check against the ANSWERS page.</text>
</svg>
