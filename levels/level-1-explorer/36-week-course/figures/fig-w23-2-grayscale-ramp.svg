<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The 0 to 255 brightness ramp</title>
  <desc>Six swatches in a row running from black to white, labelled 0, 32, 64, 128, 192 and 255, each with an everyday example of that brightness.</desc>
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">0 is no light. 255 is all the light.</text><rect x="32" y="80" width="116" height="118" fill="#14202B" stroke="#14202B" stroke-width="2"/>
<text x="90.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0</text><text x="90.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">screen off</text><text x="90.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">in the dark</text><rect x="158" y="80" width="116" height="118" fill="#313C46" stroke="#14202B" stroke-width="2"/>
<text x="216.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">32</text><text x="216.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">shadow under</text><text x="216.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the bed</text><rect x="284" y="80" width="116" height="118" fill="#4F5860" stroke="#14202B" stroke-width="2"/>
<text x="342.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">64</text><text x="342.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">dark denim</text><text x="342.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">jeans</text><rect x="410" y="80" width="116" height="118" fill="#8A9095" stroke="#14202B" stroke-width="2"/>
<text x="468.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">128</text><text x="468.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">pencil shading</text><text x="468.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">an elephant</text><rect x="536" y="80" width="116" height="118" fill="#C5C8CB" stroke="#14202B" stroke-width="2"/>
<text x="594.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">192</text><text x="594.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a cloudy sky</text><rect x="662" y="80" width="116" height="118" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
<text x="720.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">255</text><text x="720.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">fresh paper</text><text x="720.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">in sunlight</text><line x1="32" y1="304" x2="768" y2="304" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
<polyline points="758,296 768,304 758,312" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="42,296 32,304 42,312" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="38" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">darker</text><text x="762" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="end">brighter</text><text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">It stops at 255 because one byte of memory holds exactly 256 values: 0 to 255.</text></svg>
