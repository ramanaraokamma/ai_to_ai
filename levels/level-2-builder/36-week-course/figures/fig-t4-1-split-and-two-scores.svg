<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A deck of cards being cut once into a large pile labelled train with 120 cards and a small sealed pile labelled test with 30 cards, with two score readouts beside them and only the test score circled as the one you may quote</title>
  <desc>A stack of 150 rows on the left is cut once by a dashed pink line labelled one cut before the model sees anything. It becomes a large blue TRAIN pile of 120 rows, 80 percent, which the model studies, and a small pink TEST pile of 30 rows, 20 percent, marked sealed, nobody looks. Two readouts on the right: the training score 0.9417, labelled a fact about the past, and the held-back score 0.7333 with a green tick. A green band reads: quote this one, and only this one.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Cut the deck first. Score on the sealed pile.</text>
  <text x="104" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">150 rows</text>
  <rect x="56" y="92" width="96" height="104" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="60" y="88" width="96" height="104" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="64" y="84" width="96" height="104" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="68" y="80" width="96" height="104" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="72" y="76" width="96" height="104" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="104" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">all your</text>
  <text x="104" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">data</text>
  <line x1="184" y1="74" x2="184" y2="200" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="184" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">one cut</text>
  <text x="184" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">before the model</text>
  <text x="184" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">sees anything</text>
  <line x1="200" y1="104" x2="244" y2="104" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(244 104) rotate(0.00)"/>
  <rect x="252" y="78" width="128" height="84" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="256" y="74" width="128" height="84" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="260" y="70" width="128" height="84" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="264" y="66" width="128" height="84" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="316" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">TRAIN</text>
  <text x="316" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">120 rows  ·  80%</text>
  <text x="316" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the model studies these</text>
  <line x1="200" y1="180" x2="244" y2="180" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(244 180) rotate(0.00)"/>
  <rect x="252" y="208" width="128" height="58" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="316" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">TEST</text>
  <text x="316" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">30 rows  ·  20%</text>
  <text x="316" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">SEALED. Nobody looks.</text>
  <line x1="396" y1="104" x2="448" y2="104" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(448 104) rotate(0.00)"/>
  <rect x="456" y="76" width="296" height="56" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="472" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">score on the TRAINING rows</text>
  <text x="472" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#14202B">0.9417</text>
  <text x="600" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">a fact about the past</text>
  <line x1="396" y1="232" x2="448" y2="232" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(448 232) rotate(0.00)"/>
  <rect x="456" y="204" width="296" height="56" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="472" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">score on the HELD-BACK rows</text>
  <text x="472" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#14202B">0.7333</text>
  <g transform="translate(708,216) scale(0.4706)"><circle cx="34" cy="34" r="32" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="4"/><polyline points="18,36 29,48 52,22" fill="none" stroke="#1B7A4B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="456" y="278" width="296" height="46" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="604" y="301" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">quote THIS one, and only this one</text>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two numbers. One of them is a claim about the future. The other is a memory test.</text>
  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">The gap between them, 0.9417 - 0.7333 = 0.2083, is itself information.</text>
</svg>
