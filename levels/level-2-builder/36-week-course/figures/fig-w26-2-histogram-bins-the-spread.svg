  <line x1="136" y1="92" x2="136" y2="420" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="212" y1="92" x2="212" y2="420" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="288" y1="92" x2="288" y2="420" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
