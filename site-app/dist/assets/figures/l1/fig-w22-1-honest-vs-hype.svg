<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two ways to report the same result</title>
  <desc>Two panels side by side. The left panel, marked wrong, reports only 95 percent accurate. The right panel, marked correct, reports 11 of 15 held-out photos, the baseline, the worst class and the commonest mistake.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two ways to report the same result</text><line x1="400" y1="70" x2="400" y2="340" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="40" y="70" width="330" height="252" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<rect x="430" y="70" width="330" height="252" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<g transform="translate(56,84) scale(0.40)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g>
<g transform="translate(446,84) scale(0.40)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="110" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">The demo answer</text><text x="500" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">The honest answer</text><text x="66" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">"My model is 95% accurate."</text><text x="66" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Out of how many photos?  Not said.</text><text x="66" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Better than guessing?  Not said.</text><text x="66" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Which class is broken?  Not said.</text><text x="66" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">How many times retested?  Not said.</text><text x="456" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">11 of 15 held-out photos</text><text x="456" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">= 0.7333 = 73.3%</text><text x="456" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Baseline (blind guess) = 33.3%</text><text x="456" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Worst class: comb, 2/5 = 40%</text><text x="456" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Commonest mistake: comb called</text><text x="456" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">toothbrush, 2 times</text><text x="400" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same model, same fifteen photos. Only the honesty changed.</text></svg>
