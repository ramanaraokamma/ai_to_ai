<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Three families of trouble</title>
  <desc>Three grouped panels. The first, it never started, holds SyntaxError and IndentationError, and its tell is no output at all with a caret under one spot. The second, it started then stopped, holds NameError, TypeError, ValueError, ZeroDivisionError and KeyboardInterrupt, and its tell is some output followed by Traceback and a line number. The third, it finished and lied, holds wrong order, off-by-one and wrong indent, and its tell is no message anywhere. A panel underneath says read the last line first, then the line number.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three families of trouble</text>
  <rect x="40" y="86" width="420" height="92" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">It never started</text>
  <rect x="64" y="126" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">SyntaxError</text>
  <rect x="64" y="152" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">IndentationError</text>
  <text x="250" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no output at all, and a ^ under one spot</text>
  <rect x="40" y="214" width="420" height="170" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">It started, then stopped</text>
  <rect x="64" y="254" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">NameError</text>
  <rect x="64" y="280" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">TypeError</text>
  <rect x="64" y="306" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">ValueError</text>
  <rect x="64" y="332" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">ZeroDivisionError</text>
  <rect x="64" y="358" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="369" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">KeyboardInterrupt</text>
  <text x="250" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">some output, then Traceback and a line number</text>
  <rect x="40" y="420" width="420" height="118" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="444" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">It finished, and lied</text>
  <rect x="64" y="460" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">wrong order</text>
  <rect x="64" y="486" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="497" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">off-by-one</text>
  <rect x="64" y="512" width="372" height="22" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="76" y="523" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">wrong indent</text>
  <text x="250" y="558" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no message anywhere. Only you can tell.</text>
  <rect x="40" y="578" width="420" height="64" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="250" y="604" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Read the LAST line first. It names the family.</text>
  <text x="250" y="626" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Then read the line number. It names the place.</text>
</svg>
