<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The Teachable Machine screen and the five things you click</title>
  <desc>A simplified Teachable Machine screen with three areas: the class column on the left, the training box in the middle and the preview panel on the right. Five numbered pink pins mark the pencil to rename a class, the add a class button, the webcam and upload buttons, the train model button, and the menu at the top left used to download the project.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="38" font-size="24" fill="#14202B" text-anchor="middle">The five things you actually click, in order</text>

    <rect x="30" y="52" width="740" height="30" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <g stroke="#14202B" stroke-width="2.5" stroke-linecap="round">
      <line x1="44" y1="61" x2="64" y2="61"/>
      <line x1="44" y1="67" x2="64" y2="67"/>
      <line x1="44" y1="73" x2="64" y2="73"/>
    </g>
    <text x="118" y="72" font-size="12" fill="#55636F">Teachable Machine - Image Project</text>

    <rect x="30" y="92" width="280" height="258" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>

    <rect x="46" y="106" width="248" height="96" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="60" y="130" font-size="14" fill="#14202B">spoon</text>
    <g stroke="#845F00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M112 128 L126 114 L130 118 L116 132 Z"/>
      <line x1="112" y1="128" x2="111" y2="133"/>
    </g>
    <rect x="60" y="146" width="80" height="30" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <text x="100" y="165" font-size="12" fill="#14202B" text-anchor="middle">Webcam</text>
    <rect x="150" y="146" width="80" height="30" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <text x="190" y="165" font-size="12" fill="#14202B" text-anchor="middle">Upload</text>
    <text x="60" y="194" font-size="12" fill="#55636F">41 image samples</text>

    <rect x="46" y="212" width="248" height="70" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="60" y="236" font-size="14" fill="#14202B">toothbrush</text>
    <text x="60" y="262" font-size="12" fill="#55636F">40 image samples</text>

    <rect x="46" y="292" width="248" height="44" rx="8" fill="#FFFFFF" stroke="#55636F" stroke-width="2" stroke-dasharray="6 6" stroke-linejoin="round"/>
    <text x="150" y="319" font-size="14" fill="#14202B" text-anchor="middle">+ Add a class</text>

    <rect x="330" y="150" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="410" y="176" font-size="16" fill="#14202B" text-anchor="middle">Training</text>
    <rect x="350" y="188" width="120" height="40" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <text x="410" y="213" font-size="14" fill="#14202B" text-anchor="middle">Train Model</text>

    <rect x="510" y="92" width="260" height="258" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="640" y="118" font-size="16" fill="#14202B" text-anchor="middle">Preview</text>
    <rect x="530" y="132" width="220" height="110" rx="8" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="640" cy="170" rx="13" ry="18" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5"/>
    <line x1="640" y1="188" x2="640" y2="226" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>

    <rect x="606" y="256" width="118.3" height="16" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <rect x="606" y="278" width="6.5" height="16" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <rect x="606" y="300" width="5.2" height="16" rx="3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <g font-size="12" fill="#14202B" text-anchor="end">
      <text x="598" y="268">spoon</text>
      <text x="598" y="290">tbrush</text>
      <text x="598" y="312">comb</text>
    </g>
    <g font-size="12" fill="#14202B">
      <text x="730" y="268">91%</text>
      <text x="620" y="290">5%</text>
      <text x="619" y="312">4%</text>
    </g>
    <rect x="560" y="322" width="160" height="24" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="640" y="338" font-size="12" fill="#14202B" text-anchor="middle">Export Model</text>

    <g stroke="#C42B8C" stroke-width="2">
      <line x1="132" y1="124" x2="236" y2="124"/>
      <line x1="232" y1="161" x2="236" y2="161"/>
      <line x1="410" y1="228" x2="410" y2="240"/>
      <line x1="68" y1="67" x2="76" y2="67"/>
    </g>
    <g>
      <circle cx="250" cy="124" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="250" y="129" font-size="14" fill="#14202B" text-anchor="middle">1</text>
      <circle cx="266" cy="314" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="266" y="319" font-size="14" fill="#14202B" text-anchor="middle">2</text>
      <circle cx="250" cy="161" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="250" y="166" font-size="14" fill="#14202B" text-anchor="middle">3</text>
      <circle cx="410" cy="254" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="410" y="259" font-size="14" fill="#14202B" text-anchor="middle">4</text>
      <circle cx="89" cy="67" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
      <text x="89" y="72" font-size="14" fill="#14202B" text-anchor="middle">5</text>
    </g>

    <text x="400" y="378" font-size="14" fill="#55636F" text-anchor="middle">1 rename  ·  2 add the third class  ·  3 load photos  ·  4 train  ·  5 menu, then download</text>
  </g>
</svg>
