<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 7 words as pictures</title>
  <desc>Five icon cards in a row. Pattern is a tall bar of four out of four beside a short bar of one out of four. Condition is a box reading IF rain_mm is 3 or more. Threshold is a number line cut at three. Rulebook is a stack of three numbered rungs with a default rung underneath. Default is an arrow falling past two rungs into a box reading OTHERWISE on time.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
  <rect x="20" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="176" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="332" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="488" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="644" y="58" width="136" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- 1 pattern : two bars, 4 of 4 against 1 of 4 -->
  <g transform="translate(36,92)">
    <rect x="10" y="6" width="42" height="96" rx="5" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <rect x="72" y="78" width="42" height="24" rx="5" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="102" x2="124" y2="102" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
      <text x="31" y="122">4 of 4</text>
      <text x="93" y="122">1 of 4</text>
    </g>
    <text x="62" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">bet on the left one</text>
  </g>
  <text x="93" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">pattern</text>
  <text x="93" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">repeats enough that</text>
  <text x="93" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">betting beats guessing</text>

  <!-- 2 condition : the testable box -->
  <g transform="translate(190,104)">
    <rect x="0" y="0" width="118" height="76" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="59" y="30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">IF</text>
    <text x="59" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">rain_mm &gt;= 3</text>
    <text x="59" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no adjectives allowed</text>
  </g>
  <text x="249" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">condition</text>
  <text x="249" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the part after IF —</text>
  <text x="249" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a test a machine can run</text>

  <!-- 3 threshold : the cut on a number line -->
  <g transform="translate(346,112)">
    <line x1="0" y1="46" x2="118" y2="46" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <g fill="#1F6FB2">
      <circle cx="10" cy="46" r="6"/>
      <circle cx="26" cy="46" r="6"/>
      <circle cx="42" cy="46" r="6"/>
      <circle cx="80" cy="46" r="6"/>
      <circle cx="96" cy="46" r="6"/>
      <circle cx="112" cy="46" r="6"/>
    </g>
    <line x1="60" y1="14" x2="60" y2="78" stroke="#C42B8C" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
    <text x="60" y="8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">3</text>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
      <text x="26" y="98">0 1 2</text>
      <text x="96" y="98">4 5 6</text>
    </g>
    <text x="59" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a human put it there</text>
  </g>
  <text x="405" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">threshold</text>
  <text x="405" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the cut-off number</text>
  <text x="405" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">inside a condition</text>

  <!-- 4 rulebook : numbered rungs plus default -->
  <g transform="translate(502,96)">
    <rect x="0" y="0" width="118" height="28" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="36" width="118" height="28" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="72" width="118" height="28" rx="6" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="108" width="118" height="28" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
      <text x="59" y="19">RULE 1</text>
      <text x="59" y="55">RULE 2</text>
      <text x="59" y="91">RULE 3</text>
      <text x="59" y="127">DEFAULT</text>
    </g>
  </g>
  <text x="561" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">rulebook</text>
  <text x="561" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rules in order,</text>
  <text x="561" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">plus a default</text>

  <!-- 5 default : the catch-all at the bottom -->
  <g transform="translate(658,96)">
    <rect x="0" y="0" width="108" height="22" rx="5" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="0" y="34" width="108" height="22" rx="5" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
      <text x="54" y="15">no match</text>
      <text x="54" y="49">no match</text>
    </g>
    <line x1="54" y1="22" x2="54" y2="34" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <line x1="54" y1="56" x2="54" y2="70" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
    <polyline points="48,64 54,72 60,64" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="74" width="108" height="40" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="54" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">OTHERWISE</text>
    <text x="54" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">on time</text>
    <text x="54" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7 of the 14 days</text>
  </g>
  <text x="712" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">default</text>
  <text x="712" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the answer when no</text>
  <text x="712" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">rule fires at all</text>

  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A pattern is counted. A rule is written. A rulebook is ordered. And the default is the busiest line in it.</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every threshold in every hand-written rule is a number a person made up in a gap.</text>
</svg>
