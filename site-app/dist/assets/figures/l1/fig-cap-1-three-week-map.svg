<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three weeks, seven milestones, one showcase</title>
  <desc>Three week panels left to right. Week thirty-four, build it and test it: the brief, collect and split, train and save, the honest test. Week thirty-five, app report demo: the Scratch app, bias report card and sign, booth and rehearse. Week thirty-six, prove it and present it: the paper, the showcase, the reckoning.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three weeks, seven milestones, one showcase</text>
  <rect x="40" y="74" width="224" height="244" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="40" y="74" width="224" height="44" fill="#D9EAF9"/>
  <line x1="40" y1="118" x2="264" y2="118" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
  <text x="152" y="96.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" font-weight="700">Week 34</text>
  <text x="152" y="112.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Build it and test it</text>
  <rect x="52" y="128" width="200" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="152" y="148.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">M1  The brief</text>
  <rect x="52" y="166" width="200" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="152" y="186.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">M2  Collect + SPLIT</text>
  <rect x="52" y="204" width="200" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="152" y="224.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">M3  Train + save</text>
  <rect x="52" y="242" width="200" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="152" y="262.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">M4  The honest test</text>
  <text x="152" y="298.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you hold: booth-v1.tm </text>
  <text x="152" y="313.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">+ a scoring sheet</text>
  <line x1="270" y1="196" x2="318" y2="196" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="312,188 326,196 312,204" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
