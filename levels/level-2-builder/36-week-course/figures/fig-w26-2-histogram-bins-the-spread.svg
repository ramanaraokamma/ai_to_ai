<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>One bin, one count, one bar</title>
  <desc>Twelve values sit as dots on a number line from 40 to 90. Dashed lines drop each dot into one of five bins. Each bin shows its count, one, three, four, three and one, and those counts become the heights of five touching bars below.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One bin, one count, one bar</text>
