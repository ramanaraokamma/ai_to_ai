<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same 31-character sentence cut into letters, whole words and byte-pair pieces; only whole words leave holes</title>
  <desc>Three aligned rows for the sentence the baker practised the cricket. The top row has 31 small cells, one per character, with spaces grey. The middle row has five word boxes; practised and cricket are dashed with a cross, marking holes. The bottom row has 17 piece boxes: the, space, baker, space, p, r, ac, t, is, ed, space, the, space, c, ri, c, ket.</desc>
