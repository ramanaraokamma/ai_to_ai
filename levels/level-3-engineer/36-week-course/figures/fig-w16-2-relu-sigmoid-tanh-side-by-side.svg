<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three squashes, on the same two numbers</title>
  <desc>Three small charts side by side inside one panel, each with a labelled vertical scale and the z axis drawn through the value zero. Two points are marked on each curve, at z equals 0.2 and z equals minus 2.3. ReLU is flat then a straight rise and gives 0.200 and 0.000. Sigmoid is an S curve from 0 to 1 and gives 0.550 and 0.091. Tanh is an S curve from minus 1 to 1 and gives 0.197 and minus 0.980. Only tanh returns a negative number.</desc>
