<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The inner two numbers must match</title>
  <desc>Two blocks of cells with a multiplication sign between them and an equals sign after. The first is labelled 3 comma 2, the second 2 comma 4, and the two 2s are boxed in pink and joined underneath by a dashed bracket reading these two must match. The answer block is labelled 3 comma 4. A note says the 2s cancel and the outer numbers survive: 3 from A and 4 from B.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The inner two numbers must match</text>
  <text x="96" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A</text>
  <text x="320" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">B</text>
  <text x="620" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A @ B</text>
  <rect x="40" y="104" width="112" height="132" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="48" y1="148" x2="144" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="192" x2="144" y2="192" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="232" y="104" width="176" height="132" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <line x1="240" y1="170" x2="400" y2="170" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="276" y1="112" x2="276" y2="228" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="320" y1="112" x2="320" y2="228" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="364" y1="112" x2="364" y2="228" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="532" y="104" width="176" height="132" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="540" y1="148" x2="700" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="540" y1="192" x2="700" y2="192" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="576" y1="112" x2="576" y2="228" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="620" y1="112" x2="620" y2="228" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="664" y1="112" x2="664" y2="228" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="192" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">&#215;</text>
  <text x="470" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
  <text x="52" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(3,</text>
  <rect x="78.2" y="252" width="14.4" height="22" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="81.2" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">2</text>
  <text x="93.60000000000001" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">)</text>
  <text x="258" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(</text>
  <rect x="267.4" y="252" width="14.4" height="22" rx="4" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="270.4" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">2</text>
  <text x="282.79999999999995" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">, 4)</text>
  <text x="556" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">(3, 4)</text>
  <text x="96" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 rows, 2 columns</text>
  <text x="320" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2 rows, 4 columns</text>
  <text x="620" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 rows, 4 columns</text>
  <path d="M78 276 V314 H272 V276" fill="none" stroke="#C42B8C" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="88" y="320" width="174" height="26" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="175" y="333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">these two must match</text>
  <rect x="430" y="300" width="300" height="46" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="580" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the 2s cancel, the outer numbers survive</text>
  <text x="580" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3 from A, 4 from B, so the answer is (3, 4)</text>
  <text x="400" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Say it out loud: “three by two, times two by four, gives three by four.”</text>
</svg>
