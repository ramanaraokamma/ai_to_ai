<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Six words from Week 3, drawn</title>
  <desc>Six labelled tiles. Pipeline: an outer box containing a blue prep block, an arrow, and a purple model block, labelled one object one fixed order. ColumnTransformer: a block of 8 columns splitting into two routes reading 5 to 5 and 3 to 15, joining a green block of 20, labelled chosen by name not position. Artifact: a fitted pipe box beside the words 5002 bytes on disk, labelled not the score not the code. joblib: a purple in RAM box with a dump arrow to a green dot joblib file and a load arrow back, labelled two lines both directions. Model card: four amber numbered bands reading 1 intended use, 2 out of scope, 3 unit, 4 data, and a line saying and 5, 6 and 7 as well. Clean room test: the three searches fit open bracket, make_data and train_test, each with a green count of 0, labelled counted not felt.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Six words from Week 3, drawn</text>
