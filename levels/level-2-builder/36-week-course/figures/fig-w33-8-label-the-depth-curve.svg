<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the depth curve yourself</title>
  <desc>An unlabelled chart with two unnamed series plotted against a dial setting running from one to fifteen. One series, drawn with round markers, climbs from about nought point three to almost one and never falls. The other, drawn with square markers, rises to a peak early and then sags, ending near zero. There is no legend and no title. Five empty dashed slots wait for the name of each series, the dial setting at the peak, and the names for the settings below and above that peak.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the depth curve yourself</text>
  <text x="400" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">No legend, no title. Work out which line is which from its shape alone.</text>
  <line x1="80" y1="90" x2="80" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="80" y1="300" x2="516" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="80" y1="266" x2="516" y2="266" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="74" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1.0</text>
  <text x="74" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <text x="74" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.0</text>
  <text x="80" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="170" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <text x="290" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <text x="410" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">12</text>
  <text x="500" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">15</text>
  <text x="298" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the dial setting</text>
  <polyline points="80,215 110,191 140,180 170,168 200,154 230,141 260,130 290,120 320,113 350,109 380,105 410,101 440,100 470,99 500,99" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="80,244 110,217 140,211 170,207 200,223 230,229 260,235 290,235 320,219 350,247 380,241 410,247 440,237 470,244 500,259" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#DBCEF3" stroke="#6D28D9" stroke-width="2">
    <circle cx="80" cy="215" r="5"/><circle cx="140" cy="180" r="5"/><circle cx="200" cy="154" r="5"/>
    <circle cx="260" cy="130" r="5"/><circle cx="320" cy="113" r="5"/><circle cx="380" cy="105" r="5"/>
    <circle cx="440" cy="100" r="5"/><circle cx="500" cy="99" r="5"/>
  </g>
  <g fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="75" y="239" width="10" height="10"/><rect x="135" y="206" width="10" height="10"/>
    <rect x="195" y="218" width="10" height="10"/><rect x="255" y="230" width="10" height="10"/>
    <rect x="315" y="214" width="10" height="10"/><rect x="375" y="236" width="10" height="10"/>
    <rect x="435" y="232" width="10" height="10"/><rect x="495" y="254" width="10" height="10"/>
  </g>
  <text x="546" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="start">A  the round-marker line is&#8230;</text>
  <rect x="546" y="112" width="214" height="30" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="546" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="start">B  the square-marker line is&#8230;</text>
  <rect x="546" y="182" width="214" height="30" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="546" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="start">C  dial setting at the peak</text>
  <rect x="546" y="252" width="214" height="30" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="40" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="start">D  settings left of the peak:</text>
  <rect x="216" y="342" width="150" height="26" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="392" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="start">E  settings right of the peak:</text>
  <rect x="586" y="342" width="150" height="26" rx="8" fill="none" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="546" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">Then draw a dashed vertical line at C.</text>
</svg>
