<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the three parts of a while loop</title>
  <desc>An unlabelled cycle to fill in. A blank box at the top feeds a blank diamond, whose yes exit leads down to a blank box that loops back to the diamond, and whose no exit leads right to a blank box marked out. Three empty pink caption boxes underneath ask for the name of each part, and a fourth asks which part is missing when a loop never ends.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the three parts of a while loop</text>

  <rect x="20" y="60" width="760" height="228" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>

  <rect x="140" y="84" width="180" height="40" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="336" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">part 1 &#8212; happens once, before anything</text>
  <line x1="230" y1="124" x2="230" y2="148" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-8,-11 0,0 8,-11" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(230 150)"/>

  <path d="M230 150 L340 186 L230 222 L120 186 Z" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="356" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">part 2 &#8212; asked before EVERY pass</text>

  <line x1="230" y1="222" x2="230" y2="242" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round"/>
  <text x="244" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">yes</text>
  <rect x="140" y="242" width="180" height="40" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="336" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">part 3 &#8212; the only thing that can end it</text>
  <path d="M140 262 H92 V186 H118" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(118 186)"/>

  <line x1="340" y1="186" x2="600" y2="186" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7"/>
  <text x="470" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">no</text>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(602 186)"/>
  <rect x="608" y="164" width="150" height="44" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-linejoin="round"/>
  <text x="683" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what happens after?</text>

  <rect x="24" y="322" width="176" height="46" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="112" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">part 1 is called...</text>
  <rect x="212" y="322" width="176" height="46" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">part 2 is called...</text>
  <rect x="400" y="322" width="176" height="46" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="488" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">part 3 is called...</text>
  <rect x="588" y="322" width="176" height="46" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="676" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">missing part = which bug?</text>
</svg>
