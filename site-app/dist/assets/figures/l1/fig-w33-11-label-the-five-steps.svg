<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label it: the five steps of an audit</title>
  <desc>Five empty numbered boxes in a row with blank writing lines inside, joined by arrows, and a bracket underneath joining boxes two and four with a blank line for what happens between them.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label it: the five steps of an audit</text>
  <path d="M186 224 V266 H614 V224" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="164" y1="160" x2="180" y2="160"/>
    <polyline points="176,154 186,160 176,166" stroke-linejoin="round"/>
    <line x1="308" y1="160" x2="324" y2="160"/>
    <polyline points="320,154 330,160 320,166" stroke-linejoin="round"/>
    <line x1="452" y1="160" x2="468" y2="160"/>
    <polyline points="464,154 474,160 464,166" stroke-linejoin="round"/>
    <line x1="596" y1="160" x2="612" y2="160"/>
    <polyline points="608,154 618,160 608,166" stroke-linejoin="round"/>
  </g>
  <g fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round">
    <rect x="40" y="106" width="124" height="118" rx="10"/>
    <rect x="186" y="106" width="124" height="118" rx="10"/>
    <rect x="330" y="106" width="124" height="118" rx="10"/>
    <rect x="474" y="106" width="124" height="118" rx="10"/>
    <rect x="618" y="106" width="124" height="118" rx="10"/>
  </g>
  <g>
    <circle cx="60" cy="126" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="206" cy="126" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="350" cy="126" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="494" cy="126" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="638" cy="126" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="60" y="131">1</text>
    <text x="206" y="131">2</text>
    <text x="350" y="131">3</text>
    <text x="494" y="131">4</text>
    <text x="638" y="131">5</text>
  </g>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round">
    <line x1="52" y1="170" x2="152" y2="170"/>
    <line x1="52" y1="196" x2="152" y2="196"/>
    <line x1="198" y1="170" x2="298" y2="170"/>
    <line x1="198" y1="196" x2="298" y2="196"/>
    <line x1="342" y1="170" x2="442" y2="170"/>
    <line x1="342" y1="196" x2="442" y2="196"/>
    <line x1="486" y1="170" x2="586" y2="170"/>
    <line x1="486" y1="196" x2="586" y2="196"/>
    <line x1="630" y1="170" x2="730" y2="170"/>
    <line x1="630" y1="196" x2="730" y2="196"/>
  </g>
  <rect x="300" y="248" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <line x1="312" y1="274" x2="488" y2="274" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what do you do with steps 2 and 4 together?</text>
  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One step per box, in order. Then fill the pink box.</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two of these five boxes must happen before the testing. Which two?</text>
</svg>
