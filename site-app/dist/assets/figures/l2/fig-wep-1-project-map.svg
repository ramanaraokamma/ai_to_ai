  <path d="M32 254 V270 H450 V254" fill="none" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M562 254 V270 H768 V254" fill="none" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="240" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">10 hours 20 minutes of this</text>
  <text x="672" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">and this</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every hour Nila spent on stages 1, 2 and 3 made stage 5 shorter.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Every hour she skipped there would have shown up in stage 7, where it hurts.</text>
