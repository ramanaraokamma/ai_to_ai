<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The squashed table and four questions</title>
  <desc>On the left, a three row table where one row is one pocket, giving the number of objects and total grams for the main, front and side pockets. On the right, four question cards each with an empty tick box, asking which questions this table can still answer.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One row = one pocket. Which questions can it still answer?</text>

  <rect x="24" y="56" width="332" height="212" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="190" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#845F00" text-anchor="middle">ONE ROW = ONE POCKET</text>

  <rect x="44" y="96" width="292" height="142" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44 104 A8 8 0 0 1 52 96 H328 A8 8 0 0 1 336 104 V132 H44 Z" fill="#D9EAF9" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="44" y1="167" x2="336" y2="167"/>
    <line x1="44" y1="202" x2="336" y2="202"/>
    <line x1="130" y1="96" x2="130" y2="238"/>
    <line x1="238" y1="96" x2="238" y2="238"/>
  </g>
  <line x1="44" y1="132" x2="336" y2="132" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="44" y="96" width="292" height="142" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
    <text x="87" y="118">pocket</text><text x="184" y="118">objects</text><text x="287" y="118">total_grams</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="87" y="155">main</text><text x="184" y="155">3</text><text x="287" y="155">1230</text>
    <text x="87" y="190">front</text><text x="184" y="190">3</text><text x="287" y="190">63</text>
    <text x="87" y="225">side</text><text x="184" y="225">2</text><text x="287" y="225">760</text>
  </g>

  <!-- four question cards -->
  <g fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round">
    <rect x="384" y="60" width="392" height="52" rx="10"/>
    <rect x="384" y="122" width="392" height="52" rx="10"/>
    <rect x="384" y="184" width="392" height="52" rx="10"/>
    <rect x="384" y="246" width="392" height="52" rx="10"/>
  </g>
  <g fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round">
    <rect x="400" y="74" width="26" height="26" rx="6"/>
    <rect x="400" y="136" width="26" height="26" rx="6"/>
    <rect x="400" y="198" width="26" height="26" rx="6"/>
    <rect x="400" y="260" width="26" height="26" rx="6"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">
    <text x="413" y="92">1</text><text x="413" y="154">2</text><text x="413" y="216">3</text><text x="413" y="278">4</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="442" y="92">Which pocket is the heaviest?</text>
    <text x="442" y="154">What is the heaviest single object?</text>
    <text x="442" y="216">How many objects are in the bag?</text>
    <text x="442" y="278">How long is the pencil?</text>
  </g>

  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Tick the ones this table can answer. Cross the ones it cannot.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Then say what row unit you would have needed instead — and whether you could rebuild this table from it.</text>
</svg>
