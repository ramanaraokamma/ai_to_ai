<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Even a slope of 0.9526 leaves only 14 percent of the gradient after forty steps, and the measurement matches the arithmetic</title>
  <desc>Seven pairs of bars for positions 41, 40, 39, 31, 21, 11 and 1 of a 41-note chain whose every slope is 0.9526. Solid bars are the measured gradient: 1.0000, 0.9529, 0.9080, 0.6173, 0.3809, 0.2348, 0.1447. Dashed outline bars are 0.9526 to the power of the steps back, 0 to 40: 1.0000, 0.9526, 0.9074, 0.6153, 0.3786, 0.2330, 0.1434. The pairs match closely and fall from 1 to about 0.14. The last pair is highlighted. Numbers from block 3, Week 10.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Parked cell: measured against theory</text>
