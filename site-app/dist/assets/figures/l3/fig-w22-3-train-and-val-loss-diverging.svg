<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Train and validation loss pulling apart</title>
  <desc>Two curves against epoch. The train curve falls steadily from 0.5529 to 0.0165. The validation curve falls to its lowest point of 0.1568 at epoch 39, marked with a ringed 1 and a dashed vertical line, then climbs back to 0.4347 by epoch 1499. The gap at the end is 0.4347 minus 0.0165 which is 0.4182.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Watching validation give up</text>
