<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Rate how sure you felt about each week, then set it beside the percentage from your grid</title>
  <desc>Blank worksheet. Eight rows, one for each of Weeks 19 to 26 with its topic. Each row has four empty circles labelled lost, shaky, fair and solid for the student to shade one, an empty dashed box for the percentage from the grid, and an empty ring for circling the week to redo. Nothing is filled in.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Confidence map: how sure did I feel?</text>
  <text x="440" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">lost</text>
