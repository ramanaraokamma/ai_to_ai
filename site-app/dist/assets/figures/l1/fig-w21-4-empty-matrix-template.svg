<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>An empty three by three confusion matrix, ready to fill</title>
  <desc>An empty grid with three rows and three columns. The rows are labelled true spoon, true toothbrush and true comb down the left side. The columns are labelled said spoon, said toothbrush and said comb across the top under a heading reading what the model said. A fourth column on the right is for row totals. Every cell is blank.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="250" y="36" font-size="24" fill="#14202B" text-anchor="middle">The empty grid, ready to fill</text>

    <text x="280" y="70" font-size="14" fill="#55636F" text-anchor="middle">WHAT THE MODEL SAID</text>
    <path d="M170 78 H390" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M170 78 V86 M390 78 V86" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>

    <text x="34" y="230" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 34 230)">THE TRUTH</text>

    <g fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5">
      <rect x="160" y="96" width="80" height="40"/>
      <rect x="240" y="96" width="80" height="40"/>
      <rect x="320" y="96" width="80" height="40"/>
      <rect x="400" y="96" width="80" height="40"/>
    </g>

    <g font-size="12" fill="#14202B" text-anchor="middle">
      <text x="200" y="112">said</text><text x="200" y="128">spoon</text>
      <text x="280" y="112">said</text><text x="280" y="128">toothbrush</text>
      <text x="360" y="112">said</text><text x="360" y="128">comb</text>
      <text x="440" y="112">row</text><text x="440" y="128">total</text>
    </g>

    <g fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5">
      <rect x="160" y="136" width="80" height="60"/><rect x="240" y="136" width="80" height="60"/><rect x="320" y="136" width="80" height="60"/>
      <rect x="160" y="196" width="80" height="60"/><rect x="240" y="196" width="80" height="60"/><rect x="320" y="196" width="80" height="60"/>
      <rect x="160" y="256" width="80" height="60"/><rect x="240" y="256" width="80" height="60"/><rect x="320" y="256" width="80" height="60"/>
    </g>
    <g fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5">
      <rect x="400" y="136" width="80" height="60"/>
      <rect x="400" y="196" width="80" height="60"/>
      <rect x="400" y="256" width="80" height="60"/>
      <rect x="160" y="316" width="80" height="46"/><rect x="240" y="316" width="80" height="46"/><rect x="320" y="316" width="80" height="46"/>
      <rect x="400" y="316" width="80" height="46"/>
    </g>

    <g font-size="14" fill="#14202B" text-anchor="end">
      <text x="152" y="171">true spoon</text>
      <text x="152" y="231">true toothbrush</text>
      <text x="152" y="291">true comb</text>
      <text x="152" y="344">said in total</text>
    </g>

    <rect x="160" y="96" width="320" height="266" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <line x1="160" y1="136" x2="480" y2="136" stroke="#14202B" stroke-width="3"/>
    <line x1="400" y1="96" x2="400" y2="362" stroke="#14202B" stroke-width="3"/>
    <line x1="160" y1="316" x2="480" y2="316" stroke="#14202B" stroke-width="3"/>

    <text x="250" y="404" font-size="18" fill="#14202B" text-anchor="middle">15 photos on the sheet = 15 tally marks in the grid.</text>
    <text x="250" y="440" font-size="14" fill="#55636F" text-anchor="middle">Rows are the truth. Columns are what the model said.</text>
    <text x="250" y="460" font-size="14" fill="#55636F" text-anchor="middle">One sheet row, one mark, then cross the row off. No skipping ahead.</text>
  </g>
</svg>
