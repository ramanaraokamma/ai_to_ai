<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Percentage versus percentage point</title>
  <desc>Two horizontal bars. The model scores seventy-three point three percent and blind guessing scores thirty-three point three percent. A bracket under the difference is labelled forty percentage points, not forty percent.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="34" font-size="24" fill="#14202B" text-anchor="middle">Subtract two percentages and you get POINTS</text>

    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="220" y1="96" x2="220" y2="264"/>
      <line x1="700" y1="96" x2="700" y2="264"/>
    </g>

    <rect x="220" y="110" width="352" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="220" y="200" width="160" height="52" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>

    <g font-size="18" fill="#14202B" text-anchor="end">
      <text x="208" y="142">My model</text>
      <text x="208" y="232">Blind guessing</text>
    </g>

    <g font-size="18" fill="#14202B" text-anchor="end">
      <text x="560" y="142">73.3%</text>
      <text x="368" y="232">33.3%</text>
    </g>

    <path d="M380 268 V284 H572 V268" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="476" y1="284" x2="476" y2="296" stroke="#C42B8C" stroke-width="2"/>

    <rect x="296" y="296" width="360" height="62" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="476" y="322" font-size="18" fill="#14202B" text-anchor="middle">73.3 - 33.3 = 40 PERCENTAGE POINTS</text>
    <text x="476" y="346" font-size="14" fill="#55636F" text-anchor="middle">"40 percent more" would mean 33.3 x 1.4 = 46.6% - a different claim</text>

    <text x="400" y="384" font-size="14" fill="#55636F" text-anchor="middle">Percent is a share of something. A percentage point is a gap between two percentages.</text>
  </g>
</svg>
