<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Wrong and right: same shape is not the same grid</title>
  <desc>Two panels, both starting from the same three by two grid holding 1 2 3 4 5 6. On the left, marked wrong, a claim that transpose and reshape are the same because both answers are shape two by three. On the right, marked right, the two answers are printed out: transpose reads down the columns and gives 1 3 5 over 2 4 6, while reshape reads along the rows and gives 1 2 3 over 4 5 6. Both are shape two by three, and three times two equals six equals two times three, so both hold the same six numbers in different places.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same shape is not the same grid</text>

  <rect x="30" y="66" width="350" height="300" rx="12" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="66" width="350" height="36" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="47" y1="75" x2="65" y2="93" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="47" y2="93" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="215" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">both are (2, 3), so they agree</text>

  <text x="60" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">the grid you started with, shape (3, 2)</text>
  <rect x="60" y="142" width="56" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="88" y="159" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">1  2</text>
  <rect x="60" y="176" width="56" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="88" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">3  4</text>
  <rect x="60" y="210" width="56" height="34" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="88" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">5  6</text>

  <text x="150" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B">flip it &#8594; (2, 3)</text>
  <text x="150" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B">re-bracket &#8594; (2, 3)</text>
  <text x="150" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#CC2B1D">so the same thing?</text>

  <text x="215" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">shape checked, contents never looked at</text>
  <text x="215" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the numbers moved and nobody noticed</text>
  <text x="215" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle">shape is not identity</text>

  <rect x="420" y="66" width="350" height="300" rx="12" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="420" y="66" width="350" height="36" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="437" y1="84" x2="444.2" y2="90.3" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round"/>
  <line x1="444.2" y1="90.3" x2="455" y2="76.8" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round"/>
  <text x="608" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">read both printouts out loud</text>

  <text x="450" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">transpose &#8594; (2, 3)</text>
  <rect x="450" y="142" width="130" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="515" y="159" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">1   3   5</text>
  <rect x="450" y="176" width="130" height="34" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="515" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">2   4   6</text>

  <text x="612" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">reshape &#8594; (2, 3)</text>
  <rect x="612" y="142" width="130" height="34" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="677" y="159" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">1   2   3</text>
  <rect x="612" y="176" width="130" height="34" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="677" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">4   5   6</text>

  <text x="595" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">reads 1 3 5, against reads 1 2 3</text>
  <text x="595" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">down the columns, against along the rows</text>
  <text x="595" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">six numbers in, six numbers out, both ways</text>
  <text x="595" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="middle">same shape, different contents</text>
</svg>
