<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw it here</title>
  <desc>An empty dashed frame with the words Your drawing in the top left corner, left blank for the student to draw in.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw it here</text>
  <rect x="40" y="70" width="720" height="270" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 8"/>
  <line x1="40" y1="70" x2="54" y2="70" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <line x1="746" y1="70" x2="760" y2="70" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="340" x2="54" y2="340" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <line x1="746" y1="340" x2="760" y2="340" stroke="#C7CDD4" stroke-width="2" stroke-linecap="round"/>
  <text x="60" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">Your drawing</text>
  <text x="400" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Label at least three things in your drawing.</text>
</svg>
