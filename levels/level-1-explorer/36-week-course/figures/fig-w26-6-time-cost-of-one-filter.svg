<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Why nobody does this by hand</title>
  <desc>Four rows. Six cells by hand takes 20 minutes; one hundred cells takes 5.5 hours; the 49,284 cells of one real photo would take 114 days without sleep; the same hundred cells in a spreadsheet takes one drag.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Why nobody does this by hand</text>
  <rect x="40" y="80" width="380" height="46" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="230" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">6 cells, by hand</text>
  <line x1="424" y1="103" x2="446" y2="103" stroke="#14202B" stroke-width="2" stroke-linecap="round"/><polyline points="436,96 446,103 436,110" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="80" width="310" height="46" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="605" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">20 minutes</text>
  <rect x="40" y="140" width="380" height="46" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="230" y="163" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">100 cells, by hand</text>
  <line x1="424" y1="163" x2="446" y2="163" stroke="#14202B" stroke-width="2" stroke-linecap="round"/><polyline points="436,156 446,163 436,170" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="140" width="310" height="46" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="605" y="163" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">5.5 hours</text>
  <rect x="40" y="200" width="380" height="46" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="230" y="223" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">49,284 cells (one real photo)</text>
  <line x1="424" y1="223" x2="446" y2="223" stroke="#14202B" stroke-width="2" stroke-linecap="round"/><polyline points="436,216 446,223 436,230" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="200" width="310" height="46" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="605" y="223" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">114 days, no sleep</text>
  <rect x="40" y="268" width="380" height="46" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="230" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">100 cells, in a spreadsheet</text>
  <line x1="424" y1="291" x2="446" y2="291" stroke="#14202B" stroke-width="2" stroke-linecap="round"/><polyline points="436,284 446,291 436,298" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="268" width="310" height="46" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="605" y="291" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">one drag</text>
  <line x1="40" y1="252" x2="760" y2="252" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <text x="400" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The arithmetic is identical. Only the boredom changes.</text>
</svg>
