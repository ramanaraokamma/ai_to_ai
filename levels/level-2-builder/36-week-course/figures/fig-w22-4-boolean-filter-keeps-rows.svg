<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img">
  <title>A filter asks every row the same question</title>
  <desc>A five-row table of step counts. Beside it a column of answers, each a green tick reading True or a red cross reading False, produced by the question steps more than 9000. An arrow leads to a smaller table holding only the three True rows, which have kept their original row labels 1, 3 and 4. A box states five rows in, three rows out.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A filter asks every row the same question</text>
