  <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(505,175) scale(0.5)">
  <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="96" y="126" width="88" height="118" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="110" y="150" width="52" height="6" rx="3" fill="#55636F"/>
  <rect x="110" y="168" width="52" height="6" rx="3" fill="#55636F"/>
  <rect x="110" y="186" width="52" height="6" rx="3" fill="#55636F"/>
  <rect x="110" y="204" width="52" height="6" rx="3" fill="#55636F"/>
  <rect x="110" y="222" width="30" height="6" rx="3" fill="#55636F"/>
