<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A question you could be wrong about</title>
  <desc>Two panels. The left is ticked and holds a card asking whether the mode of travel changes journey time more than distance does, with a named target column and a signature. The right is crossed and holds a card saying something about getting to school, with no target column and nothing that could turn out wrong.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A question you could be wrong about</text>
<rect x="30" y="76" width="360" height="244" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
<rect x="410" y="76" width="360" height="244" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
<circle cx="62" cy="108" r="17" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="54.0,109.0 59.5,115.0 71.0,102.0" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="442" cy="108" r="17" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
  <line x1="436.0" y1="102.0" x2="448.0" y2="114.0"/>
  <line x1="448.0" y1="102.0" x2="436.0" y2="114.0"/>
</g>
<text x="90" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">A question</text>
<text x="470" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">A topic</text>
<rect x="54" y="132" width="312" height="96" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="210" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Does how I travel change</text>
<text x="210" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">my journey time more than</text>
<text x="210" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">how far I go?</text>
<rect x="434" y="132" width="312" height="96" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
<text x="590" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Something about how</text>
<text x="590" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">I get to school,</text>
<text x="590" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">I suppose.</text>
<text x="210" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">I could be wrong about this.</text>
<text x="210" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">target column: minutes (a number)</text>
<text x="210" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">signed and dated before collecting</text>
<text x="590" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Nothing could prove this wrong.</text>
<text x="590" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no target column, no prediction</text>
<text x="590" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">so the data can say anything at all</text>
<text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">If no result could ever prove you wrong, you have a topic, not a question.</text>
</svg>
