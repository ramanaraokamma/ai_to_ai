<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Draw the squasher</title>
  <desc>A large empty frame with a horizontal axis marked from minus 6 to plus 6 for the raw score and a vertical axis marked 0 to 1 for the probability, with a dashed grey halfway line drawn across at 0.5, for the learner to plot the sigmoid curve into. A panel underneath lists what a good answer contains: the four hand-computed points at minus 2 comma 0.1192, 0 comma 0.5000, 1.4 comma 0.8022 and 3 comma 0.9526, a smooth S joining them, the crossing marked exactly at z equals 0, arrows showing the curve flattening towards but never touching 0 and 1, the steep middle labelled, and the words raw score and chance on the two axes.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the squasher</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Any number in along the bottom, a chance 0 to 1 up the side</text>

  <rect x="30" y="86" width="440" height="360" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="76" y1="406" x2="440" y2="406" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="406" x2="76" y2="116" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="261" x2="440" y2="261" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <text x="448" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">p = 0.5</text>
  <text x="68" y="410" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="68" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <text x="68" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <text x="76" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;6</text>
  <text x="167" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">&#8722;3</text>
  <text x="258" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="349" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <text x="440" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <text x="258" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">raw score z &#183; label this axis yourself</text>

  <rect x="30" y="460" width="440" height="216" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What a good answer looks like</text>
  <text x="48" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; four fat dots, from your own calculator, not from a screen</text>
  <text x="48" y="532" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; (&#8722;2, 0.1192) &#183; (0, 0.5000) &#183; (1.4, 0.8022) &#183; (3, 0.9526)</text>
  <text x="48" y="554" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; one smooth S, steep in the middle, flat at both ends</text>
  <text x="48" y="576" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the crossing ringed and labelled &#8220;exactly 0.5 at z = 0&#8221;</text>
  <text x="48" y="598" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; an arrow at each end saying &#8220;gets closer, never arrives&#8221;</text>
  <text x="48" y="620" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; the gap 0 &#8594; 1 in z marked as 0.231 in p, and 6 &#8594; 7 as 0.0016</text>
  <text x="48" y="642" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">&#183; both axes named in words: raw score, and chance</text>
  <text x="48" y="664" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#183; and nowhere on the page a point above 1 or below 0</text>
</svg>
