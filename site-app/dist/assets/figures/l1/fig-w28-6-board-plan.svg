<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>What the board looks like at the end of Week 28</title>
  <desc>Three zones left to right. Zone one is the numbered token list. Zone two is the tally sheet with current, next and tally columns. Zone three holds the two arithmetic checks: forty tokens minus one equals thirty-nine pairs, and each word's out-of number equals how often that word appears.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What the board looks like at the end of Week 28</text>

  <rect x="30" y="66" width="230" height="264" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="285" y="66" width="230" height="264" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="540" y="66" width="230" height="264" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <text x="46" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2">1 &#183; THE TOKENS</text>
  <text x="301" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#845F00">2 &#183; THE TALLY</text>
  <text x="556" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B">3 &#183; THE CHECKS</text>
  <line x1="46" y1="104" x2="244" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="301" y1="104" x2="499" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="556" y1="104" x2="754" y2="104" stroke="#C7CDD4" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="46" y="130">1 i</text><text x="150" y="130">2 take</text>
    <text x="46" y="152">3 the</text><text x="150" y="152">4 bus</text>
    <text x="46" y="174">5 to</text><text x="150" y="174">6 the</text>
    <text x="46" y="196">7 market</text><text x="150" y="196">8 .</text>
    <text x="46" y="218">9 amma</text><text x="150" y="218">10 takes</text>
    <text x="46" y="240">11 the</text><text x="150" y="240">12 bus</text>
    <text x="46" y="262">13 to</text><text x="150" y="262">14 the</text>
  </g>
  <text x="46" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">... on to 40 .</text>
  <text x="46" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Number every token first.</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="301" y="126">CURRENT</text>
    <text x="381" y="126">NEXT</text>
    <text x="452" y="126">TALLY</text>
  </g>
  <line x1="301" y1="134" x2="499" y2="134" stroke="#845F00" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="301" y="158">the</text><text x="381" y="158">bus</text>
    <text x="301" y="186">the</text><text x="381" y="186">market</text>
    <text x="301" y="214">the</text><text x="381" y="214">shop</text>
    <text x="301" y="242">bus</text><text x="381" y="242">to</text>
    <text x="301" y="270">to</text><text x="381" y="270">the</text>
  </g>
  <g stroke="#845F00" stroke-width="2" stroke-linecap="round">
    <line x1="454" y1="148" x2="454" y2="162"/>
    <line x1="462" y1="148" x2="462" y2="162"/>
    <line x1="470" y1="148" x2="470" y2="162"/>
    <line x1="478" y1="148" x2="478" y2="162"/>
    <line x1="454" y1="176" x2="454" y2="190"/>
    <line x1="454" y1="204" x2="454" y2="218"/>
    <line x1="454" y1="232" x2="454" y2="246"/>
    <line x1="462" y1="232" x2="462" y2="246"/>
    <line x1="454" y1="260" x2="454" y2="274"/>
    <line x1="462" y1="260" x2="462" y2="274"/>
    <line x1="470" y1="260" x2="470" y2="274"/>
  </g>
  <text x="301" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">One pair, one mark.</text>
  <text x="301" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Never batch, never skip.</text>

  <rect x="556" y="118" width="198" height="80" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="655" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">CHECK 1 - the total</text>
  <text x="655" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">40 - 1 = 39 pairs</text>
  <text x="655" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">All marks must add to 39.</text>

  <rect x="556" y="212" width="198" height="100" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="655" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">CHECK 2 - row by row</text>
  <text x="655" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">a word's OUT OF must</text>
  <text x="655" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">equal how many times</text>
  <text x="655" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">that word appears.</text>

  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Leave all three zones up. Zone 3 is the part students skip, and it is the part that catches the mistake.</text>
</svg>
