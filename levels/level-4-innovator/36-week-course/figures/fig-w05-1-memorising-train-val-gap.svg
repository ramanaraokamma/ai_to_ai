<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Training loss can reach zero while validation loss gets worse: that is memorising</title>
  <desc>Loss against epoch for seed 0 with 120 training points and no cure. Training loss falls from 0.691 to 0.000 by epoch 175 and stays there. Validation loss falls from 0.688 to a best of 0.179 at epoch 59 (ringed 1), then climbs through 0.320 at epoch 100 and 0.694 at epoch 150 to 0.906 at epoch 249. A bracket marks the final gap, 0.906 minus 0.000.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Train loss hits 0.000 as validation loss climbs</text>
