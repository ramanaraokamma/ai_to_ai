<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>continue does not cancel a pass</title>
  <desc>Two mirrored panels about five passes of a loop. On the left, marked wrong, pass three is crossed out entirely and the tally reads four passes happened. On the right, marked correct, all five passes are present, pass three is highlighted and cut short by an arrow curling back to the top, and the tally reads five passes happened, one of them cut short. A band underneath says continue ends the pass, break ends the loop.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">continue does not cancel a pass</text>

  <rect x="20" y="60" width="372" height="272" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g transform="translate(36,70) scale(0.34)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="76" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">what people imagine</text>

  <g stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round">
    <rect x="52" y="112" width="150" height="28" rx="6" fill="#FFFFFF"/>
    <rect x="52" y="146" width="150" height="28" rx="6" fill="#FFFFFF"/>
    <rect x="52" y="214" width="150" height="28" rx="6" fill="#FFFFFF"/>
    <rect x="52" y="248" width="150" height="28" rx="6" fill="#FFFFFF"/>
  </g>
  <text x="127" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 1</text>
  <text x="127" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 2</text>
  <rect x="52" y="180" width="150" height="28" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="127" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 3</text>
  <line x1="56" y1="184" x2="198" y2="204" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
  <text x="127" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 4</text>
  <text x="127" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 5</text>
  <text x="290" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">&#8220;pass 3 never</text>
  <text x="290" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">happens at all&#8221;</text>
  <rect x="240" y="248" width="100" height="30" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="290" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4 passes</text>
  <text x="206" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle">Wrong. The counter still moved.</text>

  <rect x="408" y="60" width="372" height="272" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g transform="translate(424,70) scale(0.34)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="464" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">what really happens</text>

  <g stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round">
    <rect x="440" y="112" width="150" height="28" rx="6" fill="#FFFFFF"/>
    <rect x="440" y="146" width="150" height="28" rx="6" fill="#FFFFFF"/>
    <rect x="440" y="214" width="150" height="28" rx="6" fill="#FFFFFF"/>
    <rect x="440" y="248" width="150" height="28" rx="6" fill="#FFFFFF"/>
  </g>
  <text x="515" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 1</text>
  <text x="515" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 2</text>
  <rect x="440" y="180" width="150" height="28" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="515" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 3 &#8212; cut short</text>
  <text x="515" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 4</text>
  <text x="515" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pass 5</text>
  <path d="M596 194 H626 A12 12 0 0 1 638 206 V214 A12 12 0 0 1 626 226 H596" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="11,-7 0,0 11,7" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(594 226)"/>
  <text x="700" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">straight back to</text>
  <text x="700" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the next pass</text>
  <rect x="640" y="248" width="120" height="30" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="700" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5 passes</text>
  <text x="594" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle">Five passes. One of them printed nothing.</text>

  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">break ends the loop. continue ends the pass.</text>
</svg>
