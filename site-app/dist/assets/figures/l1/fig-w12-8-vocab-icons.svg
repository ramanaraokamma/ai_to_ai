<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 400" role="img">
  <title>Week 12 words as pictures</title>
  <desc>Five icon cards. The baseline is a ruler line at 33 percent. A useful feature is a bar above that line. A useless feature is a bar sitting exactly on it. A leaky feature is a card hiding the answer behind its back. The leak itself is a clock showing that the value only exists after the answer is already known.</desc>
  <text x="496" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
  <rect x="24" y="64" width="182" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="216" y="64" width="182" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="408" y="64" width="182" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="600" y="64" width="176" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="786" y="64" width="182" height="252" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- baseline -->
  <line x1="48" y1="196" x2="182" y2="196" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="196" x2="182" y2="196" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"/>
  <text x="115" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">33.3%</text>
  <text x="115" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4 of 12 by</text>
  <text x="115" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">always guessing</text>
  <text x="115" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">baseline</text>
  <text x="115" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the ruler you</text>
  <text x="115" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">build first</text>

  <!-- useful -->
  <line x1="240" y1="196" x2="374" y2="196" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="284" y="106" width="46" height="90" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="307" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">91.7%</text>
  <g transform="translate(291,146) scale(0.46)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="307" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">useful</text>
  <text x="307" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">clearly above</text>
  <text x="307" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the line</text>

  <!-- useless -->
  <line x1="432" y1="196" x2="566" y2="196" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="476" y="190" width="46" height="6" rx="2" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="499" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">33.3%</text>
  <text x="499" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">exactly on it,</text>
  <text x="499" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">not near it</text>
  <text x="499" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">useless</text>
  <text x="499" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">told you</text>
  <text x="499" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">nothing</text>

  <!-- leaky -->
  <g transform="translate(636,96)">
    <rect x="0" y="0" width="104" height="96" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="34" r="4" fill="#14202B"/>
    <circle cx="66" cy="34" r="4" fill="#14202B"/>
    <path d="M36 62 Q53 54 70 62" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <rect x="24" y="78" width="56" height="26" rx="6" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
    <text x="52" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">ANSWER</text>
  </g>
  <text x="688" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">leaky</text>
  <text x="688" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">100%, because</text>
  <text x="688" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">it IS the answer</text>

  <!-- leak : the timing problem -->
  <g transform="translate(812,96)">
    <line x1="4" y1="60" x2="126" y2="60" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="50" x2="65" y2="70" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/>
    <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">you must</text>
    <text x="30" y="30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">guess here</text>
    <text x="100" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">answer</text>
    <text x="100" y="30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">known here</text>
    <rect x="72" y="76" width="60" height="26" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="102" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the value</text>
    <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="72" y1="89" x2="34" y2="89"/>
      <polyline points="42,82 33,89 42,96"/>
    </g>
    <text x="65" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">it travels backwards in time</text>
  </g>
  <text x="877" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">leak</text>
  <text x="877" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the value would not</text>
  <text x="877" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">exist yet</text>

  <text x="496" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every feature you score lands in one of the first three places. The fifth card says why the fourth is fatal.</text>
</svg>
