<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The table decides, not you</title>
  <desc>Six rows. A, the raw columns only, uses 20 columns and scores accuracy 0.7600 and AUC 0.7752. B adds is_rush for 21 columns, 0.7725 and 0.7825, a gain of 0.0074, so keep. C adds hour_band for 24 columns, 0.7675 and 0.7815, a gain of only 0.0063, so drop. D adds min_per_km for 22 columns, 0.7675 and 0.7843, a gain of 0.0091, the best on the page, so keep. E adds dist_x_weather for 23 columns and falls to 0.7829. F adds is_weekend for 24 columns and falls again to 0.7828. Read against the row above, E minus D is 0.7829 minus 0.7843, that is minus 0.0014; F minus E is minus 0.0001; and D minus B is plus 0.0018. The verdict is to ship D.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The table decides, not you</text>
  <text x="30" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">variant</text>
  <text x="200" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">cols</text>
  <text x="258" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">acc</text>
  <text x="320" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">AUC</text>
  <text x="392" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">&#8212;AUC vs A</text>
  <line x1="24" y1="86" x2="476" y2="86" stroke="#14202B" stroke-width="2"/>
  <rect x="24" y="100" width="452" height="54" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="36" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">A</text>
  <text x="56" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">raw columns only</text>
  <text x="200" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">20</text>
  <text x="258" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.7600</text>
  <text x="320" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">0.7752</text>
  <text x="392" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.0000</text>
  <text x="56" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the line to beat</text>
  <rect x="24" y="160" width="452" height="54" rx="8" fill="#E2F7ED" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="36" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">B</text>
  <text x="56" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">A + is_rush</text>
  <text x="200" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">21</text>
  <text x="258" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.7725</text>
  <text x="320" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">0.7825</text>
  <text x="392" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">+0.0074</text>
  <text x="56" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">KEEP &#8212; +0.0074 for one column</text>
  <rect x="24" y="220" width="452" height="54" rx="8" fill="#F6AEA6" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="36" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">C</text>
  <text x="56" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">A + hour_band</text>
  <text x="200" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">24</text>
  <text x="258" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.7675</text>
  <text x="320" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">0.7815</text>
  <text x="392" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">+0.0063</text>
  <text x="56" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">DROP &#8212; 3 columns, less than B</text>
  <rect x="24" y="280" width="452" height="54" rx="8" fill="#E2F7ED" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="36" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">D</text>
  <text x="56" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">B + min_per_km</text>
  <text x="200" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">22</text>
  <text x="258" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.7675</text>
  <text x="320" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">0.7843</text>
  <text x="392" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">+0.0091</text>
  <text x="56" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">KEEP &#8212; best AUC on the page</text>
  <rect x="24" y="340" width="452" height="54" rx="8" fill="#F6AEA6" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="36" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">E</text>
  <text x="56" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">D + dist_x_weather</text>
  <text x="200" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">23</text>
  <text x="258" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.7725</text>
  <text x="320" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">0.7829</text>
  <text x="392" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">+0.0077</text>
  <text x="56" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">DELETE &#8212; it went DOWN</text>
  <rect x="24" y="400" width="452" height="54" rx="8" fill="#F6AEA6" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="36" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">F</text>
  <text x="56" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">E + is_weekend</text>
  <text x="200" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">24</text>
  <text x="258" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">0.7725</text>
  <text x="320" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600">0.7828</text>
  <text x="392" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">+0.0076</text>
  <text x="56" y="444" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">DELETE &#8212; bought nothing</text>
  <line x1="24" y1="466" x2="476" y2="466" stroke="#14202B" stroke-width="2"/>
  <rect x="24" y="476" width="452" height="110" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="38" y="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">read the deltas against the row above, not just against A:</text>
  <text x="38" y="524" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">E &#8722; D  =  0.7829 &#8722; 0.7843  =  &#8722;0.0014</text>
  <text x="38" y="546" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">F &#8722; E  =  0.7828 &#8722; 0.7829  =  &#8722;0.0001</text>
  <text x="38" y="570" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">D &#8722; B  =  0.7843 &#8722; 0.7825  =  +0.0018</text>
  <rect x="24" y="596" width="452" height="54" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(34,604) scale(0.34)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="76" y="622" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Ship D: two kept, two deleted, in writing.</text>
  <text x="250" y="674" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Four inventions, two survivors. The deletions matter.</text>
</svg>
