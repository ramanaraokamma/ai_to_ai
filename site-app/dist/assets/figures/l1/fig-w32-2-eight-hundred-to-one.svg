<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Eight hundred people narrowed down to one</title>
  <desc>A column of counts running downward: 800, then 120, 28, 9, 2 and finally 1. Beside each step is the single anonymous fact that caused the cut, ending with allergic to peanuts.</desc>
  <text x="250" y="38" font-size="24" fill="#14202B" text-anchor="middle">No name. Five facts. One person.</text>

  <g stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="115" y1="134" x2="115" y2="164"/>
    <polyline points="108,158 115,170 122,158"/>
    <line x1="115" y1="234" x2="115" y2="264"/>
    <polyline points="108,258 115,270 122,258"/>
    <line x1="115" y1="334" x2="115" y2="364"/>
    <polyline points="108,358 115,370 122,358"/>
    <line x1="115" y1="434" x2="115" y2="464"/>
    <polyline points="108,458 115,470 122,458"/>
    <line x1="115" y1="534" x2="115" y2="564"/>
    <polyline points="108,558 115,570 122,558"/>
  </g>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="128" y1="152" x2="206" y2="152"/>
    <line x1="128" y1="252" x2="206" y2="252"/>
    <line x1="128" y1="352" x2="206" y2="352"/>
    <line x1="128" y1="452" x2="206" y2="452"/>
    <line x1="128" y1="552" x2="206" y2="552"/>
  </g>

  <g fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round">
    <rect x="40" y="80" width="150" height="54" rx="10"/>
    <rect x="40" y="180" width="150" height="54" rx="10"/>
    <rect x="40" y="280" width="150" height="54" rx="10"/>
    <rect x="40" y="380" width="150" height="54" rx="10"/>
    <rect x="40" y="480" width="150" height="54" rx="10"/>
  </g>
  <rect x="40" y="580" width="150" height="54" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

  <g font-size="24" fill="#14202B" text-anchor="middle">
    <text x="115" y="115">800</text>
    <text x="115" y="215">120</text>
    <text x="115" y="315">28</text>
    <text x="115" y="415">9</text>
    <text x="115" y="515">2</text>
    <text x="115" y="615">1</text>
  </g>

  <g font-size="18" fill="#14202B">
    <text x="212" y="146">Year 7</text>
    <text x="212" y="246">Postcode area 3</text>
    <text x="212" y="346">Plays cricket</text>
    <text x="212" y="446">Left-handed</text>
    <text x="212" y="546">Allergic to peanuts</text>
  </g>
  <g font-size="14" fill="#55636F">
    <text x="212" y="168">removes 680 people</text>
    <text x="212" y="268">removes 92</text>
    <text x="212" y="368">removes 19</text>
    <text x="212" y="468">removes 7</text>
    <text x="212" y="568">removes 1</text>
  </g>

  <text x="212" y="612" font-size="18" fill="#14202B">That is one person.</text>
  <text x="212" y="634" font-size="14" fill="#55636F">You know their name.</text>

  <text x="250" y="672" font-size="14" fill="#55636F" text-anchor="middle">The boring facts did the most work. Nobody thought Year 7 was private.</text>
</svg>
