<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>11 hours of project. The model was 40 minutes of it.</title>
  <desc>Seven numbered stages left to right with the hours each took: question 1 hour, collect 3 hours, clean 2 hours, look 1.5 hours, model 40 minutes, test it 1.5 hours, write up 1.5 hours. A bracket under the model stage is labelled the bit everybody thinks is the project. Brackets either side cover 10 hours 20 minutes of everything else.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">11 hours of project. The model was 40 minutes of it.</text>
