<text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One split, made once. Every model learns from the same 100 rows and is judged on the same 26.</text>
