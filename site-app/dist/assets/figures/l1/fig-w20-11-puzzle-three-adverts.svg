<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The three adverts puzzle</title>
  <desc>Three advert posters each claiming an accuracy. Poster one says ninety nine percent on one hundred tries. Poster two says seventy five percent with no total given. Poster three says one hundred percent on four tries. Underneath, a note gives the class sizes.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">The three adverts puzzle</text>
    <text x="400" y="60" font-size="14" fill="#55636F" text-anchor="middle">Three companies sell a bird-spotting app. Put them in order, best evidence first.</text>

    <rect x="30" y="80" width="230" height="180" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="30" y="80" width="230" height="40" rx="12" fill="#D9EAF9" stroke="none"/>
    <line x1="30" y1="120" x2="260" y2="120" stroke="#1F6FB2" stroke-width="3"/>
    <text x="145" y="107" font-size="18" fill="#14202B" text-anchor="middle">APP A</text>
    <text x="145" y="164" font-size="24" fill="#14202B" text-anchor="middle">99%</text>
    <text x="145" y="196" font-size="14" fill="#55636F" text-anchor="middle">"99 right out of 100</text>
    <text x="145" y="216" font-size="14" fill="#55636F" text-anchor="middle">bird photos"</text>
    <text x="145" y="244" font-size="12" fill="#55636F" text-anchor="middle">98 of the 100 were pigeons</text>

    <rect x="285" y="80" width="230" height="180" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="285" y="80" width="230" height="40" rx="12" fill="#D9EAF9" stroke="none"/>
    <line x1="285" y1="120" x2="515" y2="120" stroke="#1F6FB2" stroke-width="3"/>
    <text x="400" y="107" font-size="18" fill="#14202B" text-anchor="middle">APP B</text>
    <text x="400" y="164" font-size="24" fill="#14202B" text-anchor="middle">75%</text>
    <text x="400" y="196" font-size="14" fill="#55636F" text-anchor="middle">"75% accurate!"</text>
    <text x="400" y="216" font-size="14" fill="#55636F" text-anchor="middle">(no total given)</text>
    <text x="400" y="244" font-size="12" fill="#55636F" text-anchor="middle">10 kinds of bird, roughly equal</text>

    <rect x="540" y="80" width="230" height="180" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="540" y="80" width="230" height="40" rx="12" fill="#D9EAF9" stroke="none"/>
    <line x1="540" y1="120" x2="770" y2="120" stroke="#1F6FB2" stroke-width="3"/>
    <text x="655" y="107" font-size="18" fill="#14202B" text-anchor="middle">APP C</text>
    <text x="655" y="164" font-size="24" fill="#14202B" text-anchor="middle">100%</text>
    <text x="655" y="196" font-size="14" fill="#55636F" text-anchor="middle">"4 right out of 4</text>
    <text x="655" y="216" font-size="14" fill="#55636F" text-anchor="middle">bird photos"</text>
    <text x="655" y="244" font-size="12" fill="#55636F" text-anchor="middle">10 kinds of bird, roughly equal</text>

    <rect x="30" y="284" width="740" height="88" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="400" y="310" font-size="14" fill="#55636F" text-anchor="middle">THREE QUESTIONS TO ASK EACH POSTER</text>
    <text x="400" y="336" font-size="18" fill="#14202B" text-anchor="middle">Out of how many?   ·   Compared to what?   ·   Which class does it fail on?</text>
    <text x="400" y="360" font-size="12" fill="#55636F" text-anchor="middle">Every poster above dodges at least one of them.</text>
  </g>
</svg>
