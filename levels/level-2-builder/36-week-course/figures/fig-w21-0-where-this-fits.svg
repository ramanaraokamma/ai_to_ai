    <text x="704" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#55636F">wk 28–31</text>
    <rect x="634" y="244" width="140" height="48" rx="10" fill="none" stroke="#C7CDD4" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="704" y="266" text-anchor="middle" font-size="12" fill="#55636F">bake-off · capstone</text>
    <text x="704" y="283" text-anchor="middle" font-size="12" font-weight="700" fill="#55636F">wk 32–36</text>
  </g>

  <!-- ── flow arrows between stages ───────────────────────────────── -->
  <g stroke="#55636F" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M168 108 L174 108"/><path d="M169 103 l6 5 -6 5"/>
    <path d="M320 108 L326 108"/><path d="M321 103 l6 5 -6 5"/>
    <path d="M472 108 L478 108"/><path d="M473 103 l6 5 -6 5"/>
    <path d="M624 108 L630 108"/><path d="M625 103 l6 5 -6 5"/>
  </g>
  <text x="400" y="312" text-anchor="middle" font-size="12" fill="#55636F">
    each stage feeds the next — you cannot clean data you cannot hold</text>

