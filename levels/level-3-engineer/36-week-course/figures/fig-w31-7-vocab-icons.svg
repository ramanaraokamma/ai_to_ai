<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week&#8217;s words, drawn</title>
  <desc>Six small pictures. Token and tokenization: the sentence the pizza was cold is chopped into four blue blocks reading the, pizza, was, cold, labelled 4 tokens. Normalization: GREAT with two exclamation marks, Great and great all arrow down into one gold block reading great, three spellings becoming one token, described as a decision and not a tidy-up. Stopword: the list the, was, and, not is struck through, and the two reviews the pizza was not cold and the pizza was cold both reduce to the same red row reading pizza cold. Bag-of-words: the review Great pizza, great service becomes great 2, pizza 1, service 1 with order gone. Document-term matrix: the four by eight grid of counts, rows d1 0 0 0 1 1 0 1 1, d2 0 1 0 0 1 0 1 1, d3 0 0 0 2 1 1 0 0 and d4 1 2 1 0 0 1 0 0, labelled 4 rows times 8 words equals 32 cells. Sparse matrix: of 32 cells 15 are stored, shown as the coordinate lines 0 comma 6 holds 1, 0 comma 4 holds 1, 0 comma 7 holds 1 and 0 comma 3 holds 1, with a pink box saying the 17 zeros are not stored.</desc>
