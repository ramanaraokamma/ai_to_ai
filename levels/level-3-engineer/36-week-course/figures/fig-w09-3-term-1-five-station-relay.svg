  <line x1="650" y1="210" x2="758" y2="210" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="704" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">hand over:</text>
  <text x="704" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">one saved artifact</text>
  <rect x="30" y="286" width="740" height="44" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">one .joblib file on disk, and a val AUC you can say out loud</text>
  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Nothing new here. Every station is a week you have already done, from memory, with the clock running.</text>
</svg>
