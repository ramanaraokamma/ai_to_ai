<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two honest answers. You must say which one you gave.</title>
  <desc>Two panels answer the same question about pupils aged 13. The green panel on the left fills the three unknown ages with 13, so seven pupils count as thirteen and their average score is 70.0; three of the seven rows are marked with a star to show the age was a guess. The blue panel on the right drops those three rows instead, so only four pupils count as thirteen and their average score is 75.0. A closing note says neither answer is wrong, but an answer with no cleaning log beside it is.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two honest answers. You must say which one you gave.</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three ages said "unknown". Everything below follows from what you did about it.</text>
