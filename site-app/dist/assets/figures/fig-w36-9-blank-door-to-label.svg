    <rect x="30" y="296" width="260" height="42" rx="8"/>
    <rect x="510" y="88" width="260" height="42" rx="8"/>
    <rect x="510" y="140" width="260" height="42" rx="8"/>
    <rect x="510" y="192" width="260" height="42" rx="8"/>
    <rect x="510" y="244" width="260" height="42" rx="8"/>
    <rect x="510" y="296" width="260" height="42" rx="8"/>
  </g>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="292" y1="109" x2="346" y2="109"/>
