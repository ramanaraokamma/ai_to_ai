<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same apple, with and without the sticker</title>
  <desc>Two panels. On the left, marked correct, an apple in your table wears a sticker reading APPLE and the feature scores 100 percent. On the right, marked wrong, the same apple in a shop has no sticker, so at the moment you need the prediction the feature is blank and the model has nothing to read.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The same apple, with and without the sticker</text>

  <line x1="400" y1="76" x2="400" y2="330" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="40" y="80" width="330" height="240" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <rect x="430" y="80" width="330" height="240" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>

  <g transform="translate(56,92) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(446,92) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="112" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">In your table</text>
  <text x="502" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">In the real shop</text>

  <line x1="205" y1="152" x2="205" y2="138" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="205" cy="196" r="44" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <circle cx="205" cy="196" r="22" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
  <text x="205" y="197" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">APPLE</text>

  <line x1="595" y1="152" x2="595" y2="138" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="595" cy="196" r="44" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <circle cx="595" cy="196" r="22" fill="none" stroke="#14202B" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="205" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the sticker already says the answer</text>
  <text x="595" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">nobody stuck a sticker on this one</text>
  <text x="205" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">score: 12 of 12 = 100%</text>
  <text x="595" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">score: nothing to read</text>

  <text x="400" y="354" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A feature that only exists in your table is not a feature. It is a leak.</text>
  <text x="400" y="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Cut it, however good the score looks.</text>
</svg>
