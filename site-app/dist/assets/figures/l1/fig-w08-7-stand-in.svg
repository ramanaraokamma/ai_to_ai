<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Every rule measures a stand-in</title>
  <desc>Four rows. On the left, what the rule can actually measure: height in centimetres, the word FREE, three absences, thirty characters. On the right, what somebody actually cares about: will the harness hold, is this a robbery, is this child in trouble, is this a stranger selling something. Arrows link each pair, with a note that stand-ins agree in the middle and disagree at the edges.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What the rule measures is never what you care about</text>

  <text x="180" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">The rule can measure</text>
  <text x="606" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What you actually want to know</text>

  <g stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="356" y1="112" x2="392" y2="112"/><polyline points="386,106 396,112 386,118" fill="none"/>
    <line x1="356" y1="166" x2="392" y2="166"/><polyline points="386,160 396,166 386,172" fill="none"/>
    <line x1="356" y1="220" x2="392" y2="220"/><polyline points="386,214 396,220 386,226" fill="none"/>
    <line x1="356" y1="274" x2="392" y2="274"/><polyline points="386,268 396,274 386,280" fill="none"/>
  </g>

  <g fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round">
    <rect x="40" y="90" width="312" height="44" rx="10"/>
    <rect x="40" y="144" width="312" height="44" rx="10"/>
    <rect x="40" y="198" width="312" height="44" rx="10"/>
    <rect x="40" y="252" width="312" height="44" rx="10"/>
  </g>
  <g fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round">
    <rect x="400" y="90" width="360" height="44" rx="10"/>
    <rect x="400" y="144" width="360" height="44" rx="10"/>
    <rect x="400" y="198" width="360" height="44" rx="10"/>
    <rect x="400" y="252" width="360" height="44" rx="10"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="56" y="118">height in centimetres</text>
    <text x="56" y="172">the word "FREE" is in it</text>
    <text x="56" y="226">3 or more absences</text>
    <text x="56" y="280">more than 30 characters</text>
    <text x="416" y="118">will the harness hold this person</text>
    <text x="416" y="172">is somebody trying to rob me</text>
    <text x="416" y="226">is this child in trouble at home</text>
    <text x="416" y="280">is this a stranger selling something</text>
  </g>

  <text x="400" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The left-hand thing is a STAND-IN for the right-hand thing.</text>
  <text x="400" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A stand-in agrees with the real thing in the middle, and disagrees at the edges.</text>
  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">That is why edge cases are guaranteed, not unlucky.</text>
</svg>
