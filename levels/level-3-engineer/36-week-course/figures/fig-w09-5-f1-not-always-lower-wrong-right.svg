<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>F1 is not always lower. It punishes lopsidedness.</title>
  <desc>Two panels. Left, marked wrong with a red cross: the belief that F1 is always smaller, guessing about 0.55 for the pair 0.6 and 0.6, with a red box showing the only pair that belief came from, 0.9 and 0.1, whose plain mean is 0.5000 and F1 is 0.1800. Right, marked right with a green tick: the balanced pair 0.6 and 0.6 computed both ways in three lines each. Plain, 0.6 plus 0.6 equals 1.200, divided by 2 equals 0.6000. Harmonic, 2 times 0.6 times 0.6 equals 0.720, divided by 1.200 equals 0.6000. Identical, so the gap on this pair is 0.0000 and F1 only marks you down when the two numbers disagree.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">F1 is not always lower. It punishes lopsidedness.</text>
  <rect x="24" y="62" width="372" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <line x1="38" y1="78" x2="58" y2="98" stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"/>
  <line x1="58" y1="78" x2="38" y2="98" stroke="#CC2B1D" stroke-width="5" stroke-linecap="round"/>
  <text x="70" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="start" font-weight="bold" dominant-baseline="central">WRONG</text>
  <text x="70" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">"F1 is a stricter score, so it is always smaller"</text>
  <rect x="44" y="132" width="332" height="76" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="start">p = 0.6    r = 0.6</text>
  <text x="60" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">plain 0.6000   "so F1 must be about 0.55"</text>
  <text x="60" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">guessed, not computed</text>
  <text x="60" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">The belief comes from seeing</text>
  <text x="60" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">only one pair: 0.9 and 0.1.</text>
  <rect x="44" y="276" width="332" height="44" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="start" dominant-baseline="central">plain 0.5000        F1 0.1800</text>
  <text x="60" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#CC2B1D" text-anchor="start">One lopsided pair is not a rule.</text>
  <rect x="408" y="62" width="372" height="300" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="422,88 429.5,95.0 442,80.0" fill="none" stroke="#1B7A4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="454" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="start" font-weight="bold" dominant-baseline="central">RIGHT</text>
  <text x="454" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">compute the balanced pair too</text>
  <rect x="428" y="132" width="332" height="96" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="444" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="start">p = 0.6    r = 0.6</text>
  <text x="444" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">plain     0.6 + 0.6 = 1.200   &#247; 2 = 0.6000</text>
  <text x="444" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">harmonic  2 &#215; 0.6 &#215; 0.6 = 0.720</text>
  <text x="444" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="start">          0.720 &#247; 1.200 = 0.6000</text>
  <text x="444" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" font-weight="bold">Identical. So F1 is not a penalty</text>
  <text x="444" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" font-weight="bold">for existing.</text>
  <text x="444" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">It only marks you down when the</text>
  <text x="444" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="start">two numbers disagree.</text>
  <text x="444" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1B7A4B" text-anchor="start">gap on (0.6, 0.6) = 0.0000</text>
</svg>
