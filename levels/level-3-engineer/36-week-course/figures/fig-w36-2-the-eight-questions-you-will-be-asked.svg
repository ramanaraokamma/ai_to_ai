<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The eight questions, and the number each answer must contain</title>
  <desc>Eight questions with the number each answer has to carry. 1, what if I send it something weird: do not answer, demo four refusals, and say the body limit is 100,000 bytes. 2, how fast is it: two numbers, 772.2 milliseconds once and p95 0.27 milliseconds per request. 3, how do you know it still works next month: band rate 27.0 percent now, alarm at 40 percent. 4, someone says it got their comment wrong: walk the log, 111 lines, input, probability, threshold and version all on one line. 5, why 127.0.0.1: no authentication and no rate limit, so 0.0.0.0 would expose it to the whole network. 6, is it any good: 0.8125 on 16 rows against a baseline of 0.500, and 16 rows means one row is worth 6.25 points. 7, who should not use this: read the out-of-scope line, recall 0 of 6 on negations. 8, could you retrain it automatically: no, that is a feedback loop where it learns its own mistakes. Below, the banned words: production-ready, scalable, it just works, robust, real-time, seamless, 99 percent accurate.</desc>

  <text x="250" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The eight questions,</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">and the number each answer needs</text>

  <rect x="30" y="86" width="440" height="52" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="104" r="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="54" y="109" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1</text>
  <text x="74" y="109" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"send it something weird?"</text>
  <text x="46" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">demo 4 refusals &#183; limit 100,000 bytes</text>

  <rect x="30" y="148" width="440" height="52" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="166" r="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="54" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2</text>
  <text x="74" y="171" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"how fast is it?"</text>
  <text x="46" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">772.2 ms once &#183; p95 0.27 ms each</text>

  <rect x="30" y="210" width="440" height="52" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="228" r="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/>
  <text x="54" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3</text>
  <text x="74" y="233" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"still working next month?"</text>
  <text x="46" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">band rate 14.4% now &#183; alarm at 40%</text>

  <rect x="30" y="272" width="440" height="52" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="290" r="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/>
  <text x="54" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">4</text>
  <text x="74" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"you got my comment wrong"</text>
  <text x="46" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">walk the log &#183; 111 lines, all 5 fields</text>

  <rect x="30" y="334" width="440" height="52" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="352" r="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2"/>
  <text x="54" y="357" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">5</text>
  <text x="74" y="357" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"why 127.0.0.1?"</text>
  <text x="46" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">no auth, no rate limit &#183; 0 outsiders</text>

  <rect x="30" y="396" width="440" height="52" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="414" r="12" fill="#FFFFFF" stroke="#845F00" stroke-width="2"/>
  <text x="54" y="419" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">6</text>
  <text x="74" y="419" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"is it any good?"</text>
  <text x="46" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.8125 of 16 vs baseline 0.500</text>

  <rect x="30" y="458" width="440" height="52" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="476" r="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2"/>
  <text x="54" y="481" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">7</text>
  <text x="74" y="481" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"who should not use this?"</text>
  <text x="46" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">read out-of-scope &#183; recall 0 &#247; 6</text>

  <rect x="30" y="520" width="440" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="54" cy="538" r="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2"/>
  <text x="54" y="543" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">8</text>
  <text x="74" y="543" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">"just retrain it automatically?"</text>
  <text x="46" y="564" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">no &#8212; it would learn its own mistakes</text>

  <!-- banned words -->
  <rect x="30" y="592" width="440" height="88" rx="10" fill="#F5F8FA" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="616" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle">BANNED WORDS &#8212; on the wall, visible</text>
  <text x="250" y="640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">production-ready &#183; scalable &#183; it just works</text>
  <text x="250" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">robust &#183; real-time &#183; seamless &#183; 99% accurate</text>
  <text x="250" y="674" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">say what you built, with its number</text>
</svg>
