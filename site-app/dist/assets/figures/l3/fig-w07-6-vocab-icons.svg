<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four words from Week 7, drawn</title>
  <desc>Four labelled tiles. Feature set: four named column boxes, distance_km, items, prep_minutes, is_rush, with the note 5 kept on purpose. Ablation table: eight rows, two green marked keep and six red marked drop, with the note one change per row. Regression: a line of four dots stepping downwards with a red cross, labelled minus 0.0051 it got worse, and the note not linear regression. Leak hunt: a red box holding 0.9240 with an arrow down to a green box holding 0.7535, and the question does this value exist when I need it, answered no.</desc>
