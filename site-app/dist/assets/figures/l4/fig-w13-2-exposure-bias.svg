<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The model is more surprised by its own names (1.122) than by real ones (0.954): consistent with exposure bias, not proof</title>
  <desc>Two rows of letter boxes. In training the model reads a, n, d, r, all true letters, and is asked for the next one. In generating it reads a, n, d, t where t, drawn red with a cross-free label unlikely pick, is its own unlikely draw, so the prefix is one it rarely practised. Below, three horizontal bars of average loss per letter: real names, 231 names, 0.954 with 0.000 of them above 1.5; the model's own names at T = 1.0, 200 names, 1.122 with 0.175 above 1.5; its own names at T = 0.5, 0.920 with 0.010 above 1.5.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Exposure bias: it practised on true letters only</text>
