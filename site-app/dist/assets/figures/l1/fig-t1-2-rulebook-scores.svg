  <rect x="674" y="196" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/><g stroke="#CC2B1D" stroke-width="4" stroke-linecap="round"><line x1="685" y1="207" x2="699" y2="221"/><line x1="699" y1="207" x2="685" y2="221"/></g>
  <text x="210" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">10 out of 10 = 100%</text>
  <text x="590" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">6 out of 10 = 60%</text>
  <text x="210" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Tells you nothing about tomorrow</text>
  <text x="590" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The only number worth writing down</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">You can always score 100% on a test you wrote after seeing the answers.</text>
