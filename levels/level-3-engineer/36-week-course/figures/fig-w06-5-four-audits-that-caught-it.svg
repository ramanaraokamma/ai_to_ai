<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Four alarms, one nobody can ring</title>
  <desc>Four numbered audits of a leaking column. One, correlation with the target: customer_called_support scores 0.942 while the next best honest column scores 0.345, which is 2.73 times bigger. Two, the crosstab: of 552 orders where support was called, 540 were late, and 12 plus 540 is 552 so 540 of 552 is 0.9783. Three, one column on its own: customer_called_support reaches AUC 0.9556 while distance_km reaches only 0.6800. Four, the coefficient: 3.482 against 0.804 for distance, which is 4.33 times bigger. A fifth amber panel holds the question with no statistic in it: at the moment the order is placed, has the customer rung up about a delivery that has not arrived yet?</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four alarms, one nobody can ring</text>
  <rect x="24" y="72" width="452" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="48" cy="100" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="48" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="68" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" dominant-baseline="central">correlation with the target</text>
  <text x="40" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">customer_called_support   0.942</text>
  <text x="40" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">next best honest column   0.345</text>
  <text x="40" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">0.942 &#247; 0.345 = 2.73 times bigger</text>
  <rect x="24" y="200" width="452" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="48" cy="228" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="48" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="68" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" dominant-baseline="central">the crosstab</text>
  <text x="40" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">of 552 orders where support called,</text>
  <text x="40" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">540 were late</text>
  <text x="40" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">12 + 540 = 552, and 540 of 552 = 0.9783</text>
  <rect x="24" y="328" width="452" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="48" cy="356" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="48" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="68" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" dominant-baseline="central">one column on its own</text>
  <text x="40" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">customer_called_support   AUC 0.9556</text>
  <text x="40" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">distance_km              AUC 0.6800</text>
  <text x="40" y="428" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">no honest column scores 0.92 alone</text>
  <rect x="24" y="456" width="452" height="112" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="48" cy="484" r="9" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="48" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="68" y="484" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" dominant-baseline="central">the coefficient</text>
  <text x="40" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">num__customer_called_support  3.482</text>
  <text x="40" y="532" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">num__distance_km             0.804</text>
  <text x="40" y="556" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">3.482 &#247; 0.804 = 4.33 times bigger</text>
  <rect x="24" y="584" width="452" height="74" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="250" y="606" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">and then the question with no statistic in it</text>
  <text x="250" y="628" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">At the moment the order is placed, has the customer</text>
  <text x="250" y="646" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">rung up about a delivery that has not arrived yet?</text>
  <text x="250" y="676" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Alarms 1&#8211;4 measure strength. The last asks about time.</text>
</svg>
