<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The bake-off line-up</title>
  <desc>Five feature cards stand in a police line-up against a height chart. Their placards read hours practised, oven temperature, judge's rosette, cake height in centimetres and kitchen number. One of the five is the leak.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One of these five is the leak</text>
  <rect x="24" y="58" width="752" height="230" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="40" y1="100" x2="760" y2="100"/>
    <line x1="40" y1="150" x2="760" y2="150"/>
    <line x1="40" y1="200" x2="760" y2="200"/>
    <line x1="40" y1="250" x2="760" y2="250"/>
  </g>
  <!-- five suspects -->
  <g transform="translate(56,112)">
    <rect x="0" y="0" width="120" height="152" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="46" cy="36" r="4" fill="#14202B"/><circle cx="74" cy="36" r="4" fill="#14202B"/>
    <path d="M42 60 Q60 72 78 60" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="96" width="100" height="44" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <text x="60" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">hours</text>
    <text x="60" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">practised</text>
  </g>
  <g transform="translate(200,112)">
    <rect x="0" y="0" width="120" height="152" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="46" cy="36" r="4" fill="#14202B"/><circle cx="74" cy="36" r="4" fill="#14202B"/>
    <path d="M42 62 H78" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="96" width="100" height="44" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <text x="60" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">oven temp</text>
    <text x="60" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">in degrees</text>
  </g>
  <g transform="translate(344,112)">
    <rect x="0" y="0" width="120" height="152" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="46" cy="36" r="4" fill="#14202B"/><circle cx="74" cy="36" r="4" fill="#14202B"/>
    <path d="M42 66 Q60 56 78 66" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="96" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
    <text x="60" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">judge's</text>
    <text x="60" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">rosette</text>
  </g>
  <g transform="translate(488,112)">
    <rect x="0" y="0" width="120" height="152" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="46" cy="36" r="4" fill="#14202B"/><circle cx="74" cy="36" r="4" fill="#14202B"/>
    <path d="M42 60 Q60 72 78 60" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="96" width="100" height="44" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <text x="60" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">cake height</text>
    <text x="60" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">in cm</text>
  </g>
  <g transform="translate(632,112)">
    <rect x="0" y="0" width="120" height="152" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="46" cy="36" r="4" fill="#14202B"/><circle cx="74" cy="36" r="4" fill="#14202B"/>
    <path d="M42 62 H78" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="96" width="100" height="44" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <text x="60" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">kitchen</text>
    <text x="60" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">number 1-5</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="116" y="284">A</text><text x="260" y="284">B</text><text x="404" y="284">C</text><text x="548" y="284">D</text><text x="692" y="284">E</text>
  </g>
  <text x="400" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Question: "Will this cake win the bake-off?"</text>
  <text x="400" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">One is the leak. One lands exactly on the baseline. Three are honest.</text>
</svg>
