<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week's five words as pictures</title>
  <desc>Five icon cards. A record is one card of two labelled pairs. A list-of-dicts is four table rows with the same labels. A field is one highlighted cell of a grid. A list comprehension is one highlighted column being lifted out of a grid into a plain row of three boxes. Enumerate is a counter reading 0 next to a whole row. A sixth cell lists four sentences to remember.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
