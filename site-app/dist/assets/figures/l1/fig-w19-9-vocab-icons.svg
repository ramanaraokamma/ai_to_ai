<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The four new words of Week 19</title>
  <desc>Four picture tiles. Training set is a big pile of cards. Test set is a sealed envelope. Hold out is a hand lifting cards away from a pile. Split ratio is the numbers eighty and twenty written as a pair of unequal bars.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">The four new words of Week 19</text>

    <rect x="30" y="66" width="176" height="248" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round" fill="#D9EAF9">
      <rect x="66" y="106" width="104" height="26" rx="6"/>
      <rect x="60" y="132" width="104" height="26" rx="6"/>
      <rect x="70" y="158" width="104" height="26" rx="6"/>
      <rect x="62" y="184" width="104" height="26" rx="6"/>
    </g>
    <text x="118" y="240" font-size="18" fill="#14202B" text-anchor="middle">training set</text>
    <text x="118" y="266" font-size="14" fill="#55636F" text-anchor="middle">the big pile the</text>
    <text x="118" y="286" font-size="14" fill="#55636F" text-anchor="middle">model may study</text>

    <rect x="216" y="66" width="176" height="248" rx="12" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <rect x="248" y="112" width="112" height="76" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M248 120 L304 158 L360 120" fill="none" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M266 196 Q290 140 316 176 Q334 200 348 158" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/>
    <text x="304" y="240" font-size="18" fill="#14202B" text-anchor="middle">test set</text>
    <text x="304" y="266" font-size="14" fill="#55636F" text-anchor="middle">hidden before training,</text>
    <text x="304" y="286" font-size="14" fill="#55636F" text-anchor="middle">opened once at the end</text>

    <rect x="402" y="66" width="176" height="248" rx="12" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round" fill="#D9EAF9">
      <rect x="430" y="164" width="86" height="22" rx="6"/>
      <rect x="430" y="186" width="86" height="22" rx="6"/>
    </g>
    <rect x="470" y="102" width="86" height="22" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <path d="M462 152 Q470 118 496 108" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
    <path d="M448 138 L462 152 L446 158" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="490" y="240" font-size="18" fill="#14202B" text-anchor="middle">hold out</text>
    <text x="490" y="266" font-size="14" fill="#55636F" text-anchor="middle">to lift examples away</text>
    <text x="490" y="286" font-size="14" fill="#55636F" text-anchor="middle">before you start</text>

    <rect x="588" y="66" width="182" height="248" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="612" y="112" width="134" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="679" y="135" font-size="18" fill="#14202B" text-anchor="middle">80 train</text>
    <rect x="612" y="158" width="34" height="34" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="700" y="181" font-size="18" fill="#14202B" text-anchor="middle">20 test</text>
    <text x="679" y="240" font-size="18" fill="#14202B" text-anchor="middle">split ratio</text>
    <text x="679" y="266" font-size="14" fill="#55636F" text-anchor="middle">how you divided them,</text>
    <text x="679" y="286" font-size="14" fill="#55636F" text-anchor="middle">written train / test</text>

    <text x="400" y="358" font-size="14" fill="#55636F" text-anchor="middle">The golden rule: a test example is never trained on. Not once.</text>
  </g>
</svg>
