  <text x="640" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">bag of a = bag of b: [2, 1, 1, 1]</text>
