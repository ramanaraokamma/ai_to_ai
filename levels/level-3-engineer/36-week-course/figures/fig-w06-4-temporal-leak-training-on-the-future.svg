  <text x="60" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">+2.00</text>
  <text x="626" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">&#8722;1.77</text>
  <text x="340" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2.00 &#8722; 0.13 &#215; 29 = 2.00 &#8722; 3.77 = &#8722;1.77</text>
  <text x="340" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the thing that predicted lateness in week 0 predicts the opposite by week 29</text>
