<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The mean was 62. Nobody scored 62.</title>
  <desc>On the left a grey box prints mean 62.0 and median 62.5, marked with a red cross. On the right a histogram of twenty quiz marks shows six in the thirties, four in the forties, three completely empty bins, and ten in the eighties, with the mean line falling in the empty gap.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The mean was 62. Nobody scored 62.</text>
  <rect x="24" y="96" width="270" height="140" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="159" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">what we printed</text>
  <text x="159" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">mean = 62.0</text>
  <text x="159" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">median = 62.5</text>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="261" y1="111" x2="275" y2="125"/><line x1="275" y1="111" x2="261" y2="125"/></g>
  <text x="28" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Nobody scored between 44 and 81.</text>
  <text x="28" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Both summaries describe a student</text>
  <text x="28" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">who does not exist.</text>
  <line x1="322" y1="100" x2="322" y2="286" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="322" y1="286" x2="764" y2="286" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="314" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <text x="314" y="197" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">5</text>
  <line x1="322" y1="193" x2="764" y2="193" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="314" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">10</text>
  <line x1="322" y1="100" x2="764" y2="100" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="332" y="174.4" width="70" height="111.6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="367" y="166.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">6</text>
  <rect x="402" y="211.6" width="70" height="74.4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="437" y="203.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">4</text>
  <rect x="682" y="100.0" width="70" height="186.0" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="717" y="92.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">10</text>
  <text x="332" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">30</text>
  <text x="402" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">40</text>
  <text x="472" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">50</text>
  <text x="542" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">60</text>
  <text x="612" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">70</text>
  <text x="682" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">80</text>
  <text x="752" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">90</text>
  <text x="542" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Quiz mark (out of 100)</text>
  <line x1="556" y1="214" x2="556" y2="284" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="556" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">mean 62</text>
  <rect x="468" y="128" width="210" height="62" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="573" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">Three empty bins.</text>
  <text x="573" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">Not one single student.</text>
  <line x1="573" y1="194" x2="573" y2="210" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(573 210) rotate(90.0)"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two clumps, one at 39 and one at 85. The average sat in the gap.</text>
</svg>
