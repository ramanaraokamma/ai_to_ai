<text x="722" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">.</text>
<path d="M 78 156 V 192 H 170 V 156" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="124.0" cy="192" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="124.0" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
<path d="M 170 156 V 228 H 262 V 156" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="216.0" cy="228" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="216.0" y="229" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
<path d="M 262 156 V 192 H 354 V 156" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="308.0" cy="192" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="308.0" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M 354 156 V 228 H 446 V 156" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
