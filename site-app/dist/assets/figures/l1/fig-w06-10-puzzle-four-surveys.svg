<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four surveys, one school</title>
  <desc>Four survey cards about the favourite school lunch in a school of eight hundred students. Card A asked four hundred people in the pizza queue and got eighty-one percent. Card B asked thirty people, five from each year group. Card C asked one hundred and twenty people who chose to answer an online poll. Card D asked all eight hundred on paper in registration.</desc>
  <text x="400" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same question. Same school of 800. Four surveys.</text>
  <text x="400" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Question: what is the favourite school lunch?</text>

  <g fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round">
    <rect x="24" y="76" width="176" height="204" rx="12"/>
    <rect x="216" y="76" width="176" height="204" rx="12"/>
    <rect x="408" y="76" width="176" height="204" rx="12"/>
    <rect x="600" y="76" width="176" height="204" rx="12"/>
  </g>
  <g fill="#F5F8FA" stroke="none">
    <path d="M24 88 A12 12 0 0 1 36 76 H188 A12 12 0 0 1 200 88 V110 H24 Z"/>
    <path d="M216 88 A12 12 0 0 1 228 76 H380 A12 12 0 0 1 392 88 V110 H216 Z"/>
    <path d="M408 88 A12 12 0 0 1 420 76 H572 A12 12 0 0 1 584 88 V110 H408 Z"/>
    <path d="M600 88 A12 12 0 0 1 612 76 H764 A12 12 0 0 1 776 88 V110 H600 Z"/>
  </g>
  <g stroke="#14202B" stroke-width="3">
    <line x1="24" y1="110" x2="200" y2="110"/>
    <line x1="216" y1="110" x2="392" y2="110"/>
    <line x1="408" y1="110" x2="584" y2="110"/>
    <line x1="600" y1="110" x2="776" y2="110"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">
    <text x="112" y="101">SURVEY A</text>
    <text x="304" y="101">SURVEY B</text>
    <text x="496" y="101">SURVEY C</text>
    <text x="688" y="101">SURVEY D</text>
  </g>

  <!-- how many asked, as a bar -->
  <g fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round">
    <rect x="40" y="122" width="72" height="20" rx="5"/>
    <rect x="232" y="122" width="6" height="20" rx="3"/>
    <rect x="424" y="122" width="22" height="20" rx="5"/>
    <rect x="616" y="122" width="144" height="20" rx="5"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="120" y="138">400</text>
    <text x="246" y="138">30</text>
    <text x="454" y="138">120</text>
    <text x="616" y="164">800</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
    <text x="40" y="170">Asked everyone</text>
    <text x="40" y="188">standing in the</text>
    <text x="40" y="206">queue at the</text>
    <text x="40" y="224">pizza stall.</text>

    <text x="232" y="170">Asked 5 students</text>
    <text x="232" y="188">picked by lottery</text>
    <text x="232" y="206">from each of the</text>
    <text x="232" y="224">6 year groups.</text>

    <text x="424" y="170">Online poll linked</text>
    <text x="424" y="188">in the newsletter.</text>
    <text x="424" y="206">Anyone who felt</text>
    <text x="424" y="224">like it answered.</text>

    <text x="616" y="188">Paper slip handed</text>
    <text x="616" y="206">to every student</text>
    <text x="616" y="224">in registration.</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="40" y="258">pizza 81%</text>
    <text x="232" y="258">pizza 34%</text>
    <text x="424" y="258">pizza 62%</text>
    <text x="616" y="258">pizza 38%</text>
  </g>

  <rect x="24" y="296" width="752" height="82" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">
    <text x="44" y="320">1. Put the four surveys in order, most trustworthy first.</text>
    <text x="44" y="342">2. One survey asked 400 people and is still nearly the worst. Which, and why?</text>
    <text x="44" y="364">3. Survey B asked only 30 people. Why is its answer so close to Survey D's?</text>
  </g>
</svg>
