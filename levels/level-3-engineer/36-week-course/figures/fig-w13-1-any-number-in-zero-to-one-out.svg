<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Any number in, a number between 0 and 1 out</title>
  <desc>Five raw scores on the left &#8212; minus 1000, minus 2.00, 0.00, 1.40 and plus 1000 &#8212; each pass through a band labelled the sigmoid and come out on the right as 0.0000, 0.1192, 0.5000, 0.8022 and 1.0000. The highlighted row is worked out in full: for z = 1.40, e to the minus 1.40 is 0.246597, and 1 divided by 1.246597 is 0.8022. A bracket on the far right marks the range 0 to 1, which every output sits inside.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Any number in, a number between 0 and 1 out</text>
  <text x="60" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">z: the raw score. Any number at all.</text>
  <text x="470" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">p: always inside 0 to 1.</text>
  <rect x="330" y="104" width="80" height="216" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="370" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" transform="rotate(-90 370 212)">the sigmoid</text>
  <line x1="196" y1="128" x2="326" y2="128" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(326 128) rotate(0.0)"/>
  <line x1="414" y1="128" x2="544" y2="128" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(544 128) rotate(0.0)"/>
  <rect x="60" y="112" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="128" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">&#8722;1000</text>
  <rect x="548" y="112" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="616" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">0.0000</text>
  <line x1="196" y1="168" x2="326" y2="168" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(326 168) rotate(0.0)"/>
  <line x1="414" y1="168" x2="544" y2="168" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(544 168) rotate(0.0)"/>
  <rect x="60" y="152" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="128" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">&#8722;2.00</text>
  <rect x="548" y="152" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="616" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">0.1192</text>
  <line x1="196" y1="208" x2="326" y2="208" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(326 208) rotate(0.0)"/>
  <line x1="414" y1="208" x2="544" y2="208" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(544 208) rotate(0.0)"/>
  <rect x="60" y="192" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="128" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">0.00</text>
  <rect x="548" y="192" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="616" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">0.5000</text>
  <line x1="196" y1="248" x2="326" y2="248" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(326 248) rotate(0.0)"/>
  <line x1="414" y1="248" x2="544" y2="248" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(544 248) rotate(0.0)"/>
  <rect x="60" y="232" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="128" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">1.40</text>
  <rect x="548" y="232" width="136" height="32" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="616" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">0.8022</text>
  <line x1="196" y1="288" x2="326" y2="288" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(326 288) rotate(0.0)"/>
  <line x1="414" y1="288" x2="544" y2="288" stroke="#55636F" stroke-width="2" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(544 288) rotate(0.0)"/>
  <rect x="60" y="272" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="128" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">+1000</text>
  <rect x="548" y="272" width="136" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="616" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">1.0000</text>
  <line x1="700" y1="112" x2="700" y2="304" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="700" y1="112" x2="712" y2="112" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="700" y1="304" x2="712" y2="304" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="716" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">0 to 1</text>
  <text x="716" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">always</text>
  <rect x="60" y="316" width="260" height="54" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="72" y="337" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">z = 1.40:  e^(&#8722;1.40) = 0.246597</text>
  <text x="72" y="357" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1 &#247; (1 + 0.246597) = 0.8022</text>
  <text x="690" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">a squash, not a cut-off:</text>
  <text x="690" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">nothing ever reaches 0 or 1 exactly</text>
</svg>
