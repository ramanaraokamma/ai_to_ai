<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Where the 75 marks and 70 minutes go, and why Section E needs its own 13 minutes</title>
  <desc>Two bars with the same five sections A to E. The gold marks bar has widths 20, 16, 12, 15 and 12 marks, totalling 75. The blue minutes bar has 15, 15, 12, 15 and 13 minutes, totalling 70. Beneath each is what it asks: 20 multiple choice, 8 what-does-this-print, 4 find-the-bug, 3 arithmetic, and 1 question on real loss curves. Section E is outlined in pink with a note to start it with about 13 minutes left.</desc>
