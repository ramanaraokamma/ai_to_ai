  <rect x="60" y="228" width="9" height="9" fill="#E8C671" stroke="#845F00" stroke-width="1.5"/>
  <rect x="60" y="237" width="9" height="9" fill="#E8C671" stroke="#845F00" stroke-width="1.5"/>
  <rect x="106" y="208" width="144" height="40" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="260" y="208" width="100" height="40" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
