  <rect x="300" y="100" width="200" height="170" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="560" y="100" width="200" height="170" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(245,175) scale(0.5)">
