<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Puzzle: let greedy out of the circle</title>
  <desc>Three word circles the, bus and to joined by arrows labelled four, two and three, forming a loop. A dashed branch leads out to town and then to a full stop, with a box asking how many marks must be added to the pair to town.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Puzzle: let greedy out of the circle</text>
  <path d="M230 158 Q300 180 320 220" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(320 220) rotate(65)"/>
  <path d="M278 262 H182" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(182 262) rotate(180)"/>
  <path d="M140 220 Q160 180 200 152" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(200 152) rotate(-35)"/>
  <circle cx="230" cy="116" r="42" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="230" y="117" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">the</text>
  <circle cx="320" cy="262" r="42" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="320" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">bus</text>
  <circle cx="140" cy="262" r="42" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="140" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">to</text>
  <text x="300" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6D28D9" text-anchor="middle" font-weight="600">4</text>
  <text x="230" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6D28D9" text-anchor="middle" font-weight="600">2</text>
  <text x="148" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6D28D9" text-anchor="middle" font-weight="600">3</text>
  <text x="230" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">greedy is stuck here for ever</text>
  <line x1="362" y1="262" x2="438" y2="262" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
  <polyline points="428,254 440,262 428,270" fill="none" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="486" cy="262" r="42" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="486" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#55636F" text-anchor="middle" dominant-baseline="central">town</text>
  <line x1="530" y1="262" x2="590" y2="262" stroke="#C7CDD4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
  <circle cx="632" cy="262" r="34" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="632" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#55636F" text-anchor="middle" dominant-baseline="central">.</text>
  <text x="400" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">count = 1</text>
  <rect x="452" y="84" width="308" height="116" rx="12" fill="#F5F8FA" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="606" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle" font-weight="600">YOUR JOB</text>
  <text x="470" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B">Add</text>
  <rect x="508" y="126" width="54" height="26" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="572" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B">marks to  to → town</text>
  <text x="470" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">so greedy reaches the full stop.</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Greedy always takes the biggest count. What is the smallest change that lets it stop?</text>
</svg>
