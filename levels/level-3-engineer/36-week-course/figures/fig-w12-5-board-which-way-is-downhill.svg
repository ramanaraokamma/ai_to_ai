<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Which way is downhill? Read the sign.</title>
  <desc>The same bowl, loss equals w minus 8 all squared, drawn twice. On the left a dot sits at w equals 2 on the left wall where the slope is minus 12, and an arrow points right and down; the arithmetic reads 2 minus 0.3 times minus 12 equals 2 plus 3.6 equals 5.6, so a negative slope pushes w up. On the right a dot sits at w equals 14 on the right wall where the slope is plus 12, and an arrow points left and down; the arithmetic reads 14 minus 0.3 times plus 12 equals 14 minus 3.6 equals 10.4, so a positive slope pushes w down. Both arrows head towards 8.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Which way is downhill? Read the sign.</text>
