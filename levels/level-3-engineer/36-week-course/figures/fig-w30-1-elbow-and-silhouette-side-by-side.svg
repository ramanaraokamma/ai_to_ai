<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two pieces of evidence, and they agree</title>
  <desc>Two charts. On the left, inertia against k for the 178 scaled wines, falling from 2314.0 at k equals 1 to 864.6 at k equals 10, with the drops printed: 655.0, 381.1, then a collapse to 97.2. On the right, the mean silhouette against k, rising to a peak of 0.2849 at k equals 3 and then falling to 0.1338 at k equals 10. Both charts ring k equals 3. A note says inertia always falls so it can never choose on its own, while silhouette has a genuine peak.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two kinds of evidence, one answer.</text>
