<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Staring at the pixels, or checking where it came from</title>
  <desc>Two panels. The wrong one shows a magnifying glass held over a photo with the caption I would know if it was fake. The right one lists the four provenance checks: who posted it first, when and how fast, who else has it, and what was around it.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Check the provenance, not the pixels</text>
  <rect x="40" y="76" width="330" height="252" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="430" y="76" width="330" height="252" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <g transform="translate(56,90) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="110" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Looking harder</text>
  <g transform="translate(446,90) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="500" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Checking the source</text>
  <rect x="108" y="146" width="194" height="118" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="122" y="160" width="166" height="90" rx="4" fill="#D9EAF9" stroke="none"/>
  <circle cx="156" cy="188" r="12" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M122 250 L172 208 L204 234 L232 214 L288 250 Z" fill="#1F6FB2" stroke="none"/>
  <g transform="translate(196,178) scale(0.9)">
    <line x1="60" y1="60" x2="86" y2="86" stroke="#1F6FB2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="42" r="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <path d="M30 36 A14 14 0 0 1 42 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="205" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">&#8220;I'd know if it was fake.&#8221;</text>
  <text x="205" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Goes out of date every few months.</text>
  <g>
    <circle cx="462" cy="158" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="462" cy="196" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="462" cy="234" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <circle cx="462" cy="272" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
    <text x="462" y="162">1</text>
    <text x="462" y="200">2</text>
    <text x="462" y="238">3</text>
    <text x="462" y="276">4</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="486" y="164">Who posted it FIRST?</text>
    <text x="486" y="202">When? How fast?</text>
    <text x="486" y="240">Who else has it?</text>
    <text x="486" y="278">What was around it?</text>
  </g>
  <text x="595" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">These four still work in ten years.</text>
  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Generators get an upgrade every few months. Your eyes do not.</text>
</svg>
