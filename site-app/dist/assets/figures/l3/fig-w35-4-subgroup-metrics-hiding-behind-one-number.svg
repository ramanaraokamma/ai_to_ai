<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>What the one number was hiding</title>
  <desc>On the left, the headline number: accuracy 0.875 on the 16 held-out reviews, which is 14 right out of 16. On the right, the same model measured on 28 labelled rows split two ways. The 15 rows with no negation word score 0.867, that is 13 right out of 15, and recall on the positive class is 7 out of 8 which is 0.875. The 13 rows containing one of the seven negation words score 0.385, that is 5 right out of 13, and recall is 0 out of 6, which is 0.000 &#8212; it found none of the positive ones. The counts add up: 13 plus 15 equals 28, and 5 plus 13 equals 18, so 18 divided by 28 equals 0.643 overall. The headline 0.875 was hiding a group where the model finds nothing.</desc>

  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">What the one number was hiding</text>

  <!-- the headline -->
  <rect x="40" y="76" width="220" height="150" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="150" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the number on the card</text>
  <text x="150" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">0.875</text>
  <text x="150" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">14 right of 16</text>
  <text x="150" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the held-out review pile</text>

  <!-- splitter -->
  <path d="M 266 151 L 318 111" stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="322,108 310,112 316,122" fill="#14202B"/>
  <path d="M 266 151 L 318 251" stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="320,255 318,242 308,249" fill="#14202B"/>
  <text x="292" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">split it</text>

  <!-- no negation -->
  <rect x="326" y="76" width="434" height="104" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="344" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">no negation word</text>
  <text x="742" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">n = 15</text>
  <text x="344" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">accuracy</text>
  <text x="500" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">13 &#247; 15 = 0.867</text>
  <text x="344" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">recall on positive</text>
  <text x="500" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">7 &#247; 8  = 0.875</text>
  <text x="344" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">it works, and this is the group most requests land in</text>

  <!-- negation -->
  <rect x="326" y="192" width="434" height="104" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="344" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">contains a negation word</text>
  <text x="742" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">n = 13</text>
  <text x="344" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">accuracy</text>
  <text x="500" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CC2B1D">5 &#247; 13 = 0.385</text>
  <text x="344" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">recall on positive</text>
  <text x="500" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CC2B1D">0 &#247; 6  = 0.000</text>
  <text x="344" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the seven words: not never hardly cannot no nothing far</text>

  <!-- the addition check -->
  <rect x="40" y="244" width="220" height="102" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="150" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">the counts must add up</text>
  <text x="58" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">13 + 15 = 28</text>
  <text x="58" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B"> 5 + 13 = 18</text>
  <text x="58" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">18 &#247; 28 = 0.643</text>

  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Every row carries its n. Any n under 10 gets "too small to conclude from".</text>
</svg>
