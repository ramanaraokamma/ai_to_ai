<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank number line from 0.10 to 0.30 with a row for each of the five cures, for drawing the best-val ranges</title>
  <desc>Empty chart. Five labelled rows (no cure, early stop p equals 25, dropout 0.3, weight decay 0.3, jitter 0.1) share one bottom axis from 0.10 to 0.30, with a faint line every 0.01 and a labelled line every 0.05. A key at the top shows an empty bar for lowest to highest and a diamond for the mean. Nothing is drawn in the rows.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw the five best-val ranges</text>
  <rect x="30" y="96" width="740" height="44" rx="0" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="42" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start" dominant-baseline="central">no cure</text>
