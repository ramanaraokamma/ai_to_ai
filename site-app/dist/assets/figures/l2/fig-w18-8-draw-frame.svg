<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 18</title>
  <desc>An empty framed drawing area titled draw the Term 2 ladder and ring the rungs that wobble. A ladder with nine blank rungs runs up the middle, labelled Week 10 at the bottom through to Week 18 at the top, with an empty dashed box beside each rung headed what it gave me, and a pink note pointing at the ladder saying ring a rung that wobbles. Three reminder boxes underneath for two revisit lines, each naming a week and a thing, and the best Bug Log entry.</desc>
