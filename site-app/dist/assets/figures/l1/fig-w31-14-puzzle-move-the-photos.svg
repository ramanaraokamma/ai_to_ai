<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Move the photos, move the headline</title>
  <desc>Four buckets labelled with the true accuracy of each group: ninety percent, sixty percent, forty percent and twenty percent. Under each bucket is a blank box for how many test photos you choose to put in it. The rule says the four numbers must add to forty eight with at least six in every bucket, and two answer boxes ask for the highest and lowest headline you can produce.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Move the photos, move the headline</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same model. You only choose how many photos of each group to test.</text>
  <g fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round">
    <path d="M52 100 H178 L162 200 H68 Z"/>
    <path d="M242 100 H368 L352 200 H258 Z"/>
    <path d="M432 100 H558 L542 200 H448 Z"/>
    <path d="M622 100 H748 L732 200 H638 Z"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">
    <text x="115" y="158">90%</text>
    <text x="305" y="158">60%</text>
    <text x="495" y="158">40%</text>
    <text x="685" y="158">20%</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="115" y="184">true accuracy</text>
    <text x="305" y="184">true accuracy</text>
    <text x="495" y="184">true accuracy</text>
    <text x="685" y="184">true accuracy</text>
    <text x="115" y="224">how many photos?</text>
    <text x="305" y="224">how many photos?</text>
    <text x="495" y="224">how many photos?</text>
    <text x="685" y="224">how many photos?</text>
  </g>
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2">
    <rect x="85" y="234" width="60" height="38" rx="8"/>
    <rect x="275" y="234" width="60" height="38" rx="8"/>
    <rect x="465" y="234" width="60" height="38" rx="8"/>
    <rect x="655" y="234" width="60" height="38" rx="8"/>
  </g>
  <text x="400" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Rule: the four boxes must add up to 48, and every box must be at least 6.</text>
  <rect x="60" y="320" width="320" height="48" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="74" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Highest headline:</text>
  <line x1="256" y1="354" x2="366" y2="354" stroke="#1B7A4B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="420" y="320" width="320" height="48" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="434" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Lowest headline:</text>
  <line x1="608" y1="354" x2="726" y2="354" stroke="#CC2B1D" stroke-width="1.5" stroke-linecap="round"/>
</svg>
