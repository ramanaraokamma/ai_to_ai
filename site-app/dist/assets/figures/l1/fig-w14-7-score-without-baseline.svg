<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A score with no baseline says nothing</title>
  <desc>Two panels. The wrong panel shows thirteen out of twenty judged good on its own, marked with a cross. The right panel shows the same thirteen turned into sixty-five percent, set against a five percent baseline, with the sixty point gap arrowed and marked with a tick.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">13 out of 20. Is that good?</text>
  <line x1="400" y1="66" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

  <rect x="30" y="66" width="340" height="254" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <rect x="430" y="66" width="340" height="254" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>

  <g transform="translate(46,78) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <g transform="translate(446,78) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="106" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Wrong</text>
  <text x="506" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Right</text>

  <text x="200" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">13 / 20</text>
  <text x="200" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">"that's most of them,</text>
  <text x="200" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">so it's good"</text>
  <text x="200" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Compared to what? Nothing.</text>
  <text x="200" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">This number is not yet a result.</text>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="500" y1="264" x2="750" y2="264"/>
    <line x1="500" y1="216" x2="750" y2="216"/>
    <line x1="500" y1="168" x2="750" y2="168"/>
    <line x1="500" y1="140" x2="750" y2="140"/>
  </g>
  <path d="M520 264 V172 A4 4 0 0 1 524 168 H566 A4 4 0 0 1 570 172 V264 Z" fill="#1F6FB2"/>
  <path d="M660 264 V257 A4 4 0 0 1 664 253 H706 A4 4 0 0 1 710 257 V264 Z" fill="#845F00"/>
  <line x1="500" y1="264" x2="750" y2="264" stroke="#14202B" stroke-width="2"/>
  <text x="545" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">65%</text>
  <text x="685" y="243" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">5%</text>
  <text x="545" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">tester 13/20</text>
  <text x="685" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">random 1/20</text>
  <g stroke="#C42B8C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="614" y1="168" x2="614" y2="253"/>
    <polyline points="608,175 614,168 620,175"/>
    <polyline points="608,246 614,253 620,246"/>
  </g>
  <text x="614" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">gap: 60 points</text>
  <text x="600" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The gap is the result. The bar on its own is not.</text>

  <text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Always ask: what would they have got knowing nothing at all?</text>
</svg>
