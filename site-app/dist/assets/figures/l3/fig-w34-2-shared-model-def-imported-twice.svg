<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One model definition, imported by both sides</title>
  <desc>model_def.py sits in the middle holding three facts: classes index 0 is negative and index 1 is positive, the input field is called text, and build_model returns a tf-idf vectorizer followed by logistic regression. train.py on the left imports it to build the model and is the only file allowed to fit anything. predict.py on the right imports it to know what the answers mean, and contains no training call. A red crossed arrow shows that predict.py must never import train.py. Underneath, the check: grep for fit-open-bracket, train_test_split, DummyClassifier or optimizer inside the serve folder returns 0 matching lines, and 0 is the only passing answer.</desc>

  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One model definition, imported by both sides</text>

  <!-- connectors first -->
  <path d="M 195 128 L 320 175" stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="320,175 306,168 310,182" fill="#14202B"/>
  <path d="M 605 128 L 480 175" stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="480,175 490,182 494,168" fill="#14202B"/>
  <path d="M 230 100 L 570 100" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" fill="none"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
    <line x1="392" y1="88" x2="408" y2="104"/>
    <line x1="408" y1="88" x2="392" y2="104"/>
  </g>
  <text x="400" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CC2B1D" text-anchor="middle">never this direction</text>

  <!-- train.py -->
  <rect x="40" y="108" width="155" height="76" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="117" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">model/train.py</text>
  <text x="117" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the only file that fits</text>
  <text x="117" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">anything, ever</text>

  <!-- predict.py -->
  <rect x="605" y="108" width="155" height="76" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="682" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">serve/predict.py</text>
  <text x="682" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">zero training code</text>
  <text x="682" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">inside it</text>

  <!-- model_def -->
  <rect x="245" y="160" width="310" height="112" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">model/model_def.py</text>
  <text x="264" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">CLASSES  = ["negative", "positive"]</text>
  <text x="264" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">INPUT_FIELD = "text"</text>
  <text x="264" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">build_model() &#8594; tf-idf &#8594; logreg</text>
  <text x="264" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">index 0 and index 1. Never reorder these two.</text>

  <text x="235" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">imports it to BUILD</text>
  <text x="565" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">imports it to READ</text>

  <!-- the check -->
  <rect x="150" y="292" width="500" height="58" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="168" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">grep -rnE "\.fit\(|train_test_split|optimizer" serve/</text>
  <text x="168" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">matching lines found: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">0</tspan>  &#8212; and 0 is the only pass</text>

  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two folders make the rule a thing you can check instead of a thing you promise.</text>
</svg>
