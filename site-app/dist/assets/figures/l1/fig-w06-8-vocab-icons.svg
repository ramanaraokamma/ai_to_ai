<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Week 6 words as pictures</title>
  <desc>Five icon cards in a row. Provenance is a labelled tin with a stamped origin. Sample is one spoonful lifted from a pot. Population is the whole pot. Data card is an index card with seven ruled lines. Outlier is a row of close dots with one dot far away but still inside the legal fence.</desc>
  <text x="400" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week's five words as pictures</text>
  <rect x="20" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="176" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="332" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="488" y="58" width="146" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="644" y="58" width="136" height="256" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>

  <!-- 1 provenance : a labelled tin -->
  <g transform="translate(52,92)">
    <rect x="0" y="10" width="80" height="94" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="40" cy="12" rx="40" ry="9" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <rect x="-2" y="36" width="84" height="42" rx="4" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">
      <text x="8" y="52">who · from whom</text>
      <text x="8" y="70">when · how · ok?</text>
    </g>
  </g>
  <text x="93" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">provenance</text>
  <text x="93" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the origin story</text>
  <text x="93" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">of a dataset</text>

  <!-- 2 sample : one spoonful -->
  <g transform="translate(202,92)">
    <path d="M6 62 Q6 104 48 104 Q90 104 90 62 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="62" x2="96" y2="62" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="66" cy="26" rx="18" ry="13" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
    <line x1="80" y1="18" x2="98" y2="2" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#845F00" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5">
      <line x1="66" y1="40" x2="66" y2="58"/>
    </g>
  </g>
  <text x="249" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">sample</text>
  <text x="249" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the bit you</text>
  <text x="249" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">actually measured</text>

  <!-- 3 population : the whole pot -->
  <g transform="translate(356,96)">
    <path d="M10 30 Q10 106 49 106 Q88 106 88 30 Z" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <line x1="2" y1="30" x2="96" y2="30" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="42" x2="10" y2="42" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="42" x2="96" y2="42" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
    <g fill="#1F6FB2">
      <circle cx="30" cy="52" r="4"/><circle cx="50" cy="60" r="4"/><circle cx="68" cy="50" r="4"/>
      <circle cx="38" cy="76" r="4"/><circle cx="58" cy="82" r="4"/><circle cx="48" cy="42" r="4"/>
      <circle cx="26" cy="66" r="4"/><circle cx="70" cy="70" r="4"/>
    </g>
  </g>
  <text x="405" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">population</text>
  <text x="405" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">everything you</text>
  <text x="405" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">want it true about</text>

  <!-- 4 data card : index card, 7 lines -->
  <g transform="translate(508,92)">
    <rect x="0" y="6" width="106" height="98" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="6" width="106" height="18" rx="6" fill="#F4D5E9" stroke="none"/>
    <line x1="0" y1="24" x2="106" y2="24" stroke="#14202B" stroke-width="2"/>
    <text x="53" y="20" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">DATA CARD</text>
    <g stroke="#55636F" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="36" x2="80" y2="36"/>
      <line x1="12" y1="47" x2="94" y2="47"/>
      <line x1="12" y1="58" x2="72" y2="58"/>
      <line x1="12" y1="69" x2="90" y2="69"/>
      <line x1="12" y1="80" x2="66" y2="80"/>
    </g>
    <g stroke="#1B7A4B" stroke-width="3" stroke-linecap="round">
      <line x1="12" y1="91" x2="94" y2="91"/>
    </g>
  </g>
  <text x="561" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">data card</text>
  <text x="561" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">seven honest lines,</text>
  <text x="561" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">limits included</text>

  <!-- 5 outlier : dots inside a fence, one far away -->
  <g transform="translate(660,100)">
    <rect x="0" y="10" width="104" height="76" rx="8" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/>
    <g fill="#1F6FB2">
      <circle cx="20" cy="66" r="5"/><circle cx="30" cy="60" r="5"/><circle cx="26" cy="72" r="5"/>
      <circle cx="38" cy="68" r="5"/><circle cx="18" cy="56" r="5"/>
    </g>
    <path d="M84 24 L91 38 L77 38 Z" fill="#C42B8C" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <text x="52" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">legal range</text>
  </g>
  <text x="712" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">outlier</text>
  <text x="712" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">legal, but far</text>
  <text x="712" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">from the crowd</text>

  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The pot is the population. The spoonful is the sample. The card says which spoonful you took.</text>
  <text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The outlier is drawn as a triangle so you can tell it apart without needing colour.</text>
</svg>
