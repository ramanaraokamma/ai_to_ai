<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Trained on the future, tested on the past</title>
  <desc>A line falling steadily across 30 weeks shows the weight on x1 going from plus 2.00 in week 0 to minus 1.77 in week 29, since 2.00 minus 0.13 times 29 is 2.00 minus 3.77. Below, two strips of 30 weekly blocks. The first, marked wrong, is a random split with train and test blocks interleaved through every week, and scores AUC 0.8139. The second, marked correct, is a time split with weeks 0 to 21 as 2200 training rows and weeks 22 to 29 as 800 test rows, and scores AUC 0.5249. The gap, 0.8139 minus 0.5249, is 0.2890, produced by nothing but where the cut was made.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Trained on the future, tested on the past</text>
  <text x="30" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">the world drifts: the weight on x1 over 30 weeks</text>
