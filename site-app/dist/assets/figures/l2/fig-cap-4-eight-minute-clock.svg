<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Your eight minutes, to scale</title>
  <desc>A timeline of eight minutes divided into six blocks: the question one minute, the data ninety seconds showing the raw file, the cleaning log ninety seconds reading two lines out, two charts ninety seconds, the results table one minute pointing at the baseline, and what I got wrong ninety seconds, labelled the best 90 seconds. A green DO list says point at the screen, say every number with its units, say I got this wrong out loud once, have the file already open. A red DO NOT list says do not read your code line by line, do not live-code anything, do not say it's basically 90 percent accurate, do not apologise for your score.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Your eight minutes, to scale</text>
  <rect x="40.0" y="88" width="90.0" height="62" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="85.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">THE</text>
  <text x="85.0" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">QUESTION</text>
  <text x="42.0" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">0:00</text>
  <line x1="85.0" y1="150" x2="85.0" y2="166" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="85.0" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and why you cared</text>
  <rect x="130.0" y="88" width="135.0" height="62" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="197.5" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">THE</text>
  <text x="197.5" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">DATA</text>
  <text x="132.0" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">1:00</text>
  <line x1="197.5" y1="150" x2="197.5" y2="196" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="197.5" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">show the raw file</text>
  <rect x="265.0" y="88" width="135.0" height="62" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="332.5" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">THE</text>
  <text x="332.5" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">CLEANING LOG</text>
  <text x="267.0" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">2:30</text>
  <line x1="332.5" y1="150" x2="332.5" y2="166" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="332.5" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">read TWO lines out</text>
  <rect x="400.0" y="88" width="135.0" height="62" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="467.5" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">TWO</text>
  <text x="467.5" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">CHARTS</text>
  <text x="402.0" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">4:00</text>
  <line x1="467.5" y1="150" x2="467.5" y2="196" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="467.5" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">not five. Two</text>
  <rect x="535.0" y="88" width="90.0" height="62" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="580.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">THE</text>
  <text x="580.0" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">TABLE</text>
  <text x="537.0" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">5:30</text>
  <line x1="580.0" y1="150" x2="580.0" y2="166" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="580.0" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">point at the baseline</text>
  <rect x="625.0" y="88" width="135.0" height="62" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="692.5" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">WHAT</text>
  <text x="692.5" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">I GOT WRONG</text>
  <text x="627.0" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">6:30</text>
  <line x1="692.5" y1="150" x2="692.5" y2="196" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="692.5" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the best 90 seconds</text>
  <text x="760" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">8:00</text>
  <rect x="40" y="238" width="352" height="112" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="216" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">DO</text>
  <text x="58" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Point at the screen, not at the room</text>
  <text x="58" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Say every number with its UNITS</text>
  <text x="58" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Say "I got this wrong" out loud once</text>
  <text x="58" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Have the file already open</text>
  <rect x="408" y="238" width="352" height="112" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="584" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">DO NOT</text>
  <text x="426" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Read your code out line by line</text>
  <text x="426" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Live-code anything. Anything.</text>
  <text x="426" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Say "it's basically 90% accurate"</text>
  <text x="426" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Apologise for your score</text>
  <text x="400" y="382" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Rehearse it out loud three times, to a real person, with a real timer.</text>
</svg>
