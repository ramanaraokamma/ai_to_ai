  <line x1="72" y1="106" x2="124" y2="106" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">2</text>
  <line x1="72" y1="132" x2="124" y2="132" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">3</text>
  <line x1="72" y1="158" x2="124" y2="158" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">4</text>
  <line x1="72" y1="184" x2="124" y2="184" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="206" x2="92" y2="232" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(92 232) rotate(90.0)"/>
  <text x="92" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">done in order,</text>
  <text x="92" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">top to bottom</text>
  <text x="92" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">program</text>
  <rect x="192" y="96" width="44" height="60" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="214" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">.py</text>
  <line x1="238" y1="126" x2="252" y2="126" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(252 126) rotate(0.0)"/>
  <rect x="254" y="100" width="50" height="52" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
