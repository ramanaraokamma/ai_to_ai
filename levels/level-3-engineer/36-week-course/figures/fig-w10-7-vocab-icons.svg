<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four words from Week 10, drawn</title>
  <desc>Four labelled tiles. Decision threshold: the default 0.5 shown against the highest probability the fraud model ever gave, 0.1774, with a red band reading above 0.5 there are 0 rows out of 1000, so the default flags nothing. True positive rate and false positive rate: the same threshold 0.10 measured two ways, 3 divided by 14 equals 0.2143 caught and 5 divided by 986 equals 0.0051 bothered, with a note that the two denominators are 14 and 986. ROC curve: three dots from the same model at thresholds 0.12, 0.10 and 0.02, at false positive rate 0.0000, 0.0051 and 0.2140 and true positive rate 0.1429, 0.2143 and 0.3571, with the area under them 0.6116 against a coin's 0.5000. Precision-recall curve and average precision: precision collapsing from 3 divided by 8 equals 0.3750 to 5 divided by 216 equals 0.0231, with average precision 0.2078 beside a coin's 0.0140, the fraud rate.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four words from Week 10, drawn</text>
  <rect x="30" y="66" width="359" height="138" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">decision threshold</text>
  <text x="44" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">the default in the box:  0.5</text>
  <text x="44" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">the highest score we ever got:  0.1774</text>
  <rect x="44" y="150" width="331" height="30" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="209" y="165" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">above 0.5:  0 rows out of 1000</text>
  <text x="44" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">a default, not a law. Nobody chose it.</text>
  <rect x="401" y="66" width="369" height="138" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="415" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">true &amp; false positive rate</text>
  <text x="415" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">one threshold, t = 0.10, measured two ways</text>
  <rect x="415" y="128" width="170" height="34" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="500" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">3 &#247; 14 = 0.2143</text>
  <rect x="595" y="128" width="160" height="34" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="675" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">5 &#247; 986 = 0.0051</text>
  <text x="415" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">caught, out of 14</text>
  <text x="595" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">bothered, out of 986</text>
  <text x="415" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">two different denominators, and that is the week</text>
  <rect x="30" y="218" width="359" height="158" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">ROC curve</text>
  <text x="44" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">one model, three dots. Across, then up.</text>
  <text x="44" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">t 0.12   0.0000   0.1429</text>
  <text x="44" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">t 0.10   0.0051   0.2143</text>
  <text x="44" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B" text-anchor="start">t 0.02   0.2140   0.3571</text>
  <rect x="238" y="272" width="137" height="60" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="306" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.6116</text>
  <text x="306" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">a coin gets 0.5000</text>
  <text x="44" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">the area underneath is the whole curve, in one number</text>
  <rect x="401" y="218" width="369" height="158" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="415" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="start">precision-recall &amp; average precision</text>
  <text x="415" y="266" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">the same two thresholds, precision instead</text>
  <rect x="415" y="278" width="150" height="34" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="490" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">3 &#247; 8 = 0.3750</text>
  <text x="573" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">&#8594;</text>
  <rect x="585" y="278" width="170" height="34" rx="6" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="670" y="295" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">5 &#247; 216 = 0.0231</text>
  <text x="415" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="start">average precision 0.2078,  a coin gets 0.0140</text>
  <text x="415" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">0.0140 is the fraud rate, 14 &#247; 1000. Quote it too.</text>
</svg>
