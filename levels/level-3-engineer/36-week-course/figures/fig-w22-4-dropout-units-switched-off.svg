<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Dropout switches units off, one step at a time</title>
  <desc>The same row of ten hidden units drawn twice. On the left, during a training step, three of the ten are crossed out and their wires are dashed, because 0.3 times 10 equals 3. On the right, after model.eval(), all ten are on and every wire is solid. The caption says the real network has 64 units, so about 19 of them go off each step.</desc>
