<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five new words for Week 30</title>
  <desc>Five small icons in a row. Eight dots of which seven are ticked and one crossed, labelled accuracy, the fraction of guesses that were right. A three by three grid with the diagonal tinted, rows marked truth and columns marked guess, labelled confusion matrix. Two bars of wildly different heights becoming two equal bars, labelled feature scaling. A dashed arrow leaving the test pile and looping back into the train pile with a cross on it, labelled leakage. And two piles split into the same three coloured shares, labelled stratify.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five new words for Week 30</text>
  <rect x="64" y="106" width="96" height="60" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="80" cy="124" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <circle cx="104" cy="124" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <circle cx="128" cy="124" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <circle cx="152" cy="124" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <circle cx="80" cy="150" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <circle cx="104" cy="150" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <circle cx="128" cy="150" r="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <circle cx="152" cy="150" r="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <text x="112" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">7 of 8</text>
  <text x="112" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="middle">accuracy</text>
  <text x="112" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the fraction of</text>
  <text x="112" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">guesses that</text>
  <text x="112" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">were right</text>
  <rect x="220" y="108" width="22" height="22" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="1.5"/>
  <rect x="242" y="108" width="22" height="22" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="264" y="108" width="22" height="22" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="220" y="130" width="22" height="22" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="242" y="130" width="22" height="22" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="1.5"/>
  <rect x="264" y="130" width="22" height="22" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="220" y="152" width="22" height="22" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="242" y="152" width="22" height="22" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="264" y="152" width="22" height="22" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="1.5"/>
  <rect x="220" y="108" width="66" height="66" rx="8" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="253" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">guess</text>
  <text x="206" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 206 141)">truth</text>
  <text x="253" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1F6FB2" text-anchor="middle">confusion matrix</text>
  <text x="253" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">a grid saying what</text>
  <text x="253" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">got mistaken for</text>
  <text x="253" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">what</text>
  <rect x="372" y="154" width="18" height="14" rx="4" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <rect x="396" y="106" width="18" height="62" rx="4" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <line x1="424" y1="138" x2="452" y2="138" stroke="#14202B" stroke-width="3" stroke-linecap="round"/><polyline points="441.5,143.8 452,138 441.5,132.2" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="462" y="122" width="18" height="46" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="486" y="122" width="18" height="46" rx="4" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="438" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">same footing</text>
  <text x="438" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1B7A4B" text-anchor="middle">feature scaling</text>
  <text x="438" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">putting every column</text>
  <text x="438" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">on the same footing</text>
  <text x="438" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">before measuring</text>
  <rect x="552" y="110" width="80" height="34" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="592" y="127" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">train</text>
  <rect x="552" y="156" width="80" height="34" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="592" y="173" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">test</text>
  <polyline points="636,173 656,173 656,127 638,127" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
  <circle cx="662" cy="150" r="11" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><line x1="655" y1="143" x2="669" y2="157" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/><line x1="669" y1="143" x2="655" y2="157" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#CC2B1D" text-anchor="middle">leakage</text>
  <text x="600" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">test information</text>
  <text x="600" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">sneaking into how</text>
  <text x="600" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">you trained</text>
  <rect x="694" y="110" width="26" height="30" fill="#D9EAF9"/>
  <rect x="720" y="110" width="30" height="30" fill="#F4D5E9"/>
  <rect x="750" y="110" width="16" height="30" fill="#E8C671"/>
  <rect x="694" y="110" width="72" height="30" rx="8" fill="none" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="694" y="152" width="26" height="30" fill="#D9EAF9"/>
  <rect x="720" y="152" width="30" height="30" fill="#F4D5E9"/>
  <rect x="750" y="152" width="16" height="30" fill="#E8C671"/>
  <rect x="694" y="152" width="72" height="30" rx="8" fill="none" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="730" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">same shares</text>
  <text x="730" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#845F00" text-anchor="middle">stratify</text>
  <text x="730" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">keep the class mix</text>
  <text x="730" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">in both halves of</text>
  <text x="730" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the split</text>
  <text x="400" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Leakage is the only one of these five that has no error message. You catch it with the baseline.</text>
</svg>
