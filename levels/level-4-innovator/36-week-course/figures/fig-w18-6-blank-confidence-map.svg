<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank confidence map for Week 18: tick before the paper, shade the percent after, and circle at most two weeks</title>
  <desc>A blank form with eight rows for Weeks 10 to 17. Each row has three empty circles headed Yes, Maybe and No for the night before, an empty dashed bar for the percent earned after the paper, from 0 to 100 with a dashed vertical line at 60, and an empty dashed box headed circle. Nothing is filled in.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Confidence map: before and after the paper</text>
  <text x="40" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">week</text>
  <text x="170" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Yes</text>
  <text x="215" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Maybe</text>
  <text x="260" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">No</text>
