<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Count the possible outputs</title>
  <desc>Six systems listed with the outputs each one can produce, and two empty boxes beside each for the student to write how many outputs there are and whether the system is picking a label or generating.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="250" y="40" font-size="24" fill="#14202B" text-anchor="middle">Count the possible outputs</text>
    <text x="335" y="70" font-size="12" fill="#55636F" text-anchor="middle">how many?</text>
    <text x="420" y="70" font-size="12" fill="#55636F" text-anchor="middle">which kind?</text>

    <rect x="30" y="80" width="440" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="108" font-size="15" fill="#14202B">1. Email spam folder</text>
    <text x="46" y="132" font-size="12" fill="#55636F">outputs: spam, or not spam</text>
    <rect x="300" y="102" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <rect x="380" y="102" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>

    <rect x="30" y="168" width="440" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="196" font-size="15" fill="#14202B">2. Handwriting digit reader</text>
    <text x="46" y="220" font-size="12" fill="#55636F">outputs: the digits 0 to 9</text>
    <rect x="300" y="190" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <rect x="380" y="190" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>

    <rect x="30" y="256" width="440" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="284" font-size="15" fill="#14202B">3. Chatbot writing a bedtime story</text>
    <text x="46" y="308" font-size="12" fill="#55636F">outputs: any story at all</text>
    <rect x="300" y="278" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <rect x="380" y="278" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>

    <rect x="30" y="344" width="440" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="372" font-size="15" fill="#14202B">4. Photo app animal tagger</text>
    <text x="46" y="396" font-size="12" fill="#55636F">outputs: cat, dog, bird, horse, fish</text>
    <rect x="300" y="366" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <rect x="380" y="366" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>

    <rect x="30" y="432" width="440" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="460" font-size="15" fill="#14202B">5. AI image maker</text>
    <text x="46" y="484" font-size="12" fill="#55636F">outputs: any picture at all</text>
    <rect x="300" y="454" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <rect x="380" y="454" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>

    <rect x="30" y="520" width="440" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="46" y="548" font-size="15" fill="#14202B">6. School face-check register</text>
    <text x="46" y="572" font-size="12" fill="#55636F">outputs: present, or absent</text>
    <rect x="300" y="542" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
    <rect x="380" y="542" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>

    <text x="250" y="632" font-size="14" fill="#55636F" text-anchor="middle">Short fixed list means picking a label. A blank page means generating.</text>
    <text x="250" y="656" font-size="14" fill="#55636F" text-anchor="middle">Two of these six cannot be counted. Which two, and why?</text>
  </g>
</svg>
