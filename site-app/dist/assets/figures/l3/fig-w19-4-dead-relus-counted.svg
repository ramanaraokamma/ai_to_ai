<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Thirteen dead units out of sixteen, counted</title>
  <desc>A four by four grid of the sixteen hidden units after 500 epochs at learning rate 20. Thirteen cells are red with a cross, three are green with a tick, and 13 plus 3 is 16. A callout follows unit 0: its bias ended at minus 14.113, so z is below zero for all 200 rows, so the ReLU output is 0 and its slope is 0, and zero slope times any learning rate is zero change. A second panel compares test accuracy 0.9350 with all sixteen alive against 0.8100 with thirteen dead, and 0.8050 after 2000 further gentle epochs.</desc>
  <text x="400" y="46" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Thirteen dead units out of sixteen, counted</text>
  <text x="196" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">after 500 epochs at learning rate 20</text>
