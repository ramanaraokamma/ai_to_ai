<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 25</title>
  <desc>An empty framed drawing area headed draw one chart of your own and write all four words you type. A large blank chart box sits in the middle with an empty dashed strip above it for the title, an empty dashed strip below it for the x label and an empty dashed strip down its left side for the y label. Three reminder boxes underneath ask for the filename, how many markers there should be, and one thing the chart does not tell you.</desc>
  <rect x="24" y="24" width="752" height="272" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: one chart of your own, with all four words you type</text>

  <!-- title strip -->
  <rect x="200" y="80" width="440" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="190" y="93" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">title</text>

  <!-- y label strip, rotated -->
  <rect x="82" y="118" width="26" height="140" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="70" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 70 188)">y label + units</text>

  <!-- the blank plotting frame with a light grid to draw on -->
  <rect x="124" y="116" width="516" height="144" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="124" y1="152" x2="640" y2="152"/>
    <line x1="124" y1="188" x2="640" y2="188"/>
    <line x1="124" y1="224" x2="640" y2="224"/>
    <line x1="210" y1="116" x2="210" y2="260"/>
    <line x1="296" y1="116" x2="296" y2="260"/>
    <line x1="382" y1="116" x2="382" y2="260"/>
    <line x1="468" y1="116" x2="468" y2="260"/>
    <line x1="554" y1="116" x2="554" y2="260"/>
  </g>
  <line x1="140" y1="124" x2="140" y2="252" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="252" x2="628" y2="252" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="384" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C7CDD4" text-anchor="middle">your line goes here, with a dot on every point</text>

  <!-- x label strip -->
  <rect x="200" y="270" width="440" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="190" y="283" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">x label + units</text>

  <!-- reminder boxes -->
  <text x="60" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">my filename, ending .png</text>
  <rect x="60" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">how many markers?</text>
  <rect x="300" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">one thing it does NOT tell you</text>
  <rect x="540" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A title states the finding. An axis label states the units.</text>
</svg>
