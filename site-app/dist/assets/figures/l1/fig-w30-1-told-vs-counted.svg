<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two chatbots, two completely different insides</title>
  <desc>Two panels compared row by row. The rule-based bot got its knowledge from a person typing, can only say what was typed, admits when it does not know, and is fixed by editing a line. The learned bot got its knowledge by counting, can say new things, invents when it does not know, and is fixed by changing the data.</desc>
<text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two chatbots, two completely different insides</text>
<line x1="400" y1="64" x2="400" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="30" y="64" width="340" height="280" rx="12" fill="#F5F8FA" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
<rect x="430" y="64" width="340" height="280" rx="12" fill="#F5F8FA" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
<text x="200" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">RULE-BASED: a person typed it</text>
<text x="600" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">LEARNED: a machine counted it</text>
<g transform="translate(160,108) scale(0.8)"><path d="M12 12 H88 V68 L68 88 H12 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/><path d="M68 88 V68 H88 Z" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/><g stroke="#55636F" stroke-width="3" stroke-linecap="round"><line x1="24" y1="30" x2="76" y2="30"/><line x1="24" y1="43" x2="76" y2="43"/><line x1="24" y1="56" x2="60" y2="56"/></g></g>
<g transform="translate(560,108) scale(0.8)"><rect x="8" y="16" width="84" height="68" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><path d="M8 24 A8 8 0 0 1 16 16 H84 A8 8 0 0 1 92 24 V38 H8 Z" fill="#D9EAF9" stroke="none"/><g stroke="#C7CDD4" stroke-width="1.5"><line x1="8" y1="61" x2="92" y2="61"/><line x1="36" y1="38" x2="36" y2="84"/><line x1="64" y1="38" x2="64" y2="84"/></g><line x1="8" y1="38" x2="92" y2="38" stroke="#1F6FB2" stroke-width="3"/><rect x="8" y="16" width="84" height="68" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/></g>
<text x="50" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Knowledge came from</text>
<text x="360" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">you, typing</text>
<text x="450" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Knowledge came from</text>
<text x="760" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">counting examples</text>
<line x1="50" y1="220" x2="360" y2="220" stroke="#C7CDD4" stroke-width="1.5"/>
<line x1="450" y1="220" x2="760" y2="220" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="50" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">It can say</text>
<text x="360" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">only what you typed</text>
<text x="450" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">It can say</text>
<text x="760" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">things nobody wrote</text>
<line x1="50" y1="254" x2="360" y2="254" stroke="#C7CDD4" stroke-width="1.5"/>
<line x1="450" y1="254" x2="760" y2="254" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="50" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">When it does not know</text>
<text x="360" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">it says so</text>
<text x="450" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">When it does not know</text>
<text x="760" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">it invents</text>
<line x1="50" y1="288" x2="360" y2="288" stroke="#C7CDD4" stroke-width="1.5"/>
<line x1="450" y1="288" x2="760" y2="288" stroke="#C7CDD4" stroke-width="1.5"/>
<text x="50" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">To fix it</text>
<text x="360" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">edit one line</text>
<text x="450" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">To fix it</text>
<text x="760" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end">change the data, and hope</text>
<text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">From the outside they both just type back at you. Knowing which one you have changes how much you trust it.</text>
</svg>
