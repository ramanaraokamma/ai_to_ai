<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>A model can only use the examples as far as the task allows: accuracy tracks the ceiling and falls short at n = 4 and 5</title>
  <desc>Accuracy on 500 test prompts against the number of worked examples n from 0 to 6, seed 0. The dashed ceiling (n plus 1) over 6 reads 0.167, 0.333, 0.500, 0.667, 0.833, 1.000, 1.000. The model reads 0.176, 0.312, 0.480, 0.638, 0.666, 0.828, 0.998: within 0.03 of the ceiling for n 0 to 3, below it at n 4 and 5 where copying a shown key is right only 0.788 and 0.854 of the time.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Examples vs the ceiling</text>
  <line x1="78" y1="400" x2="426" y2="400" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="70" y="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.00</text>
  <line x1="78" y1="322.5" x2="426" y2="322.5" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="70" y="322.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.25</text>
  <line x1="78" y1="245" x2="426" y2="245" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="70" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.50</text>
  <line x1="78" y1="167.5" x2="426" y2="167.5" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="70" y="167.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.75</text>
  <line x1="78" y1="90" x2="426" y2="90" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="70" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">1.00</text>
  <text x="78" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="136" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="194" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="252" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <text x="310" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <text x="368" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <text x="426" y="418" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <text x="252" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">worked examples in the prompt, n</text>
  <text x="32" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 32 245)">accuracy on 500 test prompts</text>
  <polyline points="78,348.2 136,296.8 194,245 252,193.2 310,141.8 368,90 426,90" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <polyline points="78,345.4 136,303.3 194,251.2 252,202.2 310,193.5 368,143.3 426,90.6" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
