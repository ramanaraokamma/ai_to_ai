<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img">
  <title>329 leaves for 353 rows is a phone book</title>
  <desc>A block labelled 353 training rows with an arrow to a block labelled 329 leaves at depth 15, beside a note saying that is nearly one private leaf per row, a lookup table rather than a rule.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">329 leaves for 353 rows is a phone book</text>
  <rect x="60" y="90" width="130" height="120" rx="10" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="60" y1="110" x2="190" y2="110" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="60" y1="130" x2="190" y2="130" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="60" y1="150" x2="190" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="60" y1="170" x2="190" y2="170" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="60" y1="190" x2="190" y2="190" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="125" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">353</text>
  <text x="125" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">training rows</text>
  <line x1="206" y1="150" x2="268" y2="150" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(268 150) rotate(0)"/>
  <rect x="282" y="90" width="130" height="120" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="347" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">329</text>
  <text x="347" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">leaves at depth 15</text>
  <rect x="444" y="90" width="326" height="120" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="607" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Nearly one private leaf per row.</text>
  <text x="607" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">That is not a rule about patients.</text>
  <text x="607" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">It is a lookup table with their</text>
  <text x="607" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">names on it.</text>
  <text x="607" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">train R² 0.999</text>
</svg>
