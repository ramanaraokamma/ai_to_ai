<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two raters can agree a lot and still agree no more than luck</title>
  <desc>A two by two grid of 20 replies marked pass or fail by a strict rater H and a lenient rater J. Both pass 7, J pass and H fail 7, J fail and H pass 0, both fail 6. Three numbered steps: agreement (7 plus 6) over 20 is 0.65; agreement by luck 0.70 times 0.35 plus 0.30 times 0.65 is 0.44; kappa is 0.65 minus 0.44 over 1 minus 0.44, which is 0.375. A box notes that a judge who always says pass agrees 0.90 with a person passing 18 of 20 but has kappa 0. Numbers from p6_kappa.py and p7_constant.py, Week 30.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Agreement beyond luck: Cohen's kappa</text>
  <text x="260" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">H (strict) says</text>
  <text x="205" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">pass</text>
  <text x="315" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">fail</text>
  <text x="140" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">J pass</text>
  <text x="140" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="end" dominant-baseline="central">J fail</text>
  <rect x="150" y="120" width="110" height="70" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="162.4,138 166.4,142.4 174.4,133.2" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="205" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
  <rect x="260" y="120" width="110" height="70" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <polyline points="272,132 284,144" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="272,144 284,132" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="315" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
  <rect x="150" y="190" width="110" height="70" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2"/>
  <polyline points="162,202 174,214" fill="none" stroke="#55636F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="162,214 174,202" fill="none" stroke="#55636F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="205" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="260" y="190" width="110" height="70" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="272.4,208 276.4,212.4 284.4,203.2" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="315" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="260" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">20 replies; green = they agree</text>
  <text x="260" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the empty cell: J never fails what H passes</text>
  <rect x="420" y="82" width="360" height="54" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="442" cy="109" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="442" y="109" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="464" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">they agreed</text>
  <text x="464" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">(7 + 6) &#247; 20 = 0.65</text>
  <rect x="420" y="142" width="360" height="54" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="442" cy="169" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="442" y="169" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="464" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">luck alone would agree</text>
  <text x="464" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">0.70 &#215; 0.35 + 0.30 &#215; 0.65 = 0.44</text>
  <rect x="420" y="202" width="360" height="54" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="442" cy="229" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="442" y="229" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="464" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">kappa, the part above luck</text>
  <text x="464" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">(0.65 &#8722; 0.44) &#247; (1 &#8722; 0.44) = 0.375</text>
  <rect x="420" y="268" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
  <text x="432" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">a judge that says pass to everything</text>
  <text x="432" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">agrees 18 &#247; 20 = 0.90, kappa = 0.0</text>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The same 20 replies: raw agreement 0.65, kappa 0.375.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A judge that never looks scores 0.90 agreement and kappa 0.</text>
</svg>
