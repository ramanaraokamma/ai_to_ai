<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The average hides somebody</title>
  <desc>A bar chart of how many words a voice assistant gets wrong for three groups. Adults with a standard accent 5 percent, adults with a regional accent 14 percent, children under twelve 31 percent. A box above states the headline for the whole crowd is 93 percent of words correct.</desc>
  <text x="250" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The average hides somebody</text>
  <rect x="95" y="48" width="310" height="34" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2"/>
  <text x="250" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Headline: 93% of words correct</text>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="110" y1="400" x2="460" y2="400"/>
    <line x1="110" y1="322.5" x2="460" y2="322.5"/>
    <line x1="110" y1="245" x2="460" y2="245"/>
    <line x1="110" y1="167.5" x2="460" y2="167.5"/>
    <line x1="110" y1="90" x2="460" y2="90"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">
    <text x="100" y="404">0</text>
    <text x="100" y="326.5">10</text>
    <text x="100" y="249">20</text>
    <text x="100" y="171.5">30</text>
    <text x="100" y="94">40</text>
  </g>
  <rect x="140" y="361.3" width="64" height="38.7" fill="#CC2B1D"/>
  <rect x="250" y="291.5" width="64" height="108.5" fill="#CC2B1D"/>
  <rect x="360" y="159.8" width="64" height="240.2" fill="#CC2B1D"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="172" y="350">5%</text>
    <text x="282" y="280">14%</text>
    <text x="392" y="148">31%</text>
  </g>
  <line x1="110" y1="400" x2="460" y2="400" stroke="#14202B" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="172" y="420">Adults,</text>
    <text x="172" y="436">standard accent</text>
    <text x="172" y="456">8,500 recordings</text>
    <text x="282" y="420">Adults,</text>
    <text x="282" y="436">regional accent</text>
    <text x="282" y="456">1,200 recordings</text>
    <text x="392" y="420">Children</text>
    <text x="392" y="436">under 12</text>
    <text x="392" y="456">300 recordings</text>
  </g>
  <text x="60" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 60 245)">Words it gets WRONG (%)</text>
  <text x="250" y="478" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Fewer recordings, more mistakes. Always ask: 93% — for whom?</text>
</svg>
