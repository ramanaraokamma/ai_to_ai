  <rect x="306" y="152" width="64" height="24" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="338" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">pizza</text>
  <rect x="370" y="152" width="46" height="24" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="393" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">df 3</text>
  <rect x="416" y="152" width="78" height="24" fill="#E8C671" stroke="#845F00" stroke-width="1.5"/>
  <text x="455" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.2231</text>
