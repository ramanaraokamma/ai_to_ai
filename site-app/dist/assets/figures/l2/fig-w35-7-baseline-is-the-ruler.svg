<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The baseline is the ruler every score is measured against</title>
  <desc>A horizontal error scale in minutes running from zero to nine. A marker at 7.98 minutes is labelled always guess the average and a marker at 2.35 minutes is labelled tree depth 4. The bracket between them is labelled 5.63 minutes of accuracy bought by the model.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The baseline is the ruler</text>
  <rect x="20" y="66" width="760" height="288" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="70" y1="250" x2="730" y2="250" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <line x1="70.0" y1="250" x2="70.0" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="70.0" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="143.33333333333331" y1="250" x2="143.33333333333331" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="143.33333333333331" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="216.66666666666666" y1="250" x2="216.66666666666666" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="216.66666666666666" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <line x1="290.0" y1="250" x2="290.0" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="290.0" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <line x1="363.3333333333333" y1="250" x2="363.3333333333333" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="363.3333333333333" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4</text>
  <line x1="436.66666666666663" y1="250" x2="436.66666666666663" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="436.66666666666663" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">5</text>
  <line x1="510.0" y1="250" x2="510.0" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="510.0" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">6</text>
  <line x1="583.3333333333333" y1="250" x2="583.3333333333333" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="583.3333333333333" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">7</text>
  <line x1="656.6666666666666" y1="250" x2="656.6666666666666" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="656.6666666666666" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8</text>
  <line x1="730.0" y1="250" x2="730.0" y2="258" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="730.0" y="276" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">9</text>
  <text x="400" y="300" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">average error on the 26 held-out rows (minutes) — lower is better</text>
  <text x="400" y="328" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">perfect is 0 on the left. Doing nothing at all is 7.98 on the right.</text>
  <rect x="571.2" y="96" width="168" height="52" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="655.2" y="116" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">baseline</text>
  <text x="655.2" y="136" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">7.98 min</text>
  <line x1="655.2" y1="148" x2="655.2" y2="244" stroke="#CC2B1D" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <rect x="158.33333333333334" y="96" width="168" height="52" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="242.33333333333334" y="116" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">tree depth=4</text>
  <text x="242.33333333333334" y="136" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.35 min</text>
  <line x1="242.33333333333334" y1="148" x2="242.33333333333334" y2="244" stroke="#1B7A4B" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <path d="M242 196 V186 H655 V196" fill="none" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="448.7666666666667" y="176" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">the model buys me 5.63 minutes</text>
  <text x="400" y="384" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Without the baseline, is 2.35 good? You cannot possibly know.</text>
</svg>
