<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Shrinking the batch broke batch norm and left layer norm and no norm alone</title>
  <desc>Grouped bars of validation accuracy after 10 epochs, seed 0, for no norm, batch norm and layer norm. Batch size 64: 98.3, 96.9, 97.8. Batch size 16: 96.9, 98.6, 98.3. Batch size 4: 96.4, 63.3, 98.3. Batch size 2: 97.8, 46.9, 97.2. A dotted line marks the coin, 46.9 percent, which the batch norm bar at batch size 2 sits on.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Batch norm is the one that fails at batch size 2</text>
  <line x1="100" y1="316" x2="780" y2="316" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="92" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0%</text>
  <line x1="100" y1="104" x2="780" y2="104" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="92" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100%</text>
  <line x1="100" y1="216.6" x2="780" y2="216.6" stroke="#55636F" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="92" y="210.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">coin</text>
  <rect x="100" y="62" width="556" height="24" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <rect x="110" y="68" width="22" height="12" rx="2" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <text x="138" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">no norm</text>
  <rect x="222" y="68" width="22" height="12" rx="2" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="250" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">batch norm</text>
  <rect x="352" y="68" width="22" height="12" rx="2" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="380" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="start">layer norm</text>
  <text x="648" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">seed 0, 10 epochs</text>
  <rect x="116" y="107.6" width="44" height="208.4" rx="2" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/>
