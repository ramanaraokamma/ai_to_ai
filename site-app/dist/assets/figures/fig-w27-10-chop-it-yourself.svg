<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Chop it yourself</title>
  <desc>A worksheet. The sentence Pi is about 3.14, isn’t it? sits above eight empty numbered token boxes and blanks for the total and unique counts. Four tricky bits - Pi, 3.14, the comma and isn’t - each have blanks for which rule applies and how many tokens they make. A blank rules box sits at the bottom.</desc>
