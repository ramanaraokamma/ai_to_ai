<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Splitting after training versus splitting before</title>
  <desc>Two panels. The left panel, marked wrong, trains on all thirty cards and then picks six of them as a test set. The right panel, marked correct, splits first into twenty-four and six, seals the six, and only then trains.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">Splitting after training versus splitting before</text>

    <line x1="400" y1="66" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <rect x="30" y="66" width="340" height="270" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(48,80) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <text x="106" y="106" font-size="18" fill="#14202B">WRONG</text>
    <g font-size="18" fill="#14202B">
      <text x="52" y="152">1. Train on all 30</text>
      <text x="52" y="188">2. Pick any 6</text>
      <text x="52" y="224">3. Call them "the test"</text>
    </g>
    <rect x="52" y="244" width="296" height="72" rx="10" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="200" y="270" font-size="14" fill="#14202B" text-anchor="middle">The model already studied all six.</text>
    <text x="200" y="298" font-size="14" fill="#CC2B1D" text-anchor="middle">Score is near 100% and means nothing.</text>

    <rect x="430" y="66" width="340" height="270" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(448,80) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="506" y="106" font-size="18" fill="#14202B">RIGHT</text>
    <g font-size="18" fill="#14202B">
      <text x="452" y="152">1. Split 24 / 6 first</text>
      <text x="452" y="188">2. Seal the 6 away</text>
      <text x="452" y="224">3. Train on the 24 only</text>
    </g>
    <rect x="452" y="244" width="296" height="72" rx="10" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="600" y="270" font-size="14" fill="#14202B" text-anchor="middle">The six are genuinely new to the model.</text>
    <text x="600" y="298" font-size="14" fill="#1B7A4B" text-anchor="middle">Whatever score you get, you can believe it.</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Same 30 cards, same 24/6 counts. Only the order of the steps changed.</text>
  </g>
</svg>
