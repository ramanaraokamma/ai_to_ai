<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Fraction to decimal to percentage conversion strip</title>
  <desc>A four column table with three worked rows. Three quarters becomes zero point seven five and seventy-five percent. Thirteen twentieths becomes zero point six five and sixty-five percent. Five sixths becomes zero point eight three three three and eighty-three point three percent. The last column shows the division for each.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="32" font-size="24" fill="#14202B" text-anchor="middle">Same fact, three costumes</text>

    <g stroke="#C42B8C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 66 H255"/><polyline points="247,60 258,66 247,72"/>
      <path d="M330 66 H435"/><polyline points="427,60 438,66 427,72"/>
    </g>
    <text x="202" y="58" font-size="12" fill="#55636F" text-anchor="middle">do the division</text>
    <text x="382" y="58" font-size="12" fill="#55636F" text-anchor="middle">multiply by 100</text>

    <rect x="40" y="78" width="720" height="42" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#1F6FB2" stroke-width="3">
      <line x1="40" y1="120" x2="760" y2="120"/>
    </g>
    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="40" y1="180" x2="760" y2="180"/>
      <line x1="40" y1="240" x2="760" y2="240"/>
      <line x1="200" y1="78" x2="200" y2="300"/>
      <line x1="340" y1="78" x2="340" y2="300"/>
      <line x1="500" y1="78" x2="500" y2="300"/>
    </g>
    <rect x="40" y="78" width="720" height="222" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>

    <g font-size="18" fill="#14202B" text-anchor="middle">
      <text x="120" y="106">FRACTION</text>
      <text x="270" y="106">DECIMAL</text>
      <text x="420" y="106">PERCENTAGE</text>
      <text x="630" y="106">the division</text>
    </g>

    <g font-size="18" fill="#14202B" text-anchor="middle">
      <text x="120" y="156">3 / 4</text><text x="270" y="156">0.75</text><text x="420" y="156">75.0%</text>
      <text x="120" y="216">13 / 20</text><text x="270" y="216">0.65</text><text x="420" y="216">65.0%</text>
      <text x="120" y="276">5 / 6</text><text x="270" y="276">0.8333</text><text x="420" y="276">83.3%</text>
    </g>

    <g font-size="14" fill="#55636F">
      <text x="516" y="156">4 x 0.75 = 3 exactly</text>
      <text x="516" y="206">20 x 0.6 = 12, 1 left;</text>
      <text x="516" y="226">1 / 20 = 0.05</text>
      <text x="516" y="266">6 x 0.8 = 4.8, 0.2 left;</text>
      <text x="516" y="286">0.2 / 6 = 0.0333</text>
    </g>

    <text x="400" y="336" font-size="18" fill="#14202B" text-anchor="middle">Write the fraction FIRST, every time. It is the only one that says how many tries there were.</text>
    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">75% out of 4 and 75% out of 400 are the same percentage and very different evidence.</text>
  </g>
</svg>
