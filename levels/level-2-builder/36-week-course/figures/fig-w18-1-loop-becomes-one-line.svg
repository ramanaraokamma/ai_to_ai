<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Four lines become one, and the answer does not move</title>
  <desc>Two mirrored panels over the same six scores. The left panel shows a loop drawn as a circular arrow going round six times with an empty basket filling up one number at a time. The right panel shows a single sign reading times two held over the whole block of six cells at once. Underneath, both panels print the identical six results and a tick marks that the two lists are equal.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Four lines become one. The answer does not move.</text>
  <line x1="400" y1="74" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <rect x="28" y="74" width="358" height="252" rx="12" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="414" y="74" width="358" height="252" rx="12" fill="none" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="207" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the loop: six trips</text>
  <text x="593" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">the one line: no trips</text>
  <path d="M124 122 A44 44 0 1 1 80 122" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(80 122) rotate(-30)"/>
  <circle cx="102" cy="160" r="26" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
  <text x="102" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" dominant-baseline="central">trip</text>
  <text x="102" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="102" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">of 6</text>
  <path d="M186 132 H310 L298 214 H198 Z" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="196" y="176" width="32" height="30" rx="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="212" y="191" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">96</text>
  <rect x="232" y="176" width="32" height="30" rx="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="248" y="191" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">24</text>
  <rect x="268" y="176" width="32" height="30" rx="5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="284" y="191" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">154</text>
  <rect x="304" y="176" width="32" height="30" rx="5" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4"/>
  <text x="248" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one number added per trip</text>
  <text x="207" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">four lines of code</text>
  <text x="207" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">an empty list, a loop, an append,</text>
  <text x="207" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and the list at the end</text>
  <text x="207" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">four places to make a mistake</text>
  <rect x="452" y="176" width="48" height="44" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="476" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">48</text>
  <rect x="500" y="176" width="48" height="44" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="524" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
  <rect x="548" y="176" width="48" height="44" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="572" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">77</text>
  <rect x="596" y="176" width="48" height="44" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="620" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="644" y="176" width="48" height="44" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="668" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">63</text>
  <rect x="692" y="176" width="48" height="44" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="716" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">30</text>
  <rect x="452" y="176" width="288" height="44" fill="none" stroke="#1F6FB2" stroke-width="3"/>
  <rect x="524" y="124" width="144" height="34" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="596" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">x 2</text>
  <line x1="596" y1="160" x2="596" y2="172" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(596 172) rotate(90.0)"/>
  <text x="596" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one sign, held over all six</text>
  <text x="593" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">one line of code</text>
  <text x="593" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the whole formula, written once,</text>
  <text x="593" y="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">applied to every cell at the same time</text>
  <text x="593" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">one place to make a mistake</text>
  <g transform="translate(376,340) scale(0.3)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Both give 96 24 154 10 126 60. Not nearly. Exactly.</text>
  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The one line is shorter, faster, and has three fewer places to get it wrong.</text>
</svg>
