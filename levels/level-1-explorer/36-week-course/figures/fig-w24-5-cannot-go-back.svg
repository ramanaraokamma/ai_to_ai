<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Why you cannot get the big picture back</title>
  <desc>One pixel holding 80 on the left. An arrow pointing back to three completely different two by two blocks, all of which average to 80. The backwards arrow is crossed out.</desc>
<text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Why "enhance it!" is not a real thing</text><rect x="52" y="142" width="88" height="88" fill="#5E666E" stroke="#C7CDD4" stroke-width="1"/>
<text x="96.0" y="192.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">80</text>
<rect x="52" y="142" width="88" height="88" fill="none" stroke="#14202B" stroke-width="3"/>
<text x="96" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the shrunk pixel</text><text x="96" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">says 80</text><line x1="300" y1="186" x2="172" y2="186" stroke="#55636F" stroke-width="3" stroke-linecap="round"/>
<polyline points="186,176 172,186 186,196" fill="none" stroke="#55636F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="225.6" y1="175.6" x2="246.4" y2="196.4"/><line x1="246.4" y1="175.6" x2="225.6" y2="196.4"/></g><text x="236" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">which block?</text><rect x="330" y="142" width="60" height="60" fill="#8A9095" stroke="#C7CDD4" stroke-width="1"/>
<text x="360.0" y="176.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">128</text>
<rect x="390" y="142" width="60" height="60" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/>
<text x="420.0" y="176.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">0</text>
<rect x="330" y="202" width="60" height="60" fill="#C5C8CB" stroke="#C7CDD4" stroke-width="1"/>
<text x="360.0" y="236.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">192</text>
<rect x="390" y="202" width="60" height="60" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/>
<text x="420.0" y="236.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">0</text>
<rect x="330" y="142" width="120" height="120" fill="none" stroke="#14202B" stroke-width="3"/>
<text x="390" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(128+0+192+0)/4</text><text x="390" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">= 320 / 4 = 80</text><rect x="482" y="142" width="60" height="60" fill="#5E666E" stroke="#C7CDD4" stroke-width="1"/>
<text x="512.0" y="176.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">80</text>
<rect x="542" y="142" width="60" height="60" fill="#5E666E" stroke="#C7CDD4" stroke-width="1"/>
<text x="572.0" y="176.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">80</text>
<rect x="482" y="202" width="60" height="60" fill="#5E666E" stroke="#C7CDD4" stroke-width="1"/>
<text x="512.0" y="236.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">80</text>
<rect x="542" y="202" width="60" height="60" fill="#5E666E" stroke="#C7CDD4" stroke-width="1"/>
<text x="572.0" y="236.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">80</text>
<rect x="482" y="142" width="120" height="120" fill="none" stroke="#14202B" stroke-width="3"/>
<text x="542" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(80+80+80+80)/4</text><text x="542" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">= 320 / 4 = 80</text><rect x="634" y="142" width="60" height="60" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/>
<text x="664.0" y="176.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">0</text>
<rect x="694" y="142" width="60" height="60" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/>
<text x="724.0" y="176.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">0</text>
<rect x="634" y="202" width="60" height="60" fill="#505961" stroke="#C7CDD4" stroke-width="1"/>
<text x="664.0" y="236.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">65</text>
<rect x="694" y="202" width="60" height="60" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/>
<text x="724.0" y="236.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">255</text>
<rect x="634" y="142" width="120" height="120" fill="none" stroke="#14202B" stroke-width="3"/>
<text x="694" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(0+0+65+255)/4</text><text x="694" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">= 320 / 4 = 80</text><text x="400" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">any one of these could have made it</text><text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">All three average to exactly 80. The shrunk picture cannot tell you which one it was,</text><text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">because that information was thrown away, not hidden.</text></svg>
