<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw it: one photo, nine things given away</title>
  <desc>An empty dashed frame for the student to draw in, with a blank caption line underneath.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Draw it: one photo, nine things given away</text>
  <rect x="40" y="60" width="720" height="266" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="9 7"/>
  <text x="400" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C7CDD4" text-anchor="middle">your drawing goes here</text>
  <text x="44" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">Caption:</text>
  <line x1="118" y1="360" x2="760" y2="360" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
