<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>What the model was really looking at</title>
  <desc>Two panels. On the left a spoon sits on a wooden table, the model reads spoon 95 percent and a dashed pink ring shows that the model is attending to the table, not the spoon. On the right the same spoon is held over a white sink, the table is gone, and the model reads toothbrush 39 percent and is wrong.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="44" font-size="24" fill="#14202B" text-anchor="middle">What the model was really looking at</text>

    <rect x="40" y="78" width="330" height="252" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="118" font-size="18" fill="#14202B">spoon 95%</text>
    <text x="60" y="142" font-size="14" fill="#55636F">on the wooden table it trained on</text>
    <g transform="translate(300,92) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="60" y="200" width="290" height="70" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#845F00" stroke-width="2" stroke-linecap="round">
      <line x1="76" y1="218" x2="334" y2="218"/>
      <line x1="76" y1="238" x2="334" y2="238"/>
      <line x1="76" y1="256" x2="334" y2="256"/>
    </g>
    <ellipse cx="180" cy="150" rx="20" ry="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <line x1="180" y1="178" x2="180" y2="206" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="205" cy="235" rx="140" ry="36" fill="none" stroke="#C42B8C" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="205" y="300" font-size="14" fill="#14202B" text-anchor="middle">the model is looking HERE</text>

    <rect x="430" y="78" width="330" height="252" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="450" y="118" font-size="18" fill="#14202B">toothbrush 39%</text>
    <text x="450" y="142" font-size="14" fill="#55636F">same spoon, two metres away</text>
    <g transform="translate(690,92) scale(0.4)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <path d="M640 212 V182 H676 V200" fill="none" stroke="#55636F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M452 212 H738 L714 274 H476 Z" fill="#FFFFFF" stroke="#55636F" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="560" cy="152" rx="20" ry="28" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
    <line x1="560" y1="180" x2="560" y2="208" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/>
    <text x="595" y="300" font-size="14" fill="#14202B" text-anchor="middle">the brown table is gone, so is the evidence</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">Same object. Same model. The only change was the background.</text>
  </g>
</svg>
