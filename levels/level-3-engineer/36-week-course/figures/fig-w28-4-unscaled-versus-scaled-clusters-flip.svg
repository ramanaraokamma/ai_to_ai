<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same three customers, two different rulers</title>
  <desc>Two panels. On the left, raw numbers: the squared distance from P1 to P2 is 900 and from P1 to P3 is 400,000,000, so raw distance says P1 and P2 are 444,444 times more alike, and the age column has effectively been deleted. On the right, after standardising, both squared distances are exactly 4.5, which is the honest answer because each pair differs by the same amount in one column and not at all in the other.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Distance depends entirely on the ruler.</text>
  <rect x="34" y="66" width="356" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="212" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">RAW numbers</text>
  <text x="212" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">age in years, income in rupees</text>
  <text x="52" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P1 = (25, 500000)</text>
  <text x="52" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P2 = (55, 500000)</text>
  <text x="52" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P3 = (25, 520000)</text>
  <line x1="50.00" y1="200.00" x2="374.00" y2="200.00" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="52" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P1 to P2:  900 + 0 = 900</text>
  <text x="52" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P1 to P3:  0 + 400000000</text>
  <text x="52" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CC2B1D">400000000 &#247; 900 = 444444</text>
  <text x="52" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">the age column is gone</text>
  <rect x="410" y="66" width="356" height="250" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="588" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">STANDARDISED</text>
  <text x="588" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">each column minus its mean, over its spread</text>
  <text x="428" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P1 = (&#8722;0.7071, &#8722;0.7071)</text>
  <text x="428" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P2 = ( 1.4142, &#8722;0.7071)</text>
  <text x="428" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P3 = (&#8722;0.7071,  1.4142)</text>
  <line x1="426.00" y1="200.00" x2="750.00" y2="200.00" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="428" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P1 to P2:  4.5 + 0 = 4.5</text>
  <text x="428" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">P1 to P3:  0 + 4.5 = 4.5</text>
  <text x="428" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1B7A4B">4.5 &#247; 4.5 = 1</text>
  <text x="428" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">equally alike &#8212; the honest answer</text>
  <text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">The spreads it divided by: 14.1421 years and 9428.0904 rupees.</text>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Nothing errored on the left. You just measured customers in rupees.</text>
</svg>
