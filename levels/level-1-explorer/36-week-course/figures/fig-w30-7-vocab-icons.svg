<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week’s three words</title>
  <desc>Three labelled panels: n-gram drawn as a row of n boxes ending in a question mark, trigram drawn as two words plus a guess, and fallback drawn as a small flowchart whose no branch leads to a fallback box.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week’s three words</text>
  <rect x="26" y="68" width="236" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="282" y="68" width="236" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="538" y="68" width="236" height="254" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="48" y="124" width="42" height="42" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="69" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">w</text>
  <rect x="96" y="124" width="42" height="42" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="117" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">w</text>
  <rect x="144" y="124" width="42" height="42" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="165" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">w</text>
  <rect x="192" y="124" width="42" height="42" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="213" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">?</text>
  <path d="M48 178 V190 H240 V178" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <text x="144" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">n boxes in a row</text>
  <text x="144" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">n-gram</text>
  <text x="144" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">n tokens in a row.  A bigram</text>
  <text x="144" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">is 2. A trigram is 3.</text>
  <rect x="312" y="124" width="52" height="42" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="338" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">bus</text>
  <rect x="372" y="124" width="52" height="42" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="398" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">to</text>
  <rect x="432" y="124" width="52" height="42" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="458" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">?</text>
  <path d="M312 178 V190 H424 V178" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round"/>
  <text x="368" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">two words of memory</text>
  <text x="400" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">trigram</text>
  <text x="400" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">three tokens in a row, so it</text>
  <text x="400" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">remembers two words back</text>
  <rect x="600" y="104" width="112" height="34" rx="8" fill="#F5F8FA" stroke="#14202B" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="656" y="121" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">match?</text>
  <path d="M634 138 V152 H594 V166" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M678 138 V152 H718 V166" fill="none" stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="556" y="166" width="76" height="34" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="594" y="183" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">reply</text>
  <rect x="680" y="166" width="76" height="34" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="718" y="183" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">fallback</text>
  <text x="594" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">yes</text>
  <text x="718" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">no</text>
  <text x="656" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">the path nobody builds</text>
  <text x="656" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">fallback</text>
  <text x="656" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">what a rule bot says when</text>
  <text x="656" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">nothing in its list matches</text>
  <text x="400" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two of these are about memory. One is about honesty.</text>
</svg>
