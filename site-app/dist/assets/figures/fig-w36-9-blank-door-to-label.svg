<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Blank Level 1 to Level 2 door to label</title>
  <desc>A doorway with five empty boxes on the Level 1 side and five empty boxes on the Level 2 side, all blank for the student to fill in the matching pairs.</desc>
