<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two steps of k-means, with the counts</title>
  <desc>Three small panels showing the same six points three times. In round 0 two pink crosses are placed badly, both down in the bottom left, and the six points split 2 and 4. In round 1 the crosses have moved to the middle of what each collected. In round 2 nothing switched, so it has settled, still 2 and 4. A pink box works the move out: the x of centre two is 5 plus 6 plus 7 plus 8 divided by 4, which is 26 divided by 4 equals 6.50, and the y is 27 divided by 4 equals 6.75, then 29 divided by 4 equals 7.25. A green box gives the inertia of all six points as 6.6667.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two steps of k-means, with the counts</text>
  <rect x="30" y="120" width="138" height="138" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="99" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">round 0</text>
  <circle cx="54.6667" cy="220.667" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="67.3333" cy="233.333" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="105.333" cy="144.667" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="118" cy="157.333" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="130.667" cy="144.667" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="143.333" cy="170" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M47.6667 213.667 L61.6667 227.667" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M61.6667 213.667 L47.6667 227.667" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60.3333 201 L74.3333 215" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M74.3333 201 L60.3333 215" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="99" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">start &#183; centres put</text>
  <text x="99" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">sizes 2 &#183; 4</text>
  <rect x="188" y="120" width="138" height="138" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="257" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">round 1</text>
  <circle cx="212.667" cy="220.667" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="225.333" cy="233.333" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="263.333" cy="144.667" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="276" cy="157.333" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="288.667" cy="144.667" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="301.333" cy="170" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M212 220 L226 234" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 220 L212 234" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M275.333 153.5 L289.333 167.5" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M289.333 153.5 L275.333 167.5" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="257" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">after round 1</text>
  <text x="257" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">sizes 2 &#183; 4</text>
  <rect x="346" y="120" width="138" height="138" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="415" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">round 2</text>
  <circle cx="370.667" cy="220.667" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="383.333" cy="233.333" r="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <circle cx="421.333" cy="144.667" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="434" cy="157.333" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="446.667" cy="144.667" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <circle cx="459.333" cy="170" r="6" fill="#E8C671" stroke="#845F00" stroke-width="2"/>
  <path d="M370 220 L384 234" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M384 220 L370 234" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M433.333 147.167 L447.333 161.167" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M447.333 147.167 L433.333 161.167" fill="none" stroke="#C42B8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="415" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">settled &#183; nobody sw</text>
  <text x="415" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">sizes 2 &#183; 4</text>
  <rect x="514" y="96" width="262" height="128" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="530" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">moving centre 2, in full</text>
  <text x="530" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">x: (5+6+7+8) &#247; 4</text>
  <text x="530" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">   = 26 &#247; 4 = 6.50</text>
  <text x="530" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">y: 27 &#247; 4 = 6.75</text>
  <text x="530" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">then 29 &#247; 4 = 7.25</text>
  <rect x="514" y="240" width="262" height="72" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="530" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">inertia, all six points</text>
  <text x="530" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">= 6.6667</text>
  <text x="250" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The points never move. Only the crosses move.</text>
  <text x="250" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Two steps, repeated: assign, then average.</text>
</svg>
