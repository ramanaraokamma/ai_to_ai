<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>At a too-big rate a falling schedule rescued every seed; at the gentle rate the schedules did not separate</title>
  <desc>Two panels. A, learning rate 0.03, final validation accuracy over seeds 0 to 4: constant 46.9, 50.6, 53.1, 98.1, 97.2 (mean 69.2); warmup only 99.2, 67.5, 76.4, 98.1, 86.7 (mean 85.6); cosine only 98.9 five times (mean 98.9); warmup plus cosine 99.2 and 98.9 four times (mean 98.9). A dotted line marks the coin, 46.9. B, learning rate 0.003, mean final validation loss with lowest to highest bars: constant 0.039 (0.030 to 0.050), warmup only 0.043 (0.031 to 0.057), cosine only 0.035 (0.032 to 0.040), warmup plus cosine 0.037 (0.029 to 0.045).</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A falling rate rescued a bad rate, not a good one</text>
