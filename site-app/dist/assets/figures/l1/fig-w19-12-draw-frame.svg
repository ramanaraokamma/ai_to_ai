<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 19</title>
  <desc>An empty framed drawing area titled Draw your own split, divided into a wide left half labelled the pile the model may study and a narrow right half labelled the pile you seal away, with three reminder boxes underneath.</desc>
  <rect x="24" y="24" width="752" height="296" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA" stroke="none"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: your own split, from photos to sealed envelope</text>
  <line x1="576" y1="86" x2="576" y2="306" stroke="#C42B8C" stroke-width="3" stroke-dasharray="10 6" stroke-linecap="round"/>
  <text x="576" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">the split</text>
  <text x="300" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">the pile the model may study  (80%)</text>
  <text x="676" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">sealed away  (20%)</text>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="8 8">
    <rect x="56" y="148" width="488" height="146" rx="10" fill="none"/>
    <rect x="608" y="148" width="136" height="146" rx="10" fill="none"/>
  </g>
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="60" y="342" width="200" height="36" rx="8"/>
    <rect x="300" y="342" width="200" height="36" rx="8"/>
    <rect x="540" y="342" width="200" height="36" rx="8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="60" y="338">how many in each pile</text>
    <text x="300" y="338">your check line</text>
    <text x="540" y="338">the date it opens</text>
  </g>
</svg>
