<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One request in, one prediction out, one log line</title>
  <desc>A request travels left to right. curl sends POST slash predict with the body text colon delicious fresh pizza and kind friendly staff. Four checks run in order: is there a body, is it JSON, has it a text field, is that field a non-empty string. Only then is the Predictor touched &#8212; and the Predictor was loaded once at start-up, taking 772.2 milliseconds, not once per request. The reply is the contract: label positive, probability 0.7724, threshold 0.55, model_version sentiment_v1, latency_ms 3.27. The same five fields, plus input and input_chars, are appended as one line to logs slash predictions.jsonl. The first request took 3.27 milliseconds and the 110 after it averaged 0.2349, because the first one warmed the caches.</desc>

  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One request in, one prediction out, one log line</text>

  <!-- connectors first -->
  <line x1="152" y1="128" x2="196" y2="128" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="200,128 188,122 188,134" fill="#14202B"/>
  <line x1="352" y1="128" x2="396" y2="128" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="400,128 388,122 388,134" fill="#14202B"/>
  <line x1="540" y1="128" x2="584" y2="128" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="588,128 576,122 576,134" fill="#14202B"/>
  <line x1="470" y1="176" x2="470" y2="250" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
  <polygon points="470,254 464,242 476,242" fill="#C42B8C"/>

  <!-- curl -->
  <rect x="40" y="94" width="112" height="68" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="96" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">curl</text>
  <text x="96" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">POST /predict</text>
  <text x="96" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a person, or a loop</text>

  <!-- four checks -->
  <rect x="200" y="82" width="152" height="92" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="276" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">four checks</text>
  <text x="212" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">1 is there a body?</text>
  <text x="212" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">2 is it JSON?</text>
  <text x="212" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">3 has it "text"?</text>
  <text x="212" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">4 is it a string?</text>

  <!-- predictor -->
  <rect x="400" y="82" width="140" height="92" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="470" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">Predictor</text>
  <text x="470" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">loaded ONCE at</text>
  <text x="470" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">start-up: 772.2 ms</text>
  <text x="470" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">not once per request</text>

  <!-- response -->
  <rect x="588" y="72" width="172" height="112" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="674" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">200, the contract</text>
  <text x="600" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">label     positive</text>
  <text x="600" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">probability 0.7724</text>
  <text x="600" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">threshold     0.55</text>
  <text x="600" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">latency_ms    3.27</text>

  <!-- log -->
  <rect x="220" y="258" width="500" height="80" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="238" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">logs/predictions.jsonl  &#8212; one JSON object per line</text>
  <text x="238" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">{"model_version": "sentiment_v1", "label": "positive",</text>
  <text x="238" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B"> "probability": 0.7724, "latency_ms": 3.27, ...}</text>
  <text x="200" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">appended</text>

  <text x="40" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">This first request took <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3.27 ms</tspan>. The next 110 averaged <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0.2349 ms</tspan> &#8212; the first one warmed the caches.</text>
  <text x="40" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">The four checks come before the model, so garbage never reaches it.</text>
</svg>
