  <line x1="74" y1="264" x2="150" y2="264" stroke="#55636F" stroke-width="3" stroke-linecap="round"/>
  <text x="156" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">What you see</text>
