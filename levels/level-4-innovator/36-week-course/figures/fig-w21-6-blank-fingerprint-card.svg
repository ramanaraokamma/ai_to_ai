<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A blank grid for the Fingerprint card: tick which of eight lines md5 calls the same as line 1, as written and after strip, and which a human would call the same</title>
  <desc>A table of eight numbered lines of text taken from the card, such as the baker opened her door with a capital B, a space at the end, two spaces at the start or in the middle, and all capitals. Each row has three empty dashed tick boxes under the headings A, md5 says same as written; B, same after strip; and C, a human says same thing. Nothing is ticked.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The Fingerprint card: tick the matches</text>
  <text x="20" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start">line 1 is: the baker opened her door</text>
  <text x="500" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">A  md5 says same</text>
  <text x="500" y="95" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">as written</text>
  <text x="610" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">B  same after</text>
  <text x="610" y="95" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">.strip()</text>
  <text x="720" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">C  a human says</text>
  <text x="720" y="95" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">same thing</text>
