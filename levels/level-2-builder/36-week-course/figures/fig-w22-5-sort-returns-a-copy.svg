<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img">
  <title>Sorting hands you a new sheet. The old one never moves.</title>
  <desc>A one-column table of step counts in the order it was typed sits on the left, labelled week. An arrow leads into a purple copier labelled sort_values, and two arrows come out. The upper one reaches a second table with the same five step counts in increasing order, labelled by_steps and ticked; its row labels 2, 0, 3, 1, 4 travelled with the rows. The lower one reaches a red panel showing the copy crossed out and thrown away because nothing caught it, with a note that week still prints in its original order and nothing warns you.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Sorting hands you a new sheet. The old one never moves.</text>
  <text x="400" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The copier gives back both. Only one of them has a name on it.</text>
