<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Anatomy of a labelled example</title>
  <desc>One labelled example is drawn as two halves joined by a staple. The left half is the input, a text message. The right half is the answer tag reading spam. A note says both halves are required, and a second panel shows the input alone marked as not an example because it has no answer attached.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">One labelled example = input + answer, joined</text>

    <rect x="60" y="78" width="290" height="118" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="80" y="104" font-size="14" fill="#1F6FB2">THE INPUT — what you show it</text>
    <rect x="80" y="116" width="250" height="60" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
    <text x="96" y="142" font-size="14" fill="#14202B">&#8220;WIN a FREE phone now!!!&#8221;</text>
    <text x="96" y="164" font-size="12" fill="#55636F">one text message</text>

    <g stroke="#C42B8C" stroke-width="3" stroke-linecap="round">
      <line x1="358" y1="122" x2="386" y2="122"/>
      <line x1="358" y1="152" x2="386" y2="152"/>
    </g>
    <circle cx="372" cy="137" r="17" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
    <text x="372" y="138" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">join</text>

    <rect x="394" y="78" width="230" height="118" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="414" y="104" font-size="14" fill="#845F00">THE LABEL — the right answer</text>
    <rect x="414" y="116" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
    <text x="509" y="142" font-size="18" fill="#14202B" text-anchor="middle">spam</text>
    <text x="509" y="164" font-size="12" fill="#55636F" text-anchor="middle">a person wrote this</text>

    <g transform="translate(650,88) scale(0.9)">
      <g stroke="#845F00" stroke-width="3" stroke-linecap="round">
        <line x1="50" y1="8" x2="50" y2="2"/><line x1="22" y1="18" x2="17" y2="13"/>
        <line x1="78" y1="18" x2="83" y2="13"/><line x1="14" y1="44" x2="7" y2="44"/>
        <line x1="86" y1="44" x2="93" y2="44"/>
      </g>
      <circle cx="50" cy="44" r="26" fill="#E8C671" stroke="#845F00" stroke-width="3"/>
      <path d="M42 56 L45 66 L55 66 L58 56" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="41" y="66" width="18" height="10" rx="3" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
      <rect x="44" y="78" width="12" height="8" rx="3" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <rect x="60" y="214" width="564" height="40" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
    <text x="342" y="234" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">Both halves required. The label goes on BEFORE training, by a person.</text>

    <line x1="30" y1="278" x2="770" y2="278" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/>

    <rect x="60" y="296" width="290" height="70" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="80" y="322" font-size="14" fill="#14202B">&#8220;WIN a FREE phone now!!!&#8221;</text>
    <text x="80" y="346" font-size="14" fill="#CC2B1D">no answer attached</text>
    <g transform="translate(300,306) scale(0.5)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <text x="380" y="326" font-size="18" fill="#14202B">This is NOT an example.</text>
    <text x="380" y="352" font-size="14" fill="#55636F">It is just a message. Nothing can learn from it.</text>
  </g>
</svg>
