<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Subtract two percentages and you get points</title>
  <desc>On the left, ninety one point seven percent minus forty one point seven percent worked out as a written subtraction giving fifty. On the right, two verdict boxes: fifty point zero percentage points is marked correct, and fifty percent is marked wrong with the question fifty percent of what.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Subtract two percentages and you get POINTS</text>
  <rect x="40" y="82" width="330" height="220" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="205" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">best group minus worst group</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="end">
    <text x="250" y="164">91.7%</text>
    <text x="250" y="208">41.7%</text>
    <text x="250" y="262">50.0</text>
  </g>
  <text x="150" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B">&#8722;</text>
  <line x1="140" y1="226" x2="250" y2="226" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="270" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">what unit?</text>
  <rect x="430" y="82" width="330" height="98" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <g transform="translate(448,98) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="502" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">50.0 percentage points</text>
  <text x="502" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">A distance between two percentages.</text>
  <rect x="430" y="204" width="330" height="98" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <g transform="translate(448,220) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="502" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">50%</text>
  <text x="502" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">50% of what? There is no answer.</text>
  <text x="400" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Percent needs an &#8220;of what&#8221;. A gap does not have one, so a gap is measured in points.</text>
</svg>
