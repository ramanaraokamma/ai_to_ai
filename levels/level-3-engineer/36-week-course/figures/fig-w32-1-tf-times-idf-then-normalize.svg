<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>How often, times how rare, then shrink the row</title>
  <desc>Four numbered stages for one word, great, in one review, d3, which reads Great pizza, great service. Stage one counts it: great appears twice, so tf is 2. Stage two asks how rare it is: great is in 2 of the 4 reviews, so idf is the natural log of 5 divided by 3, plus 1, which is 0.510826 plus 1 equals 1.510826. Stage three multiplies: 2 times 1.510826 is 3.021651. Stage four shrinks the row to length 1 by dividing by 3.592917, giving 0.841002. The panel below shows where 3.592917 came from: the square root of 9.130376 plus 1.496080 plus 2.282594 is the square root of 12.909050, which is 3.592917. A tick notes that TfidfVectorizer prints 0.841002 too.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">How often, times how rare, then shrink the row</text>
  <rect x="24" y="92" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="44" cy="112" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/><text x="44" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="109" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2" text-anchor="middle">count it here</text>
  <text x="109" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">d3 = "Great pizza,</text>
  <text x="109" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">great service."</text>
  <text x="109" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">great appears</text>
  <text x="109" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">twice</text>
  <text x="109" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">tf = 2</text>
  <line x1="198" y1="187" x2="214" y2="187" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(214 187) rotate(0)"/>
  <rect x="218" y="92" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="238" cy="112" r="13" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/><text x="238" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="303" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6D28D9" text-anchor="middle">how rare is it</text>
  <text x="303" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">great is in 2 of</text>
  <text x="303" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the 4 reviews</text>
  <text x="303" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">ln(5 &#247; 3) + 1</text>
  <text x="303" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">= 0.510826 + 1</text>
  <text x="303" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">idf = 1.510826</text>
  <line x1="392" y1="187" x2="408" y2="187" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(408 187) rotate(0)"/>
  <rect x="412" y="92" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="432" cy="112" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="432" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="497" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">multiply them</text>
  <text x="497" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">tf &#215; idf</text>
  <text x="497" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2 &#215; 1.510826</text>
  <text x="497" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">= 3.021651</text>
  <line x1="586" y1="187" x2="602" y2="187" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(602 187) rotate(0)"/>
  <rect x="606" y="92" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="626" cy="112" r="13" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><text x="626" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="691" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B" text-anchor="middle">shrink the row to</text>
  <text x="691" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">length 1</text>
  <text x="691" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3.021651</text>
  <text x="691" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">&#247; 3.592917</text>
  <text x="691" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">= 0.841002</text>
  <rect x="24" y="296" width="752" height="54" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="40" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">where 3.592917 came from: the row of d3 holds 3.021651, 1.223144 and 1.510826</text>
  <text x="40" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">sqrt(9.130376 + 1.496080 + 2.282594) = sqrt(12.909050) = 3.592917</text>
  <g stroke="#1B7A4B" stroke-width="5" stroke-linecap="round" fill="none"><polyline points="40,370 46,377 57,361"/></g>
  <text x="72" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B">TfidfVectorizer prints 0.841002 for the same cell. Four decimal places, matched.</text>
</svg>
