<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Seven folds of paper</title>
  <desc>A table of paper folds. Zero folds is one layer and 0.1 millimetres thick; each fold doubles the layers, ending at seven folds, 128 layers and 12.8 millimetres. Beside it a single thin sheet is drawn above a thick wad of 128 layers, and the multiplication two times two seven times equals 128 is written underneath.</desc>
  <text x="250" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fold a page seven times</text>

  <rect x="40" y="80" width="260" height="306" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="40" y="80" width="260" height="34" rx="10" fill="#D9EAF9" stroke="none"/>
  <line x1="40" y1="114" x2="300" y2="114" stroke="#1F6FB2" stroke-width="3"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="130" y1="80" x2="130" y2="386"/>
    <line x1="220" y1="80" x2="220" y2="386"/>
    <line x1="40" y1="148" x2="300" y2="148"/>
    <line x1="40" y1="182" x2="300" y2="182"/>
    <line x1="40" y1="216" x2="300" y2="216"/>
    <line x1="40" y1="250" x2="300" y2="250"/>
    <line x1="40" y1="284" x2="300" y2="284"/>
    <line x1="40" y1="318" x2="300" y2="318"/>
    <line x1="40" y1="352" x2="300" y2="352"/>
  </g>
  <rect x="40" y="80" width="260" height="306" rx="10" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">
    <text x="85" y="102">folds</text>
    <text x="175" y="102">layers</text>
    <text x="260" y="102">thickness</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="85" y="136">0</text><text x="175" y="136">1</text><text x="260" y="136">0.1 mm</text>
    <text x="85" y="170">1</text><text x="175" y="170">2</text><text x="260" y="170">0.2 mm</text>
    <text x="85" y="204">2</text><text x="175" y="204">4</text><text x="260" y="204">0.4 mm</text>
    <text x="85" y="238">3</text><text x="175" y="238">8</text><text x="260" y="238">0.8 mm</text>
    <text x="85" y="272">4</text><text x="175" y="272">16</text><text x="260" y="272">1.6 mm</text>
    <text x="85" y="306">5</text><text x="175" y="306">32</text><text x="260" y="306">3.2 mm</text>
    <text x="85" y="340">6</text><text x="175" y="340">64</text><text x="260" y="340">6.4 mm</text>
    <text x="85" y="374">7</text><text x="175" y="374">128</text><text x="260" y="374">12.8 mm</text>
  </g>

  <text x="405" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one sheet = 0.1 mm</text>
  <line x1="340" y1="124" x2="470" y2="124" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>

  <rect x="340" y="200" width="130" height="100" rx="6" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="340" y1="212" x2="470" y2="212"/>
    <line x1="340" y1="224" x2="470" y2="224"/>
    <line x1="340" y1="236" x2="470" y2="236"/>
    <line x1="340" y1="248" x2="470" y2="248"/>
    <line x1="340" y1="260" x2="470" y2="260"/>
    <line x1="340" y1="272" x2="470" y2="272"/>
    <line x1="340" y1="288" x2="470" y2="288"/>
  </g>
  <text x="405" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">128 layers</text>
  <text x="405" y="346" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">12.8 mm thick</text>
  <text x="405" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">about a finger</text>

  <rect x="40" y="404" width="430" height="42" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="255" y="432" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2 x 2 x 2 x 2 x 2 x 2 x 2 = 128</text>

  <text x="250" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Seven folds. The same doubling as seven yes/no checks.</text>
</svg>
