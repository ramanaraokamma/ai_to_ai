<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The same six points, recoloured three times</title>
  <desc>Three panels of the same six points: three bunched at the bottom left, three at the top right. In panel one both centre markers sit in the left bunch and every point is hollow. In panel two two points are filled circles and four are triangles, a split of 2 and 4, because C measured 0 to the centre sitting on top of it. In panel three the split is 3 and 3 and the centres sit at 1.67 comma 2 and 8 comma 8. Below, the arithmetic that moved C back: 0.25 plus 2.25 is 2.50 to its own side against 20.25 plus 14.06 is 34.31 to the other.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The points never move. Their group does.</text>
