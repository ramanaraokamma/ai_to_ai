<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Counts you can draw from</title>
  <desc>An open paper bag holding six labelled slips: three saying cat, two saying dog and one saying mat, with the counts written underneath adding to six.</desc>
<text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Counts you can draw from</text>
<path d="M 120 130 L 140 100 H 360 L 380 130 V 372 A 20 20 0 0 1 360 392 H 140 A 20 20 0 0 1 120 372 Z" fill="#F5F8FA" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
<path d="M 120 130 H 380" fill="none" stroke="#845F00" stroke-width="3" stroke-linecap="round"/>
<g transform="rotate(-7 198 178)"><rect x="150" y="152" width="96" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><text x="198" y="179" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">cat</text></g>
<g transform="rotate(6 303 176)"><rect x="255" y="150" width="96" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><text x="303" y="177" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">cat</text></g>
<g transform="rotate(4 198 248)"><rect x="150" y="222" width="96" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/><text x="198" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">cat</text></g>
<g transform="rotate(-5 303 246)"><rect x="255" y="220" width="96" height="52" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/><text x="303" y="247" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">dog</text></g>
<g transform="rotate(-3 198 318)"><rect x="150" y="292" width="96" height="52" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/><text x="198" y="319" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">dog</text></g>
<g transform="rotate(7 303 316)"><rect x="255" y="290" width="96" height="52" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/><text x="303" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle" dominant-baseline="central">mat</text></g>
<text x="250" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">6 slips in the bag</text>
<rect x="110" y="408" width="280" height="34" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="160" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1F6FB2" text-anchor="middle" dominant-baseline="central">cat  3</text>
<text x="250" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#845F00" text-anchor="middle" dominant-baseline="central">dog  2</text>
<text x="340" y="426" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1B7A4B" text-anchor="middle" dominant-baseline="central">mat  1</text>
<text x="250" y="466" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">3 + 2 + 1 = 6.  Draw one, read it, PUT IT BACK.</text>
</svg>
