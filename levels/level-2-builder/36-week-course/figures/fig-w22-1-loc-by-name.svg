<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img">
  <title>loc reads the labels printed on the edges</title>
  <desc>A five-row table of step counts. A pink label on the left reads row named 1 and points at the row label 1; another above reads column named steps and points at the steps header. The cell where they meet is highlighted and its value, 11050, is pulled out into a green box.</desc>
