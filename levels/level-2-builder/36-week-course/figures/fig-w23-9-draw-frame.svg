<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 23</title>
  <desc>An empty framed drawing area headed draw one column twice, before and after the repair. Two blank six-cell columns sit side by side, each with an empty dashed badge above it for the kind of thing it holds and an empty dashed box beneath it for the number of holes found. An arrow between them is labelled to_numeric with errors set to coerce. Three reminder boxes underneath ask which cell became a hole, why the hole count went up, and the one sentence that explains it.</desc>
  <rect x="24" y="24" width="752" height="272" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: one column, twice &#8212; before the repair and after it</text>

  <text x="180" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">BEFORE</text>
  <text x="620" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">AFTER</text>

  <!-- the two dtype badges, blank -->
  <rect x="110" y="98" width="140" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="102" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">dtype</text>
  <rect x="550" y="98" width="140" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="542" y="111" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">dtype</text>

  <!-- BEFORE column: six blank cells -->
  <rect x="110" y="132" width="140" height="120" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="110" y1="152" x2="250" y2="152"/>
    <line x1="110" y1="172" x2="250" y2="172"/>
    <line x1="110" y1="192" x2="250" y2="192"/>
    <line x1="110" y1="212" x2="250" y2="212"/>
    <line x1="110" y1="232" x2="250" y2="232"/>
  </g>
  <text x="180" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">six cells &#8212;</text>
  <text x="180" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">one of them a WORD</text>

  <!-- the arrow between -->
  <line x1="270" y1="192" x2="524" y2="192" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(524 192)"/>
  <text x="397" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">to_numeric(errors="coerce")</text>
  <text x="397" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the word becomes a hole you can count</text>

  <!-- AFTER column: six blank cells -->
  <rect x="550" y="132" width="140" height="120" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="550" y1="152" x2="690" y2="152"/>
    <line x1="550" y1="172" x2="690" y2="172"/>
    <line x1="550" y1="192" x2="690" y2="192"/>
    <line x1="550" y1="212" x2="690" y2="212"/>
    <line x1="550" y1="232" x2="690" y2="232"/>
  </g>
  <text x="620" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">draw the hole EMPTY,</text>
  <text x="620" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">not as a 0</text>

  <!-- hole-count boxes -->
  <rect x="110" y="262" width="140" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="102" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">holes found</text>
  <rect x="550" y="262" width="140" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="542" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">holes found</text>

  <!-- reminder boxes -->
  <text x="60" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">which cell became a hole?</text>
  <rect x="60" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">did the hole count go up or down?</text>
  <rect x="300" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the one sentence that explains it</text>
  <rect x="540" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">The repair did not make the holes. It made them visible.</text>
</svg>
