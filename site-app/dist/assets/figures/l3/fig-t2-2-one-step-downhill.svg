<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One step downhill, with the arithmetic</title>
  <desc>The bowl-shaped curve loss equals w times w, with four marked points walking down its right arm at w equals 3.00, 2.40, 1.92 and 1.54. An arrow labelled step 1 points left from the first point to the second. A pink box prints step 1 in full: slope equals 2 times 3 equals 6, then w becomes 3 minus 0.1 times 6 equals 3 minus 0.6 equals 2.4, and the loss falls from 9.00 to 5.76. A small table lists three steps: w 3.00 slope 6.00 next 2.40; w 2.40 slope 4.80 next 1.92; w 1.92 slope 3.84 next 1.54.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One step downhill, with the arithmetic</text>
  <text x="400" y="74" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">loss = w &#215; w &#183; start at w = 3 &#183; learning rate 0.1</text>
  <line x1="70" y1="330" x2="450" y2="330" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="330" x2="70" y2="100" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
