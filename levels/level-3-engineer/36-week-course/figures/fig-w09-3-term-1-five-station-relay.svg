  <rect x="334" y="92" width="132" height="172" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="356" cy="116" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="356" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="378" y="121" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">Baseline</text>
  <text x="400" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">8 min</text>
  <text x="400" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">DummyClassifier,</text>
  <text x="400" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">most_frequent</text>
  <line x1="346" y1="210" x2="454" y2="210" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">hand over:</text>
  <text x="400" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the number to beat</text>
  <line x1="468" y1="178" x2="484" y2="178" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>
