<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One curve, three thresholds you could defend</title>
  <desc>An ROC curve drawn as a staircase from the twenty index cards, ten really fraud and ten really legitimate, with a dashed diagonal marking what a coin would get. Three points are ringed and numbered. Point 1 is threshold 0.90 at false positive rate 0.0 and true positive rate 0.2: 2 of 10 frauds caught, 0 false alarms, precision 2 divided by 2 is 1.00 and recall 2 divided by 10 is 0.20. Point 2 is threshold 0.60 at 0.2 and 0.8: 8 of 10 caught, 2 false alarms, precision 8 divided by 10 is 0.80 and recall 8 divided by 10 is 0.80. Point 3 is threshold 0.30 at 0.5 and 1.0: 10 of 10 caught, 5 false alarms, precision 10 divided by 15 is 0.67 and recall 10 divided by 10 is 1.00.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One curve, three thresholds you could defend</text>
  <polyline points="92,322 92,322 92,279.2 113.4,279.2 113.4,236.4 113.4,236.4 113.4,193.6 134.8,193.6 134.8,150.8 156.2,150.8 156.2,150.8 177.6,150.8 177.6,129.4 199,129.4 199,108 241.8,108 241.8,108 284.6,108 284.6,108 306,108 306,108" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="92" y1="92" x2="92" y2="322" stroke="#14202B" stroke-width="2"/>
  <line x1="92" y1="322" x2="320" y2="322" stroke="#14202B" stroke-width="2"/>
  <line x1="92" y1="322" x2="306" y2="108" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="92" y1="322" x2="92" y2="328" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="92" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="86" y1="322" x2="92" y2="322" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0</text>
  <line x1="199" y1="322" x2="199" y2="328" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="199" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0.5</text>
  <line x1="86" y1="215" x2="92" y2="215" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.5</text>
  <line x1="306" y1="322" x2="306" y2="328" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="306" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="86" y1="108" x2="92" y2="108" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">1</text>
  <text x="199" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">false positive rate</text>
  <text x="48" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 48 215)">true positive rate</text>
  <text x="220.4" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a coin gets</text>
  <text x="220.4" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">this line</text>
  <circle cx="92" cy="279.2" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="92" y="279.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <circle cx="134.8" cy="150.8" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="134.8" y="150.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <circle cx="199" cy="108" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="199" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="392" y="90" width="388" height="78" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="416" cy="114" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="416" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="436" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">t = 0.90</text>
  <text x="534" y="119" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">caught 2 of 10 &#183; 0 false alarms</text>
  <text x="404" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">precision 2 &#247; 2 = 1.00</text>
  <text x="604" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">recall 2 &#247; 10 = 0.20</text>
  <rect x="392" y="180" width="388" height="78" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="416" cy="204" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="416" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="436" y="209" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">t = 0.60</text>
  <text x="534" y="209" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">caught 8 of 10 &#183; 2 false alarms</text>
  <text x="404" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">precision 8 &#247; 10 = 0.80</text>
  <text x="604" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">recall 8 &#247; 10 = 0.80</text>
  <rect x="392" y="270" width="388" height="78" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="416" cy="294" r="11" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/><text x="416" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="436" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">t = 0.30</text>
  <text x="534" y="299" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">caught 10 of 10 &#183; 5 false alarms</text>
  <text x="404" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">precision 10 &#247; 15 = 0.67</text>
  <text x="604" y="328" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">recall 10 &#247; 10 = 1.00</text>
  <text x="586" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same cards, same model. Three different jobs.</text>
</svg>
