<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Zero missing does not mean nothing is missing</title>
  <desc>Two panels. On the left, marked wrong, the output of isna dot sum reports zero missing ages, and the reader concludes the age column is fine. On the right, marked correct, the same column is shown cell by cell: nine real ages and three cells holding the word unknown, with a note saying the word is perfectly good writing so nothing is empty, and info reporting the column as object where a number belongs.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">"Zero missing" does not mean nothing is missing</text>
  <line x1="400" y1="66" x2="400" y2="344" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>

  <rect x="24" y="66" width="352" height="278" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="424" y="66" width="352" height="278" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>

  <circle cx="56" cy="98" r="15" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2"/>
  <g stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"><line x1="51" y1="93" x2="61" y2="103"/><line x1="61" y1="93" x2="51" y2="103"/></g>
  <text x="80" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">"The ages are fine"</text>

  <circle cx="456" cy="98" r="15" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2"/>
  <polyline points="450,99 454,103 462,93" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">Three are hiding in a word</text>

  <!-- left: the isna printout -->
  <text x="48" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what you looked at</text>
  <rect x="48" y="140" width="304" height="112" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="64" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">raw.isna().sum()</text>
  <line x1="64" y1="170" x2="336" y2="170" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="64" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">name     0</text>
  <text x="64" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" font-weight="600">age      0</text>
  <text x="64" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">hours    1</text>
  <text x="64" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">score    0</text>
  <rect x="186" y="194" width="66" height="20" rx="6" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="258" y1="204" x2="286" y2="204" stroke="#CC2B1D" stroke-width="1.5"/>
  <text x="290" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" dominant-baseline="central">"none!"</text>
  <text x="200" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">isna() asks: is this cell EMPTY?</text>
  <text x="200" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">It does not ask: do we know this age?</text>
  <text x="200" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Pandas answered honestly.</text>

  <!-- right: the column itself -->
  <text x="448" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">what is actually in the column</text>
  <rect x="448" y="140" width="104" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="500" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">13</text>
  <rect x="448" y="168" width="104" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="500" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">14</text>
  <rect x="448" y="196" width="104" height="26" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="500" y="209" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">unknown</text>
  <rect x="448" y="224" width="104" height="26" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="500" y="237" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">13</text>
  <rect x="448" y="252" width="104" height="26" rx="6" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="500" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">unknown</text>

  <line x1="560" y1="209" x2="586" y2="209" stroke="#845F00" stroke-width="1.5"/>
  <text x="592" y="203" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#845F00">there IS something</text>
  <text x="592" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#845F00">in these cells &#8212; a word</text>

  <rect x="592" y="240" width="164" height="60" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="604" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">raw.info()</text>
  <text x="604" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" font-weight="600">age  ...  object</text>
  <text x="600" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Run info() as well as isna().</text>

  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">isna() finds empty cells. It does not find cells that contain a word meaning "empty".</text>
</svg>
