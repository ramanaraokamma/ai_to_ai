<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img">
  <title>Same number. Two different people. No error.</title>
  <desc>A five-row table whose row labels are register numbers 4, 2, 5, 1, 3 rather than 0 to 4. A purple callout reading loc bracket 2 points at the row labelled 2, which is Kabir. A pink callout reading iloc bracket 2 points at the third row down, which is Meera. Both answers are printed to the right to show the two commands returned different people with no error.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same number. Two different people. No error.</text>
  <text x="400" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The row labels are register numbers, so they are not in order</text>
