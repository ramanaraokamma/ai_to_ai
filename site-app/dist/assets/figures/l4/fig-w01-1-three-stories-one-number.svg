<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three runs that end near 0.693 tell three different stories; only the curve shows which</title>
  <desc>Three small panels share one log-scale loss axis from 0.01 to 10, with a dashed line at 0.693, the loss of a coin-flip model. Left, runs A and B (learning rates 1e-6 and 1e-5) sit on the line: A goes 0.694 to 0.693 and B goes 0.694 to 0.683. Middle, runs C, D and E fall well below it: C goes 0.694 to 0.077, D goes 0.691 to 0.018 and E goes 0.658 to 0.013. Right, run F starts at 12.786, drops to 0.520 and ends back on the line at 0.693. Points are epochs 0, 5, 10, 20, 40 and 59 of seed 0.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same final loss, three different stories</text>
