<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The sealed prediction slip</title>
  <desc>A filled-in prediction slip listing four groups to test and a written guess that held in a hand will be worst, signed and dated. An arrow leads to a sealed envelope marked do not open until week 33.</desc>
  <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">Write it down BEFORE you test</text>

  <rect x="30" y="60" width="420" height="286" rx="12" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 72 A12 12 0 0 1 42 60 H438 A12 12 0 0 1 450 72 V96 H30 Z" fill="#E8C671" stroke="none"/>
  <line x1="30" y1="96" x2="450" y2="96" stroke="#845F00" stroke-width="3"/>
  <text x="240" y="85" font-size="18" fill="#14202B" text-anchor="middle">MY SEALED PREDICTION</text>

  <text x="50" y="124" font-size="14" fill="#55636F">Four groups I will test in Week 33:</text>
  <g font-size="18" fill="#14202B">
    <text x="58" y="152">1. Bright daylight (my control)</text>
    <text x="58" y="178">2. Lamplight, indoors, evening</text>
    <text x="58" y="204">3. Object held in a hand</text>
    <text x="58" y="230">4. Busy, patterned background</text>
  </g>

  <rect x="46" y="244" width="388" height="54" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="58" y="266" font-size="14" fill="#55636F">I predict the WORST group will be:</text>
  <text x="58" y="290" font-size="18" fill="#14202B">HELD IN A HAND</text>

  <line x1="50" y1="322" x2="200" y2="322" stroke="#55636F" stroke-width="1.5"/>
  <line x1="250" y1="322" x2="430" y2="322" stroke="#55636F" stroke-width="1.5"/>
  <text x="50" y="340" font-size="12" fill="#55636F">signed</text>
  <text x="250" y="340" font-size="12" fill="#55636F">date</text>
  <text x="58" y="316" font-size="18" fill="#14202B">R. Kumar</text>
  <text x="258" y="316" font-size="18" fill="#14202B">2 September</text>

  <line x1="470" y1="200" x2="516" y2="200" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="510,193 522,200 510,207" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="546" y="130" width="224" height="140" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M546 140 L658 214 L770 140" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="658" cy="228" r="20" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="658" y="234" font-size="14" fill="#14202B" text-anchor="middle">SEAL</text>
  <text x="658" y="298" font-size="14" fill="#14202B" text-anchor="middle">DO NOT OPEN</text>
  <text x="658" y="318" font-size="14" fill="#14202B" text-anchor="middle">UNTIL WEEK 33</text>

  <text x="400" y="382" font-size="14" fill="#55636F" text-anchor="middle">A guess written afterwards is a story. A guess written before is a test.</text>
</svg>
