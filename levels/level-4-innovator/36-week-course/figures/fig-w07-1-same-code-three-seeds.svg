<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Before you compare two runs, measure how much the seed alone moves the result</title>
  <desc>Three bars of final validation loss for the identical baseline run: seed 0 is 0.0367, seed 1 is 0.0499 and seed 2 is 0.0301, on an axis from 0 to 0.06. A bracket joins the tallest and shortest bar; the panel on the right says 0.0499 is about 66% bigger than 0.0301 and that the mean over 3 seeds is 0.039 plus or minus a spread of 0.008.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Same code, same data: only the seed changes</text>
  <text x="50" y="215" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 50 215)">final validation loss</text>
  <line x1="90" y1="320" x2="470" y2="320" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.00</text>
  <line x1="90" y1="250" x2="470" y2="250" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.02</text>
  <line x1="90" y1="180" x2="470" y2="180" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.04</text>
  <line x1="90" y1="110" x2="470" y2="110" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">0.06</text>
  <rect x="120" y="191.5" width="80" height="128.5" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="160" y="183.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.0367</text>
  <text x="160" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">seed 0</text>
  <rect x="235" y="145.3" width="80" height="174.7" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="275" y="137.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.0499</text>
  <text x="275" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">seed 1</text>
  <rect x="350" y="214.7" width="80" height="105.3" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="390" y="206.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.0301</text>
  <text x="390" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">seed 2</text>
  <line x1="470" y1="145.3" x2="482" y2="145.3" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <line x1="470" y1="214.7" x2="482" y2="214.7" stroke="#C42B8C" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
  <line x1="482" y1="145.3" x2="482" y2="214.7" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <rect x="520" y="90" width="260" height="250" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="650" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">What the three runs say</text>
  <text x="650" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">0.0499 is about</text>
  <text x="650" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#C42B8C" text-anchor="middle">66% bigger</text>
  <text x="650" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">than 0.0301</text>
  <line x1="540" y1="244" x2="760" y2="244" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="650" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">mean over 3 seeds</text>
  <text x="650" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">0.039 &#177; 0.008</text>
  <text x="650" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">this &#177; is the spread</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A seed is a knob you did not mean to turn: measure its wobble before you read any knob.</text>
</svg>
