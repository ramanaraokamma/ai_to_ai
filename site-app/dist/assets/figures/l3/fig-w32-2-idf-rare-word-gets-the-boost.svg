<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The rarer the word, the bigger its boost</title>
  <desc>Eight horizontal bars, one per vocabulary word, showing the inverse document frequency of each. pizza is in 3 of the 4 reviews and gets the shortest bar, 1.2231. cold, great, service, the and was are each in 2 of 4 and get 1.5108. and and food are each in only 1 review and get the longest bars, 1.9163. The panel below shows the arithmetic: for and, the natural log of 5 divided by 2, plus 1, is 0.916291 plus 1 which is 1.9163; for pizza, the natural log of 5 divided by 4, plus 1, is 0.223144 plus 1 which is 1.2231.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Rare words get the boost</text>
  <text x="70" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">word</text>
  <text x="126" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">df</text>
  <text x="300" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">idf = ln( 5 &#247; (1 + df) ) + 1</text>
  <line x1="158" y1="92" x2="158" y2="396" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="158" y="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1.0</text>
  <line x1="263" y1="92" x2="263" y2="396" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="263" y="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1.5</text>
  <line x1="368" y1="92" x2="368" y2="396" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="368" y="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2.0</text>
  <text x="104" y="113" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">pizza</text>
  <text x="126" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <rect x="158" y="100" width="46.8602" height="26" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="212.86" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.2231</text>
  <text x="104" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">cold</text>
  <text x="126" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <rect x="158" y="136" width="107.273" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="273.273" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.5108</text>
  <text x="104" y="185" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">great</text>
  <text x="126" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <rect x="158" y="172" width="107.273" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="273.273" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.5108</text>
  <text x="104" y="221" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">service</text>
  <text x="126" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <rect x="158" y="208" width="107.273" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="273.273" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.5108</text>
  <text x="104" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">the</text>
  <text x="126" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <rect x="158" y="244" width="107.273" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="273.273" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.5108</text>
  <text x="104" y="293" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">was</text>
  <text x="126" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <rect x="158" y="280" width="107.273" height="26" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="273.273" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.5108</text>
  <text x="104" y="329" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">and</text>
  <text x="126" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <rect x="158" y="316" width="192.421" height="26" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="358.421" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.9163</text>
  <text x="104" y="365" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">food</text>
  <text x="126" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <rect x="158" y="352" width="192.421" height="26" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="358.421" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">1.9163</text>
  <rect x="24" y="424" width="452" height="52" rx="10" fill="#F5F8FA" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="38" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">and in 1 of 4:   ln(5 &#247; 2) + 1 = 0.916291 + 1 = 1.9163</text>
  <text x="38" y="465" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">pizza in 3 of 4: ln(5 &#247; 4) + 1 = 0.223144 + 1 = 1.2231</text>
</svg>
