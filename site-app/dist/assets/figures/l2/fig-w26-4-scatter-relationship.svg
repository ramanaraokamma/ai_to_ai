<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Read the tilt, spot the exception</title>
  <desc>A scatter plot of twelve students with study hours on the x axis and score on the y axis. The dots rise to the right in a fairly tight band. One dot at one and a half hours and a score of 78 sits well above the band and is ringed and labelled.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Read the tilt, spot the exception</text>
  <line x1="90" y1="380" x2="452" y2="380" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="305" x2="452" y2="305" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="230" x2="452" y2="230" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="155" x2="452" y2="155" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="90" y1="80" x2="452" y2="80" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="82" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">40</text>
  <text x="82" y="309" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">55</text>
  <text x="82" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">70</text>
  <text x="82" y="159" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">85</text>
  <text x="82" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">100</text>
  <line x1="90" y1="380" x2="90" y2="386" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="90" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
