<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The index is a name for the row, not a column</title>
  <desc>A DataFrame drawn with a heavy black frame round its header row and three data columns. The grey index column numbered 0 to 3 sits outside that frame, labelled index, not data. To the right, asking for the name column gets a green tick and asking for column zero gets a red cross and a KeyError.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The index is a name for the row, not a column</text>
  <text x="353" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the table</text>
