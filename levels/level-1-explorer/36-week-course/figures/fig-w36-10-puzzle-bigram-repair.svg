<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The broken bigram table puzzle</title>
  <desc>Three short sentences at the top, then a table of eight word pairs with counts that adds up to ten when it should add up to nine. Two of the rows are wrong.</desc>
  <text x="250" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One table, two mistakes</text>
  <rect x="30" y="56" width="440" height="98" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="50" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">The whole training text:</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="50" y="110">the sun set.</text>
    <text x="190" y="110">the sun rose.</text>
    <text x="340" y="110">the moon rose.</text>
  </g>
  <text x="50" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">12 tokens. 3 sentences.</text>
  <text x="50" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">So how many word PAIRS should there be?</text>
  <rect x="30" y="176" width="440" height="330" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 186 A10 10 0 0 1 40 176 H460 A10 10 0 0 1 470 186 V216 H30 Z" fill="#F5F8FA" stroke="none"/>
  <line x1="30" y1="216" x2="470" y2="216" stroke="#14202B" stroke-width="3"/>
  <line x1="330" y1="176" x2="330" y2="506" stroke="#C7CDD4" stroke-width="1.5"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">
    <text x="50" y="204">WORD PAIR</text>
    <text x="350" y="204">TIMES SEEN</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="50" y="248">the &#8594; sun</text><text x="380" y="248">2</text>
    <text x="50" y="284">the &#8594; moon</text><text x="380" y="284">1</text>
    <text x="50" y="320">sun &#8594; set</text><text x="380" y="320">1</text>
    <text x="50" y="356">sun &#8594; rose</text><text x="380" y="356">1</text>
    <text x="50" y="392">moon &#8594; rose</text><text x="380" y="392">1</text>
    <text x="50" y="428">set &#8594; .</text><text x="380" y="428">1</text>
    <text x="50" y="464">rose &#8594; .</text><text x="380" y="464">1</text>
    <text x="50" y="500">. &#8594; the</text><text x="380" y="500">2</text>
  </g>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="30" y1="266" x2="470" y2="266"/><line x1="30" y1="302" x2="470" y2="302"/>
    <line x1="30" y1="338" x2="470" y2="338"/><line x1="30" y1="374" x2="470" y2="374"/>
    <line x1="30" y1="410" x2="470" y2="410"/><line x1="30" y1="446" x2="470" y2="446"/>
    <line x1="30" y1="482" x2="470" y2="482"/>
  </g>
  <text x="250" y="536" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">These counts add up to 10.</text>
  <g stroke="#55636F" stroke-width="1.5">
    <line x1="40" y1="592" x2="460" y2="592"/>
    <line x1="40" y1="628" x2="460" y2="628"/>
    <line x1="40" y1="664" x2="460" y2="664"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">
    <text x="40" y="574">There should be ______ pairs, because pairs = tokens &#8722; sentences.</text>
    <text x="40" y="612">Mistake 1: ____________________________________________</text>
    <text x="40" y="648">Mistake 2: ____________________________________________</text>
    <text x="40" y="690">Now generate one sentence starting from "the": _______________</text>
  </g>
</svg>
