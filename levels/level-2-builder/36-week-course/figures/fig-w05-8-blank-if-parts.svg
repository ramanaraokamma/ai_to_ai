<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the five parts of this if statement</title>
  <desc>Four lines of an if and else are shown as grey strips, with a vertical ruler marking the left margin. Five leader lines marked A to E point at the keyword, the condition, the colon, the indented block and the line at the margin that always runs. Five blank write-in lines wait underneath.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the five parts of this if statement</text>

  <line x1="176" y1="66" x2="176" y2="252" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="168" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">the margin</text>

  <rect x="176" y="74" width="304" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="186" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">if</text>
  <text x="220" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">age &gt;= 13</text>
  <text x="322" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">:</text>

  <rect x="210" y="112" width="270" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="220" y="133" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">price = 250</text>

  <rect x="176" y="150" width="304" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="186" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">else:</text>

  <rect x="210" y="188" width="270" height="32" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="220" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">price = 120</text>

  <rect x="176" y="226" width="304" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="186" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">print(price)</text>

  <line x1="192" y1="74" x2="192" y2="58" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="192" y="54" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">A</text>
  <line x1="500" y1="90" x2="540" y2="90" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="548" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C">B</text>
  <line x1="500" y1="112" x2="540" y2="112" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="548" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C">C</text>
  <line x1="500" y1="166" x2="540" y2="166" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="548" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C">D</text>
  <line x1="500" y1="242" x2="540" y2="242" stroke="#C42B8C" stroke-width="1.5" stroke-linecap="round"/>
  <text x="548" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C">E</text>

  <text x="40" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">A ____________________________</text>
  <text x="40" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">B ____________________________</text>
  <text x="40" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">C ____________________________</text>
  <text x="440" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">D ____________________________</text>
  <text x="440" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">E ____________________________</text>
  <text x="440" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">Then ring the one line that runs whichever way you go.</text>
</svg>
