<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The gradient check: two numbers that have to agree</title>
  <desc>On the left, the slope of the loss for the weight W1 at row 0 column 0, measured by nudging it a millionth either way: the loss at 0.500001 is 0.57744916, the loss at 0.499999 is 0.57744856, and 0.00000060 divided by 0.000002 gives 0.29789053. On the right, a four row table comparing the chain answer against the nudged answer: dW1 at 0 0 is 0.29789053 both ways with a relative error of 3.48e-11; dW1 at 1 1 is 0.44413566 both ways, 4.97e-11; dW2 at 0 0 is minus 0.05363113 both ways, 2.41e-12; db2 is 0.16709129 both ways, 1.88e-10. A green bar underneath reads: worst relative error anywhere 2.97e-08, which is below 1e-6, so the arithmetic is right.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The gradient check: two numbers that have to agree</text>
  <text x="400" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">one comes from the chain, one comes from nudging the knob &#8212; and they must agree</text>

  <rect x="30" y="88" width="352" height="196" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="206" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">measured by nudging one knob</text>
  <line x1="46" y1="124" x2="366" y2="124" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="206" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">W1[0,0] = 0.500001 &#8594; loss 0.57744916</text>
  <text x="206" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">W1[0,0] = 0.499999 &#8594; loss 0.57744856</text>
  <line x1="66" y1="182" x2="346" y2="182" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="206" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">the loss moved 0.00000060</text>
  <text x="206" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">the knob moved 0.00000200</text>
  <rect x="70" y="238" width="272" height="34" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="206" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.00000060 &#247; 0.00000200 = 0.29789053</text>

  <rect x="404" y="88" width="366" height="196" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="587" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">four knobs, both answers</text>
  <text x="428" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">knob</text>
  <text x="516" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">chain</text>
  <text x="608" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">nudge</text>
  <text x="700" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" font-weight="600">rel. error</text>
  <line x1="420" y1="144" x2="754" y2="144" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="428" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dW1[0,0]</text>
  <text x="516" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.297891</text>
  <text x="608" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.297891</text>
  <text x="700" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B">3.48e&#8722;11</text>
  <text x="428" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dW1[1,1]</text>
  <text x="516" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.444136</text>
  <text x="608" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.444136</text>
  <text x="700" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B">4.97e&#8722;11</text>
  <text x="428" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">dW2[0,0]</text>
  <text x="510" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">&#8722;0.053631</text>
  <text x="602" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">&#8722;0.053631</text>
  <text x="700" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B">2.41e&#8722;12</text>
  <text x="428" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">db2[0,0]</text>
  <text x="516" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.167091</text>
  <text x="608" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">0.167091</text>
  <text x="700" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B">1.88e&#8722;10</text>
  <text x="587" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the same digit, then the same digit, all the way along</text>

  <rect x="30" y="302" width="740" height="76" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <g transform="translate(48,318)">
  <circle cx="24" cy="24" r="22" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <polyline points="14,25 21,33 36,17" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="112" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">worst relative error anywhere: 2.97e&#8722;08</text>
  <text x="112" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">below 1e&#8722;6, so all nine of the slopes are right &#8212; you checked, you did not guess</text>
</svg>
