<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Tracing a gap back to a count of 17</title>
  <desc>On the left a training data table with four rows: daylight 183, lamplight 17, held in a hand 0, unusual background 0. On the right the four test accuracies. A bold arrow runs from the 58.3 percent result back to the circled count of 17.</desc>
  <text x="400" y="38" font-size="24" fill="#14202B" text-anchor="middle">Every gap has a count behind it</text>

  <path d="M400 132 H470 V226 H600" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="410,125 398,132 410,139" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="400" y1="96" x2="600" y2="96"/>
    <line x1="400" y1="168" x2="600" y2="168"/>
    <line x1="400" y1="204" x2="600" y2="204"/>
  </g>

  <rect x="30" y="66" width="370" height="196" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 78 A12 12 0 0 1 42 66 H388 A12 12 0 0 1 400 78 V102 H30 Z" fill="#D9EAF9" stroke="none"/>
  <line x1="30" y1="102" x2="400" y2="102" stroke="#1F6FB2" stroke-width="3"/>
  <line x1="300" y1="66" x2="300" y2="262" stroke="#C7CDD4" stroke-width="1.5"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="30" y1="142" x2="400" y2="142"/>
    <line x1="30" y1="182" x2="400" y2="182"/>
    <line x1="30" y1="222" x2="400" y2="222"/>
  </g>
  <text x="46" y="90" font-size="18" fill="#14202B">Training photos</text>
  <text x="350" y="90" font-size="18" fill="#14202B" text-anchor="middle">count</text>
  <g font-size="18" fill="#14202B">
    <text x="46" y="128">Daylight</text>
    <text x="46" y="168">Lamplight</text>
    <text x="46" y="208">Held in a hand</text>
    <text x="46" y="248">Odd background</text>
  </g>
  <g font-size="18" fill="#14202B" text-anchor="middle">
    <text x="350" y="128">183</text>
    <text x="350" y="208">0</text>
    <text x="350" y="248">0</text>
  </g>
  <ellipse cx="350" cy="162" rx="34" ry="20" fill="none" stroke="#C42B8C" stroke-width="3"/>
  <text x="350" y="168" font-size="18" fill="#14202B" text-anchor="middle">17</text>

  <rect x="600" y="66" width="170" height="196" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <text x="685" y="90" font-size="18" fill="#14202B" text-anchor="middle">test result</text>
  <line x1="600" y1="102" x2="770" y2="102" stroke="#14202B" stroke-width="3"/>
  <g font-size="18" fill="#14202B" text-anchor="middle">
    <text x="685" y="128">91.7%</text>
    <text x="685" y="208">41.7%</text>
    <text x="685" y="248">50.0%</text>
  </g>
  <rect x="626" y="146" width="118" height="32" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="685" y="168" font-size="18" fill="#14202B" text-anchor="middle">58.3%</text>

  <text x="500" y="300" font-size="18" fill="#14202B" text-anchor="middle">Why is lamplight shaky?</text>
  <text x="500" y="326" font-size="18" fill="#14202B" text-anchor="middle">Because there were 17 of them.</text>
  <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">No villain. No bug. A count.</text>
</svg>
