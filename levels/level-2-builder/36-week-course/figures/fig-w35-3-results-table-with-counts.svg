<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Every number carries its units and its row count</title>
  <desc>A results table with a header row reading model, MAE in minutes, train R squared, test R squared and test rows. Four model rows are listed best first, ending with a baseline row. The test rows column, reading 26 four times, is outlined and tinted, and a callout above says one test row is worth 3.8 per cent.</desc>
<text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Every number carries its units and its row count</text>
<rect x="470" y="54" width="280" height="38" rx="10" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
<text x="610" y="73" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">one test row is worth 3.8%</text>
<line x1="680" y1="94" x2="680" y2="116" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
<polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(680 116) rotate(90.0)"/>
<rect x="50" y="120" width="200" height="32" fill="#D9EAF9"/>
<rect x="250" y="120" width="120" height="32" fill="#D9EAF9"/>
<rect x="370" y="120" width="120" height="32" fill="#D9EAF9"/>
<rect x="490" y="120" width="120" height="32" fill="#D9EAF9"/>
<rect x="610" y="120" width="140" height="32" fill="#D9EAF9"/>
<rect x="610" y="152" width="140" height="136" fill="#F4D5E9"/>
<g stroke="#C7CDD4" stroke-width="1.5">
  <line x1="250" y1="120" x2="250" y2="288"/>
  <line x1="370" y1="120" x2="370" y2="288"/>
  <line x1="490" y1="120" x2="490" y2="288"/>
  <line x1="610" y1="120" x2="610" y2="288"/>
  <line x1="50" y1="186" x2="750" y2="186"/>
  <line x1="50" y1="220" x2="750" y2="220"/>
  <line x1="50" y1="254" x2="750" y2="254"/>
</g>
<line x1="50" y1="152" x2="750" y2="152" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<text x="150" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central" font-weight="600">model</text>
<text x="310" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central" font-weight="600">MAE (min)</text>
<text x="430" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central" font-weight="600">train R2</text>
<text x="550" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central" font-weight="600">test R2</text>
<text x="680" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central" font-weight="600">test rows</text>
