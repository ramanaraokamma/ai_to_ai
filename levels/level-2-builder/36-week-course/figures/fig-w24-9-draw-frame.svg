<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 24</title>
  <desc>An empty framed drawing area headed draw split, apply, combine, with the group sizes on it. Three labelled bays wait to be drawn in: a bay for the incoming rows, a bay for the piles with a dashed box under each of four pile positions for its row count, and a bay for the small result table. Three reminder boxes underneath ask for the sum of the pile sizes, the number of rows in the table, and the one group whose average you would not say out loud.</desc>
  <rect x="24" y="24" width="752" height="272" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#F5F8FA"/>
  <line x1="24" y1="68" x2="776" y2="68" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="53" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">DRAW: split, apply, combine &#8212; with the group sizes written on it</text>

  <!-- three bays -->
  <rect x="44" y="88" width="150" height="180" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="119" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the rows going in</text>
  <text x="119" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">draw the stack</text>

  <rect x="230" y="88" width="330" height="180" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="395" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">SPLIT into piles &#8212; different heights, on purpose</text>
  <text x="395" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">draw one pile per group here</text>
  <line x1="250" y1="212" x2="540" y2="212" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="252" y="222" width="62" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="322" y="222" width="62" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="392" y="222" width="62" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="462" y="222" width="62" height="26" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="395" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">how many rows in each pile? Write the number in the box.</text>

  <rect x="596" y="88" width="160" height="180" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="676" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">COMBINE: the small table</text>
  <rect x="614" y="116" width="124" height="120" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="614" y1="140" x2="738" y2="140"/>
    <line x1="614" y1="164" x2="738" y2="164"/>
    <line x1="614" y1="188" x2="738" y2="188"/>
    <line x1="614" y1="212" x2="738" y2="212"/>
    <line x1="676" y1="116" x2="676" y2="236"/>
  </g>
  <text x="676" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one row per pile</text>

  <!-- the APPLY arrow, to be labelled -->
  <line x1="566" y1="178" x2="590" y2="178" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(590 178)"/>
  <line x1="200" y1="178" x2="224" y2="178" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(224 178)"/>
  <text x="578" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C7CDD4" text-anchor="middle">APPLY</text>

  <!-- reminder boxes -->
  <text x="60" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">my pile sizes add up to&#8230;</text>
  <rect x="60" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the table has this many rows&#8230;</text>
  <rect x="300" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="540" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">the average I would NOT say out loud</text>
  <rect x="540" y="332" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="400" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">An average with no count beside it is not an answer.</text>
</svg>
