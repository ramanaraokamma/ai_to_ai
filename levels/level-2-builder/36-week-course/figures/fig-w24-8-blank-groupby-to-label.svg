<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the three stages of a groupby</title>
  <desc>A groupby diagram in three stages. On the left a stack of thirty-eight rows. In the middle four piles of different heights, one very short. On the right a small four-row result table of averages. Five empty dashed boxes lettered A to E wait to be filled in, pointing at the stack of rows going in, the piles, the height of the shortest pile, the calculation done to each pile, and the small table that comes out.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the three stages of a groupby</text>
  <text x="400" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Write one short phrase in each dashed box.</text>

  <!-- leaders first -->
  <line x1="96" y1="238" x2="96" y2="272" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="330" y1="240" x2="330" y2="272" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="392" y1="222" x2="392" y2="272" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="470" y1="150" x2="470" y2="118" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="640" y1="238" x2="640" y2="272" stroke="#C42B8C" stroke-width="1.5"/>

  <!-- the incoming stack of rows -->
  <g stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round" fill="#D9EAF9">
    <rect x="40" y="112" width="112" height="14" rx="4"/>
    <rect x="40" y="130" width="112" height="14" rx="4"/>
    <rect x="40" y="148" width="112" height="14" rx="4"/>
    <rect x="40" y="166" width="112" height="14" rx="4"/>
    <rect x="40" y="184" width="112" height="14" rx="4"/>
    <rect x="40" y="202" width="112" height="14" rx="4"/>
    <rect x="40" y="220" width="112" height="14" rx="4"/>
  </g>
  <text x="96" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">38 rows</text>

  <line x1="164" y1="172" x2="192" y2="172" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(192 172)"/>

  <!-- the four piles -->
  <rect x="204" y="140" width="46" height="100" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="227" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">14</text>
  <text x="227" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Blue</text>

  <rect x="258" y="154" width="46" height="86" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="281" y="197" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
  <text x="281" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Red</text>

  <rect x="312" y="168" width="46" height="72" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="335" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">10</text>
  <text x="335" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Green</text>

  <rect x="366" y="226" width="46" height="14" rx="6" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <text x="392" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#C42B8C" text-anchor="middle">2</text>
  <text x="389" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Gold</text>

  <!-- the middle machine -->
  <line x1="424" y1="172" x2="452" y2="172" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(452 172)"/>
  <rect x="456" y="150" width="80" height="44" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="496" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">mean()</text>
  <line x1="548" y1="172" x2="576" y2="172" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-9,-6 0,0 -9,6" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(576 172)"/>

  <!-- the result table -->
  <rect x="584" y="112" width="112" height="126" rx="8" fill="#FFFFFF" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="584" y="112" width="112" height="24" fill="#F5F8FA"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="584" y1="162" x2="696" y2="162"/>
    <line x1="584" y1="187" x2="696" y2="187"/>
    <line x1="584" y1="212" x2="696" y2="212"/>
    <line x1="640" y1="112" x2="640" y2="238"/>
  </g>
  <line x1="584" y1="136" x2="696" y2="136" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="612" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">house</text>
  <text x="668" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" font-weight="600" dominant-baseline="central">avg</text>
  <text x="612" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Blue</text>
  <text x="668" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">74.36</text>
  <text x="612" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Gold</text>
  <text x="668" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">95.00</text>
  <text x="612" y="199" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Green</text>
  <text x="668" y="199" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">65.20</text>
  <text x="612" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">Red</text>
  <text x="668" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">74.25</text>
  <text x="640" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4 rows</text>

  <!-- the five empty boxes -->
  <rect x="20" y="272" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="96" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">A</text>

  <rect x="254" y="272" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="330" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">B</text>

  <rect x="254" y="330" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="330" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">C</text>

  <rect x="418" y="88" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="410" y="103" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="end" dominant-baseline="central">D</text>

  <rect x="564" y="272" width="152" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="640" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="middle">E</text>

  <text x="400" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">14 + 12 + 10 + 2 = 38. If that sum ever fails, rows went missing and nothing said so.</text>
</svg>
