<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the parts of this table</title>
  <desc>A five column table of three spoons with no headings. Empty labelled boxes with leader lines point at one row, one feature column, the label column and one single value, waiting to be named.</desc>
  <text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Name the four parts I am pointing at</text>
  <!-- leader lines drawn first -->
  <g stroke="#C42B8C" stroke-width="1.5" fill="none">
    <path d="M150 118 V96"/>
    <path d="M300 210 V246"/>
    <path d="M604 118 V96"/>
    <path d="M420 176 L468 176"/>
  </g>
  <!-- table -->
  <rect x="120" y="118" width="560" height="90" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="568" y="118" width="112" height="90" fill="#DBCEF3" stroke="none"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="120" y1="148" x2="680" y2="148"/>
    <line x1="120" y1="178" x2="680" y2="178"/>
    <line x1="232" y1="118" x2="232" y2="208"/>
    <line x1="344" y1="118" x2="344" y2="208"/>
    <line x1="456" y1="118" x2="456" y2="208"/>
  </g>
  <line x1="568" y1="118" x2="568" y2="208" stroke="#6D28D9" stroke-width="3"/>
  <rect x="120" y="118" width="560" height="90" rx="8" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="176" y="138">24</text><text x="288" y="138">13.0</text><text x="400" y="138">1</text><text x="512" y="138">silver</text><text x="624" y="138">teaspoon</text>
    <text x="176" y="168">41</text><text x="288" y="168">18.0</text><text x="400" y="168">1</text><text x="512" y="168">silver</text><text x="624" y="168">dessert</text>
    <text x="176" y="198">96</text><text x="288" y="198">27.5</text><text x="400" y="198">1</text><text x="512" y="198">silver</text><text x="624" y="198">serving</text>
  </g>
  <!-- empty answer boxes -->
  <g fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round">
    <rect x="40" y="58" width="220" height="38" rx="8"/>
    <rect x="190" y="246" width="220" height="38" rx="8"/>
    <rect x="494" y="58" width="220" height="38" rx="8"/>
    <rect x="468" y="300" width="246" height="38" rx="8"/>
  </g>
  <g stroke="#C42B8C" stroke-width="1.5" fill="none">
    <path d="M591 300 V180 H528"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">
    <text x="40" y="52">1. This whole column is a...</text>
    <text x="190" y="240">2. This whole row is a...</text>
    <text x="494" y="52">3. This shaded column is the...</text>
    <text x="468" y="294">4. The word "silver" here is one...</text>
  </g>
</svg>
