<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Eighty reviews, flattened onto two axes</title>
  <desc>A scatter plot of all 80 reviews after their TF-IDF rows are squashed from 97 columns down to two. Green circles are the 40 positive reviews and red squares the 40 negative ones, and they are thoroughly mixed with no visible boundary. The first axis holds 10.58 percent of the spread and the second 4.49 percent: 10.58 plus 4.49 is 15.07 percent kept, so 84.93 percent of the structure was thrown away to make the picture. The mixing is a property of the picture, not of the data, because the classifier separates the same reviews perfectly using all 97 columns.</desc>
