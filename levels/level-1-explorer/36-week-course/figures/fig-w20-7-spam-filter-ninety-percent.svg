<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The spam filter that never caught a spam email</title>
  <desc>One hundred emails split into ninety real and ten spam. A filter stamps not spam on every one. The ninety real emails are marked correct, the ten spam emails are marked wrong, giving ninety percent accuracy.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">The spam filter that never caught a spam email</text>

    <rect x="30" y="66" width="230" height="150" rx="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="145" y="94" font-size="14" fill="#55636F" text-anchor="middle">100 TEST EMAILS</text>
    <rect x="52" y="110" width="186" height="48" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="145" y="140" font-size="18" fill="#14202B" text-anchor="middle">90 real</text>
    <rect x="52" y="164" width="42" height="38" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
    <text x="166" y="189" font-size="18" fill="#14202B" text-anchor="middle">10 spam</text>

    <g transform="translate(272,116) scale(0.5)">
      <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="330" y="66" width="180" height="150" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="420" y="94" font-size="14" fill="#55636F" text-anchor="middle">MY "FILTER"</text>
    <rect x="352" y="110" width="136" height="76" rx="10" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="420" y="140" font-size="18" fill="#14202B" text-anchor="middle">says</text>
    <text x="420" y="168" font-size="18" fill="#14202B" text-anchor="middle">"not spam"</text>
    <text x="420" y="206" font-size="12" fill="#CC2B1D" text-anchor="middle">it never looks at the email</text>

    <g transform="translate(522,116) scale(0.5)">
      <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="580" y="66" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="675" y="94" font-size="14" fill="#55636F" text-anchor="middle">SCORE</text>
    <g transform="translate(600,104) scale(0.34)">
      <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
      <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="644" y="132" font-size="18" fill="#14202B">90 / 90 real</text>
    <g transform="translate(600,150) scale(0.34)">
      <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
      <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
        <line x1="38" y1="38" x2="62" y2="62"/>
        <line x1="62" y1="38" x2="38" y2="62"/>
      </g>
    </g>
    <text x="644" y="178" font-size="18" fill="#14202B">0 / 10 spam</text>
    <text x="675" y="206" font-size="14" fill="#55636F" text-anchor="middle">90 correct out of 100</text>

    <rect x="120" y="240" width="560" height="76" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="270" font-size="24" fill="#14202B" text-anchor="middle">accuracy = 90 / 100 = 0.90 = 90%</text>
    <text x="400" y="300" font-size="18" fill="#14202B" text-anchor="middle">and it has never caught a single spam email in its life</text>

    <text x="400" y="356" font-size="14" fill="#55636F" text-anchor="middle">Nobody lied. The arithmetic is perfect. The number is still useless on its own.</text>
    <text x="400" y="380" font-size="14" fill="#55636F" text-anchor="middle">Baseline check: "always say real" also scores 90%. So this filter learned nothing at all.</text>
  </g>
</svg>
