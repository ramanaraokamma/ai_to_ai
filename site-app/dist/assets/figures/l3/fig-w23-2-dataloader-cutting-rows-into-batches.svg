  <line x1="754.845" y1="96" x2="754.845" y2="150" stroke="#C42B8C" stroke-width="3"/>
  <rect x="754.845" y="96" width="5.15513" height="54" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="48" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">batch 0</text>
  <text x="746.845" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">&#8230; batch 38</text>
  <text x="400" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">39 full batches of 32 rows</text>
  <line x1="758.845" y1="92" x2="734.845" y2="74" stroke="#C42B8C" stroke-width="2" stroke-linecap="round"/>
  <text x="728.845" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">batch 39: the 9 rows left over</text>
  <rect x="40" y="200" width="350" height="150" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="215" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">the arithmetic</text>
  <text x="60" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">39 &#215; 32 = 1248</text>
  <text x="60" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1257 &#8722; 1248 = 9</text>
  <line x1="58" y1="296" x2="372" y2="296" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">1248 + 9 = 1257, so 40 batches</text>
  <text x="60" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">no row is used twice, none is missed</text>
  <rect x="410" y="200" width="350" height="150" rx="12" fill="#E8C671" stroke="#845F00" stroke-width="2" stroke-linejoin="round"/>
  <text x="585" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">shuffle=True</text>
  <text x="430" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">next epoch the same 1257 rows are</text>
  <text x="430" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">dealt into 40 different batches</text>
  <text x="430" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">still 40 steps, still 1257 rows &#8212;</text>
  <text x="430" y="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">only the order changed</text>
  <text x="430" y="342" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">never shuffle the test rows</text>
</svg>
