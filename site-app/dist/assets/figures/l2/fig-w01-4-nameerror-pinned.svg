<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>One misspelled word, and Python says which one</title>
  <desc>On the left, a red-outlined traceback panel. The line that failed is highlighted and arrowed, and the final red line names the misspelled word prnt and even suggests print. On the right, a green-outlined terminal shows the same file running and printing two lines.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">One misspelled word, and Python says which one</text>
  <rect x="38" y="168" width="304" height="22" rx="4" fill="#F6AEA6"/>
  <path d="M30 90 A10 10 0 0 1 40 80 H340 A10 10 0 0 1 350 90 V116 H30 Z" fill="#F6AEA6"/>
  <g stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"><line x1="42" y1="90" x2="52" y2="100"/><line x1="52" y1="90" x2="42" y2="100"/></g>
  <text x="64" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Traceback</text>
  <line x1="30" y1="116" x2="350" y2="116" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="42" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">Traceback (most recent call last):</text>
  <text x="42" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">  File "hello.py", line 3, in &lt;module&gt;</text>
  <text x="42" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    prnt("Hello, world.")</text>
  <text x="42" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">NameError: name 'prnt' is not</text>
  <text x="42" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">defined. Did you mean: 'print'?</text>
  <rect x="30" y="80" width="320" height="176" rx="10" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="190" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Read the last line first.</text>
  <line x1="450" y1="182" x2="358" y2="182" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(358 182) rotate(180)"/>
  <text x="364" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">this line</text>
  <path d="M470 90 A10 10 0 0 1 480 80 H760 A10 10 0 0 1 770 90 V116 H470 Z" fill="#E2F7ED"/>
  <polyline points="483.2,91.1 489.25,97.7 501.9,83.4" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="504" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Terminal</text>
  <line x1="470" y1="116" x2="770" y2="116" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <text x="484" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#55636F">&gt;</text>
  <text x="498" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">python3 hello.py</text>
  <text x="484" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">Hello, world.</text>
  <text x="484" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">My name is Ramana.</text>
  <rect x="470" y="80" width="300" height="176" rx="10" fill="none" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="190" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Before: it stopped</text>
  <text x="620" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">After: it ran</text>
  <text x="190" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">prnt is not a word Python knows</text>
  <text x="620" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one letter added, nothing else</text>
  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Read the LAST line first. It names the exact word you misspelled.</text>
</svg>
