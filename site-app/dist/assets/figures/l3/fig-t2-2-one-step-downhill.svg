  <text x="117.5" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <text x="212.5" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <text x="307.5" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <text x="402.5" y="348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <circle cx="402.5" cy="123" r="7" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <circle cx="345.5" cy="197.52" r="7" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="299.9" cy="245.213" r="7" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="263.42" cy="275.736" r="7" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <line x1="392.5" y1="101" x2="364.5" y2="101" stroke="#C42B8C" stroke-width="3" stroke-linecap="round"/><polygon points="355.5,101 365.5,95 365.5,107" fill="#C42B8C" stroke="#C42B8C" stroke-width="1"/>
  <text x="374" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">step 1</text>
  <text x="412.5" y="129" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">w = 3.00, loss 9.00</text>
  <text x="257.42" y="257.736" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">w = 1.54, loss 2.36</text>
  <rect x="480" y="92" width="290" height="130" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="496" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">step 1, in full</text>
  <text x="496" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">slope = 2 &#215; 3 = 6</text>
  <text x="496" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">w &#8592; 3 &#8722; 0.1 &#215; 6</text>
  <text x="496" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">  = 3 &#8722; 0.6 = 2.4</text>
  <text x="496" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">loss 9.00 &#8594; 5.76</text>
  <rect x="480" y="236" width="290" height="104" rx="10" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="492" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">step   w      slope   next w</text>
  <text x="492" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">  1   3.00   6.00   2.40</text>
  <text x="492" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">  2   2.40   4.80   1.92</text>
  <text x="492" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">  3   1.92   3.84   1.54</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The steps get shorter on their own: the step is proportional to the slope.</text>
</svg>
