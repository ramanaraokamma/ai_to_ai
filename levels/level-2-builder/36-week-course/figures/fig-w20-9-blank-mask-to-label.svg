<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Fill in the mask, then the selection</title>
  <desc>Three stacked rows of five boxes. The top row is filled in with Chen's scores 55, 48, 40, 70 and 61. The middle row, outlined in dashed pink and labelled the mask, is empty. The bottom row, dashed grey and labelled the selection, is empty. A count note beside each row reads five cells, question mark cells and question mark cells. Three dashed write-in boxes underneath ask how many cells are in the mask, how many values are in the selection, and why those two numbers differ.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Fill in the mask, then the selection</text>
  <text x="400" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Chen's five scores are given. Everything dashed is yours to write.</text>
  <text x="108" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">the data</text>
  <rect x="120" y="90" width="58" height="36" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="149" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">55</text>
  <rect x="178" y="90" width="58" height="36" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="207" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">48</text>
  <rect x="236" y="90" width="58" height="36" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="265" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">40</text>
  <rect x="294" y="90" width="58" height="36" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="323" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">70</text>
  <rect x="352" y="90" width="58" height="36" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="381" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">61</text>
  <text x="108" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end" dominant-baseline="central">the mask</text>
  <rect x="120" y="150" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="178" y="150" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="236" y="150" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="294" y="150" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="352" y="150" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <text x="108" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">the selection</text>
  <rect x="120" y="210" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="178" y="210" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="236" y="210" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="294" y="210" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <rect x="352" y="210" width="58" height="36" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <text x="414" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">5 cells</text>
  <text x="414" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">? cells</text>
  <text x="414" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="start" dominant-baseline="central">? cells</text>
  <text x="400" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B" text-anchor="middle">the rule is:  scores &gt; 50</text>
  <text x="60" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">how many cells in the mask?</text>
  <rect x="60" y="306" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <text x="300" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">how many values in the selection?</text>
  <rect x="300" y="306" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <text x="540" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">why are those two numbers different?</text>
  <rect x="540" y="306" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The bottom row has five boxes on purpose. You will not need all of them, and noticing that is the point.</text>
</svg>
