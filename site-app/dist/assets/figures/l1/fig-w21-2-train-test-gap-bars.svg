<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Training score against test score with the gap arrowed</title>
  <desc>Two horizontal bars. The top bar, for the sixty photos the model studied, runs the full width and reads one hundred percent. The bar below, for the fifteen photos it had never seen, reads seventy-three point three percent. A bracket spans the difference and is labelled twenty-six point seven percentage points, this much memorising.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="400" y="38" font-size="24" fill="#14202B" text-anchor="middle">The gap is the part that carries information</text>

    <g stroke="#C7CDD4" stroke-width="1.5">
      <line x1="240" y1="100" x2="240" y2="266"/>
      <line x1="365" y1="100" x2="365" y2="266"/>
      <line x1="490" y1="100" x2="490" y2="266"/>
      <line x1="615" y1="100" x2="615" y2="266"/>
      <line x1="740" y1="100" x2="740" y2="266"/>
    </g>
    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="240" y="94">0</text><text x="365" y="94">25</text><text x="490" y="94">50</text>
      <text x="615" y="94">75</text><text x="740" y="94">100</text>
    </g>

    <rect x="240" y="112" width="500" height="52" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
    <rect x="240" y="200" width="366" height="52" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>

    <g font-size="18" fill="#14202B" text-anchor="end">
      <text x="228" y="132">the 60 photos</text>
      <text x="228" y="154">it studied</text>
      <text x="228" y="220">the 15 photos it</text>
      <text x="228" y="242">had never seen</text>
    </g>

    <g font-size="18" fill="#14202B" text-anchor="end">
      <text x="726" y="145">100%</text>
      <text x="592" y="233">73.3%</text>
    </g>

    <path d="M606 268 V286 H740 V268" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="673" y1="286" x2="673" y2="298" stroke="#C42B8C" stroke-width="2"/>

    <rect x="470" y="298" width="290" height="64" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
    <text x="615" y="324" font-size="18" fill="#14202B" text-anchor="middle">26.7 PERCENTAGE POINTS</text>
    <text x="615" y="348" font-size="14" fill="#55636F" text-anchor="middle">= this much memorising</text>

    <text x="40" y="324" font-size="14" fill="#55636F">Boring number: 100% on its own study material.</text>
    <text x="40" y="346" font-size="14" fill="#55636F">Only the second bar is news.</text>

    <text x="400" y="388" font-size="14" fill="#55636F" text-anchor="middle">A small gap is not automatically good news - read the gap AND the level together.</text>
  </g>
</svg>
