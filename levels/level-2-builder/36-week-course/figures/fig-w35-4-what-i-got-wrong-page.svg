<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>An admission with a number in it</title>
  <desc>Two mirrored panels each holding a sticky note. The crossed note says only that the dataset was quite small. The ticked note gives the row count, the test-set size, the worth of one test row and the exact gap between two models, and refuses to rank them.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">An admission with a number in it</text>
<rect x="30" y="76" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
<rect x="410" y="76" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
<circle cx="62" cy="108" r="15" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
<g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
  <line x1="56.705882352941174" y1="102.70588235294117" x2="67.29411764705883" y2="113.29411764705883"/>
  <line x1="67.29411764705883" y1="102.70588235294117" x2="56.705882352941174" y2="113.29411764705883"/>
</g>
<circle cx="442" cy="108" r="15" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
<polyline points="434.94117647058823,108.88235294117646 439.79411764705884,114.17647058823529 449.94117647058823,102.70588235294117" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">vague</text>
<text x="468" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">specific</text>
<path d="M54 146 H364 V220 L342 242 H54 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
<path d="M342 242 V220 H364 Z" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
<text x="200" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">My dataset was</text>
<text x="200" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">quite small.</text>
<path d="M434 146 H744 V220 L722 242 H434 Z" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
<path d="M722 242 V220 H744 Z" fill="#FFFFFF" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
<text x="452" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">126 rows, 26 of them held out. One</text>
<text x="452" y="189" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">test row is worth 3.8%, so the 0.35</text>
<text x="452" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">minute gap between my tree and my</text>
<text x="452" y="227" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">kNN is noise. I am not ranking them.</text>
<text x="210" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">True of every project ever written,</text>
<text x="210" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">so it costs the reader nothing.</text>
<text x="590" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A reader can check every number,</text>
<text x="590" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">and knows exactly what you doubt.</text>
<text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three admissions like the right-hand one are worth more than the whole results table.</text>
</svg>
