<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Puzzle: the missing scores</title>
  <desc>Three confidence readouts with numbers missing. Readout one is fifty-eight, blank, twelve. Readout two is blank, forty-four, eleven with a clue that the margin is one. Readout three is all three blank with a clue that the two losers are equal and the winner leads by one point.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="42" font-size="24" fill="#14202B" text-anchor="middle">Puzzle: the missing scores</text>

    <g font-size="12" fill="#55636F" text-anchor="middle">
      <text x="175" y="72">spoon</text>
      <text x="285" y="72">toothbrush</text>
      <text x="395" y="72">comb</text>
      <text x="620" y="72">the clue</text>
    </g>

    <rect x="40" y="80" width="720" height="80" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="66" cy="120" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="66" y="121" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
    <rect x="130" y="102" width="90" height="36" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="175" y="120" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">58</text>
    <rect x="240" y="102" width="90" height="36" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="285" y="120" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>
    <rect x="350" y="102" width="90" height="36" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="395" y="120" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">12</text>
    <text x="480" y="114" font-size="14" fill="#55636F">The three scores must add to 100.</text>
    <text x="480" y="136" font-size="14" fill="#55636F">Then work out the margin.</text>

    <rect x="40" y="168" width="720" height="80" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="66" cy="208" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="66" y="209" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
    <rect x="130" y="190" width="90" height="36" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="175" y="208" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>
    <rect x="240" y="190" width="90" height="36" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="285" y="208" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">44</text>
    <rect x="350" y="190" width="90" height="36" rx="8" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
    <text x="395" y="208" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">11</text>
    <text x="480" y="202" font-size="14" fill="#55636F">Spoon won. The margin was 1.</text>
    <text x="480" y="224" font-size="14" fill="#55636F">What was the spoon score?</text>

    <rect x="40" y="256" width="720" height="80" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="66" cy="296" r="14" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
    <text x="66" y="297" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
    <rect x="130" y="278" width="90" height="36" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="175" y="296" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>
    <rect x="240" y="278" width="90" height="36" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="285" y="296" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>
    <rect x="350" y="278" width="90" height="36" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <text x="395" y="296" font-size="18" fill="#C42B8C" text-anchor="middle" dominant-baseline="central">?</text>
    <text x="480" y="284" font-size="14" fill="#55636F">Adds to 100. Whole numbers only.</text>
    <text x="480" y="304" font-size="14" fill="#55636F">The two losers are equal, and spoon</text>
    <text x="480" y="324" font-size="14" fill="#55636F">wins by exactly 1 point.</text>

    <text x="400" y="368" font-size="14" fill="#55636F" text-anchor="middle">Only one set of whole numbers fits each row. Find it, then say whether you would trust it.</text>
  </g>
</svg>
