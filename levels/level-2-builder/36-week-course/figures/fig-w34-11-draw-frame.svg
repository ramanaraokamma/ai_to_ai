<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Draw It frame for Week 34</title>
  <desc>A large empty framed drawing area with the heading my project in one picture, and three empty caption boxes underneath labelled my question, one row is one, and one thing this cannot show.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Your page: my project in one picture</text>
  <rect x="20" y="58" width="760" height="236" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/>
  <text x="400" y="180" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="18" fill="#C7CDD4" text-anchor="middle">draw here</text>
  <rect x="20" y="300" width="252" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="146" y="322" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">my question</text>
  <line x1="36" y1="350" x2="256" y2="350" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="274" y="300" width="252" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="322" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">one row is one</text>
  <line x1="290" y1="350" x2="510" y2="350" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="528" y="300" width="252" height="76" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="654" y="322" font-family="ui-sans-serif, system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">this cannot show</text>
  <line x1="544" y1="350" x2="764" y2="350" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
