<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Two steps, repeated: assign, then move</title>
  <desc>A loop of two boxes. The first box, ASSIGN, shows point C at 2 comma 3 measured against both centres: 1 plus 1 is 2 to centre one, 0 plus 0 is 0 to centre two, so centre two wins. The second box, MOVE, shows centre one becoming the middle of A and B: 1 plus 2 over 2 is 1.5, and 2 plus 1 over 2 is 1.5. A curved arrow runs back from MOVE to ASSIGN, and an exit arrow leaves MOVE labelled nobody changed cluster, so stop.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Two steps, repeated. That is the algorithm.</text>
  <rect x="40" y="74" width="320" height="170" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <text x="200" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">1. ASSIGN</text>
  <text x="200" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">give every point to its nearest centre</text>
  <line x1="60.00" y1="138.00" x2="340.00" y2="138.00" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">point C is at (2, 3):</text>
  <text x="60" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">to centre 1 at (1, 2):  1 + 1 = 2</text>
  <text x="60" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">to centre 2 at (2, 3):  0 + 0 = 0</text>
  <text x="60" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">0 is smaller, so C joins centre 2</text>
  <rect x="440" y="74" width="320" height="170" rx="12" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="600" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">2. MOVE</text>
  <text x="600" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">put every centre in the middle of what it got</text>
  <line x1="460.00" y1="138.00" x2="740.00" y2="138.00" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="460" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">centre 1 got A (1, 2) and B (2, 1):</text>
  <text x="460" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">across:  (1 + 2) &#247; 2 = 1.5</text>
  <text x="460" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#14202B">up:      (2 + 1) &#247; 2 = 1.5</text>
  <text x="460" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">centre 1 moves to (1.5, 1.5)</text>
  <line x1="360.00" y1="140.00" x2="440.00" y2="140.00" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(440.00 140.00) rotate(0.00)"/>
  <text x="400" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">then</text>
  <polyline points="600.00,244.00 600.00,296.00 200.00,296.00 200.00,252.00" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(200 250) rotate(-90)"/>
  <text x="400" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">and again, with the centres where they are now</text>
  <rect x="270" y="314" width="260" height="44" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">nobody changed cluster &#8211; STOP</text>
  <line x1="600.00" y1="256.00" x2="600.00" y2="314.00" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1B7A4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(600.00 314.00) rotate(90.00)"/>
  <text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Only two things happen, over and over, and neither is hard.</text>
</svg>
