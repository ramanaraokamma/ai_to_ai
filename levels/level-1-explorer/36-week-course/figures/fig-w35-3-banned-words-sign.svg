<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The banned words sign</title>
  <desc>A sign listing six banned phrases, each with a red cross: magic, it just knows, it's smart, it thinks, it understands, and obviously. Beside each is the honest sentence to say instead.</desc>

  <text x="250" y="42" font-size="24" fill="#14202B" text-anchor="middle">Banned at this booth</text>

  <rect x="30" y="60" width="440" height="386" rx="12" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="3"/>

  <g font-size="12" fill="#55636F">
    <text x="96" y="88">DO NOT SAY</text>
    <text x="270" y="88">SAY THIS INSTEAD</text>
  </g>
  <line x1="50" y1="96" x2="450" y2="96" stroke="#C7CDD4" stroke-width="1.5"/>

  <g stroke="#CC2B1D" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="114" x2="76" y2="130"/><line x1="76" y1="114" x2="60" y2="130"/>
    <line x1="60" y1="170" x2="76" y2="186"/><line x1="76" y1="170" x2="60" y2="186"/>
    <line x1="60" y1="226" x2="76" y2="242"/><line x1="76" y1="226" x2="60" y2="242"/>
    <line x1="60" y1="282" x2="76" y2="298"/><line x1="76" y1="282" x2="60" y2="298"/>
    <line x1="60" y1="338" x2="76" y2="354"/><line x1="76" y1="338" x2="60" y2="354"/>
    <line x1="60" y1="394" x2="76" y2="410"/><line x1="76" y1="394" x2="60" y2="410"/>
  </g>

  <g font-size="18" fill="#14202B">
    <text x="94" y="128">magic</text>
    <text x="94" y="184">it just knows</text>
    <text x="94" y="240">it's smart</text>
    <text x="94" y="296">it thinks</text>
    <text x="94" y="352">it understands</text>
    <text x="94" y="408">obviously</text>
  </g>

  <line x1="256" y1="104" x2="256" y2="422" stroke="#C7CDD4" stroke-width="1.5"/>

  <g font-size="14" fill="#1B7A4B">
    <text x="270" y="122">it found a pattern in</text>
    <text x="270" y="140">160 labelled photos</text>
    <text x="270" y="178">it matches new photos</text>
    <text x="270" y="196">against that pattern</text>
    <text x="270" y="234">it gets 30 of 40 right</text>
    <text x="270" y="252">on photos it never saw</text>
    <text x="270" y="290">it calculates a score</text>
    <text x="270" y="308">for each of four classes</text>
    <text x="270" y="346">it has never seen a bin;</text>
    <text x="270" y="364">it has seen brightness</text>
    <text x="270" y="402">here is the number, and</text>
    <text x="270" y="420">here is how I got it</text>
  </g>

  <text x="250" y="474" font-size="14" fill="#55636F" text-anchor="middle">A listener holds up a finger for every slip. Three fingers, start the sentence again.</text>
</svg>
