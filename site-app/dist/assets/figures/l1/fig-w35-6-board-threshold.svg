<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The finished board: the threshold decision</title>
  <desc>A flowchart drawn on the board. The confidence number goes into one question, is it above seventy percent. Yes leads to the four class behaviours. No leads to a single box that says not sure and refuses to guess.</desc>

  <text x="400" y="38" font-size="24" fill="#14202B" text-anchor="middle">The finished board: where "not sure" comes from</text>

  <g stroke="#55636F" stroke-width="2" fill="none">
    <path d="M130 128 H206"/>
    <path d="M400 154 V182 H620 V208"/>
    <path d="M400 154 V182 H180 V208"/>
    <path d="M180 266 V292 H80 V318"/>
    <path d="M180 266 V292 H180 V318"/>
    <path d="M180 266 V292 H280 V318"/>
    <path d="M180 266 V292 H380 V318"/>
  </g>
  <g font-size="14" fill="#55636F">
    <text x="470" y="176" text-anchor="middle">no</text>
    <text x="320" y="176" text-anchor="middle">yes</text>
  </g>

  <rect x="30" y="102" width="100" height="52" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="80" y="122" font-size="12" fill="#14202B" text-anchor="middle">the model says</text>
  <text x="80" y="142" font-size="12" fill="#14202B" text-anchor="middle">"compost 61%"</text>

  <rect x="206" y="100" width="388" height="56" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="3"/>
  <text x="400" y="128" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">Is the confidence above 70?</text>

  <rect x="510" y="208" width="220" height="58" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
  <text x="620" y="230" font-size="14" fill="#14202B" text-anchor="middle">"Not sure - only 61%."</text>
  <text x="620" y="252" font-size="12" fill="#55636F" text-anchor="middle">no bin named, counter unchanged</text>

  <rect x="70" y="208" width="220" height="58" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="180" y="230" font-size="14" fill="#14202B" text-anchor="middle">act on the label</text>
  <text x="180" y="252" font-size="12" fill="#55636F" text-anchor="middle">one behaviour per class</text>

  <g fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3">
    <rect x="30" y="318" width="100" height="44" rx="8"/>
    <rect x="130" y="318" width="100" height="44" rx="8"/>
    <rect x="230" y="318" width="100" height="44" rx="8"/>
    <rect x="330" y="318" width="100" height="44" rx="8"/>
  </g>
  <g font-size="12" fill="#14202B" text-anchor="middle">
    <text x="80" y="336">recycling</text><text x="80" y="354">blue bin</text>
    <text x="180" y="336">compost</text><text x="180" y="354">green bin</text>
    <text x="280" y="336">landfill</text><text x="280" y="354">black bin</text>
    <text x="380" y="336">other</text><text x="380" y="354">not mine</text>
  </g>

  <rect x="510" y="290" width="220" height="72" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3"/>
  <text x="620" y="314" font-size="14" fill="#14202B" text-anchor="middle">Check the units first!</text>
  <text x="620" y="336" font-size="12" fill="#55636F" text-anchor="middle">Is your confidence 0.61 or 61?</text>
  <text x="620" y="354" font-size="12" fill="#55636F" text-anchor="middle">Set the threshold to match.</text>

  <text x="400" y="388" font-size="14" fill="#55636F" text-anchor="middle">"Other" is a class the model predicts. "Not sure" is the app refusing to pass on a weak guess.</text>
</svg>
