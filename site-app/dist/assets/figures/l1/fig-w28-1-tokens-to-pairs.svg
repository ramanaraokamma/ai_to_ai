<path d="M 446 156 V 192 H 538 V 156" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="492.0" cy="192" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="492.0" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
<path d="M 538 156 V 228 H 630 V 156" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="584.0" cy="228" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="584.0" y="229" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">6</text>
<path d="M 630 156 V 192 H 722 V 156" fill="none" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="676.0" cy="192" r="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/><text x="676.0" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">7</text>
<rect x="230" y="262" width="340" height="50" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
<text x="400" y="287" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle" dominant-baseline="central">8 tokens - 1 = 7 pairs</text>
<text x="400" y="344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every token except the very last one starts exactly one pair.</text>
<text x="400" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">So a 40-token corpus must give 39 pairs. That is your check.</text>
</svg>
