<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Which way round do the numbers go?</title>
  <desc>Two panels each showing a three by three grid with a vertical stroke down the middle. The left panel is marked wrong: the shaded stroke is numbered 255 and the blank paper is numbered 0, so the picture is inside out. The right panel is marked correct: the shaded stroke is numbered 0 and the blank paper 255.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Which way round do the numbers go?</text><line x1="400" y1="76" x2="400" y2="336" stroke="#C7CDD4" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="40" y="76" width="330" height="252" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/><g transform="translate(58,90) scale(0.44)"><circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/><g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="38" y1="38" x2="62" y2="62"/><line x1="62" y1="38" x2="38" y2="62"/></g></g><text x="112" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">“Pencil = full = 255”</text><rect x="103" y="152" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="125.0" y="178.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="147" y="152" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="169.0" y="178.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="191" y="152" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="213.0" y="178.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="103" y="196" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="125.0" y="222.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="147" y="196" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="169.0" y="222.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="191" y="196" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="213.0" y="222.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="103" y="240" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="125.0" y="266.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="147" y="240" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="169.0" y="266.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="191" y="240" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="213.0" y="266.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="103" y="152" width="132" height="132" fill="none" stroke="#14202B" stroke-width="3"/><text x="205" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The pencil stroke comes out white.</text><text x="205" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Everything is inside out.</text><rect x="430" y="76" width="330" height="252" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/><g transform="translate(448,90) scale(0.44)"><circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/><polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="502" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">“Pencil blocks light = 0”</text><rect x="493" y="152" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="515.0" y="178.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="537" y="152" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="559.0" y="178.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="581" y="152" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="603.0" y="178.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="493" y="196" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="515.0" y="222.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="537" y="196" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="559.0" y="222.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="581" y="196" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="603.0" y="222.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="493" y="240" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="515.0" y="266.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="537" y="240" width="44" height="44" fill="#14202B" stroke="#C7CDD4" stroke-width="1"/><text x="559.0" y="266.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">0</text><rect x="581" y="240" width="44" height="44" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/><text x="603.0" y="266.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">255</text><rect x="493" y="152" width="132" height="132" fill="none" stroke="#14202B" stroke-width="3"/><text x="595" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The pencil stroke comes out dark.</text><text x="595" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The number counts light, not lead.</text><text x="400" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Ask yourself: how much light comes out of that square? A solid black square lets out none of it, so it is 0.</text>
  </g>
</svg>
