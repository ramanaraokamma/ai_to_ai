<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Three tests every project idea must pass</title>
  <desc>Three numbered panels. Panel one, the baseline test: can you name the dumb thing you have to beat and the number it scores? A tick beside DummyClassifier scoring 0.1019, a cross beside the claim it got 97 per cent. Panel two, the offline test: does every row of data come from scikit-learn or from numpy in your own file? A tick beside load_digits and make_moons, a cross beside downloading CIFAR-10. Panel three, the honest-number test: can you say which pile the score came from, how many rows, and the seed? A tick beside 0.9833 on 540 held out with seed 0, a cross beside about 98 per cent. Each panel warns that failing it cannot be rescued later.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Three tests every project idea must pass</text>
  <rect x="24" y="82" width="244" height="262" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="52" cy="110" r="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2"/><text x="52" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="74" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">THE BASELINE TEST</text>
  <text x="40" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Can you name the dumb thing</text>
  <text x="40" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">you have to beat, and the</text>
  <text x="40" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">number it scores?</text>
  <line x1="36" y1="222" x2="256" y2="222" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 238 L47 246 L60 227" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">DummyClassifier: 0.1019</text>
  <path d="M42 264 L58 280" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 264 L42 280" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">&#8220;It got 97%!&#8221;</text>
  <text x="40" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">fail this one and the</text>
  <text x="40" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">project cannot be rescued</text>
  <rect x="276" y="82" width="244" height="262" rx="12" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="304" cy="110" r="12" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2"/><text x="304" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="326" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">THE OFFLINE TEST</text>
  <text x="292" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Does every row of data come</text>
  <text x="292" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">from sklearn, or from numpy</text>
  <text x="292" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">in your own file?</text>
  <line x1="288" y1="222" x2="508" y2="222" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M292 238 L299 246 L312 227" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="318" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">load_digits() &#183; make_moons()</text>
  <path d="M294 264 L310 280" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 264 L294 280" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">&#8220;I&#8217;ll download CIFAR-10&#8221;</text>
  <text x="292" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">fail this one and the</text>
  <text x="292" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">project cannot be rescued</text>
  <rect x="528" y="82" width="244" height="262" rx="12" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="556" cy="110" r="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2"/><text x="556" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="578" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" dominant-baseline="central">THE HONEST-NUMBER TEST</text>
  <text x="544" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Can you say which pile the</text>
  <text x="544" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">score came from, how many</text>
  <text x="544" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">rows, and the seed?</text>
  <line x1="540" y1="222" x2="760" y2="222" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M544 238 L551 246 L564 227" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="570" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1B7A4B">0.9833 on 540 rows, seed 0</text>
  <path d="M546 264 L562 280" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M562 264 L546 280" fill="none" stroke="#CC2B1D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="572" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D">&#8220;about 98 per cent&#8221;</text>
  <text x="544" y="310" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">fail this one and the</text>
  <text x="544" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">project cannot be rescued</text>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Run an idea through all three before you type a single line.</text>
</svg>
