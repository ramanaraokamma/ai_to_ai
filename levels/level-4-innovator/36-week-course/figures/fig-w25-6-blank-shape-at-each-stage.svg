<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Fill in the shape of the data at each of six stages of the index</title>
  <desc>Blank worksheet. Six numbered boxes in two rows of three joined by arrows: the letter-piece table, the table after the SVD squeeze, the length of one row of the index after normalising, one question encoded, the scores from the matrix multiply, and what np.argsort(-sims)[:3] returns. Each box has an empty dashed answer box for the student to fill. No shapes are written in.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Shape at each stage of the index</text>
