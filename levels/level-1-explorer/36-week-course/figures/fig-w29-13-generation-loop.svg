<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>The whole engine, four steps round a circle</title>
  <desc>Four numbered boxes arranged in a circle joined by arrows: you are at a word, look up its group, pick one follower, say it and now you are there.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#14202B" text-anchor="middle">The whole engine, four steps round a circle</text>
  <path d="M360 116 Q404 150 395 204" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-12,-8 0,0 -12,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(395 206) rotate(90)"/>
  <path d="M392 304 Q386 374 366 394" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-12,-8 0,0 -12,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(364 396) rotate(160)"/>
  <path d="M144 420 Q68 410 104 316" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-12,-8 0,0 -12,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(104 314) rotate(-78)"/>
  <path d="M108 220 Q118 142 142 124" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-12,-8 0,0 -12,8" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(144 122) rotate(-38)"/>
  <rect x="145" y="84" width="210" height="54" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="168" cy="111" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="168" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="258" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">you are at a word</text>
  <rect x="310" y="222" width="170" height="80" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="334" cy="248" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="334" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="395" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">look up</text>
  <text x="395" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">its group</text>
  <rect x="145" y="386" width="210" height="54" rx="10" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="168" cy="413" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="168" y="414" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="258" y="414" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">pick one follower</text>
  <rect x="20" y="222" width="170" height="80" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="44" cy="248" r="13" fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5"/>
  <text x="44" y="249" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="105" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">say it — now</text>
  <text x="105" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B" text-anchor="middle" dominant-baseline="central">you are there</text>
  <text x="250" y="254" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">round and round</text>
  <text x="250" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">one word at a time</text>
  <text x="250" y="472" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Stop when you reach a full stop. That is all generation is.</text>
</svg>
