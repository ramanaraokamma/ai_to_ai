<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The two halves of a network class</title>
  <desc>On the left, a box headed declare the parts holds four labelled parts: fc1 which is 64 in and 64 out, a ReLU, a dropout of 0.2, and fc2 which is 64 in and 10 out. On the right, a box headed say how a batch flows shows a batch of shape 32 by 64 passing through fc1, ReLU, dropout and fc2, ending at shape 32 by 10. Underneath: 64 times 64 plus 64 is 4160, 10 times 64 plus 10 is 650, and 4160 plus 650 is 4810 learnable numbers.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A network class is two lists, not one</text>
  <rect x="40" y="70" width="340" height="216" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="210" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">declare the parts you will need</text>
  <text x="210" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">runs once, when you build the model</text>
  <rect x="60" y="128" width="300" height="32" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="74" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">fc1</text>
  <text x="180" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">64 in &#8594; 64 out</text>
  <text x="352" y="149" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">4160</text>
  <rect x="60" y="166" width="300" height="32" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="74" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">ReLU</text>
  <text x="180" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">no numbers at all</text>
  <text x="352" y="187" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0</text>
  <rect x="60" y="204" width="300" height="32" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="74" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">dropout 0.2</text>
  <text x="180" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">no numbers at all</text>
  <text x="352" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">0</text>
  <rect x="60" y="242" width="300" height="32" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="2" stroke-linejoin="round"/>
  <text x="74" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">fc2</text>
  <text x="180" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">64 in &#8594; 10 out</text>
  <text x="352" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="end">650</text>
  <rect x="420" y="70" width="340" height="216" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="590" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">say how one batch flows</text>
  <text x="590" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">runs every time you call the model</text>
  <rect x="444.2" y="130" width="75.6" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="482" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(32, 64)</text>
  <text x="556" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">a batch of 32 digits</text>
  <line x1="482" y1="158" x2="482" y2="166" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(482 166) rotate(90)"/>
  <rect x="444.2" y="168" width="75.6" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="482" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(32, 64)</text>
  <text x="556" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">after fc1 and ReLU</text>
  <line x1="482" y1="196" x2="482" y2="204" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(482 204) rotate(90)"/>
  <rect x="444.2" y="206" width="75.6" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="482" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(32, 64)</text>
  <text x="556" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">after dropout</text>
  <line x1="482" y1="234" x2="482" y2="242" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(482 242) rotate(90)"/>
  <rect x="444.2" y="244" width="75.6" height="26" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="482" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">(32, 10)</text>
  <text x="556" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F">after fc2: ten scores each</text>
  <rect x="40" y="300" width="720" height="76" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">fc1: 64 &#215; 64 + 64 = 4160        fc2: 10 &#215; 64 + 10 = 650</text>
  <text x="400" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4160 + 650 = 4810 learnable numbers, and PyTorch prints 4810</text>
</svg>
