<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The paper spreads 75 marks over five sections, and the biggest single question comes last</title>
  <desc>One bar split into five blocks wide in proportion to their marks. A is 20 marks of multiple choice, 15 minutes. B is 16 marks, 8 what-does-this-print questions, 15 minutes. C is 12 marks, 4 find-the-bug questions, 10 minutes. D is 15 marks, 3 pieces of arithmetic, 15 minutes. E is 12 marks, one longer question on real tables, 13 minutes, highlighted. Beneath: 20 plus 16 plus 12 plus 15 plus 12 equals 75 marks in 70 minutes.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The paper: 75 marks in five sections</text>
  <rect x="60" y="110" width="180" height="90" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="150" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A</text>
  <text x="150" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">20 marks</text>
  <text x="150" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">20 multiple</text>
  <text x="150" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">choice</text>
  <text x="150" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">15 min</text>
  <rect x="240" y="110" width="144" height="90" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="312" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">B</text>
  <text x="312" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">16 marks</text>
  <text x="312" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">8 what does</text>
  <text x="312" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">this print?</text>
  <text x="312" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">15 min</text>
  <rect x="384" y="110" width="108" height="90" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="438" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">C</text>
  <text x="438" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">12 marks</text>
  <text x="438" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">4 find</text>
  <text x="438" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the bug</text>
  <text x="438" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">10 min</text>
  <rect x="492" y="110" width="135" height="90" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="559.5" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">D</text>
  <text x="559.5" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">15 marks</text>
  <text x="559.5" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 pieces of</text>
  <text x="559.5" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">arithmetic</text>
  <text x="559.5" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">15 min</text>
  <rect x="627" y="110" width="108" height="90" fill="#F4D5E9" stroke="#C42B8C" stroke-width="4"/>
  <text x="681" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">E</text>
  <text x="681" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">12 marks</text>
  <text x="681" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1 longer</text>
  <text x="681" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">question on</text>
  <text x="681" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">real tables</text>
  <text x="681" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">13 min</text>
  <path d="M60 100 V92 H735 V100" fill="none" stroke="#55636F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="397" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Weeks 19&#8211;26, as an X-ray, not a grade</text>
  <text x="735" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">start E with about 13 minutes left</text>
  <rect x="30" y="338" width="740" height="32" rx="8" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="400" y="359" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">20 + 16 + 12 + 15 + 12 = 75 marks  &#183;  70 minutes  &#183;  pen and calculator, no computer</text>
</svg>
