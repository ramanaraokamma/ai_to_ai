  <text x="145" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="200" y1="380" x2="200" y2="386" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <line x1="255" y1="380" x2="255" y2="386" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="255" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
  <line x1="310" y1="380" x2="310" y2="386" stroke="#55636F" stroke-width="1.5" stroke-linecap="round"/>
