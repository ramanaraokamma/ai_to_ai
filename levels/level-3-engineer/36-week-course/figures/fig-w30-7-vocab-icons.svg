<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>This week&#8217;s six words, drawn</title>
  <desc>Six small pictures. Silhouette score is one pink point joined by two short green lines to its two clustermates and by one long dashed red line to a distant group, with a equals 1.7071, b equals 7.8943 and 7.8943 minus 1.7071 divided by 7.8943 equals 0.7838. Adjusted Rand index is two label strings, 0 0 0 1 1 and 2 2 2 0 0, described as different numbers but the same grouping, giving ARI equals 1.0000, because the numbers are ignored. Cluster profile is a two-row table in the original units, flavanoids 0.82 against an overall 2.03, with the note that alcohol 13.13 against 13.00 defends nothing. Elbow is a falling six-dot curve with the third point ringed, and 381.1 divided by 97.2 equals 3.9 with the silhouette peak also at k equals 3. Negative control is a scatter of red noise dots arrowed into a box reading three tidy clusters, from 178 rows of pure noise, silhouette 0.0776, and that number is your floor. Cluster ID as a feature is a blue block shaped 30 by 13 arrowed into a purple block shaped 30 by 18, three centre distances plus two principal components, and 141 of 148 becomes 145 of 148.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">This week&#8217;s six words, drawn</text>
