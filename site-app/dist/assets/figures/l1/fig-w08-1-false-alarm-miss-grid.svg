<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The two ways of being wrong</title>
  <desc>A two by two grid. Down the side is the truth, spam or ham. Across the top is what the rulebook predicted, spam or ham. The two diagonal cells are ticked and correct. The top right cell is a miss, a scam left in your inbox. The bottom left cell is a false alarm, a friend's message thrown in the bin.</desc>
  <text x="250" y="38" font-size="24" fill="#14202B" text-anchor="middle">The two ways of being wrong</text>

  <text x="290" y="72" font-size="14" fill="#55636F" text-anchor="middle">WHAT THE RULEBOOK SAID</text>
  <text x="215" y="114" font-size="18" fill="#14202B" text-anchor="middle">"spam"</text>
  <text x="365" y="114" font-size="18" fill="#14202B" text-anchor="middle">"ham"</text>
  <text x="72" y="280" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 72 280)">THE TRUTH</text>
  <text x="130" y="210" font-size="18" fill="#14202B" text-anchor="end">spam</text>
  <text x="130" y="360" font-size="18" fill="#14202B" text-anchor="end">ham</text>

  <rect x="140" y="130" width="150" height="150" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="290" y="130" width="150" height="150" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="140" y="280" width="150" height="150" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="290" y="280" width="150" height="150" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>

  <g transform="translate(195,148) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="215" y="222" font-size="16" fill="#14202B" text-anchor="middle">CAUGHT IT</text>
  <text x="215" y="244" font-size="12" fill="#55636F" text-anchor="middle">the scam is blocked</text>
  <text x="215" y="262" font-size="12" fill="#55636F" text-anchor="middle">nobody is hurt</text>

  <g transform="translate(345,148) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="365" y="222" font-size="16" fill="#14202B" text-anchor="middle">A MISS</text>
  <text x="365" y="244" font-size="12" fill="#55636F" text-anchor="middle">a scam sits in your</text>
  <text x="365" y="262" font-size="12" fill="#55636F" text-anchor="middle">inbox looking normal</text>

  <g transform="translate(195,298) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3"/>
    <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="38" x2="62" y2="62"/>
      <line x1="62" y1="38" x2="38" y2="62"/>
    </g>
  </g>
  <text x="215" y="372" font-size="16" fill="#14202B" text-anchor="middle">A FALSE ALARM</text>
  <text x="215" y="394" font-size="12" fill="#55636F" text-anchor="middle">your friend's good news</text>
  <text x="215" y="412" font-size="12" fill="#55636F" text-anchor="middle">goes in the junk bin</text>

  <g transform="translate(345,298) scale(0.4)">
    <circle cx="50" cy="50" r="34" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
    <polyline points="34,52 45,64 68,38" fill="none" stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="365" y="372" font-size="16" fill="#14202B" text-anchor="middle">LEFT ALONE</text>
  <text x="365" y="394" font-size="12" fill="#55636F" text-anchor="middle">the message arrives</text>
  <text x="365" y="412" font-size="12" fill="#55636F" text-anchor="middle">exactly as it should</text>

  <text x="250" y="466" font-size="14" fill="#55636F" text-anchor="middle">Two cells are right. The other two are wrong in completely different ways.</text>
</svg>
