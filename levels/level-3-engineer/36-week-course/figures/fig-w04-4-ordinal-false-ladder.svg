<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The ladder that is not there</title>
  <desc>A chart of how often each of five restaurants is late, against the alphabetical code 0 to 4 that an ordinal encoder would invent. The five true rates, numbered 1 to 5, zig-zag: 0.3715, 0.2787, 0.2336, 0.2899 and 0.2835. A single straight line shows what one weight on the code can produce: 0.3260, 0.3070, 0.2886, 0.2710 and 0.2540. A matching table on the right lists the truth, what the straight line says, and what one-hot encoding says, which is 0.3705, 0.2789, 0.2341, 0.2899 and 0.2837. For Napoli the line says 0.2886 while the truth is 0.2336, out by 0.0550.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">The ladder that is not there</text>
  <line x1="90" y1="300" x2="430" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="90" y1="110" x2="90" y2="300" stroke="#14202B" stroke-width="2"/>
  <line x1="84" y1="300.0" x2="90" y2="300.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="80" y="300.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.20</text>
  <line x1="84" y1="255.0" x2="90" y2="255.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="80" y="255.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.25</text>
  <line x1="84" y1="210.0" x2="90" y2="210.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="80" y="210.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.30</text>
  <line x1="84" y1="165.00000000000003" x2="90" y2="165.00000000000003" stroke="#55636F" stroke-width="1.5"/>
  <text x="80" y="165.00000000000003" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.35</text>
  <line x1="84" y1="120.0" x2="90" y2="120.0" stroke="#55636F" stroke-width="1.5"/>
  <text x="80" y="120.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end" dominant-baseline="central">0.40</text>
  <text x="40" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" transform="rotate(-90 40 200)">late rate</text>
  <line x1="122" y1="300" x2="122" y2="306" stroke="#55636F" stroke-width="1.5"/>
  <text x="122" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0</text>
  <line x1="194" y1="300" x2="194" y2="306" stroke="#55636F" stroke-width="1.5"/>
  <text x="194" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">1</text>
  <line x1="266" y1="300" x2="266" y2="306" stroke="#55636F" stroke-width="1.5"/>
  <text x="266" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">2</text>
  <line x1="338" y1="300" x2="338" y2="306" stroke="#55636F" stroke-width="1.5"/>
  <text x="338" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3</text>
