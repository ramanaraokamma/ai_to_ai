  <text x="240" y="674" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">at d = 128: MLP 131,712 of 197,888 knobs, two thirds</text>
