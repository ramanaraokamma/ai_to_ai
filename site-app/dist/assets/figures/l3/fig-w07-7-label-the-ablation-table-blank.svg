<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 590" role="img">
  <title>Label the ablation table</title>
  <desc>An eight-row ablation table with the validation AUC column filled in and the delta and keep-or-drop columns left as empty dashed pink boxes. Row 1 is the baseline at 0.7541 with a dash for its delta. The other rows are plus is_rush 0.7586, plus is_weekend 0.7585, plus min_per_km 0.7536, plus items_per_km 0.7590, scaler to MinMax 0.7579, drop order_hour 0.7599 and drop day_of_week 0.7576. A panel underneath asks which number rows 3 to 8 are measured against, with a write-in line.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the ablation table</text>
  <text x="250" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Every row is one change. Fill in each &#916; and each verdict.</text>
  <rect x="30" y="86" width="440" height="40" rx="10" fill="#F5F8FA" stroke="#14202B" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B">what I changed</text>
  <text x="250" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">val AUC</text>
  <text x="346" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">&#916;</text>
  <text x="424" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle">keep / drop</text>
  <rect x="30" y="126" width="440" height="44" rx="0" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="46" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">1  baseline (Week 3)</text>
  <text x="250" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F6FB2" text-anchor="middle">0.7541</text>
  <text x="346" y="153" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#55636F" text-anchor="middle">&#8212;</text>
  <rect x="392" y="137" width="64" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="170" width="440" height="44" rx="0" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="46" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">2  + is_rush</text>
  <text x="250" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F6FB2" text-anchor="middle">0.7586</text>
  <rect x="310" y="181" width="72" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="392" y="181" width="64" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="214" width="440" height="44" rx="0" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="46" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#14202B">3  + is_weekend</text>
  <text x="250" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F6FB2" text-anchor="middle">0.7585</text>
  <rect x="310" y="225" width="72" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="392" y="225" width="64" height="24" rx="6" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <rect x="30" y="258" width="440" height="44" rx="0" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
