<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Forward in blue, backward in pink, over the same wires</title>
  <desc>A small network with two input circles holding 1.0 and 2.0, two hidden circles holding 2.20 and 0.15, and one output circle holding 0.900. A solid blue arrow runs left to right above it labelled FORWARD, numbers flow right, ending at loss 0.577449. A dashed pink arrow runs right to left below it labelled BACKWARD, blame flows left, ending at dW1. A callout shows A2 minus y equals minus 0.09975, shared over 4 rows to give minus 0.024938.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Forward in blue, backward in pink, over the same wires</text>
  <text x="400" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2" text-anchor="middle">FORWARD &#8212; numbers flow right</text>
  <line x1="150" y1="96" x2="650" y2="96" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(650 96) rotate(0.0)"/>
  <text x="660" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1F6FB2">loss 0.577449</text>
  <line x1="186" y1="168" x2="328" y2="152" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="186" y1="168" x2="328" y2="236" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="186" y1="232" x2="328" y2="152" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="186" y1="232" x2="328" y2="236" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="372" y1="152" x2="512" y2="200" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="372" y1="236" x2="512" y2="200" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="168" cy="168" r="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="168" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">1.0</text>
  <circle cx="168" cy="232" r="20" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3"/>
  <text x="168" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.0</text>
  <circle cx="350" cy="152" r="22" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="350" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">2.20</text>
  <circle cx="350" cy="236" r="22" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3"/>
  <text x="350" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.15</text>
  <circle cx="534" cy="200" r="24" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3"/>
  <text x="534" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">0.900</text>
  <text x="168" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">x, row 0</text>
  <text x="350" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A1 after ReLU</text>
  <text x="578" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">A2</text>
  <text x="258" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6D28D9" text-anchor="middle">W1</text>
  <text x="444" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6D28D9" text-anchor="middle">W2</text>
  <line x1="650" y1="300" x2="150" y2="300" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/>
  <polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#C42B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(150 300) rotate(180)"/>
  <text x="400" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="middle">BACKWARD &#8212; blame flows left, along the same wires</text>
  <text x="660" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C">start here</text>
  <text x="140" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="end">dW1</text>
  <text x="534" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">dZ2 = &#8722;0.024938</text>
  <text x="350" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">dZ1 col 0 = &#8722;0.024938</text>
  <rect x="600" y="116" width="180" height="122" rx="12" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round"/>
  <text x="690" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">one number, four uses</text>
  <line x1="610" y1="148" x2="770" y2="148" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="690" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">A2 &#8722; y = &#8722;0.09975</text>
  <text x="690" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">share over 4 rows:</text>
  <text x="690" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">&#8722;0.09975 &#247; 4</text>
  <text x="690" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C42B8C" text-anchor="middle">= &#8722;0.024938</text>
  <text x="400" y="358" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Three cues tell the passes apart: the arrowhead, solid against dashed, and the words.</text>
  <text x="400" y="375" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Same weights both times &#8212; forwards to predict, backwards to apportion blame.</text>
</svg>
