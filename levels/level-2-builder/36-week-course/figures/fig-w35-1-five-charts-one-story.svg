<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Five charts, read aloud, are one paragraph</title>
  <desc>Five numbered chart panels in a row: a histogram, a scatter, a bar chart, a pair of histograms and a two-series scatter. A caption fragment sits under each, and a panel beneath joins all five fragments into a single paragraph.</desc>
<text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Five charts, read aloud, are one paragraph</text>
<rect x="20" y="96" width="132" height="140" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="40" y1="116" x2="40" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="216" x2="136" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<rect x="45.0" y="188.4" width="12.7" height="27.6" fill="#1F6FB2"/>
<rect x="59.7" y="159.0" width="12.7" height="57.0" fill="#1F6FB2"/>
<rect x="74.3" y="128.6" width="12.7" height="87.4" fill="#1F6FB2"/>
<rect x="89.0" y="151.6" width="12.7" height="64.4" fill="#1F6FB2"/>
<rect x="103.7" y="179.2" width="12.7" height="36.8" fill="#1F6FB2"/>
<rect x="118.3" y="199.4" width="12.7" height="16.6" fill="#1F6FB2"/>
<text x="86" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">1. Most are short,</text>
<text x="86" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">a few are long.</text>
<rect x="177" y="96" width="132" height="140" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="197" y1="116" x2="197" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<line x1="197" y1="216" x2="293" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<circle cx="211.4" cy="192.4" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="221.5" cy="180.1" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="231.6" cy="185.4" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="241.6" cy="166.0" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="251.7" cy="157.2" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="261.8" cy="161.6" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="271.9" cy="141.4" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="280.3" cy="132.6" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="243" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">2. Distance explains</text>
<text x="243" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">some of it, not all.</text>
<rect x="334" y="96" width="132" height="140" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="354" y1="116" x2="354" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<line x1="354" y1="216" x2="450" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<rect x="364.0" y="133.2" width="22.3" height="82.8" rx="3" fill="#1F6FB2"/>
<rect x="392.3" y="181.0" width="22.3" height="35.0" rx="3" fill="#1F6FB2"/>
<rect x="420.7" y="170.0" width="22.3" height="46.0" rx="3" fill="#1F6FB2"/>
<text x="400" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">3. Walking is the</text>
<text x="400" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">slowest mode by far.</text>
<rect x="491" y="96" width="132" height="140" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="505.0" y1="116" x2="505.0" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<line x1="505.0" y1="216" x2="553.0" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<rect x="509.0" y="190.2" width="6.9" height="25.8" fill="#1F6FB2"/>
<rect x="517.4" y="165.4" width="6.9" height="50.6" fill="#1F6FB2"/>
<rect x="525.8" y="133.2" width="6.9" height="82.8" fill="#1F6FB2"/>
<rect x="534.2" y="160.8" width="6.9" height="55.2" fill="#1F6FB2"/>
<rect x="542.6" y="188.4" width="6.9" height="27.6" fill="#1F6FB2"/>
<line x1="565.0" y1="116" x2="565.0" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<line x1="565.0" y1="216" x2="613.0" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<rect x="569.0" y="197.6" width="6.9" height="18.4" fill="#1F6FB2"/>
<rect x="577.4" y="128.6" width="6.9" height="87.4" fill="#1F6FB2"/>
<rect x="585.8" y="174.6" width="6.9" height="41.4" fill="#1F6FB2"/>
<rect x="594.2" y="202.2" width="6.9" height="13.8" fill="#1F6FB2"/>
<rect x="602.6" y="208.6" width="6.9" height="7.4" fill="#1F6FB2"/>
<text x="557" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">4. But walking also</text>
<text x="557" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">varies the most.</text>
<rect x="648" y="96" width="132" height="140" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="668" y1="116" x2="668" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<line x1="668" y1="216" x2="764" y2="216" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
<path d="M682.4 187.4 L687.4 196.4 L677.4 196.4 Z" fill="#1B7A4B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="692.5" cy="180.1" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="M702.6 180.4 L707.6 189.4 L697.6 189.4 Z" fill="#1B7A4B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="712.6" cy="166.0" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="M722.7 152.2 L727.7 161.2 L717.7 161.2 Z" fill="#1B7A4B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="732.8" cy="161.6" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="M742.9 136.4 L747.9 145.4 L737.9 145.4 Z" fill="#1B7A4B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="751.3" cy="132.6" r="4.5" fill="#1F6FB2" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="714" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">5. So there are two</text>
<text x="714" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">slopes, not one.</text>
<rect x="30" y="296" width="740" height="56" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="400" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">Most are short, a few are long. Distance explains some of it, not all.</text>
<text x="400" y="338" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">Walking is the slowest mode by far - but it varies most, so there are two slopes, not one.</text>
<text x="400" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">If the five captions do not read as one paragraph, the charts are in the wrong order.</text>
</svg>
