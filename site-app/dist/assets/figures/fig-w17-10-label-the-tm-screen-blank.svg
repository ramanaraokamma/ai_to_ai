<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the five clicks</title>
  <desc>An unlabelled drawing of the Teachable Machine screen with five numbered markers: the menu, the pencil beside a class name, the Webcam button, the Add a class strip, and the Train Model button. Five empty boxes on the right are for the student to write what each click does.</desc>
