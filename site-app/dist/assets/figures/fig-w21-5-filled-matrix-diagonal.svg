<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>A filled confusion matrix with the diagonal shaded and one mistake circled</title>
  <desc>A three by three grid filled in. The diagonal cells, shaded green, read five, four and two. The cell where true comb meets said toothbrush reads two and is shaded red, with a leader line to a caption reading two combs were called toothbrush. Row totals are five, five and five, and a line underneath states the diagonal five plus four plus two equals eleven, the correct count.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <text x="250" y="34" font-size="24" fill="#14202B" text-anchor="middle">The same fifteen photos, as a grid</text>

    <text x="34" y="216" font-size="14" fill="#55636F" text-anchor="middle" transform="rotate(-90 34 216)">THE TRUTH</text>

    <g fill="#D9EAF9" stroke="#1F6FB2" stroke-width="1.5">
      <rect x="160" y="86" width="80" height="40"/>
      <rect x="240" y="86" width="80" height="40"/>
      <rect x="320" y="86" width="80" height="40"/>
      <rect x="400" y="86" width="80" height="40"/>
    </g>
    <g font-size="12" fill="#14202B" text-anchor="middle">
      <text x="200" y="102">said</text><text x="200" y="118">spoon</text>
      <text x="280" y="102">said</text><text x="280" y="118">toothbrush</text>
      <text x="360" y="102">said</text><text x="360" y="118">comb</text>
      <text x="440" y="102">row</text><text x="440" y="118">total</text>
    </g>

    <g fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5">
      <rect x="240" y="126" width="80" height="60"/><rect x="320" y="126" width="80" height="60"/>
      <rect x="160" y="186" width="80" height="60"/><rect x="320" y="186" width="80" height="60"/>
      <rect x="160" y="246" width="80" height="60"/>
    </g>

    <g fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round">
      <rect x="160" y="126" width="80" height="60"/>
      <rect x="240" y="186" width="80" height="60"/>
      <rect x="320" y="246" width="80" height="60"/>
    </g>

    <rect x="240" y="246" width="80" height="60" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

    <g fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5">
      <rect x="400" y="126" width="80" height="60"/>
      <rect x="400" y="186" width="80" height="60"/>
      <rect x="400" y="246" width="80" height="60"/>
    </g>

    <g font-size="20" fill="#14202B" text-anchor="middle">
      <text x="200" y="163">5</text><text x="280" y="163">0</text><text x="360" y="163">0</text>
      <text x="200" y="223">0</text><text x="280" y="223">4</text><text x="360" y="223">1</text>
      <text x="200" y="283">1</text><text x="280" y="283">2</text><text x="360" y="283">2</text>
    </g>
    <g font-size="18" fill="#55636F" text-anchor="middle">
      <text x="440" y="162">5</text><text x="440" y="222">5</text><text x="440" y="282">5</text>
    </g>

    <g font-size="14" fill="#14202B" text-anchor="end">
      <text x="152" y="161">true spoon</text>
      <text x="152" y="221">true toothbrush</text>
      <text x="152" y="281">true comb</text>
    </g>

    <rect x="160" y="86" width="320" height="220" fill="none" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <line x1="160" y1="126" x2="480" y2="126" stroke="#14202B" stroke-width="3"/>
    <line x1="400" y1="86" x2="400" y2="306" stroke="#14202B" stroke-width="3"/>

    <line x1="280" y1="306" x2="280" y2="352" stroke="#CC2B1D" stroke-width="2"/>
    <rect x="60" y="352" width="420" height="60" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
    <text x="270" y="378" font-size="18" fill="#14202B" text-anchor="middle">"Two combs were called toothbrush."</text>
    <text x="270" y="400" font-size="14" fill="#14202B" text-anchor="middle">The biggest number that is not on the diagonal.</text>

    <text x="250" y="444" font-size="18" fill="#14202B" text-anchor="middle">diagonal: 5 + 4 + 2 = 11 = the correct count</text>
    <text x="250" y="474" font-size="14" fill="#55636F" text-anchor="middle">Every cell off the green line is one mistake you can say out loud.</text>
  </g>
</svg>
