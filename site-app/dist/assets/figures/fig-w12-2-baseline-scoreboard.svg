<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img">
  <title>Score every feature against the baseline</title>
  <desc>A bar chart of five features from the fruit bowl table, with a dashed baseline at 33.3 percent. bowl_quadrant scores exactly 33.3 percent and sits on the line. length_cm scores 66.7, mass_g 83.3 and colour 91.7, all above it. sticker_says scores 100 percent, is drawn in red and is marked LEAK.</desc>
  <text x="250" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Score every feature against the baseline</text>

  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="100" y1="400" x2="470" y2="400"/>
    <line x1="100" y1="322.5" x2="470" y2="322.5"/>
    <line x1="100" y1="245" x2="470" y2="245"/>
    <line x1="100" y1="167.5" x2="470" y2="167.5"/>
    <line x1="100" y1="90" x2="470" y2="90"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="end">
    <text x="90" y="404">0</text><text x="90" y="326">25</text><text x="90" y="249">50</text>
    <text x="90" y="171">75</text><text x="90" y="94">100</text>
  </g>

  <rect x="123" y="296.8" width="46" height="103.2" fill="#1F6FB2"/>
  <rect x="195" y="193.2" width="46" height="206.8" fill="#1F6FB2"/>
  <rect x="267" y="141.8" width="46" height="258.2" fill="#1F6FB2"/>
  <rect x="339" y="115.7" width="46" height="284.3" fill="#1F6FB2"/>
  <rect x="411" y="90" width="46" height="310" fill="#CC2B1D"/>

  <line x1="100" y1="296.8" x2="470" y2="296.8" stroke="#C42B8C" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="468" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C42B8C" text-anchor="end">baseline 33.3% &#8212; guess the commonest label</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">
    <text x="146" y="286">33.3%</text>
    <text x="218" y="183">66.7%</text>
    <text x="290" y="132">83.3%</text>
    <text x="362" y="105">91.7%</text>
    <text x="434" y="80">100%</text>
  </g>
  <rect x="412" y="130" width="44" height="24" rx="6" fill="#FFFFFF" stroke="#CC2B1D" stroke-width="2" stroke-linejoin="round"/>
  <text x="434" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle" dominant-baseline="central">LEAK</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">
    <text x="146" y="422">quadrant</text>
    <text x="218" y="422">length_cm</text>
    <text x="290" y="422">mass_g</text>
    <text x="362" y="422">colour</text>
    <text x="434" y="422">sticker</text>
  </g>
  <line x1="100" y1="400" x2="470" y2="400" stroke="#14202B" stroke-width="2"/>

  <text x="250" y="454" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Sitting on the line means the feature told you nothing at all.</text>
  <text x="250" y="476" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">100% means stop and go looking for the leak.</text>
</svg>
