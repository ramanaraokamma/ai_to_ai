  <text x="400" y="364" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Ship the model at the BOTTOM of the test curve: depth 5, MAE 45.94.</text>
  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">Depth 20 memorised 353 patients perfectly and is worse than one yes/no question.</text>
