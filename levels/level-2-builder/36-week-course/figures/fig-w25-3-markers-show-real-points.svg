<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Markers show how much you really measured</title>
  <desc>Three panels showing the same rising-then-dipping line. The first has no markers and is crossed out. The second puts hollow circles on four points. The third puts them on thirteen. The line itself is identical in all three.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Markers show how much you really measured</text>
  <text x="141" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">What you are shown</text>
  <rect x="20" y="78" width="242" height="190" rx="12" fill="None" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
  <line x1="48" y1="108" x2="48" y2="250" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="250" x2="248" y2="250" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="54.0,226.0 68.8,212.5 83.7,199.0 98.6,185.5 113.4,172.0 128.5,176.5 143.6,181.0 158.6,185.5 173.7,190.0 188.8,176.5 203.8,163.0 218.9,149.5 234.0,136.0" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#CC2B1D" stroke-width="6" stroke-linecap="round"><line x1="212" y1="100" x2="228" y2="116"/><line x1="228" y1="100" x2="212" y2="116"/></g>
  <text x="141" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">You cannot tell.</text>
  <text x="399" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">It could be this</text>
  <rect x="278" y="78" width="242" height="190" rx="12" fill="None" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="306" y1="108" x2="306" y2="250" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="306" y1="250" x2="506" y2="250" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="312.0,226.0 326.9,212.5 341.7,199.0 356.6,185.5 371.4,172.0 386.5,176.5 401.6,181.0 416.6,185.5 431.7,190.0 446.8,176.5 461.9,163.0 476.9,149.5 492.0,136.0" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="312.0" cy="226.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="371.4" cy="172.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="431.7" cy="190.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="492.0" cy="136.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="399" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">4 real measurements</text>
  <text x="657" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">Or exactly this</text>
  <rect x="536" y="78" width="242" height="190" rx="12" fill="None" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <line x1="564" y1="108" x2="564" y2="250" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <line x1="564" y1="250" x2="764" y2="250" stroke="#14202B" stroke-width="2" stroke-linecap="round"/>
  <polyline points="570.0,226.0 584.9,212.5 599.7,199.0 614.5,185.5 629.4,172.0 644.5,176.5 659.5,181.0 674.6,185.5 689.7,190.0 704.8,176.5 719.9,163.0 734.9,149.5 750.0,136.0" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="570.0" cy="226.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="584.9" cy="212.5" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="599.7" cy="199.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="614.5" cy="185.5" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="629.4" cy="172.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="644.5" cy="176.5" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="659.5" cy="181.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="674.6" cy="185.5" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="689.7" cy="190.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="704.8" cy="176.5" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="719.9" cy="163.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="734.9" cy="149.5" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <circle cx="750.0" cy="136.0" r="5" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="3"/>
  <text x="657" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">13 real measurements</text>
  <text x="400" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The drawn line is byte-for-byte identical in all three panels.</text>
  <text x="400" y="374" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A line with no markers hides how many real points it was drawn from.</text>
</svg>
