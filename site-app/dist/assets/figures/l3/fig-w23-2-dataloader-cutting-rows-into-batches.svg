  <line x1="644.869" y1="96" x2="644.869" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
  <line x1="663.198" y1="96" x2="663.198" y2="150" stroke="#C7CDD4" stroke-width="1.5"/>
