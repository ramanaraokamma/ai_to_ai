<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>More columns is not the same as more signal</title>
  <desc>Two panels from the same ablation table. Left, marked wrong with a red cross: variant F drawn as 24 small blue column blocks, with a red box giving validation AUC 0.7828, and the subtraction 0.7828 minus 0.7829 equals minus 0.0001, so is_weekend bought nothing. Right, marked right with a green tick: variant D drawn as 22 column blocks, with a green box giving validation AUC 0.7843, and the subtraction 0.7843 minus 0.7828 equals plus 0.0015, so two fewer columns score better and D is the one to ship.</desc>
  <text x="400" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">More columns is not the same as more signal</text>
