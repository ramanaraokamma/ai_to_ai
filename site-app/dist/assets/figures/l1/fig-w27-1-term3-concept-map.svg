<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Term 3 in one picture</title>
  <desc>Six labelled boxes joined by arrows, running from hiding the test set, through accuracy and memorising, down to pixels, filters and edges.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Term 3 in one picture</text>
  <rect x="30" y="80" width="222" height="84" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="58" cy="102" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5"/>
  <text x="58" y="106.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">W19</text>
  <text x="155.0" y="129.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">Hide the test set</text>
  <text x="155.0" y="150.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">before you train</text>
  <rect x="289" y="80" width="222" height="84" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="317" cy="102" r="17" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5"/>
  <text x="317" y="106.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">W20</text>
  <text x="414.0" y="129.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">Accuracy, three ways</text>
  <text x="414.0" y="150.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">overall / per class / matrix</text>
  <rect x="548" y="80" width="222" height="84" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="576" cy="102" r="17" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.5"/>
  <text x="576" y="106.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">W21</text>
  <text x="673.0" y="129.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">Memorise vs generalise</text>
  <text x="673.0" y="150.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">great in class, bad in the test</text>
  <rect x="30" y="242" width="222" height="84" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="58" cy="264" r="17" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2.5"/>
  <text x="58" y="268.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">W23</text>
  <text x="155.0" y="291.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">A pixel is a number</text>
  <text x="155.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">0 = black, 255 = white</text>
  <rect x="289" y="242" width="222" height="84" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="317" cy="264" r="17" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="2.5"/>
  <text x="317" y="268.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">W25</text>
  <text x="414.0" y="291.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">A filter slides and sums</text>
  <text x="414.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">3 x 3 grid of weights</text>
  <rect x="548" y="242" width="222" height="84" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="576" cy="264" r="17" fill="#FFFFFF" stroke="#845F00" stroke-width="2.5"/>
  <text x="576" y="268.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">W26</text>
  <text x="673.0" y="291.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" text-anchor="middle">Edges beat brightness</text>
  <text x="673.0" y="312.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">a difference ignores the lamp</text>
  <line x1="258" y1="122" x2="283" y2="122" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(283 122) rotate(0.0)"/>
  <line x1="517" y1="122" x2="542" y2="122" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(542 122) rotate(0.0)"/>
  <line x1="258" y1="284" x2="283" y2="284" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(283 284) rotate(0.0)"/>
  <line x1="517" y1="284" x2="542" y2="284" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/><polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(542 284) rotate(0.0)"/>
  <path d="M 770 122 V 182 H 30 V 236" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="-13,-8 0,0 -13,8" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(30 236) rotate(90)"/>
  <text x="400" y="176.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">measuring honestly  -&gt;  now look at what is actually inside a photo</text>
  <text x="400" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Every box is a thing you can do with a pencil. None of it is magic and none of it needs a computer.</text>
</svg>
