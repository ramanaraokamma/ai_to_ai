  <polygon points="400,116 394,104 406,104" fill="#14202B" stroke="#14202B" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="376" y="116" width="48" height="24" rx="8" fill="#F4D5E9" stroke="#C42B8C" stroke-width="3" stroke-linejoin="round"/>
