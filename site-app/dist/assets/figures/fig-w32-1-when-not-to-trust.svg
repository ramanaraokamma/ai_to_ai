<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Three times not to trust an AI answer</title>
  <desc>Three cards side by side. Card one, high stakes and hard to undo. Card two, a specific checkable fact. Card three, rare recent local or about you. Each card gives an example and the thing to do instead.</desc>
  <text x="400" y="36" font-size="24" fill="#14202B" text-anchor="middle">Three times not to trust the answer</text>

  <rect x="30" y="62" width="236" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="282" y="62" width="236" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <rect x="534" y="62" width="236" height="250" rx="12" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>

  <g fill="#F4D5E9" stroke="#C42B8C" stroke-width="2.5">
    <circle cx="58" cy="90" r="14"/>
    <circle cx="310" cy="90" r="14"/>
    <circle cx="562" cy="90" r="14"/>
  </g>
  <g font-size="14" fill="#14202B" text-anchor="middle">
    <text x="58" y="95">1</text>
    <text x="310" y="95">2</text>
    <text x="562" y="95">3</text>
  </g>

  <g font-size="18" fill="#14202B" text-anchor="middle">
    <text x="148" y="134">High stakes,</text>
    <text x="148" y="158">hard to undo</text>
    <text x="400" y="134">A specific</text>
    <text x="400" y="158">checkable fact</text>
    <text x="652" y="134">Rare, recent, local,</text>
    <text x="652" y="158">or about you</text>
  </g>

  <g font-size="14" fill="#55636F" text-anchor="middle">
    <text x="148" y="188">a medicine dose,</text>
    <text x="148" y="206">money, someone's name</text>
    <text x="400" y="188">a date, a price,</text>
    <text x="400" y="206">a page number, a quote</text>
    <text x="652" y="188">last Tuesday's school</text>
    <text x="652" y="206">cricket score</text>
  </g>

  <g stroke="#CC2B1D" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="52" y1="224" x2="244" y2="224"/>
    <line x1="304" y1="224" x2="496" y2="224"/>
    <line x1="556" y1="224" x2="748" y2="224"/>
  </g>

  <g font-size="14" fill="#14202B" text-anchor="middle" font-weight="600">
    <text x="148" y="248">DO THIS INSTEAD</text>
    <text x="400" y="248">DO THIS INSTEAD</text>
    <text x="652" y="248">DO THIS INSTEAD</text>
  </g>
  <g font-size="14" fill="#14202B" text-anchor="middle">
    <text x="148" y="274">Treat it as a question</text>
    <text x="148" y="292">to research, not an answer.</text>
    <text x="400" y="274">Check two sources that</text>
    <text x="400" y="292">do not copy each other.</text>
    <text x="652" y="274">Ask a person who</text>
    <text x="652" y="292">was actually there.</text>
  </g>

  <text x="400" y="346" font-size="18" fill="#14202B" text-anchor="middle">Never ask the same AI whether it is sure. It will agree with itself.</text>
  <text x="400" y="378" font-size="14" fill="#55636F" text-anchor="middle">A confident wrong answer and a confident right answer are made by the same machinery.</text>
</svg>
