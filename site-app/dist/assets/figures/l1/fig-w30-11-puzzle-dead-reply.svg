<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Puzzle: two replies can never speak</title>
  <desc>A numbered list of five triggers on the left: pizza, pizza box, price, deliver, delivery area. On the right, three questions with blank write-on lines asking which two triggers can never fire and why.</desc>
  <text x="400" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Puzzle: two replies can never speak</text>
  <rect x="36" y="68" width="340" height="272" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="206" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" font-weight="600">MY TRIGGER LIST, IN ORDER</text>
  <rect x="56" y="112" width="300" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="80" cy="130" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="80" y="131" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="106" y="131" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" dominant-baseline="central">pizza</text>
  <rect x="56" y="156" width="300" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="80" cy="174" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="80" y="175" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="106" y="175" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" dominant-baseline="central">pizza box</text>
  <rect x="56" y="200" width="300" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="80" cy="218" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="80" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="106" y="219" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" dominant-baseline="central">price</text>
  <rect x="56" y="244" width="300" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="80" cy="262" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="80" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="106" y="263" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" dominant-baseline="central">deliver</text>
  <rect x="56" y="288" width="300" height="36" rx="8" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="80" cy="306" r="13" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2"/>
  <text x="80" y="307" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#14202B" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="106" y="307" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#14202B" dominant-baseline="central">delivery area</text>
  <text x="206" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">the loop stops at the first match</text>
  <rect x="396" y="68" width="368" height="272" rx="12" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="580" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle" font-weight="600">YOUR ANSWERS</text>
  <text x="416" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B">Which two can never fire?</text>
  <line x1="416" y1="158" x2="744" y2="158" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="416" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B">Why can each one never fire?</text>
  <line x1="416" y1="228" x2="744" y2="228" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="416" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#14202B">Where should you move them to?</text>
  <line x1="416" y1="298" x2="744" y2="298" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">A trigger that sits below a shorter version of itself is already dead.</text>
</svg>
