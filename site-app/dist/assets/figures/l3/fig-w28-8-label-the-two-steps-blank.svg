<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>Label the two steps</title>
  <desc>Two panels showing the same five points Q1 to Q5 with two cluster centres. In the top panel the centres sit at 1 comma 1 and 7 comma 5 and a dashed line runs from every point to the centre it was given to, with an empty dashed box for the name of that step. In the bottom panel the centres have moved to the middle of what they got, with an empty dashed box for the name of that step. A third panel has four empty dashed boxes: the coordinates of the new left centre, the sigma sum for inertia written out, the inertia total, and the condition that stops the loop.</desc>
  <text x="250" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the two steps</text>
  <text x="250" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F" text-anchor="middle">Q1(0,0)  Q2(0,2)  Q3(2,0)  Q4(6,6)  Q5(8,6)   and k = 2</text>
  <rect x="30" y="84" width="250" height="216" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="2" stroke-linejoin="round"/>
  <text x="44" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#C42B8C" text-anchor="start">panel 1</text>
  <line x1="70" y1="275" x2="95" y2="250" stroke="#55636F" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
