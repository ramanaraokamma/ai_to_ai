<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The four-link bias chain</title>
  <desc>Four stacked boxes joined by downward arrows: a collection habit, then a countable skew in the data, then the model learning the skew, then the named group who gets bad predictions. A note at the bottom says nothing broke.</desc>
  <text x="250" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Bias is a chain, not a bug</text>
  <rect x="30" y="62" width="440" height="112" rx="10" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="214" width="440" height="112" rx="10" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="366" width="440" height="112" rx="10" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <rect x="30" y="518" width="440" height="112" rx="10" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#14202B" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="250" y1="176" x2="250" y2="204"/>
    <polyline points="242,196 250,206 258,196" stroke-linejoin="round"/>
    <line x1="250" y1="328" x2="250" y2="356"/>
    <polyline points="242,348 250,358 258,348" stroke-linejoin="round"/>
    <line x1="250" y1="480" x2="250" y2="508"/>
    <polyline points="242,500 250,510 258,500" stroke-linejoin="round"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B">
    <text x="52" y="92">1. A COLLECTION HABIT</text>
    <text x="52" y="244">2. THE DATA IS SKEWED</text>
    <text x="52" y="396">3. THE MODEL LEARNS IT</text>
    <text x="52" y="548">4. A NAMED GROUP SUFFERS</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F">
    <text x="52" y="120">I only shot photos in the afternoon,</text>
    <text x="52" y="140">because that is when I was free.</text>
    <text x="52" y="160">Nobody decided anything unkind.</text>
    <text x="52" y="272">138 of my 160 training photos are</text>
    <text x="52" y="292">daylight. Only 22 are lamplight.</text>
    <text x="52" y="312">86% versus 14%. A countable number.</text>
    <text x="52" y="424">It found daylight patterns, because</text>
    <text x="52" y="444">that is what it was shown. It never</text>
    <text x="52" y="464">learned what lamplight looks like.</text>
    <text x="52" y="576">Anyone using it in the evening.</text>
    <text x="52" y="596">40% correct, against 90% in daylight:</text>
    <text x="52" y="616">a 50 PERCENTAGE POINT gap.</text>
  </g>
  <text x="250" y="662" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">Nothing broke. Nothing crashed.</text>
  <text x="250" y="676" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">The model learned exactly what it was shown.</text>
  <text x="250" y="694" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">That is why bias is the normal result, not the unlucky one.</text>
</svg>
