<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Mixing light, not paint</title>
  <desc>Six colour swatches with their red green blue triples: red, green, blue, yellow, cyan and magenta. Below, four mixing sums show red plus green makes yellow, green plus blue makes cyan, red plus blue makes magenta, and all three makes white.</desc>
<text x="400" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Mixing light, not paint</text><rect x="32" y="60" width="116" height="60" rx="8" fill="#FF0000" stroke="#14202B" stroke-width="2"/>
<text x="90" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">red</text><text x="90" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(255, 0, 0)</text><rect x="158" y="60" width="116" height="60" rx="8" fill="#00FF00" stroke="#14202B" stroke-width="2"/>
<text x="216" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">green</text><text x="216" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(0, 255, 0)</text><rect x="284" y="60" width="116" height="60" rx="8" fill="#0000FF" stroke="#14202B" stroke-width="2"/>
<text x="342" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">blue</text><text x="342" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(0, 0, 255)</text><rect x="410" y="60" width="116" height="60" rx="8" fill="#FFFF00" stroke="#14202B" stroke-width="2"/>
<text x="468" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">yellow</text><text x="468" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(255, 255, 0)</text><rect x="536" y="60" width="116" height="60" rx="8" fill="#00FFFF" stroke="#14202B" stroke-width="2"/>
<text x="594" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">cyan</text><text x="594" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(0, 255, 255)</text><rect x="662" y="60" width="116" height="60" rx="8" fill="#FF00FF" stroke="#14202B" stroke-width="2"/>
<text x="720" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle">magenta</text><text x="720" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">(255, 0, 255)</text><line x1="32" y1="180" x2="768" y2="180" stroke="#C7CDD4" stroke-width="1.5"/>
<rect x="142" y="198" width="42" height="28" rx="5" fill="#FF0000" stroke="#14202B" stroke-width="2"/>
<text x="190" y="218.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
<rect x="200" y="198" width="42" height="28" rx="5" fill="#00FF00" stroke="#14202B" stroke-width="2"/>
<text x="256" y="218.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
<rect x="272" y="198" width="42" height="28" rx="5" fill="#FFFF00" stroke="#14202B" stroke-width="2"/>
<text x="330" y="217" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">red light + green light = yellow</text><rect x="142" y="236" width="42" height="28" rx="5" fill="#00FF00" stroke="#14202B" stroke-width="2"/>
<text x="190" y="256.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
<rect x="200" y="236" width="42" height="28" rx="5" fill="#0000FF" stroke="#14202B" stroke-width="2"/>
<text x="256" y="256.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
<rect x="272" y="236" width="42" height="28" rx="5" fill="#00FFFF" stroke="#14202B" stroke-width="2"/>
<text x="330" y="255" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">green light + blue light = cyan (sky blue)</text><rect x="142" y="274" width="42" height="28" rx="5" fill="#FF0000" stroke="#14202B" stroke-width="2"/>
<text x="190" y="294.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
<rect x="200" y="274" width="42" height="28" rx="5" fill="#0000FF" stroke="#14202B" stroke-width="2"/>
<text x="256" y="294.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
<rect x="272" y="274" width="42" height="28" rx="5" fill="#FF00FF" stroke="#14202B" stroke-width="2"/>
<text x="330" y="293" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">red light + blue light = magenta (hot pink)</text><rect x="84" y="312" width="42" height="28" rx="5" fill="#FF0000" stroke="#14202B" stroke-width="2"/>
<text x="132" y="332.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
<rect x="142" y="312" width="42" height="28" rx="5" fill="#00FF00" stroke="#14202B" stroke-width="2"/>
<text x="190" y="332.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">+</text>
<rect x="200" y="312" width="42" height="28" rx="5" fill="#0000FF" stroke="#14202B" stroke-width="2"/>
<text x="256" y="332.3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#14202B" text-anchor="middle">=</text>
<rect x="272" y="312" width="42" height="28" rx="5" fill="#FFFFFF" stroke="#14202B" stroke-width="2"/>
<text x="330" y="331" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B">all three at full = white</text><text x="400" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Screens add light. Paint takes light away. That is why red and green make yellow here.</text></svg>
