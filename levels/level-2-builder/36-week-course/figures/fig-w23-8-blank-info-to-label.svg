<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Label the health report of a table</title>
  <desc>A column-by-column health report for a four-column table. A chip at the top states twelve rows. Each column has a filled bar showing how many of its twelve cells hold something, and a badge saying what kind of thing it holds: name is object, age is object, minutes is float64 and eleven of twelve filled, rating is int64. Five empty dashed boxes lettered A to E wait to be filled in, pointing at the row count, the short filled bar, the object badge on age, the float64 badge on minutes and the object badge on name.</desc>
  <text x="400" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">Label the health report of a table</text>
  <text x="400" y="60" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#55636F" text-anchor="middle">Write one short phrase in each dashed box. Two of the five badges are perfectly fine.</text>

  <!-- leaders first -->
  <line x1="230" y1="87" x2="248" y2="87" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="580" y1="124" x2="598" y2="124" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="580" y1="164" x2="598" y2="164" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="580" y1="204" x2="598" y2="204" stroke="#C42B8C" stroke-width="1.5"/>
  <line x1="395" y1="222" x2="395" y2="296" stroke="#C42B8C" stroke-width="1.5"/>

  <!-- the row-count chip -->
  <rect x="248" y="72" width="120" height="30" rx="8" fill="#DBCEF3" stroke="#6D28D9" stroke-width="3" stroke-linejoin="round"/>
  <text x="308" y="87" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#14202B" text-anchor="middle" dominant-baseline="central">12 rows</text>

  <!-- four column rows -->
  <rect x="240" y="108" width="340" height="152" rx="10" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#C7CDD4" stroke-width="1.5">
    <line x1="240" y1="144" x2="580" y2="144"/>
    <line x1="240" y1="184" x2="580" y2="184"/>
    <line x1="240" y1="224" x2="580" y2="224"/>
  </g>

  <text x="252" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">name</text>
  <text x="252" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">age</text>
  <text x="252" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">minutes</text>
  <text x="252" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" dominant-baseline="central">rating</text>

  <rect x="330" y="116" width="130" height="16" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="330" y="116" width="130" height="16" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="466" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">12/12</text>

  <rect x="330" y="156" width="130" height="16" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="466" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">12/12</text>

  <rect x="330" y="196" width="130" height="16" rx="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="330" y="196" width="119" height="16" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="466" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" dominant-baseline="central">11/12</text>

  <rect x="330" y="236" width="130" height="16" rx="6" fill="#D9EAF9" stroke="#1F6FB2" stroke-width="2" stroke-linejoin="round"/>
  <text x="466" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" dominant-baseline="central">12/12</text>

  <rect x="504" y="112" width="70" height="24" rx="8" fill="#F5F8FA" stroke="#55636F" stroke-width="2" stroke-linejoin="round"/>
  <text x="539" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">object</text>
  <rect x="504" y="152" width="70" height="24" rx="8" fill="#F6AEA6" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <text x="539" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">object</text>
  <rect x="504" y="192" width="70" height="24" rx="8" fill="#E8C671" stroke="#845F00" stroke-width="3" stroke-linejoin="round"/>
  <text x="539" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">float64</text>
  <rect x="504" y="232" width="70" height="24" rx="8" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="2" stroke-linejoin="round"/>
  <text x="539" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle" dominant-baseline="central">int64</text>

  <!-- the five empty boxes -->
  <rect x="30" y="72" width="196" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="22" y="87" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="end" dominant-baseline="central">A</text>

  <rect x="602" y="109" width="176" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="596" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="end" dominant-baseline="central">B</text>

  <rect x="602" y="149" width="176" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="596" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="end" dominant-baseline="central">C</text>

  <rect x="602" y="189" width="176" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="596" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="end" dominant-baseline="central">D</text>

  <rect x="296" y="296" width="196" height="30" rx="8" fill="#FFFFFF" stroke="#C42B8C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <text x="288" y="311" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#C42B8C" text-anchor="end" dominant-baseline="central">E</text>

  <text x="400" y="370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">One badge is wrong because of a word. One is wrong because of a hole.</text>
  <text x="400" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#55636F" text-anchor="middle">And one that says object is exactly right. Say which is which.</text>
</svg>
