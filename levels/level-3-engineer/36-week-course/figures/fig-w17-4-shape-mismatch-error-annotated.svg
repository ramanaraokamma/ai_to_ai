<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>A shape mismatch names both numbers</title>
  <desc>A console panel outlined in red shows a six line Python traceback. The line that failed, Z1 equals X at W1 plus b1, is highlighted and arrowed, and the last three lines, printed in red, are a ValueError ending in size 3 is different from 2. A panel underneath explains that X is 4 by 2 while W1 was built as 3 by 2, so 2 is set against 3 and they do not match. The fix panel says W1 must be 2 by 3, inputs first and units second, and then 4 by 2 times 2 by 3 gives 4 by 3.</desc>
  <text x="400" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#14202B" text-anchor="middle">A shape mismatch names both numbers</text>
  <path d="M40 92 A10 10 0 0 1 50 82 H414 A10 10 0 0 1 424 92 V112 H40 Z" fill="#F6AEA6"/>
  <g stroke="#CC2B1D" stroke-width="2.5" stroke-linecap="round"><line x1="54" y1="92" x2="64" y2="102"/><line x1="64" y1="92" x2="54" y2="102"/></g>
  <text x="76" y="101" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">Traceback</text>
  <line x1="40" y1="112" x2="424" y2="112" stroke="#14202B" stroke-width="2"/>
  <rect x="50" y="160" width="364" height="22" rx="4" fill="#F6AEA6" stroke="none" stroke-width="0" stroke-linejoin="round"/>
  <text x="54" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">Traceback (most recent call last):</text>
  <text x="54" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#55636F">  File &quot;forward.py&quot;, line 9, in &lt;module&gt;</text>
  <text x="54" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B">    Z1 = X @ W1 + b1</text>
  <text x="54" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">ValueError: matmul: Input operand 1</text>
  <text x="54" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">has a mismatch in its core dimension</text>
  <text x="54" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CC2B1D" font-weight="600">0 ... (size 3 is different from 2)</text>
  <rect x="40" y="82" width="384" height="178" rx="10" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linejoin="round"/>
  <line x1="500" y1="172" x2="432" y2="172" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(432 172) rotate(180.0)"/>
  <text x="506" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the line that stopped</text>
  <text x="506" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">the two numbers</text>
  <text x="506" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B">that disagree</text>
  <line x1="560" y1="232" x2="430" y2="238" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round"/><polyline points="-11,-7 0,0 -11,7" fill="none" stroke="#CC2B1D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(430 238) rotate(177.4)"/>
  <rect x="40" y="278" width="340" height="96" rx="12" fill="#F5F8FA" stroke="#C7CDD4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="210" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">what the two numbers are</text>
  <line x1="52" y1="310" x2="368" y2="310" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="210" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#14202B" text-anchor="middle">X is (4, 2)  &#183;  W1 was built as (3, 2)</text>
  <text x="210" y="356" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CC2B1D" text-anchor="middle">2 against 3  &#8212;  they do not match</text>
  <rect x="420" y="278" width="360" height="96" rx="12" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
  <text x="600" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">the fix</text>
  <line x1="432" y1="310" x2="768" y2="310" stroke="#C7CDD4" stroke-width="1.5" stroke-linecap="round"/>
  <text x="600" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14202B" text-anchor="middle">W1 must be (2, 3): inputs first, units second</text>
  <text x="600" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1B7A4B" text-anchor="middle">then (4, 2) &#215; (2, 3) = (4, 3)</text>
</svg>
