<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img">
  <title>The next-word table for a 24-word corpus</title>
  <desc>A four-column tally table: current word, next word, count, out of. The word the was followed seven times: dog twice, park twice, cat twice, bone once. Dog was followed twice: ran once, ate once. Cat was followed twice: ran once, sat once. A full stop was followed three times, always by the. A note says count divided by out of gives how likely the model is to pick that word.</desc>
