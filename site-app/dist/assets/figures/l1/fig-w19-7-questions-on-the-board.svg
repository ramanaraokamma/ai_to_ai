<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>The test with the answers on the board</title>
  <desc>On the left a board shows three questions. An arrow leads to an answer sheet on the right with three ticks and the score three out of three. A thought bubble underneath asks what that score actually measured.</desc>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="400" y="40" font-size="24" fill="#14202B" text-anchor="middle">The test with the answers on the board</text>

    <rect x="40" y="72" width="330" height="180" rx="12" fill="#F5F8FA" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    <text x="205" y="102" font-size="14" fill="#55636F" text-anchor="middle">WRITTEN ON THE BOARD</text>
    <g font-size="18" fill="#14202B">
      <text x="72" y="140">1.  7 x 8 = ?</text>
      <text x="72" y="176">2.  Capital of France?</text>
      <text x="72" y="212">3.  Spell "rhythm"</text>
    </g>

    <g transform="translate(384,140) scale(0.44)">
      <line x1="6" y1="20" x2="84" y2="20" stroke="#14202B" stroke-width="3" stroke-linecap="round"/>
      <polyline points="76,10 92,20 76,30" fill="none" stroke="#14202B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="405" y="128" font-size="12" fill="#55636F" text-anchor="middle">then asked</text>
    <text x="405" y="182" font-size="12" fill="#55636F" text-anchor="middle">the same three</text>

    <rect x="440" y="72" width="320" height="180" rx="12" fill="#FFFFFF" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="600" y="102" font-size="14" fill="#55636F" text-anchor="middle">MY ANSWER SHEET</text>
    <g stroke="#1B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="474,136 484,148 506,122"/>
      <polyline points="474,172 484,184 506,158"/>
      <polyline points="474,208 484,220 506,194"/>
    </g>
    <g font-size="18" fill="#14202B">
      <text x="524" y="142">56</text>
      <text x="524" y="178">Paris</text>
      <text x="524" y="214">r-h-y-t-h-m</text>
    </g>
    <rect x="646" y="112" width="96" height="120" rx="10" fill="#E2F7ED" stroke="#1B7A4B" stroke-width="3" stroke-linejoin="round"/>
    <text x="694" y="160" font-size="24" fill="#14202B" text-anchor="middle">3/3</text>
    <text x="694" y="196" font-size="12" fill="#55636F" text-anchor="middle">full marks</text>

    <g transform="translate(60,262) scale(0.9)">
      <circle cx="22" cy="88" r="5" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
      <circle cx="34" cy="76" r="7" fill="#FFFFFF" stroke="#14202B" stroke-width="2.5"/>
      <path d="M40 66 C24 66 18 50 30 43 C24 27 44 16 56 25 C64 10 92 14 92 31 C108 34 106 58 90 60 C86 70 64 72 56 66 Z"
            fill="#FFFFFF" stroke="#14202B" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="230" y="296" font-size="18" fill="#14202B">So how good am I at maths, geography and spelling?</text>
    <text x="230" y="322" font-size="18" fill="#CC2B1D">Nobody can tell. Not even me.</text>

    <text x="400" y="372" font-size="14" fill="#55636F" text-anchor="middle">A score only means something if the questions were hidden first.</text>
  </g>
</svg>
